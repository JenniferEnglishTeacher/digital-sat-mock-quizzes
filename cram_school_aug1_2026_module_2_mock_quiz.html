  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "original": "The War of 1812 has ______ place in historical memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it essentially maintained the geopolitical status quo for Britain: the country neither gained nor lost significant territory or position as a result of its participation in the war.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "generated": [{"id": "1.1", "text": "The 1904 city referendum has ______ place in local memory, partly because it is overshadowed by the far larger municipal reforms passed the following decade and partly because it essentially changed nothing about how the city was governed: the vote neither expanded nor restricted any existing office's authority.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "answer": "A", "explanation": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial."}, {"id": "1.2", "text": "The minor treaty of 1873 has ______ place in diplomatic history, partly because it is overshadowed by the much larger peace settlement signed only two years later and partly because it essentially preserved the prewar borders: neither side gained nor ceded any meaningful territory as a result.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "answer": "A", "explanation": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial."}, {"id": "1.3", "text": "The band's 1998 farewell tour has ______ place in music history, partly because it is overshadowed by the group's far more celebrated reunion a decade later and partly because it essentially changed nothing about the band's standing: their record sales and public profile remained about the same afterward.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "answer": "A", "explanation": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial."}, {"id": "1.4", "text": "The 1962 merger between the two small shipping companies has ______ place in business history, partly because it is overshadowed by the much larger industry consolidation that followed in the 1970s and partly because it essentially preserved each company's original routes: neither firm expanded nor lost any of its existing shipping lanes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "answer": "A", "explanation": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial."}, {"id": "1.5", "text": "The senator's first term has ______ place in the state's political history, partly because it is overshadowed by the far more consequential term that followed and partly because it essentially maintained the legislative status quo: no major law was passed or repealed as a result of her time in office.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "answer": "A", "explanation": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial."}]}, {"n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "original": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris's repudiation of industrialization is ______ the Kelmscott editions' use of handmade materials and intricate ornamentation reminiscent of medieval manuscripts; these meticulously handcrafted elements exemplify the artistry involved.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "generated": [{"id": "2.1", "text": "In 1925, architect Elin Karlsson designed a house entirely without electrical wiring. Historians argue that Karlsson's rejection of modern conveniences is ______ the house's reliance on skylights, thick stone walls, and hand-cranked ventilation shafts; these deliberately old-fashioned elements exemplify her design philosophy.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "answer": "B", "explanation": "The listed design features are where Karlsson's rejection of convenience is expressed, calling for \"manifest in.\""}, {"id": "2.2", "text": "In 1978, chef Antoine Rousseau opened a restaurant that refused to use any imported ingredients. Critics argue that Rousseau's rejection of global trade is ______ the menu's exclusive reliance on produce grown within fifty kilometers of the restaurant; these locally sourced dishes exemplify his culinary philosophy.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "answer": "B", "explanation": "The menu's local sourcing is where Rousseau's rejection of global trade is expressed, calling for \"manifest in.\""}, {"id": "2.3", "text": "In 1932, typographer Ilse Brandt designed a typeface intended to reject the ornate lettering styles then popular in advertising. Design historians argue that Brandt's rejection of decorative excess is ______ the typeface's stark, uniform strokes and complete absence of serifs; these austere features exemplify her design principles.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "answer": "B", "explanation": "The typeface's stark features are where Brandt's rejection of ornament is expressed, calling for \"manifest in.\""}, {"id": "2.4", "text": "In 1955, urban planner Rafael Duarte proposed a neighborhood built entirely around pedestrian paths rather than roads. Planning historians argue that Duarte's rejection of car-centered design is ______ the neighborhood's narrow walkways and complete absence of parking lots; these deliberate choices exemplify his planning philosophy.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "answer": "B", "explanation": "The neighborhood's design choices are where Duarte's rejection of car-centered planning is expressed, calling for \"manifest in.\""}, {"id": "2.5", "text": "In 1969, potter Naomi Fielding began firing her ceramics using only wood-burning kilns she built herself. Craft historians argue that Fielding's rejection of industrial manufacturing is ______ the uneven glazes and irregular shapes of her finished pieces; these imperfect qualities exemplify her artistic values.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "answer": "B", "explanation": "The pieces' uneven qualities are where Fielding's rejection of industrial manufacturing is expressed, calling for \"manifest in.\""}]}, {"n": 3, "concept": "Words in Context: choose a verb meaning to correct a long-standing imbalance.", "original": "______ the long-standing trend of overemphasizing teenagers and young adults in research on social media use, scholars have recently begun to expand their focus to include the fastest-growing cohort of social media users: senior citizens.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "generated": [{"id": "3.1", "text": "______ the long-standing trend of overemphasizing urban neighborhoods in studies of public transit use, transportation researchers have recently begun to expand their focus to include the fastest-growing group of transit riders: residents of small rural towns.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "answer": "B", "explanation": "Expanding focus to a neglected group corrects an imbalance, calling for \"Redressing.\""}, {"id": "3.2", "text": "______ the long-standing trend of overemphasizing large predators in wildlife conservation funding, ecologists have recently begun to expand their focus to include the fastest-declining group of species: freshwater insects.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "answer": "B", "explanation": "Expanding focus to a neglected group corrects an imbalance, calling for \"Redressing.\""}, {"id": "3.3", "text": "______ the long-standing trend of overemphasizing male athletes in sports medicine research, physiologists have recently begun to expand their focus to include the fastest-growing group of competitive athletes: women over the age of forty.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "answer": "B", "explanation": "Expanding focus to a neglected group corrects an imbalance, calling for \"Redressing.\""}, {"id": "3.4", "text": "______ the long-standing trend of overemphasizing well-known composers in music history courses, musicologists have recently begun to expand their focus to include the fastest-growing area of scholarly interest: anonymous folk compositions.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "answer": "B", "explanation": "Expanding focus to a neglected area corrects an imbalance, calling for \"Redressing.\""}, {"id": "3.5", "text": "______ the long-standing trend of overemphasizing coastal cities in climate adaptation planning, policy researchers have recently begun to expand their focus to include the fastest-growing group of at-risk communities: inland floodplain towns.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "answer": "B", "explanation": "Expanding focus to a neglected group corrects an imbalance, calling for \"Redressing.\""}]}, {"n": 4, "concept": "Words in Context: identify the meaning of a word used to describe obstacles providing resistance to forward movement.", "original": "The following text is adapted from James Baldwin's 1956 novel Giovanni's Room. The narrator is riding in a taxi down a street lined with food vendors and shoppers in Paris, France.\n\nThe multitude of Paris seems to be dressed in blue every day but Sunday, when, for the most part, they put on an unbelievably festive black. Here they were now, in blue, disputing, every inch, our passage, with their wagons, handtrucks, their bursting baskets carried at an angle steeply self-confident on the back.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "generated": [{"id": "4.1", "text": "The following text is adapted from a novel. The narrator is walking through a crowded market street at dusk. Carts, crates, and the last stragglers of the evening crowd were disputing every inch of our path, each unwilling to yield the narrow lane before finishing whatever business had kept them there.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "answer": "D", "explanation": "The crowd physically blocks the narrator's path, so \"disputing\" means providing resistance to."}, {"id": "4.2", "text": "The following text is adapted from a novel. The narrator is trying to cross a flooded field after a storm. Fallen branches and tangled undergrowth were disputing every step forward, each obstacle demanding to be climbed over or pushed aside before the next could even be seen.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "answer": "D", "explanation": "The obstacles physically block forward movement, so \"disputing\" means providing resistance to."}, {"id": "4.3", "text": "The following text is adapted from a memoir. The narrator is pushing through a crowded subway platform during rush hour. Shoulders, bags, and elbows were disputing every foot of space, and by the time I reached the stairs my coat had been pulled nearly off one arm.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "answer": "D", "explanation": "The crowd physically blocks the narrator's movement, so \"disputing\" means providing resistance to."}, {"id": "4.4", "text": "The following text is adapted from a short story. The narrator is climbing a steep, overgrown trail at midday. Roots, loose stones, and thick vines were disputing every stride uphill, so that what should have been an hour's walk stretched into most of the afternoon.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "answer": "D", "explanation": "The terrain physically slows the climb, so \"disputing\" means providing resistance to."}, {"id": "4.5", "text": "The following text is adapted from a novel. The narrator is wading through a crowded harbor market at midday. Baskets, coiled ropes, and idle fishermen were disputing every step toward the dock, and I had to turn sideways more than once just to keep moving forward.\n\nAs used in the text, what does the word disputing most nearly mean?\n\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "answer": "D", "explanation": "The crowd and obstacles physically block the narrator's path, so \"disputing\" means providing resistance to."}]}, {"n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "original": "On painter William H. Johnson's return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist's subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way. Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Johnson's artistic career.\nB) It provides information about Johnson's travels in support of a claim about his artistic influences, which is advanced in the following sentence.\nC) It recounts a moment in Johnson's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Johnson's artistic development.", "generated": [{"id": "5.1", "text": "On composer Ingrid Falk's return to Norway in 1952 after years abroad, her musical style underwent an abrupt transformation. Turning away from the dense orchestral scores she had written throughout the 1940s, Falk began composing sparse chamber pieces built around long silences and single sustained notes. Evocative of Norwegian folk fiddle traditions and the natural acoustics of fjord landscapes, these pieces feature minimal instrumentation and deliberately unresolved harmonies.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Falk's musical career.\nB) It provides information about Falk's travels in support of a claim about her musical influences, which is advanced in the following sentence.\nC) It recounts a moment in Falk's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Falk's musical development.", "answer": "A", "explanation": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence."}, {"id": "5.2", "text": "Upon novelist Teodor Basescu's release from a decade in political exile in 1987, his writing style underwent an abrupt transformation. Turning away from the dense, allegorical prose he had published before his exile, Basescu began writing spare, plainly narrated short stories centered on ordinary daily routines. Evocative of oral storytelling traditions and postwar minimalist fiction, these stories feature unadorned sentences and almost no figurative language.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Basescu's literary career.\nB) It provides information about Basescu's exile in support of a claim about his literary influences, which is advanced in the following sentence.\nC) It recounts a moment in Basescu's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Basescu's literary development.", "answer": "A", "explanation": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence."}, {"id": "5.3", "text": "After designer Naomi Achterberg relocated her studio from Paris to Lagos in 1975, her design style underwent an abrupt transformation. Turning away from the closely tailored, monochrome silhouettes she had built her early reputation on, Achterberg began designing loose, brightly patterned garments cut from hand-dyed cotton. Evocative of regional textile traditions and the bright light of the West African coast, these garments feature bold geometric prints and asymmetrical draping.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Achterberg's design career.\nB) It provides information about Achterberg's relocation in support of a claim about her design influences, which is advanced in the following sentence.\nC) It recounts a moment in Achterberg's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Achterberg's design development.", "answer": "A", "explanation": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence."}, {"id": "5.4", "text": "Following director Hassan Idrissi's return to Morocco in 1968 after film school abroad, his directing style underwent an abrupt transformation. Turning away from the tightly scripted, dialogue-heavy films he had made as a student, Idrissi began directing loosely structured films built around long, unscripted takes of everyday street life. Evocative of Italian neorealism and traditional Moroccan storytelling, these films feature nonprofessional actors and minimal editing.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Idrissi's directing career.\nB) It provides information about Idrissi's film schooling in support of a claim about his directing influences, which is advanced in the following sentence.\nC) It recounts a moment in Idrissi's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Idrissi's directing development.", "answer": "A", "explanation": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence."}, {"id": "5.5", "text": "After potter Junko Aoyama took over her family's workshop in 1990, her ceramic style underwent an abrupt transformation. Turning away from the delicately painted porcelain her family had produced for generations, Aoyama began firing rough, unglazed stoneware left deliberately asymmetrical. Evocative of centuries-old wabi-sabi aesthetics and the coastal clay of her hometown, these pieces feature visible cracks and uneven surfaces left exposed rather than smoothed away.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It elaborates on the previous sentence's statement about a transitional moment in Aoyama's ceramic career.\nB) It provides information about Aoyama's family workshop in support of a claim about her ceramic influences, which is advanced in the following sentence.\nC) It recounts a moment in Aoyama's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Aoyama's ceramic development.", "answer": "A", "explanation": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence."}]}, {"n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "original": "Scholarly accounts of the Chicano movement—a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s—tend to focus on the most militant, outspoken figures in the movement, making it seem uniformly radical. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in comparatively low-profile neighborhood institutions and projects, we see participants espousing an array of political orientations and approaches to community activism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the Chicano movement that the text claims has been reevaluated by researchers in light of Herrera's work on the movement's participants.\nB) It identifies an aspect of the Chicano movement that the text implies was overemphasized by scholars due to their own political orientations.\nC) It describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement's participants.\nD) It summarizes the conventional method for analyzing the Chicano movement, which the text suggests creates a misleading impression of the effectiveness of neighborhood institutions and projects.", "generated": [{"id": "6.1", "text": "Standard accounts of the guild movement in medieval textile towns tend to focus on the wealthiest master weavers, making the guilds seem uniformly prosperous. Economic historian Ana Beltran has shown, however, that if we shift focus toward the far more numerous apprentice and journeyman weavers, we see participants facing a wide range of economic circumstances, from comfortable stability to persistent hardship.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the guild movement that the text claims has been reevaluated by researchers in light of Beltran's work on the guilds' members.\nB) It identifies an aspect of the guild movement that the text implies was overemphasized by scholars due to their own economic backgrounds.\nC) It describes a common approach to studying the guild movement that, according to the text, obscures the range of economic circumstances among its members.\nD) It summarizes the conventional method for analyzing the guild movement, which the text suggests creates a misleading impression of the effectiveness of apprenticeship programs.", "answer": "C", "explanation": "The underlined portion names the standard scholarly focus that Beltran's work shows obscures real economic diversity."}, {"id": "6.2", "text": "Standard accounts of the abolitionist movement in a particular state tend to focus on its most prominent public speakers, making the movement seem uniformly confrontational in its tactics. Historian Marcus DeWitt has shown, however, that if we shift focus toward the movement's local church-based and neighborhood organizing efforts, we see participants employing a wide range of strategies, from quiet fundraising to direct legal challenges.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the abolitionist movement that the text claims has been reevaluated by researchers in light of DeWitt's work on the movement's participants.\nB) It identifies an aspect of the abolitionist movement that the text implies was overemphasized by scholars due to their own political views.\nC) It describes a common approach to studying the abolitionist movement that, according to the text, obscures the range of strategies used by its participants.\nD) It summarizes the conventional method for analyzing the abolitionist movement, which the text suggests creates a misleading impression of the effectiveness of local organizing.", "answer": "C", "explanation": "The underlined portion names the standard scholarly focus that DeWitt's work shows obscures real strategic diversity."}, {"id": "6.3", "text": "Standard accounts of the early environmental movement tend to focus on its national lobbying organizations, making the movement seem uniformly focused on federal legislation. Sociologist Priya Ramaswamy has shown, however, that if we shift focus toward small, community-led conservation projects of the same period, we see participants pursuing a wide range of goals, from local land trusts to neighborhood recycling programs.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the environmental movement that the text claims has been reevaluated by researchers in light of Ramaswamy's work on the movement's participants.\nB) It identifies an aspect of the environmental movement that the text implies was overemphasized by scholars due to their own institutional affiliations.\nC) It describes a common approach to studying the environmental movement that, according to the text, obscures the range of goals pursued by its participants.\nD) It summarizes the conventional method for analyzing the environmental movement, which the text suggests creates a misleading impression of the effectiveness of national lobbying.", "answer": "C", "explanation": "The underlined portion names the standard scholarly focus that Ramaswamy's work shows obscures real diversity of goals."}, {"id": "6.4", "text": "Standard accounts of the early computer hobbyist movement tend to focus on a handful of well-known garage inventors, making the movement seem uniformly oriented toward commercial success. Historian Wei Chen has shown, however, that if we shift focus toward the many small hobbyist clubs that met in libraries and community centers, we see participants pursuing a wide range of motivations, from pure curiosity to educational outreach.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the computer hobbyist movement that the text claims has been reevaluated by researchers in light of Chen's work on the movement's participants.\nB) It identifies an aspect of the computer hobbyist movement that the text implies was overemphasized by scholars due to their own professional backgrounds.\nC) It describes a common approach to studying the computer hobbyist movement that, according to the text, obscures the range of motivations among its participants.\nD) It summarizes the conventional method for analyzing the computer hobbyist movement, which the text suggests creates a misleading impression of the effectiveness of garage inventors.", "answer": "C", "explanation": "The underlined portion names the standard scholarly focus that Chen's work shows obscures real diversity of motivation."}, {"id": "6.5", "text": "Standard accounts of the settlement house movement tend to focus on its most famous founders, making the movement seem uniformly shaped by a single reform philosophy. Historian Odalys Ferreira has shown, however, that if we shift focus toward the day-to-day staff who ran individual settlement houses, we see participants adopting a wide range of approaches, from strict vocational training to loosely structured community gatherings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It presents a trend in scholarship on the settlement house movement that the text claims has been reevaluated by researchers in light of Ferreira's work on the movement's participants.\nB) It identifies an aspect of the settlement house movement that the text implies was overemphasized by scholars due to their own class backgrounds.\nC) It describes a common approach to studying the settlement house movement that, according to the text, obscures the range of approaches among its participants.\nD) It summarizes the conventional method for analyzing the settlement house movement, which the text suggests creates a misleading impression of the effectiveness of a single reform philosophy.", "answer": "C", "explanation": "The underlined portion names the standard scholarly focus that Ferreira's work shows obscures real diversity of approach."}]}, {"n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "original": "Since its completion in 2014, Bosco Verticale (Vertical Forest)—a pair of residential towers in Milan, Italy, covered by vegetation—has become a striking symbol of environmental sustainability in architecture. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it's too early to tell if they can thrive in this unusual setting.\n\nAccording to the text, why are some critics skeptical of the concept behind Bosco Verticale?\n\nA) Some essential aspects of Bosco Verticale's design are difficult to adapt to locations other than Milan.\nB) The plant life on Bosco Verticale ended up being less varied than Boeri had envisioned it would be.\nC) The construction of Bosco Verticale was no less environmentally damaging than the construction of more conventional buildings is.\nD) It is unclear whether Bosco Verticale can support the plant life included in its design.", "generated": [{"id": "7.1", "text": "Since its unveiling in 2019, the Solaris Canopy—a shading structure over a public plaza in Doha covered in photovoltaic-embedded fabric—has become a widely cited example of climate-adaptive architecture. Designer Farah Haddad intended the fabric, which generates electricity while blocking direct sun, to serve as a model for hot-climate public spaces. However, the concept has faced skepticism: critics note that although the fabric was specifically engineered for this installation, it's too early to tell if it can maintain its electrical output after years of exposure to blowing sand and extreme heat.\n\nAccording to the text, why are some critics skeptical of the concept behind the Solaris Canopy?\n\nA) Some essential aspects of the Solaris Canopy's design are difficult to adapt to locations other than Doha.\nB) The fabric used in the Solaris Canopy generates less electricity than Haddad had originally envisioned.\nC) The construction of the Solaris Canopy required more resources than the construction of conventional shading structures.\nD) It is unclear whether the fabric can maintain its performance under the installation's specific long-term conditions.", "answer": "D", "explanation": "The text says it is too early to know if the fabric will hold up over time, so the outcome is uncertain."}, {"id": "7.2", "text": "Since its completion in 2016, the Living Seawall—a stretch of artificial reef panels installed along a harbor in Sydney—has become a frequently cited example of urban marine restoration. Engineer Devika Nair intended the textured panels, designed to mimic natural rock crevices, to serve as a model for restoring marine life along developed coastlines. However, the concept has faced skepticism: critics note that although the panels were specifically molded for this harbor, it's too early to tell if the marine species they attract can establish a stable, self-sustaining population there.\n\nAccording to the text, why are some critics skeptical of the concept behind the Living Seawall?\n\nA) Some essential aspects of the Living Seawall's design are difficult to adapt to harbors other than Sydney's.\nB) The panels used in the Living Seawall attracted fewer species than Nair had originally envisioned.\nC) The construction of the Living Seawall was no less disruptive to marine life than conventional seawall construction.\nD) It is unclear whether the attracted marine species can establish a lasting, self-sustaining population there.", "answer": "D", "explanation": "The text says it is too early to know if the species will establish a stable population, so the outcome is uncertain."}, {"id": "7.3", "text": "Since its planting in 2018, the Whispering Grove—a stand of genetically modified drought-resistant oaks planted along a highway outside Phoenix—has become a frequently cited example of climate-resilient urban forestry. Horticulturalist Marco Silva intended the trees, engineered to require minimal irrigation, to serve as a model for greening arid roadways. However, the concept has faced skepticism: critics note that although the trees were specifically bred for this climate, it's too early to tell if their root systems can remain stable in the compacted soil found along most highway corridors.\n\nAccording to the text, why are some critics skeptical of the concept behind the Whispering Grove?\n\nA) Some essential aspects of the Whispering Grove's design are difficult to adapt to climates other than Phoenix's.\nB) The trees used in the Whispering Grove required more irrigation than Silva had originally envisioned.\nC) The planting of the Whispering Grove was no less costly than planting conventional highway trees.\nD) It is unclear whether the trees' root systems can remain stable in the compacted soil found along highway corridors.", "answer": "D", "explanation": "The text says it is too early to know if the roots will remain stable, so the outcome is uncertain."}, {"id": "7.4", "text": "Since its launch in 2021, the Tidal Lantern—a string of buoy-mounted turbines generating power from wave motion off the coast of Cornwall—has become a frequently cited example of small-scale marine energy. Engineer Bryn Talbot intended the buoys, designed to flex with passing waves, to serve as a model for coastal renewable energy. However, the concept has faced skepticism: critics note that although the buoys were specifically built for this stretch of coastline, it's too early to tell if their moving parts can withstand years of continuous storm exposure.\n\nAccording to the text, why are some critics skeptical of the concept behind the Tidal Lantern?\n\nA) Some essential aspects of the Tidal Lantern's design are difficult to adapt to coastlines other than Cornwall's.\nB) The buoys used in the Tidal Lantern generated less power than Talbot had originally envisioned.\nC) The construction of the Tidal Lantern was no less disruptive to marine traffic than conventional turbine installations.\nD) It is unclear whether the buoys' moving parts can withstand years of continuous storm exposure.", "answer": "D", "explanation": "The text says it is too early to know if the parts will withstand storms, so the outcome is uncertain."}, {"id": "7.5", "text": "Since its opening in 2020, the Hollow Spire—a residential tower in Rotterdam built around a central column of vertical gardens—has become a frequently cited example of biophilic urban design. Architect Lotte Bakker intended the column, irrigated by recycled greywater, to serve as a model for integrating greenery into dense housing. However, the concept has faced skepticism: critics note that although the plants were specifically selected for this system, it's too early to tell if the greywater irrigation can reliably support them through the building's coldest winters.\n\nAccording to the text, why are some critics skeptical of the concept behind the Hollow Spire?\n\nA) Some essential aspects of the Hollow Spire's design are difficult to adapt to buildings other than residential towers.\nB) The plants used in the Hollow Spire required less water than Bakker had originally envisioned.\nC) The construction of the Hollow Spire was no less costly than the construction of conventional residential towers.\nD) It is unclear whether the greywater irrigation can reliably support the plants through the building's coldest winters.", "answer": "D", "explanation": "The text says it is too early to know if irrigation will support the plants through winter, so the outcome is uncertain."}]}, {"n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "original": "Elizabeth Asiedu has identified a negative correlation between the share of developing countries' economies derived from natural-resource extraction and those countries' receipts of foreign investment. This may appear counterintuitive—resource extraction requires initial investments (in extractive technology, for instance) at scales best met by multinational corporations—but Asiedu notes that natural-resource industries' boom-bust cycle can destabilize local currencies and increase developing countries' vulnerability to external shocks, creating levels of uncertainty to which foreign investors are typically averse.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that foreign investment declines in developing countries as natural-resource extraction makes up a larger share of those countries' economies, that decline happens because resource extraction requires initial investments too large for foreign investors to supply.\nB) Although developing countries tend to become less dependent on foreign investment as natural-resource industries make up a larger share of their economies, this change may not occur if the boom-bust cycle of those industries destabilizes local currencies or increases countries' vulnerability to external shocks.\nC) Although one might expect that foreign investment would increase as natural-resource extraction makes up a larger share of developing countries' economies, the opposite happens because heavy reliance on natural resources can lead to unattractive conditions for investors.\nD) Although foreign investors tend to avoid initial investments in natural-resource industries in developing countries, foreign investment may increase significantly as those industries stabilize and the risks associated with them decline.", "generated": [{"id": "8.1", "text": "Camille Duval has identified a negative correlation between the proportion of a city's downtown occupied by short-term vacation rentals and that city's long-term small-business survival rate. This may appear counterintuitive—vacation rentals bring a steady stream of visitors who might be expected to support local shops—but Duval notes that the resulting spikes in rent, driven by property owners converting long-term leases into short-term rentals, price out the very small businesses that once served longtime residents, creating a less stable customer base overall.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that small-business survival declines in cities with more short-term rentals, that decline happens because rental owners avoid renting to businesses that serve tourists.\nB) Although downtown neighborhoods tend to become less dependent on tourism as vacation rentals increase, this change may not occur if rent increases displace long-term residents.\nC) Although one might expect small-business survival to increase as vacation rentals bring more visitors downtown, the opposite happens because rising rents driven by those rentals price out small businesses and destabilize their customer base.\nD) Although vacation rental owners tend to avoid converting properties in areas with strong small-business districts, conversions may increase significantly as those districts decline and rents fall.", "answer": "C", "explanation": "Choice C states the counterintuitive relationship and the mechanism (rising rents) that explains it."}, {"id": "8.2", "text": "Tomasz Wieczorek has identified a negative correlation between the share of a country's electricity generated from a newly built dam and that country's electricity price stability in the years immediately following construction. This may appear counterintuitive—large dams are often expected to provide cheap, stable power—but Wieczorek notes that the debt taken on to finance construction, combined with unpredictable rainfall affecting output, can make electricity prices more volatile rather than less, at least until the debt is paid down.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that electricity prices become less stable after a large dam is built, that instability happens because dam operators intentionally raise prices to recover construction costs.\nB) Although countries tend to become less reliant on imported electricity as dam-generated power increases, this change may not occur if rainfall patterns shift unpredictably.\nC) Although one might expect electricity prices to become more stable as a new dam comes online, the opposite happens because construction debt and unpredictable rainfall can make prices more volatile instead.\nD) Although dam financiers tend to avoid funding projects in countries with unstable electricity prices, financing may increase significantly as those countries' rainfall patterns become more predictable.", "answer": "C", "explanation": "Choice C states the counterintuitive relationship and the mechanism (debt and rainfall variability) that explains it."}, {"id": "8.3", "text": "Aisha Bello has identified a negative correlation between the number of self-checkout kiosks a grocery chain installs and that chain's overall customer satisfaction scores in the following year. This may appear counterintuitive—self-checkout is often expected to reduce wait times and improve the shopping experience—but Bello notes that the resulting reduction in staffed checkout lanes can leave customers with complex purchases or technical problems with no easy source of help, lowering satisfaction overall.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that customer satisfaction falls as self-checkout kiosks increase, that decline happens because kiosks are more expensive for stores to maintain than staffed lanes.\nB) Although grocery chains tend to become less reliant on staffed checkout lanes as kiosks increase, this change may not occur if customers resist using the new technology.\nC) Although one might expect customer satisfaction to rise as self-checkout kiosks reduce wait times, the opposite happens because fewer staffed lanes leave customers without help for complex purchases or technical issues.\nD) Although grocery chains tend to avoid installing kiosks in stores with high customer satisfaction, installation may increase significantly as satisfaction scores in those stores decline.", "answer": "C", "explanation": "Choice C states the counterintuitive relationship and the mechanism (fewer staffed lanes) that explains it."}, {"id": "8.4", "text": "Ravi Chandrasekaran has identified a negative correlation between the number of budget-priced streaming platforms a household subscribes to and that household's reported satisfaction with its overall entertainment options. This may appear counterintuitive—more platforms are often expected to mean more content and greater choice—but Chandrasekaran notes that the resulting need to track multiple libraries, prices, and interfaces can create decision fatigue that leaves households feeling less satisfied rather than more.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that entertainment satisfaction falls as streaming subscriptions increase, that decline happens because platforms deliberately limit content to encourage additional subscriptions.\nB) Although households tend to become less selective about content as streaming subscriptions increase, this change may not occur if a household cancels unused subscriptions.\nC) Although one might expect entertainment satisfaction to rise as more streaming platforms offer more choice, the opposite happens because tracking multiple libraries and interfaces creates decision fatigue that lowers satisfaction.\nD) Although streaming platforms tend to avoid targeting households with several existing subscriptions, targeting may increase significantly as those households' satisfaction with existing platforms declines.", "answer": "C", "explanation": "Choice C states the counterintuitive relationship and the mechanism (decision fatigue) that explains it."}, {"id": "8.5", "text": "Helena Kowalczyk has identified a negative correlation between the number of open-plan seating areas a company adds to its office and that company's employee-reported focus and productivity. This may appear counterintuitive—open floor plans are often expected to boost collaboration and efficiency—but Kowalczyk notes that the resulting rise in ambient noise and visual distraction can make sustained concentration more difficult, lowering measured productivity rather than raising it.\n\nWhich choice best states the main idea of the text?\n\nA) Although it may seem surprising that productivity falls as open-plan seating increases, that decline happens because companies use open plans mainly to reduce office space costs.\nB) Although companies tend to become less collaborative as open-plan seating increases, this change may not occur if employees are given noise-canceling headphones.\nC) Although one might expect productivity to rise as open-plan seating boosts collaboration, the opposite happens because increased noise and visual distraction make sustained concentration more difficult.\nD) Although companies tend to avoid adding open-plan seating in departments with high existing productivity, additions may increase significantly as those departments' productivity declines.", "answer": "C", "explanation": "Choice C states the counterintuitive relationship and the mechanism (noise and distraction) that explains it."}]}, {"n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "original": "Some astronomers searching for extraterrestrial life have proposed that atmospheric NH3 (ammonia) can serve as a biosignature gas—an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH3 likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini-Neptunes—gas planets smaller than Neptune but with atmospheres similar to Neptune's—atmospheric pressure and temperature can be high enough to produce atmospheric NH3.\n\nBased on the text, Huang, Seager, and colleagues would most likely agree with which statement about atmospheric NH3?\n\nA) Its presence is more likely to indicate that a planet is a mini-Neptune than that the planet is a rocky planet that could support life.\nB) Its absence from a planet that's not a mini-Neptune indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a mini-Neptune.\nD) It doesn't reliably reach high enough concentrations in the atmospheres of rocky planets or mini-Neptunes to be treated as a biosignature gas.", "generated": [{"id": "9.1", "text": "Some astrobiologists have proposed that atmospheric phosphine can serve as a biosignature gas—an indication that a planet harbors life. Elena Marchetti and colleagues evaluated this possibility, finding that on small rocky planets, atmospheric phosphine likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on gas giants with deep, high-pressure atmospheres, phosphine can form abiotically under extreme temperature and pressure alone.\n\nBased on the text, Marchetti and colleagues would most likely agree with which statement about atmospheric phosphine?\n\nA) Its presence is more likely to indicate that a planet is a gas giant than that the planet is a rocky planet that could support life.\nB) Its absence from a planet that's not a gas giant indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a gas giant.\nD) It doesn't reliably reach high enough concentrations in the atmospheres of rocky planets or gas giants to be treated as a biosignature gas.", "answer": "C", "explanation": "Since phosphine can form without life only on gas giants, it is reliable evidence of life only when found on rocky planets."}, {"id": "9.2", "text": "Some astrobiologists have proposed that atmospheric methyl chloride can serve as a biosignature gas. Dara Osei and colleagues evaluated this possibility, finding that on small rocky planets orbiting quiet stars, atmospheric methyl chloride likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets orbiting highly active, flaring stars, methyl chloride can form abiotically through intense stellar radiation striking the atmosphere.\n\nBased on the text, Osei and colleagues would most likely agree with which statement about atmospheric methyl chloride?\n\nA) Its presence is more likely to indicate that a planet orbits a flaring star than that the planet could support life.\nB) Its absence from a planet orbiting a quiet star indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected around a quiet star but not if detected around a highly active, flaring star.\nD) It doesn't reliably reach high enough concentrations around either quiet or flaring stars to be treated as a biosignature gas.", "answer": "C", "explanation": "Since methyl chloride can form without life only around flaring stars, it is reliable evidence of life only around quiet stars."}, {"id": "9.3", "text": "Some astrobiologists have proposed that atmospheric dimethyl sulfide can serve as a biosignature gas. Jorge Villalobos and colleagues evaluated this possibility, finding that on planets with thin, oxygen-poor atmospheres, atmospheric dimethyl sulfide likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on planets with thick, sulfur-rich volcanic atmospheres, dimethyl sulfide can form abiotically through ongoing volcanic outgassing alone.\n\nBased on the text, Villalobos and colleagues would most likely agree with which statement about atmospheric dimethyl sulfide?\n\nA) Its presence is more likely to indicate that a planet is volcanically active than that the planet could support life.\nB) Its absence from a planet without a sulfur-rich atmosphere indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected in a thin, oxygen-poor atmosphere but not if detected in a thick, sulfur-rich volcanic atmosphere.\nD) It doesn't reliably reach high enough concentrations in either type of atmosphere to be treated as a biosignature gas.", "answer": "C", "explanation": "Since dimethyl sulfide can form without life only in sulfur-rich volcanic atmospheres, it is reliable evidence of life only in oxygen-poor ones."}, {"id": "9.4", "text": "Some astrobiologists have proposed that atmospheric nitrous oxide can serve as a biosignature gas. Priya Deshmukh and colleagues evaluated this possibility, finding that on temperate rocky planets, atmospheric nitrous oxide likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets subjected to frequent large asteroid impacts, nitrous oxide can form abiotically through the intense heat and chemical shock of repeated collisions.\n\nBased on the text, Deshmukh and colleagues would most likely agree with which statement about atmospheric nitrous oxide?\n\nA) Its presence is more likely to indicate that a planet experiences frequent impacts than that the planet could support life.\nB) Its absence from a planet with few impacts indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected on a temperate planet but not if detected on a planet with frequent large impacts.\nD) It doesn't reliably reach high enough concentrations on either type of planet to be treated as a biosignature gas.", "answer": "C", "explanation": "Since nitrous oxide can form without life only on frequently impacted planets, it is reliable evidence of life only on temperate ones."}, {"id": "9.5", "text": "Some astrobiologists have proposed that atmospheric ethane can serve as a biosignature gas. Soren Lindqvist and colleagues evaluated this possibility, finding that on rocky planets with liquid-water oceans, atmospheric ethane likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on icy moons with subsurface methane lakes, ethane can form abiotically through ultraviolet radiation breaking down methane in the upper atmosphere.\n\nBased on the text, Lindqvist and colleagues would most likely agree with which statement about atmospheric ethane?\n\nA) Its presence is more likely to indicate that a body is an icy moon than that the body could support life.\nB) Its absence from an icy moon indicates that the moon probably doesn't have life.\nC) It should be treated as a biosignature gas if detected on a rocky, ocean-bearing planet but not if detected on an icy moon with methane lakes.\nD) It doesn't reliably reach high enough concentrations on either body to be treated as a biosignature gas.", "answer": "C", "explanation": "Since ethane can form without life only on icy moons with methane lakes, it is reliable evidence of life only on ocean-bearing rocky planets."}]}, {"n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "original": "Under normal atmospheric pressure at Earth's surface, water molecules form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water's structure, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to hypothesize that TMAO reduces water's compressibility.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Water molecules are found to be impervious to TMAO even when the water molecules' tetrahedral configuration has been distorted by high pressure.\nB) Examination of TMAO's molecular structure shows that TMAO molecules retain their shape even as pressure increases.\nC) A positive correlation is found between concentrations of TMAO and the rate at which water's molecular structure compresses as pressure increases.\nD) Analysis of water's molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not.", "generated": [{"id": "12.1", "text": "Under normal atmospheric pressure, cell membranes maintain a flexible, semi-fluid lipid structure. Extreme cold, such as found in polar waters, rigidifies this structure and can impair nutrient transport across the membrane; yet cold-adapted fish have evolved to survive these temperatures. Studies have found a positive correlation between the depths at which various cold-adapted fish live and concentrations of unsaturated fatty acids in their cell membranes, leading a team of researchers to hypothesize that these fatty acids reduce the membrane's tendency to stiffen in the cold.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Membrane lipids are found to be unaffected by unsaturated fatty acids even when the lipids' arrangement has been altered by low temperature.\nB) Examination of unsaturated fatty acids' molecular structure shows that they retain their shape even as temperature decreases.\nC) A positive correlation is found between concentrations of unsaturated fatty acids and the rate at which membrane lipids stiffen as temperature decreases.\nD) Analysis of membrane structure at low temperature reveals that lipids remain more flexible when unsaturated fatty acids are present than when they are not.", "answer": "D", "explanation": "Direct evidence that the membrane stays more flexible with the fatty acids present most directly supports the hypothesis."}, {"id": "12.2", "text": "Under normal soil conditions, plant root cell walls maintain a semi-rigid structure that allows for steady water uptake. Extreme salinity, such as found in coastal floodplains, destabilizes this structure and can impair water absorption; yet certain salt-tolerant grasses have adapted to these conditions. Studies have found a positive correlation between the salinity levels grasses tolerate and concentrations of a compound called glycine betaine in their root cells, leading a team of researchers to hypothesize that glycine betaine reduces the cell wall's vulnerability to salt-induced damage.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Root cell walls are found to be unaffected by glycine betaine even when the walls' structure has been altered by high salinity.\nB) Examination of glycine betaine's molecular structure shows that it retains its shape even as salinity increases.\nC) A positive correlation is found between concentrations of glycine betaine and the rate at which cell walls become damaged as salinity increases.\nD) Analysis of root cell structure under high salinity reveals that cell walls remain more stable when glycine betaine is present than when it is not.", "answer": "D", "explanation": "Direct evidence that the cell wall stays more stable with glycine betaine present most directly supports the hypothesis."}, {"id": "12.3", "text": "Under normal temperatures, insect cuticle maintains a hardened, protective structure. Extreme heat, such as found during heat waves, softens this structure and can leave insects vulnerable to water loss; yet certain desert beetles have adapted to survive such heat. Studies have found a positive correlation between the temperatures desert beetles can withstand and concentrations of a wax-like compound in their cuticle, leading a team of researchers to hypothesize that this compound reduces the cuticle's tendency to soften in extreme heat.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Cuticle structure is found to be unaffected by the wax-like compound even when the cuticle's arrangement has been altered by high heat.\nB) Examination of the wax-like compound's molecular structure shows that it retains its shape even as temperature increases.\nC) A positive correlation is found between concentrations of the wax-like compound and the rate at which cuticle softens as temperature increases.\nD) Analysis of cuticle structure at high temperature reveals that it remains more rigid when the wax-like compound is present than when it is not.", "answer": "D", "explanation": "Direct evidence that the cuticle stays more rigid with the compound present most directly supports the hypothesis."}, {"id": "12.4", "text": "Under normal light levels, the pigment-protein complexes in certain algae maintain a stable folded structure. Extreme sunlight, such as found near the ocean's surface at midday, destabilizes these complexes and can impair photosynthesis; yet some surface-dwelling algae have adapted to withstand intense light. Studies have found a positive correlation between the light intensities algae can tolerate and concentrations of a carotenoid pigment within their cells, leading a team of researchers to hypothesize that this carotenoid reduces the complexes' vulnerability to light-induced damage.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Pigment-protein complexes are found to be unaffected by the carotenoid even when the complexes' structure has been altered by intense light.\nB) Examination of the carotenoid's molecular structure shows that it retains its shape even as light intensity increases.\nC) A positive correlation is found between concentrations of the carotenoid and the rate at which complexes become damaged as light intensity increases.\nD) Analysis of complex structure under intense light reveals that the folded structure remains more stable when the carotenoid is present than when it is not.", "answer": "D", "explanation": "Direct evidence that the complex stays more stable with the carotenoid present most directly supports the hypothesis."}, {"id": "12.5", "text": "Under normal humidity, spider silk maintains a tightly coiled molecular structure that gives it its strength. Extreme dryness, such as found in arid habitats, disrupts this structure and can make the silk brittle; yet certain desert spiders produce silk that withstands such conditions. Studies have found a positive correlation between the dryness levels a spider's habitat reaches and concentrations of a particular protein in its silk, leading a team of researchers to hypothesize that this protein reduces the silk's tendency to become brittle in dry conditions.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\n\nA) Silk structure is found to be unaffected by the protein even when the structure has been altered by low humidity.\nB) Examination of the protein's molecular structure shows that it retains its shape even as humidity decreases.\nC) A positive correlation is found between concentrations of the protein and the rate at which silk becomes brittle as humidity decreases.\nD) Analysis of silk structure under low humidity reveals that the coiled structure remains more stable when the protein is present than when it is not.", "answer": "D", "explanation": "Direct evidence that the silk stays more stable with the protein present most directly supports the hypothesis."}]}, {"n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "original": "In a 2013 study, Agness Gidna, Jose Yravedra, and Manuel Dominguez-Rodrigo compared the feeding behaviors of wild lions in Tanzania's Tarangire National Park with those of captive lions in Spain's Cabarceno Reserve. The researchers noted that previous studies focused on other carnivores have shown that providing animals with food at regular intervals, as is common in captive settings, may inadvertently facilitate the development of novel stereotypic (i.e., purposeless repetitive) behaviors by reducing the need for a high degree of cognitive engagement with the environment; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) bones from carcasses provided to captive lions showed signs of extensive gnawing beyond the point of nutrient extraction, whereas bones from prey hunted by wild lions did not.\nB) during feeding episodes, captive male lions showed much more aggression than did wild male lions, whereas female captive and wild lions showed similar levels of aggression.\nC) when caretakers placed food in boxes that were cognitively demanding to open, captive lions showed repeated behaviors similar to those that wild lions show when stalking prey.\nD) captive lions showed a stereotypic behavior of pacing in their enclosures as feeding times approached, whereas wild lions showed a stereotypic behavior of pacing before embarking on a hunt.", "generated": [{"id": "14.1", "text": "In a 2015 study, Marcus Webb and Aline Duarte compared the foraging behaviors of wild capuchin monkeys in Costa Rica's rainforests with those of captive capuchins in a large zoo enclosure. The researchers noted that previous studies focused on other primates have shown that providing animals with food at predictable times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active searching; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) captive capuchins repeatedly turned over the same empty feeding dishes long after any food had been removed, whereas wild capuchins moved on quickly once a foraging site was exhausted.\nB) during feeding episodes, captive capuchins showed much more aggression toward each other than wild capuchins did toward members of their own troop.\nC) when caretakers hid food inside puzzle feeders, captive capuchins solved the puzzles more quickly than wild capuchins located comparable hidden food sources.\nD) captive capuchins showed a repetitive pacing behavior near enclosure walls as feeding times approached, whereas wild capuchins showed no comparable behavior before a successful hunt.", "answer": "A", "explanation": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced cognitive engagement."}, {"id": "14.2", "text": "In a 2012 study, Renata Silva and Owen Blackwood compared the nest-building behaviors of wild orangutans in Borneo with those of captive orangutans at a large sanctuary. The researchers noted that previous studies focused on other great apes have shown that providing animals with pre-cut nesting materials at fixed times, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active material selection; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) captive orangutans repeatedly rearranged the same small pile of nesting material without ever completing a usable nest, whereas wild orangutans built complete, structurally sound nests each evening.\nB) during nest-building episodes, captive orangutans showed much less vocalization than wild orangutans did while gathering branches.\nC) when caretakers scattered fresh branches unpredictably, captive orangutans located them more quickly than wild orangutans located naturally growing branches.\nD) captive orangutans showed a repetitive swaying behavior near feeding stations as mealtimes approached, whereas wild orangutans showed no comparable behavior before building a nest.", "answer": "A", "explanation": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced material-selection engagement."}, {"id": "14.3", "text": "In a 2018 study, Idris Osei and Camila Rocha compared the digging behaviors of wild meerkats in the Kalahari with those of captive meerkats at a wildlife park. The researchers noted that previous studies focused on other burrowing mammals have shown that providing animals with pre-dug shelters, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active burrow construction; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) captive meerkats repeatedly scraped at the same patch of soil near their shelter entrance without ever extending the burrow, whereas wild meerkats continuously extended their burrow systems.\nB) during digging episodes, captive meerkats showed much more aggression toward each other than wild meerkats did toward members of their own group.\nC) when caretakers buried food at unpredictable depths, captive meerkats located it more quickly than wild meerkats located naturally buried insects.\nD) captive meerkats showed a repetitive sentry-posture behavior near enclosure walls as feeding times approached, whereas wild meerkats showed no comparable behavior before digging for food.", "answer": "A", "explanation": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced construction engagement."}, {"id": "14.4", "text": "In a 2020 study, Fatima Al-Rashid and Dmitri Volkov compared the nut-caching behaviors of wild squirrels in a temperate forest with those of captive squirrels at a research facility. The researchers noted that previous studies focused on other rodents have shown that providing animals with food at fixed, predictable locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active spatial memory use; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) captive squirrels repeatedly dug and re-covered the same small patch of substrate without ever caching a nut there, whereas wild squirrels cached nuts across dozens of distinct, spatially separated sites.\nB) during caching episodes, captive squirrels showed much less vigilance for predators than wild squirrels did while burying nuts.\nC) when caretakers hid nuts in unpredictable locations, captive squirrels located them more quickly than wild squirrels located naturally hidden seeds.\nD) captive squirrels showed a repetitive tail-flicking behavior near feeding stations as mealtimes approached, whereas wild squirrels showed no comparable behavior before caching food.", "answer": "A", "explanation": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced spatial-memory engagement."}, {"id": "14.5", "text": "In a 2017 study, Leilani Kahale and Tobias Reinholt compared the nest-defense behaviors of wild gulls on a remote island colony with those of captive gulls at a coastal aviary. The researchers noted that previous studies focused on other seabirds have shown that providing animals with food at fixed times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active territorial patrolling; the researchers were therefore not altogether surprised to find that ______\n\nWhich choice most logically completes the text?\n\nA) captive gulls repeatedly circled the same small perch near the feeding station without ever establishing a defended territory, whereas wild gulls actively patrolled and defended distinct nesting territories.\nB) during feeding episodes, captive gulls showed much more aggression toward caretakers than wild gulls showed toward researchers observing their colony.\nC) when caretakers scattered food unpredictably, captive gulls located it more quickly than wild gulls located naturally available fish.\nD) captive gulls showed a repetitive head-bobbing behavior near enclosure walls as feeding times approached, whereas wild gulls showed no comparable behavior before defending a nest.", "answer": "A", "explanation": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced patrolling engagement."}]}, {"n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "original": "In Auguste Escoffier's 1903 cookbook titled Le Guide Culinaire, the chef included over 5,000 dishes, including Oeufs Aurore (baked eggs), Gambas (jumbo shrimp) in garlic sauce, and Tarte aux Pignons (pine nut tart). Such iconic French recipes, described in surprisingly brief detail in Le Guide Culinaire, ______ the Victorian French cuisine Escoffier sought to preserve in his encyclopedic book.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) epitomize\nB) has epitomized\nC) epitomizes\nD) was epitomizing", "generated": [{"id": "15.1", "text": "Such intricate mosaic floors, uncovered only recently beneath a much later marble surface, ______ the wealth and craftsmanship of the villa's original owners.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) reveal\nB) has revealed\nC) reveals\nD) was revealing", "answer": "A", "explanation": "The plural subject \"floors\" requires the plural verb \"reveal.\""}, {"id": "15.2", "text": "Such carefully preserved letters, stored for decades in a nondescript attic trunk, ______ a side of the family's history that no published biography had ever mentioned.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) illuminate\nB) has illuminated\nC) illuminates\nD) was illuminating", "answer": "A", "explanation": "The plural subject \"letters\" requires the plural verb \"illuminate.\""}, {"id": "15.3", "text": "Such elaborate carved doorways, found only in the oldest quarter of the city, ______ a building tradition that largely disappeared after the region's later conquest.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) represent\nB) has represented\nC) represents\nD) was representing", "answer": "A", "explanation": "The plural subject \"doorways\" requires the plural verb \"represent.\""}, {"id": "15.4", "text": "Such meticulously kept ledgers, maintained by the same family for nearly two centuries, ______ shifts in the local economy that no other surviving record captures in such detail.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) document\nB) has documented\nC) documents\nD) was documenting", "answer": "A", "explanation": "The plural subject \"ledgers\" requires the plural verb \"document.\""}, {"id": "15.5", "text": "Such tightly woven baskets, traded widely along the ancient river route, ______ a level of technical skill that archaeologists had not previously attributed to the region's early inhabitants.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) demonstrate\nB) has demonstrated\nC) demonstrates\nD) was demonstrating", "answer": "A", "explanation": "The plural subject \"baskets\" requires the plural verb \"demonstrate.\""}]}, {"n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "original": "Consider the mechanics of the pinhole camera: light passes through a small hole,
