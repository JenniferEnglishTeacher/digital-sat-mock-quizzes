 participants adopting a wide range of approaches, from strict vocational training to loosely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structured<\/a> community gatherings.", "bodyPlain": "Standard accounts of the settlement house movement tend to focus on its most famous founders, making the movement seem uniformly shaped by a single reform philosophy. Historian Odalys Ferreira has shown, however, that if we shift focus toward the day-to-day staff who ran individual settlement houses, we see participants adopting a wide range of approaches, from strict vocational training to loosely structured community gatherings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於睦鄰之家運動的標準論述，往往聚焦於最著名的創辦人，使這場運動看起來一律由單一的改革理念所塑造。然而，歷史學家 Odalys Ferreira 已經證明，如果我們把焦點轉向實際經營各個睦鄰之家的日常工作人員，就會看到參與者採取各式各樣的做法，從嚴格的職業訓練到結構鬆散的社區聚會都有。", "opts": {"A": "It presents a trend in scholarship on the settlement house movement that the text claims has been reevaluated by researchers in light of Ferreira's work on the movement's participants.", "B": "It identifies an aspect of the settlement house movement that the text implies was overemphasized by scholars due to their own class backgrounds.", "C": "It describes a common approach to studying the settlement house movement that, according to the text, obscures the range of approaches among its participants.", "D": "It summarizes the conventional method for analyzing the settlement house movement, which the text suggests creates a misleading impression of the effectiveness of a single reform philosophy."}, "optsZh": {"A": "它呈現睦鄰之家運動研究中的一種趨勢，而本文聲稱研究人員已根據 Ferreira 對運動參與者的研究重新評估了這種趨勢。", "B": "它指出睦鄰之家運動的某個面向，而本文暗示學者因自身的階級背景而過度強調這個面向。", "C": "它描述一種研究睦鄰之家運動的常見方式，而根據本文，這種方式掩蓋了參與者做法的多樣性。", "D": "它總結分析睦鄰之家運動的傳統方法，而本文暗示這種方法對單一改革理念的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion names the standard scholarly focus that Ferreira's work shows obscures real diversity of approach.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its completion in 2014, Bosco Verticale (Vertical Forest)—a pair of residential towers in Milan, Italy, covered by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>—has become a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> symbol of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> sustainability in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it&#x27;s too early to tell if they can thrive in this unusual setting.", "bodyPlain": "Since its completion in 2014, Bosco Verticale (Vertical Forest)—a pair of residential towers in Milan, Italy, covered by vegetation—has become a striking symbol of environmental sustainability in architecture. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it's too early to tell if they can thrive in this unusual setting.", "stem": "According to the text, why are some critics skeptical of the concept behind Bosco Verticale?", "stemZh": "根據本文，為什麼有些批評者對垂直森林背後的構想抱持懷疑？", "bodyZh": "自 2014 年完工以來，Bosco Verticale（垂直森林）——義大利米蘭一對被植物覆蓋的住宅大樓——已成為建築領域中環境永續的醒目象徵。Stefano Boeri 原本希望他的設計（陽台上種有數百棵樹）能成為促進都市生物多樣性的典範。然而，這個構想也受到質疑：批評者指出，雖然垂直森林使用的樹是專門為這個計畫培育的，但現在還無法判斷它們能否在這種不尋常的環境中茁壯生長。", "opts": {"A": "Some essential aspects of Bosco Verticale's design are difficult to adapt to locations other than Milan.", "B": "The plant life on Bosco Verticale ended up being less varied than Boeri had envisioned it would be.", "C": "The construction of Bosco Verticale was no less environmentally damaging than the construction of more conventional buildings is.", "D": "It is unclear whether Bosco Verticale can support the plant life included in its design."}, "optsZh": {"A": "垂直森林設計中的一些重要面向，很難應用到米蘭以外的地點。", "B": "垂直森林上的植物最後不如 Boeri 預想的那麼多樣。", "C": "垂直森林的建造對環境的破壞並不比較傳統的建築少。", "D": "目前還不清楚垂直森林能否支撐其設計中的植物生命。"}, "answer": "D", "expl": "Critics say 'it's too early to tell if [the trees] can thrive in this unusual setting.'", "explZh": "批評者表示「現在還無法判斷這些樹能否在這種特殊環境中茁壯生長」。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its unveiling in 2019, the Solaris Canopy—a shading <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> over a public plaza in Doha covered in photovoltaic-embedded fabric—has become a widely cited example of climate-adaptive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>. Designer Farah Haddad intended the fabric, which generates <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a> while blocking direct sun, to serve as a model for hot-climate public spaces. However, the concept has faced skepticism: critics note that although the fabric was specifically engineered for this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a>, it&#x27;s too early to tell if it can maintain its electrical output after years of exposure to blowing sand and extreme heat.", "bodyPlain": "Since its unveiling in 2019, the Solaris Canopy—a shading structure over a public plaza in Doha covered in photovoltaic-embedded fabric—has become a widely cited example of climate-adaptive architecture. Designer Farah Haddad intended the fabric, which generates electricity while blocking direct sun, to serve as a model for hot-climate public spaces. However, the concept has faced skepticism: critics note that although the fabric was specifically engineered for this installation, it's too early to tell if it can maintain its electrical output after years of exposure to blowing sand and extreme heat.", "stem": "According to the text, why are some critics skeptical of the concept behind the Solaris Canopy?", "stemZh": "根據本文，為什麼有些批評者對 Solaris Canopy 背後的構想抱持懷疑？", "bodyZh": "自 2019 年揭幕以來，Solaris Canopy——杜哈一處公共廣場上方、以嵌入光電元件之布料覆蓋的遮陽結構——已成為廣受引用的氣候調適建築案例。設計師 Farah Haddad 原本希望這種能在遮擋直射陽光的同時發電的布料，成為炎熱氣候公共空間的典範。然而，這個構想也受到質疑：批評者指出，雖然這種布料是專門為這個裝置設計的，但現在還無法判斷它在多年風沙與極端高溫的侵襲下能否維持發電量。", "opts": {"A": "Some essential aspects of the Solaris Canopy's design are difficult to adapt to locations other than Doha.", "B": "The fabric used in the Solaris Canopy generates less electricity than Haddad had originally envisioned.", "C": "The construction of the Solaris Canopy required more resources than the construction of conventional shading structures.", "D": "It is unclear whether the fabric can maintain its performance under the installation's specific long-term conditions."}, "optsZh": {"A": "Solaris Canopy 設計中的一些重要面向，很難應用到杜哈以外的地點。", "B": "Solaris Canopy 使用的布料發電量比 Haddad 原本預想的少。", "C": "Solaris Canopy 的建造比傳統遮陽結構需要更多資源。", "D": "目前還不清楚這種布料能否在該裝置特定的長期條件下維持其效能。"}, "answer": "D", "expl": "The text says it is too early to know if the fabric will hold up over time, so the outcome is uncertain.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its completion in 2016, the Living Seawall—a stretch of artificial reef panels <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=install\" target=\"_blank\" rel=\"noopener\" data-w=\"install\" data-pos=\"v.\" data-en=\"to put equipment in place so it can be used\" data-zh=\"安裝\">installed<\/a> along a harbor in Sydney—has become a frequently cited example of urban marine restoration. Engineer Devika Nair intended the textured panels, designed to mimic natural rock crevices, to serve as a model for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=restore\" target=\"_blank\" rel=\"noopener\" data-w=\"restore\" data-pos=\"v.\" data-en=\"to return something to its original condition\" data-zh=\"復育；修復\">restoring<\/a> marine life along developed coastlines. However, the concept has faced skepticism: critics note that although the panels were specifically molded for this harbor, it&#x27;s too early to tell if the marine species they attract can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">establish<\/a> a stable, self-sustaining <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> there.", "bodyPlain": "Since its completion in 2016, the Living Seawall—a stretch of artificial reef panels installed along a harbor in Sydney—has become a frequently cited example of urban marine restoration. Engineer Devika Nair intended the textured panels, designed to mimic natural rock crevices, to serve as a model for restoring marine life along developed coastlines. However, the concept has faced skepticism: critics note that although the panels were specifically molded for this harbor, it's too early to tell if the marine species they attract can establish a stable, self-sustaining population there.", "stem": "According to the text, why are some critics skeptical of the concept behind the Living Seawall?", "stemZh": "根據本文，為什麼有些批評者對 Living Seawall 背後的構想抱持懷疑？", "bodyZh": "自 2016 年完工以來，Living Seawall——沿著雪梨一處港口安裝的一段人工礁板——已成為經常被引用的都市海洋復育案例。工程師 Devika Nair 原本希望這些模仿天然岩縫的紋理礁板，成為在開發過的海岸線復育海洋生物的典範。然而，這個構想也受到質疑：批評者指出，雖然這些礁板是專門為這個港口塑造的，但現在還無法判斷它們吸引來的海洋物種能否在那裡建立穩定、可自我延續的族群。", "opts": {"A": "Some essential aspects of the Living Seawall's design are difficult to adapt to harbors other than Sydney's.", "B": "The panels used in the Living Seawall attracted fewer species than Nair had originally envisioned.", "C": "The construction of the Living Seawall was no less disruptive to marine life than conventional seawall construction.", "D": "It is unclear whether the attracted marine species can establish a lasting, self-sustaining population there."}, "optsZh": {"A": "Living Seawall 設計中的一些重要面向，很難應用到雪梨以外的港口。", "B": "Living Seawall 使用的礁板吸引的物種比 Nair 原本預想的少。", "C": "Living Seawall 的建造對海洋生物的干擾並不比傳統海堤建造少。", "D": "目前還不清楚被吸引來的海洋物種能否在那裡建立持久、可自我延續的族群。"}, "answer": "D", "expl": "The text says it is too early to know if the species will establish a stable population, so the outcome is uncertain.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=planting\" target=\"_blank\" rel=\"noopener\">planting<\/a> in 2018, the Whispering Grove—a stand of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=genetically\" target=\"_blank\" rel=\"noopener\">genetically<\/a> modified drought-resistant oaks planted along a highway outside Phoenix—has become a frequently cited example of climate-resilient urban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forestry\" target=\"_blank\" rel=\"noopener\" data-w=\"forestry\" data-pos=\"n.\" data-en=\"the science of planting and caring for forests\" data-zh=\"林業；林學\">forestry<\/a>. Horticulturalist Marco Silva intended the trees, engineered to require minimal irrigation, to serve as a model for greening arid roadways. However, the concept has faced skepticism: critics note that although the trees were specifically bred for this climate, it&#x27;s too early to tell if their root systems can remain stable in the compacted soil found along most highway corridors.", "bodyPlain": "Since its planting in 2018, the Whispering Grove—a stand of genetically modified drought-resistant oaks planted along a highway outside Phoenix—has become a frequently cited example of climate-resilient urban forestry. Horticulturalist Marco Silva intended the trees, engineered to require minimal irrigation, to serve as a model for greening arid roadways. However, the concept has faced skepticism: critics note that although the trees were specifically bred for this climate, it's too early to tell if their root systems can remain stable in the compacted soil found along most highway corridors.", "stem": "According to the text, why are some critics skeptical of the concept behind the Whispering Grove?", "stemZh": "根據本文，為什麼有些批評者對 Whispering Grove 背後的構想抱持懷疑？", "bodyZh": "自 2018 年種植以來，Whispering Grove——鳳凰城郊外公路旁種植的一片基因改造抗旱橡樹林——已成為經常被引用的氣候韌性都市林業案例。園藝學家 Marco Silva 原本希望這些經改造而只需極少灌溉的樹木，成為綠化乾旱道路的典範。然而，這個構想也受到質疑：批評者指出，雖然這些樹是專門為這種氣候培育的，但現在還無法判斷它們的根系在大多數公路沿線被壓實的土壤中能否保持穩固。", "opts": {"A": "Some essential aspects of the Whispering Grove's design are difficult to adapt to climates other than Phoenix's.", "B": "The trees used in the Whispering Grove required more irrigation than Silva had originally envisioned.", "C": "The planting of the Whispering Grove was no less costly than planting conventional highway trees.", "D": "It is unclear whether the trees' root systems can remain stable in the compacted soil found along highway corridors."}, "optsZh": {"A": "Whispering Grove 設計中的一些重要面向，很難應用到鳳凰城以外的氣候。", "B": "Whispering Grove 使用的樹需要的灌溉比 Silva 原本預想的多。", "C": "Whispering Grove 的種植成本並不比種植傳統公路樹木低。", "D": "目前還不清楚這些樹的根系能否在公路沿線被壓實的土壤中保持穩固。"}, "answer": "D", "expl": "The text says it is too early to know if the roots will remain stable, so the outcome is uncertain.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its launch in 2021, the Tidal Lantern—a string of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=buoy-mounted\" target=\"_blank\" rel=\"noopener\">buoy-mounted<\/a> turbines <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generate\" target=\"_blank\" rel=\"noopener\" data-w=\"generate\" data-pos=\"v.\" data-en=\"to produce\" data-zh=\"產生\">generating<\/a> power from wave motion off the coast of Cornwall—has become a frequently cited example of small-scale marine energy. Engineer Bryn Talbot intended the buoys, designed to flex with passing waves, to serve as a model for coastal renewable energy. However, the concept has faced skepticism: critics note that although the buoys were specifically built for this stretch of coastline, it&#x27;s too early to tell if their moving parts can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstand<\/a> years of continuous storm exposure.", "bodyPlain": "Since its launch in 2021, the Tidal Lantern—a string of buoy-mounted turbines generating power from wave motion off the coast of Cornwall—has become a frequently cited example of small-scale marine energy. Engineer Bryn Talbot intended the buoys, designed to flex with passing waves, to serve as a model for coastal renewable energy. However, the concept has faced skepticism: critics note that although the buoys were specifically built for this stretch of coastline, it's too early to tell if their moving parts can withstand years of continuous storm exposure.", "stem": "According to the text, why are some critics skeptical of the concept behind the Tidal Lantern?", "stemZh": "根據本文，為什麼有些批評者對 Tidal Lantern 背後的構想抱持懷疑？", "bodyZh": "自 2021 年啟用以來，Tidal Lantern——康瓦爾外海一串裝在浮標上、利用波浪運動發電的渦輪機——已成為經常被引用的小規模海洋能源案例。工程師 Bryn Talbot 原本希望這些會隨著波浪彎曲的浮標，成為沿海再生能源的典範。然而，這個構想也受到質疑：批評者指出，雖然這些浮標是專門為這段海岸建造的，但現在還無法判斷它們的活動零件能否承受多年持續的暴風侵襲。", "opts": {"A": "Some essential aspects of the Tidal Lantern's design are difficult to adapt to coastlines other than Cornwall's.", "B": "The buoys used in the Tidal Lantern generated less power than Talbot had originally envisioned.", "C": "The construction of the Tidal Lantern was no less disruptive to marine traffic than conventional turbine installations.", "D": "It is unclear whether the buoys' moving parts can withstand years of continuous storm exposure."}, "optsZh": {"A": "Tidal Lantern 設計中的一些重要面向，很難應用到康瓦爾以外的海岸。", "B": "Tidal Lantern 使用的浮標發電量比 Talbot 原本預想的少。", "C": "Tidal Lantern 的建造對海上交通的干擾並不比傳統渦輪機安裝少。", "D": "目前還不清楚浮標的活動零件能否承受多年持續的暴風侵襲。"}, "answer": "D", "expl": "The text says it is too early to know if the parts will withstand storms, so the outcome is uncertain.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Central Ideas and Details: identify, according to the text, why critics are skeptical because a key outcome remains uncertain.", "vocab": false, "body": "Since its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opening\" target=\"_blank\" rel=\"noopener\">opening<\/a> in 2020, the Hollow Spire—a residential tower in Rotterdam built around a central column of vertical gardens—has become a frequently cited example of biophilic urban design. Architect Lotte Bakker intended the column, irrigated by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recycled\" target=\"_blank\" rel=\"noopener\" data-w=\"recycled\" data-pos=\"adj.\" data-en=\"made from used materials that have been processed again\" data-zh=\"回收再利用的\">recycled<\/a> greywater, to serve as a model for integrating greenery into dense <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=housing\" target=\"_blank\" rel=\"noopener\" data-w=\"housing\" data-pos=\"n.\" data-en=\"houses and apartments for people to live in\" data-zh=\"住宅；房屋\">housing<\/a>. However, the concept has faced skepticism: critics note that although the plants were specifically selected for this system, it&#x27;s too early to tell if the greywater irrigation can reliably support them through the building&#x27;s coldest winters.", "bodyPlain": "Since its opening in 2020, the Hollow Spire—a residential tower in Rotterdam built around a central column of vertical gardens—has become a frequently cited example of biophilic urban design. Architect Lotte Bakker intended the column, irrigated by recycled greywater, to serve as a model for integrating greenery into dense housing. However, the concept has faced skepticism: critics note that although the plants were specifically selected for this system, it's too early to tell if the greywater irrigation can reliably support them through the building's coldest winters.", "stem": "According to the text, why are some critics skeptical of the concept behind the Hollow Spire?", "stemZh": "根據本文，為什麼有些批評者對 Hollow Spire 背後的構想抱持懷疑？", "bodyZh": "自 2020 年啟用以來，Hollow Spire——鹿特丹一棟圍繞著中央垂直花園柱體建造的住宅大樓——已成為經常被引用的親生物都市設計案例。建築師 Lotte Bakker 原本希望這根以回收灰水灌溉的柱體，成為在密集住宅中融入綠意的典範。然而，這個構想也受到質疑：批評者指出，雖然這些植物是專門為這套系統挑選的，但現在還無法判斷灰水灌溉能否可靠地支撐它們度過這棟建築最寒冷的冬天。", "opts": {"A": "Some essential aspects of the Hollow Spire's design are difficult to adapt to buildings other than residential towers.", "B": "The plants used in the Hollow Spire required less water than Bakker had originally envisioned.", "C": "The construction of the Hollow Spire was no less costly than the construction of conventional residential towers.", "D": "It is unclear whether the greywater irrigation can reliably support the plants through the building's coldest winters."}, "optsZh": {"A": "Hollow Spire 設計中的一些重要面向，很難應用到住宅大樓以外的建築。", "B": "Hollow Spire 使用的植物需要的水比 Bakker 原本預想的少。", "C": "Hollow Spire 的建造成本並不比傳統住宅大樓低。", "D": "目前還不清楚灰水灌溉能否可靠地支撐植物度過這棟建築最寒冷的冬天。"}, "answer": "D", "expl": "The text says it is too early to know if irrigation will support the plants through winter, so the outcome is uncertain.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Elizabeth Asiedu has identified a negative correlation between the share of developing countries&#x27; economies derived from natural-resource extraction and those countries&#x27; receipts of foreign investment. This may appear counterintuitive—resource extraction requires initial investments (in extractive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a>, for instance) at scales best met by multinational corporations—but Asiedu notes that natural-resource <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industry\" target=\"_blank\" rel=\"noopener\" data-w=\"industry\" data-pos=\"n.\" data-en=\"the businesses that make a particular product\" data-zh=\"產業；工業\">industries<\/a>&#x27; boom-bust cycle can destabilize local currencies and increase developing countries&#x27; vulnerability to external shocks, creating levels of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a> to which foreign investors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> averse.", "bodyPlain": "Elizabeth Asiedu has identified a negative correlation between the share of developing countries' economies derived from natural-resource extraction and those countries' receipts of foreign investment. This may appear counterintuitive—resource extraction requires initial investments (in extractive technology, for instance) at scales best met by multinational corporations—but Asiedu notes that natural-resource industries' boom-bust cycle can destabilize local currencies and increase developing countries' vulnerability to external shocks, creating levels of uncertainty to which foreign investors are typically averse.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Elizabeth Asiedu 發現，開發中國家經濟中來自天然資源開採的比例，與這些國家所獲得的外國投資之間呈負相關。這可能看起來違反直覺——資源開採需要初期投資（例如在開採技術上），而這種規模最適合由跨國企業提供——但 Asiedu 指出，天然資源產業的景氣榮枯循環會使當地貨幣不穩定，並增加開發中國家受外部衝擊的脆弱性，造成外國投資人通常不願承受的不確定性。", "opts": {"A": "Although it may seem surprising that foreign investment declines in developing countries as natural-resource extraction makes up a larger share of those countries' economies, that decline happens because resource extraction requires initial investments too large for foreign investors to supply.", "B": "Although developing countries tend to become less dependent on foreign investment as natural-resource industries make up a larger share of their economies, this change may not occur if the boom-bust cycle of those industries destabilizes local currencies or increases countries' vulnerability to external shocks.", "C": "Although one might expect that foreign investment would increase as natural-resource extraction makes up a larger share of developing countries' economies, the opposite happens because heavy reliance on natural resources can lead to unattractive conditions for investors.", "D": "Although foreign investors tend to avoid initial investments in natural-resource industries in developing countries, foreign investment may increase significantly as those industries stabilize and the risks associated with them decline."}, "optsZh": {"A": "雖然隨著天然資源開採在開發中國家經濟中所佔比例提高，外國投資減少似乎令人意外，但這種減少是因為資源開採所需的初期投資太大，外國投資人無法提供。", "B": "雖然隨著天然資源產業在經濟中所佔比例提高，開發中國家往往較不依賴外國投資，但若這些產業的景氣榮枯循環使當地貨幣不穩定或增加國家受外部衝擊的脆弱性，這種變化可能不會發生。", "C": "雖然一般會預期隨著天然資源開採在開發中國家經濟中所佔比例提高，外國投資會增加，但實際情況正好相反，因為過度依賴天然資源可能造成對投資人不具吸引力的環境。", "D": "雖然外國投資人往往避免對開發中國家的天然資源產業進行初期投資，但隨著這些產業趨於穩定、相關風險降低，外國投資可能會大幅增加。"}, "answer": "C", "expl": "One would expect more investment, but boom-bust instability creates uncertainty investors avoid, so investment falls.", "explZh": "一般會以為投資會增加，但資源產業的景氣循環造成不穩定，投資人避之唯恐不及，所以外資反而減少。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Camille Duval has identified a negative correlation between the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proportion\" target=\"_blank\" rel=\"noopener\" data-w=\"proportion\" data-pos=\"n.\" data-en=\"a part or share of a whole\" data-zh=\"比例\">proportion<\/a> of a city&#x27;s downtown occupied by short-term vacation rentals and that city&#x27;s long-term small-business survival rate. This may appear counterintuitive—vacation rentals bring a steady stream of visitors who might be expected to support local shops—but Duval notes that the resulting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spike\" target=\"_blank\" rel=\"noopener\" data-w=\"spike\" data-pos=\"n.\" data-en=\"a sudden sharp increase\" data-zh=\"飆升；激增\">spikes<\/a> in rent, driven by property owners <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=convert\" target=\"_blank\" rel=\"noopener\" data-w=\"convert\" data-pos=\"v.\" data-en=\"to change something into a different form\" data-zh=\"轉換\">converting<\/a> long-term leases into short-term rentals, price out the very small businesses that once served longtime <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a>, creating a less stable customer base overall.", "bodyPlain": "Camille Duval has identified a negative correlation between the proportion of a city's downtown occupied by short-term vacation rentals and that city's long-term small-business survival rate. This may appear counterintuitive—vacation rentals bring a steady stream of visitors who might be expected to support local shops—but Duval notes that the resulting spikes in rent, driven by property owners converting long-term leases into short-term rentals, price out the very small businesses that once served longtime residents, creating a less stable customer base overall.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Camille Duval 發現，一座城市的市中心被短期度假出租房屋所佔的比例，與該市小型企業的長期存活率之間呈負相關。這可能看起來違反直覺——度假出租房屋帶來穩定的遊客，照理說能支持當地商店——但 Duval 指出，屋主把長期租約改為短期出租所導致的租金飆漲，把原本服務長期居民的小商家趕走了，整體上造成較不穩定的顧客群。", "opts": {"A": "Although it may seem surprising that small-business survival declines in cities with more short-term rentals, that decline happens because rental owners avoid renting to businesses that serve tourists.", "B": "Although downtown neighborhoods tend to become less dependent on tourism as vacation rentals increase, this change may not occur if rent increases displace long-term residents.", "C": "Although one might expect small-business survival to increase as vacation rentals bring more visitors downtown, the opposite happens because rising rents driven by those rentals price out small businesses and destabilize their customer base.", "D": "Although vacation rental owners tend to avoid converting properties in areas with strong small-business districts, conversions may increase significantly as those districts decline and rents fall."}, "optsZh": {"A": "雖然短期出租房屋較多的城市小企業存活率下降似乎令人意外，但這種下降是因為出租房屋業主避免租給服務觀光客的商家。", "B": "雖然隨著度假出租房屋增加，市中心社區往往較不依賴觀光，但若租金上漲使長期居民被迫遷離，這種變化可能不會發生。", "C": "雖然一般會預期隨著度假出租房屋帶來更多市中心遊客，小企業存活率會提高，但實際情況正好相反，因為這些出租房屋推高租金，把小商家趕走，並使其顧客群不穩定。", "D": "雖然度假出租房屋業主往往避免在小商圈興盛的地區轉換物業用途，但隨著這些商圈衰退、租金下跌，轉換可能會大幅增加。"}, "answer": "C", "expl": "Choice C states the counterintuitive relationship and the mechanism (rising rents) that explains it.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Tomasz Wieczorek has identified a negative correlation between the share of a country&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a> generated from a newly built dam and that country&#x27;s electricity price stability in the years <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a> following <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">construction<\/a>. This may appear counterintuitive—large dams are often expected to provide cheap, stable power—but Wieczorek notes that the debt taken on to finance construction, combined with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"impossible to know in advance\" data-zh=\"無法預測的\">unpredictable<\/a> rainfall affecting output, can make electricity prices more volatile rather than less, at least until the debt is paid down.", "bodyPlain": "Tomasz Wieczorek has identified a negative correlation between the share of a country's electricity generated from a newly built dam and that country's electricity price stability in the years immediately following construction. This may appear counterintuitive—large dams are often expected to provide cheap, stable power—but Wieczorek notes that the debt taken on to finance construction, combined with unpredictable rainfall affecting output, can make electricity prices more volatile rather than less, at least until the debt is paid down.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Tomasz Wieczorek 發現，一個國家由新建水壩所產生的電力比例，與該國在建成後幾年內的電價穩定度之間呈負相關。這可能看起來違反直覺——大型水壩通常被期待能提供便宜穩定的電力——但 Wieczorek 指出，為興建而背負的債務，加上影響發電量的不可預測降雨，可能使電價變得更不穩定而非更穩定，至少在債務還清之前是如此。", "opts": {"A": "Although it may seem surprising that electricity prices become less stable after a large dam is built, that instability happens because dam operators intentionally raise prices to recover construction costs.", "B": "Although countries tend to become less reliant on imported electricity as dam-generated power increases, this change may not occur if rainfall patterns shift unpredictably.", "C": "Although one might expect electricity prices to become more stable as a new dam comes online, the opposite happens because construction debt and unpredictable rainfall can make prices more volatile instead.", "D": "Although dam financiers tend to avoid funding projects in countries with unstable electricity prices, financing may increase significantly as those countries' rainfall patterns become more predictable."}, "optsZh": {"A": "雖然大型水壩建成後電價變得較不穩定似乎令人意外，但這種不穩定是因為水壩業者刻意調漲電價以回收建設成本。", "B": "雖然隨著水壩發電增加，國家往往較不依賴進口電力，但若降雨模式變得難以預測，這種變化可能不會發生。", "C": "雖然一般會預期隨著新水壩開始運轉，電價會變得更穩定，但實際情況正好相反，因為建設債務與不可預測的降雨反而可能使電價更加波動。", "D": "雖然水壩出資者往往避免資助電價不穩定國家的計畫，但隨著這些國家的降雨模式變得較可預測，融資可能會大幅增加。"}, "answer": "C", "expl": "Choice C states the counterintuitive relationship and the mechanism (debt and rainfall variability) that explains it.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Aisha Bello has identified a negative correlation between the number of self-checkout kiosks a grocery chain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=install\" target=\"_blank\" rel=\"noopener\" data-w=\"install\" data-pos=\"v.\" data-en=\"to put equipment in place so it can be used\" data-zh=\"安裝\">installs<\/a> and that chain&#x27;s overall customer satisfaction scores in the following year. This may appear counterintuitive—self-checkout is often expected to reduce wait times and improve the shopping <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>—but Bello notes that the resulting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> in staffed checkout lanes can leave customers with complex <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchases<\/a> or technical problems with no easy source of help, lowering satisfaction overall.", "bodyPlain": "Aisha Bello has identified a negative correlation between the number of self-checkout kiosks a grocery chain installs and that chain's overall customer satisfaction scores in the following year. This may appear counterintuitive—self-checkout is often expected to reduce wait times and improve the shopping experience—but Bello notes that the resulting reduction in staffed checkout lanes can leave customers with complex purchases or technical problems with no easy source of help, lowering satisfaction overall.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Aisha Bello 發現，一家連鎖超市安裝的自助結帳機數量，與該連鎖店隔年的整體顧客滿意度之間呈負相關。這可能看起來違反直覺——自助結帳通常被期待能減少等待時間、改善購物體驗——但 Bello 指出，隨之而來的有人服務結帳通道減少，可能讓購買複雜商品或遇到技術問題的顧客無處求助，因而降低整體滿意度。", "opts": {"A": "Although it may seem surprising that customer satisfaction falls as self-checkout kiosks increase, that decline happens because kiosks are more expensive for stores to maintain than staffed lanes.", "B": "Although grocery chains tend to become less reliant on staffed checkout lanes as kiosks increase, this change may not occur if customers resist using the new technology.", "C": "Although one might expect customer satisfaction to rise as self-checkout kiosks reduce wait times, the opposite happens because fewer staffed lanes leave customers without help for complex purchases or technical issues.", "D": "Although grocery chains tend to avoid installing kiosks in stores with high customer satisfaction, installation may increase significantly as satisfaction scores in those stores decline."}, "optsZh": {"A": "雖然隨著自助結帳機增加，顧客滿意度下降似乎令人意外，但這種下降是因為自助機的維護成本比有人服務的通道高。", "B": "雖然隨著自助機增加，連鎖超市往往較不依賴有人服務的結帳通道，但若顧客抗拒使用新技術，這種變化可能不會發生。", "C": "雖然一般會預期隨著自助結帳機減少等待時間，顧客滿意度會上升，但實際情況正好相反，因為有人服務的通道減少，使購買複雜商品或遇到技術問題的顧客無人協助。", "D": "雖然連鎖超市往往避免在顧客滿意度高的門市安裝自助機，但隨著這些門市滿意度下降，安裝可能會大幅增加。"}, "answer": "C", "expl": "Choice C states the counterintuitive relationship and the mechanism (fewer staffed lanes) that explains it.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Ravi Chandrasekaran has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=identified\" target=\"_blank\" rel=\"noopener\">identified<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=negative\" target=\"_blank\" rel=\"noopener\">negative<\/a> correlation between the number of budget-priced streaming platforms a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> subscribes to and that household&#x27;s reported satisfaction with its overall entertainment options. This may appear counterintuitive—more platforms are often expected to mean more content and greater choice—but Chandrasekaran notes that the resulting need to track multiple libraries, prices, and interfaces can create decision fatigue that leaves households feeling less satisfied rather than more.", "bodyPlain": "Ravi Chandrasekaran has identified a negative correlation between the number of budget-priced streaming platforms a household subscribes to and that household's reported satisfaction with its overall entertainment options. This may appear counterintuitive—more platforms are often expected to mean more content and greater choice—but Chandrasekaran notes that the resulting need to track multiple libraries, prices, and interfaces can create decision fatigue that leaves households feeling less satisfied rather than more.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Ravi Chandrasekaran 發現，一個家庭訂閱的平價串流平台數量，與該家庭對整體娛樂選擇的滿意度之間呈負相關。這可能看起來違反直覺——更多平台通常被認為代表更多內容與更多選擇——但 Chandrasekaran 指出，隨之而來需要掌握多個片庫、價格與介面，可能造成決策疲勞，讓家庭感到更不滿意而非更滿意。", "opts": {"A": "Although it may seem surprising that entertainment satisfaction falls as streaming subscriptions increase, that decline happens because platforms deliberately limit content to encourage additional subscriptions.", "B": "Although households tend to become less selective about content as streaming subscriptions increase, this change may not occur if a household cancels unused subscriptions.", "C": "Although one might expect entertainment satisfaction to rise as more streaming platforms offer more choice, the opposite happens because tracking multiple libraries and interfaces creates decision fatigue that lowers satisfaction.", "D": "Although streaming platforms tend to avoid targeting households with several existing subscriptions, targeting may increase significantly as those households' satisfaction with existing platforms declines."}, "optsZh": {"A": "雖然隨著串流訂閱增加，娛樂滿意度下降似乎令人意外，但這種下降是因為平台刻意限制內容以鼓勵加購訂閱。", "B": "雖然隨著串流訂閱增加，家庭往往對內容較不挑剔，但若家庭取消未使用的訂閱，這種變化可能不會發生。", "C": "雖然一般會預期隨著更多串流平台提供更多選擇，娛樂滿意度會上升，但實際情況正好相反，因為掌握多個片庫與介面會造成決策疲勞，降低滿意度。", "D": "雖然串流平台往往避免鎖定已有多個訂閱的家庭，但隨著這些家庭對現有平台的滿意度下降，鎖定可能會大幅增加。"}, "answer": "C", "expl": "Choice C states the counterintuitive relationship and the mechanism (decision fatigue) that explains it.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Central Ideas and Details: state a main idea built on a counterintuitive relationship explained by an underlying mechanism.", "vocab": false, "body": "Helena Kowalczyk has identified a negative correlation between the number of open-plan seating areas a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> adds to its office and that company&#x27;s employee-reported focus and productivity. This may appear counterintuitive—open floor plans are often expected to boost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a> and efficiency—but Kowalczyk notes that the resulting rise in ambient noise and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visual<\/a> distraction can make sustained concentration more difficult, lowering measured productivity rather than raising it.", "bodyPlain": "Helena Kowalczyk has identified a negative correlation between the number of open-plan seating areas a company adds to its office and that company's employee-reported focus and productivity. This may appear counterintuitive—open floor plans are often expected to boost collaboration and efficiency—but Kowalczyk notes that the resulting rise in ambient noise and visual distraction can make sustained concentration more difficult, lowering measured productivity rather than raising it.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "Helena Kowalczyk 發現，一家公司在辦公室增設的開放式座位區數量，與該公司員工自評的專注度與生產力之間呈負相關。這可能看起來違反直覺——開放式樓層設計通常被期待能促進合作與效率——但 Kowalczyk 指出，隨之而來的環境噪音與視覺干擾增加，可能使長時間專注更加困難，反而降低而非提高測得的生產力。", "opts": {"A": "Although it may seem surprising that productivity falls as open-plan seating increases, that decline happens because companies use open plans mainly to reduce office space costs.", "B": "Although companies tend to become less collaborative as open-plan seating increases, this change may not occur if employees are given noise-canceling headphones.", "C": "Although one might expect productivity to rise as open-plan seating boosts collaboration, the opposite happens because increased noise and visual distraction make sustained concentration more difficult.", "D": "Although companies tend to avoid adding open-plan seating in departments with high existing productivity, additions may increase significantly as those departments' productivity declines."}, "optsZh": {"A": "雖然隨著開放式座位增加，生產力下降似乎令人意外，但這種下降是因為公司採用開放式設計主要是為了降低辦公空間成本。", "B": "雖然隨著開放式座位增加，公司往往變得較不重視合作，但若員工配有降噪耳機，這種變化可能不會發生。", "C": "雖然一般會預期隨著開放式座位促進合作，生產力會上升，但實際情況正好相反，因為噪音與視覺干擾增加，使長時間專注更加困難。", "D": "雖然公司往往避免在現有生產力高的部門增設開放式座位，但隨著這些部門生產力下降，增設可能會大幅增加。"}, "answer": "C", "expl": "Choice C states the counterintuitive relationship and the mechanism (noise and distraction) that explains it.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomer\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomer\" data-pos=\"n.\" data-en=\"a scientist who studies stars and planets\" data-zh=\"天文學家\">astronomers<\/a> searching for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extraterrestrial\" target=\"_blank\" rel=\"noopener\" data-w=\"extraterrestrial\" data-pos=\"adj.\" data-en=\"coming from or existing outside Earth\" data-zh=\"地球以外的；外星的\">extraterrestrial<\/a> life have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> NH3 (ammonia) can serve as a biosignature gas—an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH3 likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini-Neptunes—gas planets smaller than Neptune but with atmospheres similar to Neptune&#x27;s—atmospheric pressure and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> can be high enough to produce atmospheric NH3.", "bodyPlain": "Some astronomers searching for extraterrestrial life have proposed that atmospheric NH3 (ammonia) can serve as a biosignature gas—an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH3 likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini-Neptunes—gas planets smaller than Neptune but with atmospheres similar to Neptune's—atmospheric pressure and temperature can be high enough to produce atmospheric NH3.", "stem": "Based on the text, Huang, Seager, and colleagues would most likely agree with which statement about atmospheric NH3?", "stemZh": "根據本文，Huang、Seager 與同事最可能同意下列哪一項關於大氣中 NH3 的敘述？", "bodyZh": "一些尋找外星生命的天文學家提出，大氣中的 NH3（氨）可以作為生物標記氣體——也就是一顆行星有生命存在的跡象。Jingcheng Huang、Sara Seager 與同事評估了這個可能性，發現在岩石行星上，若沒有生物活動，大氣中的 NH3 很可能無法達到可偵測的高濃度。但團隊也發現，在所謂的迷你海王星——比海王星小、但大氣與海王星相似的氣體行星——上，大氣壓力與溫度可能高到足以產生大氣中的 NH3。", "opts": {"A": "Its presence is more likely to indicate that a planet is a mini-Neptune than that the planet is a rocky planet that could support life.", "B": "Its absence from a planet that's not a mini-Neptune indicates that the planet probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a mini-Neptune.", "D": "It doesn't reliably reach high enough concentrations in the atmospheres of rocky planets or mini-Neptunes to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該行星是迷你海王星，而不是能支持生命的岩石行星。", "B": "非迷你海王星的行星上若沒有它，表示該行星可能沒有生命。", "C": "若在岩石行星的大氣中偵測到它，應視為生物標記氣體；若在迷你海王星的大氣中偵測到則不應。", "D": "它在岩石行星或迷你海王星的大氣中都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "On rocky planets NH3 likely needs life to build up, but on mini-Neptunes it can form without life, so it is a biosignature only on rocky planets.", "explZh": "在岩石行星上，氨氣大概需要生命才能累積；在迷你海王星上則可自然生成，因此只有在岩石行星上才能視為生命跡象。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> phosphine can serve as a biosignature gas—an indication that a planet harbors life. Elena Marchetti and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated this possibility, finding that on small rocky planets, atmospheric phosphine likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on gas giants with deep, high-pressure atmospheres, phosphine can form abiotically under extreme <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> and pressure alone.", "bodyPlain": "Some astrobiologists have proposed that atmospheric phosphine can serve as a biosignature gas—an indication that a planet harbors life. Elena Marchetti and colleagues evaluated this possibility, finding that on small rocky planets, atmospheric phosphine likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on gas giants with deep, high-pressure atmospheres, phosphine can form abiotically under extreme temperature and pressure alone.", "stem": "Based on the text, Marchetti and colleagues would most likely agree with which statement about atmospheric phosphine?", "stemZh": "根據本文，Marchetti 與同事最可能同意下列哪一項關於大氣中磷化氫的敘述？", "bodyZh": "一些天體生物學家提出，大氣中的磷化氫可以作為生物標記氣體——也就是一顆行星有生命存在的跡象。Elena Marchetti 與同事評估了這個可能性，發現在小型岩石行星上，若沒有生物活動，大氣中的磷化氫很可能無法達到可偵測的高濃度。但團隊也發現，在擁有深厚高壓大氣的氣體巨行星上，磷化氫光靠極端的溫度與壓力就能以非生物方式形成。", "opts": {"A": "Its presence is more likely to indicate that a planet is a gas giant than that the planet is a rocky planet that could support life.", "B": "Its absence from a planet that's not a gas giant indicates that the planet probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a gas giant.", "D": "It doesn't reliably reach high enough concentrations in the atmospheres of rocky planets or gas giants to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該行星是氣體巨行星，而不是能支持生命的岩石行星。", "B": "非氣體巨行星的行星上若沒有它，表示該行星可能沒有生命。", "C": "若在岩石行星的大氣中偵測到它，應視為生物標記氣體；若在氣體巨行星的大氣中偵測到則不應。", "D": "它在岩石行星或氣體巨行星的大氣中都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "Since phosphine can form without life only on gas giants, it is reliable evidence of life only when found on rocky planets.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> methyl chloride can serve as a biosignature gas. Dara Osei and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated this possibility, finding that on small rocky planets orbiting quiet stars, atmospheric methyl chloride likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets orbiting highly active, flaring stars, methyl chloride can form abiotically through intense stellar radiation <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> the atmosphere.", "bodyPlain": "Some astrobiologists have proposed that atmospheric methyl chloride can serve as a biosignature gas. Dara Osei and colleagues evaluated this possibility, finding that on small rocky planets orbiting quiet stars, atmospheric methyl chloride likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets orbiting highly active, flaring stars, methyl chloride can form abiotically through intense stellar radiation striking the atmosphere.", "stem": "Based on the text, Osei and colleagues would most likely agree with which statement about atmospheric methyl chloride?", "stemZh": "根據本文，Osei 與同事最可能同意下列哪一項關於大氣中氯甲烷的敘述？", "bodyZh": "一些天體生物學家提出，大氣中的氯甲烷可以作為生物標記氣體。Dara Osei 與同事評估了這個可能性，發現在環繞平靜恆星的小型岩石行星上，若沒有生物活動，大氣中的氯甲烷很可能無法達到可偵測的高濃度。但團隊也發現，在環繞高度活躍、經常閃焰之恆星的岩石行星上，氯甲烷可以透過強烈的恆星輻射撞擊大氣而以非生物方式形成。", "opts": {"A": "Its presence is more likely to indicate that a planet orbits a flaring star than that the planet could support life.", "B": "Its absence from a planet orbiting a quiet star indicates that the planet probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected around a quiet star but not if detected around a highly active, flaring star.", "D": "It doesn't reliably reach high enough concentrations around either quiet or flaring stars to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該行星環繞閃焰恆星，而不是該行星能支持生命。", "B": "環繞平靜恆星的行星上若沒有它，表示該行星可能沒有生命。", "C": "若在平靜恆星周圍偵測到它，應視為生物標記氣體；若在高度活躍、會閃焰的恆星周圍偵測到則不應。", "D": "它在平靜恆星或閃焰恆星周圍都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "Since methyl chloride can form without life only around flaring stars, it is reliable evidence of life only around quiet stars.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> dimethyl sulfide can serve as a biosignature gas. Jorge Villalobos and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated this possibility, finding that on planets with thin, oxygen-poor atmospheres, atmospheric dimethyl sulfide likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on planets with thick, sulfur-rich <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> atmospheres, dimethyl sulfide can form abiotically through ongoing volcanic outgassing alone.", "bodyPlain": "Some astrobiologists have proposed that atmospheric dimethyl sulfide can serve as a biosignature gas. Jorge Villalobos and colleagues evaluated this possibility, finding that on planets with thin, oxygen-poor atmospheres, atmospheric dimethyl sulfide likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on planets with thick, sulfur-rich volcanic atmospheres, dimethyl sulfide can form abiotically through ongoing volcanic outgassing alone.", "stem": "Based on the text, Villalobos and colleagues would most likely agree with which statement about atmospheric dimethyl sulfide?", "stemZh": "根據本文，Villalobos 與同事最可能同意下列哪一項關於大氣中二甲基硫的敘述？", "bodyZh": "一些天體生物學家提出，大氣中的二甲基硫可以作為生物標記氣體。Jorge Villalobos 與同事評估了這個可能性，發現在大氣稀薄、缺氧的行星上，若沒有生物活動，大氣中的二甲基硫很可能無法達到可偵測的高濃度。但團隊也發現，在擁有濃厚、富含硫之火山大氣的行星上，二甲基硫光靠持續的火山排氣就能以非生物方式形成。", "opts": {"A": "Its presence is more likely to indicate that a planet is volcanically active than that the planet could support life.", "B": "Its absence from a planet without a sulfur-rich atmosphere indicates that the planet probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected in a thin, oxygen-poor atmosphere but not if detected in a thick, sulfur-rich volcanic atmosphere.", "D": "It doesn't reliably reach high enough concentrations in either type of atmosphere to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該行星火山活躍，而不是該行星能支持生命。", "B": "沒有富含硫之大氣的行星上若沒有它，表示該行星可能沒有生命。", "C": "若在稀薄、缺氧的大氣中偵測到它，應視為生物標記氣體；若在濃厚、富含硫的火山大氣中偵測到則不應。", "D": "它在兩種大氣中都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "Since dimethyl sulfide can form without life only in sulfur-rich volcanic atmospheres, it is reliable evidence of life only in oxygen-poor ones.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> nitrous oxide can serve as a biosignature gas. Priya Deshmukh and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated this possibility, finding that on temperate rocky planets, atmospheric nitrous oxide likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets subjected to frequent large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=asteroid\" target=\"_blank\" rel=\"noopener\" data-w=\"asteroid\" data-pos=\"n.\" data-en=\"a small rocky object that orbits the Sun\" data-zh=\"小行星\">asteroid<\/a> impacts, nitrous oxide can form abiotically through the intense heat and chemical shock of repeated collisions.", "bodyPlain": "Some astrobiologists have proposed that atmospheric nitrous oxide can serve as a biosignature gas. Priya Deshmukh and colleagues evaluated this possibility, finding that on temperate rocky planets, atmospheric nitrous oxide likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on rocky planets subjected to frequent large asteroid impacts, nitrous oxide can form abiotically through the intense heat and chemical shock of repeated collisions.", "stem": "Based on the text, Deshmukh and colleagues would most likely agree with which statement about atmospheric nitrous oxide?", "stemZh": "根據本文，Deshmukh 與同事最可能同意下列哪一項關於大氣中一氧化二氮的敘述？", "bodyZh": "一些天體生物學家提出，大氣中的一氧化二氮可以作為生物標記氣體。Priya Deshmukh 與同事評估了這個可能性，發現在溫和的岩石行星上，若沒有生物活動，大氣中的一氧化二氮很可能無法達到可偵測的高濃度。但團隊也發現，在經常遭受大型小行星撞擊的岩石行星上，一氧化二氮可以透過反覆撞擊的高熱與化學衝擊而以非生物方式形成。", "opts": {"A": "Its presence is more likely to indicate that a planet experiences frequent impacts than that the planet could support life.", "B": "Its absence from a planet with few impacts indicates that the planet probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected on a temperate planet but not if detected on a planet with frequent large impacts.", "D": "It doesn't reliably reach high enough concentrations on either type of planet to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該行星經常遭受撞擊，而不是該行星能支持生命。", "B": "很少遭受撞擊的行星上若沒有它，表示該行星可能沒有生命。", "C": "若在溫和的行星上偵測到它，應視為生物標記氣體；若在經常遭受大型撞擊的行星上偵測到則不應。", "D": "它在兩種行星上都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "Since nitrous oxide can form without life only on frequently impacted planets, it is reliable evidence of life only on temperate ones.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Inferences: agree with a conditional statement about when a compound should be treated as a reliable indicator, given where it can also form without biology.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> have proposed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> ethane can serve as a biosignature gas. Soren Lindqvist and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated this possibility, finding that on rocky planets with liquid-water oceans, atmospheric ethane likely couldn&#x27;t reach detectably high levels in the absence of biological activity. But the team also found that on icy moons with subsurface methane lakes, ethane can form abiotically through ultraviolet radiation breaking down methane in the upper atmosphere.", "bodyPlain": "Some astrobiologists have proposed that atmospheric ethane can serve as a biosignature gas. Soren Lindqvist and colleagues evaluated this possibility, finding that on rocky planets with liquid-water oceans, atmospheric ethane likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on icy moons with subsurface methane lakes, ethane can form abiotically through ultraviolet radiation breaking down methane in the upper atmosphere.", "stem": "Based on the text, Lindqvist and colleagues would most likely agree with which statement about atmospheric ethane?", "stemZh": "根據本文，Lindqvist 與同事最可能同意下列哪一項關於大氣中乙烷的敘述？", "bodyZh": "一些天體生物學家提出，大氣中的乙烷可以作為生物標記氣體。Soren Lindqvist 與同事評估了這個可能性，發現在擁有液態水海洋的岩石行星上，若沒有生物活動，大氣中的乙烷很可能無法達到可偵測的高濃度。但團隊也發現，在擁有地下甲烷湖的冰衛星上，乙烷可以透過紫外線在高層大氣分解甲烷而以非生物方式形成。", "opts": {"A": "Its presence is more likely to indicate that a body is an icy moon than that the body could support life.", "B": "Its absence from an icy moon indicates that the moon probably doesn't have life.", "C": "It should be treated as a biosignature gas if detected on a rocky, ocean-bearing planet but not if detected on an icy moon with methane lakes.", "D": "It doesn't reliably reach high enough concentrations on either body to be treated as a biosignature gas."}, "optsZh": {"A": "它的存在比較可能表示該天體是冰衛星，而不是該天體能支持生命。", "B": "冰衛星上若沒有它，表示該衛星可能沒有生命。", "C": "若在有海洋的岩石行星上偵測到它，應視為生物標記氣體；若在有甲烷湖的冰衛星上偵測到則不應。", "D": "它在兩種天體上都無法穩定達到足夠高的濃度，因此不能視為生物標記氣體。"}, "answer": "C", "expl": "Since ethane can form without life only on icy moons with methane lakes, it is reliable evidence of life only on ocean-bearing rocky planets.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> pressure at Earth&#x27;s surface, water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that TMAO reduces water&#x27;s compressibility.", "bodyPlain": "Under normal atmospheric pressure at Earth's surface, water molecules form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water's structure, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to hypothesize that TMAO reduces water's compressibility.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在地表的正常大氣壓力下，水分子會形成四面體網絡，並由相鄰分子間的氫鍵穩定。極高的壓力（例如深海中的壓力）會破壞這些鍵並壓縮水的結構，使生物體內的水分子滲入蛋白質，妨礙重要的生物功能；然而，被稱為嗜壓菌（嗜壓生物）的深海生物已經適應了極端壓力。研究發現，各種嗜壓生物棲息的深度，與其肌肉組織中一種稱為氧化三甲胺（TMAO）之化合物的濃度呈正相關，這使一支研究團隊提出假設：TMAO 會降低水的可壓縮性。", "opts": {"A": "Water molecules are found to be impervious to TMAO even when the water molecules' tetrahedral configuration has been distorted by high pressure.", "B": "Examination of TMAO's molecular structure shows that TMAO molecules retain their shape even as pressure increases.", "C": "A positive correlation is found between concentrations of TMAO and the rate at which water's molecular structure compresses as pressure increases.", "D": "Analysis of water's molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not."}, "optsZh": {"A": "研究發現，即使水分子的四面體構造已因高壓而扭曲，它們仍不受 TMAO 影響。", "B": "檢視 TMAO 的分子結構顯示，即使壓力增加，TMAO 分子仍保持其形狀。", "C": "研究發現 TMAO 濃度與水的分子結構隨壓力增加而被壓縮的速率呈正相關。", "D": "分析高壓下水的分子結構顯示，有 TMAO 時氫鍵比沒有時更穩定。"}, "answer": "D", "expl": "If hydrogen bonds stay more stable with TMAO, water resists compression, directly supporting the idea that TMAO reduces compressibility.", "explZh": "若有 TMAO 時氫鍵更穩定，水就較不易被壓縮，直接支持「TMAO 降低水的可壓縮性」的假設。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> pressure, cell membranes maintain a flexible, semi-fluid lipid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Extreme cold, such as found in polar waters, rigidifies this structure and can impair nutrient transport across the membrane; yet cold-adapted fish have evolved to survive these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>. Studies have found a positive correlation between the depths at which various cold-adapted fish live and concentrations of unsaturated fatty acids in their cell membranes, leading a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that these fatty acids reduce the membrane&#x27;s tendency to stiffen in the cold.", "bodyPlain": "Under normal atmospheric pressure, cell membranes maintain a flexible, semi-fluid lipid structure. Extreme cold, such as found in polar waters, rigidifies this structure and can impair nutrient transport across the membrane; yet cold-adapted fish have evolved to survive these temperatures. Studies have found a positive correlation between the depths at which various cold-adapted fish live and concentrations of unsaturated fatty acids in their cell membranes, leading a team of researchers to hypothesize that these fatty acids reduce the membrane's tendency to stiffen in the cold.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在正常大氣壓力下，細胞膜維持一種柔軟、半流動的脂質結構。極度寒冷（例如極地海水中）會使這個結構變得僵硬，並可能妨礙養分穿越細胞膜的運輸；然而，適應寒冷的魚類已經演化出在這種溫度下存活的能力。研究發現，各種耐寒魚類生活的深度，與其細胞膜中不飽和脂肪酸的濃度呈正相關，使一支研究團隊提出假設：這些脂肪酸會降低細胞膜在寒冷中變硬的傾向。", "opts": {"A": "Membrane lipids are found to be unaffected by unsaturated fatty acids even when the lipids' arrangement has been altered by low temperature.", "B": "Examination of unsaturated fatty acids' molecular structure shows that they retain their shape even as temperature decreases.", "C": "A positive correlation is found between concentrations of unsaturated fatty acids and the rate at which membrane lipids stiffen as temperature decreases.", "D": "Analysis of membrane structure at low temperature reveals that lipids remain more flexible when unsaturated fatty acids are present than when they are not."}, "optsZh": {"A": "研究發現，即使膜脂質的排列已因低溫而改變，它們仍不受不飽和脂肪酸影響。", "B": "檢視不飽和脂肪酸的分子結構顯示，即使溫度降低，它們仍保持其形狀。", "C": "研究發現不飽和脂肪酸濃度與膜脂質隨溫度降低而變硬的速率呈正相關。", "D": "分析低溫下細胞膜的結構顯示，有不飽和脂肪酸時脂質比沒有時更柔軟。"}, "answer": "D", "expl": "Direct evidence that the membrane stays more flexible with the fatty acids present most directly supports the hypothesis.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal soil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>, plant root cell walls maintain a semi-rigid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> that allows for steady water uptake. Extreme <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=salinity\" target=\"_blank\" rel=\"noopener\" data-w=\"salinity\" data-pos=\"n.\" data-en=\"the amount of salt in water\" data-zh=\"鹽度\">salinity<\/a>, such as found in coastal floodplains, destabilizes this structure and can impair water absorption; yet certain salt-tolerant grasses have adapted to these conditions. Studies have found a positive correlation between the salinity levels grasses tolerate and concentrations of a compound called glycine betaine in their root cells, leading a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that glycine betaine reduces the cell wall&#x27;s vulnerability to salt-induced damage.", "bodyPlain": "Under normal soil conditions, plant root cell walls maintain a semi-rigid structure that allows for steady water uptake. Extreme salinity, such as found in coastal floodplains, destabilizes this structure and can impair water absorption; yet certain salt-tolerant grasses have adapted to these conditions. Studies have found a positive correlation between the salinity levels grasses tolerate and concentrations of a compound called glycine betaine in their root cells, leading a team of researchers to hypothesize that glycine betaine reduces the cell wall's vulnerability to salt-induced damage.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在正常土壤條件下，植物根部的細胞壁維持半剛性的結構，使其能穩定吸收水分。極高的鹽度（例如沿海洪泛平原）會破壞這個結構，並可能妨礙水分吸收；然而，某些耐鹽禾草已經適應了這種環境。研究發現，禾草能耐受的鹽度，與其根部細胞中一種稱為甘胺酸甜菜鹼之化合物的濃度呈正相關，使一支研究團隊提出假設：甘胺酸甜菜鹼會降低細胞壁受鹽分損害的脆弱性。", "opts": {"A": "Root cell walls are found to be unaffected by glycine betaine even when the walls' structure has been altered by high salinity.", "B": "Examination of glycine betaine's molecular structure shows that it retains its shape even as salinity increases.", "C": "A positive correlation is found between concentrations of glycine betaine and the rate at which cell walls become damaged as salinity increases.", "D": "Analysis of root cell structure under high salinity reveals that cell walls remain more stable when glycine betaine is present than when it is not."}, "optsZh": {"A": "研究發現，即使根部細胞壁的結構已因高鹽度而改變，它們仍不受甘胺酸甜菜鹼影響。", "B": "檢視甘胺酸甜菜鹼的分子結構顯示，即使鹽度增加，它仍保持其形狀。", "C": "研究發現甘胺酸甜菜鹼濃度與細胞壁隨鹽度增加而受損的速率呈正相關。", "D": "分析高鹽度下根部細胞的結構顯示，有甘胺酸甜菜鹼時細胞壁比沒有時更穩定。"}, "answer": "D", "expl": "Direct evidence that the cell wall stays more stable with glycine betaine present most directly supports the hypothesis.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>, insect cuticle maintains a hardened, protective <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Extreme heat, such as found during heat waves, softens this structure and can leave insects vulnerable
