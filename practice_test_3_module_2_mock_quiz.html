vironment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "her religious imagery has been the focus of many critics, who", "B": "the focus of many critics has been her religious imagery; they", "C": "many critics have focused on her religious imagery but", "D": "there are many critics who focused on her religious imagery, but they"}, "optsZh": {"A": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "D": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "C", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "Based on genetic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> have generally agreed that reindeer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=domestication\" target=\"_blank\" rel=\"noopener\" data-w=\"domestication\" data-pos=\"n.\" data-en=\"the process of taming animals or plants for human use\" data-zh=\"馴化\">domestication<\/a> began in the eleventh century CE. However, since uncovering <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> of a 2,000-year-old reindeer training harness in northern Siberia, ______ may have begun much earlier.", "bodyPlain": "Based on genetic evidence, archaeologists have generally agreed that reindeer domestication began in the eleventh century CE. However, since uncovering fragments of a 2,000-year-old reindeer training harness in northern Siberia, ______ may have begun much earlier.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "根據遺傳證據，考古學家普遍同意，馴鹿的馴化始於西元十一世紀。然而，自從在西伯利亞北部發掘出一副有兩千年歷史的馴鹿訓練挽具碎片後，______ 可能早得多就已開始。", "opts": {"A": "researcher Robert Losey has argued that domestication", "B": "researcher Robert Losey's argument is that domestication", "C": "domestication, researcher Robert Losey has argued,", "D": "the argument researcher Robert Losey has made is that domestication"}, "optsZh": {"A": "researcher Robert Losey has argued that domestication（主詞 researcher Robert Losey 是 uncovering 的邏輯主詞：正確）", "B": "researcher Robert Losey's argument is that domestication（主詞 argument 不能作 uncovering 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "domestication, researcher Robert Losey has argued,（主詞 domestication 不能作 uncovering 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "the argument researcher Robert Losey has made is that domestication（主詞 the argument 不能作 uncovering 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "A", "expl": "The person who uncovered the harness must follow the modifier 'since uncovering...,' so the subject must be 'researcher Robert Losey.'", "explZh": "挖出馬具碎片的人必須緊接在「since uncovering...」之後，所以主詞應是「researcher Robert Losey」。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "having used", "B": "have used", "C": "to use", "D": "using"}, "optsZh": {"A": "having used（分詞 → 句子缺少主要動詞：錯誤）", "B": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）", "C": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "D": "using（現在分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects,", "B": "effects but", "C": "effects, but", "D": "effects"}, "optsZh": {"A": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "effects but（but 前缺少逗號：錯誤）", "C": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "D": "effects（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "C", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "proposes", "B": "was proposing", "C": "had proposed", "D": "proposed"}, "optsZh": {"A": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "B": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "C": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "D": "proposed（一般過去式，與前句 recommended 時態一致：正確）"}, "answer": "D", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects producing", "B": "insects; producing", "C": "insects, producing", "D": "insects. Producing"}, "optsZh": {"A": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "B": "insects; producing（分號後不是獨立子句：錯誤）", "C": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "D": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）"}, "answer": "C", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "many critics have focused on her religious imagery but", "B": "her religious imagery has been the focus of many critics, who", "C": "the focus of many critics has been her religious imagery; they", "D": "there are many critics who focused on her religious imagery, but they"}, "optsZh": {"A": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "B": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "A", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "Hegra is an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> remains\" data-zh=\"考古的\">archaeological<\/a> site in present-day Saudi Arabia and was the second largest city of the Nabataean Kingdom (fourth century BCE to first century CE). Archaeologist Laila Nehme recently traveled to Hegra to study its ancient ______ into the rocky <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=outcrop\" target=\"_blank\" rel=\"noopener\" data-w=\"outcrop\" data-pos=\"n.\" data-en=\"rock that sticks out above the ground\" data-zh=\"露出地面的岩層\">outcrops<\/a> of a vast desert, these burial chambers seem to blend <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seamlessly\" target=\"_blank\" rel=\"noopener\" data-w=\"seamlessly\" data-pos=\"adv.\" data-en=\"smoothly, without obvious breaks\" data-zh=\"天衣無縫地\">seamlessly<\/a> with nature.", "bodyPlain": "Hegra is an archaeological site in present-day Saudi Arabia and was the second largest city of the Nabataean Kingdom (fourth century BCE to first century CE). Archaeologist Laila Nehme recently traveled to Hegra to study its ancient ______ into the rocky outcrops of a vast desert, these burial chambers seem to blend seamlessly with nature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Hegra 是位於現今沙烏地阿拉伯的一處考古遺址，曾是納巴泰王國（西元前四世紀至西元一世紀）的第二大城市。考古學家 Laila Nehme 最近前往 Hegra，研究其古老的 ______ 鑿入廣闊沙漠中的岩石露頭，這些墓室似乎與大自然渾然融為一體。", "opts": {"A": "tombs. Built", "B": "tombs, built", "C": "tombs and built", "D": "tombs built"}, "optsZh": {"A": "tombs. Built（句號結束前句，Built 引導的分詞片語修飾下一句的主詞：正確）", "B": "tombs, built（逗號 → 分詞片語之後的獨立子句造成逗號連接錯誤：錯誤）", "C": "tombs and built（and 連接 → 後面變成沒有主詞的動詞片語，句子結構錯誤：錯誤）", "D": "tombs built（無標點 → 兩個句子連在一起成為連寫句：錯誤）"}, "answer": "A", "expl": "'Archaeologist ... tombs' is a complete sentence; a period ends it, and 'Built into the rocky outcrops...' begins a new sentence modifying 'these burial chambers.'", "explZh": "「Archaeologist ... tombs」已是完整句子，用句號結束；「Built into the rocky outcrops...」開始新的句子，修飾後面的「these burial chambers」。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "have used", "B": "having used", "C": "using", "D": "to use"}, "optsZh": {"A": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）", "B": "having used（分詞 → 句子缺少主要動詞：錯誤）", "C": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "D": "to use（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects", "B": "effects,", "C": "effects but", "D": "effects, but"}, "optsZh": {"A": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "effects but（but 前缺少逗號：錯誤）", "D": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposes", "C": "was proposing", "D": "proposed"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "C": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "D": "proposed（一般過去式，與前句 recommended 時態一致：正確）"}, "answer": "D", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects producing", "B": "insects, producing", "C": "insects. Producing", "D": "insects; producing"}, "optsZh": {"A": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "B": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "C": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "D": "insects; producing（分號後不是獨立子句：錯誤）"}, "answer": "B", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: sentence boundary and participial phrase.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "her religious imagery has been the focus of many critics, who", "B": "there are many critics who focused on her religious imagery, but they", "C": "many critics have focused on her religious imagery but", "D": "the focus of many critics has been her religious imagery; they"}, "optsZh": {"A": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "D": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "C", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "When external forces are applied to common glass made from silicates, energy builds up around <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=minuscule\" target=\"_blank\" rel=\"noopener\" data-w=\"minuscule\" data-pos=\"adj.\" data-en=\"extremely small\" data-zh=\"極小的\">minuscule<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=defect\" target=\"_blank\" rel=\"noopener\" data-w=\"defect\" data-pos=\"n.\" data-en=\"a flaw or fault\" data-zh=\"缺陷\">defects<\/a> in the material, resulting in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fractures<\/a>. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical ______ to make a glassy solid that can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstand<\/a> higher strain than silicate glass can before fracturing.", "bodyPlain": "When external forces are applied to common glass made from silicates, energy builds up around minuscule defects in the material, resulting in fractures. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical ______ to make a glassy solid that can withstand higher strain than silicate glass can before fracturing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "當外力施加在由矽酸鹽製成的普通玻璃上時，能量會在材料中的微小缺陷周圍累積，進而導致破裂。最近，芬蘭坦佩雷大學的工程師 Erkka Frankberg 使用化學 ______ 製造出一種玻璃狀固體，在破裂前能承受比矽酸鹽玻璃更大的應變。", "opts": {"A": "compound, aluminum oxide", "B": "compound aluminum oxide,", "C": "compound, aluminum oxide,", "D": "compound aluminum oxide"}, "optsZh": {"A": "compound, aluminum oxide（只有前逗號，缺少後逗號：錯誤）", "B": "compound aluminum oxide,（同位語後多了逗號 → 隔開動詞與 to 不定詞：錯誤）", "C": "compound, aluminum oxide,（以逗號將必要的同位語當成非限定插入語：錯誤）", "D": "compound aluminum oxide（限定性同位語，不加逗號：正確）"}, "answer": "D", "expl": "'Aluminum oxide' is a restrictive appositive that identifies which compound, so no commas are used.", "explZh": "「aluminum oxide」是限定性同位語，說明是哪一種化合物，所以不用逗號。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "to use", "C": "having used", "D": "have used"}, "optsZh": {"A": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects but", "B": "effects, but", "C": "effects", "D": "effects,"}, "optsZh": {"A": "effects but（but 前缺少逗號：錯誤）", "B": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "C": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "B", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposes", "C": "proposed", "D": "was proposing"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "C": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "D": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）"}, "answer": "C", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects; producing", "B": "insects producing", "C": "insects, producing", "D": "insects. Producing"}, "optsZh": {"A": "insects; producing（分號後不是獨立子句：錯誤）", "B": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "C": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "D": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）"}, "answer": "C", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Standard English: appositive punctuation.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "many critics have focused on her religious imagery but", "B": "the focus of many critics has been her religious imagery; they", "C": "there are many critics who focused on her religious imagery, but they", "D": "her religious imagery has been the focus of many critics, who"}, "optsZh": {"A": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "B": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "A", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "Etched into Peru&#x27;s Nazca Desert are line drawings so large that they can only be fully seen from high above. <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">Archaeologists<\/a> have known of the lines since the 1920s, when a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> spotted some from a nearby foothill, and they have been studying the markings ever since. ______ archaeologists&#x27; efforts are aided by drones that capture high-resolution aerial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> of the lines.", "bodyPlain": "Etched into Peru's Nazca Desert are line drawings so large that they can only be fully seen from high above. Archaeologists have known of the lines since the 1920s, when a researcher spotted some from a nearby foothill, and they have been studying the markings ever since. ______ archaeologists' efforts are aided by drones that capture high-resolution aerial photographs of the lines.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "秘魯的納斯卡沙漠上刻有巨大的線條圖案，大到只有從高空才能看見全貌。考古學家自 1920 年代起就知道這些線條的存在，當時一位研究人員從附近的山麓丘陵上發現了其中一些，從那時起他們便一直在研究這些圖案。______ 考古學家的工作有了無人機的協助，無人機能拍攝這些線條的高解析度空拍照片。", "opts": {"A": "Currently,", "B": "In comparison,", "C": "Still,", "D": "However,"}, "optsZh": {"A": "Currently,（目前：表現在的情況，正確）", "B": "In comparison,（相較之下：表比較）", "C": "Still,（儘管如此：表讓步轉折）", "D": "However,（然而：表轉折）"}, "answer": "A", "expl": "After describing study since the 1920s, the text moves to how archaeologists work now, so 'Currently' fits.", "explZh": "前文說明自 1920 年代以來的研究，接著談到現今的做法，所以用「Currently」（目前）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For decades, conservators examined the faded mural using handheld magnifiers and ordinary photographs. ______ they can now rely on multispectral imaging, which reveals pigments and preliminary sketches that are invisible to the unaided eye.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For decades, conservators examined the faded mural using handheld magnifiers and ordinary photographs. ______ they can now rely on multispectral imaging, which reveals pigments and preliminary sketches that are invisible to the unaided eye.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數十年來，修復師一直使用手持放大鏡和普通照片來檢視這幅褪色的壁畫。______ 他們現在可以仰賴多光譜影像，這種技術能揭露肉眼看不見的顏料和初步草稿。", "opts": {"A": "By contrast,", "B": "Currently,", "C": "However,", "D": "Still,"}, "optsZh": {"A": "By contrast,（相對地：表對比）", "B": "Currently,（目前：表現在的情況，正確）", "C": "However,（然而：表轉折）", "D": "Still,（儘管如此：表讓步轉折）"}, "answer": "B", "expl": "Currently introduces a present-day development after historical background.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Researchers first mapped the cave system in the 1960s, when surveyors used compasses and measuring tapes. ______ teams use laser scanners to create detailed three-dimensional models of the same passages.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Researchers first mapped the cave system in the 1960s, when surveyors used compasses and measuring tapes. ______ teams use laser scanners to create detailed three-dimensional models of the same passages.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。研究人員最早在 1960 年代繪製這個洞穴系統的地圖，當時測量人員使用的是指南針和捲尺。______ 研究團隊使用雷射掃描儀，為同樣的通道建立詳細的三維模型。", "opts": {"A": "Today,", "B": "Nevertheless,", "C": "For example,", "D": "Meanwhile,"}, "optsZh": {"A": "Today,（如今：表現在的情況，正確）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "For example,（例如：表舉例）", "D": "Meanwhile,（同時、與此同時：表同時發生）"}, "answer": "A", "expl": "Today signals the current method.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Linguists have studied the inscription since its discovery in 1912, relying for many years on hand copies and photographs. ______ digital imaging allows scholars to examine shallow marks that were previously difficult to see.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists have studied the inscription since its discovery in 1912, relying for many years on hand copies and photographs. ______ digital imaging allows scholars to examine shallow marks that were previously difficult to see.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。自 1912 年發現這段銘文以來，語言學家就一直在研究它，多年來仰賴的是手抄本和照片。______ 數位影像讓學者能夠檢視先前難以看清的淺淺刻痕。", "opts": {"A": "In comparison,", "B": "Instead,", "C": "Even so,", "D": "Now,"}, "optsZh": {"A": "In comparison,（相較之下：表比較）", "B": "Instead,（反而、取而代之：表替代）", "C": "Even so,（即使如此：表讓步轉折）", "D": "Now,（如今：表現在的情況，正確）"}, "answer": "D", "expl": "Now marks a shift to current practice.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Archaeologists have cataloged the temple&#x27;s carvings for nearly a century. ______ drone photography helps them <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">document<\/a> carvings high on the walls without constructing scaffolding.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Archaeologists have cataloged the temple's carvings for nearly a century. ______ drone photography helps them document carvings high on the walls without constructing scaffolding.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。近一個世紀以來，考古學家一直在為這座神廟的雕刻編目。______ 無人機攝影幫助他們記錄牆面高處的雕刻，而不必搭建鷹架。", "opts": {"A": "On the contrary,", "B": "Although,", "C": "At present,", "D": "Likewise,"}, "optsZh": {"A": "On the contrary,（恰恰相反：表反駁前述說法）", "B": "Although,（雖然：為從屬連接詞，不能單獨加逗號作轉折詞）", "C": "At present,（目前：表現在的情況，正確）", "D": "Likewise,（同樣地：表相似）"}, "answer": "C", "expl": "At present introduces current assistance.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: current development after historical background.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Meteorologists began recording snowfall in the region in the 1890s, using simple gauges placed near railway stations. ______ satellites and automated sensors provide more continuous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> across remote mountain areas.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Meteorologists began recording snowfall in the region in the 1890s, using simple gauges placed near railway stations. ______ satellites and automated sensors provide more continuous measurements across remote mountain areas.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n氣象學家從 1890 年代開始記錄該地區的降雪量，使用的是放置在火車站附近的簡易量測器。______ 衛星和自動感測器能在偏遠山區提供更連續的測量數據。", "opts": {"A": "Still,", "B": "Similarly,", "C": "Despite this,", "D": "Currently,"}, "optsZh": {"A": "Still,（儘管如此：表讓步轉折）", "B": "Similarly,（同樣地：表相似）", "C": "Despite this,（儘管如此：表讓步轉折）", "D": "Currently,（目前：表現在的情況，正確）"}, "answer": "D", "expl": "Currently introduces modern tools.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "Archaeologist Sue Brunning <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explain\" target=\"_blank\" rel=\"noopener\" data-w=\"explain\" data-pos=\"v.\" data-en=\"to make something clear by giving reasons or details\" data-zh=\"解釋；說明\">explains<\/a> why the seventh-century ship <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=burial\" target=\"_blank\" rel=\"noopener\" data-w=\"burial\" data-pos=\"n.\" data-en=\"the act of putting a dead body in the ground\" data-zh=\"埋葬\">burial<\/a> site at Sutton Hoo in England was likely the tomb of a king. First, the gold <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artifact\" target=\"_blank\" rel=\"noopener\" data-w=\"artifact\" data-pos=\"n.\" data-en=\"an object made by people long ago\" data-zh=\"文物；人工製品\">artifacts<\/a> inside the ship suggest that the person buried with them was a wealthy and respected leader. ______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=massive\" target=\"_blank\" rel=\"noopener\" data-w=\"massive\" data-pos=\"adj.\" data-en=\"very large\" data-zh=\"巨大的\">massive<\/a> effort required to bury the ship would likely only have been undertaken for a king.", "bodyPlain": "Archaeologist Sue Brunning explains why the seventh-century ship burial site at Sutton Hoo in England was likely the tomb of a king. First, the gold artifacts inside the ship suggest that the person buried with them was a wealthy and respected leader. ______ the massive effort required to bury the ship would likely only have been undertaken for a king.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "考古學家 Sue Brunning 解釋了為什麼英格蘭 Sutton Hoo 那處七世紀的船葬遺址很可能是一位國王的墳墓。首先，船內的黃金文物顯示，與它們一同下葬的人是一位富有且受人敬重的領袖。______ 埋葬這艘船所需的龐大工程，很可能只會為一位國王而進行。", "opts": {"A": "Instead,", "B": "Still,", "C": "Specifically,", "D": "Second,"}, "optsZh": {"A": "Instead,（反而、取而代之：表替代）", "B": "Still,（儘管如此：表讓步轉折）", "C": "Specifically,（具體來說：表進一步說明細節）", "D": "Second,（第二：表列舉第二個理由，正確）"}, "answer": "D", "expl": "The sentence gives the second reason after 'First,' so 'Second' is logical.", "explZh": "前面有「First」，這句提出第二個理由，所以用「Second」。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" re
