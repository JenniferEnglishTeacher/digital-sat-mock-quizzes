<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 3, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 3, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanists<\/a>, a viburnum plant experiencing insect damage may develop erineum-a discolored, felty growth-on its leaf blades. A ______ viburnum plant, on the other hand, will have leaves with smooth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surfaces<\/a> and uniformly green <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coloration\" target=\"_blank\" rel=\"noopener\" data-w=\"coloration\" data-pos=\"n.\" data-en=\"the color pattern of an animal or plant\" data-zh=\"顏色；色彩圖案\">coloration<\/a>.", "bodyPlain": "According to botanists, a viburnum plant experiencing insect damage may develop erineum-a discolored, felty growth-on its leaf blades. A ______ viburnum plant, on the other hand, will have leaves with smooth surfaces and uniformly green coloration.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "據植物學家表示，遭受昆蟲危害的莢蒾植物，其葉片上可能會長出毛氈狀斑（erineum）——一種變色、毛氈般的增生組織。另一方面，一株 ______ 的莢蒾植物，其葉片表面會是光滑的，而且顏色均勻翠綠。", "opts": {"A": "struggling", "B": "beneficial", "C": "simple", "D": "healthy"}, "optsZh": {"A": "struggling（掙扎的；處境艱難的）", "B": "beneficial（有益的）", "C": "simple（簡單的）", "D": "healthy（健康的；健全的）"}, "answer": "D", "expl": "Unlike a plant with insect damage and discolored growth, this plant has smooth, uniformly green leaves, so it is 'healthy.'", "explZh": "與遭受蟲害、葉面長出變色毛氈狀組織的植株相對（on the other hand），這株植物葉面光滑、顏色均勻翠綠，所以是「healthy」（健康的）。", "defs": {"A": {"pos": "adj.", "en": "having difficulty surviving or doing well", "zh": "艱難掙扎的", "word": "struggling"}, "B": {"pos": "adj.", "en": "having a good or helpful effect", "zh": "有益的；有利的", "word": "beneficial"}, "C": {"pos": "adj.", "en": "plain or not complicated", "zh": "簡單的；樸素的", "word": "simple"}, "D": {"pos": "adj.", "en": "in good condition; not sick or damaged", "zh": "健康的；狀況良好的", "word": "healthy"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. After several weeks of drought stress, many seedlings displayed curled leaves and patchy discoloration, whereas a ______ specimen maintained firm stems and an even green surface, indicating that it had not suffered the same physiological damage.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. After several weeks of drought stress, many seedlings displayed curled leaves and patchy discoloration, whereas a ______ specimen maintained firm stems and an even green surface, indicating that it had not suffered the same physiological damage.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。在經歷數週的乾旱逆境後，許多幼苗出現葉片捲曲和斑駁變色的情形，而一株 ______ 的樣本卻保持莖部堅挺、表面均勻翠綠，顯示它並未遭受同樣的生理損害。", "opts": {"A": "healthy", "B": "ordinary", "C": "decorative", "D": "struggling"}, "optsZh": {"A": "healthy（健康的；健全的）", "B": "ordinary（普通的；平凡的）", "C": "decorative（裝飾性的）", "D": "struggling（掙扎的；處境艱難的）"}, "answer": "A", "expl": "Healthy means sound and not damaged.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "in good condition; not sick or damaged", "zh": "健康的；狀況良好的", "word": "healthy"}, "B": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "C": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "D": {"pos": "adj.", "en": "having difficulty surviving or doing well", "zh": "艱難掙扎的", "word": "struggling"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The conservator rejected the cracked ceramic fragment as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unsuitable\" target=\"_blank\" rel=\"noopener\" data-w=\"unsuitable\" data-pos=\"adj.\" data-en=\"not right for a purpose\" data-zh=\"不合適的\">unsuitable<\/a> for display beside the newly restored vessel; only the ______ example, with its glaze intact and no visible fractures, could illustrate the artist&#x27;s original technique.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The conservator rejected the cracked ceramic fragment as unsuitable for display beside the newly restored vessel; only the ______ example, with its glaze intact and no visible fractures, could illustrate the artist's original technique.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。修復師認為那塊有裂痕的陶瓷碎片不適合擺在新修復的器皿旁展示；只有那件 ______ 的樣品——釉面完好、沒有明顯裂痕——才能呈現藝術家原本的技法。", "opts": {"A": "fragile", "B": "beneficial", "C": "simple", "D": "intact"}, "optsZh": {"A": "fragile（脆弱的；易碎的）", "B": "beneficial（有益的）", "C": "simple（簡單的）", "D": "intact（完整的；未受損的）"}, "answer": "D", "expl": "Intact means complete and undamaged.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "B": {"pos": "adj.", "en": "having a good or helpful effect", "zh": "有益的；有利的", "word": "beneficial"}, "C": {"pos": "adj.", "en": "plain or not complicated", "zh": "簡單的；樸素的", "word": "simple"}, "D": {"pos": "adj.", "en": "complete and not damaged", "zh": "完整的；未受損的", "word": "intact"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The marine biologists noted that bleached coral colonies were increasingly common in the lagoon, but one reef remained relatively ______, showing vivid coloration and active growth despite the elevated water temperatures.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The marine biologists noted that bleached coral colonies were increasingly common in the lagoon, but one reef remained relatively ______, showing vivid coloration and active growth despite the elevated water temperatures.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。海洋生物學家指出，白化的珊瑚群落在潟湖中越來越常見，但有一處珊瑚礁仍相對 ______，儘管水溫升高，依然展現鮮豔的色彩並持續生長。", "opts": {"A": "minor", "B": "viable", "C": "unchanged", "D": "injured"}, "optsZh": {"A": "minor（次要的；輕微的）", "B": "viable（可存活的；可行的）", "C": "unchanged（未改變的）", "D": "injured（受傷的）"}, "answer": "B", "expl": "Viable means capable of living or surviving.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "small and not very important", "zh": "次要的；輕微的", "word": "minor"}, "B": {"pos": "adj.", "en": "able to live, grow, or work successfully", "zh": "能存活的；可行的", "word": "viable"}, "C": {"pos": "adj.", "en": "staying the same", "zh": "未改變的", "word": "unchanged"}, "D": {"pos": "adj.", "en": "hurt or harmed", "zh": "受傷的", "word": "injured"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The old <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> had water stains along several edges, but the library&#x27;s second copy was unusually ______: its pages were clean, its binding secure, and its ink still sharply legible.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The old manuscript had water stains along several edges, but the library's second copy was unusually ______: its pages were clean, its binding secure, and its ink still sharply legible.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。那份古老手稿有好幾處邊緣帶有水漬，但圖書館的第二份抄本卻異常 ______：紙頁乾淨、裝訂牢固，墨跡依然清晰可辨。", "opts": {"A": "pristine", "B": "damaged", "C": "confusing", "D": "valuable"}, "optsZh": {"A": "pristine（原始的；完好如初的）", "B": "damaged（受損的）", "C": "confusing（令人困惑的）", "D": "valuable（有價值的）"}, "answer": "A", "expl": "Pristine means in excellent original condition.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "in perfect condition, as if new or untouched", "zh": "原始的；完好如新的", "word": "pristine"}, "B": {"pos": "adj.", "en": "harmed or broken in some way", "zh": "受損的", "word": "damaged"}, "C": {"pos": "adj.", "en": "difficult to understand; unclear", "zh": "令人困惑的", "word": "confusing"}, "D": {"pos": "adj.", "en": "very useful or important; worth a lot", "zh": "有價值的；寶貴的", "word": "valuable"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: healthy, not damaged.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Researchers expected the transplanted grasses to wilt in the salty soil, yet several plots remained ______ throughout the summer, producing new shoots even during the hottest weeks.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers expected the transplanted grasses to wilt in the salty soil, yet several plots remained ______ throughout the summer, producing new shoots even during the hottest weeks.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n研究人員原本預期移植的草會在含鹽的土壤中枯萎，然而有好幾塊試驗地整個夏天都保持 ______，即使在最炎熱的幾週仍長出新芽。", "opts": {"A": "unusual", "B": "artificial", "C": "robust", "D": "simple"}, "optsZh": {"A": "unusual（不尋常的）", "B": "artificial（人工的；人造的）", "C": "robust（強健的；穩固的）", "D": "simple（簡單的）"}, "answer": "C", "expl": "Robust means strong and healthy.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not common or ordinary", "zh": "不尋常的", "word": "unusual"}, "B": {"pos": "adj.", "en": "made by people rather than occurring naturally", "zh": "人造的；人工的", "word": "artificial"}, "C": {"pos": "adj.", "en": "strong and healthy", "zh": "強健的；穩固的", "word": "robust"}, "D": {"pos": "adj.", "en": "plain or not complicated", "zh": "簡單的；樸素的", "word": "simple"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "Nigerian American author Teju Cole&#x27;s ______ his two passions-photography and the written word-culminates in his 2017 book, Blind Spot, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evocatively\" target=\"_blank\" rel=\"noopener\" data-w=\"evocatively\" data-pos=\"adv.\" data-en=\"in a way that brings strong images or feelings to mind\" data-zh=\"富有感染力地；引人聯想地\">evocatively<\/a> combines his original <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> from his travels with his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=poetic\" target=\"_blank\" rel=\"noopener\" data-w=\"poetic\" data-pos=\"adj.\" data-en=\"having the beauty or style of poetry\" data-zh=\"詩意的\">poetic<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prose\" target=\"_blank\" rel=\"noopener\" data-w=\"prose\" data-pos=\"n.\" data-en=\"ordinary written language, not poetry\" data-zh=\"散文；白話文\">prose<\/a>.", "bodyPlain": "Nigerian American author Teju Cole's ______ his two passions-photography and the written word-culminates in his 2017 book, Blind Spot, which evocatively combines his original photographs from his travels with his poetic prose.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "奈及利亞裔美國作家 Teju Cole 對他兩大熱愛——攝影與文字——的 ______，在他 2017 年的著作《Blind Spot》中達到巔峰；這本書以動人的方式，將他旅行時拍攝的原創照片與他詩意的散文結合在一起。", "opts": {"A": "indifference to", "B": "enthusiasm for", "C": "concern about", "D": "surprise at"}, "optsZh": {"A": "indifference to（對…漠不關心）", "B": "enthusiasm for（對…的熱情）", "C": "concern about（對…的擔憂）", "D": "surprise at（對…感到驚訝）"}, "answer": "B", "expl": "Cole's two 'passions' come together in a whole book, which shows strong interest, so 'enthusiasm for' fits.", "explZh": "文中稱攝影和寫作是 Cole 的兩大「熱情（passions）」，並結合成一本書，所以應選「enthusiasm for」（對……的熱忱）。", "defs": {"A": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}, "B": {"pos": "n. phr.", "en": "strong interest in and excitement about something", "zh": "對……的熱忱", "word": "enthusiasm for"}, "C": {"pos": "n. phr.", "en": "worry about something", "zh": "對……的擔憂", "word": "concern about"}, "D": {"pos": "n. phr.", "en": "a feeling caused by something unexpected", "zh": "對……感到驚訝", "word": "surprise at"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The critic argues that the architect&#x27;s ______ vernacular building traditions is evident in her careful study of local materials, roof forms, and courtyard arrangements, all of which reappear in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> designs.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The critic argues that the architect's ______ vernacular building traditions is evident in her careful study of local materials, roof forms, and courtyard arrangements, all of which reappear in her contemporary designs.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。這位評論家認為，這位建築師對地方傳統建築的 ______，從她對當地材料、屋頂形式和庭院配置的細心研究中可見一斑，而這些元素都再次出現在她的當代設計中。", "opts": {"A": "indifference to", "B": "departure from", "C": "anxiety about", "D": "enthusiasm for"}, "optsZh": {"A": "indifference to（對…漠不關心）", "B": "departure from（偏離；背離）", "C": "anxiety about（對…感到焦慮）", "D": "enthusiasm for（對…的熱情）"}, "answer": "D", "expl": "Enthusiasm for means strong interest in or excitement about something.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}, "B": {"pos": "n. phr.", "en": "a change away from a usual way or tradition", "zh": "背離；偏離", "word": "departure from"}, "C": {"pos": "n. phr.", "en": "a feeling of worry or nervousness about something", "zh": "對……的焦慮", "word": "anxiety about"}, "D": {"pos": "n. phr.", "en": "strong interest in and excitement about something", "zh": "對……的熱忱", "word": "enthusiasm for"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Although the historian was trained primarily as an economist, his ______ archival research led him to spend years examining diaries, shipping records, and court documents that earlier scholars had ignored.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Although the historian was trained primarily as an economist, his ______ archival research led him to spend years examining diaries, shipping records, and court documents that earlier scholars had ignored.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。雖然這位歷史學家主要受的是經濟學訓練，但他對檔案研究的 ______ 使他花了多年時間檢視先前學者忽略的日記、航運紀錄和法庭文件。", "opts": {"A": "separation from", "B": "doubt about", "C": "interest in", "D": "resistance to"}, "optsZh": {"A": "separation from（與…分離）", "B": "doubt about（對…的懷疑）", "C": "interest in（對…的興趣）", "D": "resistance to（對…的抗拒）"}, "answer": "C", "expl": "Interest in means active curiosity or concern.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "the state of being apart from something", "zh": "與……的分離", "word": "separation from"}, "B": {"pos": "n. phr.", "en": "a feeling of uncertainty about something", "zh": "對……的懷疑", "word": "doubt about"}, "C": {"pos": "n. phr.", "en": "a feeling of wanting to know or learn about something", "zh": "對……的興趣", "word": "interest in"}, "D": {"pos": "n. phr.", "en": "refusal to accept or be affected by something", "zh": "對……的抗拒", "word": "resistance to"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The documentary reveals the filmmaker&#x27;s ______ urban wildlife: she follows coyotes, hawks, and foxes through alleyways and parks with the attentiveness usually reserved for rarer species.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The documentary reveals the filmmaker's ______ urban wildlife: she follows coyotes, hawks, and foxes through alleyways and parks with the attentiveness usually reserved for rarer species.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這部紀錄片展現了這位導演對都市野生動物的 ______：她以通常只留給稀有物種的專注，跟隨郊狼、老鷹和狐狸穿梭於巷弄與公園之間。", "opts": {"A": "fascination with", "B": "avoidance of", "C": "mastery over", "D": "suspicion of"}, "optsZh": {"A": "fascination with（對…的著迷）", "B": "avoidance of（對…的迴避）", "C": "mastery over（對…的掌握、精通）", "D": "suspicion of（對…的懷疑）"}, "answer": "A", "expl": "Fascination with means intense interest in.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a very strong interest in something", "zh": "對……的著迷", "word": "fascination with"}, "B": {"pos": "n. phr.", "en": "the act of staying away from something on purpose", "zh": "對……的迴避", "word": "avoidance of"}, "C": {"pos": "n. phr.", "en": "complete control over or great skill with something", "zh": "對……的掌控、精通", "word": "mastery over"}, "D": {"pos": "n. phr.", "en": "a feeling of not trusting something", "zh": "對……的猜疑", "word": "suspicion of"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The poet&#x27;s ______ medieval astronomy shapes the collection&#x27;s imagery, which repeatedly invokes planetary motion, eclipses, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematical\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematical\" data-pos=\"adj.\" data-en=\"relating to mathematics\" data-zh=\"數學的\">mathematical<\/a> diagrams found in early star charts.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The poet's ______ medieval astronomy shapes the collection's imagery, which repeatedly invokes planetary motion, eclipses, and the mathematical diagrams found in early star charts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位詩人對中世紀天文學的 ______ 形塑了這本詩集的意象，詩中一再援引行星運行、日月食，以及早期星圖中的數學圖表。", "opts": {"A": "surprise at", "B": "preoccupation with", "C": "indifference to", "D": "concern about"}, "optsZh": {"A": "surprise at（對…感到驚訝）", "B": "preoccupation with（對…的專注、全神貫注）", "C": "indifference to（對…漠不關心）", "D": "concern about（對…的擔憂）"}, "answer": "B", "expl": "Preoccupation with means sustained and absorbing interest in.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a feeling caused by something unexpected", "zh": "對……感到驚訝", "word": "surprise at"}, "B": {"pos": "n. phr.", "en": "a state of thinking about something so much that other things are ignored", "zh": "對……的專注、執著", "word": "preoccupation with"}, "C": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}, "D": {"pos": "n. phr.", "en": "worry about something", "zh": "對……的擔憂", "word": "concern about"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: enthusiasm or strong interest.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interviews, the chef describes her ______ regional grains as the force behind her menu, which revives nearly forgotten varieties of millet, barley, and sorghum.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interviews, the chef describes her ______ regional grains as the force behind her menu, which revives nearly forgotten varieties of millet, barley, and sorghum.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在訪談中，這位主廚形容她對地方穀物的 ______ 是她菜單背後的動力，她的菜單讓幾乎被遺忘的小米、大麥和高粱品種重新復興。", "opts": {"A": "devotion to", "B": "criticism of", "C": "uncertainty about", "D": "distance from"}, "optsZh": {"A": "devotion to（對…的奉獻、熱愛）", "B": "criticism of（對…的批評）", "C": "uncertainty about（對…的不確定）", "D": "distance from（與…的距離、疏遠）"}, "answer": "A", "expl": "Devotion to means strong commitment or attachment.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "great love, loyalty, or commitment to something", "zh": "對……的熱愛；奉獻", "word": "devotion to"}, "B": {"pos": "n. phr.", "en": "the act of pointing out faults in something", "zh": "對……的批評", "word": "criticism of"}, "C": {"pos": "n. phr.", "en": "a state of not being sure about something", "zh": "對……的不確定", "word": "uncertainty about"}, "D": {"pos": "n. phr.", "en": "emotional separation or lack of closeness to something", "zh": "與……的疏離", "word": "distance from"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "Novelist N. K. Jemisin <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decline\" target=\"_blank\" rel=\"noopener\" data-w=\"decline\" data-pos=\"n.\" data-en=\"a decrease in amount or quality\" data-zh=\"減少；衰退\">declines<\/a> to ______ the conventions of the science fiction <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=genre\" target=\"_blank\" rel=\"noopener\" data-w=\"genre\" data-pos=\"n.\" data-en=\"a type or category of art, music, or literature\" data-zh=\"文類；類型\">genre<\/a> in which she writes, and she has suggested that her readers appreciate her work <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=precise\" target=\"_blank\" rel=\"noopener\" data-w=\"precise\" data-pos=\"adj.\" data-en=\"exact and accurate\" data-zh=\"精確的\">precisely<\/a> because of this willingness to thwart <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectations<\/a> and avoid formulaic plots and themes.", "bodyPlain": "Novelist N. K. Jemisin declines to ______ the conventions of the science fiction genre in which she writes, and she has suggested that her readers appreciate her work precisely because of this willingness to thwart expectations and avoid formulaic plots and themes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "小說家 N.K.Jemisin 拒絕 ______ 她所寫作的科幻類型的慣例，而且她曾表示，讀者之所以欣賞她的作品，正是因為她願意打破期待、避開公式化的情節與主題。", "opts": {"A": "question", "B": "react to", "C": "perceive", "D": "conform to"}, "optsZh": {"A": "question（質疑）", "B": "react to（對…做出反應）", "C": "perceive（察覺；感知）", "D": "conform to（符合；遵從）"}, "answer": "D", "expl": "Jemisin is willing to 'thwart expectations' and avoid formulaic plots, so she declines to 'conform to' (follow) the genre's conventions.", "explZh": "Jemisin 樂於「打破期待」、避開公式化情節，所以她拒絕「conform to」（遵從）科幻類型的慣例。", "defs": {"A": {"pos": "v.", "en": "to express doubt about something", "zh": "質疑", "word": "question"}, "B": {"pos": "phr. v.", "en": "to respond to something", "zh": "對……做出反應", "word": "react to"}, "C": {"pos": "v.", "en": "to notice or become aware of something", "zh": "察覺；感知", "word": "perceive"}, "D": {"pos": "phr. v.", "en": "to behave according to accepted rules or expectations", "zh": "遵從；符合（規範、慣例）", "word": "conform to"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Rather than ______ the expectations of museum portraiture, the painter deliberately disrupts them: her subjects look away from the viewer, and the backgrounds contain fragments of maps, invoices, and family recipes.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Rather than ______ the expectations of museum portraiture, the painter deliberately disrupts them: her subjects look away from the viewer, and the backgrounds contain fragments of maps, invoices, and family recipes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。這位畫家並沒有 ______ 博物館肖像畫的期待，反而刻意打破它們：她筆下的人物把視線從觀者身上移開，背景中則包含地圖、發票和家傳食譜的碎片。", "opts": {"A": "question", "B": "conform to", "C": "misread", "D": "react to"}, "optsZh": {"A": "question（質疑）", "B": "conform to（符合；遵從）", "C": "misread（誤讀；誤解）", "D": "react to（對…做出反應）"}, "answer": "B", "expl": "Conform to means act in accordance with rules or expectations.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to express doubt about something", "zh": "質疑", "word": "question"}, "B": {"pos": "phr. v.", "en": "to behave according to accepted rules or expectations", "zh": "遵從；符合（規範、慣例）", "word": "conform to"}, "C": {"pos": "v.", "en": "to understand something incorrectly", "zh": "誤讀；誤解", "word": "misread"}, "D": {"pos": "phr. v.", "en": "to respond to something", "zh": "對……做出反應", "word": "react to"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=choreographer\" target=\"_blank\" rel=\"noopener\" data-w=\"choreographer\" data-pos=\"n.\" data-en=\"a person who designs dance movements\" data-zh=\"編舞家\">choreographer<\/a> refused to ______ the rigid conventions of classical staging; dancers entered from the aisles, spoke directly to the audience, and rearranged the lighting equipment during the performance.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The choreographer refused to ______ the rigid conventions of classical staging; dancers entered from the aisles, spoke directly to the audience, and rearranged the lighting equipment during the performance.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。這位編舞家拒絕 ______ 古典舞台編排的僵化慣例；舞者從走道進場、直接對觀眾說話，並在演出中重新擺設燈光設備。", "opts": {"A": "adhere to", "B": "revise", "C": "summarize", "D": "perceive"}, "optsZh": {"A": "adhere to（遵守、堅持）", "B": "revise（修改）", "C": "summarize（總結；概述）", "D": "perceive（察覺；感知）"}, "answer": "A", "expl": "Adhere to means follow or conform to.", "explZh": "", "defs": {"A": {"pos": "phr. v.", "en": "to follow a rule, belief, or standard closely", "zh": "遵守；堅持", "word": "adhere to"}, "B": {"pos": "v.", "en": "to change something in order to improve or correct it", "zh": "修訂；修改", "word": "revise"}, "C": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "概述；總結", "word": "summarize"}, "D": {"pos": "v.", "en": "to notice or become aware of something", "zh": "察覺；感知", "word": "perceive"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the committee expected a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> proposal, the engineer declined to ______ that format, submitting instead a set of annotated sketches that made the design logic clearer than a report would have.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the committee expected a conventional proposal, the engineer declined to ______ that format, submitting instead a set of annotated sketches that made the design logic clearer than a report would have.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。雖然委員會預期收到一份傳統的提案，這位工程師卻拒絕 ______ 那種格式，改為提交一組附有註解的草圖，比一份報告更清楚地呈現設計的邏輯。", "opts": {"A": "evaluate", "B": "imitate", "C": "follow", "D": "dismiss"}, "optsZh": {"A": "evaluate（評估）", "B": "imitate（模仿）", "C": "follow（遵循；跟隨）", "D": "dismiss（不予理會；駁斥）"}, "answer": "C", "expl": "Follow can mean comply with an expected pattern.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to judge the quality or value of something", "zh": "評估", "word": "evaluate"}, "B": {"pos": "v.", "en": "to copy the way something is done", "zh": "模仿", "word": "imitate"}, "C": {"pos": "v.", "en": "to act according to rules or instructions", "zh": "遵循", "word": "follow"}, "D": {"pos": "v.", "en": "to decide something is not worth considering", "zh": "不予理會；駁回", "word": "dismiss"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novelist&#x27;s refusal to ______ genre formulas is central to her appeal; she blends courtroom <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=testimony\" target=\"_blank\" rel=\"noopener\" data-w=\"testimony\" data-pos=\"n.\" data-en=\"a formal statement that something is true\" data-zh=\"證詞\">testimony<\/a>, folklore, and speculative science in a way that resists easy classification.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novelist's refusal to ______ genre formulas is central to her appeal; she blends courtroom testimony, folklore, and speculative science in a way that resists easy classification.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位小說家拒絕 ______ 類型公式，這正是她吸引人的核心；她將法庭證詞、民間傳說和推想科學融合在一起，難以輕易歸類。", "opts": {"A": "ignore", "B": "observe", "C": "challenge", "D": "explain"}, "optsZh": {"A": "ignore（忽視）", "B": "observe（遵守；觀察）", "C": "challenge（挑戰；質疑）", "D": "explain（解釋）"}, "answer": "B", "expl": "Observe can mean follow rules or conventions.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to pay no attention to something", "zh": "忽視；不理會", "word": "ignore"}, "B": {"pos": "v.", "en": "to watch carefully; also, to follow a rule or custom", "zh": "觀察；遵守（規定、習俗）", "word": "observe"}, "C": {"pos": "v.", "en": "to question whether something is true or right", "zh": "質疑；挑戰", "word": "challenge"}, "D": {"pos": "v.", "en": "to make something clear by giving reasons or details", "zh": "解釋；說明", "word": "explain"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: conforming to conventions.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The journal usually publishes studies in a strict order of abstract, method, results, and discussion, but this essay does not ______ the pattern, beginning instead with a personal narrative.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The journal usually publishes studies in a strict order of abstract, method, results, and discussion, but this essay does not ______ the pattern, beginning instead with a personal narrative.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n這本期刊通常依照摘要、方法、結果和討論的嚴格順序刊登研究，但這篇文章並沒有 ______ 這個模式，而是以一段個人敘事作為開頭。", "opts": {"A": "perceive", "B": "describe", "C": "react against", "D": "comply with"}, "optsZh": {"A": "perceive（察覺；感知）", "B": "describe（描述）", "C": "react against（反抗；對…產生反彈）", "D": "comply with（遵守；服從）"}, "answer": "D", "expl": "Comply with means act according to a rule or expectation.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to notice or become aware of something", "zh": "察覺；感知", "word": "perceive"}, "B": {"pos": "v.", "en": "to tell what something is like", "zh": "描述", "word": "describe"}, "C": {"pos": "phr. v.", "en": "to respond to something by opposing it", "zh": "反抗；反對", "word": "react against"}, "D": {"pos": "phr. v.", "en": "to act according to a rule, request, or law", "zh": "遵從；依照", "word": "comply with"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: mixed feelings or ambivalence.", "vocab": true, "body": "In Nature Poem (2017), Kumeyaay poet Tommy Pico portrays his ______ the natural world by honoring the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a>/direct/?q=centrality\" target=\"_blank\" rel=\"noopener\" data-w=\"centrality\" data-pos=\"n.\" data-en=\"the state of being central or most important\" data-zh=\"核心地位；中心性\">centrality<\/a> of nature within his tribe&#x27;s traditional beliefs while <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=simultaneously\" target=\"_blank\" rel=\"noopener\" data-w=\"simultaneously\" data-pos=\"adv.\" data-en=\"at the same time\" data-zh=\"同時地\">simultaneously<\/a> expressing his distaste for being in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wilderness\" target=\"_blank\" rel=\"noopener\" data-w=\"wilderness\" data-pos=\"n.\" data-en=\"a wild natural area where people do not live\" data-zh=\"荒野\">wilderness<\/a> settings himself.", "bodyPlain": "In Nature Poem (2017), Kumeyaay poet Tommy Pico portrays his ______ the natural world by honoring the centrality of nature within his tribe's traditional beliefs while simultaneously expressing his distaste for being in wilderness settings himself.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在《Nature Poem》（2017）中，Kumeyaay 族詩人 Tommy Pico 描繪了他對自然世界的 ______：他一方面尊崇自然在其部落傳統信仰中的核心地位，同時又表達自己不喜歡身處荒野環境。", "opts": {"A": "responsiveness to", "B": "ambivalence toward", "C": "renunciation of", "D": "mastery over"}, "optsZh": {"A": "responsiveness to（對…的回應能力、敏感度）", "B": "ambivalence toward（對…抱持矛盾的態度）", "C": "renunciation of（放棄；斷絕）", "D": "mastery over（對…的掌握、精通）"}, "answer": "B", "expl": "Pico both honors nature and dislikes being in the wilderness himself—mixed feelings, or 'ambivalence toward' the natural world.", "explZh": "Pico 一方面尊崇大自然在部落信仰中的核心地位，另一方面又討厭身處荒野，這是矛盾的情感，所以是「ambivalence toward」（對……感到矛盾）。", "defs": {"A": {"pos": "n. phr.", "en": "the quality of reacting quickly and positively to something", "zh": "對……的回應能力；敏感度", "word": "responsiveness to"}, "B": {"pos": "n. phr.", "en": "mixed or conflicting feelings toward something", "zh": "對……的矛盾心態", "word": "ambivalence toward"}, "C": {"pos": "n. phr.", "en": "the act of formally giving up or rejecting something", "zh": "對……的放棄、摒棄", "word": "renunciation of"}, "D": {"pos": "n. phr.", "en": "complete control over or great skill with something", "zh": "對……的掌控、精通", "word": "mastery over"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: mixed feelings or ambivalence.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The memoir captures the author&#x27;s ______ fame: she values the opportunities it brings but is uneasy about the loss of privacy and the pressure to perform a simplified version of herself in public.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The memoir captures the author's ______ fame: she values the opportunities it brings but is uneasy about the loss of privacy and the pressure to perform a simplified version of herself in public.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。這本回憶錄捕捉了作者對名氣的 ______：她珍視名氣帶來的機會，卻對失去隱私以及必須在公眾面前扮演一個簡化版自己的壓力感到不安。", "opts": {"A": "renunciation of", "B": "ambivalence toward", "C": "mastery over", "D": "responsiveness to"}, "optsZh": {"A": "renunciation of（放棄；斷絕）", "B": "ambivalence toward（對…抱持矛盾的態度）", "C": "mastery over（對…的掌握、精通）", "D": "responsiveness to（對…的回應能力、敏感度）"}, "answer": "B", "expl": "Ambivalence means mixed or conflicting feelings.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "the act of formally giving up or rejecting something", "zh": "對……的放棄、摒棄", "word": "renunciation of"}, "B": {"pos": "n. phr.", "en": "mixed or conflicting feelings toward something", "zh": "對……的矛盾心態", "word": "ambivalence toward"}, "C": {"pos": "n. phr.", "en": "complete control over or great skill with something", "zh": "對……的掌控、精通", "word": "mastery over"}, "D": {"pos": "n. phr.", "en": "the quality of reacting quickly and positively to something", "zh": "對……的回應能力；敏感度", "word": "responsiveness to"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: mixed feelings or ambivalence.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The scientist&#x27;s comments reveal a ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artificial\" target=\"_blank\" rel=\"noopener\" data-w=\"artificial\" data-pos=\"adj.\" data-en=\"made by people rather than occurring naturally\" data-zh=\"人造的；人工的\">artificial<\/a> intelligence; she praises its usefulness for modeling climate systems while warning that opaque algorithms can reinforce flawed assumptions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The scientist's comments reveal a ______ artificial intelligence; she praises its usefulness for modeling climate systems while warning that opaque algorithms can reinforce flawed assumptions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。這位科學家的評論顯示出她對人工智慧的 ______；她讚揚人工智慧在模擬氣候系統上的用處，同時也警告不透明的演算法可能會強化有缺陷的假設。", "opts": {"A": "mixed attitude toward", "B": "technical command of", "C": "casual indifference to", "D": "complete rejection of"}, "optsZh": {"A": "mixed attitude toward（對…抱持複雜的態度）", "B": "technical command of（對…的技術掌握）", "C": "casual indifference to（對…漫不經心、毫不在乎）", "D": "complete rejection of（對…的全然拒絕）"}, "answer": "A", "expl": "A mixed attitude involves both positive and negative feelings.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "partly positive and partly negative feelings toward something", "zh": "對……的複雜態度", "word": "mixed attitude toward"}, "B": {"pos": "n. phr.", "en": "skillful control of the methods of an art or field", "zh": "對……的技術掌握", "word": "technical command of"}, "C": {"pos": "n. phr.", "en": "a relaxed lack of interest in or concern about something", "zh": "對……漫不經心、毫不在意", "word": "casual indifference to"}, "D": {"pos": "n. phr.", "en": "total refusal to accept something", "zh": "對……的全盤否定", "word": "complete rejection of"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: mixed feelings or ambivalence.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In the essay, the narrator expresses ______ city life, admiring its density and cultural richness yet longing for the quiet routines of the rural town she left behind.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In the essay, the narrator expresses ______ city life, admiring its density and cultural richness yet longing for the quiet routines of the rural town she left behind.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社
