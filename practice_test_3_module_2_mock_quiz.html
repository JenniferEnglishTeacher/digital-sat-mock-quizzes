 indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Many performers learned songs from relatives.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有數個國家的學者研究這項傳統。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence: choose quotation supporting a claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "The program took place in a community."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這張表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "D": "這個計畫在一個社區中進行。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "Estimates of Tyrannosaurid Bite Force<br>Cost et al. (2019), muscular and skeletal modeling: 35,000-63,000 newtons<br>Gignac and Erickson (2017), tooth-bone <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> analysis: 8,000-34,000 newtons<br>Meers (2002), body-mass scaling: 183,000-235,000 newtons<br>Bates and Falkingham (2012), muscular and skeletal modeling: 35,000-57,000 newtons<br><br>The largest tyrannosaurids-the family of carnivorous dinosaurs that includes Tarbosaurus, Albertosaurus, and Tyrannosaurus rex-are thought to have had the strongest bites of any land animals in Earth&#x27;s history. Determining the bite force of extinct animals can be difficult, however, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologists<\/a> Paul Barrett and Emily Rayfield have suggested that an estimate of dinosaur bite force may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> influenced by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a> used in generating that estimate.", "bodyPlain": "Estimates of Tyrannosaurid Bite Force\nCost et al. (2019), muscular and skeletal modeling: 35,000-63,000 newtons\nGignac and Erickson (2017), tooth-bone interaction analysis: 8,000-34,000 newtons\nMeers (2002), body-mass scaling: 183,000-235,000 newtons\nBates and Falkingham (2012), muscular and skeletal modeling: 35,000-57,000 newtons\n\nThe largest tyrannosaurids-the family of carnivorous dinosaurs that includes Tarbosaurus, Albertosaurus, and Tyrannosaurus rex-are thought to have had the strongest bites of any land animals in Earth's history. Determining the bite force of extinct animals can be difficult, however, and paleontologists Paul Barrett and Emily Rayfield have suggested that an estimate of dinosaur bite force may be significantly influenced by the methodology used in generating that estimate.", "stem": "Which choice best describes data from the table that support Barrett and Rayfield's suggestion?", "stemZh": "哪個選項最能描述表格中支持 Barrett 與 Rayfield 推論的數據？", "bodyZh": "暴龍科咬合力的估計值\nCost 等人（2019），肌肉與骨骼建模：35,000 至 63,000 牛頓\nGignac 與 Erickson（2017），牙齒與骨骼交互作用分析：8,000 至 34,000 牛頓\nMeers（2002），體重比例推算：183,000 至 235,000 牛頓\nBates 與 Falkingham（2012），肌肉與骨骼建模：35,000 至 57,000 牛頓\n最大型的暴龍科恐龍——這個肉食性恐龍科包括 Tarbosaurus、Albertosaurus 和 Tyrannosaurus rex——被認為擁有地球史上所有陸地動物中最強的咬合力。然而，要判定已滅絕動物的咬合力可能很困難，古生物學家 Paul Barrett 和 Emily Rayfield 曾指出，恐龍咬合力的估計值可能會受到產生該估計值所用方法的顯著影響。", "opts": {"A": "The study by Meers used body-mass scaling and produced the lowest estimated maximum bite force, while the study by Cost et al. used muscular and skeletal modeling and produced the highest estimated maximum.", "B": "In their study, Gignac and Erickson used tooth-bone interaction analysis to produce an estimated bite force range with a minimum of 8,000 newtons and a maximum of 34,000 newtons.", "C": "The bite force estimates produced by Bates and Falkingham and by Cost et al. were similar to each other, while the estimates produced by Meers and by Gignac and Erickson each differed substantially from any other estimate.", "D": "The estimated maximum bite force produced by Cost et al. exceeded the estimated maximum produced by Bates and Falkingham, even though both groups of researchers used the same method to generate their estimates."}, "optsZh": {"A": "Meers 的研究使用體重比例推算法，得出最低的估計最大咬合力；而 Cost 等人的研究使用肌肉與骨骼模型，得出最高的估計最大值。", "B": "在研究中，Gignac 與 Erickson 使用齒骨交互作用分析，得出估計咬合力範圍，最小值為 8,000 牛頓，最大值為 34,000 牛頓。", "C": "Bates 與 Falkingham 以及 Cost 等人所得出的咬合力估計值彼此相近，而 Meers 以及 Gignac 與 Erickson 的估計值則各自與其他估計值有顯著差異。", "D": "Cost 等人估計的最大咬合力超過 Bates 與 Falkingham 的估計最大值，儘管兩組研究人員使用相同的方法得出估計值。"}, "answer": "C", "expl": "The two studies using the same method (muscular and skeletal modeling) gave similar estimates, while studies using other methods gave very different ones, suggesting methodology influences the estimate.", "explZh": "使用相同方法（肌肉與骨骼建模）的兩項研究結果相近，而使用其他方法的研究結果差異很大，顯示估計值受研究方法影響。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The graph contains information about three regions.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "這張圖表包含三個地區的資訊。", "D": "有些農民種植蔬菜，而另一些則種植穀物。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有些恆星含有氫和氦。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "有一顆岩質行星擁有稀薄的大氣層。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Many performers learned songs from relatives.", "C": "Some songs use a meter also found in older European poetry.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "有數個國家的學者研究這項傳統。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Quantitative Evidence: compare methods and estimates.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program took place in a community.", "C": "The table includes more than one year.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這個計畫在一個社區中進行。", "C": "這張表格包含不只一個年份。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "Number and Origin of Clamshell Tools Found at Different Levels Below the Surface in Neanderthal Cave<br>Depth 3-4 meters: 99 beach shells, 33 seafloor shells<br>Depth 6-7 meters: 1 beach shell, 0 seafloor shells<br>Depth 4-5 meters: 2 beach shells, 0 seafloor shells<br>Depth 2-3 meters: 7 beach shells, 0 seafloor shells<br>Depth 5-6 meters: 18 beach shells, 7 seafloor shells<br><br>Studying tools unearthed at a cave site on the western coast of Italy, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Paola Villa and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that prehistoric Neanderthal groups fashioned them from shells of clams that they harvested from the seafloor while wading or diving or that washed up on the beach. Clamshells become thin and eroded as they wash up on the beach, while those on the seafloor are smooth and sturdy, so the research team suspects that Neanderthals prized the tools made with seafloor shells. However, the team also concluded that those tools were likely more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=challenge\" target=\"_blank\" rel=\"noopener\" data-w=\"challenge\" data-pos=\"v.\" data-en=\"to question whether something is true or right\" data-zh=\"質疑；挑戰\">challenging<\/a> to obtain.", "bodyPlain": "Number and Origin of Clamshell Tools Found at Different Levels Below the Surface in Neanderthal Cave\nDepth 3-4 meters: 99 beach shells, 33 seafloor shells\nDepth 6-7 meters: 1 beach shell, 0 seafloor shells\nDepth 4-5 meters: 2 beach shells, 0 seafloor shells\nDepth 2-3 meters: 7 beach shells, 0 seafloor shells\nDepth 5-6 meters: 18 beach shells, 7 seafloor shells\n\nStudying tools unearthed at a cave site on the western coast of Italy, archaeologist Paola Villa and colleagues have determined that prehistoric Neanderthal groups fashioned them from shells of clams that they harvested from the seafloor while wading or diving or that washed up on the beach. Clamshells become thin and eroded as they wash up on the beach, while those on the seafloor are smooth and sturdy, so the research team suspects that Neanderthals prized the tools made with seafloor shells. However, the team also concluded that those tools were likely more challenging to obtain.", "stem": "Which choice most effectively uses data from the table to support the research team's conclusion?", "stemZh": "哪個選項最有效地運用表格中的數據來支持研究團隊的結論？", "bodyZh": "在尼安德塔人洞穴地表下不同深度發現的蛤殼工具數量與來源\n深度 3 至 4 公尺：海灘貝殼 99 個，海床貝殼 33 個\n深度 6 至 7 公尺：海灘貝殼 1 個，海床貝殼 0 個\n深度 4 至 5 公尺：海灘貝殼 2 個，海床貝殼 0 個\n深度 2 至 3 公尺：海灘貝殼 7 個，海床貝殼 0 個\n深度 5 至 6 公尺：海灘貝殼 18 個，海床貝殼 7 個\n考古學家 Paola Villa 與同事研究在義大利西海岸一處洞穴遺址出土的工具後判定，史前尼安德塔人群體是用蛤殼來製作這些工具的，而這些蛤殼有的是他們涉水或潛水時從海床採集的，有的則是被沖上海灘的。蛤殼被沖上海灘時會變得又薄又受侵蝕，而海床上的蛤殼則光滑而堅固，因此研究團隊推測尼安德塔人特別珍視用海床貝殼製成的工具。然而，該團隊也得出結論，認為這些工具可能較難取得。", "opts": {"A": "At each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that shells were easier to collect from the beach than to harvest from the seafloor.", "B": "The highest number of tools were at a depth of 3-4 meters below the surface, which suggests that the Neanderthal population at the site was highest during the related period of time.", "C": "At each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that Neanderthals preferred to use clamshells from the beach because of their durability.", "D": "The higher number of tools at depths of 5-6 meters below the surface in the cave than at depths of 4-5 meters below the surface suggests that the size of clam populations changed over time."}, "optsZh": {"A": "在洞穴地表下的每一個深度，各類工具數量的差異顯示，從海灘撿拾貝殼比從海床採集更容易。", "B": "工具數量最多的位置在地表下 3 至 4 公尺深處，顯示該遺址的尼安德塔人口在相應時期達到最多。", "C": "在洞穴地表下的每一個深度，各類工具數量的差異顯示，尼安德塔人因為海灘上的蛤殼較耐用而偏好使用它們。", "D": "洞穴地表下 5 至 6 公尺深處的工具數量多於 4 至 5 公尺深處，顯示蛤蜊族群的數量隨時間而改變。"}, "answer": "A", "expl": "At every depth there are more beach-shell tools than seafloor-shell tools, which supports the conclusion that seafloor shells were harder to obtain.", "explZh": "每一個深度的海灘貝殼工具都比海床貝殼工具多，支持「海床貝殼較難取得」的結論。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "The method used to study stars requires a telescope.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "有些恆星含有氫和氦。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Many performers learned songs from relatives.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有數個國家的學者研究這項傳統。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: support conclusion from table.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program took place in a community."}, "optsZh": {"A": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一個年份。", "D": "這個計畫在一個社區中進行。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "Average Number and Duration of Torpor Bouts and Arousal Episodes for Alaska Marmots and Arctic Ground <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=squirrel\" target=\"_blank\" rel=\"noopener\" data-w=\"squirrel\" data-pos=\"n.\" data-en=\"a small animal with a long bushy tail that lives in trees\" data-zh=\"松鼠\">Squirrels<\/a>, 2008-2011<br>Alaska marmots: 12 torpor bouts; 13.81 days per bout; 11 arousal episodes; 21.2 hours per episode.<br>Arctic ground squirrels: 10.5 torpor bouts; 16.77 days per bout; 9.5 arousal episodes; 14.2 hours per episode.<br><br>When hibernating, Alaska marmots and Arctic ground squirrels enter a state called torpor, which minimizes the energy their bodies need to function. Often a hibernating animal will <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporarily\" target=\"_blank\" rel=\"noopener\" data-w=\"temporarily\" data-pos=\"adv.\" data-en=\"for a limited time only\" data-zh=\"暫時地\">temporarily<\/a> come out of torpor (called an arousal episode) and its metabolic rate will rise, burning more of the precious energy the animal needs to survive the winter. Alaska marmots hibernate in groups and therefore burn less energy keeping warm during these episodes than they would if they were alone. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that because Arctic ground squirrels hibernate alone, they would likely exhibit longer bouts of torpor and shorter arousal episodes than Alaska marmots.", "bodyPlain": "Average Number and Duration of Torpor Bouts and Arousal Episodes for Alaska Marmots and Arctic Ground Squirrels, 2008-2011\nAlaska marmots: 12 torpor bouts; 13.81 days per bout; 11 arousal episodes; 21.2 hours per episode.\nArctic ground squirrels: 10.5 torpor bouts; 16.77 days per bout; 9.5 arousal episodes; 14.2 hours per episode.\n\nWhen hibernating, Alaska marmots and Arctic ground squirrels enter a state called torpor, which minimizes the energy their bodies need to function. Often a hibernating animal will temporarily come out of torpor (called an arousal episode) and its metabolic rate will rise, burning more of the precious energy the animal needs to survive the winter. Alaska marmots hibernate in groups and therefore burn less energy keeping warm during these episodes than they would if they were alone. A researcher hypothesized that because Arctic ground squirrels hibernate alone, they would likely exhibit longer bouts of torpor and shorter arousal episodes than Alaska marmots.", "stem": "Which choice best describes data from the table that support the researcher's hypothesis?", "stemZh": "哪個選項最能描述表格中支持該研究者假說的數據？", "bodyZh": "2008 至 2011 年阿拉斯加土撥鼠與北極地松鼠的蟄眠期及甦醒期平均次數與持續時間\n阿拉斯加土撥鼠：蟄眠期 12 次；每次 13.81 天；甦醒期 11 次；每次 21.2 小時。\n北極地松鼠：蟄眠期 10.5 次；每次 16.77 天；甦醒期 9.5 次；每次 14.2 小時。\n冬眠時，阿拉斯加土撥鼠和北極地松鼠會進入一種稱為蟄眠（torpor）的狀態，將身體運作所需的能量降到最低。冬眠中的動物常會暫時脫離蟄眠狀態（稱為甦醒期），此時牠的代謝率會上升，消耗更多牠度過冬天所需的珍貴能量。阿拉斯加土撥鼠是群體冬眠的，因此在這些甦醒期中為保暖所消耗的能量，比單獨冬眠時來得少。一位研究人員假設，由於北極地松鼠是單獨冬眠的，牠們很可能會比阿拉斯加土撥鼠表現出更長的蟄眠期和更短的甦醒期。", "opts": {"A": "The Alaska marmots' arousal episodes lasted for days, while the Arctic ground squirrels' arousal episodes lasted less than a day.", "B": "The Alaska marmots and the Arctic ground squirrels both maintained torpor for several consecutive days per bout, on average.", "C": "The Alaska marmots had shorter torpor bouts and longer arousal episodes than the Arctic ground squirrels did.", "D": "The Alaska marmots had more torpor bouts than arousal episodes, but their arousal episodes were much shorter than their torpor bouts."}, "optsZh": {"A": "阿拉斯加土撥鼠的甦醒期持續數天，而北極地松鼠的甦醒期則不到一天。", "B": "平均而言，阿拉斯加土撥鼠與北極地松鼠每次蟄眠都會持續數天。", "C": "阿拉斯加土撥鼠的蟄眠期比北極地松鼠短，甦醒期則比北極地松鼠長。", "D": "阿拉斯加土撥鼠的蟄眠次數多於甦醒次數，但牠們的甦醒期比蟄眠期短得多。"}, "answer": "C", "expl": "The hypothesis predicts squirrels have longer torpor bouts and shorter arousals than marmots; the table shows marmots had shorter bouts (13.81 vs. 16.77 days) and longer arousals (21.2 vs. 14.2 hours).", "explZh": "假說預測北極地松鼠的蟄眠期較長、甦醒期較短；表格顯示旱獺的蟄眠期較短（13.81 天 vs. 16.77 天）、甦醒期較長（21.2 小時 vs. 14.2 小時），正好支持假說。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "南部地區有被納入調查。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Many performers learned songs from relatives.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有數個國家的學者研究這項傳統。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Quantitative Evidence: support hibernation hypothesis.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, or paired texts?", "stemZh": "哪個選項最有效地運用文章、表格或雙篇文章中的證據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一個年份。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "Ratified by more than 90 countries, the Nagoya Protocol is an international agreement ensuring that Indigenous communities are compensated when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=agricultural\" target=\"_blank\" rel=\"noopener\" data-w=\"agricultural\" data-pos=\"adj.\" data-en=\"relating to farming\" data-zh=\"農業的\">agricultural<\/a> resources and knowledge of wild plants and animals are utilized by agricultural corporations. However, the protocol has shortcomings. For example, it allows corporations to insist that their agreements with communities to conduct research on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> uses of the communities&#x27; resources and knowledge remain confidential. Therefore, some Indigenous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> express concern that the protocol may have the unintended effect of ______", "bodyPlain": "Ratified by more than 90 countries, the Nagoya Protocol is an international agreement ensuring that Indigenous communities are compensated when their agricultural resources and knowledge of wild plants and animals are utilized by agricultural corporations. However, the protocol has shortcomings. For example, it allows corporations to insist that their agreements with communities to conduct research on the commercial uses of the communities' resources and knowledge remain confidential. Therefore, some Indigenous advocates express concern that the protocol may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "《名古屋議定書》已獲得九十多個國家批准，是一項國際協議，確保當農業企業利用原住民社群的農業資源以及他們對野生動植物的知識時，這些社群能獲得補償。然而，這份議定書有其缺點。例如，它允許企業要求，與社群簽訂的、針對社群資源和知識之商業用途進行研究的協議必須保密。因此，一些原住民權益倡議者擔心，這份議定書可能會產生意料之外的效果，也就是 ______", "opts": {"A": "diminishing the monetary reward that corporations might derive from their agreements with Indigenous communities.", "B": "limiting the research that corporations conduct on the resources of the Indigenous communities with which they have signed agreements.", "C": "preventing independent observers from determining whether the agreements guarantee equitable compensation for Indigenous communities.", "D": "discouraging Indigenous communities from learning new methods for harvesting plants and animals from their corporate partners."}, "optsZh": {"A": "減少企業可能從其與原住民社群的協議中獲得的金錢利益。", "B": "限制企業對與其簽訂協議的原住民社群之資源所進行的研究。", "C": "使獨立觀察者無法判斷這些協議是否保障原住民社群獲得公平的補償。", "D": "使原住民社群不願向其企業合作夥伴學習採集動植物的新方法。"}, "answer": "C", "expl": "If agreements can be kept confidential, outsiders cannot check whether communities are fairly compensated.", "explZh": "如果協議可以保密，外界就無法檢視原住民社群是否獲得公平補償。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。一項城市政策要求房東向房客揭露租金調漲，但允許公家機關無法取得這些通知。住宅權益倡議者警告，這項政策可能會產生意料之外的效果，也就是 ______", "opts": {"A": "preventing tenants from discussing rent changes with one another.", "B": "encouraging landlords to repair apartments before raising rents.", "C": "making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "D": "reducing tenants' interest in renewing leases."}, "optsZh": {"A": "阻止房客彼此討論租金的變動。", "B": "鼓勵房東在調漲租金之前先修繕公寓。", "C": "使官員更難找出租金漲幅異常劇烈的社區。", "D": "降低房客續租的意願。"}, "answer": "C", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許這些公司對每項研究協議的條款保密。病患權益倡議者主張，這項規定可能會 ______", "opts": {"A": "prevent companies from profiting from successful drugs.", "B": "reduce the number of diseases that hospitals are able to study.", "C": "require hospitals to publish every patient's medical history.", "D": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data."}, "optsZh": {"A": "阻止公司從成功的藥物中獲利。", "B": "減少醫院能夠研究的疾病數量。", "C": "要求醫院公布每位病患的病歷。", "D": "使人難以判斷醫院使用病患資料是否獲得公平的補償。"}, "answer": "D", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=
