l=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The committee gave two reasons for preserving the old theater. First, the building is one of the few remaining examples of Art Deco design in the city. ______ it has hosted community performances for nearly a century.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The committee gave two reasons for preserving the old theater. First, the building is one of the few remaining examples of Art Deco design in the city. ______ it has hosted community performances for nearly a century.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。委員會提出了保存這座老戲院的兩個理由。首先，這棟建築是市內少數僅存的裝飾藝術（Art Deco）風格建築之一。______ 近一個世紀以來，它一直是社區表演的場地。", "opts": {"A": "Second,", "B": "Still,", "C": "Instead,", "D": "Specifically,"}, "optsZh": {"A": "Second,（第二：表列舉第二個理由，正確）", "B": "Still,（儘管如此：表讓步轉折）", "C": "Instead,（反而、取而代之：表替代）", "D": "Specifically,（具體來說：表進一步說明細節）"}, "answer": "A", "expl": "Second introduces another reason in a sequence.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The historian argues that the fort was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strategically\" target=\"_blank\" rel=\"noopener\" data-w=\"strategically\" data-pos=\"adv.\" data-en=\"in a way that is carefully planned to achieve a goal\" data-zh=\"策略性地\">strategically<\/a> important. First, it overlooked the only safe river crossing for miles. ______ it contained storage rooms large enough to hold supplies for a sizable garrison.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The historian argues that the fort was strategically important. First, it overlooked the only safe river crossing for miles. ______ it contained storage rooms large enough to hold supplies for a sizable garrison.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。這位歷史學家主張，這座要塞具有戰略上的重要性。首先，它俯瞰方圓數英里內唯一安全的渡河處。______ 它設有足以容納一支大規模駐軍補給品的儲藏室。", "opts": {"A": "For instance,", "B": "Previously,", "C": "Moreover,", "D": "However,"}, "optsZh": {"A": "For instance,（例如：表舉例）", "B": "Previously,（先前：表過去的時間）", "C": "Moreover,（此外、而且：表補充）", "D": "However,（然而：表轉折）"}, "answer": "C", "expl": "Moreover adds a second supporting reason.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. There are two indications that the manuscript belonged to a royal library. First, its cover bears the court&#x27;s official emblem. ______ its margins contain notes written by a known palace scribe.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. There are two indications that the manuscript belonged to a royal library. First, its cover bears the court's official emblem. ______ its margins contain notes written by a known palace scribe.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。有兩項跡象顯示這份手稿曾屬於一座皇家圖書館。首先，它的封面上印有宮廷的官方徽章。______ 它的頁邊有一位知名宮廷抄寫員所寫的註記。", "opts": {"A": "Next,", "B": "In contrast,", "C": "For this reason,", "D": "Nevertheless,"}, "optsZh": {"A": "Next,（接著、其次：表順序，正確）", "B": "In contrast,（相對地：表對比）", "C": "For this reason,（因為這個原因：表因果）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "A", "expl": "Next continues the sequence of evidence.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> identifies two factors that explain the species&#x27; success. First, the plant tolerates salty soil. ______ it produces seeds that can float for weeks without losing viability.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The researcher identifies two factors that explain the species' success. First, the plant tolerates salty soil. ______ it produces seeds that can float for weeks without losing viability.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位研究人員指出了兩個說明這個物種為何成功的因素。首先，這種植物能耐受含鹽的土壤。______ 它所產生的種子能漂浮數週而不失去發芽能力。", "opts": {"A": "Rather,", "B": "Second,", "C": "Still,", "D": "Consequently,"}, "optsZh": {"A": "Rather,（反而、更確切地說：表修正或替代）", "B": "Second,（第二：表列舉第二個理由，正確）", "C": "Still,（儘管如此：表讓步轉折）", "D": "Consequently,（因此：表結果）"}, "answer": "B", "expl": "Second introduces the next factor.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: second reason in a sequence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The exhibit highlights two reasons the photographer became influential. First, her portraits appeared in widely read magazines. ______ she trained several younger artists who later transformed documentary photography.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The exhibit highlights two reasons the photographer became influential. First, her portraits appeared in widely read magazines. ______ she trained several younger artists who later transformed documentary photography.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n這場展覽突顯了這位攝影師之所以具有影響力的兩個原因。首先，她的肖像作品刊登在廣為閱讀的雜誌上。______ 她培訓了好幾位年輕藝術家，他們後來改變了紀實攝影。", "opts": {"A": "Despite this,", "B": "Instead,", "C": "In comparison,", "D": "Additionally,"}, "optsZh": {"A": "Despite this,（儘管如此：表讓步轉折）", "B": "Instead,（反而、取而代之：表替代）", "C": "In comparison,（相較之下：表比較）", "D": "Additionally,（此外：表補充）"}, "answer": "D", "expl": "Additionally adds another reason.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "The more diverse and wide ranging an animal&#x27;s behaviors, the larger and more energy demanding the animal&#x27;s brain tends to be. ______ from an evolutionary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The specialized subtypes of ants within colonies provide an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunity<\/a> to explore this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>.", "bodyPlain": "The more diverse and wide ranging an animal's behaviors, the larger and more energy demanding the animal's brain tends to be. ______ from an evolutionary perspective, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The specialized subtypes of ants within colonies provide an opportunity to explore this hypothesis.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "動物的行為越多樣、範圍越廣，牠的大腦往往就越大、越耗能。______ 從演化的角度來看，只進行基本動作的動物應該會分配較少的資源來生長和維持腦組織。蟻群中特化的螞蟻亞型提供了一個探究這項假說的機會。", "opts": {"A": "Subsequently,", "B": "Besides,", "C": "Nevertheless,", "D": "Thus,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後）", "B": "Besides,（此外、況且：表補充）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Thus,（因此：表結果或推論）"}, "answer": "D", "expl": "Since bigger behavior repertoires require bigger brains, it follows that animals with only basic actions should invest less in brain tissue—a result, so 'Thus.'", "explZh": "既然行為越多樣大腦越大，那麼只會基本動作的動物就應減少對腦組織的投資——這是推論結果，所以用「Thus」（因此）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Animals that rely on many different foraging strategies generally require flexible problem-solving abilities. ______ species with very limited feeding routines may have less need for large, energy-intensive brains.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Animals that rely on many different foraging strategies generally require flexible problem-solving abilities. ______ species with very limited feeding routines may have less need for large, energy-intensive brains.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。仰賴多種不同覓食策略的動物，通常需要靈活解決問題的能力。______ 覓食習慣非常有限的物種，可能比較不需要大型且高耗能的大腦。", "opts": {"A": "Subsequently,", "B": "Thus,", "C": "Nevertheless,", "D": "Besides,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後）", "B": "Thus,（因此：表結果或推論）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Besides,（此外、況且：表補充）"}, "answer": "B", "expl": "Thus introduces a logical consequence.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Maintaining specialized sensory organs consumes substantial energy. ______ organisms that live in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> where those senses provide little advantage may gradually lose them.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Maintaining specialized sensory organs consumes substantial energy. ______ organisms that live in environments where those senses provide little advantage may gradually lose them.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。維持特化的感覺器官會消耗大量能量。______ 生活在那些感官幾乎提供不了優勢的環境中的生物，可能會逐漸失去這些器官。", "opts": {"A": "For example,", "B": "Therefore,", "C": "Instead,", "D": "Meanwhile,"}, "optsZh": {"A": "For example,（例如：表舉例）", "B": "Therefore,（因此：表結果）", "C": "Instead,（反而、取而代之：表替代）", "D": "Meanwhile,（同時、與此同時：表同時發生）"}, "answer": "B", "expl": "Therefore signals the result of the principle.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A muscle that is rarely used still requires nutrients to grow and repair. ______ natural selection may favor smaller versions of that muscle in animals whose behavior no longer depends on it.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A muscle that is rarely used still requires nutrients to grow and repair. ______ natural selection may favor smaller versions of that muscle in animals whose behavior no longer depends on it.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一塊很少使用的肌肉仍然需要養分來生長和修復。______ 對於行為已不再依賴那塊肌肉的動物，天擇可能會偏好較小的那塊肌肉。", "opts": {"A": "Consequently,", "B": "However,", "C": "Similarly,", "D": "Previously,"}, "optsZh": {"A": "Consequently,（因此：表結果）", "B": "However,（然而：表轉折）", "C": "Similarly,（同樣地：表相似）", "D": "Previously,（先前：表過去的時間）"}, "answer": "A", "expl": "Consequently introduces the implication.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Complex social behavior often requires animals to recognize individuals and remember past <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a>. ______ solitary species with brief encounters may benefit less from investing in such cognitive machinery.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Complex social behavior often requires animals to recognize individuals and remember past interactions. ______ solitary species with brief encounters may benefit less from investing in such cognitive machinery.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。複雜的社會行為通常需要動物辨識個體並記住過去的互動。______ 獨居且相遇短暫的物種，投資於這類認知機制所得到的好處可能較少。", "opts": {"A": "In contrast,", "B": "Meanwhile,", "C": "Thus,", "D": "Nevertheless,"}, "optsZh": {"A": "In contrast,（相對地：表對比）", "B": "Meanwhile,（同時、與此同時：表同時發生）", "C": "Thus,（因此：表結果或推論）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "C", "expl": "Thus presents the evolutionary inference.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: logical result.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Large brains can support flexible behavior, but they are metabolically expensive. ______ a species that performs only a narrow set of tasks may gain an advantage by allocating energy elsewhere.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Large brains can support flexible behavior, but they are metabolically expensive. ______ a species that performs only a narrow set of tasks may gain an advantage by allocating energy elsewhere.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n大型大腦能支持靈活的行為，但在代謝上代價高昂。______ 只執行少數特定任務的物種，或許能藉由把能量分配到其他地方而獲得優勢。", "opts": {"A": "Still,", "B": "By comparison,", "C": "Alternatively,", "D": "As a result,"}, "optsZh": {"A": "Still,（儘管如此：表讓步轉折）", "B": "By comparison,（相較之下：表比較）", "C": "Alternatively,（或者：表另一種選擇）", "D": "As a result,（因此、結果：表結果，正確）"}, "answer": "D", "expl": "As a result links the cost to the predicted allocation.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "When designing costumes for film, American artist Suttirat Larlarb typically custom fits the garments to each actor. ______ for the film Sunshine, in which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronaut\" target=\"_blank\" rel=\"noopener\" data-w=\"astronaut\" data-pos=\"n.\" data-en=\"a person trained to travel into space\" data-zh=\"太空人\">astronauts<\/a> must <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reignite\" target=\"_blank\" rel=\"noopener\" data-w=\"reignite\" data-pos=\"v.\" data-en=\"to start burning again\" data-zh=\"重新點燃\">reignite<\/a> a dying Sun, she designed a golden spacesuit and had a factory <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproduce\" target=\"_blank\" rel=\"noopener\" data-w=\"reproduce\" data-pos=\"v.\" data-en=\"to make a copy of something\" data-zh=\"複製；再製\">reproduce<\/a> it in a few standard sizes; lacking a tailor-made quality, the final creations reflected the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ungainliness\" target=\"_blank\" rel=\"noopener\" data-w=\"ungainliness\" data-pos=\"n.\" data-en=\"the quality of being awkward or clumsy\" data-zh=\"笨拙\">ungainliness<\/a> of actual spacesuits.", "bodyPlain": "When designing costumes for film, American artist Suttirat Larlarb typically custom fits the garments to each actor. ______ for the film Sunshine, in which astronauts must reignite a dying Sun, she designed a golden spacesuit and had a factory reproduce it in a few standard sizes; lacking a tailor-made quality, the final creations reflected the ungainliness of actual spacesuits.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在為電影設計服裝時，美國藝術家 Suttirat Larlarb 通常會為每位演員量身訂製服裝。______ 在電影《Sunshine》中，太空人必須重新點燃一顆垂死的太陽，她為此設計了一套金色太空衣，並請工廠以幾種標準尺寸複製；由於缺乏量身訂製的質感，最後的成品反映出真實太空衣的笨拙感。", "opts": {"A": "Nevertheless,", "B": "Thus,", "C": "Likewise,", "D": "Moreover,"}, "optsZh": {"A": "Nevertheless,（然而、儘管如此：表讓步轉折）", "B": "Thus,（因此：表結果或推論）", "C": "Likewise,（同樣地：表相似）", "D": "Moreover,（此外、而且：表補充）"}, "answer": "A", "expl": "Larlarb usually custom-fits costumes, but for Sunshine she did the opposite, so the contrasting transition 'Nevertheless' fits.", "explZh": "Larlarb 通常會為演員量身訂製服裝，但在《Sunshine》中卻反其道而行，所以用表轉折的「Nevertheless」（然而）。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The costume designer usually creates garments tailored precisely to each actor&#x27;s body. ______ for a film about workers in bulky protective suits, she ordered standardized pieces so the clothing would look awkward and impersonal.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The costume designer usually creates garments tailored precisely to each actor's body. ______ for a film about workers in bulky protective suits, she ordered standardized pieces so the clothing would look awkward and impersonal.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。這位服裝設計師通常會製作精準貼合每位演員身形的服裝。______ 在一部關於身穿笨重防護衣工人的電影中，她訂購了標準化的服裝，讓衣著看起來笨拙而缺乏個人特色。", "opts": {"A": "Moreover,", "B": "Thus,", "C": "Nevertheless,", "D": "Likewise,"}, "optsZh": {"A": "Moreover,（此外、而且：表補充）", "B": "Thus,（因此：表結果或推論）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Likewise,（同樣地：表相似）"}, "answer": "C", "expl": "Nevertheless introduces an exception to the usual practice.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The chef typically adjusts every recipe to highlight the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredients<\/a> available that morning. ______ for a historical banquet, she followed a nineteenth-century menu exactly, even when substitutions would have been easier.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The chef typically adjusts every recipe to highlight the ingredients available that morning. ______ for a historical banquet, she followed a nineteenth-century menu exactly, even when substitutions would have been easier.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。這位主廚通常會調整每一道食譜，以突顯當天早上可取得的食材。______ 在一場歷史宴會中，她完全依照一份十九世紀的菜單烹調，即使改用替代食材會更容易。", "opts": {"A": "Instead,", "B": "Similarly,", "C": "For example,", "D": "Additionally,"}, "optsZh": {"A": "Instead,（反而、取而代之：表替代）", "B": "Similarly,（同樣地：表相似）", "C": "For example,（例如：表舉例）", "D": "Additionally,（此外：表補充）"}, "answer": "A", "expl": "Instead marks a departure from the usual method.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The architect generally designs houses around the habits of individual clients. ______ in a project for emergency shelters, he used a single repeatable plan that could be assembled quickly by volunteers.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The architect generally designs houses around the habits of individual clients. ______ in a project for emergency shelters, he used a single repeatable plan that could be assembled quickly by volunteers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這位建築師通常會依照個別客戶的生活習慣來設計房屋。______ 在一個緊急避難所的計畫中，他採用了一套可重複使用的單一設計圖，讓志工能迅速組裝。", "opts": {"A": "Likewise,", "B": "However,", "C": "Consequently,", "D": "Furthermore,"}, "optsZh": {"A": "Likewise,（同樣地：表相似）", "B": "However,（然而：表轉折）", "C": "Consequently,（因此：表結果）", "D": "Furthermore,（此外、而且：表補充）"}, "answer": "B", "expl": "However introduces a contrast with the normal practice.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The director normally encourages actors to improvise during rehearsal. ______ while filming a courtroom drama, she required them to speak the legal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=testimony\" target=\"_blank\" rel=\"noopener\" data-w=\"testimony\" data-pos=\"n.\" data-en=\"a formal statement that something is true\" data-zh=\"證詞\">testimony<\/a> exactly as written.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The director normally encourages actors to improvise during rehearsal. ______ while filming a courtroom drama, she required them to speak the legal testimony exactly as written.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位導演平常會鼓勵演員在排練時即興發揮。______ 在拍攝一部法庭劇時，她要求演員完全照稿說出法庭證詞。", "opts": {"A": "For instance,", "B": "By contrast,", "C": "Therefore,", "D": "Moreover,"}, "optsZh": {"A": "For instance,（例如：表舉例）", "B": "By contrast,（相對地：表對比）", "C": "Therefore,（因此：表結果）", "D": "Moreover,（此外、而且：表補充）"}, "answer": "B", "expl": "By contrast signals an exception.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Transitions: exception to a general pattern.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The illustrator is known for drawing each book cover by hand. ______ for a novel about mass production, she used mechanical stamps to create deliberately uniform images.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The illustrator is known for drawing each book cover by hand. ______ for a novel about mass production, she used mechanical stamps to create deliberately uniform images.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n這位插畫家以手繪每一張書籍封面而聞名。______ 為一部關於大量生產的小說，她使用機械印章刻意製作出整齊劃一的圖像。", "opts": {"A": "In addition,", "B": "Thus,", "C": "Similarly,", "D": "Nevertheless,"}, "optsZh": {"A": "In addition,（此外：表補充）", "B": "Thus,（因此：表結果或推論）", "C": "Similarly,（同樣地：表相似）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "D", "expl": "Nevertheless marks an unexpected departure.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Shaun Tan is an Australian author.<br>- In 2008, he published Tales from Outer Suburbia, a book of fifteen short stories.<br>- The stories describe surreal events occurring in otherwise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ordinary\" target=\"_blank\" rel=\"noopener\" data-w=\"ordinary\" data-pos=\"adj.\" data-en=\"normal and not special\" data-zh=\"普通的；平常的\">ordinary<\/a> suburban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a>.<br>- In 2018, he published Tales from the Inner City, a book of twenty-five short stories.<br>- The stories describe surreal events occurring in otherwise ordinary urban settings.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Shaun Tan is an Australian author.\n- In 2008, he published Tales from Outer Suburbia, a book of fifteen short stories.\n- The stories describe surreal events occurring in otherwise ordinary suburban neighborhoods.\n- In 2018, he published Tales from the Inner City, a book of twenty-five short stories.\n- The stories describe surreal events occurring in otherwise ordinary urban settings.", "stem": "The student wants to emphasize a similarity between the two books by Shaun Tan. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調 Shaun Tan 兩本著作之間的相似之處。哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- Shaun Tan 是一位澳洲作家。\n- 2008 年，他出版了《Tales from Outer Suburbia》，這是一本收錄十五篇短篇故事的書。\n- 這些故事描述了發生在原本平凡的郊區社區中的超現實事件。\n- 2018 年，他出版了《Tales from the Inner City》，這是一本收錄二十五篇短篇故事的書。\n- 這些故事描述了發生在原本平凡的城市環境中的超現實事件。", "opts": {"A": "Shaun Tan's book Tales from Outer Suburbia, which describes surreal events occurring in otherwise ordinary places, contains fewer short stories than Tales from the Inner City does.", "B": "Tales from Outer Suburbia was published in 2008, and Tales from the Inner City was published in 2018.", "C": "Unlike Tales from the Inner City, Shaun Tan's book Tales from Outer Suburbia is set in suburban neighborhoods.", "D": "Shaun Tan's books Tales from Outer Suburbia and Tales from the Inner City both describe surreal events occurring in otherwise ordinary places."}, "optsZh": {"A": "Shaun Tan 的著作《Tales from Outer Suburbia》描寫發生在原本平凡之處的超現實事件，其所收錄的短篇故事比《Tales from the Inner City》少。", "B": "《Tales from Outer Suburbia》於 2008 年出版，而《Tales from the Inner City》於 2018 年出版。", "C": "與《Tales from the Inner City》不同，Shaun Tan 的著作《Tales from Outer Suburbia》以郊區社區為背景。", "D": "Shaun Tan 的著作《Tales from Outer Suburbia》與《Tales from the Inner City》都描寫發生在原本平凡之處的超現實事件。"}, "answer": "D", "expl": "Only this choice states what the two books share: both describe surreal events in otherwise ordinary places.", "explZh": "只有這個選項說明兩本書的共同點：都描寫發生在平凡場所中的超現實事件。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Amina Lu wrote River Markets in 2015; the book follows merchants in floating villages; she wrote Stone Alleys in 2021; that book follows shopkeepers in mountain towns; both books explore how commerce shapes community life; the goal is to emphasize a similarity.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Amina Lu wrote River Markets in 2015; the book follows merchants in floating villages; she wrote Stone Alleys in 2021; that book follows shopkeepers in mountain towns; both books explore how commerce shapes community life; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。筆記：Amina Lu 於 2015 年寫了《River Markets》；這本書描寫水上村落的商人；她於 2021 年寫了《Stone Alleys》；那本書描寫山城的店主；兩本書都探討商業如何形塑社區生活；目標是強調兩者的相似之處。", "opts": {"A": "River Markets was published six years before Stone Alleys.", "B": "Amina Lu's River Markets and Stone Alleys both explore how commerce shapes community life.", "C": "Amina Lu writes about merchants and shopkeepers.", "D": "River Markets is set in floating villages, whereas Stone Alleys is set in mountain towns."}, "optsZh": {"A": "《River Markets》比《Stone Alleys》早六年出版。", "B": "Amina Lu 的《River Markets》與《Stone Alleys》都探討商業如何形塑社群生活。", "C": "Amina Lu 的作品描寫商人與店主。", "D": "《River Markets》以水上村落為背景，而《Stone Alleys》則以山城為背景。"}, "answer": "B", "expl": "The answer directly states the shared feature.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Javier Ortiz directed Northbound in 2010; the film follows a family traveling by train; he directed Harbor Lights in 2018; the film follows sailors returning home; both films focus on journeys that change family <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationships<\/a>; the goal is to emphasize a similarity.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Javier Ortiz directed Northbound in 2010; the film follows a family traveling by train; he directed Harbor Lights in 2018; the film follows sailors returning home; both films focus on journeys that change family relationships; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。筆記：Javier Ortiz 於 2010 年執導了《Northbound》；這部電影描寫一個搭火車旅行的家庭；他於 2018 年執導了《Harbor Lights》；這部電影描寫返鄉的水手；兩部電影都聚焦於改變家庭關係的旅程；目標是強調兩者的相似之處。", "opts": {"A": "Javier Ortiz has directed films about families.", "B": "Northbound was released before Harbor Lights.", "C": "One film concerns train travel, and the other concerns sea travel.", "D": "Both Northbound and Harbor Lights focus on journeys that change family relationships."}, "optsZh": {"A": "Javier Ortiz 曾執導以家庭為題材的電影。", "B": "《Northbound》比《Harbor Lights》早上映。", "C": "一部電影關於火車旅行，另一部關於海上旅行。", "D": "《Northbound》與《Harbor Lights》都聚焦於改變家庭關係的旅程。"}, "answer": "D", "expl": "The answer emphasizes what the two works have in common.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: The museum owns a bronze mask from the Edo Kingdom; it also owns a carved wooden mask from the Yoruba region; both masks were used in ceremonial contexts; the materials and regions differ; the goal is to emphasize a similarity.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: The museum owns a bronze mask from the Edo Kingdom; it also owns a carved wooden mask from the Yoruba region; both masks were used in ceremonial contexts; the materials and regions differ; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。筆記：這間博物館擁有一副來自 Edo 王國的青銅面具；它也擁有一副來自約魯巴地區的木雕面具；兩副面具都曾用於儀式場合；兩者的材質和地區不同；目標是強調兩者的相似之處。", "opts": {"A": "Although they differ in material and origin, both masks were used in ceremonial contexts.", "B": "The bronze mask and the wooden mask were made from different materials.", "C": "The Edo Kingdom and the Yoruba region produced distinctive artworks.", "D": "The museum owns masks from more than one West African tradition."}, "optsZh": {"A": "雖然兩副面具的材質與來源不同，但兩者都曾用於儀式場合。", "B": "青銅面具與木製面具是以不同材料製成的。", "C": "Edo 王國與 Yoruba 地區都創作出獨具特色的藝術品。", "D": "這間博物館收藏了來自不只一種西非傳統的面具。"}, "answer": "A", "expl": "The answer identifies the shared ceremonial use.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: The novel Blue Orchard takes place in a farming village; the novel Glass Station takes place in a future city; both novels feature young narrators questioning inherited rules; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: The novel Blue Orchard takes place in a farming village; the novel Glass Station takes place in a future city; both novels feature young narrators questioning inherited rules; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。筆記：小說《Blue Orchard》的背景是一座農村；小說《Glass Station》的背景是一座未來城市；兩部小說都有質疑傳承規範的年輕敘述者；目標是強調兩者的相似之處。", "opts": {"A": "The novels differ sharply in setting.", "B": "Glass Station takes place in a future city.", "C": "Blue Orchard and Glass Station both feature young narrators who question inherited rules.", "D": "Blue Orchard takes place in a farming village."}, "optsZh": {"A": "這兩部小說的背景截然不同。", "B": "《Glass Station》的故事發生在一座未來城市。", "C": "《Blue Orchard》與《Glass Station》都以質疑傳統規範的年輕敘事者為主角。", "D": "《Blue Orchard》的故事發生在一個農村。"}, "answer": "C", "expl": "The answer states the common narrative feature.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Biologist Leila Park studied desert beetles; she later studied alpine butterflies; both projects examined how small animals conserve water; the goal is to emphasize a similarity.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Biologist Leila Park studied desert beetles; she later studied alpine butterflies; both projects examined how small animals conserve water; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n筆記：生物學家 Leila Park 研究過沙漠甲蟲；她後來研究高山蝴蝶；兩項研究都探討小型動物如何保存水分；目標是強調兩者的相似之處。", "opts": {"A": "Leila Park's studies of desert beetles and alpine butterflies both examined how small animals conserve water.", "B": "Desert beetles live in hotter habitats than alpine butterflies do.", "C": "Water conservation can be important for many species.", "D": "Park studied beetles before she studied butterflies."}, "optsZh": {"A": "Leila Park 對沙漠甲蟲與高山蝴蝶的研究，都探討了小型動物如何保存水分。", "B": "沙漠甲蟲的棲地比高山蝴蝶的棲地更炎熱。", "C": "保存水分對許多物種而言可能很重要。", "D": "Park 先研究甲蟲，之後才研究蝴蝶。"}, "answer": "A", "expl": "The answer foregrounds the shared research focus.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: emphasize the aim of a study.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The factors that affect clutch size (the number of eggs laid at one time) have been well studied in birds but not in lizards.<br>- A team led by Shai Meiri of Tel Aviv University investigated which factors influence lizard clutch size.<br>- Meiri&#x27;s team obtained clutch-size and habitat data for over 3,900 lizard <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> and analyzed the data with statistical models.<br>- Larger clutch size was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> in higher latitudes that have more seasonal change.<br>- Lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The factors that affect clutch size (the number of eggs laid at one time) have been well studied in birds but not in lizards.\n- A team led by Shai Meiri of Tel Aviv University investigated which factors influence lizard clutch size.\n- Meiri's team obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models.\n- Larger clutch size was associated with environments in higher latitudes that have more seasonal change.\n- Lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.", "stem": "The student wants to emphasize the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調這項研究的目的。哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- 影響窩卵數（一次產下的蛋數）的因素在鳥類身上已有充分研究，但在蜥蜴身上則不然。\n- 由特拉維夫大學 Shai Meiri 帶領的團隊，研究了哪些因素會影響蜥蜴的窩卵數。\n- Meiri 的團隊取得了超過 3,900 種蜥蜴的窩卵數與棲地資料，並用統計模型分析這些資料。\n- 較大的窩卵數與季節變化較明顯的高緯度環境有關。\n- 高緯度環境中的蜥蜴可能會產下較多的蛋，以利用較短暫的有利條件時段。", "opts": {"A": "Researchers wanted to know which factors influence lizard egg clutch size because such factors have been well studied in birds but not in lizards.", "B": "After they obtained data for over 3,900 lizard species, researchers determined that larger clutch size was associated with environments in higher latitudes that have more seasonal change.", "C": "We now know that lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.", "D": "Researchers obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models."}, "optsZh": {"A": "研究人員想知道哪些因素會影響蜥蜴的產卵數，因為這些因素在鳥類中已有充分研究，在蜥蜴中卻沒有。", "B": "在取得超過 3,900 種蜥蜴的資料後，研究人員確定較大的產卵數與季節變化較大的高緯度環境有關。", "C": "我們現在知道，生活在高緯度環境的蜥蜴可能會產下較多的卵，以利用較短暫的有利條件期。", "D": "研究人員取得了超過 3,900 種蜥蜴的產卵數與棲地資料，並以統計模型分析這些資料。"}, "answer": "A", "expl": "This choice states what the researchers wanted to learn (which factors influence lizard clutch size) and why, which is the study's aim.", "explZh": "這個選項說明研究者想了解什麼（哪些因素影響蜥蜴的產卵數）以及原因，也就是研究目的。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: emphasize the aim of a study.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers wanted to know why young fish save energy when swimming behind adults; they used water-tank simulations; the goal is to present the study and methodology.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers wanted to know why young fish save energy when swimming behind adults; they used water-tank simulations; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。筆記：研究人員想知道為什麼幼魚在成魚後方游泳時能節省能量；他們使用水槽模擬；目標是介紹這項研究及其方法。", "opts": {"A": "A study found that young fish can save energy near adults.", "B": "Fish sometimes swim in groups.", "C": "The researchers studied adult fish.", "D": "To investigate why young fish save energy behind adults, researchers used water-tank simulations to model the adults' wake."}, "optsZh": {"A": "一項研究發現，幼魚在成魚附近可以節省能量。", "B": "魚有時會成群游動。", "C": "研究人員研究的是成魚。", "D": "為了探究幼魚為何能在成魚後方節省能量，研究人員利用水槽模擬來模擬成魚造成的尾流。"}, "answer": "D", "expl": "The answer gives the study purpose and method.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: emphasize the aim of a study.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Scientists investigated how cyclists reduce air resistance when riding in a line; they used wind-tunnel tests; the goal is to present the study and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Scientists investigated how cyclists reduce air resistance when riding in a line; they used wind-tunnel tests; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。筆記：科學家研究自行車手排成一列騎乘時如何減少空氣阻力；他們使用風洞測試；目標是介紹這項研究及其方法。", "opts": {"A": "Cyclists can reduce air resistance in groups.", "B": "The study involved cyclists.", "C": "Scientists used wind-tunnel tests to study how cyclists reduce air resistance when riding in a line.", "D": "Wind tunnels are used in engineering."}, "optsZh": {"A": "自行車騎士成群騎行可以減少空氣阻力。", "B": "這項研究以自行車騎士為對象。", "C": "科學家利用風洞測試，研究自行車騎士排成一列騎行時如何減少空氣阻力。", "D": "風洞被用於工程領域。"}, "answer": "C", "expl": "The answer presents both aim and method.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: emphasize the aim of a study.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and
