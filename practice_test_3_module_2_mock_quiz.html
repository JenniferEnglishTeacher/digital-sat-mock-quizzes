observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。新的檔案法要求博物館在展示文化物品之前諮詢後裔社群，但允許博物館將諮詢協議保密封存。一些社群領袖擔心，這項條款可能會 ______", "opts": {"A": "discourage museums from preserving fragile objects.", "B": "prevent curators from learning about the objects' cultural meanings.", "C": "obscure whether communities actually have meaningful influence over display decisions.", "D": "force museums to return every object in their collections."}, "optsZh": {"A": "使博物館不願保存易碎的物品。", "B": "使策展人無法了解這些物品的文化意涵。", "C": "使人無法清楚得知社群是否真正對展示決策具有實質影響力。", "D": "迫使博物館歸還其館藏中的每一件物品。"}, "answer": "C", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a>/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。一項漁業條約要求企業在使用傳統生態知識時補償沿海村落，然而這項條約卻允許付款合約不公開。批評者主張，這項保密規定可能會 ______", "opts": {"A": "stop companies from conducting ecological research.", "B": "make it impossible for independent observers to judge whether compensation is equitable.", "C": "increase the number of fish caught by local crews.", "D": "reduce villages' knowledge of marine species."}, "optsZh": {"A": "阻止公司進行生態研究。", "B": "使獨立觀察者無法判斷補償是否公平。", "C": "增加當地船員的捕魚量。", "D": "減少村民對海洋物種的了解。"}, "answer": "B", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Logical Completion: unintended effect of confidentiality.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n一項大學政策要求科技公司在使用原住民語言使用者的錄音來訓練語音辨識系統時給予補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "prevent outsiders from verifying whether speakers are paid fairly.", "B": "increase the cost of recording equipment.", "C": "require speakers to learn programming skills.", "D": "discourage researchers from documenting endangered languages."}, "optsZh": {"A": "使外界無法核實說話者是否獲得公平的報酬。", "B": "提高錄音設備的成本。", "C": "要求說話者學習程式設計技能。", "D": "使研究人員不願記錄瀕危語言。"}, "answer": "A", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "The domestic sweet potato (Ipomoea batatas) descends from a wild plant native to South America. It also populates the Polynesian Islands, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> confirms that Native Hawaiians and other Indigenous peoples were cultivating the plant centuries before seafaring first occurred over the thousands of miles of ocean separating them from South America. To explain how the sweet potato was first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduced<\/a> in Polynesia, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a> Pablo Munoz-Rodriguez and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> analyzed the DNA of numerous varieties of the plant, concluding that Polynesian varieties diverged from South American ones over 100,000 years ago. Given that Polynesia was peopled only in the last three thousand years, the team concluded that ______", "bodyPlain": "The domestic sweet potato (Ipomoea batatas) descends from a wild plant native to South America. It also populates the Polynesian Islands, where evidence confirms that Native Hawaiians and other Indigenous peoples were cultivating the plant centuries before seafaring first occurred over the thousands of miles of ocean separating them from South America. To explain how the sweet potato was first introduced in Polynesia, botanist Pablo Munoz-Rodriguez and colleagues analyzed the DNA of numerous varieties of the plant, concluding that Polynesian varieties diverged from South American ones over 100,000 years ago. Given that Polynesia was peopled only in the last three thousand years, the team concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "栽培種甘藷（Ipomoea batatas）源自一種原生於南美洲的野生植物。它也分布於玻里尼西亞群島，那裡的證據證實，早在人類首次跨越將他們與南美洲分隔開來、長達數千英里的海洋航行之前數百年，夏威夷原住民和其他原住民族就已經在栽種這種植物。為了解釋甘藷最初是如何被引進玻里尼西亞的，植物學家 Pablo Munoz-Rodriguez 與同事分析了這種植物眾多品種的 DNA，得出結論：玻里尼西亞的品種早在十萬多年前就已與南美洲的品種分化。由於玻里尼西亞直到最近三千年內才有人類定居，該團隊得出結論：______", "opts": {"A": "the cultivation of the sweet potato in Polynesia likely predates its cultivation in South America.", "B": "Polynesian peoples likely acquired the sweet potato from South American peoples only within the last three thousand years.", "C": "human activity likely played no role in the introduction of the sweet potato in Polynesia.", "D": "Polynesian sweet potato varieties likely descend from a single South American variety that was domesticated, not wild."}, "optsZh": {"A": "玻里尼西亞栽種番薯的歷史很可能早於南美洲。", "B": "玻里尼西亞人很可能只是在過去三千年內才從南美洲人那裡取得番薯。", "C": "人類活動很可能與番薯被引進玻里尼西亞無關。", "D": "玻里尼西亞的番薯品種很可能源自單一的南美洲品種，而且該品種是經過馴化的，而非野生的。"}, "answer": "C", "expl": "Polynesian varieties split from South American ones over 100,000 years ago, long before people arrived, so humans likely did not bring the sweet potato there.", "explZh": "玻里尼西亞品種在十萬多年前就與南美品種分化，遠早於人類抵達，因此人類很可能沒有參與番薯的引進。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼之前數千年，就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "all island plants descended from a single cultivated variety.", "C": "the plant probably reached the islands without human assistance.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "人類商人必定是在最近才運送了這些種子。", "B": "所有島嶼植物都源自單一的栽培品種。", "C": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。", "D": "島上族群比本土族群更早被馴化。"}, "answer": "C", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。有一種甲蟲同時分布於某個大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久，就已從海岸族群中分化出來，因此研究團隊推論 ______", "opts": {"A": "the beetles were likely introduced by natural dispersal rather than by humans.", "B": "the beetles were domesticated by island communities.", "C": "humans carried the beetles to the island during early trade voyages.", "D": "the island beetles must be younger than the coastal beetles."}, "optsZh": {"A": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "B": "這些甲蟲是被島上的社群馴化的。", "C": "人類在早期的貿易航行中把這些甲蟲帶到了島上。", "D": "島上的甲蟲必定比沿海的甲蟲年輕。"}, "answer": "A", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳到某個群島的，但對相關口述傳統的比較顯示，這首歌的核心語句在遷徙發生之前就已形成。因此，語言學家得出結論：______", "opts": {"A": "the song was probably not introduced to the archipelago by that migration.", "B": "the migration must have begun earlier than any other human movement.", "C": "the song could not have changed after the migration.", "D": "all versions of the song are identical."}, "optsZh": {"A": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "B": "這次遷徙必定比其他任何人類遷移都更早開始。", "C": "這首歌在遷徙之後不可能有所改變。", "D": "這首歌的所有版本都完全相同。"}, "answer": "A", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> led them to argue that ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。研究某座偏遠島嶼上一種作物的植物學家發現，島上的品種在人類定居該島之前數萬年，就已與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the island variety must be genetically identical to wild mainland plants.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "the crop was first domesticated on the island.", "D": "mainland farmers acquired the crop from island communities."}, "optsZh": {"A": "島上的品種必定與本土的野生植物在基因上完全相同。", "B": "人類定居很可能不是這種植物最初來到該島的原因。", "C": "這種作物最初是在島上被馴化的。", "D": "本土農民是從島上的社群取得這種作物的。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: DNA evidence and historical timing.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n研究人員原本以為，一種淡水蝸牛是在人們開始在一連串湖泊之間移動船隻時抵達那些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "boats probably explain every modern snail population.", "C": "human activity made the populations genetically identical.", "D": "the snails likely spread through an earlier nonhuman mechanism."}, "optsZh": {"A": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "B": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "C": "人類活動使這些族群在基因上完全相同。", "D": "這些蝸牛很可能是透過更早的非人為機制擴散的。"}, "answer": "D", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "Atoms in a synchrotron, a type of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circular\" target=\"_blank\" rel=\"noopener\" data-w=\"circular\" data-pos=\"adj.\" data-en=\"shaped like a circle\" data-zh=\"圓形的\">circular<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particle<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accelerator\" target=\"_blank\" rel=\"noopener\" data-w=\"accelerator\" data-pos=\"n.\" data-en=\"a machine that makes particles move very fast\" data-zh=\"加速器\">accelerator<\/a>, travel faster and faster until they ______ a desired energy level, at which point they are diverted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collide\" target=\"_blank\" rel=\"noopener\" data-w=\"collide\" data-pos=\"v.\" data-en=\"to hit something while moving\" data-zh=\"碰撞\">collide<\/a> with a target, smashing the atoms.", "bodyPlain": "Atoms in a synchrotron, a type of circular particle accelerator, travel faster and faster until they ______ a desired energy level, at which point they are diverted to collide with a target, smashing the atoms.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在同步加速器（一種環形粒子加速器）中，原子的速度會越來越快，直到它們 ______ 所需的能量水準，此時它們會被轉向去撞擊目標，使原子粉碎。", "opts": {"A": "will reach", "B": "reach", "C": "had reached", "D": "are reaching"}, "optsZh": {"A": "will reach（未來式 → 不適合描述一般性的科學過程：錯誤）", "B": "reach（現在簡單式，描述一般性的科學過程：正確）", "C": "had reached（過去完成式 → 與現在式敘述不一致：錯誤）", "D": "are reaching（現在進行式 → 不適合描述一般性的科學過程：錯誤）"}, "answer": "B", "expl": "The sentence describes a general, repeated process in the simple present ('travel,' 'are diverted'), so 'reach' keeps the tense consistent.", "explZh": "句子用簡單現在式描述一般、反覆發生的過程（travel、are diverted），所以用「reach」保持時態一致。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "to use", "C": "having used", "D": "have used"}, "optsZh": {"A": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects, but", "B": "effects,", "C": "effects", "D": "effects but"}, "optsZh": {"A": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "B": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "effects but（but 前缺少逗號：錯誤）"}, "answer": "A", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "was proposing", "B": "had proposed", "C": "proposed", "D": "proposes"}, "optsZh": {"A": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "B": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "C": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "D": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）"}, "answer": "C", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects, producing", "B": "insects. Producing", "C": "insects; producing", "D": "insects producing"}, "optsZh": {"A": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "B": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "C": "insects; producing（分號後不是獨立子句：錯誤）", "D": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）"}, "answer": "A", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English: present-tense sequence in scientific process.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "the focus of many critics has been her religious imagery; they", "B": "many critics have focused on her religious imagery but", "C": "there are many critics who focused on her religious imagery, but they", "D": "her religious imagery has been the focus of many critics, who"}, "optsZh": {"A": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "C": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "B", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "Even though bats <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prefer\" target=\"_blank\" rel=\"noopener\" data-w=\"prefer\" data-pos=\"v.\" data-en=\"to like one thing more than another\" data-zh=\"偏好；比較喜歡\">prefer<\/a> very sweet <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nectar\" target=\"_blank\" rel=\"noopener\" data-w=\"nectar\" data-pos=\"n.\" data-en=\"a sweet liquid made by flowers\" data-zh=\"花蜜\">nectar<\/a>, the plants that attract them have evolved to produce nectar that is only <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=moderately\" target=\"_blank\" rel=\"noopener\" data-w=\"moderately\" data-pos=\"adv.\" data-en=\"to an average or medium degree\" data-zh=\"適度地；中等程度地\">moderately<\/a> sweet. A recent study ______ why: making sugar is energy-intensive, and it is more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advantageous\" target=\"_blank\" rel=\"noopener\" data-w=\"advantageous\" data-pos=\"adj.\" data-en=\"giving a benefit or advantage\" data-zh=\"有利的\">advantageous<\/a> for plants to make a large amount of low-sugar nectar than a small amount of high-sugar nectar.", "bodyPlain": "Even though bats prefer very sweet nectar, the plants that attract them have evolved to produce nectar that is only moderately sweet. A recent study ______ why: making sugar is energy-intensive, and it is more advantageous for plants to make a large amount of low-sugar nectar than a small amount of high-sugar nectar.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "儘管蝙蝠偏好非常甜的花蜜，吸引蝙蝠的植物卻演化成只產生甜度中等的花蜜。最近一項研究 ______ 原因：製造糖分非常耗能，對植物來說，製造大量低糖花蜜比製造少量高糖花蜜更有利。", "opts": {"A": "explains", "B": "explaining", "C": "having explained", "D": "to explain"}, "optsZh": {"A": "explains（單數現在式限定動詞，與主詞 A recent study 一致：正確）", "B": "explaining（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "having explained（分詞 → 句子缺少主要動詞：錯誤）", "D": "to explain（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The subject 'A recent study' needs a finite main verb; 'explains' is a singular present-tense verb.", "explZh": "主詞「A recent study」需要一個限定動詞當主要動詞；「explains」是單數現在式動詞。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "having used", "B": "using", "C": "have used", "D": "to use"}, "optsZh": {"A": "having used（分詞 → 句子缺少主要動詞：錯誤）", "B": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）", "D": "to use（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects", "B": "effects but", "C": "effects,", "D": "effects, but"}, "optsZh": {"A": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "effects but（but 前缺少逗號：錯誤）", "C": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposed", "C": "proposes", "D": "was proposing"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "C": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "D": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects. Producing", "B": "insects producing", "C": "insects, producing", "D": "insects; producing"}, "optsZh": {"A": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "B": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "C": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "D": "insects; producing（分號後不是獨立子句：錯誤）"}, "answer": "C", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: finite verb after subject.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "many critics have focused on her religious imagery but", "B": "her religious imagery has been the focus of many critics, who", "C": "the focus of many critics has been her religious imagery; they", "D": "there are many critics who focused on her religious imagery, but they"}, "optsZh": {"A": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "B": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "A", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "Former First Lady of the United States Eleanor Roosevelt and Indian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activist<\/a> and educator Hansa Mehta were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrumental<\/a> in drafting the United Nations&#x27; Universal Declaration of Human Rights, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">document<\/a> that ______ the basic freedoms to which all people are entitled.", "bodyPlain": "Former First Lady of the United States Eleanor Roosevelt and Indian activist and educator Hansa Mehta were instrumental in drafting the United Nations' Universal Declaration of Human Rights, a document that ______ the basic freedoms to which all people are entitled.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "美國前第一夫人 Eleanor Roosevelt 與印度社運人士暨教育家 Hansa Mehta 在起草聯合國《世界人權宣言》上發揮了關鍵作用，這份文件 ______ 所有人都應享有的基本自由。", "opts": {"A": "have outlined", "B": "were outlining", "C": "outlines", "D": "outline"}, "optsZh": {"A": "have outlined（複數動詞 → 與單數先行詞 a document 不一致：錯誤）", "B": "were outlining（複數過去進行式 → 與單數先行詞不一致，時態也不當：錯誤）", "C": "outlines（單數現在式，與單數先行詞 a document 一致：正確）", "D": "outline（複數動詞 → 與單數先行詞 a document 不一致：錯誤）"}, "answer": "C", "expl": "'That' refers to the singular 'a document,' and the declaration still exists, so the singular present 'outlines' is correct.", "explZh": "「that」指的是單數的「a document」，而且這份宣言至今仍存在，所以用單數現在式「outlines」。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "having used", "B": "have used", "C": "to use", "D": "using"}, "optsZh": {"A": "having used（分詞 → 句子缺少主要動詞：錯誤）", "B": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）", "C": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "D": "using（現在分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects, but", "B": "effects", "C": "effects,", "D": "effects but"}, "optsZh": {"A": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "B": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "C": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "effects but（but 前缺少逗號：錯誤）"}, "answer": "A", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposed", "C": "proposes", "D": "was proposing"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "C": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "D": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transp
