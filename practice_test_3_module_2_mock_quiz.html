ortation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects; producing", "B": "insects. Producing", "C": "insects, producing", "D": "insects producing"}, "optsZh": {"A": "insects; producing（分號後不是獨立子句：錯誤）", "B": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "C": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "D": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）"}, "answer": "C", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: relative clause agreement.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "there are many critics who focused on her religious imagery, but they", "B": "the focus of many critics has been her religious imagery; they", "C": "her religious imagery has been the focus of many critics, who", "D": "many critics have focused on her religious imagery but"}, "optsZh": {"A": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）"}, "answer": "D", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "The life <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=span\" target=\"_blank\" rel=\"noopener\" data-w=\"span\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"期間；跨度\">spans<\/a> of rockfish vary greatly by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>. For instance, the colorful calico rockfish (Sebastes dalli) can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> for a little over a ______ the rougheye rockfish (Sebastes aleutianus) <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=boast\" target=\"_blank\" rel=\"noopener\" data-w=\"boast\" data-pos=\"v.\" data-en=\"to have something impressive\" data-zh=\"擁有（值得誇耀的事物）\">boasts<\/a> a maximum life span of about two centuries.", "bodyPlain": "The life spans of rockfish vary greatly by species. For instance, the colorful calico rockfish (Sebastes dalli) can survive for a little over a ______ the rougheye rockfish (Sebastes aleutianus) boasts a maximum life span of about two centuries.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "石狗公（rockfish）的壽命因物種不同而有很大差異。例如，色彩繽紛的 calico rockfish（Sebastes dalli）可以存活十多 ______ rougheye rockfish（Sebastes aleutianus）的最長壽命則可達約兩個世紀。", "opts": {"A": "decade: while", "B": "decade. While", "C": "decade; while", "D": "decade, while"}, "optsZh": {"A": "decade: while（冒號後不是獨立子句：錯誤）", "B": "decade. While（句號 → while 子句成為句子片段：錯誤）", "C": "decade; while（分號後不是獨立子句：錯誤）", "D": "decade, while（逗號＋從屬連接詞 while 引導從屬子句：正確）"}, "answer": "D", "expl": "'While' begins a dependent clause showing contrast; a comma correctly joins it to the main clause.", "explZh": "「while」引導表對比的從屬子句，用逗號接在主要子句後即可。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "to use", "B": "using", "C": "have used", "D": "having used"}, "optsZh": {"A": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "B": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）", "D": "having used（分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects, but", "B": "effects but", "C": "effects,", "D": "effects"}, "optsZh": {"A": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "B": "effects but（but 前缺少逗號：錯誤）", "C": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "effects（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "A", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposed", "C": "was proposing", "D": "proposes"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "C": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "D": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects; producing", "B": "insects. Producing", "C": "insects producing", "D": "insects, producing"}, "optsZh": {"A": "insects; producing（分號後不是獨立子句：錯誤）", "B": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "C": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "D": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）"}, "answer": "D", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "there are many critics who focused on her religious imagery, but they", "B": "many critics have focused on her religious imagery but", "C": "the focus of many critics has been her religious imagery; they", "D": "her religious imagery has been the focus of many critics, who"}, "optsZh": {"A": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "C": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "B", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "The Lion Light system, developed by Kenyan inventor Richard Turere, consists of LED lights <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=install\" target=\"_blank\" rel=\"noopener\" data-w=\"install\" data-pos=\"v.\" data-en=\"to put equipment in place so it can be used\" data-zh=\"安裝\">installed<\/a> around the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perimeter\" target=\"_blank\" rel=\"noopener\" data-w=\"perimeter\" data-pos=\"n.\" data-en=\"the outer edge of an area\" data-zh=\"周邊；周界\">perimeter<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=livestock\" target=\"_blank\" rel=\"noopener\" data-w=\"livestock\" data-pos=\"n.\" data-en=\"farm animals such as cows and sheep\" data-zh=\"家畜；牲畜\">livestock<\/a> pastures. Powered with ______ the blinking LEDs keep lions away at night, thus protecting the livestock without risking harm to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endangered\" target=\"_blank\" rel=\"noopener\" data-w=\"endangered\" data-pos=\"adj.\" data-en=\"at risk of disappearing completely\" data-zh=\"瀕臨絕種的\">endangered<\/a> lions.", "bodyPlain": "The Lion Light system, developed by Kenyan inventor Richard Turere, consists of LED lights installed around the perimeter of livestock pastures. Powered with ______ the blinking LEDs keep lions away at night, thus protecting the livestock without risking harm to the endangered lions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "由肯亞發明家 Richard Turere 開發的 Lion Light 系統，是由安裝在牲畜牧場周圍的 LED 燈所組成。以 ______ 為電力來源，這些閃爍的 LED 燈在夜間使獅子不敢靠近，從而保護牲畜，又不會傷害到瀕危的獅子。", "opts": {"A": "energy collected, by solar panels, during the day", "B": "energy collected by solar panels during the day", "C": "energy collected by solar panels during the day,", "D": "energy, collected by solar panels during the day,"}, "optsZh": {"A": "energy collected, by solar panels, during the day（逗號不當隔開必要的修飾成分：錯誤）", "B": "energy collected by solar panels during the day（缺少逗號 → 介系詞片語與主要子句無分隔：錯誤）", "C": "energy collected by solar panels during the day,（限定性修飾語不加逗號，在引導片語結尾加逗號：正確）", "D": "energy, collected by solar panels during the day,（以逗號將必要的修飾語當成非限定插入語：錯誤）"}, "answer": "C", "expl": "'Powered with energy collected by solar panels during the day' is an introductory phrase; the essential modifier needs no internal commas, and a comma must separate the phrase from the main clause.", "explZh": "「Powered with energy collected by solar panels during the day」是句首修飾片語；其中的限定修飾語不需加逗號，但片語結束後要用逗號與主要子句隔開。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "to use", "B": "using", "C": "having used", "D": "have used"}, "optsZh": {"A": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "B": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects but", "B": "effects, but", "C": "effects,", "D": "effects"}, "optsZh": {"A": "effects but（but 前缺少逗號：錯誤）", "B": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "C": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "effects（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "B", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposes", "C": "was proposing", "D": "proposed"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）", "C": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "D": "proposed（一般過去式，與前句 recommended 時態一致：正確）"}, "answer": "D", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects, producing", "B": "insects; producing", "C": "insects. Producing", "D": "insects producing"}, "optsZh": {"A": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "B": "insects; producing（分號後不是獨立子句：錯誤）", "C": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）", "D": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）"}, "answer": "A", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: restrictive modifier punctuation.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "the focus of many critics has been her religious imagery; they", "B": "there are many critics who focused on her religious imagery, but they", "C": "many critics have focused on her religious imagery but", "D": "her religious imagery has been the focus of many critics, who"}, "optsZh": {"A": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "B": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "D": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "C", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "Materials scientist Marie-Agathe Charpagne and her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> believed they could improve on the multicomponent alloy NiCoCr, an equal-proportions <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mixture\" target=\"_blank\" rel=\"noopener\" data-w=\"mixture\" data-pos=\"n.\" data-en=\"a combination of different things\" data-zh=\"混合物\">mixture<\/a> of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium ______ the alloy that resulted, NiCoRu, turned out to be an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unsuitable\" target=\"_blank\" rel=\"noopener\" data-w=\"unsuitable\" data-pos=\"adj.\" data-en=\"not right for a purpose\" data-zh=\"不合適的\">unsuitable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replacement\" target=\"_blank\" rel=\"noopener\" data-w=\"replacement\" data-pos=\"n.\" data-en=\"a thing that takes the place of another\" data-zh=\"替代品\">replacement<\/a> for NiCoCr.", "bodyPlain": "Materials scientist Marie-Agathe Charpagne and her colleagues believed they could improve on the multicomponent alloy NiCoCr, an equal-proportions mixture of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium ______ the alloy that resulted, NiCoRu, turned out to be an unsuitable replacement for NiCoCr.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "材料科學家 Marie-Agathe Charpagne 與同事認為，他們可以用釕取代鉻來改良多元合金 NiCoCr——一種由鎳（Ni）、鈷（Co）和鉻（Cr）等比例混合而成的合金 ______ 結果所得到的合金 NiCoRu，卻證明不適合用來取代 NiCoCr。", "opts": {"A": "(Ru)", "B": "(Ru) but", "C": "(Ru),", "D": "(Ru), but"}, "optsZh": {"A": "(Ru)（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "(Ru) but（but 前缺少逗號：錯誤）", "C": "(Ru),（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "(Ru), but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "Two independent clauses are joined with a comma plus the coordinating conjunction 'but.'", "explZh": "兩個獨立子句用「逗號＋對等連接詞 but」連接。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "to use", "C": "having used", "D": "have used"}, "optsZh": {"A": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects", "B": "effects,", "C": "effects but", "D": "effects, but"}, "optsZh": {"A": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "effects but（but 前缺少逗號：錯誤）", "D": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "was proposing", "B": "had proposed", "C": "proposed", "D": "proposes"}, "optsZh": {"A": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "B": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "C": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "D": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）"}, "answer": "C", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects producing", "B": "insects, producing", "C": "insects; producing", "D": "insects. Producing"}, "optsZh": {"A": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "B": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "C": "insects; producing（分號後不是獨立子句：錯誤）", "D": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）"}, "answer": "B", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: punctuation before contrasting but.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及多個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的些微改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "many critics have focused on her religious imagery but", "B": "her religious imagery has been the focus of many critics, who", "C": "there are many critics who focused on her religious imagery, but they", "D": "the focus of many critics has been her religious imagery; they"}, "optsZh": {"A": "many critics have focused on her religious imagery but（主詞 many critics 是 interpreting 的邏輯主詞，以 but 連接第二個動詞 have overlooked：正確）", "B": "her religious imagery has been the focus of many critics, who（主詞 her religious imagery 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "C": "there are many critics who focused on her religious imagery, but they（主詞 there 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）", "D": "the focus of many critics has been her religious imagery; they（主詞 the focus 不是 interpreting 的邏輯主詞 → 修飾語懸置：錯誤）"}, "answer": "A", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "The Progressive Era in the United States witnessed the rise of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> Black women&#x27;s clubs, local organizations that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocated<\/a> for racial and gender <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equality\" target=\"_blank\" rel=\"noopener\" data-w=\"equality\" data-pos=\"n.\" data-en=\"the state of having the same rights and status\" data-zh=\"平等\">equality<\/a>. Among the clubs&#x27; leaders ______ Josephine St. Pierre Ruffin, founder of the Women&#x27;s Era Club of Boston.", "bodyPlain": "The Progressive Era in the United States witnessed the rise of numerous Black women's clubs, local organizations that advocated for racial and gender equality. Among the clubs' leaders ______ Josephine St. Pierre Ruffin, founder of the Women's Era Club of Boston.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "美國的進步時代見證了眾多黑人女性俱樂部的興起，這些地方性組織倡導種族與性別平等。在這些俱樂部的領袖之中，______ 波士頓 Women's Era Club 的創辦人 Josephine St. Pierre Ruffin。", "opts": {"A": "was", "B": "were", "C": "are", "D": "have been"}, "optsZh": {"A": "was（單數過去式 be 動詞，與倒裝後的單數主詞 Josephine St. Pierre Ruffin 一致：正確）", "B": "were（複數 be 動詞 → 與倒裝後的單數主詞不一致：錯誤）", "C": "are（複數現在式 be 動詞 → 與倒裝後的單數主詞 Josephine St. Pierre Ruffin 不一致：錯誤）", "D": "have been（複數現在完成式 → 與倒裝後的單數主詞不一致：錯誤）"}, "answer": "A", "expl": "In this inverted sentence the subject is the single person 'Josephine St. Pierre Ruffin,' so the singular past verb 'was' is needed.", "explZh": "這是倒裝句，真正主詞是單一人物「Josephine St. Pierre Ruffin」，所以用單數過去式「was」。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集樣本，並將紀錄與早期調查存檔的描述相互比較。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設相互比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整卻具啟發性的證據。數百年來，沿海社群 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "having used", "B": "to use", "C": "using", "D": "have used"}, "optsZh": {"A": "having used（分詞 → 句子缺少主要動詞：錯誤）", "B": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "C": "using（現在分詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，搭配 For centuries 表示持續至今：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "新編目的資料也顯示，後來的編輯、譯者和教師如何為原本社群以外的讀者改編這項計畫。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展過程、塑造它的人物，以及它的重要性為何一直被忽視。許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗的色彩與方塊狀的造型。", "opts": {"A": "effects, but", "B": "effects but", "C": "effects", "D": "effects,"}, "optsZh": {"A": "effects, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "B": "effects but（but 前缺少逗號：錯誤）", "C": "effects（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "A", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展品顯示創作者在呈現完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史和合作為創作基礎的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種較簡單的上鎖機制。", "opts": {"A": "had proposed", "B": "proposed", "C": "was proposing", "D": "proposes"}, "optsZh": {"A": "had proposed（過去完成式 → 與 recommended 同時發生，不需更早的時間：錯誤）", "B": "proposed（一般過去式，與前句 recommended 時態一致：正確）", "C": "was proposing（過去進行式 → 不適合描述已完成的單一動作：錯誤）", "D": "proposes（現在式 → 與 1984 年的過去事件時態不一致：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這份報告也指出，居民的反應因通勤模式、在地服務以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的做法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區對同一項政策有不同經驗時。這位藝術家研究昆蟲學，也就是研究 ______ 在南美洲旅行期間畫了數百幅甲蟲和蝴蝶的素描。", "opts": {"A": "insects producing", "B": "insects, producing", "C": "insects; producing", "D": "insects. Producing"}, "optsZh": {"A": "insects producing（缺少逗號 → 分詞片語誤接在 insects 後面修飾昆蟲：錯誤）", "B": "insects, producing（逗號引出修飾主詞 The artist 的分詞片語：正確）", "C": "insects; producing（分號後不是獨立子句：錯誤）", "D": "insects. Producing（句號 → 後面形成沒有主要動詞的句子片段：錯誤）"}, "answer": "B", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: subject-verb agreement after inversion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, en
