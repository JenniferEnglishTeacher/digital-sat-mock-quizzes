: "withheld", "C": "utilized", "D": "redefined"}, "optsZh": {"A": "dismissed（不予理會；駁回）", "B": "withheld（扣留；隱瞞）", "C": "utilized（利用；運用）", "D": "redefined（重新定義）"}, "answer": "C", "expl": "Utilized means used for a practical purpose.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "decided something was not important or worth considering", "zh": "不予理會；否定", "word": "dismissed"}, "B": {"pos": "v.", "en": "kept something back; refused to give", "zh": "扣留；不給予", "word": "withheld"}, "C": {"pos": "v.", "en": "used something for a practical purpose", "zh": "利用；使用", "word": "utilized"}, "D": {"pos": "v.", "en": "changed the meaning or nature of something", "zh": "重新定義", "word": "redefined"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Rather than drill into the ancient wall, conservators ______ the stone&#x27;s natural response to infrared light to identify hidden layers of paint.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Rather than drill into the ancient wall, conservators ______ the stone's natural response to infrared light to identify hidden layers of paint.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。修復師沒有在古牆上鑽孔，而是 ______ 石材對紅外線的自然反應，來辨識被覆蓋的顏料層。", "opts": {"A": "harnessed", "B": "simplified", "C": "questioned", "D": "discounted"}, "optsZh": {"A": "harnessed（利用；駕馭）", "B": "simplified（簡化）", "C": "questioned（質疑）", "D": "discounted（不予重視；忽視）"}, "answer": "A", "expl": "Harnessed means used effectively.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "controlled and used something, such as a natural force, for a purpose", "zh": "利用；駕馭", "word": "harnessed"}, "B": {"pos": "v.", "en": "made something easier to understand or do", "zh": "簡化", "word": "simplified"}, "C": {"pos": "v.", "en": "expressed doubt about something", "zh": "質疑", "word": "questioned"}, "D": {"pos": "v.", "en": "decided that something is not important or true", "zh": "不予考慮；低估", "word": "discounted"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The software ______ small differences in users&#x27; typing rhythms, turning those differences into a method for confirming identity without requiring an additional password.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The software ______ small differences in users' typing rhythms, turning those differences into a method for confirming identity without requiring an additional password.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這套軟體 ______ 使用者打字節奏的細微差異，把這些差異轉化為一種不需額外密碼即可確認身分的方法。", "opts": {"A": "concealed", "B": "leveraged", "C": "imitated", "D": "overlooked"}, "optsZh": {"A": "concealed（隱藏；隱瞞）", "B": "leveraged（善用；利用）", "C": "imitated（模仿）", "D": "overlooked（忽略；未注意到）"}, "answer": "B", "expl": "Leveraged means used to gain an advantage.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "hid something; kept it secret", "zh": "隱藏；隱瞞", "word": "concealed"}, "B": {"pos": "v.", "en": "used something to gain an advantage", "zh": "利用；善用", "word": "leveraged"}, "C": {"pos": "v.", "en": "copied the way someone or something does things", "zh": "模仿", "word": "imitated"}, "D": {"pos": "v.", "en": "failed to notice or consider something", "zh": "忽略；未注意到", "word": "overlooked"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers ______ the tendency of certain bacteria to bind to heavy metals, developing a low-cost system for filtering <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contaminate\" target=\"_blank\" rel=\"noopener\" data-w=\"contaminate\" data-pos=\"v.\" data-en=\"to make something dirty or poisonous\" data-zh=\"汙染\">contaminated<\/a> water.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers ______ the tendency of certain bacteria to bind to heavy metals, developing a low-cost system for filtering contaminated water.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。研究人員 ______ 某些細菌容易與重金屬結合的特性，開發出一套低成本的污水過濾系統。", "opts": {"A": "postulated", "B": "distorted", "C": "rejected", "D": "employed"}, "optsZh": {"A": "postulated（假定；提出假設）", "B": "distorted（扭曲；曲解）", "C": "rejected（拒絕；否決）", "D": "employed（運用；使用）"}, "answer": "D", "expl": "Employed means used.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "suggested something as a basic fact or theory", "zh": "假定；提出（理論）", "word": "postulated"}, "B": {"pos": "v.", "en": "changed something so it is no longer true or accurate", "zh": "扭曲；曲解", "word": "distorted"}, "C": {"pos": "v.", "en": "refused to accept or believe something", "zh": "拒絕；駁回", "word": "rejected"}, "D": {"pos": "v.", "en": "used something for a purpose", "zh": "使用；運用", "word": "employed"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "Despite the generalizations about human behavior they have produced, many studies of behavioral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=psychology\" target=\"_blank\" rel=\"noopener\" data-w=\"psychology\" data-pos=\"n.\" data-en=\"the scientific study of the mind and behavior\" data-zh=\"心理學\">psychology<\/a> have used highly unrepresentative subject pools: students at the colleges and universities where the researchers are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=employed\" target=\"_blank\" rel=\"noopener\" data-w=\"employed\" data-pos=\"v.\" data-en=\"used something for a purpose\" data-zh=\"使用；運用\">employed<\/a>. To _______ this situation, it is necessary to actively <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recruit\" target=\"_blank\" rel=\"noopener\" data-w=\"recruit\" data-pos=\"v.\" data-en=\"to persuade someone to join an organization or activity\" data-zh=\"招募\">recruit<\/a> subjects from diverse <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">backgrounds<\/a> and locations.", "bodyPlain": "Despite the generalizations about human behavior they have produced, many studies of behavioral psychology have used highly unrepresentative subject pools: students at the colleges and universities where the researchers are employed. To _______ this situation, it is necessary to actively recruit subjects from diverse backgrounds and locations.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "儘管行為心理學的許多研究得出了關於人類行為的概括性結論，這些研究卻常使用極不具代表性的受試者群體：研究人員所任職的學院和大學的學生。為了 _______ 這種情況，必須積極從不同背景與地區招募受試者。", "opts": {"A": "sanction", "B": "ameliorate", "C": "rationalize", "D": "postulate"}, "optsZh": {"A": "sanction（批准；認可）", "B": "ameliorate（改善；改良）", "C": "rationalize（合理化；為……找理由）", "D": "postulate（假定；提出假設）"}, "answer": "B", "expl": "Recruiting diverse subjects is a way to improve the problem of unrepresentative subject pools, so the word is 'ameliorate' (make better).", "explZh": "積極招募多元背景的受試者是為了改善受試者缺乏代表性的問題，所以用「ameliorate」（改善）。", "defs": {"A": {"pos": "v.", "en": "to give official approval or permission for something", "zh": "認可；批准", "word": "sanction"}, "B": {"pos": "v.", "en": "to make a bad situation better", "zh": "改善；改良", "word": "ameliorate"}, "C": {"pos": "v.", "en": "to give reasons to explain or excuse something", "zh": "合理化；為……找理由", "word": "rationalize"}, "D": {"pos": "v.", "en": "to suggest something as a basic fact or theory", "zh": "假定；提出（理論）", "word": "postulate"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Because many early clinical trials relied on participants from a narrow age range, researchers now try to ______ this limitation by recruiting volunteers from older and younger populations as well.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Because many early clinical trials relied on participants from a narrow age range, researchers now try to ______ this limitation by recruiting volunteers from older and younger populations as well.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。由於許多早期臨床試驗的參與者年齡範圍很窄，研究人員現在試圖透過同時招募較年長和較年輕的志願者來 ______ 這項限制。", "opts": {"A": "rationalize", "B": "postulate", "C": "sanction", "D": "address"}, "optsZh": {"A": "rationalize（合理化；為……找理由）", "B": "postulate（假定；提出假設）", "C": "sanction（批准；認可）", "D": "address（處理；解決）"}, "answer": "D", "expl": "Address means deal with or improve a problem.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give reasons to explain or excuse something", "zh": "合理化；為……找理由", "word": "rationalize"}, "B": {"pos": "v.", "en": "to suggest something as a basic fact or theory", "zh": "假定；提出（理論）", "word": "postulate"}, "C": {"pos": "v.", "en": "to give official approval or permission for something", "zh": "認可；批准", "word": "sanction"}, "D": {"pos": "v.", "en": "to deal with or try to solve a problem", "zh": "處理；解決（問題）", "word": "address"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The city planted trees along the hottest streets to ______ the effects of extreme summer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>, particularly in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> with little shade.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The city planted trees along the hottest streets to ______ the effects of extreme summer temperatures, particularly in neighborhoods with little shade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。市政府沿著最炎熱的街道種樹，以 ______ 夏季極端高溫的影響，特別是在缺乏遮蔭的社區。", "opts": {"A": "mitigate", "B": "endorse", "C": "justify", "D": "predict"}, "optsZh": {"A": "mitigate（減輕；緩和）", "B": "endorse（贊同；支持）", "C": "justify（為……辯護；證明……正當）", "D": "predict（預測）"}, "answer": "A", "expl": "Mitigate means make less severe.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something bad less severe", "zh": "減輕；緩和", "word": "mitigate"}, "B": {"pos": "v.", "en": "to publicly approve of or support something", "zh": "背書；支持；認可", "word": "endorse"}, "C": {"pos": "v.", "en": "to show that something is right or reasonable", "zh": "證明……有理；為……辯解", "word": "justify"}, "D": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測", "word": "predict"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. To ______ the shortage of bilingual nurses, the hospital created scholarships for students who already spoke the languages most common among local patients.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. To ______ the shortage of bilingual nurses, the hospital created scholarships for students who already spoke the languages most common among local patients.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。為了 ______ 雙語護理師的短缺，醫院為已經會說當地病患最常用語言的學生設立了獎學金。", "opts": {"A": "defend", "B": "describe", "C": "alleviate", "D": "ignore"}, "optsZh": {"A": "defend（捍衛；辯護）", "B": "describe（描述）", "C": "alleviate（減輕；緩和）", "D": "ignore（忽視）"}, "answer": "C", "expl": "Alleviate means make a problem less serious.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to protect, or to argue in support of something", "zh": "保衛；為……辯護", "word": "defend"}, "B": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}, "C": {"pos": "v.", "en": "to make a problem or pain less severe", "zh": "減輕；緩和", "word": "alleviate"}, "D": {"pos": "v.", "en": "to pay no attention to something", "zh": "忽視", "word": "ignore"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The revised survey was designed to ______ the bias in the original sample by including respondents from rural districts as well as major cities.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The revised survey was designed to ______ the bias in the original sample by including respondents from rural districts as well as major cities.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。修訂後的調查旨在 ______ 原始樣本中的偏差，除了大城市之外也納入鄉村地區的受訪者。", "opts": {"A": "validate", "B": "conceal", "C": "remedy", "D": "summarize"}, "optsZh": {"A": "validate（證實；確認）", "B": "conceal（隱藏；隱瞞）", "C": "remedy（補救；矯正）", "D": "summarize（概述；總結）"}, "answer": "C", "expl": "Remedy means correct or improve a problem.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to prove that something is true or correct", "zh": "證實；驗證", "word": "validate"}, "B": {"pos": "v.", "en": "to hide something", "zh": "隱藏；隱瞞", "word": "conceal"}, "C": {"pos": "v.", "en": "to correct or fix a problem", "zh": "補救；矯正", "word": "remedy"}, "D": {"pos": "v.", "en": "to give the main points briefly", "zh": "總結；概述", "word": "summarize"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: ameliorate a research limitation.", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The new archive will not eliminate gaps in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> record, but it may ______ them by preserving letters and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> from communities previously overlooked by scholars.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The new archive will not eliminate gaps in the historical record, but it may ______ them by preserving letters and photographs from communities previously overlooked by scholars.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。新的檔案庫無法消除歷史紀錄中的缺口，但或許能藉由保存過去被學者忽略的社群的信件與照片來 ______ 這些缺口。", "opts": {"A": "rationalize", "B": "ameliorate", "C": "complicate", "D": "authorize"}, "optsZh": {"A": "rationalize（合理化；為……找理由）", "B": "ameliorate（改善；改良）", "C": "complicate（使複雜化）", "D": "authorize（授權；批准）"}, "answer": "B", "expl": "Ameliorate means improve or make less severe.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give reasons to explain or excuse something", "zh": "合理化；為……找理由", "word": "rationalize"}, "B": {"pos": "v.", "en": "to make a bad situation better", "zh": "改善；改良", "word": "ameliorate"}, "C": {"pos": "v.", "en": "to make something more difficult to understand or deal with", "zh": "使複雜化", "word": "complicate"}, "D": {"pos": "v.", "en": "to give official permission for something", "zh": "授權；批准", "word": "authorize"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Jean Webster&#x27;s 1912 novel Daddy-Long-Legs. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> is a young college student writing letters <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detailing<\/a> her weekly experiences.<br><br>[The college is] organizing the Freshman basket-ball team and there&#x27;s just a chance that I shall make it. I&#x27;m little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.", "bodyPlain": "The following text is adapted from Jean Webster's 1912 novel Daddy-Long-Legs. The narrator is a young college student writing letters detailing her weekly experiences.\n\n[The college is] organizing the Freshman basket-ball team and there's just a chance that I shall make it. I'm little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字改寫自 Jean Webster 1912 年的小說《Daddy-Long-Legs》（長腿叔叔）。敘事者是一名年輕的大學生，她寫信詳述自己每週的經歷。\n【學校】正在組織新生籃球隊，我還有一點機會能入選。當然，我個子矮小，但我非常敏捷、精瘦又強韌。其他人在空中跳來跳去的時候，我可以從她們腳下鑽過去搶到球。", "opts": {"A": "To compare basketball with other sports", "B": "To provide details of how to play basketball", "C": "To state how players will be chosen for the basketball team", "D": "To explain why the narrator thinks she might make the basketball team"}, "optsZh": {"A": "比較籃球與其他運動", "B": "詳細說明如何打籃球", "C": "說明籃球隊將如何挑選球員", "D": "說明敘述者為何認為自己可能入選籃球隊"}, "answer": "D", "expl": "The narrator says she has a chance to make the team and explains why: she is quick, wiry, tough, and can dodge under others to grab the ball.", "explZh": "敘述者說自己有機會入選，並說明原因：她雖矮小但動作快、精瘦又強韌，能從別人腳下鑽過去搶球。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正從花園帶著花回來。敘述著墨於傍晚的光線、已布置好的房間，以及種種顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To explain why music has lost its importance", "B": "To summarize a conflict between two relatives", "C": "To portray a setting and mood as characters prepare for an arrival", "D": "To argue that the characters should leave the house"}, "optsZh": {"A": "說明音樂為何失去了其重要性", "B": "概述兩位親戚之間的衝突", "C": "在角色們準備迎接某人到來時，描繪場景與氣氛", "D": "主張角色們應該離開那棟房子"}, "answer": "C", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=completed\" target=\"_blank\" rel=\"noopener\" data-w=\"completed\" data-pos=\"v.\" data-en=\"finished\" data-zh=\"完成\">completed<\/a> journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫說話者在黎明時分站在港口邊，看著船隻啟航。這首詩並未敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正駛入未知卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To criticize sailors for taking unnecessary risks", "C": "To compare several forms of transportation", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "列出一座港口的技術特徵", "B": "批評水手冒不必要的風險", "C": "比較幾種交通方式", "D": "呈現一種啟程與充滿可能的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節選描寫節慶大餐前擁擠的廚房。敘事者注意到擦亮的碗、精心排好的椅子，以及每當門外傳來腳步聲時家人便會停下來的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To depict preparations that reveal anticipation within a family", "C": "To contrast rural and urban customs", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "從頭到尾描述一場已結束的慶祝活動", "B": "描寫顯露出一家人期待心情的準備工作", "C": "對比鄉村與都市的習俗", "D": "說明這家人為何不喜歡訪客"}, "answer": "B", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄描述一位老師在日出前打開教室門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課堂本身，而是著重描寫上課前那些安靜的例行儀式。", "opts": {"A": "To argue that early classes should be canceled", "B": "To describe the moments before a significant daily activity begins", "C": "To evaluate the quality of a school's curriculum", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "主張應該取消早上的課程", "B": "描寫一項重要的日常活動開始前的時刻", "C": "評估一所學校課程的品質", "D": "敘述一名學生完整的求學歷程"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Literary purpose: explain why narrator may make team.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學作品描寫雨後的花園：濕潤的小徑、明亮的葉子，以及一張設在樹下的長椅。一個角色手拿著信在那裡停下腳步，這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To reveal the full contents of a letter", "C": "To compare two different seasons", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "在角色採取行動前營造沉思的氣氛", "B": "揭露一封信的完整內容", "C": "比較兩個不同的季節", "D": "提供照料花園的說明"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "In the late 1800s, Spanish-language newspapers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flourish\" target=\"_blank\" rel=\"noopener\" data-w=\"flourish\" data-pos=\"v.\" data-en=\"to grow or develop successfully\" data-zh=\"蓬勃發展；興盛\">flourished<\/a> in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surpass\" target=\"_blank\" rel=\"noopener\" data-w=\"surpass\" data-pos=\"v.\" data-en=\"to be greater or better than\" data-zh=\"超越\">surpassed<\/a> all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=journalism\" target=\"_blank\" rel=\"noopener\" data-w=\"journalism\" data-pos=\"n.\" data-en=\"the work of writing news for newspapers or other media\" data-zh=\"新聞業；新聞寫作\">journalism<\/a>.", "bodyPlain": "In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "在 1800 年代後期，西班牙語報紙在德州各城市蓬勃發展。單是 San Antonio 在 1890 年至 1900 年間就發行了十一份西班牙語報紙。但 El Paso 超越了該州所有其他城市。這座城市在那段期間發行了二十二份西班牙語報紙。El Paso 位於與墨西哥接壤的邊境，一直以來都有大量說西班牙語的人口。因此，這座城市會成為西班牙語新聞業如此豐富的發展地，並不令人意外。", "opts": {"A": "To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s", "B": "To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s", "C": "To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s", "D": "To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s"}, "optsZh": {"A": "比較德州現今出版的西班牙語報紙與 1800 年代後期在當地出版的西班牙語報紙", "B": "說明 1800 年代後期西班牙語報紙在德州、尤其是在 El Paso 十分興盛", "C": "主張 1800 年代後期在 El Paso 出版的西班牙語報紙影響了在 San Antonio 出版的西班牙語報紙", "D": "說明為何 1800 年代後期在德州出版的西班牙語報紙在墨西哥如此受歡迎"}, "answer": "B", "expl": "The text says Spanish-language newspapers flourished across Texas in the late 1800s and El Paso surpassed all other cities, then explains why.", "explZh": "本文說明 1800 年代末西班牙語報紙在德州各地蓬勃發展，其中 El Paso 最多，並解釋原因。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正從花園帶著花回來。敘述著墨於傍晚的光線、已布置好的房間，以及種種顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To explain why music has lost its importance", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "說明音樂為何失去了其重要性", "B": "在角色們準備迎接某人到來時，描繪場景與氣氛", "C": "主張角色們應該離開那棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=completed\" target=\"_blank\" rel=\"noopener\" data-w=\"completed\" data-pos=\"v.\" data-en=\"finished\" data-zh=\"完成\">completed<\/a> journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫說話者在黎明時分站在港口邊，看著船隻啟航。這首詩並未敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正駛入未知卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To list the technical features of a harbor", "C": "To criticize sailors for taking unnecessary risks", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "比較幾種交通方式", "B": "列出一座港口的技術特徵", "C": "批評水手冒不必要的風險", "D": "呈現一種啟程與充滿可能的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節選描寫節慶大餐前擁擠的廚房。敘事者注意到擦亮的碗、精心排好的椅子，以及每當門外傳來腳步聲時家人便會停下來的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To describe a completed celebration from beginning to end", "C": "To depict preparations that reveal anticipation within a family", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "說明這家人為何不喜歡訪客", "B": "從頭到尾描述一場已結束的慶祝活動", "C": "描寫顯露出一家人期待心情的準備工作", "D": "對比鄉村與都市的習俗"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄描述一位老師在日出前打開教室門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課堂本身，而是著重描寫上課前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To recount a student's entire academic career", "C": "To argue that early classes should be canceled", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "敘述一名學生完整的求學歷程", "C": "主張應該取消早上的課程", "D": "描寫一項重要的日常活動開始前的時刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主旨或主要目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學作品描寫雨後的花園：濕潤的小徑、明亮的葉子，以及一張設在樹下的長椅。一個角色手拿著信在那裡停下腳步，這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To give instructions for maintaining a garden", "C": "To compare two different seasons", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "在角色採取行動前營造沉思的氣氛", "B": "提供照料花園的說明", "C": "比較兩個不同的季節", "D": "揭露一封信的完整內容"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Function: why researchers study Atacama Desert.", "vocab": false, "body": "Chile&#x27;s Atacama Desert is one of the driest places on Earth. <u>Mary Beth Wilhelm and other astrobiologists search for life, or its remains, in this harsh place because the desert closely mirrors the extreme <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a> on Mars.<\/u> The algae and bacteria found in Atacama&#x27;s driest regions may offer clues about Martian life. By studying how these and other microorganisms survive such extreme <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> on Earth, Wilhelm&#x27;s team hopes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether similar life might have existed on Mars and to develop the best tools to look for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> of it.", "bodyPlain": "Chile's Atacama Desert is one of the driest places on Earth. Mary Beth Wilhelm and other astrobiologists search for life, or its remains, in this harsh place because the desert closely mirrors the extreme environment on Mars. The algae and bacteria found in Atacama's driest regions may offer clues about Martian life. By studying how these and other microorganisms survive such extreme conditions on Earth, Wilhelm's team hopes to determine whether similar life might have existed on Mars and to develop the best tools to look for evidence of it.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線句子在全文中的作用？", "bodyZh": "智利的阿他加馬沙漠是地球上最乾燥的地方之一。Mary Beth Wilhelm 與其他天體生物學家在這個嚴酷的地方尋找生命或生命遺跡，因為這片沙漠與火星上的極端環境十分相似。在阿他加馬最乾燥地區發現的藻類和細菌，可能為火星生命提供線索。藉由研究這些及其他微生物如何在地球上如此極端的條件下生存，Wilhelm 的團隊希望判斷火星上是否可能曾存在類似的生命，並開發出尋找其證據的最佳工具。", "opts": {"A": "To contrast the conditions in the Atacama Desert with those on Mars", "B": "To explain why many life-forms cannot survive in the Atacama Desert", "C": "To indicate why astrobiologists choose to conduct research in the Atacama Desert", "D": "To describe certain limitations to conducting scientific study in the Atacama Desert"}, "optsZh": {"A": "對比阿他加馬沙漠與火星上的環境條件", "B": "說明為何許多生物無法在阿他加馬沙漠中存活", "C": "指出天體生物學家為何選擇在阿他加馬沙漠進行研究", "D": "說明在阿他加馬沙漠進行科學研究的某些限制"}, "answer": "C", "expl": "The underlined sentence says astrobiologists search for life in the Atacama because it mirrors conditions on Mars—their reason for researching there.", "explZh": "畫線句說明天文生物學家在 Atacama 沙漠尋找生命，是因為那裡與火星的極端環境非常相似——這正是他們選擇在此研究的原因。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Function: why researchers study Atacama Desert.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪一個選項最能描述本文的結構或作用？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It states the study's final conclusion.", "C": "It describes how other researchers criticized the work.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它提供證據證明雷達永遠可靠。", "B": "它陳述這項研究的最終結論。", "C": "它描述其他研究人員如何批評這項研究。", "D": "它指出促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Function: why researchers study Atacama Desert.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪一個選項最能描述本文的結構或作用？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一篇考古學文章開頭說，某個聚落顯然曾與遙遠地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊在陶器中尋找化學特徵，但只得到初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It contradicts the claim made in the first sentence.", "C": "It summarizes the team's strongest result.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它界定了後續研究試圖處理的問題。", "B": "它反駁了第一句中的主張。", "C": "它概述這個團隊最有力的研究結果。", "D": "它把討論的焦點從考古學轉移開。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Function: why researchers study Atacama Desert.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direc
