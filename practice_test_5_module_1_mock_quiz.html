 social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A city council elected by districts may leave a dispersed minority without representation. ______ a council elected proportionally may give that minority seats if it receives enough total votes citywide.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。以選區選出的市議會，可能使分散居住的少數群體得不到代表。______ 以比例方式選出的市議會，若該少數群體在全市獲得足夠的總票數，就可能讓他們取得席次。", "opts": {"A": "Specifically,", "B": "Moreover,", "C": "However,", "D": "Consequently,"}, "optsZh": {"A": "Specifically,（具體來說：表進一步說明細節 → 錯誤）", "B": "Moreover,（而且；此外：表補充 → 錯誤）", "C": "However,（然而：表轉折對比）", "D": "Consequently,（因此：表因果）"}, "answer": "C", "expl": "However introduces a contrast.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: contrast between electoral systems.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Majoritarian rules tend to simplify the ballot by favoring two dominant parties. ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proportional\" target=\"_blank\" rel=\"noopener\" data-w=\"proportional\" data-pos=\"adj.\" data-en=\"corresponding in size or amount to something else\" data-zh=\"成比例的\">proportional<\/a> rules tend to preserve a wider range of parties in the legislature.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Majoritarian rules tend to simplify the ballot by favoring two dominant parties. ______ proportional rules tend to preserve a wider range of parties in the legislature.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。多數決規則傾向於偏好兩大主要政黨，使選票變得簡單。______ 比例代表規則則傾向於在議會中保留更多元的政黨。", "opts": {"A": "Conversely,", "B": "As a result,", "C": "Meanwhile,", "D": "For instance,"}, "optsZh": {"A": "Conversely,（相反地：表對比，正確）", "B": "As a result,（因此；結果：表因果）", "C": "Meanwhile,（同時；與此同時：表同時發生 → 錯誤）", "D": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "A", "expl": "Conversely marks the opposite relationship.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: contrast between electoral systems.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Under one electoral design, voters choose a single candidate, and the candidate with the most votes wins the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=district\" target=\"_blank\" rel=\"noopener\" data-w=\"district\" data-pos=\"n.\" data-en=\"an area of a country or city\" data-zh=\"選區；地區\">district<\/a>. ______ under another design, seats are allocated to parties according to vote share.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Under one electoral design, voters choose a single candidate, and the candidate with the most votes wins the district. ______ under another design, seats are allocated to parties according to vote share.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。在一種選舉設計下，選民選擇一位候選人，得票最多的候選人贏得該選區。______ 在另一種設計下，席次則依得票比例分配給各政黨。", "opts": {"A": "Similarly,", "B": "Therefore,", "C": "In contrast,", "D": "For example,"}, "optsZh": {"A": "Similarly,（同樣地：表相似 → 前後並非相似關係：錯誤）", "B": "Therefore,（因此：表因果）", "C": "In contrast,（相反地：表對比）", "D": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "C", "expl": "In contrast introduces a different system.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "A turtle shell appears external to the animal, protecting its body like armor. _______ the shell is often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorrectly\" target=\"_blank\" rel=\"noopener\" data-w=\"incorrectly\" data-pos=\"adv.\" data-en=\"in a way that is wrong\" data-zh=\"錯誤地\">incorrectly<\/a> assumed to be an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exoskeleton\" target=\"_blank\" rel=\"noopener\" data-w=\"exoskeleton\" data-pos=\"n.\" data-en=\"a hard outer covering that supports an animal&#x27;s body\" data-zh=\"外骨骼\">exoskeleton<\/a>, a rigid outer casing like that of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=crustacean\" target=\"_blank\" rel=\"noopener\" data-w=\"crustacean\" data-pos=\"n.\" data-en=\"a sea animal with a hard shell, like a crab\" data-zh=\"甲殼類動物\">crustacean<\/a> or an insect, when in fact it is an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endoskeleton\" target=\"_blank\" rel=\"noopener\" data-w=\"endoskeleton\" data-pos=\"n.\" data-en=\"a skeleton inside the body\" data-zh=\"內骨骼\">endoskeleton<\/a>, a part of the turtle&#x27;s internal bone structure, more akin to a spine or a pair of ribs.", "bodyPlain": "A turtle shell appears external to the animal, protecting its body like armor. _______ the shell is often incorrectly assumed to be an exoskeleton, a rigid outer casing like that of a crustacean or an insect, when in fact it is an endoskeleton, a part of the turtle's internal bone structure, more akin to a spine or a pair of ribs.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "烏龜的殼看起來位於身體外部，像盔甲一樣保護牠的身體。_______ 龜殼常被誤認為是外骨骼，也就是像甲殼類或昆蟲那樣的堅硬外殼；但事實上它是內骨骼，屬於烏龜內部骨骼結構的一部分，更類似脊椎或一對肋骨。", "opts": {"A": "That being said,", "B": "However,", "C": "For instance,", "D": "Hence,"}, "optsZh": {"A": "That being said,（話雖如此：表讓步轉折 → 錯誤）", "B": "However,（然而：表轉折對比）", "C": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "Hence,（因此：表因果——外殼看似在體外，因此常被誤認為外骨骼，正確）"}, "answer": "D", "expl": "Because the shell looks external, it is often wrongly assumed to be an exoskeleton; 'Hence' shows this consequence.", "explZh": "因為龜殼看起來在身體外部，所以常被誤認為外骨骼；「Hence」（因此）表示這個結果。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The tea was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, &#x27;night rest,&#x27; referred to its intended calming effect.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The tea was traditionally served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, 'night rest,' referred to its intended calming effect.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這種茶傳統上在睡前飲用，而現代化學分析也發現了與放鬆相關的化合物。______ 研究人員認為它的名稱「夜歇」指的是它預期的安神效果。", "opts": {"A": "Therefore,", "B": "Alternately,", "C": "Likewise,", "D": "Nevertheless,"}, "optsZh": {"A": "Therefore,（因此：表因果）", "B": "Alternately,（輪流地；交替地：表輪替，非「另一種選擇」：錯誤）", "C": "Likewise,（同樣地：表相似 → 前後並非相似關係：錯誤）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "A", "expl": "Therefore introduces the inference.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a> produced a low, steady tone that listeners described as soothing. ______ the team suggested that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"very old; from long ago\" data-zh=\"古代的；古老的\">ancient<\/a> performers may have used it during healing ceremonies.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The instrument produced a low, steady tone that listeners described as soothing. ______ the team suggested that ancient performers may have used it during healing ceremonies.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這件樂器發出低沉而穩定的音調，聽眾形容它令人感到安撫。______ 研究團隊認為，古代的演奏者可能在療癒儀式中使用它。", "opts": {"A": "However,", "B": "Instead,", "C": "Consequently,", "D": "Similarly,"}, "optsZh": {"A": "However,（然而：表轉折對比）", "B": "Instead,（反而；取而代之：表替代 → 錯誤）", "C": "Consequently,（因此：表因果）", "D": "Similarly,（同樣地：表相似 → 前後並非相似關係：錯誤）"}, "answer": "C", "expl": "Consequently signals a conclusion from evidence.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The plant&#x27;s leaves close when touched, and early farmers called it &#x27;the shy herb.&#x27; ______ botanists suspect that the name refers to this visible movement.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The plant's leaves close when touched, and early farmers called it 'the shy herb.' ______ botanists suspect that the name refers to this visible movement.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這種植物的葉子一被碰觸就會閉合，早期的農民稱它為「害羞草」。______ 植物學家推測這個名稱指的就是這種肉眼可見的動作。", "opts": {"A": "Alternatively,", "B": "Likewise,", "C": "Nevertheless,", "D": "For this reason,"}, "optsZh": {"A": "Alternatively,（或者；另一種方式：表替代選項）", "B": "Likewise,（同樣地：表相似 → 前後並非相似關係：錯誤）", "C": "Nevertheless,（儘管如此：表讓步轉折）", "D": "For this reason,（因為這個原因：表因果，正確）"}, "answer": "D", "expl": "For this reason links evidence to inference.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The bread contained honey and aromatic seeds, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredients<\/a> associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The bread contained honey and aromatic seeds, ingredients associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這種麵包含有蜂蜜和芳香的種子，這些都是與節慶食物相關的食材。______ 飲食史學家認為它很可能是為慶典而準備的。", "opts": {"A": "In contrast,", "B": "Therefore,", "C": "Similarly,", "D": "Regardless,"}, "optsZh": {"A": "In contrast,（相反地：表對比）", "B": "Therefore,（因此：表因果）", "C": "Similarly,（同樣地：表相似 → 前後並非相似關係：錯誤）", "D": "Regardless,（無論如何：表不受前述影響 → 錯誤）"}, "answer": "B", "expl": "Therefore presents the conclusion.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: consequence of external appearance.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The bowl&#x27;s interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> proposed that the bowl had a funerary purpose.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The bowl's interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ archaeologists proposed that the bowl had a funerary purpose.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這只碗的內部留有藍色顏料的痕跡，而藍色染料常用於哀悼儀式。______ 考古學家認為這只碗具有喪葬用途。", "opts": {"A": "As a result,", "B": "Nevertheless,", "C": "Alternatively,", "D": "Likewise,"}, "optsZh": {"A": "As a result,（因此；結果：表因果）", "B": "Nevertheless,（儘管如此：表讓步轉折）", "C": "Alternatively,（或者；另一種方式：表替代選項）", "D": "Likewise,（同樣地：表相似 → 前後並非相似關係：錯誤）"}, "answer": "A", "expl": "As a result connects evidence to a conclusion.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- In 1859, the novel Adam Bede was published in England.<br>- According to the novel&#x27;s title page, the author&#x27;s name was George Eliot.<br>- George Eliot was widely assumed to be a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pseudonym\" target=\"_blank\" rel=\"noopener\" data-w=\"pseudonym\" data-pos=\"n.\" data-en=\"a false name used by an author\" data-zh=\"筆名\">pseudonym<\/a>.<br>- A pseudonym is a fake name used to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conceal\" target=\"_blank\" rel=\"noopener\" data-w=\"conceal\" data-pos=\"v.\" data-en=\"to hide something\" data-zh=\"隱藏；隱瞞\">conceal<\/a> an author&#x27;s identity.<br>- A woman named Mary Ann Evans later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> herself as the novel&#x27;s real author.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In 1859, the novel Adam Bede was published in England.\n- According to the novel's title page, the author's name was George Eliot.\n- George Eliot was widely assumed to be a pseudonym.\n- A pseudonym is a fake name used to conceal an author's identity.\n- A woman named Mary Ann Evans later revealed herself as the novel's real author.", "stem": "The student wants to identify the real author of Adam Bede. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出《Adam Bede》的真正作者。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 1859 年，小說《Adam Bede》在英國出版。\n- 根據小說的書名頁，作者的名字是 George Eliot。\n- 一般普遍認為 George Eliot 是一個筆名。\n- 筆名是用來隱藏作者身分的假名。\n- 一位名叫 Mary Ann Evans 的女性後來表明自己才是這部小說的真正作者。", "opts": {"A": "The real author of Adam Bede was Mary Ann Evans, who published the novel using the pseudonym George Eliot.", "B": "George Eliot, which Adam Bede's title page indicated was the name of the novel's author, was widely assumed to be a pseudonym.", "C": "The title page of the novel Adam Bede indicated that the author's name was George Eliot.", "D": "A woman who had used a pseudonym to conceal her identity later revealed herself as the real author of Adam Bede."}, "optsZh": {"A": "《Adam Bede》的真正作者是 Mary Ann Evans，她以筆名 George Eliot 出版這部小說。", "B": "George Eliot——《Adam Bede》書名頁上標示的小說作者姓名——普遍被認為是一個筆名。", "C": "小說《Adam Bede》的書名頁顯示作者名為 George Eliot。", "D": "一位曾使用筆名隱藏身分的女性，後來表明自己才是《Adam Bede》的真正作者。"}, "answer": "A", "expl": "It directly names Mary Ann Evans as the real author who used the pseudonym George Eliot.", "explZh": "此選項直接指出真正作者是使用筆名 George Eliot 的 Mary Ann Evans。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: The 1872 novel River Mist appeared under the name Ellis Vale; Ellis Vale was a pseudonym; a pseudonym is a false name used by an author; Clara Benton later admitted that she had written River Mist; the goal is to identify the real author.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The 1872 novel River Mist appeared under the name Ellis Vale; Ellis Vale was a pseudonym; a pseudonym is a false name used by an author; Clara Benton later admitted that she had written River Mist; the goal is to identify the real author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：1872 年的小說《River Mist》以 Ellis Vale 之名出版；Ellis Vale 是一個筆名；筆名是作者使用的假名；Clara Benton 後來承認《River Mist》是她寫的；目標是指出真正的作者。", "opts": {"A": "River Mist was published in the nineteenth century.", "B": "The real author of River Mist was Clara Benton, who first published the novel under the pseudonym Ellis Vale.", "C": "A pseudonym is a false name that can conceal an author's identity.", "D": "Ellis Vale appeared on the title page of River Mist in 1872."}, "optsZh": {"A": "《River Mist》於十九世紀出版。", "B": "《River Mist》的真正作者是 Clara Benton，她最初以筆名 Ellis Vale 出版這部小說。", "C": "筆名是一種可以隱藏作者身分的假名。", "D": "Ellis Vale 這個名字於 1872 年出現在《River Mist》的書名頁上。"}, "answer": "B", "expl": "The answer identifies the real author and explains the pseudonym.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The essays in Mountain Letters were signed N. Gray; N. Gray was not the writer&#x27;s legal name; the writer Naomi Greer later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=acknowledge\" target=\"_blank\" rel=\"noopener\" data-w=\"acknowledge\" data-pos=\"v.\" data-en=\"to accept or admit that something is true\" data-zh=\"承認\">acknowledged<\/a> writing the essays; the goal is to identify the real author.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The essays in Mountain Letters were signed N. Gray; N. Gray was not the writer's legal name; the writer Naomi Greer later acknowledged writing the essays; the goal is to identify the real author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：《Mountain Letters》中的散文署名為 N.Gray；N.Gray 並不是這位作者的法定姓名；作家 Naomi Greer 後來承認這些散文是她寫的；目標是指出真正的作者。", "opts": {"A": "Naomi Greer later discussed the essays in interviews.", "B": "Some authors publish essays under names other than their legal names.", "C": "The real author of Mountain Letters was Naomi Greer, who had used the pseudonym N. Gray.", "D": "N. Gray was the name printed with Mountain Letters."}, "optsZh": {"A": "Naomi Greer 後來在訪談中談到這些散文。", "B": "有些作者以非法定姓名的名字發表散文。", "C": "《Mountain Letters》的真正作者是 Naomi Greer，她曾使用筆名 N. Gray。", "D": "N. Gray 是印在《Mountain Letters》上的名字。"}, "answer": "C", "expl": "The answer names the real author.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: The play The Harbor Gate was published under the name C. Lorne; critics suspected C. Lorne was a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pseudonym\" target=\"_blank\" rel=\"noopener\" data-w=\"pseudonym\" data-pos=\"n.\" data-en=\"a false name used by an author\" data-zh=\"筆名\">pseudonym<\/a>; playwright Celia Lorne later revealed that she had written it; the goal is to identify the real author.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The play The Harbor Gate was published under the name C. Lorne; critics suspected C. Lorne was a pseudonym; playwright Celia Lorne later revealed that she had written it; the goal is to identify the real author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：劇本《The Harbor Gate》以 C.Lorne 之名出版；評論家懷疑 C.Lorne 是一個筆名；劇作家 Celia Lorne 後來表明這部劇本是她寫的；目標是指出真正的作者。", "opts": {"A": "Pseudonyms were sometimes used by playwrights.", "B": "The Harbor Gate was a play published under the name C. Lorne.", "C": "The real author of The Harbor Gate was Celia Lorne, who published it as C. Lorne.", "D": "Critics suspected that C. Lorne was not the author's full legal name."}, "optsZh": {"A": "劇作家有時會使用筆名。", "B": "《The Harbor Gate》是一部以 C. Lorne 之名出版的劇本。", "C": "《The Harbor Gate》的真正作者是 Celia Lorne，她以 C. Lorne 之名出版此作。", "D": "評論家懷疑 C. Lorne 並不是作者完整的法定姓名。"}, "answer": "C", "expl": "The answer identifies the author behind the name.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: The poetry <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> North Window listed the author as Rowan Bell; Rowan Bell was a pen name; historian Adele Park found letters proving that Miriam Shaw wrote the poems; the goal is to identify the real author.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The poetry collection North Window listed the author as Rowan Bell; Rowan Bell was a pen name; historian Adele Park found letters proving that Miriam Shaw wrote the poems; the goal is to identify the real author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：詩集《North Window》列出的作者是 Rowan Bell；Rowan Bell 是一個筆名；歷史學家 Adele Park 找到的信件證明這些詩是 Miriam Shaw 寫的；目標是指出真正的作者。", "opts": {"A": "Rowan Bell was later shown to be a pen name.", "B": "North Window was published as a poetry collection.", "C": "Adele Park discovered letters about North Window.", "D": "The real author of North Window was Miriam Shaw, who had published the poems under the pen name Rowan Bell."}, "optsZh": {"A": "Rowan Bell 後來被證實是一個筆名。", "B": "《North Window》以詩集的形式出版。", "C": "Adele Park 發現了與《North Window》有關的信件。", "D": "《North Window》的真正作者是 Miriam Shaw，她曾以筆名 Rowan Bell 發表這些詩作。"}, "answer": "D", "expl": "The answer identifies the real author and pen name.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: identify real author.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The travel book Coast Roads was credited to L.M. Field; L.M. Field was a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pseudonym\" target=\"_blank\" rel=\"noopener\" data-w=\"pseudonym\" data-pos=\"n.\" data-en=\"a false name used by an author\" data-zh=\"筆名\">pseudonym<\/a>; Lucia Moreno later confirmed that she wrote the book; the goal is to identify the real author.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The travel book Coast Roads was credited to L.M. Field; L.M. Field was a pseudonym; Lucia Moreno later confirmed that she wrote the book; the goal is to identify the real author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：旅遊書《Coast Roads》的作者署名為 L.M.Field；L.M.Field 是一個筆名；Lucia Moreno 後來證實這本書是她寫的；目標是指出真正的作者。", "opts": {"A": "Lucia Moreno was the real author of Coast Roads, which was published under the pseudonym L.M. Field.", "B": "L.M. Field was printed on the title page of Coast Roads.", "C": "A pseudonym can make it difficult to identify an author.", "D": "Travel books often describe journeys through coastal regions."}, "optsZh": {"A": "Lucia Moreno 是《Coast Roads》的真正作者，這本書以筆名 L.M. Field 出版。", "B": "L.M. Field 這個名字印在《Coast Roads》的書名頁上。", "C": "筆名可能使人難以辨識作者是誰。", "D": "旅遊書常描述穿越沿海地區的旅程。"}, "answer": "A", "expl": "The answer directly identifies the real author.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Scientists have developed a &quot;freeze-thaw&quot; battery that can retain 92% of its charge after twelve weeks.<br>- The battery <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molten\" target=\"_blank\" rel=\"noopener\" data-w=\"molten\" data-pos=\"adj.\" data-en=\"melted by heat\" data-zh=\"熔化的\">molten<\/a> salt (a type of salt that liquifies when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=heated\" target=\"_blank\" rel=\"noopener\" data-w=\"heated\" data-pos=\"adj.\" data-en=\"(of a discussion) full of strong feeling or anger\" data-zh=\"激烈的\">heated<\/a> and solidifies at room <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>).<br>- When the salt is in a liquid state, energy flows through the battery.<br>- When the salt is in a solid state, energy stops flowing and is stored in the battery.<br>- The stored (frozen) energy can be used by reheating (thawing) the battery.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"freeze-thaw\" battery that can retain 92% of its charge after twelve weeks.\n- The battery contains molten salt (a type of salt that liquifies when heated and solidifies at room temperature).\n- When the salt is in a liquid state, energy flows through the battery.\n- When the salt is in a solid state, energy stops flowing and is stored in the battery.\n- The stored (frozen) energy can be used by reheating (thawing) the battery.", "stem": "The student wants to specify how the salt enables energy storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明鹽如何使儲能成為可能。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 科學家開發出一種「凍融」電池，在十二週後仍能保有 92% 的電量。\n- 這種電池含有熔鹽（一種加熱時會液化、在室溫下會凝固的鹽）。\n- 當鹽處於液態時，能量會在電池中流動。\n- 當鹽處於固態時，能量會停止流動並儲存在電池中。\n- 將電池重新加熱（解凍）後，就能使用儲存（凍結）的能量。", "opts": {"A": "Scientists have developed a freeze-thaw battery that contains molten salt, which liquifies when heated and solidifies at room temperature.", "B": "The stored energy in a freeze-thaw battery, which contains molten salt, can be used by reheating the battery.", "C": "When the molten salt in a freeze-thaw battery solidifies at room temperature, energy stops flowing and can be stored in the battery.", "D": "Molten salt allows a freeze-thaw battery to retain 92% of its charge after twelve weeks."}, "optsZh": {"A": "科學家開發出一種含有熔鹽的凍融電池，這種鹽受熱時會液化，在室溫下則會凝固。", "B": "含有熔鹽的凍融電池中所儲存的能量，可以藉由重新加熱電池來使用。", "C": "當凍融電池中的熔鹽在室溫下凝固時，能量便停止流動，因而能儲存在電池中。", "D": "熔鹽使凍融電池在十二週後仍能保留 92% 的電量。"}, "answer": "C", "expl": "It explains the mechanism: when the salt solidifies, energy stops flowing and is stored.", "explZh": "此選項說明機制：鹽凝固時能量停止流動並被儲存起來。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Engineers designed a heat-storage brick; the brick contains a wax that melts when heated and solidifies as it cools; liquid wax absorbs heat; solidifying wax releases stored heat; the goal is to specify how the wax enables storage.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Engineers designed a heat-storage brick; the brick contains a wax that melts when heated and solidifies as it cools; liquid wax absorbs heat; solidifying wax releases stored heat; the goal is to specify how the wax enables storage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：工程師設計了一種儲熱磚；這種磚含有一種加熱時融化、冷卻時凝固的蠟；液態的蠟會吸收熱能；凝固中的蠟會釋放儲存的熱能；目標是具體說明蠟如何實現儲熱。", "opts": {"A": "Heat-storage materials can help buildings use energy more efficiently.", "B": "The wax in the brick enables storage because it absorbs heat when it melts and releases the stored heat when it solidifies.", "C": "Engineers designed a brick that can be installed in walls.", "D": "The wax changes state when the temperature changes."}, "optsZh": {"A": "儲熱材料可以幫助建築物更有效率地使用能源。", "B": "磚中的蠟能儲存能量，是因為它融化時吸收熱量，凝固時再釋放所儲存的熱。", "C": "工程師設計了一種可以安裝在牆內的磚塊。", "D": "溫度改變時，蠟的狀態也會改變。"}, "answer": "B", "expl": "The answer explains the mechanism.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portable\" target=\"_blank\" rel=\"noopener\" data-w=\"portable\" data-pos=\"adj.\" data-en=\"easy to carry or move\" data-zh=\"可攜帶的；輕便的\">portable<\/a> cooler contains gel packs; the gel freezes at low <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>; frozen gel absorbs heat slowly as it melts; this keeps food cold; the goal is to specify how the gel enables cooling.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A portable cooler contains gel packs; the gel freezes at low temperature; frozen gel absorbs heat slowly as it melts; this keeps food cold; the goal is to specify how the gel enables cooling.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：一個攜帶式保冷箱內裝有凝膠冰袋；凝膠在低溫下會結凍；結凍的凝膠在融化時會緩慢吸收熱量；這能讓食物保持冰涼；目標是具體說明凝膠如何實現保冷。", "opts": {"A": "Food can spoil if it is not kept cold.", "B": "Because the frozen gel absorbs heat slowly as it melts, it helps the cooler keep food cold.", "C": "Gel packs are often placed around the sides of a cooler.", "D": "The portable cooler contains gel packs that can be frozen."}, "optsZh": {"A": "食物若沒有保持低溫可能會腐壞。", "B": "由於冷凍凝膠在融化時會緩慢吸收熱量，它能幫助保冷箱維持食物低溫。", "C": "凝膠包通常放置在保冷箱的四周。", "D": "這個攜帶式保冷箱內有可冷凍的凝膠包。"}, "answer": "B", "expl": "The answer explains how the material works.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A new battery uses ceramic plates; ions move through the plates when the plates are warm; ion movement stops when the plates cool; stopping ion movement preserves stored energy; the goal is to specify how the plates enable storage.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A new battery uses ceramic plates; ions move through the plates when the plates are warm; ion movement stops when the plates cool; stopping ion movement preserves stored energy; the goal is to specify how the plates enable storage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：一種新型電池使用陶瓷板；陶瓷板溫熱時，離子會在板中移動；陶瓷板冷卻時，離子移動就會停止；停止離子移動能保存所儲存的能量；目標是具體說明陶瓷板如何實現儲能。", "opts": {"A": "The stored energy can later be released when the battery is warmed.", "B": "The new battery depends on changes in temperature.", "C": "Ceramic plates can be used in several kinds of batteries.", "D": "When the ceramic plates cool, ion movement stops, allowing energy to remain stored in the battery."}, "optsZh": {"A": "電池加溫後，儲存的能量便可釋放出來。", "B": "這種新電池仰賴溫度的變化。", "C": "陶瓷板可用於數種電池中。", "D": "當陶瓷板冷卻時，離子移動會停止，使能量得以保存在電池中。"}, "answer": "D", "expl": "The answer specifies the storage mechanism.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A thermal tile contains salt hydrate; the salt hydrate liquefies when it absorbs heat; it crystallizes as it cools; crystallization releases stored heat later; the goal is to specify how the salt hydrate enables heat storage.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A thermal tile contains salt hydrate; the salt hydrate liquefies when it absorbs heat; it crystallizes as it cools; crystallization releases stored heat later; the goal is to specify how the salt hydrate enables heat storage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：一種隔熱磚含有鹽水合物；鹽水合物吸收熱量時會液化；冷卻時會結晶；結晶會在之後釋放儲存的熱量；目標是具體說明鹽水合物如何實現儲熱。", "opts": {"A": "The salt hydrate enables storage by liquefying as it absorbs heat and later releasing that stored heat when it crystallizes.", "B": "The tile was designed for buildings that need steady indoor temperatures.", "C": "Salt hydrates can change from solid to liquid.", "D": "The thermal tile contains salt hydrate rather than ordinary ceramic."}, "optsZh": {"A": "水合鹽能儲存能量，是因為它吸熱時會液化，之後結晶時再釋放所儲存的熱。", "B": "這種磚是為需要穩定室內溫度的建築物而設計的。", "C": "水合鹽可以從固體轉變為液體。", "D": "這種隔熱磚含有水合鹽，而非普通陶瓷。"}, "answer": "A", "expl": "The answer connects state change to storage.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Researchers made a pressure-storage device; gas is compressed into a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chamber\" target=\"_blank\" rel=\"noopener\" data-w=\"chamber\" data-pos=\"n.\" data-en=\"an enclosed room or space\" data-zh=\"室；腔室\">chamber<\/a>; compressed gas stores energy; opening a valve lets the gas expand and release energy; the goal is to specify how the gas enables storage.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Researchers made a pressure-storage device; gas is compressed into a chamber; compressed gas stores energy; opening a valve lets the gas expand and release energy; the goal is to specify how the gas enables storage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：研究人員製作了一種壓力儲能裝置；氣體被壓縮進一個腔室；壓縮的氣體儲存能量；打開閥門可讓氣體膨脹並釋放能量；目標是具體說明氣體如何實現儲能。", "opts": {"A": "Researchers built a device that uses a chamber and a valve.", "B": "Pressure-storage devices may be useful when electricity demand changes.", "C": "The gas enables storage because compressing it stores energy that can later be released when the gas expands through a valve.", "D": "The device stores gas in a chamber."}, "optsZh": {"A": "研究人員打造了一個使用腔室與閥門的裝置。", "B": "壓力儲能裝置在電力需求變動時可能很有用。", "C": "這種氣體之所以能儲能，是因為壓縮氣體時會儲存能量，而氣體經由閥門膨脹時，能量便可釋放出來。", "D": "這個裝置將氣體儲存在一個腔室中。"}, "answer": "C", "expl": "The answer explains how compression stores energy.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: indicate FWS classification category.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>.<br>- Species on the list are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classified<\/a> as either <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endangered\" target=\"_blank\" rel=\"noopener\" data-w=\"endangered\" data-pos=\"adj.\" data-en=\"at risk of disappearing completely\" data-zh=\"瀕臨絕種的\">endangered<\/a> or threatened.<br>- A species that is in danger of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinction<\/a> throughout most or all of its range is classified as endangered.<br>- A species that is likely to soon become endangered is classified as threatened.<br>- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk species.\n- Species on the list are classified as either endangered or threatened.\n- A species that is in danger of extinction throughout most or all of its range is classified as endangered.\n- A species that is likely to soon become endangered is classified as threatened.\n- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.", "stem": "The student wants to indicate the California red-legged frog's FWS classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出加州紅腿蛙在 FWS 的分類類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 美國魚類及野生動物管理局（FWS）保有一份所有瀕危風險物種的名單。\n- 名單上的物種被分類為「瀕危」或「受威脅」。\n- 在其分布範圍的大部分或全部地區面臨滅絕危險的物種，被歸類為瀕危。\n- 可能很快就會變成瀕危的物種，被歸類為受威脅。\n- 根據 FWS 的資料，加州紅腿蛙（Rana draytonii）可能很快就會變成瀕危物種。", "opts": {"A": "Species on the FWS list, which includes the California red-legged frog (Rana draytonii), are classified as either endangered or threatened.", "B": "The California red-legged frog (Rana draytonii) appears on the FWS list of at-risk species.", "C": "According to the FWS, the California red-legged frog is in the endangered category, in danger of extinction throughout most or all of its range.", "D": "Likely to soon become endangered, the California red-legged frog is classified as threatened by the FWS."}, "optsZh": {"A": "FWS 名單上的物種（其中包括加州紅腿蛙〔Rana draytonii〕）被歸類為「瀕危」或「受威脅」。", "B": "加州紅腿蛙（Rana draytonii）列在 FWS 的有風險物種名單上。", "C": "根據 FWS，加州紅腿蛙屬於「瀕危」類別，在其全部或大部分分布範圍內面臨滅絕危險。", "D": "由於很可能很快就會成為瀕危物種，加州紅腿蛙被 FWS 列為「受威脅」。"}, "answer": "D", "expl": "It states that the frog, likely to soon become endangered, is classified as threatened.", "explZh": "此選項指出這種蛙「可能即將瀕危」，因此被 FWS 歸類為「受威脅」（threatened）。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: indicate FWS classification category.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: The Wildlife Agency classifies species as endangered or vulnerable; endangered species face immediate risk of extinction; vulnerable species are likely to become endangered soon; the river otter is likely to become endangered soon; the goal is to indicate the classification.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The Wildlife Agency classifies species as endangered or vulnerable; endangered species face immediate risk of extinction; vulnerable species are likely to become endangered soon; the river otter is likely to become endangered soon; the goal is to indicate the classification.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：野生動物管理機構將物種分類為瀕危或易危；瀕危物種面臨立即滅絕的風險；易危物種可能很快就會變成瀕危；河獺可能很快就會變成瀕危；目標是指出其分類。", "opts": {"A": "The Wildlife Agency uses two main categories for at-risk species.", "B": "Endangered species face immediate risk of extinction throughout much of their range.", "C": "Likely to become endangered soon, the river otter is classified as vulnerable by the Wildlife Agency.", "D": "The river otter appears on the Wildlife Agency's list of at-risk species."}, "optsZh": {"A": "Wildlife Agency 將有風險物種分為兩大類。", "B": "瀕危物種在其大部分分布範圍內都面臨立即滅絕的風險。", "C": "由於很可能很快就會成為瀕危物種，河獺被 Wildlife Agency 列為「易危」。", "D": "河獺列在 Wildlife Agency 的有風險物種名單上。"}, "answer": "C", "expl": "The answer applies the definition to the species.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: indicate FWS classification category.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A heritage board <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> buildings as protected or watchlisted; protected buildings cannot be demolished; watchlisted buildings may soon qualify for protection; the old railway depot may soon qualify for protection; the goal is to indicate the category.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A heritage board classifies buildings as protected or watchlisted; protected buildings cannot be demolished; watchlisted buildings may soon qualify for protection; the old railway depot may soon qualify for protection; the goal is to indicate the category.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：一個文化資產委員會將建築物分類為「受保護」或「觀察名單」；受保護的建築物不得拆除；列入觀察名單的建築物可能很快就符合受保護資格；舊鐵路車站可能很快就符合受保護資格；目標是指出其類別。", "opts": {"A": "The old railway depot is classified as watchlisted because it may soon qualify for protection.", "B": "Protected buildings cannot be demolished without approval.", "C": "The heritage board maintains categories for historic buildings.", "D": "The railway depot is old enough to be reviewed by the board."}, "optsZh": {"A": "這座老舊的鐵路車站被列為「觀察名單」，因為它可能很快就符合受保護的資格。", "B": "受保護的建築物未經核准不得拆除。", "C": "文化資產委員會為歷史建築設有分類。", "D": "這座鐵路車站的年代夠久，足以接受委員會審查。"}, "answer": "A", "expl": "The answer identifies the category from the definition.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: indicate FWS classification category.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> group labels forests as critical or at-risk; critical forests are already losing habitat rapidly; at-risk forests are likely to lose habitat rapidly soon; the Cedar Ridge forest is likely to lose habitat rapidly soon; the goal is to indicate the classification.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A conservation group labels forests as critical or at-risk; critical forests are already losing habitat rapidly; at-risk forests are likely to lose habitat rapidly soon; the Cedar Ridge forest is likely to lose habitat rapidly soon; the goal is to indicate the classification.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：一個保育團體將森林標示為「危急」或「有風險」；危急的森林已經在迅速喪失棲地；有風險的森林可能很快就會迅速喪失棲地；Cedar Ridge 森林可能很快就會迅速喪失棲地；目標是指出其分類。", "opts": {"A": "The Cedar Ridge forest is monitored by a conservation group.", "B": "Critical forests are already losing habitat rapidly.", "C": "Forest classifications help conservation groups decide priorities.", "D": "Because it is likely to lose habitat rapidly soon, the Cedar Ridge forest is classified as at-risk."}, "optsZh": {"A": "Cedar Ridge 森林由一個保育團體監測。", "B": "關鍵森林已經在迅速失去棲地。", "C": "森林分類能幫助保育團體決定優先順序。", "D": "由於 Cedar Ridge 森林很可能很快就會迅速失去棲地，因此被列為「有風險」。"}, "answer": "D", "expl": "The answer applies the at-risk definition.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: indicate FWS classification category.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A health agency classifies outbreaks as active or potential; active outbreaks already show confirmed community spread; potential outbreaks are likely to show community spread soon; the Norvale cluster is likely to show community spread soon; the goal is to indicate the category.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A health agency classifies outbreaks as active or potential; active outbreaks already show confirmed community spread; potential outbreaks are likely to show community spread soon; the Norvale cluster is likely to show community spread soon; the goal is to indicate the category.", "stem": "Which choice most effectively uses relevant information
