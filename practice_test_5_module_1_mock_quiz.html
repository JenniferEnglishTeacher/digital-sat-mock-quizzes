ial and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively. During\nB) triumphed--decisively--during\nC) triumphed--decisively during\nD) triumphed--decisively, during", "answer": "A", "explanation": "A new sentence is needed before the time phrase."}, {"id": "24.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is\nB) were\nC) have been\nD) are", "answer": "B", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype, later,\nB) prototype,\nC) prototype;\nD) prototype later,", "answer": "C", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 25, "concept": "Standard English: appositive punctuation before proper noun.", "original": "Long attributed to Jacques-Louis David, the preeminent Neoclassical painter of his day, the 1801 painting Marie Josephine Charlotte du Val d'Ognes gained fresh attention in the 1990s when art historians discovered that the painting--which depicts a solitary young woman sketching--was actually the work of little-known French portrait _______ Marie-Denise Villers (1774-1821).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) artist--\nB) artist\nC) artist:\nD) artist,", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) people's stories\nB) peoples story's\nC) peoples stories\nD) people's story's", "answer": "A", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) had sheltered\nC) sheltered\nD) shelters", "answer": "D", "explanation": "Simple present fits a general biological fact."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively--during\nB) triumphed--decisively during\nC) triumphed--decisively, during\nD) triumphed--decisively. During", "answer": "D", "explanation": "A new sentence is needed before the time phrase."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) are\nB) is\nC) were\nD) have been", "answer": "C", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype later,\nB) prototype;\nC) prototype,\nD) prototype, later,", "answer": "B", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 26, "concept": "Standard English: dash introducing varied examples.", "original": "In 1986, conceptual artist Sophie Calle asked twenty-three people, all of whom had been born without sight, to describe \"their image of beauty\" in rich detail. Calle paired excerpts of these conversations with photographs--both of interviewees and the items they _______ to powerful effect in her exhibition The Blind.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) described, from hair to grass to sculptures\nB) described, from hair to grass to sculptures--\nC) described--from hair to grass to sculptures,\nD) described: from hair to grass to sculptures", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples story's\nB) people's stories\nC) people's story's\nD) peoples stories", "answer": "B", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) sheltered\nB) shelters\nC) would shelter\nD) had sheltered", "answer": "B", "explanation": "Simple present fits a general biological fact."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively--during\nB) triumphed--decisively, during\nC) triumphed--decisively. During\nD) triumphed--decisively during", "answer": "C", "explanation": "A new sentence is needed before the time phrase."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) are\nB) is\nC) have been\nD) were", "answer": "D", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype;\nB) prototype later,\nC) prototype,\nD) prototype, later,", "answer": "A", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 27, "concept": "Transitions: result after reduction firing.", "original": "Celebrated Tewa potter Maria Martinez (1887-1980) made her signature all-black ceramic vessels using a heating technique called reduction firing. This technique involves smothering the flame surrounding the clay vessel. _______ the vessel takes on a shiny, black hue.\n\nWhich choice completes the text with the most logical transition?\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The proposal was rejected twice and then revised after years of public advocacy. ______ in 2024, the city council approved the measure unanimously.\n\nWhich choice completes the text with the most logical transition?\n\nA) Additionally,\nB) Finally,\nC) Likewise,\nD) Instead,", "answer": "B", "explanation": "Finally marks the eventual outcome after a long process."}, {"id": "27.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The research team spent a decade testing unsuccessful materials. ______ they identified a compound that remained stable at high temperatures.\n\nWhich choice completes the text with the most logical transition?\n\nA) Eventually,\nB) Similarly,\nC) Instead,\nD) However,", "answer": "A", "explanation": "Eventually signals the final result after many attempts."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. For months the orchestra could not find a permanent rehearsal space. ______ a community college offered the musicians use of its auditorium.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) Nevertheless,\nC) At last,\nD) Meanwhile,", "answer": "C", "explanation": "At last marks a long-awaited outcome."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The bill failed in committee several times, but supporters kept reintroducing it. ______ after years of debate, it became law.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Likewise,\nC) Additionally,\nD) Finally,", "answer": "D", "explanation": "Finally introduces the eventual success."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The restoration effort faced funding delays, storms, and shortages of skilled workers. ______ the lighthouse reopened to visitors after twelve years.\n\nWhich choice completes the text with the most logical transition?\n\nA) Consequently,\nB) In contrast,\nC) Ultimately,\nD) Similarly,", "answer": "C", "explanation": "Ultimately marks the final result."}]}, {"n": 28, "concept": "Transitions: concession before positive point.", "original": "Historians agree that the jazz pianist Jelly Roll Morton was exaggerating when he claimed to have invented jazz music. No one can deny, _______ that Morton's innovative compositions and remarkable improvisational skills helped shape jazz as a genre during its early years.\n\nWhich choice completes the text with the most logical transition?\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. For many years, scholars attributed the anonymous poem to a minor court writer. ______ newly discovered letters suggest that it was written by the queen herself.\n\nWhich choice completes the text with the most logical transition?\n\nA) Secondly,\nB) However,\nC) Consequently,\nD) Moreover,", "answer": "B", "explanation": "However contrasts the new evidence with the earlier view."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The island was long described as geologically inactive. ______ recent measurements show that magma is still moving beneath its western ridge.\n\nWhich choice completes the text with the most logical transition?\n\nA) Nevertheless,\nB) Therefore,\nC) For instance,\nD) Additionally,", "answer": "A", "explanation": "Nevertheless introduces contrary evidence."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Doctors once considered the condition untreatable. ______ a new therapy has significantly improved symptoms in many patients.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) Furthermore,\nC) As a result,\nD) Similarly,", "answer": "A", "explanation": "By contrast signals a departure from the old belief."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The manuscript was assumed to be a copy produced centuries after the original. ______ chemical analysis of the ink dates it to the author's lifetime.\n\nWhich choice completes the text with the most logical transition?\n\nA) Secondly,\nB) Consequently,\nC) However,\nD) Likewise,", "answer": "C", "explanation": "However introduces contradictory evidence."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Astronomers had classified the object as an ordinary comet. ______ later observations revealed unusual emissions that required a different explanation.\n\nWhich choice completes the text with the most logical transition?\n\nA) Therefore,\nB) Moreover,\nC) Instead,\nD) However,", "answer": "D", "explanation": "However marks the contrast."}]}, {"n": 29, "concept": "Transitions: contrast between electoral systems.", "original": "According to Duverger's law, countries with single-ballot majoritarian elections for single-member districts tend to polarize into two-party systems, wherein dueling political parties consistently dominate the political system. _______ countries with proportional-representation electoral systems tend to support multi-partyism, under which power gets distributed among many political parties.\n\nWhich choice completes the text with the most logical transition?\nA) Subsequently,\nB) Conversely,\nC) For instance,\nD) In other words,", "generated": [{"id": "29.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Single-member plurality elections often reward the largest party and discourage smaller groups from running separate candidates. ______ proportional systems can allow several parties to win seats in relation to their share of the vote.\n\nWhich choice completes the text with the most logical transition?\n\nA) Subsequently,\nB) In other words,\nC) For instance,\nD) Conversely,", "answer": "D", "explanation": "Conversely introduces an opposite pattern."}, {"id": "29.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In winner-take-all systems, parties often merge into broad coalitions before an election. ______ in proportional systems, parties may remain separate and negotiate coalitions after votes are counted.\n\nWhich choice completes the text with the most logical transition?\n\nA) Therefore,\nB) By contrast,\nC) Similarly,\nD) For example,", "answer": "B", "explanation": "By contrast signals the opposing electoral outcome."}, {"id": "29.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A city council elected by districts may leave a dispersed minority without representation. ______ a council elected proportionally may give that minority seats if it receives enough total votes citywide.\n\nWhich choice completes the text with the most logical transition?\n\nA) Specifically,\nB) Moreover,\nC) However,\nD) Consequently,", "answer": "C", "explanation": "However introduces a contrast."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Majoritarian rules tend to simplify the ballot by favoring two dominant parties. ______ proportional rules tend to preserve a wider range of parties in the legislature.\n\nWhich choice completes the text with the most logical transition?\n\nA) Conversely,\nB) As a result,\nC) Meanwhile,\nD) For instance,", "answer": "A", "explanation": "Conversely marks the opposite relationship."}, {"id": "29.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Under one electoral design, voters choose a single candidate, and the candidate with the most votes wins the district. ______ under another design, seats are allocated to parties according to vote share.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Therefore,\nC) In contrast,\nD) For example,", "answer": "C", "explanation": "In contrast introduces a different system."}]}, {"n": 30, "concept": "Transitions: consequence of external appearance.", "original": "A turtle shell appears external to the animal, protecting its body like armor. _______ the shell is often incorrectly assumed to be an exoskeleton, a rigid outer casing like that of a crustacean or an insect, when in fact it is an endoskeleton, a part of the turtle's internal bone structure, more akin to a spine or a pair of ribs.\n\nWhich choice completes the text with the most logical transition?\nA) That being said,\nB) However,\nC) For instance,\nD) Hence,", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The tea was traditionally served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, 'night rest,' referred to its intended calming effect.\n\nWhich choice completes the text with the most logical transition?\n\nA) Therefore,\nB) Alternately,\nC) Likewise,\nD) Nevertheless,", "answer": "A", "explanation": "Therefore introduces the inference."}, {"id": "30.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The instrument produced a low, steady tone that listeners described as soothing. ______ the team suggested that ancient performers may have used it during healing ceremonies.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Instead,\nC) Consequently,\nD) Similarly,", "answer": "C", "explanation": "Consequently signals a conclusion from evidence."}, {"id": "30.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The plant's leaves close when touched, and early farmers called it 'the shy herb.' ______ botanists suspect that the name refers to this visible movement.\n\nWhich choice completes the text with the most logical transition?\n\nA) Alternatively,\nB) Likewise,\nC) Nevertheless,\nD) For this reason,", "answer": "D", "explanation": "For this reason links evidence to inference."}, {"id": "30.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The bread contained honey and aromatic seeds, ingredients associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.\n\nWhich choice completes the text with the most logical transition?\n\nA) In contrast,\nB) Therefore,\nC) Similarly,\nD) Regardless,", "answer": "B", "explanation": "Therefore presents the conclusion."}, {"id": "30.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The bowl's interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ archaeologists proposed that the bowl had a funerary purpose.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) Nevertheless,\nC) Alternatively,\nD) Likewise,", "answer": "A", "explanation": "As a result connects evidence to a conclusion."}]}, {"n": 31, "concept": "Student Notes: identify real author.", "original": "While researching a topic, a student has taken the following notes:\n- In 1859, the novel Adam Bede was published in England.\n- According to the novel's title page, the author's name was George Eliot.\n- George Eliot was widely assumed to be a pseudonym.\n- A pseudonym is a fake name used to conceal an author's identity.\n- A woman named Mary Ann Evans later revealed herself as the novel's real author.\n\nThe student wants to identify the real author of Adam Bede. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) The real author of Adam Bede was Mary Ann Evans, who published the novel using the pseudonym George Eliot.\nB) George Eliot, which Adam Bede's title page indicated was the name of the novel's author, was widely assumed to be a pseudonym.\nC) The title page of the novel Adam Bede indicated that the author's name was George Eliot.\nD) A woman who had used a pseudonym to conceal her identity later revealed herself as the real author of Adam Bede.", "generated": [{"id": "31.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The 1872 novel River Mist appeared under the name Ellis Vale; Ellis Vale was a pseudonym; a pseudonym is a false name used by an author; Clara Benton later admitted that she had written River Mist; the goal is to identify the real author.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) River Mist was published in the nineteenth century.\nB) The real author of River Mist was Clara Benton, who first published the novel under the pseudonym Ellis Vale.\nC) A pseudonym is a false name that can conceal an author's identity.\nD) Ellis Vale appeared on the title page of River Mist in 1872.", "answer": "B", "explanation": "The answer identifies the real author and explains the pseudonym."}, {"id": "31.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The essays in Mountain Letters were signed N. Gray; N. Gray was not the writer's legal name; the writer Naomi Greer later acknowledged writing the essays; the goal is to identify the real author.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Naomi Greer later discussed the essays in interviews.\nB) Some authors publish essays under names other than their legal names.\nC) The real author of Mountain Letters was Naomi Greer, who had used the pseudonym N. Gray.\nD) N. Gray was the name printed with Mountain Letters.", "answer": "C", "explanation": "The answer names the real author."}, {"id": "31.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The play The Harbor Gate was published under the name C. Lorne; critics suspected C. Lorne was a pseudonym; playwright Celia Lorne later revealed that she had written it; the goal is to identify the real author.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Pseudonyms were sometimes used by playwrights.\nB) The Harbor Gate was a play published under the name C. Lorne.\nC) The real author of The Harbor Gate was Celia Lorne, who published it as C. Lorne.\nD) Critics suspected that C. Lorne was not the author's full legal name.", "answer": "C", "explanation": "The answer identifies the author behind the name."}, {"id": "31.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The poetry collection North Window listed the author as Rowan Bell; Rowan Bell was a pen name; historian Adele Park found letters proving that Miriam Shaw wrote the poems; the goal is to identify the real author.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Rowan Bell was later shown to be a pen name.\nB) North Window was published as a poetry collection.\nC) Adele Park discovered letters about North Window.\nD) The real author of North Window was Miriam Shaw, who had published the poems under the pen name Rowan Bell.", "answer": "D", "explanation": "The answer identifies the real author and pen name."}, {"id": "31.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The travel book Coast Roads was credited to L.M. Field; L.M. Field was a pseudonym; Lucia Moreno later confirmed that she wrote the book; the goal is to identify the real author.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Lucia Moreno was the real author of Coast Roads, which was published under the pseudonym L.M. Field.\nB) L.M. Field was printed on the title page of Coast Roads.\nC) A pseudonym can make it difficult to identify an author.\nD) Travel books often describe journeys through coastal regions.", "answer": "A", "explanation": "The answer directly identifies the real author."}]}, {"n": 32, "concept": "Student Notes: specify how molten salt stores energy.", "original": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"freeze-thaw\" battery that can retain 92% of its charge after twelve weeks.\n- The battery contains molten salt (a type of salt that liquifies when heated and solidifies at room temperature).\n- When the salt is in a liquid state, energy flows through the battery.\n- When the salt is in a solid state, energy stops flowing and is stored in the battery.\n- The stored (frozen) energy can be used by reheating (thawing) the battery.\n\nThe student wants to specify how the salt enables energy storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Scientists have developed a freeze-thaw battery that contains molten salt, which liquifies when heated and solidifies at room temperature.\nB) The stored energy in a freeze-thaw battery, which contains molten salt, can be used by reheating the battery.\nC) When the molten salt in a freeze-thaw battery solidifies at room temperature, energy stops flowing and can be stored in the battery.\nD) Molten salt allows a freeze-thaw battery to retain 92% of its charge after twelve weeks.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Engineers designed a heat-storage brick; the brick contains a wax that melts when heated and solidifies as it cools; liquid wax absorbs heat; solidifying wax releases stored heat; the goal is to specify how the wax enables storage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Heat-storage materials can help buildings use energy more efficiently.\nB) The wax in the brick enables storage because it absorbs heat when it melts and releases the stored heat when it solidifies.\nC) Engineers designed a brick that can be installed in walls.\nD) The wax changes state when the temperature changes.", "answer": "B", "explanation": "The answer explains the mechanism."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A portable cooler contains gel packs; the gel freezes at low temperature; frozen gel absorbs heat slowly as it melts; this keeps food cold; the goal is to specify how the gel enables cooling.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Food can spoil if it is not kept cold.\nB) Because the frozen gel absorbs heat slowly as it melts, it helps the cooler keep food cold.\nC) Gel packs are often placed around the sides of a cooler.\nD) The portable cooler contains gel packs that can be frozen.", "answer": "B", "explanation": "The answer explains how the material works."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A new battery uses ceramic plates; ions move through the plates when the plates are warm; ion movement stops when the plates cool; stopping ion movement preserves stored energy; the goal is to specify how the plates enable storage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The stored energy can later be released when the battery is warmed.\nB) The new battery depends on changes in temperature.\nC) Ceramic plates can be used in several kinds of batteries.\nD) When the ceramic plates cool, ion movement stops, allowing energy to remain stored in the battery.", "answer": "D", "explanation": "The answer specifies the storage mechanism."}, {"id": "32.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A thermal tile contains salt hydrate; the salt hydrate liquefies when it absorbs heat; it crystallizes as it cools; crystallization releases stored heat later; the goal is to specify how the salt hydrate enables heat storage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The salt hydrate enables storage by liquefying as it absorbs heat and later releasing that stored heat when it crystallizes.\nB) The tile was designed for buildings that need steady indoor temperatures.\nC) Salt hydrates can change from solid to liquid.\nD) The thermal tile contains salt hydrate rather than ordinary ceramic.", "answer": "A", "explanation": "The answer connects state change to storage."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Researchers made a pressure-storage device; gas is compressed into a chamber; compressed gas stores energy; opening a valve lets the gas expand and release energy; the goal is to specify how the gas enables storage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Researchers built a device that uses a chamber and a valve.\nB) Pressure-storage devices may be useful when electricity demand changes.\nC) The gas enables storage because compressing it stores energy that can later be released when the gas expands through a valve.\nD) The device stores gas in a chamber.", "answer": "C", "explanation": "The answer explains how compression stores energy."}]}, {"n": 33, "concept": "Student Notes: indicate FWS classification category.", "original": "While researching a topic, a student has taken the following notes:\n- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk species.\n- Species on the list are classified as either endangered or threatened.\n- A species that is in danger of extinction throughout most or all of its range is classified as endangered.\n- A species that is likely to soon become endangered is classified as threatened.\n- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.\n\nThe student wants to indicate the California red-legged frog's FWS classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Species on the FWS list, which includes the California red-legged frog (Rana draytonii), are classified as either endangered or threatened.\nB) The California red-legged frog (Rana draytonii) appears on the FWS list of at-risk species.\nC) According to the FWS, the California red-legged frog is in the endangered category, in danger of extinction throughout most or all of its range.\nD) Likely to soon become endangered, the California red-legged frog is classified as threatened by the FWS.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The Wildlife Agency classifies species as endangered or vulnerable; endangered species face immediate risk of extinction; vulnerable species are likely to become endangered soon; the river otter is likely to become endangered soon; the goal is to indicate the classification.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Wildlife Agency uses two main categories for at-risk species.\nB) Endangered species face immediate risk of extinction throughout much of their range.\nC) Likely to become endangered soon, the river otter is classified as vulnerable by the Wildlife Agency.\nD) The river otter appears on the Wildlife Agency's list of at-risk species.", "answer": "C", "explanation": "The answer applies the definition to the species."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A heritage board classifies buildings as protected or watchlisted; protected buildings cannot be demolished; watchlisted buildings may soon qualify for protection; the old railway depot may soon qualify for protection; the goal is to indicate the category.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The old railway depot is classified as watchlisted because it may soon qualify for protection.\nB) Protected buildings cannot be demolished without approval.\nC) The heritage board maintains categories for historic buildings.\nD) The railway depot is old enough to be reviewed by the board.", "answer": "A", "explanation": "The answer identifies the category from the definition."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A conservation group labels forests as critical or at-risk; critical forests are already losing habitat rapidly; at-risk forests are likely to lose habitat rapidly soon; the Cedar Ridge forest is likely to lose habitat rapidly soon; the goal is to indicate the classification.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Cedar Ridge forest is monitored by a conservation group.\nB) Critical forests are already losing habitat rapidly.\nC) Forest classifications help conservation groups decide priorities.\nD) Because it is likely to lose habitat rapidly soon, the Cedar Ridge forest is classified as at-risk.", "answer": "D", "explanation": "The answer applies the at-risk definition."}, {"id": "33.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A health agency classifies outbreaks as active or potential; active outbreaks already show confirmed community spread; potential outbreaks are likely to show community spread soon; the Norvale cluster is likely to show community spread soon; the goal is to indicate the category.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The health agency tracks clusters of illness in several regions.\nB) Likely to show community spread soon, the Norvale cluster is classified as potential.\nC) Active outbreaks involve confirmed community spread.\nD) The Norvale cluster has not yet been described as active.", "answer": "B", "explanation": "The answer gives the correct category."}, {"id": "33.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A library labels rare books as restricted or monitored; restricted books are too fragile for regular handling; monitored books are likely to become too fragile soon; the 1890 atlas is likely to become too fragile soon; the goal is to indicate the classification.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The 1890 atlas is part of the library's rare collection.\nB) Restricted books cannot be handled without special permission.\nC) Likely to become too fragile for regular handling soon, the 1890 atlas is classified as monitored by the library.\nD) The library has several categories for rare books.", "answer": "C", "explanation": "The answer identifies the classification from the notes."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
