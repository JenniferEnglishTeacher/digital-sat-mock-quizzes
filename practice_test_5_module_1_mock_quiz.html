etches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some stars contain hydrogen and helium.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) One rocky planet has a thin atmosphere.\nD) The method used to study stars requires a telescope.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "15.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Many performers learned songs from relatives.\nC) The tradition is studied by scholars in several countries.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "15.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The table includes more than one year.\nB) The program took place in a community.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "original": "Ratio of Manganese to Calcium in Samples from Alboran Sea and Mauritanian Coast\nThe population of the coral Lophelia pertusa declined significantly around 9,000 years ago in the Alboran Sea and around 11,000 years ago near the Mauritanian coast. Using the ratio of manganese to calcium, which inversely correlates with ocean oxygenation levels, marine scientist Rodrigo da Costa Portilho-Ramos and colleagues evaluated whether oxygenation played a role in the declines of L. pertusa. The researchers concluded that oxygenation may have been important in the Alboran Sea but not near the Mauritanian coast, since _______\n\nWhich choice most effectively uses data from the graph to complete the statement?\nA) a substantial increase in oxygenation in the Alboran Sea corresponded with the local decline in L. pertusa, but the opposite relationship between oxygenation and L. pertusa was found near the Mauritanian coast.\nB) L. pertusa declined in the Alboran Sea during a period of substantial local decline in oxygenation, but L. pertusa declined near the Mauritanian coast during a period of little local change in oxygenation.\nC) oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after the decline, whereas oxygenation near the Mauritanian coast was relatively low both before and after the decline in L. pertusa.\nD) oxygenation in the Alboran Sea tended to be substantially higher than oxygenation near the Mauritanian coast during the period studied.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "16.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) The graph contains information about three regions.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "16.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some stars contain hydrogen and helium.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) The method used to study stars requires a telescope.\nD) One rocky planet has a thin atmosphere.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "16.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Many performers learned songs from relatives.\nC) Some songs use a meter also found in older European poetry.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) The program took place in a community.\nC) The table includes more than one year.\nD) Both towns had some volunteers.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: crater age is not yet known.", "original": "The Younger Dryas was a period of extreme cooling from 11,700 to 12,900 years ago in the Northern Hemisphere. Some scientists argue that a comet fragment hitting Earth brought about the cooling. Others disagree, partly because there is no known crater from such an impact that dates to the beginning of the period. In 2015, a team led by Kurt Kjaer detected a 19-mile-wide crater beneath a glacier in Greenland. The scientists who believe an impact caused the Younger Dryas claim that this discovery supports their view. However, Kjaer's team hasn't yet been able to determine the age of the crater. Therefore, the team suggests that _______\n\nWhich choice most logically completes the text?\nA) it can't be concluded that the impact that made the crater was connected to the beginning of the Younger Dryas.\nB) it can't be determined whether a comet fragment could make a crater as large as 19 miles wide.\nC) scientists have ignored the possibility that something other than a comet fragment could have made the crater.\nD) the scientists who believe an impact caused the Younger Dryas have made incorrect assumptions about when the period began.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) making it harder for officials to identify neighborhoods where rent increases are unusually severe.\nB) reducing tenants' interest in renewing leases.\nC) encouraging landlords to repair apartments before raising rents.\nD) preventing tenants from discussing rent changes with one another.", "answer": "A", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) require hospitals to publish every patient's medical history.\nB) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.\nC) prevent companies from profiting from successful drugs.\nD) reduce the number of diseases that hospitals are able to study.", "answer": "B", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) discourage museums from preserving fragile objects.\nB) obscure whether communities actually have meaningful influence over display decisions.\nC) prevent curators from learning about the objects' cultural meanings.\nD) force museums to return every object in their collections.", "answer": "B", "explanation": "Sealed agreements make accountability difficult."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) reduce villages' knowledge of marine species.\nB) increase the number of fish caught by local crews.\nC) stop companies from conducting ecological research.\nD) make it impossible for independent observers to judge whether compensation is equitable.", "answer": "D", "explanation": "Private contracts prevent independent assessment of equity."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______\n\nWhich choice most logically completes the text?\n\nA) require speakers to learn programming skills.\nB) increase the cost of recording equipment.\nC) prevent outsiders from verifying whether speakers are paid fairly.\nD) discourage researchers from documenting endangered languages.", "answer": "C", "explanation": "The concern is lack of transparent verification."}]}, {"n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "original": "In 2016 biological anthropologist Heather F. Smith and her team investigated the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged independently across multiple lineages in separate instances and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team hypothesized that the appendix likely _______\n\nWhich choice most logically completes the text?\nA) was once present in many nonmammal species but has since disappeared from those lineages.\nB) has been preserved in certain mammal species because it benefits their immune systems.\nC) will emerge in a greater number of mammal species because it may serve a necessary function in the immune system.\nD) produced higher concentrations of lymphoid tissue in mammals in the past than it does currently.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) preventing tenants from discussing rent changes with one another.\nB) encouraging landlords to repair apartments before raising rents.\nC) reducing tenants' interest in renewing leases.\nD) making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "answer": "D", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "18.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.\nB) require hospitals to publish every patient's medical history.\nC) reduce the number of diseases that hospitals are able to study.\nD) prevent companies from profiting from successful drugs.", "answer": "A", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "18.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) force museums to return every object in their collections.\nB) prevent curators from learning about the objects' cultural meanings.\nC) discourage museums from preserving fragile objects.\nD) obscure whether communities actually have meaningful influence over display decisions.", "answer": "D", "explanation": "Sealed agreements make accountability difficult."}, {"id": "18.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) stop companies from conducting ecological research.\nB) increase the number of fish caught by local crews.\nC) make it impossible for independent observers to judge whether compensation is equitable.\nD) reduce villages' knowledge of marine species.", "answer": "C", "explanation": "Private contracts prevent independent assessment of equity."}, {"id": "18.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______\n\nWhich choice most logically completes the text?\n\nA) discourage researchers from documenting endangered languages.\nB) prevent outsiders from verifying whether speakers are paid fairly.\nC) increase the cost of recording equipment.\nD) require speakers to learn programming skills.", "answer": "B", "explanation": "The concern is lack of transparent verification."}]}, {"n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "original": "Some ethicists hold that the moral goodness of an individual's actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that surviving works of Aztec (Nahua) philosophy express a very different view. Purcell reveals that these works posit an ethical system in which an individual's actions are judged in light of how well they accord with the individual's role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell's analysis suggests that _______\n\nWhich choice most logically completes the text?\nA) the Aztecs would have disputed the idea that the morality of an individual's actions can be assessed by appealing to standards of behavior that are independent of the individual's social circumstances.\nB) the Aztecs would not have accepted the notion that the morality of an individual's actions can be fairly evaluated by people who do not live in the same society as that individual.\nC) actions by members of Aztec society who contributed a great deal to their community could be judged as morally good even if those actions were inconsistent with behaviors the Aztecs regarded as good in all contexts.\nD) similar actions performed by people in different social roles in Aztec society would have been regarded as morally equivalent unless those actions led to different outcomes for the community.", "generated": [{"id": "19.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) reducing tenants' interest in renewing leases.\nB) preventing tenants from discussing rent changes with one another.\nC) making it harder for officials to identify neighborhoods where rent increases are unusually severe.\nD) encouraging landlords to repair apartments before raising rents.", "answer": "C", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "19.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) prevent companies from profiting from successful drugs.\nB) require hospitals to publish every patient's medical history.\nC) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.\nD) reduce the number of diseases that hospitals are able to study.", "answer": "C", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "19.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) force museums to return every object in their collections.\nB) discourage museums from preserving fragile objects.\nC) prevent curators from learning about the objects' cultural meanings.\nD) obscure whether communities actually have meaningful influence over display decisions.", "answer": "D", "explanation": "Sealed agreements make accountability difficult."}, {"id": "19.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) make it impossible for independent observers to judge whether compensation is equitable.\nB) reduce villages' knowledge of marine species.\nC) stop companies from conducting ecological research.\nD) increase the number of fish caught by local crews.", "answer": "A", "explanation": "Private contracts prevent independent assessment of equity."}, {"id": "19.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______\n\nWhich choice most logically completes the text?\n\nA) discourage researchers from documenting endangered languages.\nB) prevent outsiders from verifying whether speakers are paid fairly.\nC) increase the cost of recording equipment.\nD) require speakers to learn programming skills.", "answer": "B", "explanation": "The concern is lack of transparent verification."}]}, {"n": 20, "concept": "Standard English: demonstrative pronoun.", "original": "Le Luong Minh became the thirteenth secretary-general of the Association of Southeast Asian Nations (ASEAN) in January 2013, making _______ the first time the organization would appoint a Vietnamese leader.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) these\nB) those\nC) this\nD) some", "generated": [{"id": "20.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples stories\nB) people's story's\nC) peoples story's\nD) people's stories", "answer": "D", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "20.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) had sheltered\nC) sheltered\nD) shelters", "answer": "D", "explanation": "Simple present fits a general biological fact."}, {"id": "20.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively--during\nB) triumphed--decisively, during\nC) triumphed--decisively. During\nD) triumphed--decisively during", "answer": "C", "explanation": "A new sentence is needed before the time phrase."}, {"id": "20.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) have been\nC) are\nD) is", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "20.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype later,\nB) prototype;\nC) prototype,\nD) prototype, later,", "answer": "B", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 21, "concept": "Standard English: finite verb after time phrase.", "original": "In 1929, Edwin Herbert Land invented a polarizing filter that was featured in a number of products, from sunglasses to 3D movies. A decade later, Land _______ his technology to invent the world's first instant camera, the Polaroid Land camera.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) used\nB) to have used\nC) to use\nD) using", "generated": [{"id": "21.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples stories\nB) people's stories\nC) peoples story's\nD) people's story's", "answer": "B", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "21.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several par d distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) is\nC) have been\nD) are", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "23.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype later,\nB) prototype;\nC) prototype, later,\nD) prototype,", "answer": "B", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 24, "concept": "Standard English: plural subject agreement.", "original": "In the music video for the song \"We Didn't Start the Fire\" by Billy Joel, the singer lists 118 political and cultural references. Such iconic references, cited in rapid and frenetic procession by the musician, who is seated impassively at a dinner table, _______ key moments and personalities of the twentieth century.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) represents\nB) has represented\nC) was representing\nD) represent", "generated": [{"id": "24.1", "text": "The team also checked whether the pattern held across different sites, since a
