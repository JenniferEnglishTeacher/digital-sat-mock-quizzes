produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Many performers learned songs from relatives.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "這項傳統受到數個國家學者的研究。", "B": "許多表演者向親戚學習歌曲。", "C": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "D": "有幾首民謠納入了地方歷史事件，以及在不同族群持續接觸後才出現的融合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The program took place in a community.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "這項計畫在一個社區中進行。", "C": "這張表格涵蓋不只一年。", "D": "兩個城鎮都有一些志工。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "The Younger Dryas was a period of extreme cooling from 11,700 to 12,900 years ago in the Northern Hemisphere. Some scientists argue that a comet <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragment<\/a> hitting Earth brought about the cooling. Others disagree, partly because there is no known crater from such an impact that dates to the beginning of the period. In 2015, a team led by Kurt Kjaer detected a 19-mile-wide crater beneath a glacier in Greenland. The scientists who believe an impact caused the Younger Dryas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> that this discovery supports their view. However, Kjaer&#x27;s team hasn&#x27;t yet been able to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> the age of the crater. Therefore, the team suggests that _______", "bodyPlain": "The Younger Dryas was a period of extreme cooling from 11,700 to 12,900 years ago in the Northern Hemisphere. Some scientists argue that a comet fragment hitting Earth brought about the cooling. Others disagree, partly because there is no known crater from such an impact that dates to the beginning of the period. In 2015, a team led by Kurt Kjaer detected a 19-mile-wide crater beneath a glacier in Greenland. The scientists who believe an impact caused the Younger Dryas claim that this discovery supports their view. However, Kjaer's team hasn't yet been able to determine the age of the crater. Therefore, the team suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "新仙女木期是北半球在 11,700 年至 12,900 年前的一段極度寒冷時期。有些科學家主張，是一塊彗星碎片撞擊地球造成了這次降溫。其他人則不同意，部分原因是目前並沒有已知可追溯到該時期開始時的此類撞擊坑。2015 年，由 Kurt Kjaer 領導的團隊在格陵蘭的一座冰河下方偵測到一個寬 19 英里的撞擊坑。相信撞擊造成新仙女木期的科學家聲稱，這項發現支持了他們的觀點。然而，Kjaer 的團隊至今仍無法確定這個撞擊坑的年代。因此，該團隊認為 _______", "opts": {"A": "it can't be concluded that the impact that made the crater was connected to the beginning of the Younger Dryas.", "B": "it can't be determined whether a comet fragment could make a crater as large as 19 miles wide.", "C": "scientists have ignored the possibility that something other than a comet fragment could have made the crater.", "D": "the scientists who believe an impact caused the Younger Dryas have made incorrect assumptions about when the period began."}, "optsZh": {"A": "就無法斷定造成這個隕石坑的撞擊與新仙女木期的開始有關。", "B": "就無法確定彗星碎片是否能撞出寬達 19 英里的隕石坑。", "C": "科學家忽略了隕石坑可能由彗星碎片以外的東西造成的可能性。", "D": "認為撞擊造成新仙女木期的科學家，對該時期何時開始做出了錯誤的假設。"}, "answer": "A", "expl": "Since the crater's age is unknown, it can't be concluded that the impact is linked to the start of the Younger Dryas.", "explZh": "隕石坑的年代尚未確定，因此無法斷定這次撞擊與新仙女木期的開始有關。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一項城市政策要求房東向房客揭露租金調漲，但允許這些通知不提供給公家機關。住屋權益倡議者警告，這項政策可能產生 ______ 的意外效果。", "opts": {"A": "making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "B": "reducing tenants' interest in renewing leases.", "C": "encouraging landlords to repair apartments before raising rents.", "D": "preventing tenants from discussing rent changes with one another."}, "optsZh": {"A": "使官員更難找出租金漲幅異常嚴重的社區。", "B": "降低租客續約的意願。", "C": "鼓勵房東在調漲租金前先修繕公寓。", "D": "阻止租客彼此討論租金變動。"}, "answer": "A", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> argue that the rule could ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許公司對每份研究協議的條款保密。病患權益倡議者主張，這項規定可能會 ______", "opts": {"A": "require hospitals to publish every patient's medical history.", "B": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.", "C": "prevent companies from profiting from successful drugs.", "D": "reduce the number of diseases that hospitals are able to study."}, "optsZh": {"A": "要求醫院公開每位病患的病歷。", "B": "使人難以判斷醫院使用病患資料是否獲得公平的補償。", "C": "阻止公司從成功的藥物中獲利。", "D": "減少醫院能夠研究的疾病數量。"}, "answer": "B", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。新的檔案法要求博物館在展示文化物品前先諮詢原住民後裔社群，但允許博物館將諮詢協議封存不公開。一些社群領袖擔心這項條款可能會 ______", "opts": {"A": "discourage museums from preserving fragile objects.", "B": "obscure whether communities actually have meaningful influence over display decisions.", "C": "prevent curators from learning about the objects' cultural meanings.", "D": "force museums to return every object in their collections."}, "optsZh": {"A": "使博物館不願保存易損的文物。", "B": "使人看不清社區對展示決策是否真的具有實質影響力。", "C": "使策展人無從了解文物的文化意義。", "D": "迫使博物館歸還其館藏中的每一件文物。"}, "answer": "B", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一項漁業條約要求企業在使用傳統生態知識時補償沿海村落，但該條約允許付款合約保持不公開。批評者主張，這項保密規定可能會 ______", "opts": {"A": "reduce villages' knowledge of marine species.", "B": "increase the number of fish caught by local crews.", "C": "stop companies from conducting ecological research.", "D": "make it impossible for independent observers to judge whether compensation is equitable."}, "optsZh": {"A": "降低村民對海洋物種的認識。", "B": "增加當地船員的漁獲量。", "C": "阻止公司進行生態研究。", "D": "使獨立觀察者無法判斷補償是否公平。"}, "answer": "D", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: crater age is not yet known.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A university policy requires <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> companies to compensate Indigenous language speakers when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一項大學政策要求科技公司在使用原住民語言使用者的錄音訓練語音辨識系統時給予補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "require speakers to learn programming skills.", "B": "increase the cost of recording equipment.", "C": "prevent outsiders from verifying whether speakers are paid fairly.", "D": "discourage researchers from documenting endangered languages."}, "optsZh": {"A": "要求說話者學習程式設計技能。", "B": "提高錄音設備的成本。", "C": "使外界無法查證說話者是否獲得公平報酬。", "D": "使研究人員不願記錄瀕危語言。"}, "answer": "C", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "In 2016 biological anthropologist Heather F. Smith and her team investigated the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independently<\/a> across multiple lineages in separate instances and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesized\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesized\" data-pos=\"v.\" data-en=\"suggested an idea as a possible explanation to be tested\" data-zh=\"假設；推測\">hypothesized<\/a> that the appendix likely _______", "bodyPlain": "In 2016 biological anthropologist Heather F. Smith and her team investigated the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged independently across multiple lineages in separate instances and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team hypothesized that the appendix likely _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "2016 年，生物人類學家 Heather F.Smith 與她的團隊研究了闌尾的演化；闌尾是一種存在於某些哺乳動物（包括人類）體內的腸道器官，但一般認為它沒有功能。團隊研究了 533 種哺乳動物，發現闌尾曾在多個譜系中各自獨立出現，而且重要的是，在特定譜系中出現後並沒有消失。此外，團隊確定，擁有這個器官的物種，其盲腸（闌尾所連接的器官）中往往有較高濃度的淋巴組織，而淋巴組織能支援免疫反應。因此，團隊推測闌尾很可能 _______", "opts": {"A": "was once present in many nonmammal species but has since disappeared from those lineages.", "B": "has been preserved in certain mammal species because it benefits their immune systems.", "C": "will emerge in a greater number of mammal species because it may serve a necessary function in the immune system.", "D": "produced higher concentrations of lymphoid tissue in mammals in the past than it does currently."}, "optsZh": {"A": "過去曾存在於許多非哺乳類物種中，但後來已從那些譜系中消失。", "B": "因為對免疫系統有益，而在某些哺乳類物種中被保留下來。", "C": "將會在更多哺乳類物種中出現，因為它可能在免疫系統中發揮必要的功能。", "D": "過去在哺乳類動物體內產生的淋巴組織濃度比現在更高。"}, "answer": "B", "expl": "The appendix hasn't disappeared once it emerged and is linked to more immune-supporting lymphoid tissue, suggesting it was preserved because it benefits immunity.", "explZh": "闌尾出現後並未消失，且有闌尾的物種盲腸中支持免疫的淋巴組織較多，推論闌尾因有益免疫系統而被保留下來。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一項城市政策要求房東向房客揭露租金調漲，但允許這些通知不提供給公家機關。住屋權益倡議者警告，這項政策可能產生 ______ 的意外效果。", "opts": {"A": "preventing tenants from discussing rent changes with one another.", "B": "encouraging landlords to repair apartments before raising rents.", "C": "reducing tenants' interest in renewing leases.", "D": "making it harder for officials to identify neighborhoods where rent increases are unusually severe."}, "optsZh": {"A": "阻止租客彼此討論租金變動。", "B": "鼓勵房東在調漲租金前先修繕公寓。", "C": "降低租客續約的意願。", "D": "使官員更難找出租金漲幅異常嚴重的社區。"}, "answer": "D", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> argue that the rule could ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許公司對每份研究協議的條款保密。病患權益倡議者主張，這項規定可能會 ______", "opts": {"A": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.", "B": "require hospitals to publish every patient's medical history.", "C": "reduce the number of diseases that hospitals are able to study.", "D": "prevent companies from profiting from successful drugs."}, "optsZh": {"A": "使人難以判斷醫院使用病患資料是否獲得公平的補償。", "B": "要求醫院公開每位病患的病歷。", "C": "減少醫院能夠研究的疾病數量。", "D": "阻止公司從成功的藥物中獲利。"}, "answer": "A", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。新的檔案法要求博物館在展示文化物品前先諮詢原住民後裔社群，但允許博物館將諮詢協議封存不公開。一些社群領袖擔心這項條款可能會 ______", "opts": {"A": "force museums to return every object in their collections.", "B": "prevent curators from learning about the objects' cultural meanings.", "C": "discourage museums from preserving fragile objects.", "D": "obscure whether communities actually have meaningful influence over display decisions."}, "optsZh": {"A": "迫使博物館歸還其館藏中的每一件文物。", "B": "使策展人無從了解文物的文化意義。", "C": "使博物館不願保存易損的文物。", "D": "使人看不清社區對展示決策是否真的具有實質影響力。"}, "answer": "D", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一項漁業條約要求企業在使用傳統生態知識時補償沿海村落，但該條約允許付款合約保持不公開。批評者主張，這項保密規定可能會 ______", "opts": {"A": "stop companies from conducting ecological research.", "B": "increase the number of fish caught by local crews.", "C": "make it impossible for independent observers to judge whether compensation is equitable.", "D": "reduce villages' knowledge of marine species."}, "optsZh": {"A": "阻止公司進行生態研究。", "B": "增加當地船員的漁獲量。", "C": "使獨立觀察者無法判斷補償是否公平。", "D": "降低村民對海洋物種的認識。"}, "answer": "C", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: appendix likely immune benefit.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A university policy requires <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> companies to compensate Indigenous language speakers when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一項大學政策要求科技公司在使用原住民語言使用者的錄音訓練語音辨識系統時給予補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "discourage researchers from documenting endangered languages.", "B": "prevent outsiders from verifying whether speakers are paid fairly.", "C": "increase the cost of recording equipment.", "D": "require speakers to learn programming skills."}, "optsZh": {"A": "使研究人員不願記錄瀕危語言。", "B": "使外界無法查證說話者是否獲得公平報酬。", "C": "提高錄音設備的成本。", "D": "要求說話者學習程式設計技能。"}, "answer": "B", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ethicist\" target=\"_blank\" rel=\"noopener\" data-w=\"ethicist\" data-pos=\"n.\" data-en=\"an expert in moral principles\" data-zh=\"倫理學家\">ethicists<\/a> hold that the moral goodness of an individual&#x27;s actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">surviving<\/a> works of Aztec (Nahua) philosophy <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">express<\/a> a very different view. Purcell <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> that these works posit an ethical system in which an individual&#x27;s actions are judged in light of how well they accord with the individual&#x27;s role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell&#x27;s analysis suggests that _______", "bodyPlain": "Some ethicists hold that the moral goodness of an individual's actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that surviving works of Aztec (Nahua) philosophy express a very different view. Purcell reveals that these works posit an ethical system in which an individual's actions are judged in light of how well they accord with the individual's role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell's analysis suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "有些倫理學家認為，個人行為在道德上的好壞，完全取決於行為本身是否良善，而與行為發生的情境無關。哲學家 L. Sebastian Purcell 已證明，現存的阿茲特克（納瓦）哲學著作表達了一種非常不同的觀點。Purcell 揭示，這些著作提出一套倫理體系：評判個人行為時，要看它與個人在社會中的角色有多相符，以及對社群的貢獻有多大。就這些著作能代表阿茲特克思想的程度而言，Purcell 的分析顯示 _______", "opts": {"A": "the Aztecs would have disputed the idea that the morality of an individual's actions can be assessed by appealing to standards of behavior that are independent of the individual's social circumstances.", "B": "the Aztecs would not have accepted the notion that the morality of an individual's actions can be fairly evaluated by people who do not live in the same society as that individual.", "C": "actions by members of Aztec society who contributed a great deal to their community could be judged as morally good even if those actions were inconsistent with behaviors the Aztecs regarded as good in all contexts.", "D": "similar actions performed by people in different social roles in Aztec society would have been regarded as morally equivalent unless those actions led to different outcomes for the community."}, "optsZh": {"A": "阿茲特克人會反對以下觀點：一個人行為的道德性，可以依據與其社會處境無關的行為標準來評斷。", "B": "阿茲特克人不會接受以下觀念：一個人行為的道德性，可以由不住在同一個社會中的人公平地評斷。", "C": "對社會貢獻良多的阿茲特克社會成員，其行為即使不符合阿茲特克人認為在任何情況下都屬良善的行為，仍可能被評斷為道德上良善的。", "D": "阿茲特克社會中扮演不同社會角色的人所做的相似行為，在道德上會被視為等同，除非那些行為對社會造成不同的結果。"}, "answer": "A", "expl": "Aztec ethics judged actions by how they fit the person's social role, so the Aztecs would reject judging morality by standards independent of social circumstances.", "explZh": "阿茲特克倫理依個人社會角色與對社群的貢獻來評判行為，因此他們會反對用與社會處境無關的標準來評估道德。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一項城市政策要求房東向房客揭露租金調漲，但允許這些通知不提供給公家機關。住屋權益倡議者警告，這項政策可能產生 ______ 的意外效果。", "opts": {"A": "reducing tenants' interest in renewing leases.", "B": "preventing tenants from discussing rent changes with one another.", "C": "making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "D": "encouraging landlords to repair apartments before raising rents."}, "optsZh": {"A": "降低租客續約的意願。", "B": "阻止租客彼此討論租金變動。", "C": "使官員更難找出租金漲幅異常嚴重的社區。", "D": "鼓勵房東在調漲租金前先修繕公寓。"}, "answer": "C", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> argue that the rule could ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許公司對每份研究協議的條款保密。病患權益倡議者主張，這項規定可能會 ______", "opts": {"A": "prevent companies from profiting from successful drugs.", "B": "require hospitals to publish every patient's medical history.", "C": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.", "D": "reduce the number of diseases that hospitals are able to study."}, "optsZh": {"A": "阻止公司從成功的藥物中獲利。", "B": "要求醫院公開每位病患的病歷。", "C": "使人難以判斷醫院使用病患資料是否獲得公平的補償。", "D": "減少醫院能夠研究的疾病數量。"}, "answer": "C", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。新的檔案法要求博物館在展示文化物品前先諮詢原住民後裔社群，但允許博物館將諮詢協議封存不公開。一些社群領袖擔心這項條款可能會 ______", "opts": {"A": "force museums to return every object in their collections.", "B": "discourage museums from preserving fragile objects.", "C": "prevent curators from learning about the objects' cultural meanings.", "D": "obscure whether communities actually have meaningful influence over display decisions."}, "optsZh": {"A": "迫使博物館歸還其館藏中的每一件文物。", "B": "使博物館不願保存易損的文物。", "C": "使策展人無從了解文物的文化意義。", "D": "使人看不清社區對展示決策是否真的具有實質影響力。"}, "answer": "D", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一項漁業條約要求企業在使用傳統生態知識時補償沿海村落，但該條約允許付款合約保持不公開。批評者主張，這項保密規定可能會 ______", "opts": {"A": "make it impossible for independent observers to judge whether compensation is equitable.", "B": "reduce villages' knowledge of marine species.", "C": "stop companies from conducting ecological research.", "D": "increase the number of fish caught by local crews."}, "optsZh": {"A": "使獨立觀察者無法判斷補償是否公平。", "B": "降低村民對海洋物種的認識。", "C": "阻止公司進行生態研究。", "D": "增加當地船員的漁獲量。"}, "answer": "A", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Logical Completion: Aztec ethics depend on social role.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A university policy requires <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> companies to compensate Indigenous language speakers when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一項大學政策要求科技公司在使用原住民語言使用者的錄音訓練語音辨識系統時給予補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "discourage researchers from documenting endangered languages.", "B": "prevent outsiders from verifying whether speakers are paid fairly.", "C": "increase the cost of recording equipment.", "D": "require speakers to learn programming skills."}, "optsZh": {"A": "使研究人員不願記錄瀕危語言。", "B": "使外界無法查證說話者是否獲得公平報酬。", "C": "提高錄音設備的成本。", "D": "要求說話者學習程式設計技能。"}, "answer": "B", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "Le Luong Minh became the thirteenth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secretary-general\" target=\"_blank\" rel=\"noopener\" data-w=\"secretary-general\" data-pos=\"n.\" data-en=\"the chief administrator of an international organization\" data-zh=\"秘書長\">secretary-general<\/a> of the Association of Southeast Asian Nations (ASEAN) in January 2013, making _______ the first time the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organization\" target=\"_blank\" rel=\"noopener\" data-w=\"organization\" data-pos=\"n.\" data-en=\"a group of people working together for a shared purpose\" data-zh=\"組織；機構\">organization<\/a> would <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appoint\" target=\"_blank\" rel=\"noopener\" data-w=\"appoint\" data-pos=\"v.\" data-en=\"to choose someone officially for a job or position\" data-zh=\"任命\">appoint<\/a> a Vietnamese leader.", "bodyPlain": "Le Luong Minh became the thirteenth secretary-general of the Association of Southeast Asian Nations (ASEAN) in January 2013, making _______ the first time the organization would appoint a Vietnamese leader.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的寫作慣例？", "bodyZh": "Le Luong Minh 於 2013 年 1 月成為東南亞國家協會（ASEAN）第十三任秘書長，_______ 是該組織首次任命越南籍領導人。", "opts": {"A": "these", "B": "those", "C": "this", "D": "some"}, "optsZh": {"A": "these（這些：複數指示代名詞 → 與單數 the first time 不一致：錯誤）", "B": "those（那些：複數指示代名詞 → 錯誤）", "C": "this（這：單數指示代名詞，指這次任命：正確）", "D": "some（一些 → 不能指代前述整件事：錯誤）"}, "answer": "C", "expl": "'This' is a singular pronoun referring to the event of his becoming secretary-general, which matches 'the first time.'", "explZh": "「this」是單數代名詞，指他就任秘書長這件事，與單數的「the first time」一致。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的寫作慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。好幾本掛名明星運動員的回憶錄，其實是由合作者撰寫的；這些合作者把其他 ______ 塑造成精緻的故事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "people's story's", "C": "peoples story's", "D": "people's stories"}, "optsZh": {"A": "peoples stories（peoples 缺少所有格撇號：錯誤）", "B": "people's story's（story's 誤用所有格 → 應為複數 stories：錯誤）", "C": "peoples story's（缺少所有格且 story's 誤用撇號：錯誤）", "D": "people's stories（people 的所有格＋複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的寫作慣例？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。在寒冷的月份，沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭底下，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "had sheltered", "C": "sheltered", "D": "shelters"}, "optsZh": {"A": "would shelter（would＋原形 → 與現在式 reduces 時態不一致：錯誤）", "B": "had sheltered（過去完成式 → 與現在式 reduces 時態不一致：錯誤）", "C": "sheltered（過去式 → 與現在式 reduces 時態不一致：錯誤）", "D": "shelters（現在式，與並列動詞 reduces 一致：正確）"}, "answer": "D", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的寫作慣例？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 了比賽的最後一輪，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively, during", "C": "triumphed--decisively. During", "D": "triumphed--decisively during"}, "optsZh": {"A": "triumphed--decisively--during（破折號不能分隔兩個獨立子句的主從關係，造成連寫句：錯誤）", "B": "triumphed--decisively, during（逗號連接兩個獨立子句 → 逗號連接錯誤）", "C": "triumphed--decisively. During（句號分隔兩個獨立子句：正確）", "D": "triumphed--decisively during（缺少標點分隔兩個獨立子句 → 連寫句：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的寫作慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。在從沉船中打撈出的少數物品中，______ 一個黃銅羅盤、三個陶碗和一本皮革裝訂的筆記本。", "opts": {"A": "were", "B": "have been", "C": "are", "D": "is"}, "optsZh": {"A": "were（複數動詞，與倒裝句的複數主詞 a compass, bowls, and a notebook 一致：正確）", "B": "have been（複數現在完成式 → 時態不當：錯誤）", "C": "are（複數動詞，現在式 → 時態或主詞不一致：錯誤）", "D": "is（單數動詞 → 主詞為複數：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: demonstrative pronoun.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" dat
