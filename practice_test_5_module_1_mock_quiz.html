<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 5, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 5, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "The following text is from the 1913 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> &quot;The King&#x27;s Coin&quot; by Emily Pauline Johnson, a Kanienkahagen (Mohawk) writer also known as Tekahionwake. Fox-Foot, a young Ojibwe man, is guiding a group of fur <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trader\" target=\"_blank\" rel=\"noopener\" data-w=\"trader\" data-pos=\"n.\" data-en=\"a person who buys and sells goods\" data-zh=\"商人；貿易商\">traders<\/a> who are traveling by canoe and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suspect\" target=\"_blank\" rel=\"noopener\" data-w=\"suspect\" data-pos=\"v.\" data-en=\"to believe something is probably true\" data-zh=\"懷疑；猜想\">suspects<\/a> that they are being followed.<br><br>At supper time, Fox-Foot would allow no fire to be built, no landing to be made, no trace of their passing to be left. They ate canned meat and marmalade, drank again of the stream and pushed on, until just at dusk they reached the edge of a long, still lake, with shores of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=granite\" target=\"_blank\" rel=\"noopener\" data-w=\"granite\" data-pos=\"n.\" data-en=\"a very hard gray or pink rock\" data-zh=\"花崗岩\">granite<\/a> and dense fir forest.", "bodyPlain": "The following text is from the 1913 story \"The King's Coin\" by Emily Pauline Johnson, a Kanienkahagen (Mohawk) writer also known as Tekahionwake. Fox-Foot, a young Ojibwe man, is guiding a group of fur traders who are traveling by canoe and suspects that they are being followed.\n\nAt supper time, Fox-Foot would allow no fire to be built, no landing to be made, no trace of their passing to be left. They ate canned meat and marmalade, drank again of the stream and pushed on, until just at dusk they reached the edge of a long, still lake, with shores of granite and dense fir forest.", "stem": "As used in the text, what does the word \"trace\" most nearly mean?", "stemZh": "根據本文用法，「trace」這個字最接近什麼意思？", "bodyZh": "以下文字選自 Emily Pauline Johnson 1913 年的短篇小說〈The King's Coin〉；她是 Kanienkahagen（莫霍克族）作家，又名 Tekahionwake。年輕的奧吉布瓦族男子 Fox-Foot 正為一群乘獨木舟旅行的毛皮商人帶路，他懷疑有人在跟蹤他們。\n到了晚餐時間，Fox-Foot 不准生火、不准上岸，也不准留下任何他們經過的痕跡。他們吃了罐頭肉和果醬，又喝了些溪水，繼續前進，直到黃昏時分才抵達一座狹長而平靜的湖泊邊緣，湖岸是花崗岩與茂密的冷杉林。", "opts": {"A": "Evidence", "B": "Blemish", "C": "Amount", "D": "Sketch"}, "optsZh": {"A": "Evidence（證據）", "B": "Blemish（瑕疵；污點）", "C": "Amount（數量；總額）", "D": "Sketch（草圖；素描）"}, "answer": "A", "expl": "Fox-Foot wants to leave no sign that the group passed by, so 'trace' means evidence.", "explZh": "Fox-Foot 不希望留下任何他們經過的痕跡，所以 trace 在此指「Evidence」（證據、跡象）。", "defs": {"A": {"w": "evidence", "pos": "n.", "en": "facts or signs that show something is true", "zh": "證據；跡象", "word": "evidence"}, "B": {"w": "blemish", "pos": "n.", "en": "a small mark or flaw that spoils how something looks", "zh": "瑕疵；污點", "word": "blemish"}, "C": {"w": "amount", "pos": "n.", "en": "how much there is of something", "zh": "數量；總量", "word": "amount"}, "D": {"w": "sketch", "pos": "n.", "en": "a quick, simple drawing", "zh": "素描；草圖", "word": "sketch"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Before leaving the excavation site, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> brushed the floor smooth so that any faint ______ of recent footsteps would be visible when they returned the next morning.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Before leaving the excavation site, the archaeologists brushed the floor smooth so that any faint ______ of recent footsteps would be visible when they returned the next morning.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。離開挖掘現場前，考古學家把地面刷平，這樣隔天早上回來時，任何新近腳步留下的微弱 ______ 都能看得出來。", "opts": {"A": "quantity", "B": "evidence", "C": "outline", "D": "blemish"}, "optsZh": {"A": "quantity（數量）", "B": "evidence（證據；跡象）", "C": "outline（輪廓；大綱）", "D": "blemish（瑕疵；污點）"}, "answer": "B", "expl": "Evidence means a sign showing that something happened.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "an amount or number of something", "zh": "數量", "word": "quantity"}, "B": {"pos": "n.", "en": "facts or signs that show something is true", "zh": "證據；跡象", "word": "evidence"}, "C": {"pos": "n.", "en": "a line showing the shape of something, or a short summary of main points", "zh": "輪廓；大綱", "word": "outline"}, "D": {"pos": "n.", "en": "a small mark or flaw that spoils how something looks", "zh": "瑕疵；污點", "word": "blemish"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The detective found only a slight ______ of soil on the windowsill, but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> analysis showed that it matched the clay from the riverbank.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The detective found only a slight ______ of soil on the windowsill, but laboratory analysis showed that it matched the clay from the riverbank.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。偵探在窗台上只發現了些微的泥土 ______，但實驗室分析顯示它與河岸的黏土相符。", "opts": {"A": "mark", "B": "estimate", "C": "sketch", "D": "amount"}, "optsZh": {"A": "mark（痕跡；記號）", "B": "estimate（估計）", "C": "sketch（草圖；素描）", "D": "amount（數量；總額）"}, "answer": "A", "expl": "Mark means a visible sign or indication.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a spot, sign, or trace left on something", "zh": "痕跡；記號", "word": "mark"}, "B": {"pos": "v.", "en": "to guess an amount or value based on information", "zh": "估計", "word": "estimate"}, "C": {"pos": "n.", "en": "a quick, simple drawing", "zh": "素描；草圖", "word": "sketch"}, "D": {"pos": "n.", "en": "how much there is of something", "zh": "數量；總量", "word": "amount"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Because migrating animals rarely remain in one place, field biologists often rely on indirect ______, such as hair, tracks, or partially eaten plants, to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether a species has passed through an area.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because migrating animals rarely remain in one place, field biologists often rely on indirect ______, such as hair, tracks, or partially eaten plants, to determine whether a species has passed through an area.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。由於遷徙動物很少停留在同一個地方，野外生物學家常仰賴間接的 ______，例如毛髮、足跡或被吃了一部分的植物，來判斷某個物種是否曾經過某一地區。", "opts": {"A": "quantities", "B": "signs", "C": "drawings", "D": "summaries"}, "optsZh": {"A": "quantities（數量）", "B": "signs（跡象；徵兆）", "C": "drawings（圖畫；素描）", "D": "summaries（摘要）"}, "answer": "B", "expl": "Signs are indications or evidence.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "amounts of something", "zh": "數量（複數）", "word": "quantities"}, "B": {"pos": "n.", "en": "things that show something exists or is happening", "zh": "跡象；徵兆", "word": "signs"}, "C": {"pos": "n.", "en": "pictures made with a pencil or pen", "zh": "素描；圖畫", "word": "drawings"}, "D": {"pos": "n.", "en": "short statements of the main points", "zh": "摘要（複數）", "word": "summaries"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The storm erased almost every ______ of the temporary camp; by dawn, even the wheel tracks that had crossed the sand were no longer visible.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The storm erased almost every ______ of the temporary camp; by dawn, even the wheel tracks that had crossed the sand were no longer visible.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。暴風雨幾乎抹去了臨時營地的每一絲 ______；到了黎明，就連橫越沙地的車輪痕跡都已看不見了。", "opts": {"A": "defect", "B": "portion", "C": "diagram", "D": "indication"}, "optsZh": {"A": "defect（缺陷；瑕疵）", "B": "portion（部分）", "C": "diagram（圖表；示意圖）", "D": "indication（跡象；指示）"}, "answer": "D", "expl": "Indication means evidence or a sign.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a fault or flaw in something", "zh": "缺陷；瑕疵", "word": "defect"}, "B": {"pos": "n.", "en": "a part of something larger", "zh": "部分", "word": "portion"}, "C": {"pos": "n.", "en": "a simple drawing that shows how something works or is arranged", "zh": "圖解；示意圖", "word": "diagram"}, "D": {"pos": "n.", "en": "a sign that shows something", "zh": "跡象；指示", "word": "indication"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: trace as evidence left behind.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Conservators examined the old canvas for any ______ of the artist&#x27;s first design, hoping that faint pencil lines beneath the paint might reveal how the composition had changed.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Conservators examined the old canvas for any ______ of the artist's first design, hoping that faint pencil lines beneath the paint might reveal how the composition had changed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。修復師仔細檢查這幅舊畫布，尋找藝術家最初構圖的任何 ______，希望顏料底下微弱的鉛筆線條能揭示構圖是如何改變的。", "opts": {"A": "amount", "B": "illustration", "C": "remnant", "D": "blemish"}, "optsZh": {"A": "amount（數量；總額）", "B": "illustration（插圖；例證）", "C": "remnant（殘餘；遺跡）", "D": "blemish（瑕疵；污點）"}, "answer": "C", "expl": "A remnant is a remaining trace or sign.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "how much there is of something", "zh": "數量；總量", "word": "amount"}, "B": {"pos": "n.", "en": "a picture or example that explains something", "zh": "插圖；例證", "word": "illustration"}, "C": {"pos": "n.", "en": "a small part that remains of something", "zh": "殘餘；遺跡", "word": "remnant"}, "D": {"pos": "n.", "en": "a small mark or flaw that spoils how something looks", "zh": "瑕疵；污點", "word": "blemish"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "Many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"very old; from long ago\" data-zh=\"古代的；古老的\">ancient<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> of people&#x27;s heads are missing their noses. This is because the nose is the most _______ part of a sculpture of a person&#x27;s head. It is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=delicate\" target=\"_blank\" rel=\"noopener\" data-w=\"delicate\" data-pos=\"adj.\" data-en=\"easily damaged or broken; fine and fragile\" data-zh=\"脆弱的；精緻的\">delicate<\/a> and sticks out from the rest of the sculpture, making it especially easy to break.", "bodyPlain": "Many ancient sculptures of people's heads are missing their noses. This is because the nose is the most _______ part of a sculpture of a person's head. It is delicate and sticks out from the rest of the sculpture, making it especially easy to break.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "許多古代人頭雕像都缺了鼻子。這是因為鼻子是人頭雕像中最 _______ 的部位。鼻子很纖細，又從雕像其他部分突出來，因此特別容易斷裂。", "opts": {"A": "recognizable", "B": "fragile", "C": "common", "D": "sophisticated"}, "optsZh": {"A": "recognizable（可辨認的）", "B": "fragile（易碎的；脆弱的）", "C": "common（常見的；普通的）", "D": "sophisticated（精密的；複雜的）"}, "answer": "B", "expl": "The nose is 'delicate' and 'especially easy to break,' so it is the most 'fragile' part.", "explZh": "鼻子「脆弱」且「特別容易斷裂」，所以是雕像最「fragile」（易碎的）部分。", "defs": {"A": {"pos": "adj.", "en": "easy to identify or know", "zh": "可辨認的；認得出的", "word": "recognizable"}, "B": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "C": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "D": {"pos": "adj.", "en": "complex and advanced", "zh": "精密的；複雜的", "word": "sophisticated"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The thin handle of the ceremonial cup is the most ______ part of the artifact: it projects from the body of the vessel and has already cracked in two places.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The thin handle of the ceremonial cup is the most ______ part of the artifact: it projects from the body of the vessel and has already cracked in two places.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這只禮器杯的細把手是整件文物最 ______ 的部分：它從器身突出，而且已經有兩處裂開了。", "opts": {"A": "sophisticated", "B": "fragile", "C": "ornate", "D": "ordinary"}, "optsZh": {"A": "sophisticated（精密的；複雜的）", "B": "fragile（易碎的；脆弱的）", "C": "ornate（華麗的；裝飾繁複的）", "D": "ordinary（普通的；平常的）"}, "answer": "B", "expl": "Fragile means easily broken.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "complex and advanced", "zh": "精密的；複雜的", "word": "sophisticated"}, "B": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "C": {"pos": "adj.", "en": "having a lot of complicated decoration", "zh": "華麗的；裝飾繁複的", "word": "ornate"}, "D": {"pos": "adj.", "en": "normal; not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Museum staff packed the glass negatives in separate sleeves because the plates were unusually ______ and could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fracture<\/a> if even slight pressure were applied.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Museum staff packed the glass negatives in separate sleeves because the plates were unusually ______ and could fracture if even slight pressure were applied.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。博物館人員把玻璃底片分別裝進獨立的套子裡，因為這些底片異常 ______，即使受到輕微的壓力也可能碎裂。", "opts": {"A": "modern", "B": "common", "C": "delicate", "D": "recognizable"}, "optsZh": {"A": "modern（現代的）", "B": "common（常見的；普通的）", "C": "delicate（脆弱的；精緻的）", "D": "recognizable（可辨認的）"}, "answer": "C", "expl": "Delicate means easily damaged.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "of the present time; recent", "zh": "現代的", "word": "modern"}, "B": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "C": {"pos": "adj.", "en": "easily damaged or broken; fine and fragile", "zh": "脆弱的；精緻的", "word": "delicate"}, "D": {"pos": "adj.", "en": "easy to identify or know", "zh": "可辨認的；認得出的", "word": "recognizable"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Although the carved figure is made of stone, the fingers are ______ because they are narrow, unsupported, and exposed to accidental contact from visitors.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Although the carved figure is made of stone, the fingers are ______ because they are narrow, unsupported, and exposed to accidental contact from visitors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。雖然這座雕像是石頭做的，但它的手指很 ______，因為手指細窄、缺乏支撐，又容易被參觀者不小心碰到。", "opts": {"A": "breakable", "B": "ancient", "C": "familiar", "D": "valuable"}, "optsZh": {"A": "breakable（易碎的）", "B": "ancient（古代的）", "C": "familiar（熟悉的）", "D": "valuable（有價值的）"}, "answer": "A", "expl": "Breakable means easily broken.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "easily broken", "zh": "易碎的", "word": "breakable"}, "B": {"pos": "adj.", "en": "very old; from long ago", "zh": "古代的；古老的", "word": "ancient"}, "C": {"pos": "adj.", "en": "well known to you; seen or heard before", "zh": "熟悉的", "word": "familiar"}, "D": {"pos": "adj.", "en": "worth a lot of money or very useful", "zh": "有價值的；寶貴的", "word": "valuable"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The old <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a>&#x27;s binding remained sturdy, but its pages had become ______ after decades in a dry storeroom, so librarians turned them only with special tools.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The old manuscript's binding remained sturdy, but its pages had become ______ after decades in a dry storeroom, so librarians turned them only with special tools.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這份古老手稿的裝訂依然牢固，但在乾燥的倉庫裡存放數十年後，書頁已變得 ______，所以圖書館員只用特殊工具翻頁。", "opts": {"A": "legible", "B": "portable", "C": "brittle", "D": "decorative"}, "optsZh": {"A": "legible（字跡清楚的；易讀的）", "B": "portable（可攜帶的）", "C": "brittle（易碎的；脆的）", "D": "decorative（裝飾性的）"}, "answer": "C", "expl": "Brittle means hard but easily broken.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "clear enough to be read", "zh": "（字跡）清楚可讀的", "word": "legible"}, "B": {"pos": "adj.", "en": "easy to carry or move", "zh": "可攜帶的；輕便的", "word": "portable"}, "C": {"pos": "adj.", "en": "hard but easily broken or cracked", "zh": "脆的；易碎的", "word": "brittle"}, "D": {"pos": "adj.", "en": "made to look attractive; used as decoration", "zh": "裝飾性的", "word": "decorative"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: fragile or easily broken.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The antenna is the rover&#x27;s most ______ component; unlike the wheels and body panels, it protrudes from the frame and can be bent during transport.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The antenna is the rover's most ______ component; unlike the wheels and body panels, it protrudes from the frame and can be bent during transport.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。天線是探測車上最 ______ 的零件；與輪子和車身面板不同，它從車架突出，在運送途中可能被折彎。", "opts": {"A": "common", "B": "identical", "C": "complex", "D": "vulnerable"}, "optsZh": {"A": "common（常見的；普通的）", "B": "identical（完全相同的）", "C": "complex（複雜的）", "D": "vulnerable（易受傷害的；脆弱的）"}, "answer": "D", "expl": "Vulnerable means easily harmed or damaged.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "B": {"pos": "adj.", "en": "exactly the same", "zh": "完全相同的", "word": "identical"}, "C": {"pos": "adj.", "en": "having many parts; complicated", "zh": "複雜的", "word": "complex"}, "D": {"pos": "adj.", "en": "easily hurt, damaged, or attacked", "zh": "易受傷害的；脆弱的", "word": "vulnerable"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "K.D. Leka and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> found that the Sun&#x27;s corona provides an advance <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=indication\" target=\"_blank\" rel=\"noopener\" data-w=\"indication\" data-pos=\"n.\" data-en=\"a sign that shows something\" data-zh=\"跡象；指示\">indication<\/a> of solar flares--intense eruptions of electromagnetic radiation that emanate from active regions in the Sun&#x27;s photosphere and can interfere with telecommunications on Earth. Preceding a flare, the corona <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporarily\" target=\"_blank\" rel=\"noopener\" data-w=\"temporarily\" data-pos=\"adv.\" data-en=\"for a limited time only\" data-zh=\"暫時地\">temporarily<\/a> exhibits increased brightness above the region where the flare is _______.", "bodyPlain": "K.D. Leka and colleagues found that the Sun's corona provides an advance indication of solar flares--intense eruptions of electromagnetic radiation that emanate from active regions in the Sun's photosphere and can interfere with telecommunications on Earth. Preceding a flare, the corona temporarily exhibits increased brightness above the region where the flare is _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "K.D.Leka 與同事發現，太陽的日冕能提前顯示太陽閃焰的徵兆——太陽閃焰是從太陽光球層活躍區域爆發出的強烈電磁輻射，可能干擾地球上的電信通訊。在閃焰發生之前，日冕在閃焰 _______ 的區域上方會暫時變得更亮。", "opts": {"A": "antecedent", "B": "impending", "C": "innocuous", "D": "perpetual"}, "optsZh": {"A": "antecedent（先前的事物；前例）", "B": "impending（即將發生的；逼近的）", "C": "innocuous（無害的；無傷大雅的）", "D": "perpetual（永久的；持續不斷的）"}, "answer": "B", "expl": "The corona brightens before a flare, above the region where the flare is about to happen, so the flare is 'impending.'", "explZh": "日冕在閃焰發生「之前」變亮，位置在即將爆發閃焰的區域上方，所以是「impending」（即將發生的）。", "defs": {"A": {"pos": "n.", "en": "something that existed or happened before and led to something else", "zh": "前身；先例", "word": "antecedent"}, "B": {"pos": "adj.", "en": "about to happen, often something unpleasant", "zh": "即將發生的", "word": "impending"}, "C": {"pos": "adj.", "en": "not harmful or offensive", "zh": "無害的；無傷大雅的", "word": "innocuous"}, "D": {"pos": "adj.", "en": "continuing forever or without stopping", "zh": "永久的；不斷的", "word": "perpetual"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The monitoring system detects a brief increase in pressure in the hours before an eruption, giving researchers an early signal that an eruption is ______.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The monitoring system detects a brief increase in pressure in the hours before an eruption, giving researchers an early signal that an eruption is ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。監測系統在火山噴發前的幾個小時內偵測到壓力短暫升高，讓研究人員得到噴發 ______ 的早期訊號。", "opts": {"A": "obsolete", "B": "impending", "C": "ordinary", "D": "distant"}, "optsZh": {"A": "obsolete（過時的；淘汰的）", "B": "impending（即將發生的；逼近的）", "C": "ordinary（普通的；平常的）", "D": "distant（遙遠的）"}, "answer": "B", "expl": "Impending means about to happen.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "no longer used because something newer exists", "zh": "過時的；淘汰的", "word": "obsolete"}, "B": {"pos": "adj.", "en": "about to happen, often something unpleasant", "zh": "即將發生的", "word": "impending"}, "C": {"pos": "adj.", "en": "normal; not special", "zh": "普通的；平常的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "far away in space or time", "zh": "遙遠的", "word": "distant"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Satellite images showed rapidly thickening clouds above the coast, a warning that the tropical storm was ______ and that evacuation orders might soon be necessary.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Satellite images showed rapidly thickening clouds above the coast, a warning that the tropical storm was ______ and that evacuation orders might soon be necessary.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。衛星影像顯示海岸上空的雲層迅速增厚，這是熱帶風暴 ______ 的警訊，也意味著可能很快就需要發布撤離命令。", "opts": {"A": "perpetual", "B": "completed", "C": "approaching", "D": "innocuous"}, "optsZh": {"A": "perpetual（永久的；持續不斷的）", "B": "completed（已完成的）", "C": "approaching（即將到來的；逼近的）", "D": "innocuous（無害的；無傷大雅的）"}, "answer": "C", "expl": "Approaching means coming nearer.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "continuing forever or without stopping", "zh": "永久的；不斷的", "word": "perpetual"}, "B": {"pos": "v.", "en": "finished", "zh": "完成", "word": "completed"}, "C": {"pos": "adj.", "en": "coming nearer in time or space", "zh": "即將到來的；接近的", "word": "approaching"}, "D": {"pos": "adj.", "en": "not harmful or offensive", "zh": "無害的；無傷大雅的", "word": "innocuous"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The sudden drop in air pressure suggested that a severe thunderstorm was ______, so the airport <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporarily\" target=\"_blank\" rel=\"noopener\" data-w=\"temporarily\" data-pos=\"adv.\" data-en=\"for a limited time only\" data-zh=\"暫時地\">temporarily<\/a> halted takeoffs and moved ground crews indoors.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The sudden drop in air pressure suggested that a severe thunderstorm was ______, so the airport temporarily halted takeoffs and moved ground crews indoors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。氣壓驟降顯示一場強烈雷雨 ______，因此機場暫停起飛，並讓地勤人員移到室內。", "opts": {"A": "past", "B": "harmless", "C": "constant", "D": "imminent"}, "optsZh": {"A": "past（過去的）", "B": "harmless（無害的）", "C": "constant（持續不斷的；恆定的）", "D": "imminent（即將發生的；迫在眉睫的）"}, "answer": "D", "expl": "Imminent means about to occur.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having happened before now", "zh": "過去的", "word": "past"}, "B": {"pos": "adj.", "en": "not able to cause harm", "zh": "無害的", "word": "harmless"}, "C": {"pos": "adj.", "en": "happening all the time or staying the same", "zh": "持續的；不變的", "word": "constant"}, "D": {"pos": "adj.", "en": "about to happen very soon", "zh": "即將發生的；迫在眉睫的", "word": "imminent"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. When the volcano began releasing larger amounts of sulfur dioxide, geologists interpreted the change as evidence that a new eruption was ______ rather than merely possible in the distant future.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. When the volcano began releasing larger amounts of sulfur dioxide, geologists interpreted the change as evidence that a new eruption was ______ rather than merely possible in the distant future.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。當火山開始釋放更多二氧化硫時，地質學家將這項變化解讀為新一次噴發 ______ 的證據，而不只是遙遠未來的一種可能。", "opts": {"A": "permanent", "B": "minor", "C": "historic", "D": "forthcoming"}, "optsZh": {"A": "permanent（永久的）", "B": "minor（次要的；較小的）", "C": "historic（歷史性的；有歷史意義的）", "D": "forthcoming（即將到來的）"}, "answer": "D", "expl": "Forthcoming means coming soon.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}, "B": {"pos": "adj.", "en": "small and not very important", "zh": "次要的；輕微的", "word": "minor"}, "C": {"pos": "adj.", "en": "important in history", "zh": "歷史性的；有歷史意義的", "word": "historic"}, "D": {"pos": "adj.", "en": "about to happen or appear soon", "zh": "即將到來的", "word": "forthcoming"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: impending solar flare.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The electrical activity in the region above the Sun&#x27;s surface indicated that a flare was ______, allowing technicians to prepare satellites for possible interference.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The electrical activity in the region above the Sun's surface indicated that a flare was ______, allowing technicians to prepare satellites for possible interference.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。太陽表面上方區域的電活動顯示閃焰 ______，讓技術人員得以讓衛星做好應對可能干擾的準備。", "opts": {"A": "anticipated", "B": "innocent", "C": "irrelevant", "D": "dormant"}, "optsZh": {"A": "anticipated（預期的；期待中的）", "B": "innocent（無辜的；天真的）", "C": "irrelevant（無關的）", "D": "dormant（休眠的；潛伏的）"}, "answer": "A", "expl": "Anticipated means expected to happen.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "expected or predicted that something would happen", "zh": "預期；預料", "word": "anticipated"}, "B": {"pos": "adj.", "en": "not guilty; not meant to cause harm", "zh": "無辜的；無惡意的", "word": "innocent"}, "C": {"pos": "adj.", "en": "not connected to or important for the subject", "zh": "不相關的", "word": "irrelevant"}, "D": {"pos": "adj.", "en": "not active now but able to become active later", "zh": "休眠的；蟄伏的", "word": "dormant"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "To demonstrate that the integrity of underground metal pipes can be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assess\" target=\"_blank\" rel=\"noopener\" data-w=\"assess\" data-pos=\"v.\" data-en=\"to judge the quality or value of something\" data-zh=\"評估；評價\">assessed<\/a> without unearthing the pipes, engineer Aroba Saleem and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tendency\" target=\"_blank\" rel=\"noopener\" data-w=\"tendency\" data-pos=\"n.\" data-en=\"a likelihood to behave or happen in a particular way\" data-zh=\"傾向\">tendency<\/a> of some metals&#x27; internal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=magnetic\" target=\"_blank\" rel=\"noopener\" data-w=\"magnetic\" data-pos=\"adj.\" data-en=\"relating to a magnet or magnetism\" data-zh=\"磁的\">magnetic<\/a> fields to alter under stress: the team showed that such alterations can be measured from a distance and can reveal concentrations of stress in the pipes.", "bodyPlain": "To demonstrate that the integrity of underground metal pipes can be assessed without unearthing the pipes, engineer Aroba Saleem and colleagues _______ the tendency of some metals' internal magnetic fields to alter under stress: the team showed that such alterations can be measured from a distance and can reveal concentrations of stress in the pipes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "為了證明不必挖出地下金屬管線也能評估其完整性，工程師 Aroba Saleem 與同事 _______ 某些金屬內部磁場在受力時會改變的特性：該團隊證明，這種改變可以從遠處測得，並能揭示管線中應力集中的位置。", "opts": {"A": "hypothesized", "B": "discounted", "C": "redefined", "D": "exploited"}, "optsZh": {"A": "hypothesized（假設；推測）", "B": "discounted（不予重視；忽視）", "C": "redefined（重新定義）", "D": "exploited（利用；開發）"}, "answer": "D", "expl": "The team made productive use of the metals' tendency to change magnetically under stress to measure pipe stress, so they 'exploited' it.", "explZh": "研究團隊善用金屬內部磁場在受力時改變的特性來檢測管線應力，所以是「exploited」（利用）。", "defs": {"A": {"pos": "v.", "en": "suggested an idea as a possible explanation to be tested", "zh": "假設；推測", "word": "hypothesized"}, "B": {"pos": "v.", "en": "decided that something is not important or true", "zh": "不予考慮；低估", "word": "discounted"}, "C": {"pos": "v.", "en": "changed the meaning or nature of something", "zh": "重新定義", "word": "redefined"}, "D": {"pos": "v.", "en": "used something fully to gain an advantage", "zh": "利用；開發", "word": "exploited"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. To test whether bridge cables can be inspected without dismantling them, engineers ______ the fact that tiny changes in vibration patterns reveal internal weaknesses.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. To test whether bridge cables can be inspected without dismantling them, engineers ______ the fact that tiny changes in vibration patterns reveal internal weaknesses.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。為了測試是否能在不拆卸橋梁纜索的情況下進行檢查，工程師 ______ 振動模式的微小變化能揭示內部弱點這一事實。", "opts": {"A": "exploited", "B": "predicted", "C": "ignored", "D": "misstated"}, "optsZh": {"A": "exploited（利用；開發）", "B": "predicted（預測）", "C": "ignored（忽視）", "D": "misstated（誤述；說錯）"}, "answer": "A", "expl": "Exploited means made practical use of.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "used something fully to gain an advantage", "zh": "利用；開發", "word": "exploited"}, "B": {"pos": "v.", "en": "said what would happen in the future", "zh": "預測", "word": "predicted"}, "C": {"pos": "v.", "en": "paid no attention to something", "zh": "忽視", "word": "ignored"}, "D": {"pos": "v.", "en": "stated something incorrectly", "zh": "錯誤陳述", "word": "misstated"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medical\" target=\"_blank\" rel=\"noopener\" data-w=\"medical\" data-pos=\"adj.\" data-en=\"relating to medicine or health care\" data-zh=\"醫學的；醫療的\">medical<\/a> team ______ the fluorescent properties of the dye, using the dye to make otherwise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invisible\" target=\"_blank\" rel=\"noopener\" data-w=\"invisible\" data-pos=\"adj.\" data-en=\"impossible to see\" data-zh=\"看不見的；無形的\">invisible<\/a> tumors easier to locate during surgery.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The medical team ______ the fluorescent properties of the dye, using the dye to make otherwise invisible tumors easier to locate during surgery.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。醫療團隊 ______ 這種染劑的螢光特性，用它讓原本看不見的腫瘤在手術中更容易定位。", "opts": {"A": "dismissed", "B"
