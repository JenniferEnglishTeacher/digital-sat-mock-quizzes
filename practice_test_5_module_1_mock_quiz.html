re more accurate than the clerk.", "C": "The clerk intentionally creates errors.", "D": "The clerk's carefulness is valuable despite being inconvenient."}, "optsZh": {"A": "這家公司因過度謹慎而失敗。", "B": "同事們比這名職員更精確。", "C": "這名職員故意製造錯誤。", "D": "這名職員的細心雖然造成不便，卻很有價值。"}, "answer": "D", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Reading Detail: Maya zero may come from Olmec civilization.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dismissed\" target=\"_blank\" rel=\"noopener\" data-w=\"dismissed\" data-pos=\"v.\" data-en=\"decided something was not important or worth considering\" data-zh=\"不予理會；否定\">dismissed<\/a>.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段文章指出，一位村莊領袖在做決定前會聆聽每一位發言者的意見，即使答案似乎顯而易見。敘事者暗示，這個習慣讓會議進行得較慢，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader makes decisions without hearing others.", "B": "The leader dislikes public meetings.", "C": "The leader is unable to reach conclusions.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人不聽取他人意見就做決定。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人無法做出結論。", "D": "這位領導人重視兼容並蓄的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Reading Detail: Maya zero may come from Olmec civilization.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She combines intellectual openness with rigorous standards.", "C": "She publishes claims before testing them.", "D": "She avoids working with students."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她兼具開放的思想與嚴謹的標準。", "C": "她在驗證之前就發表主張。", "D": "她避免與學生合作。"}, "answer": "B", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "&quot;The Bet&quot; is an 1889 short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> by Anton Chekhov. In the story, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=banker\" target=\"_blank\" rel=\"noopener\" data-w=\"banker\" data-pos=\"n.\" data-en=\"a person who owns or runs a bank\" data-zh=\"銀行家\">banker<\/a> is described as being very <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=upset\" target=\"_blank\" rel=\"noopener\" data-w=\"upset\" data-pos=\"adj.\" data-en=\"unhappy or worried\" data-zh=\"難過的；心煩的\">upset<\/a> about something: _______", "bodyPlain": "\"The Bet\" is an 1889 short story by Anton Chekhov. In the story, a banker is described as being very upset about something: _______", "stem": "Which quotation from \"The Bet\" most effectively illustrates the claim?", "stemZh": "哪一段出自〈The Bet〉的引文最能有效說明這項主張？", "bodyZh": "〈The Bet〉（打賭）是 Anton Chekhov 於 1889 年發表的短篇小說。在故事中，一位銀行家被描述為對某件事非常苦惱：_______", "opts": {"A": "\"Then the banker cautiously broke the seals off the door and put the key in the keyhole.\"", "B": "\"It struck three o'clock, the banker listened; everyone was asleep in the house and nothing could be heard outside but the rustling of the chilled trees.\"", "C": "\"The banker, spoilt and frivolous, with millions beyond his reckoning, was delighted at the bet.\"", "D": "\"When [the banker] got home he lay on his bed, but his tears and emotion kept him for hours from sleeping.\""}, "optsZh": {"A": "「接著銀行家小心翼翼地撕下門上的封條，把鑰匙插進鑰匙孔。」", "B": "「時鐘敲了三下，銀行家側耳傾聽；屋裡的人都睡了，外面除了冷颼颼的樹木沙沙作響外，什麼也聽不見。」", "C": "「那位銀行家被寵壞又輕浮，擁有數不清的財富，對這場打賭感到十分高興。」", "D": "「〔銀行家〕回到家後躺在床上，但他的淚水與激動讓他好幾個小時都無法入睡。」"}, "answer": "D", "expl": "The banker's 'tears and emotion' keep him awake for hours, showing he is very upset.", "explZh": "銀行家的「淚水與激動情緒」讓他好幾個小時無法入睡，顯示他非常難過。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這項主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫且起伏不定的執政紀錄更重要。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區占蔬菜種植者的 64%，但在北部和中部地區占穀物種植者的比例不到 35%。哪一項敘述最能運用圖表來支持關於區域作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "The graph contains information about three regions.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "有些農民種植蔬菜，而其他農民種植穀物。", "B": "南部地區包含在這項調查中。", "C": "這張圖表包含三個地區的資訊。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵從不會比其母恆星多。哪一項發現最直接削弱這項主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有一顆岩石行星擁有稀薄的大氣層。", "B": "有些恆星含有氫和氦。", "C": "研究發現有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "The tradition is studied by scholars in several countries.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "B": "這項傳統受到數個國家學者的研究。", "C": "有幾首民謠納入了地方歷史事件，以及在不同族群持續接觸後才出現的融合音樂形式。", "D": "許多表演者向親戚學習歌曲。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence: quotation showing distress.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The table includes more than one year."}, "optsZh": {"A": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這項計畫在一個社區中進行。", "D": "這張表格涵蓋不只一年。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "Partial List of Candidate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">Species<\/a> for De-extinction<br>Huia (Heteralocha acutirostris): became extinct 1907.<br>Caribbean monk seal (Monachus tropicalis): became extinct 1952.<br>Passenger pigeon (Ectopistes migratorius): became extinct 1914.<br>Saber-toothed cat (Smilodon): became extinct 11,000 years before present.<br>Woolly mammoth (Mammuthus primigenius): became extinct 6,400 years before present.<br><br>The passage of time is among the many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obstacle\" target=\"_blank\" rel=\"noopener\" data-w=\"obstacle\" data-pos=\"n.\" data-en=\"something that blocks the way\" data-zh=\"障礙\">obstacles<\/a> faced by scientists who are pursuing de-extinction efforts--that is, efforts to use breeding or a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mixture\" target=\"_blank\" rel=\"noopener\" data-w=\"mixture\" data-pos=\"n.\" data-en=\"a combination of different things\" data-zh=\"混合物\">mixture<\/a> of cloning and genetic engineering to bring back extinct species. Specifically, researchers are concerned that the longer a species has been extinct, the less likely it is that a suitable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=habitat\" target=\"_blank\" rel=\"noopener\" data-w=\"habitat\" data-pos=\"n.\" data-en=\"the natural home of an animal or plant\" data-zh=\"棲息地\">habitat<\/a> still exists for that species. Among candidate species for de-extinction, this problem would be especially concerning for the _______", "bodyPlain": "Partial List of Candidate Species for De-extinction\nHuia (Heteralocha acutirostris): became extinct 1907.\nCaribbean monk seal (Monachus tropicalis): became extinct 1952.\nPassenger pigeon (Ectopistes migratorius): became extinct 1914.\nSaber-toothed cat (Smilodon): became extinct 11,000 years before present.\nWoolly mammoth (Mammuthus primigenius): became extinct 6,400 years before present.\n\nThe passage of time is among the many obstacles faced by scientists who are pursuing de-extinction efforts--that is, efforts to use breeding or a mixture of cloning and genetic engineering to bring back extinct species. Specifically, researchers are concerned that the longer a species has been extinct, the less likely it is that a suitable habitat still exists for that species. Among candidate species for de-extinction, this problem would be especially concerning for the _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據完成這個敘述？", "bodyZh": "復育滅絕物種（去滅絕）候選物種部分清單\n垂耳鴉（Heteralocha acutirostris）：1907 年滅絕。\n加勒比僧海豹（Monachus tropicalis）：1952 年滅絕。\n旅鴿（Ectopistes migratorius）：1914 年滅絕。\n劍齒虎（Smilodon）：距今 11,000 年前滅絕。\n長毛象（Mammuthus primigenius）：距今 6,400 年前滅絕。\n時間的流逝是從事「去滅絕」工作的科學家所面臨的眾多障礙之一——所謂去滅絕，就是利用育種，或結合複製與基因工程，讓已滅絕的物種重新復活。具體來說，研究人員擔心，一個物種滅絕的時間越久，就越不可能仍存在適合該物種的棲地。在去滅絕的候選物種中，這個問題對 _______ 而言尤其令人擔憂。", "opts": {"A": "passenger pigeon (Ectopistes migratorius), which became extinct only a few years after the huia (Heteralocha acutirostris).", "B": "saber-toothed cat (Smilodon), which became extinct 11,000 years ago.", "C": "woolly mammoth (Mammuthus primigenius), which became extinct several thousand years before the saber-toothed cat (Smilodon).", "D": "Caribbean monk seal (Monachus tropicalis), which became extinct in 1952."}, "optsZh": {"A": "旅鴿（Ectopistes migratorius），在垂耳鴉（Heteralocha acutirostris）滅絕後僅數年也隨之滅絕。", "B": "劍齒虎（Smilodon），於 11,000 年前滅絕。", "C": "長毛象（Mammuthus primigenius），比劍齒虎（Smilodon）早數千年滅絕。", "D": "加勒比僧海豹（Monachus tropicalis），於 1952 年滅絕。"}, "answer": "B", "expl": "The concern is greatest for the species extinct the longest; according to the table, the saber-toothed cat became extinct 11,000 years ago, the longest of all.", "explZh": "問題在於滅絕越久越難找到合適棲地；表格中劍齒虎在 11,000 年前滅絕，是最久的。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這項主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫且起伏不定的執政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區占蔬菜種植者的 64%，但在北部和中部地區占穀物種植者的比例不到 35%。哪一項敘述最能運用圖表來支持關於區域作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "有些農民種植蔬菜，而其他農民種植穀物。", "B": "這張圖表包含三個地區的資訊。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "南部地區包含在這項調查中。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵從不會比其母恆星多。哪一項發現最直接削弱這項主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "Some stars contain hydrogen and helium.", "C": "The method used to study stars requires a telescope.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究發現有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "有些恆星含有氫和氦。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有一顆岩石行星擁有稀薄的大氣層。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Many performers learned songs from relatives.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "這項傳統受到數個國家學者的研究。", "B": "許多表演者向親戚學習歌曲。", "C": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "D": "有幾首民謠納入了地方歷史事件，以及在不同族群持續接觸後才出現的融合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這張表格涵蓋不只一年。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "&quot;The Yellow Wallpaper&quot; is an 1892 short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> by Charlotte Perkins Gilman. In the story, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">expresses<\/a> mixed feelings about her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a>: _______", "bodyPlain": "\"The Yellow Wallpaper\" is an 1892 short story by Charlotte Perkins Gilman. In the story, the narrator expresses mixed feelings about her surroundings: _______", "stem": "Which quotation from \"The Yellow Wallpaper\" most effectively illustrates the claim?", "stemZh": "哪一段出自〈The Yellow Wallpaper〉的引文最能有效說明這項主張？", "bodyZh": "〈The Yellow Wallpaper〉（黃色壁紙）是 Charlotte Perkins Gilman 於 1892 年發表的短篇小說。在故事中，敘事者對她周遭的環境表達了複雜的感受：_______", "opts": {"A": "\"This wallpaper has a kind of sub-pattern in a different shade, a particularly irritating one, for you can only see it in certain lights, and not clearly then.\"", "B": "\"By moonlight--the moon shines in all night when there is a moon--I wouldn't know it was the same paper.\"", "C": "\"I'm really getting quite fond of the big room, all but that horrid [wall]paper.\"", "D": "\"The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.\""}, "optsZh": {"A": "「這壁紙有一種顏色不同的底層圖案，特別惱人，因為只有在某些光線下才看得到，而且即使那時也看不清楚。」", "B": "「在月光下——有月亮的時候，月光整夜照進來——我根本認不出那是同一張壁紙。」", "C": "「我其實越來越喜歡這間大房間了，只除了那張可怕的〔壁〕紙。」", "D": "「那顏色令人反感，幾乎令人作嘔；是一種悶燒般、骯髒的黃色，被緩慢移動的陽光奇怪地曬褪了色。」"}, "answer": "C", "expl": "The narrator is 'quite fond of the big room' yet dislikes the 'horrid' wallpaper—mixed feelings about her surroundings.", "explZh": "敘述者「相當喜歡這個大房間」，卻討厭那「可怕的」壁紙，正呈現對環境的矛盾情感。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這項主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫且起伏不定的執政紀錄更重要。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區占蔬菜種植者的 64%，但在北部和中部地區占穀物種植者的比例不到 35%。哪一項敘述最能運用圖表來支持關於區域作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種植蔬菜，而其他農民種植穀物。", "C": "南部地區包含在這項調查中。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵從不會比其母恆星多。哪一項發現最直接削弱這項主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "研究發現有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "有一顆岩石行星擁有稀薄的大氣層。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "B": "許多表演者向親戚學習歌曲。", "C": "這項傳統受到數個國家學者的研究。", "D": "有幾首民謠納入了地方歷史事件，以及在不同族群持續接觸後才出現的融合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據；跡象\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格涵蓋不只一年。", "B": "這項計畫在一個社區中進行。", "C": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "Ratio of Manganese to Calcium in Samples from Alboran Sea and Mauritanian Coast<br>The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of the coral Lophelia pertusa declined <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> around 9,000 years ago in the Alboran Sea and around 11,000 years ago near the Mauritanian coast. Using the ratio of manganese to calcium, which inversely correlates with ocean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=oxygenation\" target=\"_blank\" rel=\"noopener\" data-w=\"oxygenation\" data-pos=\"n.\" data-en=\"the amount of oxygen present\" data-zh=\"含氧量；氧合\">oxygenation<\/a> levels, marine scientist Rodrigo da Costa Portilho-Ramos and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> evaluated whether oxygenation played a role in the declines of L. pertusa. The researchers concluded that oxygenation may have been important in the Alboran Sea but not near the Mauritanian coast, since _______", "bodyPlain": "Ratio of Manganese to Calcium in Samples from Alboran Sea and Mauritanian Coast\nThe population of the coral Lophelia pertusa declined significantly around 9,000 years ago in the Alboran Sea and around 11,000 years ago near the Mauritanian coast. Using the ratio of manganese to calcium, which inversely correlates with ocean oxygenation levels, marine scientist Rodrigo da Costa Portilho-Ramos and colleagues evaluated whether oxygenation played a role in the declines of L. pertusa. The researchers concluded that oxygenation may have been important in the Alboran Sea but not near the Mauritanian coast, since _______", "stem": "Which choice most effectively uses data from the graph to complete the statement?", "stemZh": "哪一個選項最有效地運用圖表中的數據完成這個敘述？", "bodyZh": "Alboran 海與茅利塔尼亞海岸樣本中錳與鈣的比值\n珊瑚 Lophelia pertusa 的族群數量在約 9,000 年前於 Alboran 海、約 11,000 年前於茅利塔尼亞海岸附近大幅減少。海洋科學家 Rodrigo da Costa Portilho-Ramos 與同事利用與海洋含氧量呈反比的錳鈣比值，評估含氧量是否在 L. pertusa 的減少中扮演了角色。研究人員得出結論：含氧量可能在 Alboran 海很重要，但在茅利塔尼亞海岸附近則不然，因為 _______", "opts": {"A": "a substantial increase in oxygenation in the Alboran Sea corresponded with the local decline in L. pertusa, but the opposite relationship between oxygenation and L. pertusa was found near the Mauritanian coast.", "B": "L. pertusa declined in the Alboran Sea during a period of substantial local decline in oxygenation, but L. pertusa declined near the Mauritanian coast during a period of little local change in oxygenation.", "C": "oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after the decline, whereas oxygenation near the Mauritanian coast was relatively low both before and after the decline in L. pertusa.", "D": "oxygenation in the Alboran Sea tended to be substantially higher than oxygenation near the Mauritanian coast during the period studied."}, "optsZh": {"A": "Alboran 海含氧量的大幅增加與當地 L. pertusa 的減少同時發生，但在茅利塔尼亞沿岸則發現含氧量與 L. pertusa 之間呈相反的關係。", "B": "L. pertusa 在 Alboran 海的減少發生在當地含氧量大幅下降的時期，但在茅利塔尼亞沿岸的減少則發生在當地含氧量幾乎沒有變化的時期。", "C": "Alboran 海的含氧量在 L. pertusa 減少前高於減少後，而茅利塔尼亞沿岸的含氧量在 L. pertusa 減少前後都相對較低。", "D": "在研究期間，Alboran 海的含氧量往往遠高於茅利塔尼亞沿岸的含氧量。"}, "answer": "B", "expl": "For oxygenation to matter in the Alboran Sea but not near Mauritania, L. pertusa must have declined during a big local drop in oxygenation in the Alboran Sea but during little change in oxygenation near Mauritania.", "explZh": "若含氧量在 Alboran 海重要、在茅利塔尼亞沿岸不重要，那麼 Alboran 海的珊瑚衰退應伴隨含氧量大幅下降，而茅利塔尼亞沿岸的衰退期間含氧量變化不大。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這項主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫且起伏不定的執政紀錄更重要。」", "D": "「這位領導人在上任第一個月內簽署了數項法令。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區占蔬菜種植者的 64%，但在北部和中部地區占穀物種植者的比例不到 35%。哪一項敘述最能運用圖表來支持關於區域作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "有些農民種植蔬菜，而其他農民種植穀物。", "C": "南部地區包含在這項調查中。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪一個選項最有效地運用了文本、表格、圖表或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵從不會比其母恆星多。哪一項發現最直接削弱這項主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "The method used to study stars requires a telescope.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "研究發現有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有一顆岩石行星擁有稀薄的大氣層。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Quantitative Evidence: oxygenation role in coral decline.", "vocab": false, "body": "The study notes that the same policy may
