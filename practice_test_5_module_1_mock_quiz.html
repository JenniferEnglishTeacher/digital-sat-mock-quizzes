  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: trace as evidence left behind.", "original": "The following text is from the 1913 story \"The King's Coin\" by Emily Pauline Johnson, a Kanienkahagen (Mohawk) writer also known as Tekahionwake. Fox-Foot, a young Ojibwe man, is guiding a group of fur traders who are traveling by canoe and suspects that they are being followed.\n\nAt supper time, Fox-Foot would allow no fire to be built, no landing to be made, no trace of their passing to be left. They ate canned meat and marmalade, drank again of the stream and pushed on, until just at dusk they reached the edge of a long, still lake, with shores of granite and dense fir forest.\n\nAs used in the text, what does the word \"trace\" most nearly mean?\nA) Evidence\nB) Blemish\nC) Amount\nD) Sketch", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Before leaving the excavation site, the archaeologists brushed the floor smooth so that any faint ______ of recent footsteps would be visible when they returned the next morning.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) quantity\nB) evidence\nC) outline\nD) blemish", "answer": "B", "explanation": "Evidence means a sign showing that something happened."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The detective found only a slight ______ of soil on the windowsill, but laboratory analysis showed that it matched the clay from the riverbank.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) mark\nB) estimate\nC) sketch\nD) amount", "answer": "A", "explanation": "Mark means a visible sign or indication."}, {"id": "1.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because migrating animals rarely remain in one place, field biologists often rely on indirect ______, such as hair, tracks, or partially eaten plants, to determine whether a species has passed through an area.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) quantities\nB) signs\nC) drawings\nD) summaries", "answer": "B", "explanation": "Signs are indications or evidence."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The storm erased almost every ______ of the temporary camp; by dawn, even the wheel tracks that had crossed the sand were no longer visible.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) defect\nB) portion\nC) diagram\nD) indication", "answer": "D", "explanation": "Indication means evidence or a sign."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Conservators examined the old canvas for any ______ of the artist's first design, hoping that faint pencil lines beneath the paint might reveal how the composition had changed.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) amount\nB) illustration\nC) remnant\nD) blemish", "answer": "C", "explanation": "A remnant is a remaining trace or sign."}]}, {"n": 2, "concept": "Words in Context: fragile or easily broken.", "original": "Many ancient sculptures of people's heads are missing their noses. This is because the nose is the most _______ part of a sculpture of a person's head. It is delicate and sticks out from the rest of the sculpture, making it especially easy to break.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) recognizable\nB) fragile\nC) common\nD) sophisticated", "generated": [{"id": "2.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The thin handle of the ceremonial cup is the most ______ part of the artifact: it projects from the body of the vessel and has already cracked in two places.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) sophisticated\nB) fragile\nC) ornate\nD) ordinary", "answer": "B", "explanation": "Fragile means easily broken."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Museum staff packed the glass negatives in separate sleeves because the plates were unusually ______ and could fracture if even slight pressure were applied.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) modern\nB) common\nC) delicate\nD) recognizable", "answer": "C", "explanation": "Delicate means easily damaged."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Although the carved figure is made of stone, the fingers are ______ because they are narrow, unsupported, and exposed to accidental contact from visitors.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) breakable\nB) ancient\nC) familiar\nD) valuable", "answer": "A", "explanation": "Breakable means easily broken."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The old manuscript's binding remained sturdy, but its pages had become ______ after decades in a dry storeroom, so librarians turned them only with special tools.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) legible\nB) portable\nC) brittle\nD) decorative", "answer": "C", "explanation": "Brittle means hard but easily broken."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The antenna is the rover's most ______ component; unlike the wheels and body panels, it protrudes from the frame and can be bent during transport.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) common\nB) identical\nC) complex\nD) vulnerable", "answer": "D", "explanation": "Vulnerable means easily harmed or damaged."}]}, {"n": 3, "concept": "Words in Context: impending solar flare.", "original": "K.D. Leka and colleagues found that the Sun's corona provides an advance indication of solar flares--intense eruptions of electromagnetic radiation that emanate from active regions in the Sun's photosphere and can interfere with telecommunications on Earth. Preceding a flare, the corona temporarily exhibits increased brightness above the region where the flare is _______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) antecedent\nB) impending\nC) innocuous\nD) perpetual", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The monitoring system detects a brief increase in pressure in the hours before an eruption, giving researchers an early signal that an eruption is ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) obsolete\nB) impending\nC) ordinary\nD) distant", "answer": "B", "explanation": "Impending means about to happen."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Satellite images showed rapidly thickening clouds above the coast, a warning that the tropical storm was ______ and that evacuation orders might soon be necessary.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) perpetual\nB) completed\nC) approaching\nD) innocuous", "answer": "C", "explanation": "Approaching means coming nearer."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The sudden drop in air pressure suggested that a severe thunderstorm was ______, so the airport temporarily halted takeoffs and moved ground crews indoors.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) past\nB) harmless\nC) constant\nD) imminent", "answer": "D", "explanation": "Imminent means about to occur."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. When the volcano began releasing larger amounts of sulfur dioxide, geologists interpreted the change as evidence that a new eruption was ______ rather than merely possible in the distant future.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) permanent\nB) minor\nC) historic\nD) forthcoming", "answer": "D", "explanation": "Forthcoming means coming soon."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The electrical activity in the region above the Sun's surface indicated that a flare was ______, allowing technicians to prepare satellites for possible interference.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) anticipated\nB) innocent\nC) irrelevant\nD) dormant", "answer": "A", "explanation": "Anticipated means expected to happen."}]}, {"n": 4, "concept": "Words in Context: exploit a tendency/use productively.", "original": "To demonstrate that the integrity of underground metal pipes can be assessed without unearthing the pipes, engineer Aroba Saleem and colleagues _______ the tendency of some metals' internal magnetic fields to alter under stress: the team showed that such alterations can be measured from a distance and can reveal concentrations of stress in the pipes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) hypothesized\nB) discounted\nC) redefined\nD) exploited", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. To test whether bridge cables can be inspected without dismantling them, engineers ______ the fact that tiny changes in vibration patterns reveal internal weaknesses.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) exploited\nB) predicted\nC) ignored\nD) misstated", "answer": "A", "explanation": "Exploited means made practical use of."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The medical team ______ the fluorescent properties of the dye, using the dye to make otherwise invisible tumors easier to locate during surgery.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dismissed\nB) withheld\nC) utilized\nD) redefined", "answer": "C", "explanation": "Utilized means used for a practical purpose."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Rather than drill into the ancient wall, conservators ______ the stone's natural response to infrared light to identify hidden layers of paint.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) harnessed\nB) simplified\nC) questioned\nD) discounted", "answer": "A", "explanation": "Harnessed means used effectively."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The software ______ small differences in users' typing rhythms, turning those differences into a method for confirming identity without requiring an additional password.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) concealed\nB) leveraged\nC) imitated\nD) overlooked", "answer": "B", "explanation": "Leveraged means used to gain an advantage."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers ______ the tendency of certain bacteria to bind to heavy metals, developing a low-cost system for filtering contaminated water.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) postulated\nB) distorted\nC) rejected\nD) employed", "answer": "D", "explanation": "Employed means used."}]}, {"n": 5, "concept": "Words in Context: ameliorate a research limitation.", "original": "Despite the generalizations about human behavior they have produced, many studies of behavioral psychology have used highly unrepresentative subject pools: students at the colleges and universities where the researchers are employed. To _______ this situation, it is necessary to actively recruit subjects from diverse backgrounds and locations.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) sanction\nB) ameliorate\nC) rationalize\nD) postulate", "generated": [{"id": "5.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Because many early clinical trials relied on participants from a narrow age range, researchers now try to ______ this limitation by recruiting volunteers from older and younger populations as well.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) rationalize\nB) postulate\nC) sanction\nD) address", "answer": "D", "explanation": "Address means deal with or improve a problem."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The city planted trees along the hottest streets to ______ the effects of extreme summer temperatures, particularly in neighborhoods with little shade.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) mitigate\nB) endorse\nC) justify\nD) predict", "answer": "A", "explanation": "Mitigate means make less severe."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. To ______ the shortage of bilingual nurses, the hospital created scholarships for students who already spoke the languages most common among local patients.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) defend\nB) describe\nC) alleviate\nD) ignore", "answer": "C", "explanation": "Alleviate means make a problem less serious."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The revised survey was designed to ______ the bias in the original sample by including respondents from rural districts as well as major cities.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) validate\nB) conceal\nC) remedy\nD) summarize", "answer": "C", "explanation": "Remedy means correct or improve a problem."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The new archive will not eliminate gaps in the historical record, but it may ______ them by preserving letters and photographs from communities previously overlooked by scholars.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) rationalize\nB) ameliorate\nC) complicate\nD) authorize", "answer": "B", "explanation": "Ameliorate means improve or make less severe."}]}, {"n": 6, "concept": "Literary purpose: explain why narrator may make team.", "original": "The following text is adapted from Jean Webster's 1912 novel Daddy-Long-Legs. The narrator is a young college student writing letters detailing her weekly experiences.\n\n[The college is] organizing the Freshman basket-ball team and there's just a chance that I shall make it. I'm little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.\n\nWhich choice best states the main purpose of the text?\nA) To compare basketball with other sports\nB) To provide details of how to play basketball\nC) To state how players will be chosen for the basketball team\nD) To explain why the narrator thinks she might make the basketball team", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To explain why music has lost its importance\nB) To summarize a conflict between two relatives\nC) To portray a setting and mood as characters prepare for an arrival\nD) To argue that the characters should leave the house", "answer": "C", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To list the technical features of a harbor\nB) To criticize sailors for taking unnecessary risks\nC) To compare several forms of transportation\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To describe a completed celebration from beginning to end\nB) To depict preparations that reveal anticipation within a family\nC) To contrast rural and urban customs\nD) To explain why the family dislikes visitors", "answer": "B", "explanation": "The details focus on preparation and anticipation."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To argue that early classes should be canceled\nB) To describe the moments before a significant daily activity begins\nC) To evaluate the quality of a school's curriculum\nD) To recount a student's entire academic career", "answer": "B", "explanation": "The purpose is to depict a scene before an event."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To establish a reflective mood before a character acts\nB) To reveal the full contents of a letter\nC) To compare two different seasons\nD) To give instructions for maintaining a garden", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 7, "concept": "Main purpose: Spanish-language newspapers in Texas.", "original": "In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.\n\nWhich choice best states the main purpose of the text?\nA) To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s\nB) To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s\nC) To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s\nD) To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To explain why music has lost its importance\nB) To portray a setting and mood as characters prepare for an arrival\nC) To argue that the characters should leave the house\nD) To summarize a conflict between two relatives", "answer": "B", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To compare several forms of transportation\nB) To list the technical features of a harbor\nC) To criticize sailors for taking unnecessary risks\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To explain why the family dislikes visitors\nB) To describe a completed celebration from beginning to end\nC) To depict preparations that reveal anticipation within a family\nD) To contrast rural and urban customs", "answer": "C", "explanation": "The details focus on preparation and anticipation."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To evaluate the quality of a school's curriculum\nB) To recount a student's entire academic career\nC) To argue that early classes should be canceled\nD) To describe the moments before a significant daily activity begins", "answer": "D", "explanation": "The purpose is to depict a scene before an event."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To establish a reflective mood before a character acts\nB) To give instructions for maintaining a garden\nC) To compare two different seasons\nD) To reveal the full contents of a letter", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 8, "concept": "Text Function: why researchers study Atacama Desert.", "original": "Chile's Atacama Desert is one of the driest places on Earth. Mary Beth Wilhelm and other astrobiologists search for life, or its remains, in this harsh place because the desert closely mirrors the extreme environment on Mars. The algae and bacteria found in Atacama's driest regions may offer clues about Martian life. By studying how these and other microorganisms survive such extreme conditions on Earth, Wilhelm's team hopes to determine whether similar life might have existed on Mars and to develop the best tools to look for evidence of it.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) To contrast the conditions in the Atacama Desert with those on Mars\nB) To explain why many life-forms cannot survive in the Atacama Desert\nC) To indicate why astrobiologists choose to conduct research in the Atacama Desert\nD) To describe certain limitations to conducting scientific study in the Atacama Desert", "generated": [{"id": "8.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the structure or function of the text?\n\nA) It offers evidence that radar is always reliable.\nB) It states the study's final conclusion.\nC) It describes how other researchers criticized the work.\nD) It identifies the uncertainty that motivated the study.", "answer": "D", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It defines the problem the later investigation attempts to address.\nB) It contradicts the claim made in the first sentence.\nC) It summarizes the team's strongest result.\nD) It shifts the discussion away from archaeology.", "answer": "A", "explanation": "The sentence frames the central research question."}, {"id": "8.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the structure or function of the text?\n\nA) It lists the materials used in the experiment.\nB) It gives a historical overview of plant classification.\nC) It introduces a gap in knowledge that the experiment examines.\nD) It proves that drought has no effect on plants.", "answer": "C", "explanation": "The sentence identifies an unresolved issue."}, {"id": "8.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the structure or function of the text?\n\nA) It introduces an unrelated theme.\nB) It raises a difficulty with a common interpretation.\nC) It provides biographical information about the novelist.\nD) It summarizes the novel's publication history.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It compares underwater vehicles with aircraft.\nB) It explains the limitation that the new system is meant to address.\nC) It announces that the technology is already flawless.\nD) It gives a personal anecdote about engineers.", "answer": "B", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 9, "concept": "Text Function: transit ridership depends on context.", "original": "More than 60% of journeys in Mexico City occur via public transit, but simply reproducing a feature of the city's transit system--e.g., its low fares--is unlikely to induce a significant increase in another city's transit ridership. As Erick Guerra et al. have shown, transportation mode choice in urban areas of Mexico is the product of a complex mix of factors, including population density, the spatial distribution of jobs, and demographic characteristics of individuals. System features do affect ridership, of course, but there is an irreducibly contextual dimension of transportation mode choice.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\nA) It presents an objection to the argument of Guerra et al. about transportation mode choice in urban areas of Mexico.\nB) It explains why it is challenging to influence transit ridership solely by altering characteristics of a transit system.\nC) It illustrates the claim that a characteristic associated with high transit ridership in Mexico City is not associated with high transit ridership elsewhere.\nD) It substantiates the assertion that population density, the spatial distribution of jobs, and demographic characteristics are important factors in transportation mode choice.", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant ba e sentence frames the central research question."}, {"id": "9.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the structure or function of the text?\n\nA) It gives a historical overview of plant classification.\nB) It proves that drought has no effect on plants.\nC) It lists the materials used in the experiment.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "9.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the structure or function of the text?\n\nA) It provides biographical information about the novelist.\nB) It introduces an unrelated theme.\nC) It summarizes the novel's publication history.\nD) It raises a difficulty with a common interpretation.", "answer": "D", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It explains the limitation that the new system is meant to address.\nB) It gives a personal anecdote about engineers.\nC) It announces that the technology is already flawless.\nD) It compares underwater vehicles with aircraft.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 10, "concept": "Text Structure: hypothesis contradicted by soil-depth finding.", "original": "Changes to vegetation cover and other human activities influence carbon and nitrogen levels in soil, though how deep these effects extend is unclear. Hypothesizing that differences in land use lead to differences in carbon and nitrogen levels that are not restricted to the topsoil layer (0-30 cm deep), Chukwuebuka Okolo and colleagues sampled soils across multiple land-use types (e.g., grazing land, cropland, forest) within each of several Ethiopian locations. They found, though, that across land-use types, carbon and nitrogen decreased to comparably low levels beyond depths of 30 cm.\n\nWhich choice best describes the overall structure of the text?\nA) It describes a phenomenon that scientists do not fully understand, explains a research team's hypothesis about that phenomenon, and then describes a finding that led the team to refine the hypothesis.\nB) It introduces an unresolved scientific question, presents a research team's hypothesis pertaining to that question, and then describes an observation made by the team that conflicts with that hypothesis.\nC) It discusses a process that scientists are somewhat unclear about, introduces competing hypotheses about that process, and then explains how a research team concluded that one of those hypotheses is likely correct.\nD) It explains a hypothesis that has been the subject of scientific debate, discusses how a research team tested that hypothesis, and then presents data the team collected that validate the hypothesis.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the structure or function of the text?\n\nA) It identifies the uncertainty that motivated the study.\nB) It offers evidence that radar is always reliable.\nC) It describes how other researchers criticized the work.\nD) It states the study's final conclusion.", "answer": "A", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a pares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the structure or function of the text?\n\nA) It introduces an unrelated theme.\nB) It raises a difficulty with a common interpretation.\nC) It summarizes the novel's publication history.\nD) It provides biographical information about the novelist.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "10.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It explains the limitation that the new system is meant to address.\nB) It compares underwater vehicles with aircraft.\nC) It gives a personal anecdote about engineers.\nD) It announces that the technology is already flawless.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 11, "concept": "Reading Detail: surprise about marsquakes.", "original": "Recently, scientists looked at data collected by NASA's InSight lander to learn more about seismic activity on Mars, known as marsquakes. The data show that the marsquakes all started from the same location on the planet. This discovery was surprising to scientists, as they expected that the marsquakes would originate from all over the planet because of the cooling of the planet's surface. Now, scientists believe that there could be areas of active magma flows deep beneath the planet's surface that trigger the marsquakes.\n\nAccording to the text, what was surprising to scientists studying the seismic activity data from NASA's InSight lander?\nA) The surface temperature of Mars has been rising.\nB) There were different types of seismic waves causing marsquakes.\nC) NASA's InSight lander collected less data than scientists had expected.\nD) All the marsquakes started from the same location on the planet.", "generated": [{"id": "11.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She lacks affection for her family.\nB) She refuses to give advice to others.\nC) She shows unusual maturity and self-command.\nD) She is admired mainly for her wealth.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The family ignores the grandmother's opinions.\nB) The narrator thinks patience is useless.\nC) The grandmother avoids family matters entirely.\nD) The grandmother's influence is quiet but substantial.", "answer": "D", "explanation": "The family respects her careful judgment."}, {"id": "11.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The clerk's carefulness is valuable despite being inconvenient.\nB) The business fails because of excessive caution.\nC) The coworkers are more accurate than the clerk.\nD) The clerk intentionally creates errors.", "answer": "A", "explanation": "The passage praises his precision."}, {"id": "11.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The leader values inclusive deliberation.\nB) The leader dislikes public meetings.\nC) The leader makes decisions without hearing others.\nD) The leader is unable to reach conclusions.", "answer": "A", "explanation": "The evidence shows patience and inclusion."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She publishes claims before testing them.\nB) She combines intellectual openness with rigorous standards.\nC) She rejects all imaginative thinking.\nD) She avoids working with students.", "answer": "B", "explanation": "The contrast shows openness and rigor."}]}, {"n": 12, "concept": "Reading Detail: Maya zero may come from Olmec civilization.", "original": "The ancient writing system used in the Maya kingdoms of southern Mexico and Central America had a symbol for the number zero. The earliest known example of the symbol dates to more than 2,000 years ago. At that time, almost none of the writing systems elsewhere in the world possessed a zero symbol. And the use of zero in Mexico and Central America may be even more ancient. Some historians suggest that Maya mathematicians inherited it from the Olmec civilization, which flourished in the region 2,400-3,600 years ago.\n\nAccording to the text, what do some historians suggest about Maya civilization?\nA) Maya civilization acquired the use of zero from the Olmec civilization.\nB) Maya civilization respected its historians more than it respected its mathematicians.\nC) Maya civilization was highly secretive about its intellectual achievements.\nD) Maya civilization tried to introduce its writing system to other civilizations.", "generated": [{"id": "12.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She lacks affection for her family.\nB) She refuses to give advice to others.\nC) She shows unusual maturity and self-command.\nD) She is admired mainly for her wealth.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The grandmother's influence is quiet but substantial.\nB) The grandmother avoids family matters entirely.\nC) The family ignores the grandmother's opinions.\nD) The narrator thinks patience is useless.", "answer": "A", "explanation": "The family respects her careful judgment."}, {"id": "12.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The business fails because of excessive caution.\nB) The coworkers are more accurate than the clerk.\nC) The clerk intentionally creates errors.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "12.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The leader makes decisions without hearing others.\nB) The leader dislikes public meetings.\nC) The leader is unable to reach conclusions.\nD) The leader values inclusive deliberation.", "answer": "D", "explanation": "The evidence shows patience and inclusion."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She rejects all imaginative thinking.\nB) She combines intellectual openness with rigorous standards.\nC) She publishes claims before testing them.\nD) She avoids working with students.", "answer": "B", "explanation": "The contrast shows openness and rigor."}]}, {"n": 13, "concept": "Command of Evidence: quotation showing distress.", "original": "\"The Bet\" is an 1889 short story by Anton Chekhov. In the story, a banker is described as being very upset about something: _______\n\nWhich quotation from \"The Bet\" most effectively illustrates the claim?\nA) \"Then the banker cautiously broke the seals off the door and put the key in the keyhole.\"\nB) \"It struck three o'clock, the banker listened; everyone was asleep in the house and nothing could be heard outside but the rustling of the chilled trees.\"\nC) \"The banker, spoilt and frivolous, with millions beyond his reckoning, was delighted at the bet.\"\nD) \"When [the banker] got home he lay on his bed, but his tears and emotion kept him for hours from sleeping.\"", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The southern region was included in the survey.\nC) The graph contains information about three regions.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) One rocky planet has a thin atmosphere.\nB) Some stars contain hydrogen and helium.\nC) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nD) The method used to study stars requires a telescope.", "answer": "C", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) The tradition is studied by scholars in several countries.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Many performers learned songs from relatives.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The program took place in a community.\nD) The table includes more than one year.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Quantitative Evidence: de-extinction and longest elapsed time.", "original": "Partial List of Candidate Species for De-extinction\nHuia (Heteralocha acutirostris): became extinct 1907.\nCaribbean monk seal (Monachus tropicalis): became extinct 1952.\nPassenger pigeon (Ectopistes migratorius): became extinct 1914.\nSaber-toothed cat (Smilodon): became extinct 11,000 years before present.\nWoolly mammoth (Mammuthus primigenius): became extinct 6,400 years before present.\n\nThe passage of time is among the many obstacles faced by scientists who are pursuing de-extinction efforts--that is, efforts to use breeding or a mixture of cloning and genetic engineering to bring back extinct species. Specifically, researchers are concerned that the longer a species has been extinct, the less likely it is that a suitable habitat still exists for that species. Among candidate species for de-extinction, this problem would be especially concerning for the _______\n\nWhich choice most effectively uses data from the table to complete the statement?\nA) passenger pigeon (Ectopistes migratorius), which became extinct only a few years after the huia (Heteralocha acutirostris).\nB) saber-toothed cat (Smilodon), which became extinct 11,000 years ago.\nC) woolly mammoth (Mammuthus primigenius), which became extinct several thousand years before the saber-toothed cat (Smilodon).\nD) Caribbean monk seal (Monachus tropicalis), which became extinct in 1952.", "generated": [{"id": "14.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The graph contains information about three regions.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) The southern region was included in the survey.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) Some stars contain hydrogen and helium.\nC) The method used to study stars requires a telescope.\nD) One rocky planet has a thin atmosphere.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Many performers learned songs from relatives.\nC) Some songs use a meter also found in older European poetry.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program took place in a community.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The table includes more than one year.\nD) Both towns had some volunteers.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Command of Evidence: quotation showing mixed feelings.", "original": "\"The Yellow Wallpaper\" is an 1892 short story by Charlotte Perkins Gilman. In the story, the narrator expresses mixed feelings about her surroundings: _______\n\nWhich quotation from \"The Yellow Wallpaper\" most effectively illustrates the claim?\nA) \"This wallpaper has a kind of sub-pattern in a different shade, a particularly irritating one, for you can only see it in certain lights, and not clearly then.\"\nB) \"By moonlight--the moon shines in all night when there is a moon--I wouldn't know it was the same paper.\"\nC) \"I'm really getting quite fond of the big room, all but that horrid [wall]paper.\"\nD) \"The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.\"", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describ
