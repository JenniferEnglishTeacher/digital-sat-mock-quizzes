<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 6, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 6, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>

      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "The works of Chicana artist Ester Hernandez are now _______ in museums both in the United States and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=abroad\" target=\"_blank\" rel=\"noopener\" data-w=\"abroad\" data-pos=\"adv.\" data-en=\"in or to a foreign country\" data-zh=\"在國外；到國外\">abroad<\/a>, but the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mural\" target=\"_blank\" rel=\"noopener\" data-w=\"mural\" data-pos=\"n.\" data-en=\"a large painting done directly on a wall\" data-zh=\"壁畫\">murals<\/a> she contributed to as a member of Las Mujeres Muralistas early in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artistic\" target=\"_blank\" rel=\"noopener\" data-w=\"artistic\" data-pos=\"adj.\" data-en=\"relating to art or artists; showing skill in art\" data-zh=\"藝術的；有藝術才能的\">artistic<\/a> career were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=displayed\" target=\"_blank\" rel=\"noopener\" data-w=\"displayed\" data-pos=\"v.\" data-en=\"put where people can see it\" data-zh=\"展示；陳列\">displayed<\/a> in outdoor public spaces across San Francisco.", "bodyPlain": "The works of Chicana artist Ester Hernandez are now _______ in museums both in the United States and abroad, but the murals she contributed to as a member of Las Mujeres Muralistas early in her artistic career were displayed in outdoor public spaces across San Francisco.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "Chicana 藝術家 Ester Hernandez 的作品如今在美國及海外的博物館中都 _______，但她在藝術生涯早期以 Las Mujeres Muralistas 成員身分參與創作的壁畫，則展示於舊金山各地的戶外公共空間。", "opts": {"A": "invented", "B": "adjusted", "C": "featured", "D": "recommended"}, "optsZh": {"A": "invented（發明）", "B": "adjusted（調整過的）", "C": "featured（展出；以……為特色）", "D": "recommended（推薦）"}, "answer": "C", "expl": "Hernandez's works are now shown in museums, in contrast to her earlier murals displayed outdoors, so they are 'featured' (presented prominently) in museums.", "explZh": "Hernandez 的作品現在在博物館展出，與她早期在戶外公共空間展示的壁畫形成對比，所以用「featured」（被展出、作為重點呈現）。", "defs": {"A": {"pos": "v.", "en": "created or designed something new", "zh": "發明；創造", "word": "invented"}, "B": {"pos": "v.", "en": "changed slightly to fit or work better", "zh": "調整", "word": "adjusted"}, "C": {"pos": "v.", "en": "shown or included as an important part", "zh": "展出；以……為特色", "word": "featured"}, "D": {"pos": "v.", "en": "suggested as good or suitable", "zh": "推薦", "word": "recommended"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The sculptor&#x27;s early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> appeared mostly in community centers, but her recent work is now _______ in major galleries across Europe and South America.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The sculptor's early installations appeared mostly in community centers, but her recent work is now _______ in major galleries across Europe and South America.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位雕塑家早期的裝置作品大多出現在社區活動中心，但她近期的作品如今已在歐洲與南美洲各大藝廊 _______。", "opts": {"A": "invented", "B": "recommended", "C": "displayed", "D": "adjusted"}, "optsZh": {"A": "invented（發明）", "B": "recommended（推薦）", "C": "displayed（展示；陳列）", "D": "adjusted（調整過的）"}, "answer": "C", "expl": "Displayed means shown publicly.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "created or designed something new", "zh": "發明；創造", "word": "invented"}, "B": {"pos": "v.", "en": "suggested as good or suitable", "zh": "推薦", "word": "recommended"}, "C": {"pos": "v.", "en": "put where people can see it", "zh": "展示；陳列", "word": "displayed"}, "D": {"pos": "v.", "en": "changed slightly to fit or work better", "zh": "調整", "word": "adjusted"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The filmmaker&#x27;s documentaries were once screened only at local festivals; today, they are _______ in university archives and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=international\" target=\"_blank\" rel=\"noopener\" data-w=\"international\" data-pos=\"adj.\" data-en=\"involving more than one country\" data-zh=\"國際的\">international<\/a> retrospectives.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The filmmaker's documentaries were once screened only at local festivals; today, they are _______ in university archives and international retrospectives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位電影工作者的紀錄片過去只在地方影展放映；如今，它們已 _______ 於大學檔案館與國際回顧展中。", "opts": {"A": "redesigned", "B": "misplaced", "C": "exhibited", "D": "endorsed"}, "optsZh": {"A": "redesigned（重新設計）", "B": "misplaced（放錯地方的；遺失的）", "C": "exhibited（展出；展示）", "D": "endorsed（認可；背書）"}, "answer": "C", "expl": "Exhibited means shown prominently.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "designed again in a new way", "zh": "重新設計", "word": "redesigned"}, "B": {"pos": "v.", "en": "put in the wrong place and lost", "zh": "放錯地方；遺失", "word": "misplaced"}, "C": {"pos": "v.", "en": "shown publicly, as in a museum or gallery", "zh": "展出；展覽", "word": "exhibited"}, "D": {"pos": "v.", "en": "publicly approved or supported", "zh": "認可；背書", "word": "endorsed"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Several textiles by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collective\" target=\"_blank\" rel=\"noopener\" data-w=\"collective\" data-pos=\"n.\" data-en=\"a group of people who work together\" data-zh=\"團體；集體\">collective<\/a> are _______ in the museum&#x27;s permanent collection, where visitors can view them alongside paintings from the same period.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Several textiles by the collective are _______ in the museum's permanent collection, where visitors can view them alongside paintings from the same period.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這個團體的數件織品 _______ 於博物館的永久典藏中，參觀者可以把它們與同一時期的畫作一起欣賞。", "opts": {"A": "repaired", "B": "featured", "C": "translated", "D": "predicted"}, "optsZh": {"A": "repaired（修理）", "B": "featured（展出；以……為特色）", "C": "translated（翻譯）", "D": "predicted（預測）"}, "answer": "B", "expl": "Featured means included or shown prominently.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "fixed something broken", "zh": "修理；修復", "word": "repaired"}, "B": {"pos": "v.", "en": "shown or included as an important part", "zh": "展出；以……為特色", "word": "featured"}, "C": {"pos": "v.", "en": "changed from one language into another", "zh": "翻譯", "word": "translated"}, "D": {"pos": "v.", "en": "said what will happen in the future", "zh": "預測", "word": "predicted"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The photographer&#x27;s portraits are now _______ at cultural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a> around the world, though they were first posted on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> bulletin boards.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The photographer's portraits are now _______ at cultural institutions around the world, though they were first posted on neighborhood bulletin boards.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位攝影師的肖像作品如今在世界各地的文化機構 _______，儘管它們最初只是張貼在社區的布告欄上。", "opts": {"A": "showcased", "B": "assigned", "C": "invented", "D": "corrected"}, "optsZh": {"A": "showcased（展示；陳列）", "B": "assigned（指派；分配）", "C": "invented（發明）", "D": "corrected（被更正；被修正）"}, "answer": "A", "expl": "Showcased means prominently displayed.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "displayed in a way that draws attention", "zh": "展示；使大放異彩", "word": "showcased"}, "B": {"pos": "v.", "en": "given as a task or placed in a role", "zh": "指派；分配", "word": "assigned"}, "C": {"pos": "v.", "en": "created or designed something new", "zh": "發明；創造", "word": "invented"}, "D": {"pos": "v.", "en": "made right after an error", "zh": "更正；修正", "word": "corrected"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: featured in museums.", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The playwright&#x27;s handwritten drafts, long kept in a private archive, are now _______ in a public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> devoted to twentieth-century theater.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The playwright's handwritten drafts, long kept in a private archive, are now _______ in a public exhibition devoted to twentieth-century theater.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位劇作家的手寫草稿長年保存在私人檔案中，如今則在一場以二十世紀戲劇為主題的公開展覽中 _______。", "opts": {"A": "altered", "B": "advised", "C": "imagined", "D": "presented"}, "optsZh": {"A": "altered（被更改的）", "B": "advised（被建議的；被告知的）", "C": "imagined（想像出來的）", "D": "presented（呈現；展出）"}, "answer": "D", "expl": "Presented means made available for viewing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "changed", "zh": "改變；修改", "word": "altered"}, "B": {"pos": "v.", "en": "gave advice or suggestions to", "zh": "建議；勸告", "word": "advised"}, "C": {"pos": "v.", "en": "formed a picture of in the mind", "zh": "想像", "word": "imagined"}, "D": {"pos": "v.", "en": "shown or offered to an audience", "zh": "呈現；展出", "word": "presented"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "Whether Carmen Lomas Garza is creating small paintings and illustrations or large public artworks--such as Baile, a copper cutout of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> Mexican dance in the San Francisco International Airport--she is _______ direct <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>, drawing from memories of her childhood in Texas or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">details<\/a> of her current <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a> in California.", "bodyPlain": "Whether Carmen Lomas Garza is creating small paintings and illustrations or large public artworks--such as Baile, a copper cutout of traditional Mexican dance in the San Francisco International Airport--she is _______ direct experience, drawing from memories of her childhood in Texas or details of her current surroundings in California.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "無論 Carmen Lomas Garza 是在創作小幅畫作與插畫，還是大型公共藝術作品——例如位於舊金山國際機場、以傳統墨西哥舞蹈為題材的銅雕剪影作品《Baile》——她都 _______ 直接的經驗，取材自她在德州的童年回憶，或她目前在加州周遭環境的細節。", "opts": {"A": "complimented by", "B": "uncertain about", "C": "unbothered by", "D": "inspired by"}, "optsZh": {"A": "complimented by（受到……稱讚）", "B": "uncertain about（對……不確定）", "C": "unbothered by（不受……困擾）", "D": "inspired by（受……啟發）"}, "answer": "D", "expl": "She draws from memories of her childhood and details of her current surroundings, so her work is 'inspired by' direct experience.", "explZh": "她從童年回憶與目前周遭的細節取材，所以她的創作是「inspired by」（受到……啟發）親身經驗。", "defs": {"A": {"pos": "adj. phr.", "en": "praised by", "zh": "受到……稱讚", "word": "complimented by"}, "B": {"pos": "adj. phr.", "en": "not sure about", "zh": "對……不確定", "word": "uncertain about"}, "C": {"pos": "adj. phr.", "en": "not upset or troubled by", "zh": "不受……困擾", "word": "unbothered by"}, "D": {"pos": "adj. phr.", "en": "given ideas or creative energy by", "zh": "受……啟發", "word": "inspired by"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The novelist&#x27;s rural settings are clearly _______ childhood visits to her grandparents&#x27; farm, where she learned the names of crops, tools, and seasonal tasks.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The novelist's rural settings are clearly _______ childhood visits to her grandparents' farm, where she learned the names of crops, tools, and seasonal tasks.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位小說家筆下的鄉村場景顯然 _______ 她童年時造訪祖父母農場的經驗，她在那裡學會了作物、農具與季節性農活的名稱。", "opts": {"A": "protected from", "B": "derived from", "C": "unmoved by", "D": "skeptical of"}, "optsZh": {"A": "protected from（受保護免於……）", "B": "derived from（源自……）", "C": "unmoved by（不為……所動）", "D": "skeptical of（對……持懷疑態度）"}, "answer": "B", "expl": "Derived from means drawn from a source.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "kept safe from", "zh": "受保護免於……", "word": "protected from"}, "B": {"pos": "adj. phr.", "en": "coming or developed from a source", "zh": "源自……", "word": "derived from"}, "C": {"pos": "adj. phr.", "en": "not emotionally affected by", "zh": "不為……所動", "word": "unmoved by"}, "D": {"pos": "adj. phr.", "en": "doubting whether something is true or good", "zh": "對……持懷疑態度", "word": "skeptical of"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The architect&#x27;s small libraries are _______ the reading rooms she used as a student; their low shelves and window seats echo those earlier spaces.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The architect's small libraries are _______ the reading rooms she used as a student; their low shelves and window seats echo those earlier spaces.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位建築師設計的小型圖書館 _______ 她學生時代使用過的閱覽室；那些低矮的書架與窗邊座位呼應了早年的那些空間。", "opts": {"A": "concealed by", "B": "indifferent to", "C": "influenced by", "D": "unrelated to"}, "optsZh": {"A": "concealed by（被……掩蓋）", "B": "indifferent to（對……漠不關心）", "C": "influenced by（受……影響）", "D": "unrelated to（與……無關）"}, "answer": "C", "expl": "Influenced by means inspired by.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "hidden by", "zh": "被……掩蓋", "word": "concealed by"}, "B": {"pos": "adj. phr.", "en": "not caring about or interested in", "zh": "對……漠不關心", "word": "indifferent to"}, "C": {"pos": "adj. phr.", "en": "affected or shaped by", "zh": "受……影響", "word": "influenced by"}, "D": {"pos": "adj. phr.", "en": "not connected with", "zh": "與……無關", "word": "unrelated to"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The composer said that the rhythms in the suite were _______ the sounds of trains outside her apartment rather than by formal conservatory exercises.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The composer said that the rhythms in the suite were _______ the sounds of trains outside her apartment rather than by formal conservatory exercises.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這位作曲家說，這首組曲中的節奏是 _______ 她公寓外火車的聲音，而不是來自正式的音樂學院練習。", "opts": {"A": "prompted by", "B": "excluded from", "C": "opposed to", "D": "unaware of"}, "optsZh": {"A": "prompted by（由……引發）", "B": "excluded from（被排除在……之外）", "C": "opposed to（反對……）", "D": "unaware of（未察覺……）"}, "answer": "A", "expl": "Prompted by means inspired by.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "caused or started by", "zh": "由……引發", "word": "prompted by"}, "B": {"pos": "adj. phr.", "en": "kept out of", "zh": "被排除在……之外", "word": "excluded from"}, "C": {"pos": "adj. phr.", "en": "against; disagreeing with", "zh": "反對……", "word": "opposed to"}, "D": {"pos": "adj. phr.", "en": "not knowing about", "zh": "未察覺……", "word": "unaware of"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The painter&#x27;s city scenes are _______ daily walks through crowded markets, where she sketches storefronts, vendors, and passing conversations.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The painter's city scenes are _______ daily walks through crowded markets, where she sketches storefronts, vendors, and passing conversations.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位畫家的城市景象 _______ 她每天穿梭於擁擠市場的散步經驗，她在那裡速寫店面、攤販與路人的交談。", "opts": {"A": "uncertain about", "B": "inspired by", "C": "separated from", "D": "complimented by"}, "optsZh": {"A": "uncertain about（對……不確定）", "B": "inspired by（受……啟發）", "C": "separated from（與……分開）", "D": "complimented by（受到……稱讚）"}, "answer": "B", "expl": "Inspired by means creatively drawn from.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "not sure about", "zh": "對……不確定", "word": "uncertain about"}, "B": {"pos": "adj. phr.", "en": "given ideas or creative energy by", "zh": "受……啟發", "word": "inspired by"}, "C": {"pos": "adj. phr.", "en": "kept apart from", "zh": "與……分開", "word": "separated from"}, "D": {"pos": "adj. phr.", "en": "praised by", "zh": "受到……稱讚", "word": "complimented by"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: inspired by direct experience.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The poet&#x27;s imagery is _______ direct observation: she often drafts lines outdoors while watching tides, birds, and changing light.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The poet's imagery is _______ direct observation: she often drafts lines outdoors while watching tides, birds, and changing light.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位詩人的意象 _______ 直接的觀察：她常在戶外一邊觀看潮汐、鳥群與變化的光線，一邊起草詩句。", "opts": {"A": "unbothered by", "B": "distant from", "C": "suspicious of", "D": "rooted in"}, "optsZh": {"A": "unbothered by（不受……困擾）", "B": "distant from（與……疏遠；遠離……）", "C": "suspicious of（對……起疑）", "D": "rooted in（根源於……）"}, "answer": "D", "expl": "Rooted in means based on.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "not upset or troubled by", "zh": "不受……困擾", "word": "unbothered by"}, "B": {"pos": "adj. phr.", "en": "far away from; not closely connected to", "zh": "遠離……；與……疏遠", "word": "distant from"}, "C": {"pos": "adj. phr.", "en": "not trusting; believing something may be wrong", "zh": "對……起疑", "word": "suspicious of"}, "D": {"pos": "adj. phr.", "en": "having its origin or basis in", "zh": "根源於……", "word": "rooted in"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "Animal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> Amalia P.M. Bastos led a 2021 study about a wild kea parrot that used small stones as tools to preen its feathers. Skeptical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> had initially suggested to Bastos that the kea&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> with the stones might simply be _______ , but Bastos and her team showed that the kea was using the stones <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a>.", "bodyPlain": "Animal researcher Amalia P.M. Bastos led a 2021 study about a wild kea parrot that used small stones as tools to preen its feathers. Skeptical colleagues had initially suggested to Bastos that the kea's interactions with the stones might simply be _______ , but Bastos and her team showed that the kea was using the stones deliberately.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "動物研究人員 Amalia P.M.Bastos 主持了一項 2021 年的研究，研究對象是一隻會用小石頭當作工具來梳理羽毛的野生啄羊鸚鵡（kea）。持懷疑態度的同事起初曾向 Bastos 表示，這隻啄羊鸚鵡與石頭的互動可能只是 _______，但 Bastos 和她的團隊證明了這隻鸚鵡是有意識地使用這些石頭。", "opts": {"A": "intriguing", "B": "obvious", "C": "accidental", "D": "observable"}, "optsZh": {"A": "intriguing（引人好奇的）", "B": "obvious（明顯的）", "C": "accidental（意外的；偶然的）", "D": "observable（可觀察到的）"}, "answer": "C", "expl": "'But' sets up a contrast with 'deliberately,' so the colleagues suggested the kea's use of stones might be 'accidental' (not intentional).", "explZh": "「but」引出與「deliberately」（刻意地）的對比，所以同事們原本認為這隻鸚鵡使用石頭可能只是「accidental」（偶然的、非刻意的）。", "defs": {"A": {"pos": "adj.", "en": "arousing curiosity or interest", "zh": "引人好奇的", "word": "intriguing"}, "B": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的", "word": "obvious"}, "C": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "D": {"pos": "adj.", "en": "able to be seen or noticed", "zh": "可觀察到的", "word": "observable"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The pattern initially looked _______ , but closer analysis showed that the animal repeated the behavior only when it needed to reach food.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The pattern initially looked _______ , but closer analysis showed that the animal repeated the behavior only when it needed to reach food.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這個模式起初看起來 _______，但更仔細的分析顯示，這隻動物只有在需要取得食物時才會重複這個行為。", "opts": {"A": "observable", "B": "incidental", "C": "deliberate", "D": "intriguing"}, "optsZh": {"A": "observable（可觀察到的）", "B": "incidental（偶然的；附帶的）", "C": "deliberate（刻意的；故意的）", "D": "intriguing（引人好奇的）"}, "answer": "B", "expl": "Incidental means accidental or not intended.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be seen or noticed", "zh": "可觀察到的", "word": "observable"}, "B": {"pos": "adj.", "en": "happening by chance as a minor side effect, not by design", "zh": "偶然的；附帶的", "word": "incidental"}, "C": {"pos": "adj.", "en": "done on purpose", "zh": "刻意的；故意的", "word": "deliberate"}, "D": {"pos": "adj.", "en": "arousing curiosity or interest", "zh": "引人好奇的", "word": "intriguing"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The intern first assumed the missing labels were _______ , but the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archivist\" target=\"_blank\" rel=\"noopener\" data-w=\"archivist\" data-pos=\"n.\" data-en=\"a person who looks after an archive\" data-zh=\"檔案管理員\">archivist<\/a> later found that they had been removed according to a cataloging plan.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The intern first assumed the missing labels were _______ , but the archivist later found that they had been removed according to a cataloging plan.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這名實習生起初以為那些遺失的標籤是 _______，但檔案管理員後來發現，它們是依照編目計畫被移除的。", "opts": {"A": "useful", "B": "visible", "C": "accidental", "D": "obvious"}, "optsZh": {"A": "useful（有用的）", "B": "visible（看得見的）", "C": "accidental（意外的；偶然的）", "D": "obvious（明顯的）"}, "answer": "C", "expl": "Accidental contrasts with deliberate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "helpful; able to be used well", "zh": "有用的", "word": "useful"}, "B": {"pos": "adj.", "en": "able to be seen", "zh": "看得見的", "word": "visible"}, "C": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "D": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的", "word": "obvious"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Researchers wondered whether the bird&#x27;s repeated tapping was merely _______ until video evidence showed that it tapped only to summon another bird.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Researchers wondered whether the bird's repeated tapping was merely _______ until video evidence showed that it tapped only to summon another bird.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。研究人員曾懷疑這隻鳥反覆的敲擊是否只是 _______，直到影像證據顯示牠只有在召喚另一隻鳥時才會敲擊。", "opts": {"A": "noticeable", "B": "careful", "C": "ingenious", "D": "random"}, "optsZh": {"A": "noticeable（明顯的；顯而易見的）", "B": "careful（小心的；謹慎的）", "C": "ingenious（巧妙的；聰明的）", "D": "random（隨機的；無規律的）"}, "answer": "D", "expl": "Random means not intentional.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "easy to notice", "zh": "明顯的；顯而易見的", "word": "noticeable"}, "B": {"pos": "adj.", "en": "giving close attention to avoid mistakes", "zh": "小心的；謹慎的", "word": "careful"}, "C": {"pos": "adj.", "en": "clever and inventive", "zh": "巧妙的；有獨創性的", "word": "ingenious"}, "D": {"pos": "adj.", "en": "happening without a plan or pattern", "zh": "隨機的；無規律的", "word": "random"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The arrangement of stones seemed purposeful, yet the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> first tested whether it could have been _______ , caused by flooding rather than human design.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The arrangement of stones seemed purposeful, yet the archaeologists first tested whether it could have been _______ , caused by flooding rather than human design.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這些石頭的排列看似有其目的，但考古學家起初先檢驗它是否可能是 _______，也就是由洪水而非人為設計所造成的。", "opts": {"A": "documented", "B": "skillful", "C": "visible", "D": "chance"}, "optsZh": {"A": "documented（有文件記載的）", "B": "skillful（熟練的；技巧高超的）", "C": "visible（看得見的）", "D": "chance（偶然；巧合）"}, "answer": "D", "expl": "Chance means accidental.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "recorded in writing or other evidence", "zh": "有文件記載的", "word": "documented"}, "B": {"pos": "adj.", "en": "having or showing skill", "zh": "熟練的；技巧高超的", "word": "skillful"}, "C": {"pos": "adj.", "en": "able to be seen", "zh": "看得見的", "word": "visible"}, "D": {"pos": "n.", "en": "something happening by luck rather than by design", "zh": "偶然；巧合", "word": "chance"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: accidental rather than deliberate.", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. At first, the chemical change was dismissed as _______ contamination, but repeated trials showed that the reaction was a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"able to be known in advance\" data-zh=\"可預測的\">predictable<\/a> result of the method.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. At first, the chemical change was dismissed as _______ contamination, but repeated trials showed that the reaction was a predictable result of the method.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。起初，這種化學變化被認為只是 _______ 污染而遭到忽視，但反覆試驗顯示，這個反應是該方法可預期的結果。", "opts": {"A": "unintentional", "B": "obvious", "C": "fascinating", "D": "observable"}, "optsZh": {"A": "unintentional（無意的；非故意的）", "B": "obvious（明顯的）", "C": "fascinating（迷人的；引人入勝的）", "D": "observable（可觀察到的）"}, "answer": "A", "expl": "Unintentional means accidental.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not done on purpose", "zh": "無意的；非故意的", "word": "unintentional"}, "B": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的", "word": "obvious"}, "C": {"pos": "adj.", "en": "extremely interesting", "zh": "迷人的；引人入勝的", "word": "fascinating"}, "D": {"pos": "adj.", "en": "able to be seen or noticed", "zh": "可觀察到的", "word": "observable"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=repudiation\" target=\"_blank\" rel=\"noopener\" data-w=\"repudiation\" data-pos=\"n.\" data-en=\"the act of rejecting or refusing to accept something\" data-zh=\"否定；拒絕接受\">repudiation<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industrialization\" target=\"_blank\" rel=\"noopener\" data-w=\"industrialization\" data-pos=\"n.\" data-en=\"the development of industries in a country\" data-zh=\"工業化\">industrialization<\/a> is _______ the Kelmscott editions&#x27; use of handmade materials and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a> ornamentation reminiscent of medieval <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a>: these meticulously handcrafted elements exemplify the artistry involved.", "bodyPlain": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris's repudiation of industrialization is _______ the Kelmscott editions' use of handmade materials and intricate ornamentation reminiscent of medieval manuscripts: these meticulously handcrafted elements exemplify the artistry involved.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "1891 年，設計藝術家 William Morris 共同創立了 Kelmscott Press，這家出版社以前工業時代的方法印製書籍版本。歷史學家認為，Morris 對工業化的摒棄 _______ Kelmscott 版本使用手工材料以及令人聯想到中世紀手抄本的繁複裝飾：這些精心手工製作的元素正是其中藝術性的典範。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "insensible to（對……無感覺；未察覺）", "B": "manifest in（體現於……；顯現在……）", "C": "scrutinized by（受到……仔細審視）", "D": "complicated by（因……而變得複雜）"}, "answer": "B", "expl": "The handmade materials and medieval-style ornamentation exemplify Morris's rejection of industrialization, so that rejection is 'manifest in' (clearly shown in) the editions.", "explZh": "手工材料與中世紀風格的裝飾正體現了 Morris 對工業化的排斥，所以這種排斥「manifest in」（明顯表現在）這些版本中。", "defs": {"A": {"pos": "adj. phr.", "en": "not aware of or not feeling", "zh": "對……無感覺；未察覺", "word": "insensible to"}, "B": {"pos": "adj. phr.", "en": "clearly shown or expressed in", "zh": "體現於……；顯現在……", "word": "manifest in"}, "C": {"pos": "adj. phr.", "en": "examined closely by", "zh": "受到……仔細審視", "word": "scrutinized by"}, "D": {"pos": "adj. phr.", "en": "made more difficult or confusing by", "zh": "因……而變得複雜", "word": "complicated by"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The architect&#x27;s rejection of uniform corporate design is _______ the building&#x27;s irregular windows, handmade tiles, and locally carved doors.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The architect's rejection of uniform corporate design is _______ the building's irregular windows, handmade tiles, and locally carved doors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位建築師對千篇一律企業設計的拒斥，_______ 這棟建築不規則的窗戶、手工磁磚與在地雕刻的門。", "opts": {"A": "scrutinized by", "B": "evident in", "C": "insensible to", "D": "concealed from"}, "optsZh": {"A": "scrutinized by（受到……仔細審視）", "B": "evident in（在……中顯而易見）", "C": "insensible to（對……無感覺；未察覺）", "D": "concealed from（對……隱瞞）"}, "answer": "B", "expl": "Evident in means visible or manifest in.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "examined closely by", "zh": "受到……仔細審視", "word": "scrutinized by"}, "B": {"pos": "adj. phr.", "en": "clearly seen in", "zh": "在……中顯而易見", "word": "evident in"}, "C": {"pos": "adj. phr.", "en": "not aware of or not feeling", "zh": "對……無感覺；未察覺", "word": "insensible to"}, "D": {"pos": "adj. phr.", "en": "kept hidden from", "zh": "對……隱瞞", "word": "concealed from"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The editor&#x27;s preference for plain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a> is _______ the journal&#x27;s short sentences, concrete examples, and avoidance of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> terminology.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The editor's preference for plain language is _______ the journal's short sentences, concrete examples, and avoidance of specialized terminology.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位編輯對淺白語言的偏好，_______ 這份期刊簡短的句子、具體的例子以及對專業術語的避免。", "opts": {"A": "manifest in", "B": "irrelevant to", "C": "borrowed from", "D": "complicated by"}, "optsZh": {"A": "manifest in（體現於……；顯現在……）", "B": "irrelevant to（與……無關）", "C": "borrowed from（借自……）", "D": "complicated by（因……而變得複雜）"}, "answer": "A", "expl": "Manifest in means clearly shown in.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "clearly shown or expressed in", "zh": "體現於……；顯現在……", "word": "manifest in"}, "B": {"pos": "adj. phr.", "en": "not connected or important to", "zh": "與……無關", "word": "irrelevant to"}, "C": {"pos": "adj. phr.", "en": "taken or adopted from another source", "zh": "借自……", "word": "borrowed from"}, "D": {"pos": "adj. phr.", "en": "made more difficult or confusing by", "zh": "因……而變得複雜", "word": "complicated by"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/eng
