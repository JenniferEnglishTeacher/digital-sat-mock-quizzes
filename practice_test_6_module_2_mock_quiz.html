n of iron than the stars they orbit.\nB) One rocky planet has a thin atmosphere.\nC) The method used to study stars requires a telescope.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "16.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Many performers learned songs from relatives.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Some songs use a meter also found in older European poetry.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The program took place in a community.\nD) The table includes more than one year.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: limited logging may help forest health.", "original": "The practice of logging (cutting down trees for commercial and other uses) is often thought to be at odds with forest conservation (the work of preserving forests). However, a massive study in forest management and preservation spanning 700,000 hectares in Oregon's Malheur National Forest calls that view into question. So far, results of the study suggest that forest plots that have undergone limited logging (the careful removal of a controlled number of trees) may be more robust than plots that haven't been logged at all. These results, in turn, suggest that _______\n\nWhich choice most logically completes the text?\nA) logging may be useful for maintaining healthy forests, provided it is limited.\nB) other forest management strategies are more effective than limited logging.\nC) as time passes, it will be difficult to know whether limited logging has any benefits.\nD) the best way to support forest health may be to leave large forests entirely untouched.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) human traders must have transported the seeds recently.\nB) the island populations were domesticated before mainland populations.\nC) the plant probably reached the islands without human assistance.\nD) all island plants descended from a single cultivated variety.", "answer": "C", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the beetles were domesticated by island communities.\nB) the island beetles must be younger than the coastal beetles.\nC) humans carried the beetles to the island during early trade voyages.\nD) the beetles were likely introduced by natural dispersal rather than by humans.", "answer": "D", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the song was probably not introduced to the archipelago by that migration.\nB) all versions of the song are identical.\nC) the song could not have changed after the migration.\nD) the migration must have begun earlier than any other human movement.", "answer": "A", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the crop was first domesticated on the island.\nB) human settlement probably did not account for the plant's original arrival on the island.\nC) mainland farmers acquired the crop from island communities.\nD) the island variety must be genetically identical to wild mainland plants.", "answer": "B", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) human activity made the populations genetically identical.\nB) the snails likely spread through an earlier nonhuman mechanism.\nC) boats probably explain every modern snail population.\nD) the lakes did not contain snails until boating began.", "answer": "B", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "original": "Even with the widespread adoption of personal computers, many authors still choose to write and revise their novels by hand and only then transcribe the final version on a computer. It may be tempting to speculate about how a novel written this way would be affected if it had been exclusively typed instead, but each novel is a unique entity resulting from a specific set of circumstances. Therefore, _______\n\nWhich choice most logically completes the text?\nA) in order to increase their efficiency, authors who currently write their novels largely by hand should instead work only on a computer.\nB) authors who do most of their drafting and revising by hand likely have more success than those who work entirely on a computer.\nC) novels written by hand take less time to produce, on average, than novels written on a computer do.\nD) there is no way to reasonably evaluate how a work would be different if it had been written by other means.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) human traders must have transported the seeds recently.\nB) the plant probably reached the islands without human assistance.\nC) all island plants descended from a single cultivated variety.\nD) the island populations were domesticated before mainland populations.", "answer": "B", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "18.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the beetles were domesticated by island communities.\nB) humans carried the beetles to the island during early trade voyages.\nC) the beetles were likely introduced by natural dispersal rather than by humans.\nD) the island beetles must be younger than the coastal beetles.", "answer": "C", "explanation": "The timing rules out human introduction."}, {"id": "18.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the song could not have changed after the migration.\nB) all versions of the song are identical.\nC) the migration must have begun earlier than any other human movement.\nD) the song was probably not introduced to the archipelago by that migration.", "answer": "D", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "18.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) human settlement probably did not account for the plant's original arrival on the island.\nB) mainland farmers acquired the crop from island communities.\nC) the crop was first domesticated on the island.\nD) the island variety must be genetically identical to wild mainland plants.", "answer": "A", "explanation": "The plant's arrival predates human settlement."}, {"id": "18.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the lakes did not contain snails until boating began.\nB) boats probably explain every modern snail population.\nC) the snails likely spread through an earlier nonhuman mechanism.\nD) human activity made the populations genetically identical.", "answer": "C", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "original": "In forecasting weather events, meteorologists sometimes discuss the role of atmospheric rivers. What are atmospheric rivers, and how _______ Part of the water cycle, atmospheric rivers are narrow channels of moisture moving through the atmosphere. In certain conditions, these \"rivers\" can release some of their moisture as precipitation.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) do they affect our weather.\nB) they do affect our weather.\nC) do they affect our weather?\nD) they do affect our weather?", "generated": [{"id": "19.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) published\nC) to publish\nD) having published", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "19.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device--\nC) device\nD) device,", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "19.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) that\nC) this\nD) it", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "19.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family, and\nB) family,\nC) family and\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "19.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free, in part because,\nC) free in part because\nD) free, in part because:", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "original": "One of the few African American global explorers during the turn of the 20th century, _______\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) Matthew Henson made several treks across Greenland between 1891 and 1909.\nB) 1891 and 1909 were the years between which Matthew Henson made several treks across Greenland.\nC) Greenland was where Matthew Henson made several treks between 1891 and 1909.\nD) several treks across Greenland were made by Matthew Henson between 1891 and 1909.", "generated": [{"id": "20.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) published\nB) having published\nC) publishing\nD) to publish", "answer": "A", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "20.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device\nB) device:\nC) device,\nD) device--", "answer": "A", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "20.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) this\nB) that\nC) them\nD) it", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "20.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family\nC) family,\nD) family, and", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "20.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because,\nB) free in part because\nC) free, in part because:\nD) free. In part because", "answer": "D", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 21, "concept": "Grammar: introductory participial phrase must modify tapestries.", "original": "Woven from recycled yarn and hand tufted using a carpet weaving technique passed down by the artist's Turkish grandmother, _______ so lush and tactilely inviting that you are tempted to reach out and touch them.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) the topological tapestries of Argentine textile artist Alexandra Kehayoglou are\nB) the Argentine textile artist Alexandra Kehayoglou creates topological tapestries that are\nC) when she creates her topological tapestries, Argentine textile artist Alexandra Kehayoglou makes them\nD) Alexandra Kehayoglou is an Argentine textile artist whose topological tapestries are", "generated": [{"id": "21.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) having published\nC) published\nD) to publish", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "21.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device\nC) device--\nD) device:", "answer": "B", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "21.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) this\nB) that\nC) it\nD) them", "answer": "D", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "21.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family, and\nC) family and\nD) family,", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "21.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free, in part because:\nC) free, in part because,\nD) free in part because", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 22, "concept": "Grammar: semicolon separates two independent clauses.", "original": "Physical materials can be classified by how much light passes through them. Clear glass, which is classified as transparent, allows all (or almost all) light to pass _______ wax paper, which is classified as translucent, allows only some light to pass through.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) through,\nB) through\nC) through;\nD) through and", "generated": [{"id": "22.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) having published\nC) to publish\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "22.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials di rueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family, and\nC) family,\nD) family and", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "22.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free. In part because\nC) free in part because\nD) free, in part because,", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 23, "concept": "Grammar: semicolons separate complex list items.", "original": "Using natural debris, such as dried _______ such as plastic bags; and more traditional art supplies, such as tree glue, Ghanaian artist Ed Franklin Gavua creates his striking Yiiiiikakaii African masks, which he hopes can help viewers rethink how waste is used in their communities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) leaves, man-made trash:\nB) leaves; man-made trash,\nC) leaves, man-made trash,\nD) leaves; man-made trash;", "generated": [{"id": "23.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample i
