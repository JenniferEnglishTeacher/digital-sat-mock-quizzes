tated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free. In part because", "B": "free, in part because,", "C": "free in part because", "D": "free, in part because:"}, "optsZh": {"A": "free. In part because（句號斷句 → 後句僅有從屬子句，成為句子片段）", "B": "free, in part because,（because 後多加逗號 → 不當隔開連接詞與其子句）", "C": "free in part because（不加標點，直接以 in part because 連接原因子句）", "D": "free, in part because:（because 後加冒號 → 不當隔開連接詞與其子句）"}, "answer": "C", "expl": "'In part because...' is a dependent clause explaining why it took three days, so it attaches to the main clause without punctuation; a period would leave a fragment.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "For thousands of years, humans have used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=domesticated\" target=\"_blank\" rel=\"noopener\" data-w=\"domesticated\" data-pos=\"adj.\" data-en=\"(of animals) tamed and kept by humans\" data-zh=\"馴化的；家養的\">domesticated<\/a> goats (Capra hircus) to clear land of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unwanted\" target=\"_blank\" rel=\"noopener\" data-w=\"unwanted\" data-pos=\"adj.\" data-en=\"not desired or needed\" data-zh=\"不想要的；多餘的\">unwanted<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>. When it comes to their diets, goats are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=notoriously\" target=\"_blank\" rel=\"noopener\" data-w=\"notoriously\" data-pos=\"adv.\" data-en=\"in a way that is well known, usually for something bad\" data-zh=\"出了名地；惡名昭彰地\">notoriously<\/a> _______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.", "bodyPlain": "For thousands of years, humans have used domesticated goats (Capra hircus) to clear land of unwanted vegetation. When it comes to their diets, goats are notoriously _______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "數千年來，人類一直利用馴化的山羊（Capra hircus）來清除土地上不需要的植被。說到飲食，山羊是出了名的 _______ 牠們會吞食各種灌木和雜草，幾乎不會留下任何植物的任何部分。", "opts": {"A": "indiscriminate and", "B": "indiscriminate,", "C": "indiscriminate", "D": "indiscriminate:"}, "optsZh": {"A": "indiscriminate and（只用 and 未加逗號連接兩個獨立子句 → 錯誤）", "B": "indiscriminate,（逗號 → 造成逗號連接錯誤）", "C": "indiscriminate（不加標點 → 兩個獨立子句直接相連，造成連寫句：錯誤）", "D": "indiscriminate:（冒號，後接說明 goats 不挑食的獨立子句：正確）"}, "answer": "D", "expl": "The second clause explains what 'indiscriminate' means, so a colon correctly introduces that explanation between two independent clauses.", "explZh": "後半句說明「不挑食」的具體意思，所以用冒號引出解釋，連接兩個獨立子句。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "having published", "B": "published", "C": "publishing", "D": "to publish"}, "optsZh": {"A": "having published（現在分詞完成式 → 句子缺少主要動詞：錯誤）", "B": "published（過去式動詞，作為主詞 the research team 的主要動詞：正確）", "C": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device--", "C": "device,", "D": "device"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞：錯誤）", "B": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "C": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "D": "device（不加標點：主詞 the pins inside the device 與動詞 strike 之間不可斷開：正確）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "that", "C": "them", "D": "it"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices：錯誤）", "B": "that（單數指示代名詞 → 指涉複數 devices：錯誤）", "C": "them（複數受格代名詞，指涉 the devices：正確）", "D": "it（單數代名詞 → 指涉複數 calculators/devices：錯誤）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family", "B": "family, and", "C": "family and", "D": "family,"}, "optsZh": {"A": "family（不加標點：同位語 a family saga… 結尾未以逗號收尾）", "B": "family, and（逗號 + and → 主詞與動詞被不當斷開，句子結構錯誤）", "C": "family and（加 and → 同位語後多出連接詞，句子結構錯誤）", "D": "family,（逗號，結束同位語 a family saga centered on the Trueba family，再接動詞 often introduces）"}, "answer": "D", "expl": "The appositive 'a family saga centered on the Trueba family' must be closed with a comma before the verb 'often introduces.'", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Grammar: colon introduces explanation.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because:", "B": "free in part because", "C": "free. In part because", "D": "free, in part because,"}, "optsZh": {"A": "free, in part because:（because 後加冒號 → 不當隔開連接詞與其子句）", "B": "free in part because（不加標點，直接以 in part because 連接原因子句）", "C": "free. In part because（句號斷句 → 後句僅有從屬子句，成為句子片段）", "D": "free, in part because,（because 後多加逗號 → 不當隔開連接詞與其子句）"}, "answer": "B", "expl": "'In part because...' is a dependent clause explaining why it took three days, so it attaches to the main clause without punctuation; a period would leave a fragment.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of Byropsis algae produces toxins to avoid being eaten by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a>. However, in some cases, the toxins the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organism<\/a> uses to protect itself from predation actually _______ its attractiveness to predators. The Hawaiian sea slug, for example, not only <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tolerate\" target=\"_blank\" rel=\"noopener\" data-w=\"tolerate\" data-pos=\"v.\" data-en=\"to accept something unpleasant without complaint\" data-zh=\"容忍\">tolerates<\/a> Byropsis toxins but actually uses them for protection in the same way the algae does.", "bodyPlain": "A species of Byropsis algae produces toxins to avoid being eaten by predators. However, in some cases, the toxins the organism uses to protect itself from predation actually _______ its attractiveness to predators. The Hawaiian sea slug, for example, not only tolerates Byropsis toxins but actually uses them for protection in the same way the algae does.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "某種 Byropsis 藻類會產生毒素，以避免被掠食者吃掉。然而，在某些情況下，這種生物用來保護自己免於被捕食的毒素，實際上反而 _______ 它對掠食者的吸引力。例如，夏威夷海蛞蝓不僅能耐受 Byropsis 的毒素，甚至還會像這種藻類一樣利用這些毒素來保護自己。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "is increasing（單數現在進行式 → 主詞 toxins 為複數：錯誤）", "B": "increase（複數動詞，與複數主詞 toxins 一致：正確）", "C": "increases（單數動詞 → 主詞 toxins 為複數：錯誤）", "D": "has increased（現在完成式單數動詞 → 主詞 toxins 為複數：錯誤）"}, "answer": "B", "expl": "The subject is the plural 'toxins' (not 'organism' or 'predation'), so the plural verb 'increase' is needed.", "explZh": "主詞是複數的「toxins」（不是 organism 或 predation），所以要用複數動詞「increase」。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "published", "B": "publishing", "C": "to publish", "D": "having published"}, "optsZh": {"A": "published（過去式動詞，作為主詞 the research team 的主要動詞：正確）", "B": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "to publish（不定詞 → 句子缺少主要動詞：錯誤）", "D": "having published（現在分詞完成式 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device--", "C": "device", "D": "device,"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞：錯誤）", "B": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "C": "device（不加標點：主詞 the pins inside the device 與動詞 strike 之間不可斷開：正確）", "D": "device,（逗號 → 不當隔開主詞與動詞：錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "this", "C": "them", "D": "it"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices：錯誤）", "B": "this（單數指示代名詞 → 指涉複數 devices：錯誤）", "C": "them（複數受格代名詞，指涉 the devices：正確）", "D": "it（單數代名詞 → 指涉複數 calculators/devices：錯誤）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family and", "B": "family, and", "C": "family,", "D": "family"}, "optsZh": {"A": "family and（加 and → 同位語後多出連接詞，句子結構錯誤）", "B": "family, and（逗號 + and → 主詞與動詞被不當斷開，句子結構錯誤）", "C": "family,（逗號，結束同位語 a family saga centered on the Trueba family，再接動詞 often introduces）", "D": "family（不加標點：同位語 a family saga… 結尾未以逗號收尾）"}, "answer": "C", "expl": "The appositive 'a family saga centered on the Trueba family' must be closed with a comma before the verb 'often introduces.'", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Grammar: plural subject toxins requires increase.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because:", "B": "free. In part because", "C": "free in part because", "D": "free, in part because,"}, "optsZh": {"A": "free, in part because:（because 後加冒號 → 不當隔開連接詞與其子句）", "B": "free. In part because（句號斷句 → 後句僅有從屬子句，成為句子片段）", "C": "free in part because（不加標點，直接以 in part because 連接原因子句）", "D": "free, in part because,（because 後多加逗號 → 不當隔開連接詞與其子句）"}, "answer": "C", "expl": "'In part because...' is a dependent clause explaining why it took three days, so it attaches to the main clause without punctuation; a period would leave a fragment.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "After <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=permission\" target=\"_blank\" rel=\"noopener\" data-w=\"permission\" data-pos=\"n.\" data-en=\"official agreement to let someone do something\" data-zh=\"許可\">permissions<\/a> are granted, a typical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of ancient remains\" data-zh=\"考古的\">archaeological<\/a> dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. _______ the artifacts are removed, cataloged, and analyzed in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a>.", "bodyPlain": "After appropriate permissions are granted, a typical archaeological dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. _______ the artifacts are removed, cataloged, and analyzed in a laboratory.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在取得適當的許可之後，典型的考古挖掘工作會先由測量員為挖掘地點繪製詳細的網格圖。接著，小心地挖掘該地點，並將發現的所有文物記錄下來，標示在遺址網格圖上。_______ 這些文物會被移出，並在實驗室中編目與分析。", "opts": {"A": "For instance,", "B": "On the contrary,", "C": "Earlier,", "D": "Finally,"}, "optsZh": {"A": "For instance,（例如：引出舉例 → 錯誤）", "B": "On the contrary,（相反地：表反駁前述 → 錯誤）", "C": "Earlier,（較早之前：表時間在前 → 錯誤）", "D": "Finally,（最後：表步驟中的最後一步：正確）"}, "answer": "D", "expl": "The text lists steps in order (grid, digging, recording); removing and analyzing the artifacts is the last step, so 'Finally' fits.", "explZh": "本文依序說明步驟（畫網格、挖掘、記錄），移出並分析文物是最後一步，所以用「Finally」。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> project begins with a condition report. Next, conservators clean the object and stabilize fragile areas. _______ the object is photographed, cataloged, and returned to storage.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A museum conservation project begins with a condition report. Next, conservators clean the object and stabilize fragile areas. _______ the object is photographed, cataloged, and returned to storage.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。博物館的文物保存計畫以一份狀況報告開始。接下來，文物修護師會清潔物件，並加固脆弱的部位。_______ 物件會被拍照、編目，然後送回庫房存放。", "opts": {"A": "Finally,", "B": "Earlier,", "C": "For instance,", "D": "On the contrary,"}, "optsZh": {"A": "Finally,（最後：表步驟中的最後一步：正確）", "B": "Earlier,（較早之前：表時間在前 → 錯誤）", "C": "For instance,（例如：引出舉例 → 錯誤）", "D": "On the contrary,（相反地：表反駁前述 → 錯誤）"}, "answer": "A", "expl": "Finally marks the last step.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. To prepare a field survey, researchers first mark the study area and collect baseline <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a>. They then record <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> at regular intervals. _______ the data are entered into a shared database.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. To prepare a field survey, researchers first mark the study area and collect baseline measurements. They then record observations at regular intervals. _______ the data are entered into a shared database.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。為了準備一項田野調查，研究人員首先標定研究區域並收集基準測量數據。接著，他們會定期記錄觀察結果。_______ 這些資料會被輸入一個共用的資料庫。", "opts": {"A": "Nevertheless,", "B": "Earlier,", "C": "Finally,", "D": "For example,"}, "optsZh": {"A": "Nevertheless,（儘管如此：表轉折讓步 → 錯誤）", "B": "Earlier,（較早之前：表時間在前 → 錯誤）", "C": "Finally,（最後：表步驟中的最後一步：正確）", "D": "For example,（例如：引出舉例 → 錯誤）"}, "answer": "C", "expl": "Finally completes the sequence.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The restoration team removed old varnish, filled cracks, and matched missing pigments. _______ the painting was sealed with a protective coating.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The restoration team removed old varnish, filled cracks, and matched missing pigments. _______ the painting was sealed with a protective coating.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。修復團隊去除了舊的亮光漆、填補了裂縫，並調配出缺失的顏料。_______ 這幅畫被塗上一層保護塗層加以密封。", "opts": {"A": "For instance,", "B": "Earlier,", "C": "On the contrary,", "D": "Finally,"}, "optsZh": {"A": "For instance,（例如：引出舉例 → 錯誤）", "B": "Earlier,（較早之前：表時間在前 → 錯誤）", "C": "On the contrary,（相反地：表反駁前述 → 錯誤）", "D": "Finally,（最後：表步驟中的最後一步：正確）"}, "answer": "D", "expl": "Finally indicates the final action.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> sample is first labeled and weighed; afterward, it is heated, cooled, and tested for residue. _______ the results are reviewed by a second technician.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A laboratory sample is first labeled and weighed; afterward, it is heated, cooled, and tested for residue. _______ the results are reviewed by a second technician.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。實驗室樣本首先會被貼上標籤並秤重；之後，它會被加熱、冷卻並檢測殘留物。_______ 結果會由第二位技術人員審查。", "opts": {"A": "Earlier,", "B": "Finally,", "C": "Nevertheless,", "D": "For example,"}, "optsZh": {"A": "Earlier,（較早之前：表時間在前 → 錯誤）", "B": "Finally,（最後：表步驟中的最後一步：正確）", "C": "Nevertheless,（儘管如此：表轉折讓步 → 錯誤）", "D": "For example,（例如：引出舉例 → 錯誤）"}, "answer": "B", "expl": "Finally marks the last step.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: finally marks last step in sequence.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. At the start of the workshop, students draft a research question. They then locate sources, take notes, and revise their claims. _______ they present their findings to the class.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. At the start of the workshop, students draft a research question. They then locate sources, take notes, and revise their claims. _______ they present their findings to the class.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。在工作坊一開始，學生們先擬定一個研究問題。接著，他們尋找資料來源、做筆記並修正自己的論點。_______ 他們向全班發表研究成果。", "opts": {"A": "For instance,", "B": "On the contrary,", "C": "Earlier,", "D": "Finally,"}, "optsZh": {"A": "For instance,（例如：引出舉例 → 錯誤）", "B": "On the contrary,（相反地：表反駁前述 → 錯誤）", "C": "Earlier,（較早之前：表時間在前 → 錯誤）", "D": "Finally,（最後：表步驟中的最後一步：正確）"}, "answer": "D", "expl": "Finally signals completion of the sequence.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "The liquid metals in Earth&#x27;s core <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulate<\/a> constantly, and this circulation <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generate\" target=\"_blank\" rel=\"noopener\" data-w=\"generate\" data-pos=\"v.\" data-en=\"to produce\" data-zh=\"產生\">generates<\/a> electrical currents that flow between Earth&#x27;s North and South <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=magnetic\" target=\"_blank\" rel=\"noopener\" data-w=\"magnetic\" data-pos=\"adj.\" data-en=\"relating to a magnet or magnetism\" data-zh=\"磁的\">magnetic<\/a> poles. These electrical currents, _______ create a barrier around Earth that protects us from radiation and charged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particles<\/a> coming from space.", "bodyPlain": "The liquid metals in Earth's core circulate constantly, and this circulation generates electrical currents that flow between Earth's North and South magnetic poles. These electrical currents, _______ create a barrier around Earth that protects us from radiation and charged particles coming from space.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "地球核心中的液態金屬不斷循環流動，而這種循環會產生在地球南北磁極之間流動的電流。這些電流 _______ 會在地球周圍形成一道屏障，保護我們免受來自太空的輻射與帶電粒子侵害。", "opts": {"A": "in turn,", "B": "likewise,", "C": "nevertheless,", "D": "in reality,"}, "optsZh": {"A": "in turn,（進而：表連鎖因果中的下一步：正確）", "B": "likewise,（同樣地：表相似 → 錯誤）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "in reality,（實際上：表與表象相反 → 錯誤）"}, "answer": "A", "expl": "The circulation generates currents, and those currents then create a protective barrier — a result following from the previous step, so 'in turn' fits.", "explZh": "金屬循環產生電流，而這些電流又進一步形成保護屏障——是前一步驟所引發的結果，所以用「in turn」（進而）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Warm ocean water evaporates and forms humid air. That humid air rises and cools, _______ producing clouds that can later release rain.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Warm ocean water evaporates and forms humid air. That humid air rises and cools, _______ producing clouds that can later release rain.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。溫暖的海水蒸發，形成潮濕的空氣。這些潮濕的空氣上升並冷卻，_______ 形成之後可能降雨的雲。", "opts": {"A": "in turn,", "B": "likewise,", "C": "nevertheless,", "D": "in reality,"}, "optsZh": {"A": "in turn,（進而：表連鎖因果中的下一步：正確）", "B": "likewise,（同樣地：表相似 → 錯誤）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "in reality,（實際上：表與表象相反 → 錯誤）"}, "answer": "A", "expl": "In turn shows the resulting effect.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The new rail line reduced travel time between the towns. Shorter trips, _______ encouraged more commuters to use public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The new rail line reduced travel time between the towns. Shorter trips, _______ encouraged more commuters to use public transportation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。新的鐵路線縮短了兩鎮之間的交通時間。較短的車程 _______ 鼓勵了更多通勤者使用大眾運輸。", "opts": {"A": "for example,", "B": "nevertheless,", "C": "in turn,", "D": "likewise,"}, "optsZh": {"A": "for example,（例如：表舉例 → 錯誤）", "B": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "C": "in turn,（進而：表連鎖因果中的下一步：正確）", "D": "likewise,（同樣地：表相似 → 錯誤）"}, "answer": "C", "expl": "In turn links one effect to another.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The root system holds soil in place during storms. This stabilization, _______ reduces erosion along the riverbank.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The root system holds soil in place during storms. This stabilization, _______ reduces erosion along the riverbank.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。根系在暴風雨期間能固定土壤。這種穩定作用 _______ 減少了河岸沿線的侵蝕。", "opts": {"A": "however,", "B": "in turn,", "C": "in reality,", "D": "similarly,"}, "optsZh": {"A": "however,（然而：表轉折 → 錯誤）", "B": "in turn,（進而：表連鎖因果中的下一步：正確）", "C": "in reality,（實際上：表與表象相反 → 錯誤）", "D": "similarly,（同樣地：表相似 → 錯誤）"}, "answer": "B", "expl": "In turn signals a consequence.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The software compresses large image files. The smaller files, _______ require less storage space and can be sent more quickly.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The software compresses large image files. The smaller files, _______ require less storage space and can be sent more quickly.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這套軟體能壓縮大型圖片檔。較小的檔案 _______ 需要的儲存空間較少，也能更快傳送。", "opts": {"A": "nevertheless,", "B": "in turn,", "C": "likewise,", "D": "for instance,"}, "optsZh": {"A": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "B": "in turn,（進而：表連鎖因果中的下一步：正確）", "C": "likewise,（同樣地：表相似 → 錯誤）", "D": "for instance,（例如：表舉例 → 錯誤）"}, "answer": "B", "expl": "In turn marks a result.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: in turn shows resulting effect.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The policy increased the number of bus routes. Greater route coverage, _______ made it easier for residents without cars to reach workplaces.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The policy increased the number of bus routes. Greater route coverage, _______ made it easier for residents without cars to reach workplaces.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這項政策增加了公車路線的數量。更廣的路線涵蓋範圍 _______ 讓沒有汽車的居民更容易到達工作地點。", "opts": {"A": "nevertheless,", "B": "instead,", "C": "in reality,", "D": "in turn,"}, "optsZh": {"A": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "B": "instead,（反而：表替代 → 錯誤）", "C": "in reality,（實際上：表與表象相反 → 錯誤）", "D": "in turn,（進而：表連鎖因果中的下一步：正確）"}, "answer": "D", "expl": "In turn shows a chain of effects.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "Biographer Michael Gorra notes that the novelist Henry James &quot;lived in a world of second thoughts,&quot; frequently <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tinkering\" target=\"_blank\" rel=\"noopener\" data-w=\"tinkering\" data-pos=\"n.\" data-en=\"making small changes to something to try to improve it\" data-zh=\"小修小改；修補\">tinkering<\/a> with his novels and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">stories<\/a> after their initial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publication<\/a>. However, the differences between the 1881 first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=edition\" target=\"_blank\" rel=\"noopener\" data-w=\"edition\" data-pos=\"n.\" data-en=\"a particular version of a book printed at one time\" data-zh=\"版本；版次\">edition<\/a> and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James&#x27;s standards; _______ some critics regard the two editions as two different novels altogether.", "bodyPlain": "Biographer Michael Gorra notes that the novelist Henry James \"lived in a world of second thoughts,\" frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James's standards; _______ some critics regard the two editions as two different novels altogether.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "傳記作家 Michael Gorra 指出，小說家 Henry James「活在一個不斷重新思考的世界裡」，經常在小說和短篇故事初次出版後再加以修改。然而，他的小說《A Portrait of a Lady》1881 年初版與 1908 年版本之間的差異極大，即使以 James 的標準來看也是如此；_______ 有些評論家認為這兩個版本完全是兩部不同的小說。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "by contrast,（相較之下：表對比 → 錯誤）", "B": "in fact,（事實上：進一步強化前句的說法：正確）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "in other words,（換句話說：表重述 → 錯誤）"}, "answer": "B", "expl": "The second clause strengthens the claim that the differences are extreme (critics see two different novels), so 'in fact' fits.", "explZh": "後半句加強「差異極大」的說法（評論家甚至視為兩部不同的小說），所以用「in fact」（事實上）。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The two recordings differ in tempo and instrumentation; _______ some listeners insist that they should be treated as separate compositions.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less cert
