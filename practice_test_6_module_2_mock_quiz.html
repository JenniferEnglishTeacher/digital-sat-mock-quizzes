ce\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一則故事描寫一位職員，他會注意到別人早已核准的帳簿中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的嚴謹精確才得以維持下去。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk intentionally creates errors.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家企業因過度謹慎而失敗。", "B": "這名職員故意製造錯誤。", "C": "這名職員的細心雖然造成不便，卻很有價值。", "D": "同事們比這名職員更精確。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Inference: NH3 biosignature depends on planet type.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段文字指出，一位村落領袖在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader dislikes public meetings.", "B": "The leader is unable to reach conclusions.", "C": "The leader makes decisions without hearing others.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人不喜歡公開會議。", "B": "這位領導人無法做出結論。", "C": "這位領導人不聽取他人意見就做決定。", "D": "這位領導人重視包容性的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Inference: NH3 biosignature depends on planet type.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在初期討論時鼓勵大膽推測，但在每一項測量都經過核查之前，她絕不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She publishes claims before testing them.", "C": "She avoids working with students.", "D": "She rejects all imaginative thinking."}, "optsZh": {"A": "她兼具思想上的開放與嚴謹的標準。", "B": "她在檢驗主張之前就將其發表。", "C": "她避免與學生共事。", "D": "她排斥一切富想像力的思考。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recreation\" target=\"_blank\" rel=\"noopener\" data-w=\"recreation\" data-pos=\"n.\" data-en=\"activities done for enjoyment when not working\" data-zh=\"休閒；娛樂\">Recreation<\/a> Visits by Month to Four US <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">National<\/a> Parks during the Peak Season in 2021: a graph compares Yellowstone, Zion, Grand Canyon, and Rocky Mountain National Parks over three <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=peak-season\" target=\"_blank\" rel=\"noopener\" data-w=\"peak-season\" data-pos=\"adj.\" data-en=\"relating to the busiest time of year\" data-zh=\"旺季的\">peak-season<\/a> months. In 2021, four of the United States national parks that were among the most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visited<\/a> were Grand Canyon National Park, Rocky Mountain National Park, Yellowstone National Park, and Zion National Park. The graph shows the number of visits for recreation to each of these parks during the three-month period with the highest number of visitors. A student notes that among the parks shown in the graph, the park with the highest monthly recreation visits in all three months was _______", "bodyPlain": "Recreation Visits by Month to Four US National Parks during the Peak Season in 2021: a graph compares Yellowstone, Zion, Grand Canyon, and Rocky Mountain National Parks over three peak-season months. In 2021, four of the United States national parks that were among the most visited were Grand Canyon National Park, Rocky Mountain National Park, Yellowstone National Park, and Zion National Park. The graph shows the number of visits for recreation to each of these parks during the three-month period with the highest number of visitors. A student notes that among the parks shown in the graph, the park with the highest monthly recreation visits in all three months was _______", "stem": "Which choice most effectively uses data from the graph to complete the text?", "stemZh": "下列哪一個選項最有效地運用圖表中的數據完成本文？", "bodyZh": "2021 年旺季期間美國四座國家公園每月的休閒遊憩造訪次數：一張圖表比較了 Yellowstone、Zion、Grand Canyon 與 Rocky Mountain 國家公園在三個旺季月份中的數據。2021 年，美國造訪人數最多的國家公園中，有四座是 Grand Canyon 國家公園、Rocky Mountain 國家公園、Yellowstone 國家公園和 Zion 國家公園。這張圖表顯示了在遊客人數最多的三個月期間，各公園的休閒遊憩造訪次數。一名學生指出，在圖表所列的公園中，三個月每月休閒遊憩造訪次數都最高的公園是 _______", "opts": {"A": "Zion National Park.", "B": "Rocky Mountain National Park.", "C": "Yellowstone National Park.", "D": "Grand Canyon National Park."}, "optsZh": {"A": "錫安國家公園（Zion National Park）。", "B": "洛磯山國家公園（Rocky Mountain National Park）。", "C": "黃石國家公園（Yellowstone National Park）。", "D": "大峽谷國家公園（Grand Canyon National Park）。"}, "answer": "D", "expl": "According to the graph, Grand Canyon National Park had the highest recreation visits in each of the three peak months.", "explZh": "根據圖表，大峽谷國家公園在三個旺季月份的遊憩造訪人次都是最高的。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的執政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The graph contains information about three regions.", "C": "The southern region was included in the survey.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "這張圖表包含三個地區的資訊。", "C": "南部地區被納入調查。", "D": "有些農民種植蔬菜，有些則種植穀物。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星更多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "The method used to study stars requires a telescope.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "用來研究恆星的方法需要望遠鏡。", "C": "研究發現，數顆岩質行星所含的鐵比例遠高於它們所環繞的恆星。", "D": "有一顆岩質行星的大氣層很稀薄。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學者主張，某項傳統是透過近期的文化交流發展而來，而不僅僅是原封不動地從遙遠國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "B": "有幾首民謠納入了當地歷史事件，以及在不同社群持續接觸後才出現的融合音樂形式。", "C": "這項傳統有多個國家的學者在研究。", "D": "許多表演者是向親戚學會這些歌曲的。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這項計畫與受過訓練的志工明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "&quot;Lines Written in Early Spring&quot; is a 1798 poem by William Wordsworth. In the poem, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speaker\" target=\"_blank\" rel=\"noopener\" data-w=\"speaker\" data-pos=\"n.\" data-en=\"the voice that talks in a poem; a person who speaks\" data-zh=\"說話者；（詩中的）敘述者\">speaker<\/a> describes having <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contradictory\" target=\"_blank\" rel=\"noopener\" data-w=\"contradictory\" data-pos=\"adj.\" data-en=\"opposing or disagreeing with each other\" data-zh=\"矛盾的；對立的\">contradictory<\/a> feelings while <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiencing<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sight\" target=\"_blank\" rel=\"noopener\" data-w=\"sight\" data-pos=\"n.\" data-en=\"something that you see\" data-zh=\"景象\">sights<\/a> and sounds of a spring day: _______", "bodyPlain": "\"Lines Written in Early Spring\" is a 1798 poem by William Wordsworth. In the poem, the speaker describes having contradictory feelings while experiencing the sights and sounds of a spring day: _______", "stem": "Which quotation from \"Lines Written in Early Spring\" most effectively illustrates the claim?", "stemZh": "下列哪一段出自〈Lines Written in Early Spring〉的引文最能有效說明這項主張？", "bodyZh": "〈Lines Written in Early Spring〉是 William Wordsworth 於 1798 年創作的一首詩。在這首詩中，說話者描述自己在感受春日景色與聲音時，內心懷有矛盾的情緒：_______", "opts": {"A": "\"Through primrose-tufts, in that sweet bower, / The periwinkle trail'd its wreathes; / And 'tis my faith that every flower / Enjoys the air it breathes.\"", "B": "\"The budding twigs spread out their fan, / To catch the breezy air; / And I must think, do all I can, / That there was pleasure there.\"", "C": "\"The birds around me hopp'd and play'd: / Their thoughts I cannot measure, / But the least motion which they made, / It seem'd a thrill of pleasure.\"", "D": "\"I heard a thousand blended notes, / While in a grove I [sat] reclined, / In that sweet mood when pleasant thoughts / Bring sad thoughts to the mind.\""}, "optsZh": {"A": "「穿過叢叢報春花，在那甜美的樹蔭下， / 長春花蔓延出它的花環； / 而我深信每一朵花 / 都享受著它所呼吸的空氣。」", "B": "「萌芽的枝條展開如扇， / 迎接輕拂的微風； / 而我不禁要想，無論如何努力， / 那裡確實存在著喜悅。」", "C": "「我身邊的鳥兒跳躍嬉戲： / 牠們的心思我無法測度， / 但牠們最細微的動作， / 似乎都是一陣欣喜的悸動。」", "D": "「我聽見千種交融的音符， / 當我斜倚在一片樹林中， / 在那甜美的心境裡，愉悅的思緒 / 卻將悲傷的念頭帶入心中。」"}, "answer": "D", "expl": "'Pleasant thoughts / Bring sad thoughts to the mind' shows the speaker feeling both pleasure and sadness — contradictory feelings — on a spring day.", "explZh": "「愉快的思緒／為心中帶來悲傷的念頭」顯示說話者在春日裡同時感到愉悅與悲傷，也就是矛盾的情感。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的執政紀錄更為重要。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這個政府從一開始就面臨經濟挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種植蔬菜，有些則種植穀物。", "C": "南部地區被納入調查。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星更多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星的大氣層很稀薄。", "C": "用來研究恆星的方法需要望遠鏡。", "D": "研究發現，數顆岩質行星所含的鐵比例遠高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學者主張，某項傳統是透過近期的文化交流發展而來，而不僅僅是原封不動地從遙遠國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "The tradition is studied by scholars in several countries.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "許多表演者是向親戚學會這些歌曲的。", "B": "這項傳統有多個國家的學者在研究。", "C": "有幾首民謠納入了當地歷史事件，以及在不同社群持續接觸後才出現的融合音樂形式。", "D": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The program took place in a community.", "C": "Both towns had some volunteers.", "D": "The table includes more than one year."}, "optsZh": {"A": "與沒有該計畫的城鎮相比，這項計畫與受過訓練的志工明顯增加有關。", "B": "這項計畫在一個社區中進行。", "C": "兩個城鎮都有一些志工。", "D": "表格包含不只一個年份。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "Mean Ratings for Patients after 21 Days<br>Global improvement: participants aware of taking a placebo 5.0; control group 3.9.<br>Symptom severity <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a>: participants aware of taking a placebo 92.00; control group 46.00.<br>Quality of life improvement: participants aware of taking a placebo 11.4; control group 5.4.<br><br>To test whether a medication is effective, scientists compare outcomes for patients taking it and patients taking a placebo. Patients normally aren&#x27;t told they&#x27;re receiving a placebo, but a research team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conduct\" target=\"_blank\" rel=\"noopener\" data-w=\"conduct\" data-pos=\"v.\" data-en=\"to organize and carry out an activity\" data-zh=\"進行；實施\">conducted<\/a> a study to see if there might be a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medical\" target=\"_blank\" rel=\"noopener\" data-w=\"medical\" data-pos=\"adj.\" data-en=\"relating to medicine or health care\" data-zh=\"醫學的；醫療的\">medical<\/a> benefit to telling them. The team used various measures to evaluate participants, with higher ratings indicating greater well-being in each measure. Compared to the mean ratings after 21 days for participants in the control group, the mean ratings for participants who were aware of taking a placebo _______", "bodyPlain": "Mean Ratings for Patients after 21 Days\nGlobal improvement: participants aware of taking a placebo 5.0; control group 3.9.\nSymptom severity reduction: participants aware of taking a placebo 92.00; control group 46.00.\nQuality of life improvement: participants aware of taking a placebo 11.4; control group 5.4.\n\nTo test whether a medication is effective, scientists compare outcomes for patients taking it and patients taking a placebo. Patients normally aren't told they're receiving a placebo, but a research team conducted a study to see if there might be a medical benefit to telling them. The team used various measures to evaluate participants, with higher ratings indicating greater well-being in each measure. Compared to the mean ratings after 21 days for participants in the control group, the mean ratings for participants who were aware of taking a placebo _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "下列哪一個選項最有效地運用表格中的數據完成這段敘述？", "bodyZh": "21 天後患者的平均評分\n整體改善程度：知道自己服用安慰劑的參與者 5.0；對照組 3.9。\n症狀嚴重度降低：知道自己服用安慰劑的參與者 92.00；對照組 46.00。\n生活品質改善：知道自己服用安慰劑的參與者 11.4；對照組 5.4。\n為了測試一種藥物是否有效，科學家會比較服用該藥物的患者與服用安慰劑的患者的結果。患者通常不會被告知自己服用的是安慰劑，但一個研究團隊進行了一項研究，想看看告知他們是否可能帶來醫療上的益處。該團隊使用多種指標來評估參與者，在每一項指標中，評分越高代表身心狀況越好。與對照組參與者 21 天後的平均評分相比，知道自己服用安慰劑的參與者的平均評分 _______", "opts": {"A": "ranged from 5.0 to 92.00, indicating that well-being varied widely from participant to participant.", "B": "were lower for two measures, with the rating for only one measure indicating greater well-being for these participants.", "C": "ranged from 3.9 to 46.00, with no rating indicating greater well-being in any measure for these participants.", "D": "were higher for all three measures, indicating greater overall well-being for these participants."}, "optsZh": {"A": "介於 5.0 到 92.00 之間，顯示健康狀態因參與者而有很大差異。", "B": "有兩項指標較低，只有一項指標的評分顯示這些參與者的健康狀態較佳。", "C": "介於 3.9 到 46.00 之間，沒有任何一項評分顯示這些參與者在任何指標上有較佳的健康狀態。", "D": "三項指標都較高，顯示這些參與者整體健康狀態較佳。"}, "answer": "D", "expl": "The placebo-aware group scored higher on all three measures (5.0 vs 3.9, 92.00 vs 46.00, 11.4 vs 5.4), indicating greater overall well-being.", "explZh": "知道自己服用安慰劑的組別在三項指標都較高（5.0 對 3.9、92.00 對 46.00、11.4 對 5.4），顯示整體身心狀況較佳。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的執政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區被納入調查。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "有些農民種植蔬菜，有些則種植穀物。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星更多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現，數顆岩質行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "有一顆岩質行星的大氣層很稀薄。", "C": "用來研究恆星的方法需要望遠鏡。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學者主張，某項傳統是透過近期的文化交流發展而來，而不僅僅是原封不動地從遙遠國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "B": "許多表演者是向親戚學會這些歌曲的。", "C": "有幾首民謠納入了當地歷史事件，以及在不同社群持續接觸後才出現的融合音樂形式。", "D": "這項傳統有多個國家的學者在研究。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "表格包含不只一個年份。", "B": "兩個城鎮都有一些志工。", "C": "這項計畫在一個社區中進行。", "D": "與沒有該計畫的城鎮相比，這項計畫與受過訓練的志工明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "As media <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumption\" target=\"_blank\" rel=\"noopener\" data-w=\"consumption\" data-pos=\"n.\" data-en=\"the amount of something that is used\" data-zh=\"使用量；消耗\">consumption<\/a> has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as &quot;news finds me&quot; (NFM), in which people passively rely on their social networks and ambient media <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> for information about current events. Homero Gil de Zuniga and Trevor Diehl examined data on a representative group of adults in the United States to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> participants&#x27; strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently near the study for Gil de Zuniga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=probability\" target=\"_blank\" rel=\"noopener\" data-w=\"probability\" data-pos=\"n.\" data-en=\"how likely it is that something will happen\" data-zh=\"機率；可能性\">probability<\/a> through an indirect effect.", "bodyPlain": "As media consumption has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as \"news finds me\" (NFM), in which people passively rely on their social networks and ambient media environments for information about current events. Homero Gil de Zuniga and Trevor Diehl examined data on a representative group of adults in the United States to determine participants' strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently near the study for Gil de Zuniga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting probability through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by Gil de Zuniga and Diehl?", "stemZh": "下列哪一項發現若為真，最能直接支持 Gil de Zuniga 和 Diehl 提出的觀點？", "bodyZh": "隨著媒體消費日益跨平台化並受到社群媒介的影響，主動獲取新聞的行為逐漸減少，取而代之的是一種稱為「新聞會找上我」（news finds me，NFM）的態度：人們被動地依賴自己的社群網絡與周遭的媒體環境來獲得時事資訊。Homero Gil de Zuniga 和 Trevor Diehl 分析了一群具代表性的美國成年人的資料，以判定參與者 NFM 態度的強度、政治知識與政治興趣。雖然在研究期間附近並沒有舉行重大選舉，使 Gil de Zuniga 和 Diehl 無法確定 NFM 與投票行為之間的因果關係，但他們確實推論，NFM 可能會透過間接效應降低投票的可能性。", "opts": {"A": "NFM attitude tends to increase in strength as major elections approach, and people are significantly more likely to vote in major elections than in minor elections.", "B": "NFM attitude has a strong negative effect on political knowledge and interest, and there is known to be a strong positive correlation between political knowledge and interest and the likelihood of voting.", "C": "Political interest is known to have a strong positive effect on likelihood of voting but shows only a weak positive effect on political knowledge, and NFM attitude shows little correlation with either political knowledge or political interest.", "D": "The likelihood of voting increases as political knowledge increases, and the relationship between NFM attitude and political knowledge tends to strengthen as the size of people's social networks increases."}, "optsZh": {"A": "NFM 態度往往隨著重大選舉的接近而增強，而人們在重大選舉中投票的可能性明顯高於小型選舉。", "B": "NFM 態度對政治知識與興趣有強烈的負面影響，而已知政治知識與興趣和投票可能性之間有強烈的正相關。", "C": "已知政治興趣對投票可能性有強烈的正面影響，但對政治知識只有微弱的正面影響，而 NFM 態度與政治知識或政治興趣幾乎都沒有相關性。", "D": "投票的可能性會隨著政治知識增加而提高，而 NFM 態度與政治知識之間的關係往往會隨著人們社交網絡規模的擴大而增強。"}, "answer": "B", "expl": "If NFM lowers political knowledge and interest, and those strongly predict voting, then NFM would reduce voting indirectly — exactly the proposed indirect effect.", "explZh": "如果 NFM 會降低政治知識與興趣，而這兩者又與投票可能性強烈正相關，那麼 NFM 就會間接降低投票機率——正是研究者提出的間接效應。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的執政紀錄更為重要。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人在上任第一個月內簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，
