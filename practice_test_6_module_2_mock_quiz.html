在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "The graph contains information about three regions.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "有些農民種植蔬菜，有些則種植穀物。", "B": "南部地區被納入調查。", "C": "這張圖表包含三個地區的資訊。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星更多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現，數顆岩質行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "有一顆岩質行星的大氣層很稀薄。", "C": "用來研究恆星的方法需要望遠鏡。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學者主張，某項傳統是透過近期的文化交流發展而來，而不僅僅是原封不動地從遙遠國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Many performers learned songs from relatives.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "這項傳統有多個國家的學者在研究。", "B": "許多表演者是向親戚學會這些歌曲的。", "C": "有幾首民謠納入了當地歷史事件，以及在不同社群持續接觸後才出現的融合音樂形式。", "D": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: NFM may reduce voting indirectly.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The table includes more than one year."}, "optsZh": {"A": "與沒有該計畫的城鎮相比，這項計畫與受過訓練的志工明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這項計畫在一個社區中進行。", "D": "表格包含不只一個年份。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "The practice of logging (cutting down trees for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> and other uses) is often thought to be at odds with forest <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> (the work of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserving<\/a> forests). However, a massive study in forest management and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preservation\" target=\"_blank\" rel=\"noopener\" data-w=\"preservation\" data-pos=\"n.\" data-en=\"the act of keeping something safe from loss or damage\" data-zh=\"保存；保護\">preservation<\/a> spanning 700,000 hectares in Oregon&#x27;s Malheur National Forest calls that view into question. So far, results of the study suggest that forest plots that have undergone limited logging (the careful removal of a controlled number of trees) may be more robust than plots that haven&#x27;t been logged at all. These results, in turn, suggest that _______", "bodyPlain": "The practice of logging (cutting down trees for commercial and other uses) is often thought to be at odds with forest conservation (the work of preserving forests). However, a massive study in forest management and preservation spanning 700,000 hectares in Oregon's Malheur National Forest calls that view into question. So far, results of the study suggest that forest plots that have undergone limited logging (the careful removal of a controlled number of trees) may be more robust than plots that haven't been logged at all. These results, in turn, suggest that _______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "伐木（為商業及其他用途砍伐樹木）的做法常被認為與森林保育（保護森林的工作）相互衝突。然而，一項在奧勒岡州 Malheur 國家森林、範圍涵蓋 70 萬公頃的大規模森林管理與保護研究，對這種看法提出了質疑。到目前為止，研究結果顯示，經過有限度伐木（謹慎地移除受控數量的樹木）的森林樣區，可能比完全未經砍伐的樣區更加健壯。這些結果進而顯示 _______", "opts": {"A": "logging may be useful for maintaining healthy forests, provided it is limited.", "B": "other forest management strategies are more effective than limited logging.", "C": "as time passes, it will be difficult to know whether limited logging has any benefits.", "D": "the best way to support forest health may be to leave large forests entirely untouched."}, "optsZh": {"A": "只要有所限制，伐木可能有助於維護健康的森林。", "B": "其他森林管理策略比有限度伐木更為有效。", "C": "隨著時間過去，將難以得知有限度伐木是否有任何益處。", "D": "維護森林健康的最佳方式可能是讓大片森林完全不受干擾。"}, "answer": "A", "expl": "Limited logging made plots more robust than unlogged plots, so logging may help maintain healthy forests, as long as it is limited.", "explZh": "有限度伐木的林地比完全未伐木的林地更健壯，所以伐木只要有所節制，可能有助於維持森林健康。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "the island populations were domesticated before mainland populations.", "C": "the plant probably reached the islands without human assistance.", "D": "all island plants descended from a single cultivated variety."}, "optsZh": {"A": "人類商人必定是最近才運送這些種子的。", "B": "島嶼族群比大陸族群更早被馴化。", "C": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "D": "所有島嶼上的植物都源自單一栽培品種。"}, "answer": "C", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "the island beetles must be younger than the coastal beetles.", "C": "humans carried the beetles to the island during early trade voyages.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "這些甲蟲是由島嶼社群所馴化的。", "B": "島上的甲蟲必定比沿海的甲蟲更年輕。", "C": "人類在早期的貿易航行中將這些甲蟲帶到了島上。", "D": "這些甲蟲很可能是經由自然擴散而非人類引入的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "the song was probably not introduced to the archipelago by that migration.", "B": "all versions of the song are identical.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌很可能不是由那次遷徙帶入這個群島的。", "B": "這首歌的所有版本都完全相同。", "C": "這首歌在遷徙之後不可能有所改變。", "D": "這次遷徙必定比任何其他人類遷移都更早開始。"}, "answer": "A", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "mainland farmers acquired the crop from island communities.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "這種作物最早是在該島上被馴化的。", "B": "人類定居很可能並非這種植物最初抵達該島的原因。", "C": "大陸的農民從島嶼社群取得了這種作物。", "D": "島上的品種必定在基因上與大陸的野生植物完全相同。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: limited logging may help forest health.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "human activity made the populations genetically identical.", "B": "the snails likely spread through an earlier nonhuman mechanism.", "C": "boats probably explain every modern snail population.", "D": "the lakes did not contain snails until boating began."}, "optsZh": {"A": "人類活動使這些族群在基因上完全相同。", "B": "這些蝸牛很可能是透過更早的非人類機制擴散的。", "C": "船隻很可能解釋了每一個現代蝸牛族群的存在。", "D": "在開始划船活動之前，這些湖泊中沒有蝸牛。"}, "answer": "B", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "Even with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adoption\" target=\"_blank\" rel=\"noopener\" data-w=\"adoption\" data-pos=\"n.\" data-en=\"the act of starting to use something new\" data-zh=\"採用\">adoption<\/a> of personal computers, many authors still choose to write and revise their novels by hand and only then <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transcribe\" target=\"_blank\" rel=\"noopener\" data-w=\"transcribe\" data-pos=\"v.\" data-en=\"to write or type a copy of something\" data-zh=\"謄寫；抄錄\">transcribe<\/a> the final version on a computer. It may be tempting to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speculate\" target=\"_blank\" rel=\"noopener\" data-w=\"speculate\" data-pos=\"v.\" data-en=\"to guess about something without having all the facts\" data-zh=\"推測；臆測\">speculate<\/a> about how a novel written this way would be affected if it had been exclusively typed instead, but each novel is a unique entity resulting from a specific set of circumstances. Therefore, _______", "bodyPlain": "Even with the widespread adoption of personal computers, many authors still choose to write and revise their novels by hand and only then transcribe the final version on a computer. It may be tempting to speculate about how a novel written this way would be affected if it had been exclusively typed instead, but each novel is a unique entity resulting from a specific set of circumstances. Therefore, _______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "即使個人電腦已經普及，許多作家仍選擇以手寫方式撰寫與修改小說，直到最後才把定稿謄打到電腦上。人們或許很想推測，以這種方式寫成的小說若完全以打字完成會受到什麼影響，但每一部小說都是在特定情境下產生的獨特存在。因此，_______", "opts": {"A": "in order to increase their efficiency, authors who currently write their novels largely by hand should instead work only on a computer.", "B": "authors who do most of their drafting and revising by hand likely have more success than those who work entirely on a computer.", "C": "novels written by hand take less time to produce, on average, than novels written on a computer do.", "D": "there is no way to reasonably evaluate how a work would be different if it had been written by other means."}, "optsZh": {"A": "為了提高效率，目前大多以手寫創作小說的作者應改為只在電腦上寫作。", "B": "大部分以手寫方式起草和修改的作者，可能比完全在電腦上寫作的作者更成功。", "C": "平均而言，手寫的小說比在電腦上寫的小說花費更少時間完成。", "D": "我們無法合理評估一部作品若以其他方式寫成會有何不同。"}, "answer": "D", "expl": "Since each novel results from a unique set of circumstances, there is no reasonable way to judge how it would differ if written by other means.", "explZh": "由於每部小說都是獨特情境下的產物，因此無法合理評估它若以其他方式寫成會有何不同。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "the plant probably reached the islands without human assistance.", "C": "all island plants descended from a single cultivated variety.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "人類商人必定是最近才運送這些種子的。", "B": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "C": "所有島嶼上的植物都源自單一栽培品種。", "D": "島嶼族群比大陸族群更早被馴化。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "humans carried the beetles to the island during early trade voyages.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "the island beetles must be younger than the coastal beetles."}, "optsZh": {"A": "這些甲蟲是由島嶼社群所馴化的。", "B": "人類在早期的貿易航行中將這些甲蟲帶到了島上。", "C": "這些甲蟲很可能是經由自然擴散而非人類引入的。", "D": "島上的甲蟲必定比沿海的甲蟲更年輕。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "the song could not have changed after the migration.", "B": "all versions of the song are identical.", "C": "the migration must have begun earlier than any other human movement.", "D": "the song was probably not introduced to the archipelago by that migration."}, "optsZh": {"A": "這首歌在遷徙之後不可能有所改變。", "B": "這首歌的所有版本都完全相同。", "C": "這次遷徙必定比任何其他人類遷移都更早開始。", "D": "這首歌很可能不是由那次遷徙帶入這個群島的。"}, "answer": "D", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "the crop was first domesticated on the island.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "人類定居很可能並非這種植物最初抵達該島的原因。", "B": "大陸的農民從島嶼社群取得了這種作物。", "C": "這種作物最早是在該島上被馴化的。", "D": "島上的品種必定在基因上與大陸的野生植物完全相同。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: cannot evaluate counterfactual writing method.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "boats probably explain every modern snail population.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "human activity made the populations genetically identical."}, "optsZh": {"A": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "B": "船隻很可能解釋了每一個現代蝸牛族群的存在。", "C": "這些蝸牛很可能是透過更早的非人類機制擴散的。", "D": "人類活動使這些族群在基因上完全相同。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forecast\" target=\"_blank\" rel=\"noopener\" data-w=\"forecast\" data-pos=\"n.\" data-en=\"a statement of what is expected to happen in the future\" data-zh=\"預測\">forecasting<\/a> weather events, meteorologists sometimes discuss the role of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> rivers. What are atmospheric rivers, and how _______ Part of the water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cycle\" target=\"_blank\" rel=\"noopener\" data-w=\"cycle\" data-pos=\"n.\" data-en=\"a series of events that repeat in the same order\" data-zh=\"循環；週期\">cycle<\/a>, atmospheric rivers are narrow channels of moisture moving through the atmosphere. In certain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>, these &quot;rivers&quot; can release some of their moisture as precipitation.", "bodyPlain": "In forecasting weather events, meteorologists sometimes discuss the role of atmospheric rivers. What are atmospheric rivers, and how _______ Part of the water cycle, atmospheric rivers are narrow channels of moisture moving through the atmosphere. In certain conditions, these \"rivers\" can release some of their moisture as precipitation.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "在預報天氣事件時，氣象學家有時會討論大氣河流所扮演的角色。什麼是大氣河流？它們如何 _______ 作為水循環的一部分，大氣河流是在大氣中移動的狹長水氣通道。在特定條件下，這些「河流」可能會以降水的形式釋放部分水氣。", "opts": {"A": "do they affect our weather.", "B": "they do affect our weather.", "C": "do they affect our weather?", "D": "they do affect our weather?"}, "optsZh": {"A": "do they affect our weather.（倒裝疑問句卻用句號 → 錯誤）", "B": "they do affect our weather.（直述語序，不是疑問句 → 錯誤）", "C": "do they affect our weather?（直接疑問句：助動詞倒裝 + 問號：正確）", "D": "they do affect our weather?（直述語序卻用問號，未倒裝 → 錯誤）"}, "answer": "C", "expl": "This is a direct question, so it needs subject-verb inversion ('do they affect') and a question mark.", "explZh": "這是直接問句，需要主詞與助動詞倒裝（do they affect）並以問號結尾。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "publishing", "B": "published", "C": "to publish", "D": "having published"}, "optsZh": {"A": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "published（過去式動詞，作為主詞 the research team 的主要動詞：正確）", "C": "to publish（不定詞 → 句子缺少主要動詞：錯誤）", "D": "having published（現在分詞完成式 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device--", "C": "device", "D": "device,"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞：錯誤）", "B": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "C": "device（不加標點：主詞 the pins inside the device 與動詞 strike 之間不可斷開：正確）", "D": "device,（逗號 → 不當隔開主詞與動詞：錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "them", "B": "that", "C": "this", "D": "it"}, "optsZh": {"A": "them（複數受格代名詞，指涉 the devices：正確）", "B": "that（單數指示代名詞 → 指涉複數 devices：錯誤）", "C": "this（單數指示代名詞 → 指涉複數 devices：錯誤）", "D": "it（單數代名詞 → 指涉複數 calculators/devices：錯誤）"}, "answer": "A", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family, and", "B": "family,", "C": "family and", "D": "family"}, "optsZh": {"A": "family, and（逗號 + and → 主詞與動詞被不當斷開，句子結構錯誤）", "B": "family,（逗號，結束同位語 a family saga centered on the Trueba family，再接動詞 often introduces）", "C": "family and（加 and → 同位語後多出連接詞，句子結構錯誤）", "D": "family（不加標點：同位語 a family saga… 結尾未以逗號收尾）"}, "answer": "B", "expl": "The appositive 'a family saga centered on the Trueba family' must be closed with a comma before the verb 'often introduces.'", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: direct question requires inversion and question mark.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free. In part because", "B": "free, in part because,", "C": "free in part because", "D": "free, in part because:"}, "optsZh": {"A": "free. In part because（句號斷句 → 後句僅有從屬子句，成為句子片段）", "B": "free, in part because,（because 後多加逗號 → 不當隔開連接詞與其子句）", "C": "free in part because（不加標點，直接以 in part because 連接原因子句）", "D": "free, in part because:（because 後加冒號 → 不當隔開連接詞與其子句）"}, "answer": "C", "expl": "'In part because...' is a dependent clause explaining why it took three days, so it attaches to the main clause without punctuation; a period would leave a fragment.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "vocab": false, "body": "One of the few African American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=global\" target=\"_blank\" rel=\"noopener\" data-w=\"global\" data-pos=\"adj.\" data-en=\"relating to the whole world\" data-zh=\"全球的；世界的\">global<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explorer\" target=\"_blank\" rel=\"noopener\" data-w=\"explorer\" data-pos=\"n.\" data-en=\"a person who travels to unknown places to learn about them\" data-zh=\"探險家\">explorers<\/a> during the turn of the 20th <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">century<\/a>, _______", "bodyPlain": "One of the few African American global explorers during the turn of the 20th century, _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "作為二十世紀之交少數幾位非裔美國人全球探險家之一，_______", "opts": {"A": "Matthew Henson made several treks across Greenland between 1891 and 1909.", "B": "1891 and 1909 were the years between which Matthew Henson made several treks across Greenland.", "C": "Greenland was where Matthew Henson made several treks between 1891 and 1909.", "D": "several treks across Greenland were made by Matthew Henson between 1891 and 1909."}, "optsZh": {"A": "Matthew Henson 在 1891 到 1909 年間多次橫越格陵蘭。（主詞 Matthew Henson 緊接修飾語「少數的非裔美國全球探險家之一」：正確）", "B": "1891 年和 1909 年是 Matthew Henson 多次橫越格陵蘭的起訖年份。（主詞是「1891 and 1909」，不是被修飾的探險家 → 垂懸修飾語：錯誤）", "C": "格陵蘭是 Matthew Henson 在 1891 至 1909 年間多次跋涉的地方。（主詞是 Greenland，不是被修飾的探險家 → 垂懸修飾語：錯誤）", "D": "Matthew Henson 在 1891 到 1909 年間進行了多次橫越格陵蘭的旅程。（被動語態，主詞為 several treks 而非修飾語所指的探險家 → 懸垂修飾語：錯誤）"}, "answer": "A", "expl": "The introductory phrase describes a person, so it must be followed immediately by 'Matthew Henson' to avoid a dangling modifier.", "explZh": "句首修飾語描述的是一個人，所以後面必須緊接被修飾的主詞「Matthew Henson」，否則會形成懸垂修飾語。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "published", "B": "having published", "C": "publishing", "D": "to publish"}, "optsZh": {"A": "published（過去式動詞，作為主詞 the research team 的主要動詞：正確）", "B": "having published（現在分詞完成式 → 句子缺少主要動詞：錯誤）", "C": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device", "B": "device:", "C": "device,", "D": "device--"}, "optsZh": {"A": "device（不加標點：主詞 the pins inside the device 與動詞 strike 之間不可斷開：正確）", "B": "device:（冒號 → 不當隔開主詞與動詞：錯誤）", "C": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "D": "device--（破折號 → 不當隔開主詞與動詞：錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項填入後，能使本文符合標準英語的慣用規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "that", "C": "them", "D": "it"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices：錯誤）", "B": "that（單數指示代名詞 → 指涉複數 devices：錯誤）", "C": "them（複數受格代名詞，指涉 the devices：正確）", "D": "it（單數代名詞 → 指涉複數 calculators/devices：錯誤）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: introductory modifier must modify Matthew Henson.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class
