lish-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The movement&#x27;s emphasis on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collective\" target=\"_blank\" rel=\"noopener\" data-w=\"collective\" data-pos=\"n.\" data-en=\"a group of people who work together\" data-zh=\"團體；集體\">collective<\/a> labor is _______ its workshops, where artists share tools and sign many works as a group.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The movement's emphasis on collective labor is _______ its workshops, where artists share tools and sign many works as a group.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這場運動對集體勞動的重視，_______ 其工作坊中，藝術家們在那裡共用工具，並以團體名義為許多作品署名。", "opts": {"A": "reflected in", "B": "uncertain about", "C": "hidden from", "D": "opposed to"}, "optsZh": {"A": "reflected in（反映在……中）", "B": "uncertain about（對……不確定）", "C": "hidden from（對……隱藏）", "D": "opposed to（反對……）"}, "answer": "A", "expl": "Reflected in means expressed through.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "shown or expressed in", "zh": "反映在……中", "word": "reflected in"}, "B": {"pos": "adj. phr.", "en": "not sure about", "zh": "對……不確定", "word": "uncertain about"}, "C": {"pos": "adj. phr.", "en": "kept out of sight of", "zh": "對……隱藏", "word": "hidden from"}, "D": {"pos": "adj. phr.", "en": "against; disagreeing with", "zh": "反對……", "word": "opposed to"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The designer&#x27;s interest in traditional craft is _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a>&#x27;s handwoven fabrics and plant-based dyes.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The designer's interest in traditional craft is _______ the collection's handwoven fabrics and plant-based dyes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位設計師對傳統工藝的興趣，_______ 這個系列的手織布料與植物染料。", "opts": {"A": "denied by", "B": "insensible to", "C": "scrutinized by", "D": "apparent in"}, "optsZh": {"A": "denied by（被……否認）", "B": "insensible to（對……無感覺；未察覺）", "C": "scrutinized by（受到……仔細審視）", "D": "apparent in（在……中顯而易見）"}, "answer": "D", "expl": "Apparent in means visibly shown in.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "said to be untrue or refused by", "zh": "被……否認", "word": "denied by"}, "B": {"pos": "adj. phr.", "en": "not aware of or not feeling", "zh": "對……無感覺；未察覺", "word": "insensible to"}, "C": {"pos": "adj. phr.", "en": "examined closely by", "zh": "受到……仔細審視", "word": "scrutinized by"}, "D": {"pos": "adj. phr.", "en": "clearly seen in", "zh": "在……中顯而易見", "word": "apparent in"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: manifest in visible features.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The poet&#x27;s fascination with astronomy is _______ her repeated references to comets, eclipses, and planetary motion.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The poet's fascination with astronomy is _______ her repeated references to comets, eclipses, and planetary motion.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位詩人對天文學的著迷，_______ 她反覆提及彗星、日月食與行星運行。", "opts": {"A": "removed from", "B": "questioned by", "C": "visible in", "D": "incompatible with"}, "optsZh": {"A": "removed from（從……移除；與……脫離）", "B": "questioned by（受到……質疑）", "C": "visible in（在……中可見）", "D": "incompatible with（與……不相容）"}, "answer": "C", "expl": "Visible in matches manifest in.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "taken away from; far from", "zh": "從……移除；與……脫離", "word": "removed from"}, "B": {"pos": "adj. phr.", "en": "doubted or challenged by", "zh": "受到……質疑", "word": "questioned by"}, "C": {"pos": "adj. phr.", "en": "able to be seen in", "zh": "在……中可見", "word": "visible in"}, "D": {"pos": "adj. phr.", "en": "unable to exist or work together with", "zh": "與……不相容", "word": "incompatible with"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "Mary Engle Pennington, a chemist who helped advance home <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=refrigeration\" target=\"_blank\" rel=\"noopener\" data-w=\"refrigeration\" data-pos=\"n.\" data-en=\"the process of keeping food or other things cold\" data-zh=\"冷藏；冷凍\">refrigeration<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=undoubtedly\" target=\"_blank\" rel=\"noopener\" data-w=\"undoubtedly\" data-pos=\"adv.\" data-en=\"certainly; without any doubt\" data-zh=\"無疑地；必定\">undoubtedly<\/a> made a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=substantial\" target=\"_blank\" rel=\"noopener\" data-w=\"substantial\" data-pos=\"adj.\" data-en=\"large in amount, size, or importance\" data-zh=\"大量的；重大的\">substantial<\/a> impact on society, but her place in our <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> memory is perhaps more _______ than that of Stephanie Kwolek, who invented the incredibly strong material known as Kevlar, an accomplishment for which she will long be remembered.", "bodyPlain": "Mary Engle Pennington, a chemist who helped advance home refrigeration, undoubtedly made a substantial impact on society, but her place in our historical memory is perhaps more _______ than that of Stephanie Kwolek, who invented the incredibly strong material known as Kevlar, an accomplishment for which she will long be remembered.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "化學家 Mary Engle Pennington 協助推動了家用冷藏技術的發展，她無疑對社會產生了重大影響，但她在我們歷史記憶中的地位，或許比 Stephanie Kwolek 的更 _______；Kwolek 發明了極為堅韌的材料 Kevlar（克維拉纖維），這項成就將讓她長久為人所記得。", "opts": {"A": "permanent", "B": "tentative", "C": "warranted", "D": "prominent"}, "optsZh": {"A": "permanent（永久的）", "B": "tentative（暫定的；不確定的）", "C": "warranted（有正當理由的；合理的）", "D": "prominent（顯著的；重要的）"}, "answer": "B", "expl": "Pennington's place in historical memory is contrasted with Kwolek's, who 'will long be remembered,' so Pennington's place is more 'tentative' (uncertain, less secure).", "explZh": "Pennington 在歷史記憶中的地位與「將長久被記住」的 Kwolek 形成對比，所以她的地位較為「tentative」（不確定的、不穩固的）。", "defs": {"A": {"pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}, "B": {"pos": "adj.", "en": "not certain or fixed; open to change", "zh": "暫定的；不確定的", "word": "tentative"}, "C": {"pos": "adj.", "en": "justified; having good reason", "zh": "有正當理由的；合理的", "word": "warranted"}, "D": {"pos": "adj.", "en": "important and well known; easily noticed", "zh": "顯著的；重要的", "word": "prominent"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Although the reformer changed public health policy, her place in popular memory remains _______ compared with that of the politicians who later adopted her ideas.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Although the reformer changed public health policy, her place in popular memory remains _______ compared with that of the politicians who later adopted her ideas.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。雖然這位改革者改變了公共衛生政策，但與後來採納她理念的政治人物相比，她在大眾記憶中的地位仍然 _______。", "opts": {"A": "precarious", "B": "unquestioned", "C": "prominent", "D": "permanent"}, "optsZh": {"A": "precarious（不穩固的；岌岌可危的）", "B": "unquestioned（不受質疑的）", "C": "prominent（顯著的；重要的）", "D": "permanent（永久的）"}, "answer": "A", "expl": "Precarious means uncertain or insecure.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not securely held; likely to fall or change", "zh": "不穩固的；岌岌可危的", "word": "precarious"}, "B": {"pos": "adj.", "en": "accepted without doubt", "zh": "不受質疑的", "word": "unquestioned"}, "C": {"pos": "adj.", "en": "important and well known; easily noticed", "zh": "顯著的；重要的", "word": "prominent"}, "D": {"pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a> maker&#x27;s influence was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=substantial\" target=\"_blank\" rel=\"noopener\" data-w=\"substantial\" data-pos=\"adj.\" data-en=\"large in amount, size, or importance\" data-zh=\"大量的；重大的\">substantial<\/a>, but because few of his instruments survive, his reputation is more _______ than that of better-documented <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporaries<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The instrument maker's influence was substantial, but because few of his instruments survive, his reputation is more _______ than that of better-documented contemporaries.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位樂器製造者的影響很大，但由於他的樂器很少留存下來，他的名聲比那些有較完整文獻紀錄的同時代人更 _______。", "opts": {"A": "celebrated", "B": "warranted", "C": "dominant", "D": "tentative"}, "optsZh": {"A": "celebrated（著名的；受讚揚的）", "B": "warranted（有正當理由的；合理的）", "C": "dominant（占主導地位的）", "D": "tentative（暫定的；不確定的）"}, "answer": "D", "expl": "Tentative means uncertain.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "famous and praised", "zh": "著名的；受讚揚的", "word": "celebrated"}, "B": {"pos": "adj.", "en": "justified; having good reason", "zh": "有正當理由的；合理的", "word": "warranted"}, "C": {"pos": "adj.", "en": "most powerful or important", "zh": "占主導地位的", "word": "dominant"}, "D": {"pos": "adj.", "en": "not certain or fixed; open to change", "zh": "暫定的；不確定的", "word": "tentative"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or conclusion is warranted. The scientist&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contribution<\/a> to early computing is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a>, though her status in standard histories is still _______ because many records were lost.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The scientist's contribution to early computing is significant, though her status in standard histories is still _______ because many records were lost.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這位科學家對早期計算機發展的貢獻十分重要，但由於許多紀錄已經遺失，她在標準歷史敘述中的地位仍然 _______。", "opts": {"A": "deserved", "B": "prominent", "C": "uncertain", "D": "permanent"}, "optsZh": {"A": "deserved（應得的；當之無愧的）", "B": "prominent（顯著的；重要的）", "C": "uncertain（不確定的）", "D": "permanent（永久的）"}, "answer": "C", "expl": "Uncertain captures tentative status.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "earned; rightly given", "zh": "應得的；當之無愧的", "word": "deserved"}, "B": {"pos": "adj.", "en": "important and well known; easily noticed", "zh": "顯著的；重要的", "word": "prominent"}, "C": {"pos": "adj.", "en": "not sure or settled", "zh": "不確定的", "word": "uncertain"}, "D": {"pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The novelist was admired in her lifetime, but her position in the modern canon is relatively _______ , with critics still debating whether her work should be widely taught.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The novelist was admired in her lifetime, but her position in the modern canon is relatively _______ , with critics still debating whether her work should be widely taught.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位小說家在世時備受推崇，但她在現代經典中的地位相對 _______，評論家至今仍在爭論她的作品是否應被廣泛教授。", "opts": {"A": "commanding", "B": "famous", "C": "enduring", "D": "unstable"}, "optsZh": {"A": "commanding（居主導地位的；威嚴的）", "B": "famous（著名的）", "C": "enduring（持久的；歷久不衰的）", "D": "unstable（不穩定的）"}, "answer": "D", "expl": "Unstable means not firmly established.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "in a strong, controlling position", "zh": "居主導地位的", "word": "commanding"}, "B": {"pos": "adj.", "en": "known by many people", "zh": "著名的", "word": "famous"}, "C": {"pos": "adj.", "en": "lasting for a long time", "zh": "持久的；歷久不衰的", "word": "enduring"}, "D": {"pos": "adj.", "en": "likely to change or fall; not firm", "zh": "不穩定的", "word": "unstable"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: tentative place in historical memory.", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The educator&#x27;s methods influenced generations of teachers, yet her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> reputation remains _______ because she published little under her own name.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The educator's methods influenced generations of teachers, yet her historical reputation remains _______ because she published little under her own name.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項填入後，能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位教育者的教學方法影響了好幾代教師，然而由於她很少以自己的名義發表著作，她的歷史聲譽仍然 _______。", "opts": {"A": "conspicuous", "B": "provisional", "C": "permanent", "D": "prominent"}, "optsZh": {"A": "conspicuous（顯眼的；引人注目的）", "B": "provisional（暫定的；臨時的）", "C": "permanent（永久的）", "D": "prominent（顯著的；重要的）"}, "answer": "B", "expl": "Provisional means tentative.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "very easy to see or notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}, "B": {"pos": "adj.", "en": "arranged for now and possibly changed later", "zh": "暫定的；臨時的", "word": "provisional"}, "C": {"pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}, "D": {"pos": "adj.", "en": "important and well known; easily noticed", "zh": "顯著的；重要的", "word": "prominent"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "The following text is from Betty Smith&#x27;s 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visits<\/a> the library often.<br><br>Francie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=alphabetical\" target=\"_blank\" rel=\"noopener\" data-w=\"alphabetical\" data-pos=\"adj.\" data-en=\"arranged in the order of the letters of the alphabet\" data-zh=\"按字母順序的\">alphabetical<\/a> order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B&#x27;s. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>. For all her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=enthusiasm\" target=\"_blank\" rel=\"noopener\" data-w=\"enthusiasm\" data-pos=\"n.\" data-en=\"a strong feeling of excitement and interest\" data-zh=\"熱情；熱忱\">enthusiasm<\/a>, she had to admit that some of the B&#x27;s had been hard going. But Francie was a reader.", "bodyPlain": "The following text is from Betty Smith's 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often.\n\nFrancie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B's. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For all her enthusiasm, she had to admit that some of the B's had been hard going. But Francie was a reader.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "下列哪一項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Betty Smith 1943 年的小說《A Tree Grows in Brooklyn》。年輕女孩 Francie 經常去圖書館。\nFrancie 以為世界上所有的書都在那間圖書館裡，而她有一個計畫，要讀遍世界上所有的書。她每天按照字母順序讀一本書，而且不跳過那些枯燥的書。她記得第一位作者是 Abbott。她每天讀一本書已經持續很長一段時間了，卻仍然還在 B 開頭的部分。她已經讀過關於蜜蜂和水牛、百慕達度假和拜占庭建築的書。儘管她滿懷熱情，她也不得不承認，有些 B 開頭的書讀起來相當吃力。但 Francie 是個真正愛讀書的人。", "opts": {"A": "To illustrate Francie's enjoyment of an unusual topic", "B": "To explain why Francie prefers reading over other activities", "C": "To portray Francie's determination to meet a goal", "D": "To describe a book that Francie greatly admires"}, "optsZh": {"A": "呈現 Francie 對一個不尋常主題的喜愛", "B": "說明 Francie 為何喜歡閱讀勝過其他活動", "C": "刻畫 Francie 達成目標的決心", "D": "描述一本 Francie 非常欣賞的書"}, "answer": "C", "expl": "Francie plans to read every book in alphabetical order, keeps going a book a day, and admits some were hard going — the text portrays her determination to meet a goal.", "explZh": "Francie 計畫依字母順序讀完所有書，每天讀一本，即使有些書很難讀也堅持下去——本文主要在描繪她達成目標的決心。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一篇短篇小說的節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正帶著花從花園回來。敘述細細描繪傍晚的光線、已準備妥當的房間，以及一位期盼已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To summarize a conflict between two relatives", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To explain why music has lost its importance", "D": "To argue that the characters should leave the house"}, "optsZh": {"A": "概述兩位親戚之間的衝突", "B": "在角色準備迎接某人到來時，描繪場景與氛圍", "C": "說明音樂為何失去了重要性", "D": "主張角色們應該離開那棟房子"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertain\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertain\" data-pos=\"adj.\" data-en=\"not sure or settled\" data-zh=\"不確定的\">uncertain<\/a> but promising conditions.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不是敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一個不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To list the technical features of a harbor", "C": "To criticize sailors for taking unnecessary risks", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "比較數種交通方式", "B": "列出一座港口的技術特點", "C": "批評水手冒不必要的風險", "D": "呈現一種啟程與充滿可能的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排好的椅子，以及每當屋外傳來腳步聲時，家人們便停下動作的模樣——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To depict preparations that reveal anticipation within a family", "B": "To explain why the family dislikes visitors", "C": "To contrast rural and urban customs", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "描寫流露出家人期盼之情的準備工作", "B": "說明這家人為何不喜歡訪客", "C": "對比鄉村與城市的習俗", "D": "從頭到尾描述一場已結束的慶祝活動"}, "answer": "A", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段回憶錄的文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字尚未呈現課程本身；相反地，它著重描寫課程開始前那些安靜的例行儀式。", "opts": {"A": "To recount a student's entire academic career", "B": "To argue that early classes should be canceled", "C": "To describe the moments before a significant daily activity begins", "D": "To evaluate the quality of a school's curriculum"}, "optsZh": {"A": "敘述一名學生完整的求學歷程", "B": "主張應取消早上的課程", "C": "描述一項重要的日常活動開始前的時刻", "D": "評估一所學校課程的品質"}, "answer": "C", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Main Purpose: portray Francie's determination.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的樹葉，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To compare two different seasons", "C": "To reveal the full contents of a letter", "D": "To establish a reflective mood before a character acts"}, "optsZh": {"A": "提供照料花園的指示", "B": "比較兩個不同的季節", "C": "揭露一封信的完整內容", "D": "在角色採取行動前營造沉思的氛圍"}, "answer": "D", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "Researchers have long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that woolly mammoths were hunted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinction<\/a> in North America by humans using spears with grooved tips known as Clovis points. One anthropologist set out to test this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>. Using a mechanical spear-thrower, he launched spears with Clovis points into mounds of clay--substitutes for the animals&#x27; large bodies. The projectiles generally penetrated only a few inches into the clay, an amount insufficient to have harmed most woolly mammoths. This led the anthropologist to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">conclude<\/a> that hunters using spears with Clovis points likely weren&#x27;t the principal drivers of the extinction.", "bodyPlain": "Researchers have long hypothesized that woolly mammoths were hunted to extinction in North America by humans using spears with grooved tips known as Clovis points. One anthropologist set out to test this hypothesis. Using a mechanical spear-thrower, he launched spears with Clovis points into mounds of clay--substitutes for the animals' large bodies. The projectiles generally penetrated only a few inches into the clay, an amount insufficient to have harmed most woolly mammoths. This led the anthropologist to conclude that hunters using spears with Clovis points likely weren't the principal drivers of the extinction.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "下列哪一項最能說明本文的主要目的？", "bodyZh": "研究人員長久以來假設，北美洲的長毛象是被人類使用尖端帶有凹槽、稱為 Clovis 尖狀器的長矛獵殺至滅絕的。一位人類學家著手檢驗這個假設。他使用機械擲矛器，把裝有 Clovis 尖狀器的長矛射入黏土堆中——這些黏土堆用來代替這些動物龐大的身軀。這些投射物通常只穿入黏土幾英寸深，這樣的深度不足以傷害大多數長毛象。這使這位人類學家得出結論：使用 Clovis 尖狀器長矛的獵人很可能不是導致長毛象滅絕的主要因素。", "opts": {"A": "To argue for the significance of new findings amid an ongoing debate among researchers", "B": "To discuss the advantages and disadvantages of the method used in an experiment", "C": "To summarize two competing hypotheses and a major finding associated with each one", "D": "To describe an experiment whose results cast doubt on an established hypothesis"}, "optsZh": {"A": "在研究人員持續爭論之際，論證新發現的重要性", "B": "討論實驗所用方法的優缺點", "C": "概述兩種相互競爭的假說，以及與各自相關的一項重要發現", "D": "描述一項結果對既有假說提出質疑的實驗"}, "answer": "D", "expl": "The text describes an experiment with Clovis-point spears whose weak penetration led the anthropologist to doubt the long-held hunting hypothesis.", "explZh": "本文描述一項以 Clovis 矛頭進行的實驗，矛頭穿透力不足，使人類學家對長期以來的「人類獵殺導致滅絕」假說產生懷疑。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一篇短篇小說的節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正帶著花從花園回來。敘述細細描繪傍晚的光線、已準備妥當的房間，以及一位期盼已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To summarize a conflict between two relatives", "B": "To argue that the characters should leave the house", "C": "To portray a setting and mood as characters prepare for an arrival", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "概述兩位親戚之間的衝突", "B": "主張角色們應該離開那棟房子", "C": "在角色準備迎接某人到來時，描繪場景與氛圍", "D": "說明音樂為何失去了重要性"}, "answer": "C", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertain\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertain\" data-pos=\"adj.\" data-en=\"not sure or settled\" data-zh=\"不確定的\">uncertain<\/a> but promising conditions.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不是敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一個不確定卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To compare several forms of transportation", "C": "To criticize sailors for taking unnecessary risks", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "列出一座港口的技術特點", "B": "比較數種交通方式", "C": "批評水手冒不必要的風險", "D": "呈現一種啟程與充滿可能的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排好的椅子，以及每當屋外傳來腳步聲時，家人們便停下動作的模樣——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To contrast rural and urban customs", "C": "To describe a completed celebration from beginning to end", "D": "To depict preparations that reveal anticipation within a family"}, "optsZh": {"A": "說明這家人為何不喜歡訪客", "B": "對比鄉村與城市的習俗", "C": "從頭到尾描述一場已結束的慶祝活動", "D": "描寫流露出家人期盼之情的準備工作"}, "answer": "D", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段回憶錄的文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字尚未呈現課程本身；相反地，它著重描寫課程開始前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To evaluate the quality of a school's curriculum", "C": "To recount a student's entire academic career", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "描述一項重要的日常活動開始前的時刻", "B": "評估一所學校課程的品質", "C": "敘述一名學生完整的求學歷程", "D": "主張應取消早上的課程"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的樹葉，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To establish a reflective mood before a character acts", "C": "To reveal the full contents of a letter", "D": "To compare two different seasons"}, "optsZh": {"A": "提供照料花園的指示", "B": "在角色採取行動前營造沉思的氛圍", "C": "揭露一封信的完整內容", "D": "比較兩個不同的季節"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Function: concede limited access to bathhouses.", "vocab": false, "body": "The people of medieval Europe have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as uninterested in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cleanliness\" target=\"_blank\" rel=\"noopener\" data-w=\"cleanliness\" data-pos=\"n.\" data-en=\"the state or habit of being clean\" data-zh=\"清潔；乾淨\">cleanliness<\/a> and hygiene, but modern research has shown that this is largely a myth. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and--more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affordably\" target=\"_blank\" rel=\"noopener\" data-w=\"affordably\" data-pos=\"adv.\" data-en=\"at a price people can pay\" data-zh=\"以負擔得起的價格\">affordably<\/a>--steam baths. <u>While such amenities were available mainly to town dwellers<\/u>, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.", "bodyPlain": "The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and--more affordably--steam baths. While such amenities were available mainly to town dwellers, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "下列哪一項最能描述畫線部分的功能？", "bodyZh": "中世紀歐洲人傳統上被認為不在乎清潔與衛生，但現代研究顯示，這在很大程度上是一種迷思。根據歷史學家 Eleanor Janega 的說法，歐洲大多數中世紀城鎮至少有一間公共澡堂，通常同時提供全身浸泡的浴池，以及——價格較為實惠的——蒸氣浴。雖然這類設施主要只有城鎮居民能使用，但在河流和溪流中定期洗浴，或每天在家用海綿擦澡，在整個中世紀歐洲都是常見的做法。", "opts": {"A": "It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.", "B": "It describes a limitation of earlier historians' studies of medieval European bathing habits.", "C": "It concedes that not all people in medieval Europe had access to public bathhouses.", "D": "It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."}, "optsZh": {"A": "它主張在中世紀歐洲，蒸氣浴在鄉村比在城市更受歡迎。", "B": "它描述了早期歷史學家研究中世紀歐洲沐浴習慣時的一項局限。", "C": "它承認並非所有中世紀歐洲人都能使用公共澡堂。", "D": "它說明了 Janega 為何決定研究中世紀歐洲公共澡堂的普及程度。"}, "answer": "C", "expl": "The underlined clause admits that bathhouses were available mainly to town dwellers — a concession that not everyone had access to them — before noting other common bathing practices.", "explZh": "畫線部分承認公共澡堂主要只提供給城鎮居民使用，也就是讓步說明並非所有人都能使用澡堂，接著才指出其他普遍的沐浴方式。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Function: concede limited access to bathhouses.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "下列哪一項最能描述畫線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，每當彗星接近太陽時，它的表面就會發生變化。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述了一項研究，該研究測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It describes how other researchers criticized the work.", "C": "It states the study's final conclusion.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它指出了促成這項研究的不確定之處。", "B": "它描述其他研究人員如何批評這項研究。", "C": "它陳述了這項研究的最終結論。", "D": "它提供證據證明雷達始終可靠。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Function: concede limited access to bathhouses.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tentative\" target=\"_blank\" rel=\"noopener\" data-w=\"tentative\" data-pos=\"adj.\" data-en=\"not certain or fixed; open to change\" data-zh=\"暫定的；不確定的\">tentative<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "下列哪一項最能描述畫線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一篇考古學文章一開始便指出，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，用於這種交流的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，文章討論了一個團隊，他們在陶器中尋找化學特徵，但只得出了初步的結論。", "opts": {"A": "It summarizes the team's strongest result.", "B": "It shifts the discussion away from archaeology.", "C": "It defines the problem the later investigation attempts to address.", "D": "It contradicts the claim made in the first sentence."}, "optsZh": {"A": "它概述了團隊最有力的研究結果。", "B": "它將討論從考古學轉移開。", "C": "它界定了後續調查試圖解決的問題。", "D": "它反駁了第一句中提出的主張。"}, "answer": "C", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Function: concede limited access to bathhouses.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" dat
