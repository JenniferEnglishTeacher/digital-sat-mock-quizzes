ed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> diluted cleaner.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：某間實驗室依危險程度標示材料；可能刺激皮膚的材料標示為「小心」（Caution）；可能造成嚴重傷害的材料標示為「危險」（Danger）；稀釋過的清潔劑可能刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "The lab uses hazard categories for materials.", "B": "Danger materials can cause severe injury.", "C": "Diluted cleaner is handled in a lab.", "D": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution."}, "optsZh": {"A": "該實驗室對材料採用危險等級分類。", "B": "「危險級」材料可能造成嚴重傷害。", "C": "稀釋過的清潔劑在實驗室中處理。", "D": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。"}, "answer": "D", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "The library classifies manuscripts by fragility.", "B": "Nineteenth-century pamphlets are historical documents.", "C": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.", "D": "Restricted manuscripts cannot be handled by readers."}, "optsZh": {"A": "該圖書館依脆弱程度為手稿分類。", "B": "十九世紀的小冊子屬於歷史文件。", "C": "大多數十九世紀的小冊子被歸類為「監管」級，因為它們需要小心處理，但讀者仍可接觸使用。", "D": "「限制級」手稿讀者不得接觸。"}, "answer": "C", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：某個機構依預期影響為暴風雨分級；預期造成局部干擾的暴風雨列為「注意報」（Advisory）；預期造成大範圍損害的暴風雨列為「緊急」（Emergency）；某場沿海暴風雨預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風雨分級。", "opts": {"A": "Emergency storms cause widespread damage.", "B": "Coastal storms can affect travel.", "C": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "D": "The agency classifies storms by expected impact."}, "optsZh": {"A": "「緊急級」風暴會造成大範圍損害。", "B": "沿海風暴可能影響交通。", "C": "由於預計會造成局部干擾但不會造成大範圍損害，這場沿海風暴被歸類為「警示級」（Advisory）。", "D": "該機構依預期衝擊程度為風暴分類。"}, "answer": "C", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：某間博物館依安全風險為借展品分級；可能因一般搬運而受損的物件列為「監督」（Supervised）；可能因短暫暴露而嚴重受損的物件列為「限制」（Restricted）；大多數陶瓷複製品可能因一般搬運而受損，但不會因短暫暴露而嚴重受損；目標是為這些複製品分級。", "opts": {"A": "Most ceramic replicas are classified as Supervised because ordinary handling could damage them.", "B": "Restricted objects could be seriously damaged by brief exposure.", "C": "Ceramic replicas may be used in educational displays.", "D": "Museum loans are classified by security risk."}, "optsZh": {"A": "大多數陶瓷複製品被歸類為「監督級」（Supervised），因為一般的搬動就可能損壞它們。", "B": "「限制級」物件短暫曝露就可能嚴重受損。", "C": "陶瓷複製品可用於教育展示。", "D": "博物館借展品依安全風險分類。"}, "answer": "A", "expl": "The answer applies the classification.", "explZh": ""}];
    const SLUG = 'dsat_t6m2';
    const SOURCE = 'Digital SAT Practice Test 6, Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${g.items.map(q => itemHtml(q, wrong)).join('')}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    function wrongList() {
      const w = loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
  </script>
</body>
</html>
