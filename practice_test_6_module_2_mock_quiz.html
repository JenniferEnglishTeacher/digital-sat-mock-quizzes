rical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) them\nC) it\nD) this", "answer": "B", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "23.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family and\nC) family, and\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "23.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free, in part because,\nC) free. In part because\nD) free in part because", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 24, "concept": "Grammar: however between independent clause and list.", "original": "Latin America is known to have dozens, if not hundreds, of popular dance forms. Only five of these dances are included in international ballroom dance _______ rumba, samba, cha-cha-cha, paso doble, and jive--the last of which is grouped with the other Latin dances despite not having Latin roots.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) competitions, however:\nB) competitions, however,\nC) competitions, however;\nD) competitions; however,", "generated": [{"id": "24.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) published\nC) having published\nD) publishing", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "24.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device\nB) device,\nC) device:\nD) device--", "answer": "A", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "24.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it\nB) that\nC) this\nD) them", "answer": "D", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "24.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family, and\nC) family\nD) family and", "answer": "C", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free, in part because,\nC) free in part because\nD) free, in part because:", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 25, "concept": "Grammar: colon introduces explanation.", "original": "For thousands of years, humans have used domesticated goats (Capra hircus) to clear land of unwanted vegetation. When it comes to their diets, goats are notoriously _______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) indiscriminate and\nB) indiscriminate,\nC) indiscriminate\nD) indiscriminate:", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having published\nB) published\nC) publishing\nD) to publish", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device--\nC) device,\nD) device", "answer": "D", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) this\nB) that\nC) them\nD) it", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family, and\nC) family and\nD) family,", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free in part because\nC) free. In part because\nD) free, in part because,", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 26, "concept": "Grammar: plural subject toxins requires increase.", "original": "A species of Byropsis algae produces toxins to avoid being eaten by predators. However, in some cases, the toxins the organism uses to protect itself from predation actually _______ its attractiveness to predators. The Hawaiian sea slug, for example, not only tolerates Byropsis toxins but actually uses them for protection in the same way the algae does.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) is increasing\nB) increase\nC) increases\nD) has increased", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) published\nB) publishing\nC) to publish\nD) having published", "answer": "A", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device--\nC) device\nD) device,", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) this\nC) them\nD) it", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family, and\nC) family,\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free. In part because\nC) free in part because\nD) free, in part because,", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 27, "concept": "Transitions: finally marks last step in sequence.", "original": "After appropriate permissions are granted, a typical archaeological dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. _______ the artifacts are removed, cataloged, and analyzed in a laboratory.\n\nWhich choice completes the text with the most logical transition?\nA) For instance,\nB) On the contrary,\nC) Earlier,\nD) Finally,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A museum conservation project begins with a condition report. Next, conservators clean the object and stabilize fragile areas. _______ the object is photographed, cataloged, and returned to storage.\n\nWhich choice completes the text with the most logical transition?\n\nA) Finally,\nB) Earlier,\nC) For instance,\nD) On the contrary,", "answer": "A", "explanation": "Finally marks the last step."}, {"id": "27.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. To prepare a field survey, researchers first mark the study area and collect baseline measurements. They then record observations at regular intervals. _______ the data are entered into a shared database.\n\nWhich choice completes the text with the most logical transition?\n\nA) Nevertheless,\nB) Earlier,\nC) Finally,\nD) For example,", "answer": "C", "explanation": "Finally completes the sequence."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The restoration team removed old varnish, filled cracks, and matched missing pigments. _______ the painting was sealed with a protective coating.\n\nWhich choice completes the text with the most logical transition?\n\nA) For instance,\nB) Earlier,\nC) On the contrary,\nD) Finally,", "answer": "D", "explanation": "Finally indicates the final action."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A laboratory sample is first labeled and weighed; afterward, it is heated, cooled, and tested for residue. _______ the results are reviewed by a second technician.\n\nWhich choice completes the text with the most logical transition?\n\nA) Earlier,\nB) Finally,\nC) Nevertheless,\nD) For example,", "answer": "B", "explanation": "Finally marks the last step."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. At the start of the workshop, students draft a research question. They then locate sources, take notes, and revise their claims. _______ they present their findings to the class.\n\nWhich choice completes the text with the most logical transition?\n\nA) For instance,\nB) On the contrary,\nC) Earlier,\nD) Finally,", "answer": "D", "explanation": "Finally signals completion of the sequence."}]}, {"n": 28, "concept": "Transitions: in turn shows resulting effect.", "original": "The liquid metals in Earth's core circulate constantly, and this circulation generates electrical currents that flow between Earth's North and South magnetic poles. These electrical currents, _______ create a barrier around Earth that protects us from radiation and charged particles coming from space.\n\nWhich choice completes the text with the most logical transition?\nA) in turn,\nB) likewise,\nC) nevertheless,\nD) in reality,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Warm ocean water evaporates and forms humid air. That humid air rises and cools, _______ producing clouds that can later release rain.\n\nWhich choice completes the text with the most logical transition?\n\nA) in turn,\nB) likewise,\nC) nevertheless,\nD) in reality,", "answer": "A", "explanation": "In turn shows the resulting effect."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The new rail line reduced travel time between the towns. Shorter trips, _______ encouraged more commuters to use public transportation.\n\nWhich choice completes the text with the most logical transition?\n\nA) for example,\nB) nevertheless,\nC) in turn,\nD) likewise,", "answer": "C", "explanation": "In turn links one effect to another."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The root system holds soil in place during storms. This stabilization, _______ reduces erosion along the riverbank.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) in turn,\nC) in reality,\nD) similarly,", "answer": "B", "explanation": "In turn signals a consequence."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The software compresses large image files. The smaller files, _______ require less storage space and can be sent more quickly.\n\nWhich choice completes the text with the most logical transition?\n\nA) nevertheless,\nB) in turn,\nC) likewise,\nD) for instance,", "answer": "B", "explanation": "In turn marks a result."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The policy increased the number of bus routes. Greater route coverage, _______ made it easier for residents without cars to reach workplaces.\n\nWhich choice completes the text with the most logical transition?\n\nA) nevertheless,\nB) instead,\nC) in reality,\nD) in turn,", "answer": "D", "explanation": "In turn shows a chain of effects."}]}, {"n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "original": "Biographer Michael Gorra notes that the novelist Henry James \"lived in a world of second thoughts,\" frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James's standards; _______ some critics regard the two editions as two different novels altogether.\n\nWhich choice completes the text with the most logical transition?\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "generated": [{"id": "29.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The two recordings differ in tempo and instrumentation; _______ some listeners insist that they should be treated as separate compositions.\n\nWhich choice completes the text with the most logical transition?\n\nA) nevertheless,\nB) by contrast,\nC) in fact,\nD) in other words,", "answer": "C", "explanation": "In fact intensifies the claim."}, {"id": "29.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The revised map does more than correct a few place names; _______ it redraws several national borders.\n\nWhich choice completes the text with the most logical transition?\n\nA) for example,\nB) therefore,\nC) nevertheless,\nD) in fact,", "answer": "D", "explanation": "In fact emphasizes the extent."}, {"id": "29.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The storm caused more than minor delays; _______ several coastal highways remained closed for a week.\n\nWhich choice completes the text with the most logical transition?\n\nA) in other words,\nB) in fact,\nC) nevertheless,\nD) by contrast,", "answer": "B", "explanation": "In fact strengthens the prior statement."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The manuscript is unusually different from the printed edition; _______ entire chapters appear in a different order.\n\nWhich choice completes the text with the most logical transition?\n\nA) in fact,\nB) therefore,\nC) however,\nD) by contrast,", "answer": "A", "explanation": "In fact adds stronger evidence."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The two versions of the speech are not merely stylistically distinct; _______ they advance opposing positions on the same policy.\n\nWhich choice completes the text with the most logical transition?\n\nA) for example,\nB) in other words,\nC) in fact,\nD) nevertheless,", "answer": "C", "explanation": "In fact intensifies the difference."}]}, {"n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "original": "While researching a topic, a student has taken the following notes:\n- In World War I, US soldiers who were members of the Choctaw Nation in Oklahoma participated in the Choctaw Code Talkers program.\n- The Choctaw Code Talkers were trained to relay coded military information in their native language.\n- In World War II, the US Army recruited Navajo (Dine) soldiers to transmit coded messages in their native language.\n- These soldiers were known as the Navajo Code Talkers.\n\nThe student wants to emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) US soldiers who were members of the Choctaw Nation in Oklahoma used their native language to relay coded information.\nB) In World War II, one group of Navajo (Dine) soldiers was known as the Navajo Code Talkers.\nC) Both the Choctaw Code Talkers and the Navajo Code Talkers transmitted coded military messages in the soldiers' native languages.\nD) The Choctaw Code Talkers, not the Navajo Code Talkers, served in World War I.", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: During one war, members of Nation A used their language to send coded radio messages; during another war, members of Nation B also used their language to send coded messages; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Nation B's soldiers served in a later war.\nB) Both groups used their native languages to transmit coded military messages.\nC) Nation A's program began before Nation B's program.\nD) The two programs involved different Indigenous nations.", "answer": "B", "explanation": "The answer states the shared function."}, {"id": "30.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Coast Watchers relayed coded ship locations by radio; the Mountain Signals unit relayed coded troop positions by radio; both groups used locally known languages; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Mountain Signals unit reported troop positions.\nB) Both the Coast Watchers and the Mountain Signals unit used locally known languages to relay coded military information by radio.\nC) The Coast Watchers reported ship locations.\nD) The two units operated in different regions.", "answer": "B", "explanation": "The answer emphasizes the similarity."}, {"id": "30.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Group X served in World War I; Group Y served in World War II; both were trained to transmit encrypted battlefield messages in their communities' languages; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Encrypted messages were important in both wars.\nB) Group X served earlier than Group Y.\nC) Both Group X and Group Y transmitted encrypted battlefield messages in their communities' languages.\nD) Group Y was trained during World War II.", "answer": "C", "explanation": "The answer states what both groups did."}, {"id": "30.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The River Unit used its native language for coded supply messages; the Desert Unit used its native language for coded location messages; both worked for the army; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Desert Unit transmitted location messages.\nB) Both units worked for the army.\nC) The River Unit transmitted supply messages.\nD) Both the River Unit and the Desert Unit used native languages to send coded military messages.", "answer": "D", "explanation": "The answer emphasizes the shared method."}, {"id": "30.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The Hill Code team sent coded weather reports in its Indigenous language; the Plains Code team sent coded troop reports in its Indigenous language; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both code teams used Indigenous languages to transmit coded reports for military purposes.\nB) The Plains Code team sent troop reports.\nC) The two teams transmitted different kinds of information.\nD) The Hill Code team sent weather reports.", "answer": "A", "explanation": "The answer identifies the similarity."}]}, {"n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "original": "While researching a topic, a student has taken the following notes:\n- Meteorites found on Earth are divided into two categories.\n- A meteorite that was observed falling to Earth before being recovered is known as a meteorite fall.\n- All other meteorites found on Earth are known as meteorite finds.\n- There have been about 1,200 recorded meteorite falls.\n- There have been over 60,000 recorded meteorite finds.\n\nThe student wants to contrast the number of meteorite falls with the number of meteorite finds. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) A meteorite that was observed falling to Earth before being recovered is known as a meteorite fall; all others are known as meteorite finds.\nB) Meteorites found on Earth are divided into two categories: meteorite falls and meteorite finds.\nC) There have been about 1,200 recorded meteorite falls, or meteorites observed falling to Earth.\nD) While there have been only about 1,200 recorded meteorite falls, there have been over 60,000 meteorite finds.", "generated": [{"id": "31.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: About 900 confirmed impact craters are smaller than 1 kilometer wide; more than 25,000 are larger than 1 kilometer wide; the goal is to contrast the numbers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) There are more confirmed large craters than small craters.\nB) While about 900 confirmed impact craters are smaller than 1 kilometer wide, more than 25,000 are larger than 1 kilometer wide.\nC) Impact craters can be grouped by width.\nD) Some confirmed craters are smaller than 1 kilometer.", "answer": "B", "explanation": "The answer directly contrasts the numbers."}, {"id": "31.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The archive contains about 450 handwritten diaries; it contains over 18,000 printed letters; the goal is to contrast the numbers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Handwritten diaries can provide personal historical evidence.\nB) The archive contains both diaries and letters.\nC) Printed letters are one type of archive item.\nD) Although the archive contains about 450 handwritten diaries, it contains over 18,000 printed letters.", "answer": "D", "explanation": "The answer contrasts the quantities."}, {"id": "31.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A wildlife survey counted 1,100 nesting pairs of Species A; the same survey counted more than 70,000 nesting pairs of Species B; the goal is to contrast the numbers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) While Species A had about 1,100 nesting pairs, Species B had more than 70,000.\nB) Nesting pairs are counted during breeding season.\nC) The survey covered several habitats.\nD) Species A and Species B were both included in the survey.", "answer": "A", "explanation": "The answer contrasts the counts."}, {"id": "31.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The library owns about 2,000 maps; it owns more than 90,000 photographs; the goal is to contrast the numbers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Maps and photographs are both visual records.\nB) The library owns about 2,000 maps.\nC) The library owns far fewer maps than photographs: about 2,000 maps compared with more than 90,000 photographs.\nD) Photographs make up one part of the collection.", "answer": "C", "explanation": "The answer makes the contrast explicit."}, {"id": "31.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The database lists 650 volcanic eruptions before 1500; it lists over 12,000 eruptions after 1500; the goal is to contrast the numbers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Some eruptions occurred before 1500.\nB) Only 650 listed eruptions occurred before 1500, whereas over 12,000 listed eruptions occurred after 1500.\nC) The database organizes eruptions by date.\nD) Eruptions after 1500 are more numerous in the database.", "answer": "B", "explanation": "The answer contrasts the categories."}]}, {"n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "original": "While researching a topic, a student has taken the following notes:\n- Dona Maria do Carmo Bandeira was a Brazilian botanist.\n- Between 1924 and 1941, she collected approximately 800 botanical samples.\n- She collected a sample of Polytrichum juniperinum from Serra de Itatiaia in Maua in February of 1925.\n- She collected a sample of Sphagnum gracilescen from Ponte do Inferno in Corcovado in March of 1925.\n- Polytrichum juniperinum and Sphagnum gracilescen are both species of moss.\n\nThe student wants to emphasize the sample collected from Serra de Itatiaia. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Dona Maria do Carmo Bandeira was a botanist notable for collecting approximately 800 botanical samples between 1924 and 1941.\nB) Among the many botanical samples Dona Maria do Carmo Bandeira collected was Polytrichum juniperinum, a species of moss she collected from Serra de Itatiaia in 1925.\nC) Between 1924 and 1941, Dona Maria do Carmo Bandeira collected many botanical samples, such as Polytrichum juniperinum from Serra de Itatiaia and Sphagnum gracilescen from Ponte do Inferno.\nD) Between 1924 and 1941, Dona Maria do Carmo Bandeira collected samples of Polytrichum juniperinum and Sphagnum gracilescen, both species of moss.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Mori also collected Moss B from River Nami.\nB) Fern A and Moss B were collected in different years.\nC) Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.\nD) Aya Mori collected hundreds of plant samples.", "answer": "C", "explanation": "The answer emphasizes the target sample."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cerro Azul and Valle Seco are different sites.\nB) Quartz was collected from Valle Seco.\nC) Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.\nD) Ortega collected many mineral samples.", "answer": "C", "explanation": "The answer focuses on the target sample."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.\nB) Fucus alba was collected from Stone Harbor.\nC) Both samples were collected in 1980.\nD) Lee cataloged more than one algae species.", "answer": "A", "explanation": "The answer emphasizes the selected sample."}, {"id": "32.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Species M came from Lake Plain.\nB) Singh collected beetles in multiple locations.\nC) The Cedar Ridge and Lake Plain specimens were collected in different years.\nD) One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "answer": "D", "explanation": "The answer centers the target specimen."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Ramos collected approximately 700 specimens.\nB) Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.\nC) Cloud Peak and Green Valley were both collection sites.\nD) Ramos collected Fern Y the following year.", "answer": "B", "explanation": "The answer emphasizes the target sample."}]}, {"n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "original": "While researching a topic, a student has taken the following notes:\n- The US government classifies sensitive information according to the degree to which disclosure could affect the nation's security.\n- Information that could cause \"damage\" to national security is classified as Confidential.\n- Information that could cause \"serious damage\" to national security is classified as Secret.\n- Most routine diplomatic correspondence, if disclosed, could cause damage but not serious damage to national security.\n- Diplomatic correspondence includes communication with both allies and adversaries.\n\nThe student wants to indicate which category most routine diplomatic correspondence belongs in, based on how sensitive information is classified. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) According to the US government, which classifies such sensitive information as routine diplomatic correspondence, Confidential information could damage national security if disclosed.\nB) Most routine diplomatic correspondence is classified according to the degree to which disclosure could affect the nation's security.\nC) Having the potential to damage national security if disclosed, most routine diplomatic correspondence is classified as Confidential.\nD) If disclosed, communication with both allies and adversaries could affect the nation's security.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Budget drafts are one kind of government document.\nB) Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.\nC) The records office classifies documents by release risk.\nD) Sealed documents could cause major harm if released.", "answer": "B", "explanation": "The answer applies the classification rule."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The lab uses hazard categories for materials.\nB) Danger materials can cause severe injury.\nC) Diluted cleaner is handled in a lab.\nD) Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "answer": "D", "explanation": "The answer uses the correct category."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The library classifies manuscripts by fragility.\nB) Nineteenth-century pamphlets are historical documents.\nC) Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.\nD) Restricted manuscripts cannot be handled by readers.", "answer": "C", "explanation": "The answer applies the definitions."}, {"id": "33.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Emergency storms cause widespread damage.\nB) Coastal storms can affect travel.\nC) Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.\nD) The agency classifies storms by expected impact.", "answer": "C", "explanation": "The answer identifies the category."}, {"id": "33.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Most ceramic replicas are classified as Supervised because ordinary handling could damage them.\nB) Restricted objects could be seriously damaged by brief exposure.\nC) Ceramic replicas may be used in educational displays.\nD) Museum loans are classified by security risk.", "answer": "A", "explanation": "The answer applies the classification."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
