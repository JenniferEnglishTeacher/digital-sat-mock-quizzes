  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: featured in museums.", "original": "The works of Chicana artist Ester Hernandez are now _______ in museums both in the United States and abroad, but the murals she contributed to as a member of Las Mujeres Muralistas early in her artistic career were displayed in outdoor public spaces across San Francisco.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) invented\nB) adjusted\nC) featured\nD) recommended", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The sculptor's early installations appeared mostly in community centers, but her recent work is now _______ in major galleries across Europe and South America.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) invented\nB) recommended\nC) displayed\nD) adjusted", "answer": "C", "explanation": "Displayed means shown publicly."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The filmmaker's documentaries were once screened only at local festivals; today, they are _______ in university archives and international retrospectives.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) redesigned\nB) misplaced\nC) exhibited\nD) endorsed", "answer": "C", "explanation": "Exhibited means shown prominently."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Several textiles by the collective are _______ in the museum's permanent collection, where visitors can view them alongside paintings from the same period.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) repaired\nB) featured\nC) translated\nD) predicted", "answer": "B", "explanation": "Featured means included or shown prominently."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The photographer's portraits are now _______ at cultural institutions around the world, though they were first posted on neighborhood bulletin boards.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) showcased\nB) assigned\nC) invented\nD) corrected", "answer": "A", "explanation": "Showcased means prominently displayed."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The playwright's handwritten drafts, long kept in a private archive, are now _______ in a public exhibition devoted to twentieth-century theater.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) altered\nB) advised\nC) imagined\nD) presented", "answer": "D", "explanation": "Presented means made available for viewing."}]}, {"n": 2, "concept": "Words in Context: inspired by direct experience.", "original": "Whether Carmen Lomas Garza is creating small paintings and illustrations or large public artworks--such as Baile, a copper cutout of traditional Mexican dance in the San Francisco International Airport--she is _______ direct experience, drawing from memories of her childhood in Texas or details of her current surroundings in California.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) complimented by\nB) uncertain about\nC) unbothered by\nD) inspired by", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The novelist's rural settings are clearly _______ childhood visits to her grandparents' farm, where she learned the names of crops, tools, and seasonal tasks.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) protected from\nB) derived from\nC) unmoved by\nD) skeptical of", "answer": "B", "explanation": "Derived from means drawn from a source."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The architect's small libraries are _______ the reading rooms she used as a student; their low shelves and window seats echo those earlier spaces.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) concealed by\nB) indifferent to\nC) influenced by\nD) unrelated to", "answer": "C", "explanation": "Influenced by means inspired by."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The composer said that the rhythms in the suite were _______ the sounds of trains outside her apartment rather than by formal conservatory exercises.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) prompted by\nB) excluded from\nC) opposed to\nD) unaware of", "answer": "A", "explanation": "Prompted by means inspired by."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The painter's city scenes are _______ daily walks through crowded markets, where she sketches storefronts, vendors, and passing conversations.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) uncertain about\nB) inspired by\nC) separated from\nD) complimented by", "answer": "B", "explanation": "Inspired by means creatively drawn from."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The poet's imagery is _______ direct observation: she often drafts lines outdoors while watching tides, birds, and changing light.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unbothered by\nB) distant from\nC) suspicious of\nD) rooted in", "answer": "D", "explanation": "Rooted in means based on."}]}, {"n": 3, "concept": "Words in Context: accidental rather than deliberate.", "original": "Animal researcher Amalia P.M. Bastos led a 2021 study about a wild kea parrot that used small stones as tools to preen its feathers. Skeptical colleagues had initially suggested to Bastos that the kea's interactions with the stones might simply be _______ , but Bastos and her team showed that the kea was using the stones deliberately.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) intriguing\nB) obvious\nC) accidental\nD) observable", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The pattern initially looked _______ , but closer analysis showed that the animal repeated the behavior only when it needed to reach food.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) observable\nB) incidental\nC) deliberate\nD) intriguing", "answer": "B", "explanation": "Incidental means accidental or not intended."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The intern first assumed the missing labels were _______ , but the archivist later found that they had been removed according to a cataloging plan.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) useful\nB) visible\nC) accidental\nD) obvious", "answer": "C", "explanation": "Accidental contrasts with deliberate."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Researchers wondered whether the bird's repeated tapping was merely _______ until video evidence showed that it tapped only to summon another bird.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) noticeable\nB) careful\nC) ingenious\nD) random", "answer": "D", "explanation": "Random means not intentional."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The arrangement of stones seemed purposeful, yet the archaeologists first tested whether it could have been _______ , caused by flooding rather than human design.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) documented\nB) skillful\nC) visible\nD) chance", "answer": "D", "explanation": "Chance means accidental."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. At first, the chemical change was dismissed as _______ contamination, but repeated trials showed that the reaction was a predictable result of the method.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unintentional\nB) obvious\nC) fascinating\nD) observable", "answer": "A", "explanation": "Unintentional means accidental."}]}, {"n": 4, "concept": "Words in Context: manifest in visible features.", "original": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris's repudiation of industrialization is _______ the Kelmscott editions' use of handmade materials and intricate ornamentation reminiscent of medieval manuscripts: these meticulously handcrafted elements exemplify the artistry involved.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) insensible to\nB) manifest in\nC) scrutinized by\nD) complicated by", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The architect's rejection of uniform corporate design is _______ the building's irregular windows, handmade tiles, and locally carved doors.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) scrutinized by\nB) evident in\nC) insensible to\nD) concealed from", "answer": "B", "explanation": "Evident in means visible or manifest in."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The editor's preference for plain language is _______ the journal's short sentences, concrete examples, and avoidance of specialized terminology.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) manifest in\nB) irrelevant to\nC) borrowed from\nD) complicated by", "answer": "A", "explanation": "Manifest in means clearly shown in."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The movement's emphasis on collective labor is _______ its workshops, where artists share tools and sign many works as a group.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) reflected in\nB) uncertain about\nC) hidden from\nD) opposed to", "answer": "A", "explanation": "Reflected in means expressed through."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The designer's interest in traditional craft is _______ the collection's handwoven fabrics and plant-based dyes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) denied by\nB) insensible to\nC) scrutinized by\nD) apparent in", "answer": "D", "explanation": "Apparent in means visibly shown in."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The poet's fascination with astronomy is _______ her repeated references to comets, eclipses, and planetary motion.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) removed from\nB) questioned by\nC) visible in\nD) incompatible with", "answer": "C", "explanation": "Visible in matches manifest in."}]}, {"n": 5, "concept": "Words in Context: tentative place in historical memory.", "original": "Mary Engle Pennington, a chemist who helped advance home refrigeration, undoubtedly made a substantial impact on society, but her place in our historical memory is perhaps more _______ than that of Stephanie Kwolek, who invented the incredibly strong material known as Kevlar, an accomplishment for which she will long be remembered.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) permanent\nB) tentative\nC) warranted\nD) prominent", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Although the reformer changed public health policy, her place in popular memory remains _______ compared with that of the politicians who later adopted her ideas.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) precarious\nB) unquestioned\nC) prominent\nD) permanent", "answer": "A", "explanation": "Precarious means uncertain or insecure."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The instrument maker's influence was substantial, but because few of his instruments survive, his reputation is more _______ than that of better-documented contemporaries.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) celebrated\nB) warranted\nC) dominant\nD) tentative", "answer": "D", "explanation": "Tentative means uncertain."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The scientist's contribution to early computing is significant, though her status in standard histories is still _______ because many records were lost.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) deserved\nB) prominent\nC) uncertain\nD) permanent", "answer": "C", "explanation": "Uncertain captures tentative status."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The novelist was admired in her lifetime, but her position in the modern canon is relatively _______ , with critics still debating whether her work should be widely taught.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) commanding\nB) famous\nC) enduring\nD) unstable", "answer": "D", "explanation": "Unstable means not firmly established."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The educator's methods influenced generations of teachers, yet her historical reputation remains _______ because she published little under her own name.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) conspicuous\nB) provisional\nC) permanent\nD) prominent", "answer": "B", "explanation": "Provisional means tentative."}]}, {"n": 6, "concept": "Main Purpose: portray Francie's determination.", "original": "The following text is from Betty Smith's 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often.\n\nFrancie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B's. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For all her enthusiasm, she had to admit that some of the B's had been hard going. But Francie was a reader.\n\nWhich choice best states the main purpose of the text?\nA) To illustrate Francie's enjoyment of an unusual topic\nB) To explain why Francie prefers reading over other activities\nC) To portray Francie's determination to meet a goal\nD) To describe a book that Francie greatly admires", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To summarize a conflict between two relatives\nB) To portray a setting and mood as characters prepare for an arrival\nC) To explain why music has lost its importance\nD) To argue that the characters should leave the house", "answer": "B", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To compare several forms of transportation\nB) To list the technical features of a harbor\nC) To criticize sailors for taking unnecessary risks\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To depict preparations that reveal anticipation within a family\nB) To explain why the family dislikes visitors\nC) To contrast rural and urban customs\nD) To describe a completed celebration from beginning to end", "answer": "A", "explanation": "The details focus on preparation and anticipation."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To recount a student's entire academic career\nB) To argue that early classes should be canceled\nC) To describe the moments before a significant daily activity begins\nD) To evaluate the quality of a school's curriculum", "answer": "C", "explanation": "The purpose is to depict a scene before an event."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To give instructions for maintaining a garden\nB) To compare two different seasons\nC) To reveal the full contents of a letter\nD) To establish a reflective mood before a character acts", "answer": "D", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 7, "concept": "Main Purpose: experiment casts doubt on hypothesis.", "original": "Researchers have long hypothesized that woolly mammoths were hunted to extinction in North America by humans using spears with grooved tips known as Clovis points. One anthropologist set out to test this hypothesis. Using a mechanical spear-thrower, he launched spears with Clovis points into mounds of clay--substitutes for the animals' large bodies. The projectiles generally penetrated only a few inches into the clay, an amount insufficient to have harmed most woolly mammoths. This led the anthropologist to conclude that hunters using spears with Clovis points likely weren't the principal drivers of the extinction.\n\nWhich choice best states the main purpose of the text?\nA) To argue for the significance of new findings amid an ongoing debate among researchers\nB) To discuss the advantages and disadvantages of the method used in an experiment\nC) To summarize two competing hypotheses and a major finding associated with each one\nD) To describe an experiment whose results cast doubt on an established hypothesis", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To summarize a conflict between two relatives\nB) To argue that the characters should leave the house\nC) To portray a setting and mood as characters prepare for an arrival\nD) To explain why music has lost its importance", "answer": "C", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To list the technical features of a harbor\nB) To compare several forms of transportation\nC) To criticize sailors for taking unnecessary risks\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To explain why the family dislikes visitors\nB) To contrast rural and urban customs\nC) To describe a completed celebration from beginning to end\nD) To depict preparations that reveal anticipation within a family", "answer": "D", "explanation": "The details focus on preparation and anticipation."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To describe the moments before a significant daily activity begins\nB) To evaluate the quality of a school's curriculum\nC) To recount a student's entire academic career\nD) To argue that early classes should be canceled", "answer": "A", "explanation": "The purpose is to depict a scene before an event."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To give instructions for maintaining a garden\nB) To establish a reflective mood before a character acts\nC) To reveal the full contents of a letter\nD) To compare two different seasons", "answer": "B", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 8, "concept": "Text Function: concede limited access to bathhouses.", "original": "The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and--more affordably--steam baths. While such amenities were available mainly to town dwellers, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?\nA) It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.\nB) It describes a limitation of earlier historians' studies of medieval European bathing habits.\nC) It concedes that not all people in medieval Europe had access to public bathhouses.\nD) It explains why Janega decided to study the popularity of public bathhouses in medieval Europe.", "generated": [{"id": "8.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It identifies the uncertainty that motivated the study.\nB) It describes how other researchers criticized the work.\nC) It states the study's final conclusion.\nD) It offers evidence that radar is always reliable.", "answer": "A", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It summarizes the team's strongest result.\nB) It shifts the discussion away from archaeology.\nC) It defines the problem the later investigation attempts to address.\nD) It contradicts the claim made in the first sentence.", "answer": "C", "explanation": "The sentence frames the central research question."}, {"id": "8.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It lists the materials used in the experiment.\nB) It proves that drought has no effect on plants.\nC) It gives a historical overview of plant classification.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "8.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It summarizes the novel's publication history.\nB) It raises a difficulty with a common interpretation.\nC) It provides biographical information about the novelist.\nD) It introduces an unrelated theme.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It explains the limitation that the new system is meant to address.\nB) It gives a personal anecdote about engineers.\nC) It compares underwater vehicles with aircraft.\nD) It announces that the technology is already flawless.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 9, "concept": "Text Function: scholarship focus obscures ideological diversity.", "original": "Scholarly accounts of the Chicano movement--a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s--tend to focus on the most militant, outspoken figures in the movement, making it seem uniformly radical. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in comparatively low-profile neighborhood institutions and projects, we see participants espousing an array of political orientations and approaches to community activism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\nA) It presents a trend in scholarship on the Chicano movement that the text claims has been reevaluated by researchers in light of Herrera's work on the movement's participants.\nB) It identifies an aspect of the Chicano movement that the text implies was overemphasized by scholars due to their own political orientations.\nC) It describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement's participants.\nD) It summarizes the conventional method for analyzing the Chicano movement, which the text suggests creates a misleading impression of the effectiveness of neighborhood institutions and projects.", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It states the study's final conclusion.\nB) It identifies the uncertainty that motivated the study.\nC) It offers evidence that radar is always reliable.\nD) It describes how other researchers criticized the work.", "answer": "B", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "9.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded w hat the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It raises a difficulty with a common interpretation.\nB) It introduces an unrelated theme.\nC) It summarizes the novel's publication history.\nD) It provides biographical information about the novelist.", "answer": "A", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It compares underwater vehicles with aircraft.\nB) It announces that the technology is already flawless.\nC) It gives a personal anecdote about engineers.\nD) It explains the limitation that the new system is meant to address.", "answer": "D", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 10, "concept": "Main Idea: resource reliance deters foreign investment.", "original": "Elizabeth Asiedu has identified a negative correlation between the share of developing countries' economies derived from natural-resource extraction and those countries' receipts of foreign investment. This may appear counterintuitive--resource extraction requires initial investments (in extractive technology, for instance) at scales best met by multinational corporations--but Asiedu notes that natural-resource industries' boom-bust cycle can destabilize local currencies and increase developing countries' vulnerability to external shocks, creating levels of uncertainty to which foreign investors are typically averse.\n\nWhich choice best states the main idea of the text?\nA) Although it may seem surprising that foreign investment declines in developing countries as natural-resource extraction makes up a larger share of those countries' economies, that decline happens because resource extraction requires initial investments too large for foreign investors to supply.\nB) Although developing countries tend to become less dependent on foreign investment as natural-resource industries make up a larger share of their economies, this change may not occur if the boom-bust cycle of those industries destabilizes local currencies or increases countries' vulnerability to external shocks.\nC) Although one might expect that foreign investment would increase as natural-resource extraction makes up a larger share of developing countries' economies, the opposite happens because heavy reliance on natural resources can lead to unattractive conditions for investors.\nD) Although foreign investors tend to avoid initial investments in natural-resource industries in developing countries, foreign investment may increase significantly as those industries stabilize and the risks associated with them decline.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To argue that the characters should leave the house\nB) To explain why music has lost its importance\nC) To summarize a conflict between two relatives\nD) To portray a setting and mood as characters prepare for an arrival", "answer": "D", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To criticize sailors for taking unnecessary risks\nB) To present an atmosphere of departure and possibility\nC) To compare several forms of transportation\nD) To list the technical features of a harbor", "answer": "B", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "10.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical  must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To establish a reflective mood before a character acts\nB) To compare two different seasons\nC) To give instructions for maintaining a garden\nD) To reveal the full contents of a letter", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 11, "concept": "Inference: unchanged composition rules out alternative explanation.", "original": "To understand how temperature change affects microorganism-mediated cycling of soil nutrients in alpine ecosystems, Eva Kastovska et al. collected plant-soil cores in the Tatra Mountains at elevations around 2,100 meters and transplanted them to elevations of 1,700-1,800 meters, where the mean air temperature was warmer by 2 degrees C. Microorganism-mediated nutrient cycling was accelerated in the transplanted cores; crucially, microorganism community composition was unchanged, allowing Kastovska et al. to attribute the acceleration to temperature-induced increases in microorganism activity.\n\nIt can most reasonably be inferred from the text that the finding about the microorganism community composition was important for which reason?\nA) It provided preliminary evidence that microorganism-mediated nutrient cycling was accelerated in the transplanted cores.\nB) It suggested that temperature-induced changes in microorganism activity may be occurring at increasingly high elevations.\nC) It ruled out a potential alternative explanation for the acceleration in microorganism-mediated nutrient cycling.\nD) It clarified that microorganism activity levels in the plant-soil cores varied depending on which microorganisms comprised the community.", "generated": [{"id": "11.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) She is admired mainly for her wealth.\nB) She refuses to give advice to others.\nC) She shows unusual maturity and self-command.\nD) She lacks affection for her family.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The grandmother avoids family matters entirely.\nB) The narrator thinks patience is useless.\nC) The family ignores the grandmother's opinions.\nD) The grandmother's influence is quiet but substantial.", "answer": "D", "explanation": "The family respects her careful judgment."}, {"id": "11.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The clerk intentionally creates errors.\nB) The clerk's carefulness is valuable despite being inconvenient.\nC) The coworkers are more accurate than the clerk.\nD) The business fails because of excessive caution.", "answer": "B", "explanation": "The passage praises his precision."}, {"id": "11.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The leader dislikes public meetings.\nB) The leader values inclusive deliberation.\nC) The leader is unable to reach conclusions.\nD) The leader makes decisions without hearing others.", "answer": "B", "explanation": "The evidence shows patience and inclusion."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) She combines intellectual openness with rigorous standards.\nB) She rejects all imaginative thinking.\nC) She avoids working with students.\nD) She publishes claims before testing them.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 12, "concept": "Inference: NH3 biosignature depends on planet type.", "original": "Some astronomers searching for extraterrestrial life have proposed that atmospheric NH3 (ammonia) can serve as a biosignature gas--an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH3 likely couldn't reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini-Neptunes--gas planets smaller than Neptune but with atmospheres similar to Neptune's--atmospheric pressure and temperature can be high enough to produce atmospheric NH3.\n\nBased on the text, Huang, Seager, and colleagues would most likely agree with which statement about atmospheric NH3?\nA) Its presence is more likely to indicate that a planet is a mini-Neptune than that the planet is a rocky planet that could support life.\nB) Its absence from a planet that's not a mini-Neptune indicates that the planet probably doesn't have life.\nC) It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a mini-Neptune.\nD) It doesn't reliably reach high enough concentrations in the atmospheres of rocky planets or mini-Neptunes to be treated as a biosignature gas.", "generated": [{"id": "12.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) She refuses to give advice to others.\nB) She is admired mainly for her wealth.\nC) She shows unusual maturity and self-command.\nD) She lacks affection for her family.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The grandmother avoids family matters entirely.\nB) The grandmother's influence is quiet but substantial.\nC) The family ignores the grandmother's opinions.\nD) The narrator thinks patience is useless.", "answer": "B", "explanation": "The family respects her careful judgment."}, {"id": "12.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The business fails because of excessive caution.\nB) The clerk intentionally creates errors.\nC) The clerk's carefulness is valuable despite being inconvenient.\nD) The coworkers are more accurate than the clerk.", "answer": "C", "explanation": "The passage praises his precision."}, {"id": "12.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The leader dislikes public meetings.\nB) The leader is unable to reach conclusions.\nC) The leader makes decisions without hearing others.\nD) The leader values inclusive deliberation.", "answer": "D", "explanation": "The evidence shows patience and inclusion."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) She combines intellectual openness with rigorous standards.\nB) She publishes claims before testing them.\nC) She avoids working with students.\nD) She rejects all imaginative thinking.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 13, "concept": "Quantitative Evidence: Grand Canyon highest monthly visits.", "original": "Recreation Visits by Month to Four US National Parks during the Peak Season in 2021: a graph compares Yellowstone, Zion, Grand Canyon, and Rocky Mountain National Parks over three peak-season months. In 2021, four of the United States national parks that were among the most visited were Grand Canyon National Park, Rocky Mountain National Park, Yellowstone National Park, and Zion National Park. The graph shows the number of visits for recreation to each of these parks during the three-month period with the highest number of visitors. A student notes that among the parks shown in the graph, the park with the highest monthly recreation visits in all three months was _______\n\nWhich choice most effectively uses data from the graph to complete the text?\nA) Zion National Park.\nB) Rocky Mountain National Park.\nC) Yellowstone National Park.\nD) Grand Canyon National Park.", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) The graph contains information about three regions.\nC) The southern region was included in the survey.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) The method used to study stars requires a telescope.\nC) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nD) One rocky planet has a thin atmosphere.", "answer": "C", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) The tradition is studied by scholars in several countries.\nD) Many performers learned songs from relatives.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program took place in a community.\nB) The table includes more than one year.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Poetry Evidence: contradictory feelings on a spring day.", "original": "\"Lines Written in Early Spring\" is a 1798 poem by William Wordsworth. In the poem, the speaker describes having contradictory feelings while experiencing the sights and sounds of a spring day: _______\n\nWhich quotation from \"Lines Written in Early Spring\" most effectively illustrates the claim?\nA) \"Through primrose-tufts, in that sweet bower, / The periwinkle trail'd its wreathes; / And 'tis my faith that every flower / Enjoys the air it breathes.\"\nB) \"The budding twigs spread out their fan, / To catch the breezy air; / And I must think, do all I can, / That there was pleasure there.\"\nC) \"The birds around me hopp'd and play'd: / Their thoughts I cannot measure, / But the least motion which they made, / It seem'd a thrill of pleasure.\"\nD) \"I heard a thousand blended notes, / While in a grove I [sat] reclined, / In that sweet mood when pleasant thoughts / Bring sad thoughts to the mind.\"", "generated": [{"id": "14.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the pro  "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Quantitative Evidence: placebo-aware group higher on all measures.", "original": "Mean Ratings for Patients after 21 Days\nGlobal improvement: participants aware of taking a placebo 5.0; control group 3.9.\nSymptom severity reduction: participants aware of taking a placebo 92.00; control group 46.00.\nQuality of life improvement: participants aware of taking a placebo 11.4; control group 5.4.\n\nTo test whether a medication is effective, scientists compare outcomes for patients taking it and patients taking a placebo. Patients normally aren't told they're receiving a placebo, but a research team conducted a study to see if there might be a medical benefit to telling them. The team used various measures to evaluate participants, with higher ratings indicating greater well-being in each measure. Compared to the mean ratings after 21 days for participants in the control group, the mean ratings for participants who were aware of taking a placebo _______\n\nWhich choice most effectively uses data from the table to complete the statement?\nA) ranged from 5.0 to 92.00, indicating that well-being varied widely from participant to participant.\nB) were lower for two measures, with the rating for only one measure indicating greater well-being for these participants.\nC) ranged from 3.9 to 46.00, with no rating indicating greater well-being in any measure for these participants.\nD) were higher for all three measures, indicating greater overall well-being for these participants.", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and n irectly support the idea advanced by Gil de Zuniga and Diehl?\nA) NFM attitude tends to increase in strength as major elections approach, and people are significantly more likely to vote in major elections than in minor elections.\nB) NFM attitude has a strong negative effect on political knowledge and interest, and there is known to be a strong positive correlation between political knowledge and interest and the likelihood of voting.\nC) Political interest is known to have a strong positive effect on likelihood of voting but shows only a weak positive effect on political knowledge, and NFM attitude shows little correlation with either political knowledge or political interest.\nD) The likelihood of voting increases as political knowledge increases, and the relationship between NFM attitude and political knowledge tends to strengthen as the size of people's social networks increases.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader signed
