ain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The two recordings differ in tempo and instrumentation; _______ some listeners insist that they should be treated as separate compositions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這兩份錄音在速度與配器上有所不同；_______ 有些聽眾堅持認為它們應該被視為兩首不同的作品。", "opts": {"A": "nevertheless,", "B": "by contrast,", "C": "in fact,", "D": "in other words,"}, "optsZh": {"A": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "B": "by contrast,（相較之下：表對比 → 錯誤）", "C": "in fact,（事實上：進一步強化前句的說法：正確）", "D": "in other words,（換句話說：表重述 → 錯誤）"}, "answer": "C", "expl": "In fact intensifies the claim.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The revised map does more than correct a few place names; _______ it redraws several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> borders.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The revised map does more than correct a few place names; _______ it redraws several national borders.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。修訂後的地圖不只是更正了幾個地名；_______ 它重新劃定了好幾條國界。", "opts": {"A": "for example,", "B": "therefore,", "C": "nevertheless,", "D": "in fact,"}, "optsZh": {"A": "for example,（例如：表舉例 → 錯誤）", "B": "therefore,（因此：表因果結論 → 錯誤）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "in fact,（事實上：進一步強化前句的說法：正確）"}, "answer": "D", "expl": "In fact emphasizes the extent.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The storm caused more than minor delays; _______ several coastal highways remained closed for a week.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The storm caused more than minor delays; _______ several coastal highways remained closed for a week.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這場暴風雨造成的不只是輕微的延誤；_______ 好幾條沿海公路封閉了一個星期。", "opts": {"A": "in other words,", "B": "in fact,", "C": "nevertheless,", "D": "by contrast,"}, "optsZh": {"A": "in other words,（換句話說：表重述 → 錯誤）", "B": "in fact,（事實上：進一步強化前句的說法：正確）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "by contrast,（相較之下：表對比 → 錯誤）"}, "answer": "B", "expl": "In fact strengthens the prior statement.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> is unusually different from the printed edition; _______ entire chapters appear in a different order.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The manuscript is unusually different from the printed edition; _______ entire chapters appear in a different order.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這份手稿與印刷版本差異極大；_______ 整個章節的順序都不一樣。", "opts": {"A": "in fact,", "B": "therefore,", "C": "however,", "D": "by contrast,"}, "optsZh": {"A": "in fact,（事實上：進一步強化前句的說法：正確）", "B": "therefore,（因此：表因果結論 → 錯誤）", "C": "however,（然而：表轉折 → 錯誤）", "D": "by contrast,（相較之下：表對比 → 錯誤）"}, "answer": "A", "expl": "In fact adds stronger evidence.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: in fact intensifies preceding claim.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The two versions of the speech are not merely stylistically distinct; _______ they advance opposing positions on the same policy.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The two versions of the speech are not merely stylistically distinct; _______ they advance opposing positions on the same policy.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這篇演講的兩個版本不僅在風格上有所不同；_______ 它們對同一項政策提出了相反的立場。", "opts": {"A": "for example,", "B": "in other words,", "C": "in fact,", "D": "nevertheless,"}, "optsZh": {"A": "for example,（例如：表舉例 → 錯誤）", "B": "in other words,（換句話說：表重述 → 錯誤）", "C": "in fact,（事實上：進一步強化前句的說法：正確）", "D": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）"}, "answer": "C", "expl": "In fact intensifies the difference.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- In World War I, US soldiers who were members of the Choctaw Nation in Oklahoma participated in the Choctaw Code Talkers program.<br>- The Choctaw Code Talkers were trained to relay coded military information in their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">native<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a>.<br>- In World War II, the US Army <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recruit\" target=\"_blank\" rel=\"noopener\" data-w=\"recruit\" data-pos=\"v.\" data-en=\"to persuade someone to join an organization or activity\" data-zh=\"招募\">recruited<\/a> Navajo (Dine) soldiers to transmit coded messages in their native language.<br>- These soldiers were known as the Navajo Code Talkers.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In World War I, US soldiers who were members of the Choctaw Nation in Oklahoma participated in the Choctaw Code Talkers program.\n- The Choctaw Code Talkers were trained to relay coded military information in their native language.\n- In World War II, the US Army recruited Navajo (Dine) soldiers to transmit coded messages in their native language.\n- These soldiers were known as the Navajo Code Talkers.", "stem": "The student wants to emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要強調 Choctaw 密碼通訊員與 Navajo 密碼通訊員之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時，做了以下筆記：\n- 在第一次世界大戰中，奧克拉荷馬州 Choctaw 族的美國士兵參與了 Choctaw 密碼通訊員計畫。\n- Choctaw 密碼通訊員受過訓練，以他們的母語傳遞加密的軍事資訊。\n- 在第二次世界大戰中，美國陸軍招募了 Navajo（Dine）族士兵，以他們的母語傳送加密訊息。\n- 這些士兵被稱為 Navajo 密碼通訊員。", "opts": {"A": "US soldiers who were members of the Choctaw Nation in Oklahoma used their native language to relay coded information.", "B": "In World War II, one group of Navajo (Dine) soldiers was known as the Navajo Code Talkers.", "C": "Both the Choctaw Code Talkers and the Navajo Code Talkers transmitted coded military messages in the soldiers' native languages.", "D": "The Choctaw Code Talkers, not the Navajo Code Talkers, served in World War I."}, "optsZh": {"A": "來自奧克拉荷馬州喬克托族（Choctaw Nation）的美國士兵使用自己的母語傳遞加密資訊。", "B": "在第二次世界大戰中，有一群納瓦霍族（Dine）士兵被稱為「納瓦霍密碼通訊員」（Navajo Code Talkers）。", "C": "Choctaw 密碼通訊員和 Navajo 密碼通訊員都以士兵的母語傳送加密的軍事訊息。", "D": "在第一次世界大戰中服役的是喬克托密碼通訊員（Choctaw Code Talkers），而不是納瓦霍密碼通訊員。"}, "answer": "C", "expl": "Only C states what the two groups share: both transmitted coded military messages in their native languages.", "explZh": "只有 C 點出兩個團體的共同點：都用自己的母語傳遞軍事密碼訊息。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: During one war, members of Nation A used their language to send coded radio messages; during another war, members of Nation B also used their language to send coded messages; the goal is to emphasize a similarity.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: During one war, members of Nation A used their language to send coded radio messages; during another war, members of Nation B also used their language to send coded messages; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：在一場戰爭中，A 族的成員使用他們的語言傳送加密的無線電訊息；在另一場戰爭中，B 族的成員也使用他們的語言傳送加密訊息；目標是強調兩者的相似之處。", "opts": {"A": "Nation B's soldiers served in a later war.", "B": "Both groups used their native languages to transmit coded military messages.", "C": "Nation A's program began before Nation B's program.", "D": "The two programs involved different Indigenous nations."}, "optsZh": {"A": "Nation B 的士兵在較晚的一場戰爭中服役。", "B": "兩個團體都使用自己的母語傳遞加密的軍事訊息。", "C": "Nation A 的計畫早於 Nation B 的計畫開始。", "D": "這兩個計畫涉及不同的原住民族。"}, "answer": "B", "expl": "The answer states the shared function.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The Coast Watchers relayed coded ship locations by radio; the Mountain Signals unit relayed coded troop positions by radio; both groups used locally known <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">languages<\/a>; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Coast Watchers relayed coded ship locations by radio; the Mountain Signals unit relayed coded troop positions by radio; both groups used locally known languages; the goal is to emphasize similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：海岸觀察隊透過無線電傳遞加密的船隻位置；山地信號部隊透過無線電傳遞加密的部隊位置；兩個團體都使用當地通行的語言；目標是強調兩者的相似之處。", "opts": {"A": "The Mountain Signals unit reported troop positions.", "B": "Both the Coast Watchers and the Mountain Signals unit used locally known languages to relay coded military information by radio.", "C": "The Coast Watchers reported ship locations.", "D": "The two units operated in different regions."}, "optsZh": {"A": "Mountain Signals 部隊回報部隊位置。", "B": "Coast Watchers 和 Mountain Signals 部隊都使用當地通行的語言，透過無線電傳遞加密的軍事資訊。", "C": "Coast Watchers 回報船隻位置。", "D": "這兩個部隊在不同地區執行任務。"}, "answer": "B", "expl": "The answer emphasizes the similarity.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Group X served in World War I; Group Y served in World War II; both were trained to transmit encrypted battlefield messages in their communities&#x27; languages; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> similarity.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Group X served in World War I; Group Y served in World War II; both were trained to transmit encrypted battlefield messages in their communities' languages; the goal is to emphasize similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：X 團體在第一次世界大戰中服役；Y 團體在第二次世界大戰中服役；兩者都受過訓練，以各自社群的語言傳送加密的戰場訊息；目標是強調兩者的相似之處。", "opts": {"A": "Encrypted messages were important in both wars.", "B": "Group X served earlier than Group Y.", "C": "Both Group X and Group Y transmitted encrypted battlefield messages in their communities' languages.", "D": "Group Y was trained during World War II."}, "optsZh": {"A": "加密訊息在兩場戰爭中都很重要。", "B": "Group X 比 Group Y 更早服役。", "C": "Group X 和 Group Y 都以各自族群的語言傳遞加密的戰場訊息。", "D": "Group Y 是在第二次世界大戰期間受訓的。"}, "answer": "C", "expl": "The answer states what both groups did.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: The River Unit used its native language for coded supply messages; the Desert Unit used its native language for coded location messages; both worked for the army; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> similarity.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The River Unit used its native language for coded supply messages; the Desert Unit used its native language for coded location messages; both worked for the army; the goal is to emphasize similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：河流部隊使用其母語傳送加密的補給訊息；沙漠部隊使用其母語傳送加密的位置訊息；兩者都為陸軍效力；目標是強調兩者的相似之處。", "opts": {"A": "The Desert Unit transmitted location messages.", "B": "Both units worked for the army.", "C": "The River Unit transmitted supply messages.", "D": "Both the River Unit and the Desert Unit used native languages to send coded military messages."}, "optsZh": {"A": "Desert Unit 傳送位置訊息。", "B": "兩個部隊都為軍隊效力。", "C": "River Unit 傳送補給訊息。", "D": "River Unit 和 Desert Unit 都使用母語傳送加密的軍事訊息。"}, "answer": "D", "expl": "The answer emphasizes the shared method.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: emphasize similarity between code talker groups.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The Hill Code team sent coded weather reports in its Indigenous language; the Plains Code team sent coded troop reports in its Indigenous language; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> similarity.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The Hill Code team sent coded weather reports in its Indigenous language; the Plains Code team sent coded troop reports in its Indigenous language; the goal is to emphasize similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：丘陵密碼小組以其原住民語言傳送加密的氣象報告；平原密碼小組以其原住民語言傳送加密的部隊報告；目標是強調兩者的相似之處。", "opts": {"A": "Both code teams used Indigenous languages to transmit coded reports for military purposes.", "B": "The Plains Code team sent troop reports.", "C": "The two teams transmitted different kinds of information.", "D": "The Hill Code team sent weather reports."}, "optsZh": {"A": "兩支密碼小組都使用原住民語言傳遞軍事用途的密碼報告。", "B": "Plains Code 小組傳送部隊報告。", "C": "這兩個小組傳遞不同類型的資訊。", "D": "Hill Code 小組傳送天氣報告。"}, "answer": "A", "expl": "The answer identifies the similarity.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Meteorites found on Earth are divided into two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=category\" target=\"_blank\" rel=\"noopener\" data-w=\"category\" data-pos=\"n.\" data-en=\"a group of things that share similar qualities\" data-zh=\"類別；範疇\">categories<\/a>.<br>- A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=meteorite\" target=\"_blank\" rel=\"noopener\" data-w=\"meteorite\" data-pos=\"n.\" data-en=\"a piece of rock from space that has landed on Earth\" data-zh=\"隕石\">meteorite<\/a> that was observed falling to Earth before being <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recover\" target=\"_blank\" rel=\"noopener\" data-w=\"recover\" data-pos=\"v.\" data-en=\"to return to a normal or healthy state\" data-zh=\"復原；康復\">recovered<\/a> is known as a meteorite fall.<br>- All other meteorites found on Earth are known as meteorite finds.<br>- There have been about 1,200 recorded meteorite falls.<br>- There have been over 60,000 recorded meteorite finds.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Meteorites found on Earth are divided into two categories.\n- A meteorite that was observed falling to Earth before being recovered is known as a meteorite fall.\n- All other meteorites found on Earth are known as meteorite finds.\n- There have been about 1,200 recorded meteorite falls.\n- There have been over 60,000 recorded meteorite finds.", "stem": "The student wants to contrast the number of meteorite falls with the number of meteorite finds. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要對比目擊隕石與發現隕石的數量。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時，做了以下筆記：\n- 在地球上發現的隕石分為兩類。\n- 在被尋獲之前曾被目擊墜落到地球的隕石，稱為「目擊隕石」（meteorite fall）。\n- 在地球上發現的所有其他隕石，則稱為「發現隕石」（meteorite find）。\n- 有紀錄的目擊隕石約有 1,200 顆。\n- 有紀錄的發現隕石超過 60,000 顆。", "opts": {"A": "A meteorite that was observed falling to Earth before being recovered is known as a meteorite fall; all others are known as meteorite finds.", "B": "Meteorites found on Earth are divided into two categories: meteorite falls and meteorite finds.", "C": "There have been about 1,200 recorded meteorite falls, or meteorites observed falling to Earth.", "D": "While there have been only about 1,200 recorded meteorite falls, there have been over 60,000 meteorite finds."}, "optsZh": {"A": "在墜落至地球時被觀測到、之後才被尋獲的隕石稱為「目擊隕石」；其他所有隕石則稱為「發現隕石」。", "B": "在地球上發現的隕石分為兩類：目擊墜落隕石與尋獲隕石。", "C": "目前約有 1,200 次有紀錄的目擊墜落隕石，也就是被觀測到墜落至地球的隕石。", "D": "有紀錄的目擊墜落隕石只有約 1,200 次，而尋獲隕石則超過 60,000 顆。"}, "answer": "D", "expl": "D contrasts the two numbers directly: only about 1,200 falls versus over 60,000 finds.", "explZh": "D 直接對比兩個數字：記錄到的隕石墜落只有約 1,200 次，而發現的隕石超過 60,000 個。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: About 900 confirmed impact craters are smaller than 1 kilometer wide; more than 25,000 are larger than 1 kilometer wide; the goal is to contrast the numbers.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: About 900 confirmed impact craters are smaller than 1 kilometer wide; more than 25,000 are larger than 1 kilometer wide; the goal is to contrast the numbers.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：約有 900 個已確認的撞擊坑寬度小於 1 公里；超過 25,000 個寬度大於 1 公里；目標是對比這兩個數字。", "opts": {"A": "There are more confirmed large craters than small craters.", "B": "While about 900 confirmed impact craters are smaller than 1 kilometer wide, more than 25,000 are larger than 1 kilometer wide.", "C": "Impact craters can be grouped by width.", "D": "Some confirmed craters are smaller than 1 kilometer."}, "optsZh": {"A": "已確認的大型撞擊坑比小型撞擊坑多。", "B": "雖然約有 900 個已確認的撞擊坑寬度小於 1 公里，但有超過 25,000 個寬度大於 1 公里。", "C": "撞擊坑可依寬度分類。", "D": "有些已確認的撞擊坑小於 1 公里。"}, "answer": "B", "expl": "The answer directly contrasts the numbers.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The archive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> about 450 handwritten diaries; it contains over 18,000 printed letters; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrast<\/a> the numbers.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The archive contains about 450 handwritten diaries; it contains over 18,000 printed letters; the goal is to contrast the numbers.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：這個檔案館收藏約 450 本手寫日記；收藏超過 18,000 封印刷信件；目標是對比這兩個數字。", "opts": {"A": "Handwritten diaries can provide personal historical evidence.", "B": "The archive contains both diaries and letters.", "C": "Printed letters are one type of archive item.", "D": "Although the archive contains about 450 handwritten diaries, it contains over 18,000 printed letters."}, "optsZh": {"A": "手寫日記能提供個人層面的歷史證據。", "B": "該檔案館同時收藏日記和信件。", "C": "印刷信件是檔案館藏品的一種。", "D": "雖然該檔案館收藏約 450 本手寫日記，但它收藏了超過 18,000 封印刷信件。"}, "answer": "D", "expl": "The answer contrasts the quantities.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A wildlife survey counted 1,100 nesting pairs of Species A; the same survey counted more than 70,000 nesting pairs of Species B; the goal is to contrast the numbers.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A wildlife survey counted 1,100 nesting pairs of Species A; the same survey counted more than 70,000 nesting pairs of Species B; the goal is to contrast the numbers.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：一項野生動物調查統計到 1,100 對 A 物種的繁殖配對；同一項調查統計到超過 70,000 對 B 物種的繁殖配對；目標是對比這兩個數字。", "opts": {"A": "While Species A had about 1,100 nesting pairs, Species B had more than 70,000.", "B": "Nesting pairs are counted during breeding season.", "C": "The survey covered several habitats.", "D": "Species A and Species B were both included in the survey."}, "optsZh": {"A": "Species A 約有 1,100 對繁殖對，而 Species B 則超過 70,000 對。", "B": "繁殖對數量是在繁殖季期間計算的。", "C": "這項調查涵蓋了數種棲地。", "D": "Species A 和 Species B 都被納入調查。"}, "answer": "A", "expl": "The answer contrasts the counts.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: The library owns about 2,000 maps; it owns more than 90,000 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>; the goal is to contrast the numbers.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The library owns about 2,000 maps; it owns more than 90,000 photographs; the goal is to contrast the numbers.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：這間圖書館擁有約 2,000 張地圖；擁有超過 90,000 張照片；目標是對比這兩個數字。", "opts": {"A": "Maps and photographs are both visual records.", "B": "The library owns about 2,000 maps.", "C": "The library owns far fewer maps than photographs: about 2,000 maps compared with more than 90,000 photographs.", "D": "Photographs make up one part of the collection."}, "optsZh": {"A": "地圖和照片都是視覺紀錄。", "B": "該圖書館擁有約 2,000 幅地圖。", "C": "該圖書館擁有的地圖遠少於照片：約 2,000 幅地圖，相較之下照片超過 90,000 張。", "D": "照片是該館藏的一部分。"}, "answer": "C", "expl": "The answer makes the contrast explicit.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: contrast numbers of meteorite falls and finds.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The database lists 650 volcanic eruptions before 1500; it lists over 12,000 eruptions after 1500; the goal is to contrast the numbers.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The database lists 650 volcanic eruptions before 1500; it lists over 12,000 eruptions after 1500; the goal is to contrast the numbers.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：這個資料庫列出 1500 年以前的 650 次火山爆發；列出 1500 年以後超過 12,000 次的火山爆發；目標是對比這兩個數字。", "opts": {"A": "Some eruptions occurred before 1500.", "B": "Only 650 listed eruptions occurred before 1500, whereas over 12,000 listed eruptions occurred after 1500.", "C": "The database organizes eruptions by date.", "D": "Eruptions after 1500 are more numerous in the database."}, "optsZh": {"A": "有些火山噴發發生在 1500 年之前。", "B": "所列火山噴發中只有 650 次發生在 1500 年之前，而超過 12,000 次發生在 1500 年之後。", "C": "該資料庫依日期整理火山噴發紀錄。", "D": "資料庫中 1500 年之後的火山噴發數量較多。"}, "answer": "B", "expl": "The answer contrasts the categories.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Dona Maria do Carmo Bandeira was a Brazilian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a>.<br>- Between 1924 and 1941, she collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 800 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanical\" target=\"_blank\" rel=\"noopener\" data-w=\"botanical\" data-pos=\"adj.\" data-en=\"related to plants\" data-zh=\"植物的\">botanical<\/a> samples.<br>- She collected a sample of Polytrichum juniperinum from Serra de Itatiaia in Maua in February of 1925.<br>- She collected a sample of Sphagnum gracilescen from Ponte do Inferno in Corcovado in March of 1925.<br>- Polytrichum juniperinum and Sphagnum gracilescen are both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of moss.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Dona Maria do Carmo Bandeira was a Brazilian botanist.\n- Between 1924 and 1941, she collected approximately 800 botanical samples.\n- She collected a sample of Polytrichum juniperinum from Serra de Itatiaia in Maua in February of 1925.\n- She collected a sample of Sphagnum gracilescen from Ponte do Inferno in Corcovado in March of 1925.\n- Polytrichum juniperinum and Sphagnum gracilescen are both species of moss.", "stem": "The student wants to emphasize the sample collected from Serra de Itatiaia. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要強調從 Serra de Itatiaia 採集的標本。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時，做了以下筆記：\n- Dona Maria do Carmo Bandeira 是一位巴西植物學家。\n- 在 1924 年至 1941 年間，她採集了大約 800 份植物標本。\n- 她於 1925 年 2 月在 Maua 的 Serra de Itatiaia 採集了一份 Polytrichum juniperinum 標本。\n- 她於 1925 年 3 月在 Corcovado 的 Ponte do Inferno 採集了一份 Sphagnum gracilescen 標本。\n- Polytrichum juniperinum 和 Sphagnum gracilescen 都是苔蘚的物種。", "opts": {"A": "Dona Maria do Carmo Bandeira was a botanist notable for collecting approximately 800 botanical samples between 1924 and 1941.", "B": "Among the many botanical samples Dona Maria do Carmo Bandeira collected was Polytrichum juniperinum, a species of moss she collected from Serra de Itatiaia in 1925.", "C": "Between 1924 and 1941, Dona Maria do Carmo Bandeira collected many botanical samples, such as Polytrichum juniperinum from Serra de Itatiaia and Sphagnum gracilescen from Ponte do Inferno.", "D": "Between 1924 and 1941, Dona Maria do Carmo Bandeira collected samples of Polytrichum juniperinum and Sphagnum gracilescen, both species of moss."}, "optsZh": {"A": "Dona Maria do Carmo Bandeira 是一位植物學家，以在 1924 到 1941 年間採集約 800 件植物標本而聞名。", "B": "在 Dona Maria do Carmo Bandeira 採集的眾多植物標本中，有一種是 Polytrichum juniperinum，這是她於 1925 年在 Serra de Itatiaia 採集的一種苔蘚。", "C": "在 1924 到 1941 年間，Dona Maria do Carmo Bandeira 採集了許多植物標本，例如來自 Serra de Itatiaia 的 Polytrichum juniperinum 和來自 Ponte do Inferno 的 Sphagnum gracilescen。", "D": "在 1924 到 1941 年間，Dona Maria do Carmo Bandeira 採集了 Polytrichum juniperinum 和 Sphagnum gracilescen 的標本，兩者都是苔蘚物種。"}, "answer": "B", "expl": "B singles out the Serra de Itatiaia sample (Polytrichum juniperinum, 1925), emphasizing it.", "explZh": "B 特別點出在 Serra de Itatiaia 採集的樣本（Polytrichum juniperinum，1925 年），加以強調。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Mori also collected Moss B from River Nami.", "B": "Fern A and Moss B were collected in different years.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Aya Mori collected hundreds of plant samples."}, "optsZh": {"A": "Mori 也在 River Nami 採集了 Moss B。", "B": "Fern A 和 Moss B 是在不同年份採集的。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Aya Mori 採集了數百件植物樣本。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Cerro Azul and Valle Seco are different sites.", "B": "Quartz was collected from Valle Seco.", "C": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "D": "Ortega collected many mineral samples."}, "optsZh": {"A": "Cerro Azul 和 Valle Seco 是不同的地點。", "B": "石英是在 Valle Seco 採集的。", "C": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "D": "Ortega 採集了許多礦物樣本。"}, "answer": "C", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "B": "Fucus alba was collected from Stone Harbor.", "C": "Both samples were collected in 1980.", "D": "Lee cataloged more than one algae species."}, "optsZh": {"A": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "B": "Fucus alba 是在 Stone Harbor 採集的。", "C": "兩份樣本都是在 1980 年採集的。", "D": "Lee 編目記錄了不只一種藻類。"}, "answer": "A", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "Species M came from Lake Plain.", "B": "Singh collected beetles in multiple locations.", "C": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "D": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975."}, "optsZh": {"A": "Species M 來自 Lake Plain。", "B": "Singh 在多個地點採集了甲蟲。", "C": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "D": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。"}, "answer": "D", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: emphasize sample collected from Serra de Itatiaia.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Ramos collected approximately 700 specimens.", "B": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "C": "Cloud Peak and Green Valley were both collection sites.", "D": "Ramos collected Fern Y the following year."}, "optsZh": {"A": "Ramos 採集了大約 700 件標本。", "B": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "C": "Cloud Peak 和 Green Valley 都是採集地點。", "D": "Ramos 在隔年採集了 Fern Y。"}, "answer": "B", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The US government <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensitive\" target=\"_blank\" rel=\"noopener\" data-w=\"sensitive\" data-pos=\"adj.\" data-en=\"delicate; easily affected\" data-zh=\"敏感的；細緻的\">sensitive<\/a> information according to the degree to which disclosure could affect the nation&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=security\" target=\"_blank\" rel=\"noopener\" data-w=\"security\" data-pos=\"n.\" data-en=\"protection against danger or attack\" data-zh=\"安全；保全\">security<\/a>.<br>- Information that could cause &quot;damage&quot; to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> security is classified as Confidential.<br>- Information that could cause &quot;serious damage&quot; to national security is classified as Secret.<br>- Most routine diplomatic correspondence, if disclosed, could cause damage but not serious damage to national security.<br>- Diplomatic correspondence includes communication with both allies and adversaries.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The US government classifies sensitive information according to the degree to which disclosure could affect the nation's security.\n- Information that could cause \"damage\" to national security is classified as Confidential.\n- Information that could cause \"serious damage\" to national security is classified as Secret.\n- Most routine diplomatic correspondence, if disclosed, could cause damage but not serious damage to national security.\n- Diplomatic correspondence includes communication with both allies and adversaries.", "stem": "The student wants to indicate which category most routine diplomatic correspondence belongs in, based on how sensitive information is classified. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要根據敏感資訊的分類方式，指出大多數例行外交通信屬於哪一類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時，做了以下筆記：\n- 美國政府依據資訊洩漏可能影響國家安全的程度，對敏感資訊進行分級。\n- 可能對國家安全造成「損害」的資訊被列為「機密」（Confidential）。\n- 可能對國家安全造成「嚴重損害」的資訊被列為「極機密」（Secret）。\n- 大多數例行的外交通信若遭洩漏，可能會對國家安全造成損害，但不會造成嚴重損害。\n- 外交通信包括與盟友及敵對國家雙方的往來。", "opts": {"A": "According to the US government, which classifies such sensitive information as routine diplomatic correspondence, Confidential information could damage national security if disclosed.", "B": "Most routine diplomatic correspondence is classified according to the degree to which disclosure could affect the nation's security.", "C": "Having the potential to damage national security if disclosed, most routine diplomatic correspondence is classified as Confidential.", "D": "If disclosed, communication with both allies and adversaries could affect the nation's security."}, "optsZh": {"A": "根據將例行外交通信等敏感資訊加以分類的美國政府，「機密」級資訊若遭揭露，可能損害國家安全。", "B": "大多數例行外交通信是依據其揭露對國家安全可能造成影響的程度來分類的。", "C": "由於一旦遭揭露可能損害國家安全，大多數例行外交通信被列為「機密」級。", "D": "一旦外洩，與盟國及敵對國的往來通訊都可能影響國家安全。"}, "answer": "C", "expl": "Routine diplomatic correspondence could cause damage but not serious damage, which matches the Confidential category.", "explZh": "一般例行外交通信若外洩可能造成「損害」但非「嚴重損害」，符合「機密（Confidential）」等級。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成此目的？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：某個檔案室依風險為文件分級；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「封存」（Sealed）；例行的預算草案可能造成輕微但非重大的傷害；目標是為這些草案分級。", "opts": {"A": "Budget drafts are one kind of government document.", "B": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "C": "The records office classifies documents by release risk.", "D": "Sealed documents could cause major harm if released."}, "optsZh": {"A": "預算草案是政府文件的一種。", "B": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。", "C": "檔案室依公開風險為文件分類。", "D": "「密封級」文件一旦公開可能造成重大損害。"}, "answer": "B", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: classify routine diplomatic correspondence.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveal
