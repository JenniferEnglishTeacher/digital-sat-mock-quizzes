 data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> more words a day later.", "bodyPlain": "Psychologist Lena Hart studied whether music helps people remember words. Participants memorized a list of 30 words while listening either to calm piano music or to no music at all. Those who heard the music recalled about 20 percent more words a day later.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "心理學家 Lena Hart 研究音樂是否能幫助人記住單字。受試者在聆聽平靜的鋼琴音樂或完全沒有音樂的情況下，記憶一份 30 個單字的清單。聽音樂的人在一天後多記得大約 20% 的單字。", "opts": {"A": "To explain why music improves memory", "B": "To present a criticism of Hart's conclusion", "C": "To describe the result of the experiment", "D": "To describe how the experiment was set up"}, "optsZh": {"A": "解釋為什麼音樂能增強記憶", "B": "提出對 Hart 結論的批評", "C": "描述實驗的結果", "D": "描述實驗是如何設置的"}, "answer": "D", "expl": "The underlined sentence explains what participants were asked to do, i.e., how the study was set up.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "Ecologist Ravi Menon <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wondered\" target=\"_blank\" rel=\"noopener\">wondered<\/a> whether city lights affect when birds sing. He <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recorded\" target=\"_blank\" rel=\"noopener\">recorded<\/a> robins in both dark parks and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=brightly\" target=\"_blank\" rel=\"noopener\">brightly<\/a> lit streets for a full spring. <u>Robins near streetlights began singing nearly two hours earlier each morning than robins in dark parks.<\/u> Menon suggests artificial light may confuse the birds&#x27; internal clocks.", "bodyPlain": "Ecologist Ravi Menon wondered whether city lights affect when birds sing. He recorded robins in both dark parks and brightly lit streets for a full spring. Robins near streetlights began singing nearly two hours earlier each morning than robins in dark parks. Menon suggests artificial light may confuse the birds' internal clocks.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "生態學家 Ravi Menon 想知道城市燈光是否會影響鳥類鳴唱的時間。他在整個春季錄下黑暗公園和明亮街道上的知更鳥。路燈附近的知更鳥每天早上開始鳴唱的時間，比黑暗公園裡的知更鳥早了將近兩小時。Menon 認為人工照明可能會擾亂鳥類的生理時鐘。", "opts": {"A": "To describe the methods Menon used to record birdsong", "B": "To introduce a question that Menon later abandons", "C": "To present the main finding of Menon's study", "D": "To explain why robins prefer dark parks"}, "optsZh": {"A": "描述 Menon 錄製鳥鳴所用的方法", "B": "提出一個 Menon 後來放棄的問題", "C": "呈現 Menon 研究的主要發現", "D": "解釋為什麼知更鳥偏好黑暗的公園"}, "answer": "C", "expl": "The underlined sentence reports what the researchers found.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "In a study of 400 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=teenagers\" target=\"_blank\" rel=\"noopener\">teenagers<\/a>, researchers found that those who ate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=breakfast\" target=\"_blank\" rel=\"noopener\">breakfast<\/a> scored higher on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=morning\" target=\"_blank\" rel=\"noopener\">morning<\/a> math quizzes. <u>The researchers suggest that a steady supply of energy may help the brain focus during early classes.<\/u> They plan to test this idea with a larger group next year.", "bodyPlain": "In a study of 400 teenagers, researchers found that those who ate breakfast scored higher on morning math quizzes. The researchers suggest that a steady supply of energy may help the brain focus during early classes. They plan to test this idea with a larger group next year.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "在一項針對 400 名青少年的研究中，研究人員發現吃早餐的人在早上的數學小考中得分較高。研究人員認為，穩定的能量供應可能有助於大腦在早上的課堂中集中注意力。他們計畫明年以更大的群體來驗證這個想法。", "opts": {"A": "To offer a possible explanation for the study's results", "B": "To describe how the teenagers were chosen for the study", "C": "To point out a flaw in the study's design", "D": "To give an example of a typical breakfast eaten by participants"}, "optsZh": {"A": "為研究結果提出可能的解釋", "B": "描述如何挑選參與研究的青少年", "C": "指出研究設計中的缺陷", "D": "舉出參與者典型早餐的例子"}, "answer": "A", "expl": "The underlined sentence offers a possible meaning of the results.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "Botanist Mei Lin tested whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=talking\" target=\"_blank\" rel=\"noopener\">talking<\/a> to plants <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affects\" target=\"_blank\" rel=\"noopener\">affects<\/a> their growth. <u>She divided 60 tomato plants into two groups, playing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> of human voices to one group for an hour each day and keeping the other group in silence.<\/u> After eight weeks, the two groups were almost the same height.", "bodyPlain": "Botanist Mei Lin tested whether talking to plants affects their growth. She divided 60 tomato plants into two groups, playing recordings of human voices to one group for an hour each day and keeping the other group in silence. After eight weeks, the two groups were almost the same height.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "植物學家 Mei Lin 測試對植物說話是否會影響其生長。她把 60 株番茄分成兩組，每天對其中一組播放一小時人聲錄音，另一組則保持安靜。八週後，兩組植株的高度幾乎相同。", "opts": {"A": "To explain why the plants grew to the same height", "B": "To suggest that Lin's experiment should be repeated", "C": "To present a surprising finding about tomato plants", "D": "To describe the procedure Lin followed in her experiment"}, "optsZh": {"A": "解釋為什麼植株長到相同的高度", "B": "建議 Lin 的實驗應該重做", "C": "呈現一項關於番茄植株的驚人發現", "D": "描述 Lin 在實驗中遵循的程序"}, "answer": "D", "expl": "It explains what each group of plants received—the design of the experiment.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=animals\" target=\"_blank\" rel=\"noopener\">animals<\/a> use tools in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surprisingly\" target=\"_blank\" rel=\"noopener\">surprisingly<\/a> clever ways. <u>Sea otters, for example, float on their backs and crack open clams by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=smashing\" target=\"_blank\" rel=\"noopener\">smashing<\/a> them against rocks balanced on their chests.<\/u> Such behavior shows that tool use is not limited to primates.", "bodyPlain": "Some animals use tools in surprisingly clever ways. Sea otters, for example, float on their backs and crack open clams by smashing them against rocks balanced on their chests. Such behavior shows that tool use is not limited to primates.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "有些動物使用工具的方式聰明得令人驚訝。例如，海獺會仰躺漂浮，把石頭放在胸前，再把蛤蜊往石頭上敲開。這樣的行為顯示，使用工具並不限於靈長類。", "opts": {"A": "To introduce a claim that the rest of the text disputes", "B": "To provide a specific example supporting the text's opening claim", "C": "To explain how scientists first discovered tool use in animals", "D": "To describe the design of a study on sea otters"}, "optsZh": {"A": "提出一個本文其餘部分會反駁的主張", "B": "提供一個支持本文開頭主張的具體例子", "C": "解釋科學家最初如何發現動物使用工具", "D": "描述一項關於海獺的研究設計"}, "answer": "B", "expl": "The underlined sentence gives a specific example supporting the general claim in the first sentence.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Rock Pigeons Observed and Restaurants Within One Kilometer (approximate values read from the lines of best fit; table recreated because the original graph is unavailable)<br>Restaurants within 1 km | Rock pigeons observed (spring) | Rock pigeons observed (winter)<br>10 | about 4 | about 3<br>30 | about 12 | about 6<br>Urbanization invariably results in a decrease in overall species diversity and abundance, though certain species seem to preternaturally thrive in city <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a>. Columba livia, the rock pigeon, is thought to be well-suited to survival in urbanized environments because of the anthropogenic food sources supplied in the form of refuse from restaurants. Thus, researchers Jeffrey A. Brown, Susannah B. Lerman, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the number of nearby restaurants might be a predictor of the abundance of rock pigeons in the area. They visited 57 sites during spring and winter for three years and logged the number of restaurants and the number of rock pigeons in the vicinity. Looking at the lines of best fit for the scatterplot of the compiled data, the researchers concluded that there is indeed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between proximity to restaurants and abundance of rock pigeons and that this relationship was especially strong in the spring, noting that _______.", "bodyPlain": "Rock Pigeons Observed and Restaurants Within One Kilometer (approximate values read from the lines of best fit; table recreated because the original graph is unavailable)\nRestaurants within 1 km | Rock pigeons observed (spring) | Rock pigeons observed (winter)\n10 | about 4 | about 3\n30 | about 12 | about 6\nUrbanization invariably results in a decrease in overall species diversity and abundance, though certain species seem to preternaturally thrive in city environments. Columba livia, the rock pigeon, is thought to be well-suited to survival in urbanized environments because of the anthropogenic food sources supplied in the form of refuse from restaurants. Thus, researchers Jeffrey A. Brown, Susannah B. Lerman, and colleagues hypothesized that the number of nearby restaurants might be a predictor of the abundance of rock pigeons in the area. They visited 57 sites during spring and winter for three years and logged the number of restaurants and the number of rock pigeons in the vicinity. Looking at the lines of best fit for the scatterplot of the compiled data, the researchers concluded that there is indeed a relationship between proximity to restaurants and abundance of rock pigeons and that this relationship was especially strong in the spring, noting that _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "觀察到的岩鴿數量與一公里內的餐廳數量（數值為從最佳擬合線讀出的近似值；因原圖無法取得而重建為表格）\n一公里內的餐廳數 | 觀察到的岩鴿數（春季）| 觀察到的岩鴿數（冬季）\n10 | 約 4 | 約 3\n30 | 約 12 | 約 6\n都市化必然導致整體物種多樣性與數量減少，雖然某些物種似乎在城市環境中異常地興盛。岩鴿（Columba livia）被認為非常適合在都市環境中生存，因為餐廳的廚餘提供了人為的食物來源。因此，研究人員 Jeffrey A.Brown、Susannah B. Lerman 與同事提出假設：附近餐廳的數量可能可以預測該地區岩鴿的數量。他們連續三年在春季與冬季造訪 57 個地點，記錄附近的餐廳數量與岩鴿數量。研究人員觀察彙整資料之散佈圖的最佳擬合線後，得出結論：與餐廳的距離和岩鴿數量之間確實有關聯，而且這種關聯在春季特別強，並指出 _______。", "opts": {"A": "around ten rock pigeons were observed at a site with three restaurants within one kilometer, while around thirty rock pigeons were observed at a site with six restaurants within one kilometer.", "B": "around three rock pigeons were observed at a site with ten restaurants within one kilometer, while around six rock pigeons were observed at a site with thirty restaurants within one kilometer.", "C": "fewer than five rock pigeons were observed at a site with ten restaurants within one kilometer, while more than ten rock pigeons were observed at a site with thirty restaurants within one kilometer.", "D": "fewer than ten rock pigeons were observed at a site with five restaurants within one kilometer, while more than thirty rock pigeons were observed at a site with ten restaurants within one kilometer."}, "optsZh": {"A": "在一公里內有三家餐廳的地點觀察到約十隻岩鴿，而在一公里內有六家餐廳的地點觀察到約三十隻岩鴿。", "B": "在一公里內有十家餐廳的地點觀察到約三隻岩鴿，而在一公里內有三十家餐廳的地點觀察到約六隻岩鴿。", "C": "在一公里內有十家餐廳的地點觀察到不到五隻岩鴿，而在一公里內有三十家餐廳的地點觀察到超過十隻岩鴿。", "D": "在一公里內有五家餐廳的地點觀察到不到十隻岩鴿，而在一公里內有十家餐廳的地點觀察到超過三十隻岩鴿。"}, "answer": "C", "expl": "In spring (the stronger relationship), the table shows about 4 pigeons at 10 restaurants and about 12 at 30, matching C. B describes the weaker winter values.", "explZh": "春季（關係較強的季節）表格顯示 10 家餐廳約 4 隻、30 家約 12 隻，與 C 相符；B 描述的是關係較弱的冬季數值。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Number of Litter Bins and Pieces of Litter Found in Three Parks<br>Park | Litter bins | Pieces of litter found per week<br>Oak Park | 3 | 410<br>Pine Park | 7 | 220<br>Elm Park | 12 | 95<br>City <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=planners\" target=\"_blank\" rel=\"noopener\">planners<\/a> wanted to know whether adding litter bins <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduces\" target=\"_blank\" rel=\"noopener\">reduces<\/a> littering. They counted bins and litter in three parks and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that parks with more bins tend to have less litter, noting that _______", "bodyPlain": "Number of Litter Bins and Pieces of Litter Found in Three Parks\nPark | Litter bins | Pieces of litter found per week\nOak Park | 3 | 410\nPine Park | 7 | 220\nElm Park | 12 | 95\nCity planners wanted to know whether adding litter bins reduces littering. They counted bins and litter in three parks and concluded that parks with more bins tend to have less litter, noting that _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "三座公園的垃圾桶數量與發現的垃圾數量\n公園 | 垃圾桶數 | 每週發現的垃圾數\nOak 公園 | 3 | 410\nPine 公園 | 7 | 220\nElm 公園 | 12 | 95\n城市規劃人員想知道增設垃圾桶是否能減少亂丟垃圾。他們統計了三座公園的垃圾桶與垃圾數量，得出結論：垃圾桶較多的公園垃圾往往較少，並指出 _______", "opts": {"A": "Oak Park had 410 bins and only 3 pieces of litter per week.", "B": "Elm Park, with 12 bins, had 95 pieces of litter per week, while Oak Park, with 3 bins, had 410.", "C": "Pine Park had more bins and more litter than Elm Park.", "D": "all three parks had about the same amount of litter each week."}, "optsZh": {"A": "Oak 公園有 410 個垃圾桶，每週只有 3 件垃圾。", "B": "有 12 個垃圾桶的 Elm 公園每週有 95 件垃圾，而只有 3 個垃圾桶的 Oak 公園有 410 件。", "C": "Pine 公園的垃圾桶和垃圾都比 Elm 公園多。", "D": "三座公園每週的垃圾量大致相同。"}, "answer": "B", "expl": "The table shows more litter bins went with less litter, and Elm Park (12 bins) had far less litter than Oak Park (3 bins).", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Average Daily <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">Temperature<\/a> and Ice Cream Sales at a Beach Stand<br>Month | Average temperature (°C) | Cones sold per day<br>April | 18 | 60<br>June | 26 | 180<br>August | 31 | 290<br>The owner of a beach ice cream stand <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that warmer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weather\" target=\"_blank\" rel=\"noopener\">weather<\/a> leads to higher sales, noting that _______", "bodyPlain": "Average Daily Temperature and Ice Cream Sales at a Beach Stand\nMonth | Average temperature (°C) | Cones sold per day\nApril | 18 | 60\nJune | 26 | 180\nAugust | 31 | 290\nThe owner of a beach ice cream stand concluded that warmer weather leads to higher sales, noting that _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "海灘攤位的平均日溫與冰淇淋銷量\n月份 | 平均氣溫（°C）| 每日售出甜筒數\n4 月 | 18 | 60\n6 月 | 26 | 180\n8 月 | 31 | 290\n海灘冰淇淋攤的老闆得出結論：天氣越溫暖銷量越高，並指出 _______", "opts": {"A": "sales rose from 60 cones per day in April, when it averaged 18°C, to 290 cones per day in August, when it averaged 31°C.", "B": "the stand sold 180 cones per day in April and 60 in June.", "C": "the coolest month, August, had the highest sales.", "D": "temperature stayed about the same from April to August."}, "optsZh": {"A": "銷量從平均 18°C 的四月每天 60 支甜筒，增加到平均 31°C 的八月每天 290 支。", "B": "這個攤位四月每天賣出 180 支甜筒，六月賣出 60 支。", "C": "最涼爽的月份八月銷量最高。", "D": "從四月到八月氣溫大致不變。"}, "answer": "A", "expl": "The data show sales rising as temperature rises, matching choice A.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Hours of Sleep and Average Test Score for Three Groups of Students<br>Group | Average hours of sleep | Average test score<br>Group 1 | 5 | 68<br>Group 2 | 7 | 79<br>Group 3 | 9 | 86<br>A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that students who sleep more tend to earn higher test scores, noting that _______", "bodyPlain": "Hours of Sleep and Average Test Score for Three Groups of Students\nGroup | Average hours of sleep | Average test score\nGroup 1 | 5 | 68\nGroup 2 | 7 | 79\nGroup 3 | 9 | 86\nA researcher concluded that students who sleep more tend to earn higher test scores, noting that _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "三組學生的睡眠時數與平均測驗分數\n組別 | 平均睡眠時數 | 平均測驗分數\n第 1 組 | 5 | 68\n第 2 組 | 7 | 79\n第 3 組 | 9 | 86\n一位研究人員得出結論：睡得越多的學生往往測驗分數越高，並指出 _______", "opts": {"A": "Group 1 slept the most and scored the highest.", "B": "all three groups scored about 79.", "C": "Group 3, which averaged 9 hours of sleep, scored 86, while Group 1, which averaged 5 hours, scored 68.", "D": "Group 2 slept 9 hours and scored 68."}, "optsZh": {"A": "第 1 組睡得最多，分數也最高。", "B": "三組的分數都大約是 79 分。", "C": "平均睡 9 小時的第 3 組得分 86，而平均睡 5 小時的第 1 組得分 68。", "D": "第 2 組睡了 9 小時，得分 68。"}, "answer": "C", "expl": "Only C correctly reports that students who slept more scored higher.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Bee Visits per Hour in Two Types of Fields<br>Field type | Spring | Summer<br>Wildflower field | 140 | 210<br>Lawn | 15 | 20<br>Ecologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that bees <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strongly\" target=\"_blank\" rel=\"noopener\">strongly<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prefer\" target=\"_blank\" rel=\"noopener\" data-w=\"prefer\" data-pos=\"v.\" data-en=\"to like one thing more than another\" data-zh=\"偏好；比較喜歡\">prefer<\/a> wildflower fields, especially in summer, noting that _______", "bodyPlain": "Bee Visits per Hour in Two Types of Fields\nField type | Spring | Summer\nWildflower field | 140 | 210\nLawn | 15 | 20\nEcologists concluded that bees strongly prefer wildflower fields, especially in summer, noting that _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "兩種田地每小時的蜜蜂造訪次數\n田地類型 | 春季 | 夏季\n野花田 | 140 | 210\n草坪 | 15 | 20\n生態學家得出結論：蜜蜂非常偏好野花田，尤其在夏季，並指出 _______", "opts": {"A": "lawns received more visits than wildflower fields in summer.", "B": "wildflower fields received 15 visits per hour in spring.", "C": "bee visits to lawns doubled from spring to summer.", "D": "wildflower fields received 210 visits per hour in summer, compared with only 20 for lawns."}, "optsZh": {"A": "夏季時草坪受到的造訪比野花田多。", "B": "野花田春季每小時有 15 次造訪。", "C": "蜜蜂造訪草坪的次數從春季到夏季增加了一倍。", "D": "野花田夏季每小時有 210 次造訪，而草坪只有 20 次。"}, "answer": "D", "expl": "D shows bees visiting far more often in the wildflower field, supporting the conclusion.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Command of Evidence (Quantitative): use data from a graph to complete a claim about a relationship.", "vocab": false, "body": "Tree Cover and Afternoon Street <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">Temperature<\/a> on Four <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=streets\" target=\"_blank\" rel=\"noopener\">Streets<\/a><br>Street | Tree cover (%) | Afternoon temperature (°C)<br>Street A | 5 | 38<br>Street B | 20 | 35<br>Street C | 40 | 32<br>Street D | 60 | 29<br>Urban scientists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that streets with more tree cover tend to be cooler, noting that _______", "bodyPlain": "Tree Cover and Afternoon Street Temperature on Four Streets\nStreet | Tree cover (%) | Afternoon temperature (°C)\nStreet A | 5 | 38\nStreet B | 20 | 35\nStreet C | 40 | 32\nStreet D | 60 | 29\nUrban scientists concluded that streets with more tree cover tend to be cooler, noting that _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "四條街道的樹木覆蓋率與下午街道溫度\n街道 | 樹木覆蓋率（%）| 下午溫度（°C）\nA 街 | 5 | 38\nB 街 | 20 | 35\nC 街 | 40 | 32\nD 街 | 60 | 29\n都市科學家得出結論：樹木覆蓋率越高的街道往往越涼爽，並指出 _______", "opts": {"A": "Street A had 38% tree cover and a temperature of 5°C.", "B": "Street D, with 60% tree cover, was 29°C, while Street A, with 5% tree cover, was 38°C.", "C": "Street B was the warmest street.", "D": "temperatures were the same on every street."}, "optsZh": {"A": "A 街的樹木覆蓋率為 38%，溫度為 5°C。", "B": "樹木覆蓋率 60% 的 D 街為 29°C，而樹木覆蓋率 5% 的 A 街為 38°C。", "C": "B 街是最熱的街道。", "D": "每條街的溫度都相同。"}, "answer": "B", "expl": "B correctly reads the table: more trees, lower street temperature.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Chandra Wickramasinghe, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=director\" target=\"_blank\" rel=\"noopener\" data-w=\"director\" data-pos=\"n.\" data-en=\"the person who controls how a film or play is made\" data-zh=\"導演；主任\">director<\/a> of the University of Buckingham’s Centre for Astrobiology, is an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=influential\" target=\"_blank\" rel=\"noopener\" data-w=\"influential\" data-pos=\"adj.\" data-en=\"having a strong effect on people or events\" data-zh=\"有影響力的\">influential<\/a> proponent of the controversial theory of panspermia, which suggests that life on Earth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=originate\" target=\"_blank\" rel=\"noopener\" data-w=\"originate\" data-pos=\"v.\" data-en=\"to come from a particular place\" data-zh=\"起源；發源\">originated<\/a> from microorganisms that were carried to our planet by comets or other celestial bodies. Wickramasinghe has argued for panspermia using several sources of scientific data including the detection of living microorganisms at extremely high <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=altitude\" target=\"_blank\" rel=\"noopener\" data-w=\"altitude\" data-pos=\"n.\" data-en=\"height above sea level\" data-zh=\"海拔；高度\">altitudes<\/a> in Earth’s atmosphere and the confirmation of complex organic molecules in interstellar dust and comets.", "bodyPlain": "Chandra Wickramasinghe, director of the University of Buckingham’s Centre for Astrobiology, is an influential proponent of the controversial theory of panspermia, which suggests that life on Earth originated from microorganisms that were carried to our planet by comets or other celestial bodies. Wickramasinghe has argued for panspermia using several sources of scientific data including the detection of living microorganisms at extremely high altitudes in Earth’s atmosphere and the confirmation of complex organic molecules in interstellar dust and comets.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "白金漢大學天體生物學中心主任 Chandra Wickramasinghe 是備受爭議的泛種論的重要支持者；泛種論認為地球上的生命起源於被彗星或其他天體帶到地球的微生物。Wickramasinghe 以多項科學資料來支持泛種論，包括在地球大氣極高處偵測到活的微生物，以及在星際塵埃與彗星中確認存在複雜的有機分子。", "opts": {"A": "Wickramasinghe’s theory of panspermia is far too controversial to be accepted by other astrobiologists.", "B": "Wickramasinghe has presented evidence that life on Earth may in fact come from somewhere beyond Earth.", "C": "The preponderance of available scientific data strongly supports Wickramasinghe’s theory of panspermia.", "D": "If microorganisms can survive at extremely high altitudes in Earth’s atmosphere, then they can also survive space travel."}, "optsZh": {"A": "Wickramasinghe 的泛種論爭議太大，不會被其他天體生物學家接受。", "B": "Wickramasinghe 提出了地球上的生命其實可能來自地球以外某處的證據。", "C": "現有的大量科學資料強烈支持 Wickramasinghe 的泛種論。", "D": "如果微生物能在地球大氣極高處存活，那麼它們也能在太空旅行中存活。"}, "answer": "B", "expl": "The text describes the evidence Wickramasinghe uses to argue that life on Earth may have come from space; it does not say the theory is proven or rejected.", "explZh": "本文描述 Wickramasinghe 用來主張地球生命可能來自太空的證據，並未說理論已被證實或被否定。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Historian Birgitta Wallace has long argued that Norse <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explorer\" target=\"_blank\" rel=\"noopener\" data-w=\"explorer\" data-pos=\"n.\" data-en=\"a person who travels to unknown places to learn about them\" data-zh=\"探險家\">explorers<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reached\" target=\"_blank\" rel=\"noopener\">reached<\/a> North America about 500 years before Columbus. She points to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remains\" target=\"_blank\" rel=\"noopener\">remains<\/a> of Viking-style buildings at L&#x27;Anse aux Meadows in Canada and to iron nails and a bronze pin found at the site that match Norse designs.", "bodyPlain": "Historian Birgitta Wallace has long argued that Norse explorers reached North America about 500 years before Columbus. She points to the remains of Viking-style buildings at L'Anse aux Meadows in Canada and to iron nails and a bronze pin found at the site that match Norse designs.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "歷史學家 Birgitta Wallace 長期主張，北歐探險家比哥倫布早約 500 年抵達北美洲。她指出加拿大 L'Anse aux Meadows 的維京式建築遺跡，以及在該遺址發現、與北歐設計相符的鐵釘和青銅別針。", "opts": {"A": "Wallace's theory is too unusual to be accepted by other historians.", "B": "Wallace has presented evidence that Norse explorers reached North America before Columbus.", "C": "Columbus was the first European to build structures in North America.", "D": "Iron nails were invented in Canada by the Norse."}, "optsZh": {"A": "Wallace 的理論太不尋常，不會被其他歷史學家接受。", "B": "Wallace 提出了北歐探險家比哥倫布更早抵達北美洲的證據。", "C": "哥倫布是第一位在北美洲建造建築的歐洲人。", "D": "鐵釘是北歐人在加拿大發明的。"}, "answer": "B", "expl": "The text says the historian has presented evidence that the Vikings reached North America first.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Researcher Kun Guo has proposed that dogs can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> human emotions. In his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiments<\/a>, dogs looked longer at faces whose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expression\" target=\"_blank\" rel=\"noopener\" data-w=\"expression\" data-pos=\"n.\" data-en=\"the showing of feelings or ideas\" data-zh=\"表達\">expressions<\/a> matched the tone of a voice they heard—happy faces with happy voices, angry faces with angry voices—suggesting that they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=connect\" target=\"_blank\" rel=\"noopener\" data-w=\"connect\" data-pos=\"v.\" data-en=\"to join or link two things together\" data-zh=\"連接\">connect<\/a> what they see with what they hear.", "bodyPlain": "Researcher Kun Guo has proposed that dogs can recognize human emotions. In his experiments, dogs looked longer at faces whose expressions matched the tone of a voice they heard—happy faces with happy voices, angry faces with angry voices—suggesting that they connect what they see with what they hear.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "研究人員 Kun Guo 提出狗能辨識人類情緒的看法。在他的實驗中，狗會更久地注視表情與所聽到聲音語氣相符的臉——快樂的臉配快樂的聲音、生氣的臉配生氣的聲音——顯示牠們會把看到的和聽到的連結起來。", "opts": {"A": "Dogs prefer happy faces to angry faces.", "B": "Guo has proven that dogs feel the same emotions as humans.", "C": "Guo has found evidence that dogs may be able to recognize human emotions.", "D": "Dogs cannot tell the difference between human voices."}, "optsZh": {"A": "狗喜歡快樂的臉勝過生氣的臉。", "B": "Guo 證明了狗和人類有相同的情緒。", "C": "Guo 發現了狗可能能夠辨識人類情緒的證據。", "D": "狗無法分辨人類的聲音。"}, "answer": "C", "expl": "The text presents the researcher's evidence that dogs read human faces.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Biologist Sylvia Medeiros argues that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=octopuses\" target=\"_blank\" rel=\"noopener\">octopuses<\/a> may <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> something like dreaming. She recorded octopuses during sleep and found brief &quot;<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=active\" target=\"_blank\" rel=\"noopener\" data-w=\"active\" data-pos=\"adj.\" data-en=\"(of a volcano) able to erupt; still doing things\" data-zh=\"活躍的；活的（火山）\">active<\/a>&quot; periods in which their skin flashed through colors and patterns similar to those they show while awake and hunting.", "bodyPlain": "Biologist Sylvia Medeiros argues that octopuses may experience something like dreaming. She recorded octopuses during sleep and found brief \"active\" periods in which their skin flashed through colors and patterns similar to those they show while awake and hunting.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "生物學家 Sylvia Medeiros 主張章魚可能會經歷類似做夢的狀態。她記錄章魚睡眠時的情況，發現短暫的「活躍」期，期間牠們的皮膚閃現各種顏色與圖案，類似牠們清醒狩獵時所呈現的樣子。", "opts": {"A": "Medeiros has reported observations suggesting that octopuses may dream.", "B": "Octopuses change color only when they are hunting.", "C": "Medeiros believes octopuses never sleep.", "D": "Most scientists already agree that all animals dream."}, "optsZh": {"A": "Medeiros 報告了顯示章魚可能會做夢的觀察結果。", "B": "章魚只在狩獵時改變顏色。", "C": "Medeiros 認為章魚從不睡覺。", "D": "大多數科學家已經同意所有動物都會做夢。"}, "answer": "A", "expl": "The main idea is that the scientist offers evidence that octopuses dream.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Linguist Johanna Nichols holds the controversial view that some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">languages<\/a> are much older than <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> usually assume. She supports this claim by comparing grammar patterns that appear in languages spoken on different continents, patterns she believes could have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survived<\/a> for tens of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of years.", "bodyPlain": "Linguist Johanna Nichols holds the controversial view that some languages are much older than scholars usually assume. She supports this claim by comparing grammar patterns that appear in languages spoken on different continents, patterns she believes could have survived for tens of thousands of years.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "語言學家 Johanna Nichols 抱持一個有爭議的觀點：有些語言比學者通常認為的古老得多。她藉由比較不同大陸上語言所出現的文法模式來支持這個主張，她認為這些模式可能已延續了數萬年。", "opts": {"A": "All languages share exactly the same grammar.", "B": "Nichols's view has been rejected by every linguist.", "C": "Grammar patterns can change completely within a few years.", "D": "Nichols uses grammar comparisons to support her view that some languages are very old."}, "optsZh": {"A": "所有語言都有完全相同的文法。", "B": "Nichols 的觀點已被所有語言學家否定。", "C": "文法模式可能在幾年內完全改變。", "D": "Nichols 用文法比較來支持她認為某些語言非常古老的觀點。"}, "answer": "D", "expl": "The text describes evidence the linguist uses to support a debated claim.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Central Ideas and Details: identify the main idea of a text describing a scientist's evidence for a controversial theory.", "vocab": false, "body": "Planetary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geologist\" target=\"_blank\" rel=\"noopener\" data-w=\"geologist\" data-pos=\"n.\" data-en=\"a scientist who studies rocks and the structure of the earth\" data-zh=\"地質學家\">geologist<\/a> Nathalie Cabrol has argued that Mars was once covered by lakes and rivers. She cites rounded pebbles <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographed<\/a> by rovers—stones that are usually shaped by flowing water—and layers of rock that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resemble\" target=\"_blank\" rel=\"noopener\" data-w=\"resemble\" data-pos=\"v.\" data-en=\"to look like or be similar to\" data-zh=\"相似；像\">resemble<\/a> dried lakebeds on Earth.", "bodyPlain": "Planetary geologist Nathalie Cabrol has argued that Mars was once covered by lakes and rivers. She cites rounded pebbles photographed by rovers—stones that are usually shaped by flowing water—and layers of rock that resemble dried lakebeds on Earth.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "哪一個選項最能描述本文的主旨？", "bodyZh": "行星地質學家 Nathalie Cabrol 主張火星曾經布滿湖泊與河流。她引用探測車拍到的圓滑卵石——這種石頭通常是被流水磨圓的——以及類似地球上乾涸湖床的岩層。", "opts": {"A": "Rovers have found living organisms in Martian lakes.", "B": "Cabrol has presented evidence that liquid water once flowed on Mars.", "C": "Mars is covered by lakes and rivers today.", "D": "Rounded pebbles can form only on Earth."}, "optsZh": {"A": "探測車在火星湖泊中發現了活的生物。", "B": "Cabrol 提出了火星上曾經有液態水流動的證據。", "C": "火星現在布滿了湖泊與河流。", "D": "圓滑的卵石只可能在地球上形成。"}, "answer": "B", "expl": "The geologist has offered evidence that Mars once had large amounts of water.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "C. difficile is a bacterium that causes an inflammation of the colon that can be life-threatening. The metabolic processes by which C. difficile takes advantage of a host’s inflammatory process to increase toxin <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> are not well understood. Previously, higher levels of sorbitol (a sugar alcohol) were found to be released by the immune system during inflammation from toxin production. Thus, a team of researchers decided to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> sorbitol metabolism in C. difficile and its effect on toxin production in mice. In the study, mice with C. difficile that ingested sorbitol were found to have lower levels of toxin production than mice that did not ingest sorbitol. One possible explanation is that metabolizing sorbitol prevents C. difficile from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">producing<\/a> toxins.", "bodyPlain": "C. difficile is a bacterium that causes an inflammation of the colon that can be life-threatening. The metabolic processes by which C. difficile takes advantage of a host’s inflammatory process to increase toxin production are not well understood. Previously, higher levels of sorbitol (a sugar alcohol) were found to be released by the immune system during inflammation from toxin production. Thus, a team of researchers decided to investigate sorbitol metabolism in C. difficile and its effect on toxin production in mice. In the study, mice with C. difficile that ingested sorbitol were found to have lower levels of toxin production than mice that did not ingest sorbitol. One possible explanation is that metabolizing sorbitol prevents C. difficile from producing toxins.", "stem": "Which finding, if true, would most directly strengthen the potential explanation?", "stemZh": "下列哪一項發現若為真，最能直接強化這個可能的解釋？", "bodyZh": "困難梭狀芽孢桿菌（C. difficile）是一種會引起結腸發炎、可能危及生命的細菌。C. difficile 如何利用宿主的發炎過程來增加毒素生成，其代謝機制目前還不太清楚。先前曾發現，在毒素引發發炎時，免疫系統會釋放較高濃度的山梨糖醇（一種糖醇）。因此，一支研究團隊決定研究 C. difficile 的山梨糖醇代謝，以及它對小鼠體內毒素生成的影響。在研究中，感染 C. difficile 並攝取山梨糖醇的小鼠，其毒素生成量低於沒有攝取山梨糖醇的小鼠。一種可能的解釋是：代謝山梨糖醇會阻止 C. difficile 產生毒素。", "opts": {"A": "C. difficile lacks the enzyme that metabolizes sorbitol and thus reduces its production of toxins when sorbitol is ingested.", "B": "C. difficile metabolizes sorbitol at a faster rate than it does other naturally occurring sugar alcohols.", "C": "Low levels of sorbitol reduce inflammation in mice and prevent toxin production.", "D": "Mice naturally produce sorbitol in their intestines and do not contract C. difficile."}, "optsZh": {"A": "C. difficile 缺乏代謝山梨糖醇的酵素，因此在攝取山梨糖醇時會減少毒素生成。", "B": "C. difficile 代謝山梨糖醇的速度比代謝其他天然糖醇更快。", "C": "低濃度的山梨糖醇能減少小鼠發炎並阻止毒素生成。", "D": "小鼠的腸道會自然產生山梨糖醇，且不會感染 C. difficile。"}, "answer": "A", "expl": "The answer key gives A: it is the only choice that directly links C. difficile's ability to metabolize sorbitol with its toxin production. (Teacher note: as worded, A is a weak match; the stronger evidence would be that bacteria unable to metabolize sorbitol do NOT reduce toxin production.)", "explZh": "答案為 A：它是唯一直接把 C. difficile 代謝山梨糖醇的能力與毒素生成連結起來的選項。（教師註：此選項措辭不夠理想；更有力的證據應是「無法代謝山梨糖醇的細菌不會減少毒素生成」。）"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "Loggerhead sea <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=turtles\" target=\"_blank\" rel=\"noopener\">turtles<\/a> return to the beach where they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hatched\" target=\"_blank\" rel=\"noopener\">hatched<\/a> after years at sea. One possible explanation is that the turtles use Earth&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=magnetic\" target=\"_blank\" rel=\"noopener\" data-w=\"magnetic\" data-pos=\"adj.\" data-en=\"relating to a magnet or magnetism\" data-zh=\"磁的\">magnetic<\/a> field to find their way home.", "bodyPlain": "Loggerhead sea turtles return to the beach where they hatched after years at sea. One possible explanation is that the turtles use Earth's magnetic field to find their way home.", "stem": "Which finding, if true, would most directly strengthen the potential explanation?", "stemZh": "下列哪一項發現若為真，最能直接強化這個可能的解釋？", "bodyZh": "赤蠵龜在海上生活多年後，會回到牠們孵化的海灘。一種可能的解釋是：海龜利用地球磁場找到回家的路。", "opts": {"A": "Turtles fitted with small magnets that disrupt their magnetic sense have much more difficulty finding their home beach.", "B": "Loggerhead turtles can live for more than 60 years.", "C": "Many turtles return to beaches with warm sand.", "D": "Turtles swim faster in warm water than in cold water."}, "optsZh": {"A": "裝上會干擾磁感的小磁鐵的海龜，找到家鄉海灘的困難大得多。", "B": "赤蠵龜可以活超過 60 年。", "C": "許多海龜會回到沙子溫暖的海灘。", "D": "海龜在溫水中游得比在冷水中快。"}, "answer": "A", "expl": "If sea turtles that cannot sense magnetic fields get lost, that directly supports the idea that they navigate by magnetism.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "Mimosa plants fold their leaves when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=touched\" target=\"_blank\" rel=\"noopener\">touched<\/a>. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suspect\" target=\"_blank\" rel=\"noopener\" data-w=\"suspect\" data-pos=\"v.\" data-en=\"to believe something is probably true\" data-zh=\"懷疑；猜想\">suspect<\/a> that a gene called MS1 allows the plant to fold its leaves.", "bodyPlain": "Mimosa plants fold their leaves when touched. Researchers suspect that a gene called MS1 allows the plant to fold its leaves.", "stem": "Which finding, if true, would most directly strengthen the researchers' suspicion?", "stemZh": "下列哪一項發現若為真，最能直接強化研究人員的懷疑？", "bodyZh": "含羞草被觸碰時會把葉子合起來。研究人員懷疑一個名為 MS1 的基因讓這種植物能夠合起葉子。", "opts": {"A": "Mimosa plants grow best in bright sunlight.", "B": "Mimosa leaves are smaller than the leaves of most other plants.", "C": "Mimosa plants in which the MS1 gene has been switched off do not fold their leaves when touched.", "D": "Mimosa plants were first described by scientists in the 1700s."}, "optsZh": {"A": "含羞草在明亮的陽光下長得最好。", "B": "含羞草的葉子比大多數其他植物的葉子小。", "C": "MS1 基因被關閉的含羞草，被觸碰時不會合起葉子。", "D": "含羞草在 1700 年代首次被科學家描述。"}, "answer": "C", "expl": "If plants without the gene cannot close their leaves, the gene likely causes the closing.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "Bats can catch <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=insects\" target=\"_blank\" rel=\"noopener\">insects<\/a> in total <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=darkness\" target=\"_blank\" rel=\"noopener\">darkness<\/a>. One possible explanation is that bats locate insects by listening to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=echo\" target=\"_blank\" rel=\"noopener\" data-w=\"echo\" data-pos=\"v.\" data-en=\"to repeat or be similar to something earlier\" data-zh=\"呼應；重複\">echoes<\/a> of their own calls.", "bodyPlain": "Bats can catch insects in total darkness. One possible explanation is that bats locate insects by listening to echoes of their own calls.", "stem": "Which finding, if true, would most directly strengthen the potential explanation?", "stemZh": "下列哪一項發現若為真，最能直接強化這個可能的解釋？", "bodyZh": "蝙蝠能在完全黑暗中捕捉昆蟲。一種可能的解釋是：蝙蝠藉由聆聽自己叫聲的回音來找到昆蟲。", "opts": {"A": "Bats sleep during the day in caves.", "B": "Bats whose ears are temporarily plugged catch far fewer insects in the dark.", "C": "Some bats eat fruit instead of insects.", "D": "Insects are more active on warm nights."}, "optsZh": {"A": "蝙蝠白天在洞穴裡睡覺。", "B": "耳朵被暫時塞住的蝙蝠在黑暗中捕到的昆蟲少得多。", "C": "有些蝙蝠吃水果而不吃昆蟲。", "D": "昆蟲在溫暖的夜晚較活躍。"}, "answer": "B", "expl": "If bats without access to sound cannot catch insects, they likely rely on echolocation to hunt.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "In one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a>, ants fed sugar water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">containing<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=caffeine\" target=\"_blank\" rel=\"noopener\">caffeine<\/a> found their way to food more quickly. Scientists proposed that caffeine improves ants&#x27; ability to learn routes.", "bodyPlain": "In one experiment, ants fed sugar water containing caffeine found their way to food more quickly. Scientists proposed that caffeine improves ants' ability to learn routes.", "stem": "Which finding, if true, would most directly strengthen the scientists' proposal?", "stemZh": "下列哪一項發現若為真，最能直接強化科學家的提議？", "bodyZh": "在一項實驗中，餵食含咖啡因糖水的螞蟻更快找到通往食物的路。科學家提出，咖啡因能提升螞蟻學習路線的能力。", "opts": {"A": "Ants prefer sugar water to plain water.", "B": "Caffeine is found naturally in some flowers.", "C": "Ants fed caffeine sleep less than other ants.", "D": "Ants fed caffeine remember the location of food for longer than ants fed plain sugar water."}, "optsZh": {"A": "螞蟻偏好糖水勝過清水。", "B": "咖啡因天然存在於某些花朵中。", "C": "餵食咖啡因的螞蟻睡得比其他螞蟻少。", "D": "餵食咖啡因的螞蟻記住食物位置的時間比只餵糖水的螞蟻更久。"}, "answer": "D", "expl": "If ants given caffeine learn routes faster, caffeine likely improves their learning.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Command of Evidence (Textual): choose the finding that would most directly strengthen a proposed explanation.", "vocab": false, "body": "Young zebra <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=finches\" target=\"_blank\" rel=\"noopener\">finches<\/a> sing songs that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=closely\" target=\"_blank\" rel=\"noopener\">closely<\/a> match those of adult birds around them. One possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explanation\" target=\"_blank\" rel=\"noopener\">explanation<\/a> is that the young birds learn their songs by imitating adults.", "bodyPlain": "Young zebra finches sing songs that closely match those of adult birds around them. One possible explanation is that the young birds learn their songs by imitating adults.", "stem": "Which finding, if true, would most directly strengthen the potential explanation?", "stemZh": "下列哪一項發現若為真，最能直接強化這個可能的解釋？", "bodyZh": "年輕的斑胸草雀所唱的歌，與周遭成鳥的歌非常相似。一種可能的解釋是：年輕的鳥藉由模仿成鳥來學會牠們的歌。", "opts": {"A": "Zebra finches raised without ever hearing adult birds sing songs that sound very different from normal finch songs.", "B": "Adult zebra finches sing mostly in the morning.", "C": "Zebra finches live in large groups in Australia.", "D": "Female zebra finches do not sing."}, "optsZh": {"A": "從未聽過成鳥鳴唱而長大的斑胸草雀，唱出的歌與一般草雀的歌聽起來非常不同。", "B": "成年斑胸草雀大多在早上鳴唱。", "C": "斑胸草雀在澳洲成大群生活。", "D": "雌性斑胸草雀不鳴唱。"}, "answer": "A", "expl": "If birds raised without hearing adults cannot sing the song, they likely learn it from adults.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Scholars generally agree that amputations were dangerous and deadly prior to 10,000 years ago due to a lack of proper surgical tools and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">techniques<\/a>. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earliest\" target=\"_blank\" rel=\"noopener\" data-w=\"earliest\" data-pos=\"adj.\" data-en=\"happening or existing first, before all others\" data-zh=\"最早的\">earliest<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of a successful limb-removal surgery was a 7,000-year-old <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=skeleton\" target=\"_blank\" rel=\"noopener\" data-w=\"skeleton\" data-pos=\"n.\" data-en=\"the frame of bones in a body\" data-zh=\"骨骼\">skeleton<\/a> found in France that had an amputation above the elbow. Recently, archeologists uncovered a 31,000-year-old skeleton with an amputated leg in Indonesia. Analysis of the early stone age skeleton shows that the amputation occurred when the man was just a child and lacked any evidence of infection. Thus, _______", "bodyPlain": "Scholars generally agree that amputations were dangerous and deadly prior to 10,000 years ago due to a lack of proper surgical tools and techniques. The earliest evidence of a successful limb-removal surgery was a 7,000-year-old skeleton found in France that had an amputation above the elbow. Recently, archeologists uncovered a 31,000-year-old skeleton with an amputated leg in Indonesia. Analysis of the early stone age skeleton shows that the amputation occurred when the man was just a child and lacked any evidence of infection. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "學者普遍同意，由於缺乏適當的手術工具與技術，一萬年前的截肢手術既危險又致命。最早的成功截肢手術證據，是在法國發現的一具七千年前、肘部以上被截肢的骨骸。最近，考古學家在印尼發掘出一具三萬一千年前、腿部被截肢的骨骸。對這具舊石器時代骨骸的分析顯示，截肢發生在這名男子還是孩子的時候，而且沒有任何感染的跡象。因此，_______", "opts": {"A": "early stone age people must have had doctors who performed these successful amputations.", "B": "life as an amputee must have been difficult for early stone age people without access to postoperational care.", "C": "there is insufficient evidence to support that most amputations performed prior to 10,000 years ago were deadly.", "D": "early stone age people prior to 10,000 years ago may have been more advanced than was previously acknowledged."}, "optsZh": {"A": "舊石器時代的人一定有醫師執行這些成功的截肢手術。", "B": "對沒有術後照護的舊石器時代人類來說，截肢後的生活一定很艱難。", "C": "沒有足夠的證據支持一萬年前大多數截肢手術都是致命的。", "D": "一萬年前的舊石器時代人類，可能比過去所認為的更先進。"}, "answer": "D", "expl": "A successful 31,000-year-old amputation with no infection suggests early stone age people were more advanced than scholars believed.", "explZh": "三萬一千年前成功且無感染的截肢手術，顯示舊石器時代的人比學者認為的更先進。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Historians long believed that large stone <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bridges\" target=\"_blank\" rel=\"noopener\">bridges<\/a> could not be built in the region before the Roman era. Recently, however, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> found a 2,800-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=year-old\" target=\"_blank\" rel=\"noopener\">year-old<\/a> stone arch bridge that is still strong enough to support people today. Thus, _______", "bodyPlain": "Historians long believed that large stone bridges could not be built in the region before the Roman era. Recently, however, archaeologists found a 2,800-year-old stone arch bridge that is still strong enough to support people today. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "歷史學家長期認為，在羅馬時代之前，該地區不可能建造大型石橋。然而，考古學家最近發現了一座 2,800 年前的石拱橋，至今仍堅固到足以讓人通行。因此，_______", "opts": {"A": "all bridges in the region must have been built by the Romans.", "B": "the bridge was probably built in the last century.", "C": "stone bridges are less durable than wooden ones.", "D": "people in the region before the Roman era may have had more advanced building skills than historians thought."}, "optsZh": {"A": "該地區所有的橋都一定是羅馬人建造的。", "B": "這座橋可能是上個世紀建造的。", "C": "石橋不如木橋耐用。", "D": "羅馬時代之前該地區的人，可能擁有比歷史學家所認為更先進的建築技術。"}, "answer": "D", "expl": "Evidence of skilled early bridge-building suggests these people were more advanced than believed.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Many researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thought\" target=\"_blank\" rel=\"noopener\">thought<\/a> that people began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=treating\" target=\"_blank\" rel=\"noopener\">treating<\/a> dogs as companions only about 4,000 years ago. But <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> recently found a 9,000-year-old grave in which a dog had been carefully buried beside its owner, along with a carved bone toy. Thus, _______", "bodyPlain": "Many researchers thought that people began treating dogs as companions only about 4,000 years ago. But archaeologists recently found a 9,000-year-old grave in which a dog had been carefully buried beside its owner, along with a carved bone toy. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "許多研究人員認為，人類大約四千年前才開始把狗當作伴侶。但考古學家最近發現了一座九千年前的墳墓，墓中一隻狗被小心地埋葬在主人身旁，還附有一個雕刻的骨製玩具。因此，_______", "opts": {"A": "dogs were not domesticated until 4,000 years ago.", "B": "people may have treated dogs as companions much earlier than many researchers believed.", "C": "carved bone toys were common in all ancient graves.", "D": "the dog must have belonged to a wealthy family."}, "optsZh": {"A": "狗直到四千年前才被馴化。", "B": "人類把狗當作伴侶的時間，可能比許多研究人員認為的早得多。", "C": "雕刻骨製玩具在所有古代墳墓中都很常見。", "D": "這隻狗一定屬於一個富裕的家庭。"}, "answer": "B", "expl": "A 9,000-year-old dog burial shows dogs were companions earlier than thought.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Scientists once <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumed\" target=\"_blank\" rel=\"noopener\">assumed<\/a> that people did not make <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pottery\" target=\"_blank\" rel=\"noopener\">pottery<\/a> until they began farming, about 10,000 years ago. However, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> of cooking pots found in a cave in China have been dated to about 20,000 years ago. Thus, _______", "bodyPlain": "Scientists once assumed that people did not make pottery until they began farming, about 10,000 years ago. However, fragments of cooking pots found in a cave in China have been dated to about 20,000 years ago. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "科學家曾經認為，人類大約在一萬年前開始農耕之後才製作陶器。然而，在中國一個洞穴中發現的烹飪陶罐碎片，經測定約有兩萬年的歷史。因此，_______", "opts": {"A": "farming began 20,000 years ago in China.", "B": "the fragments are probably not really pottery.", "C": "people may have made pottery long before they began farming.", "D": "pottery was invented only in China."}, "optsZh": {"A": "農業在兩萬年前於中國開始。", "B": "這些碎片可能其實不是陶器。", "C": "人類可能早在開始農耕之前很久就會製作陶器。", "D": "陶器只在中國被發明。"}, "answer": "C", "expl": "Healthy, working pottery from 20,000 years ago shows pottery existed before farming.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Botanists once believed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flowering\" target=\"_blank\" rel=\"noopener\">flowering<\/a> plants first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appeared\" target=\"_blank\" rel=\"noopener\">appeared<\/a> about 80 million years ago. Recently, researchers found a perfectly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> flower sealed in amber that is about 100 million years old. Thus, _______", "bodyPlain": "Botanists once believed that flowering plants first appeared about 80 million years ago. Recently, researchers found a perfectly preserved flower sealed in amber that is about 100 million years old. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "植物學家曾經認為，開花植物大約在八千萬年前首次出現。最近，研究人員發現了一朵封存在琥珀中、保存完好、約有一億年歷史的花。因此，_______", "opts": {"A": "flowering plants may have existed earlier than botanists once believed.", "B": "amber can preserve only flowers, not insects.", "C": "flowering plants disappeared 100 million years ago.", "D": "the flower must be a modern species."}, "optsZh": {"A": "開花植物可能比植物學家過去認為的更早出現。", "B": "琥珀只能保存花朵，不能保存昆蟲。", "C": "開花植物在一億年前消失了。", "D": "這朵花一定是現代物種。"}, "answer": "A", "expl": "Flowers sealed in amber 100 million years old suggest flowering plants are older than assumed.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Inferences: draw a logical conclusion from new evidence that challenges a common belief.", "vocab": false, "body": "Scholars <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generally\" target=\"_blank\" rel=\"noopener\">generally<\/a> believed that brain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surgery\" target=\"_blank\" rel=\"noopener\">surgery<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Peru almost always killed the patient. Yet many 2,000-year-old skulls from the region show holes drilled by surgeons with fully healed edges, meaning the patients lived for years afterward. Thus, _______", "bodyPlain": "Scholars generally believed that brain surgery in ancient Peru almost always killed the patient. Yet many 2,000-year-old skulls from the region show holes drilled by surgeons with fully healed edges, meaning the patients lived for years afterward. Thus, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "學者普遍認為，古代秘魯的腦部手術幾乎總是導致病人死亡。然而，該地區許多兩千年前的頭骨上都有外科醫師鑽出的孔，孔緣已完全癒合，表示病人術後又活了好幾年。因此，_______", "opts": {"A": "ancient Peruvians never performed surgery.", "B": "all patients who had surgery died within days.", "C": "the holes were most likely caused by accidents.", "D": "ancient Peruvian surgeons may have been more successful than scholars believed."}, "optsZh": {"A": "古代秘魯人從未進行過手術。", "B": "所有動過手術的病人都在幾天內死亡。", "C": "這些孔最可能是意外造成的。", "D": "古代秘魯的外科醫師可能比學者認為的更成功。"}, "answer": "D", "expl": "Healed skull surgery shows early surgeons were more skilled than thought.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "In game <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theory\" target=\"_blank\" rel=\"noopener\" data-w=\"theory\" data-pos=\"n.\" data-en=\"a set of ideas meant to explain something\" data-zh=\"理論\">theory<\/a>, the prisoner’s dilemma is a thought <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> in which two people who are isolated from each other each have the choice to betray the other. An individual who betrays the other person will <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> a personal benefit; however, if both players choose to betray each other then they will both experience a worse punishment than if neither betrays the other. Game theorists generally agree that the choice to cooperate (that is, refusing to betray the other person) is irrational, as it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=defy\" target=\"_blank\" rel=\"noopener\" data-w=\"defy\" data-pos=\"v.\" data-en=\"to refuse to obey or follow\" data-zh=\"違抗；公然反抗\">defies<\/a> one’s self-interest; therefore, these game theorists suggest that _______", "bodyPlain": "In game theory, the prisoner’s dilemma is a thought experiment in which two people who are isolated from each other each have the choice to betray the other. An individual who betrays the other person will experience a personal benefit; however, if both players choose to betray each other then they will both experience a worse punishment than if neither betrays the other. Game theorists generally agree that the choice to cooperate (that is, refusing to betray the other person) is irrational, as it defies one’s self-interest; therefore, these game theorists suggest that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在賽局理論中，囚徒困境是一個思想實驗：兩個彼此隔離的人，各自都可以選擇背叛對方。背叛對方的人會獲得個人利益；然而，如果雙方都選擇背叛彼此，兩人受到的懲罰都會比雙方都不背叛時更重。賽局理論學者普遍同意，選擇合作（也就是拒絕背叛對方）是不理性的，因為它違背個人的自身利益；因此，這些賽局理論學者認為 _______", "opts": {"A": "it is more rational for one to betray the other participant.", "B": "both individuals should cooperate, as their punishment will be reduced.", "C": "people always act in their own self-interest, as it is the rational choice.", "D": "the thought experiment likely has limited relevance in everyday life."}, "optsZh": {"A": "背叛對方是比較理性的選擇。", "B": "雙方都應該合作，因為他們的懲罰會減輕。", "C": "人總是依自身利益行事，因為這是理性的選擇。", "D": "這個思想實驗在日常生活中的相關性可能有限。"}, "answer": "A", "expl": "If cooperating is irrational because it goes against self-interest, these theorists would say betraying the other person is the more rational choice. (The original key listed C, which overgeneralizes to all people.)", "explZh": "既然合作違背自身利益而不理性，這些理論學者會認為背叛對方較理性。（原答案列為 C，但 C 過度推論到所有人，故修正為 A。）"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "Economists who study <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commuting\" target=\"_blank\" rel=\"noopener\">commuting<\/a> assume that people act <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rationally\" target=\"_blank\" rel=\"noopener\">rationally<\/a> by choosing the cheapest way to travel. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=month\" target=\"_blank\" rel=\"noopener\" data-w=\"month\" data-pos=\"n.\" data-en=\"one of the twelve periods of time into which a year is divided\" data-zh=\"月\">monthly<\/a> bus pass costs $60, while driving costs about $250 a month. Therefore, these economists would predict that _______", "bodyPlain": "Economists who study commuting assume that people act rationally by choosing the cheapest way to travel. A monthly bus pass costs $60, while driving costs about $250 a month. Therefore, these economists would predict that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "研究通勤的經濟學家假設，人們會理性地選擇最便宜的交通方式。公車月票要 60 美元，而開車每月約需 250 美元。因此，這些經濟學家會預測 _______", "opts": {"A": "a rational commuter would choose to take the bus.", "B": "most commuters will choose to drive.", "C": "bus passes will soon cost more than driving.", "D": "commuters never think about cost."}, "optsZh": {"A": "理性的通勤者會選擇搭公車。", "B": "大多數通勤者會選擇開車。", "C": "公車月票很快就會比開車還貴。", "D": "通勤者從不考慮成本。"}, "answer": "A", "expl": "If saving money is the rational choice and the bus is cheaper, economists would say taking the bus is more rational.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ecologist\" target=\"_blank\" rel=\"noopener\" data-w=\"ecologist\" data-pos=\"n.\" data-en=\"a scientist who studies the relationship between living things and their environment\" data-zh=\"生態學家\">Ecologists<\/a> using optimal foraging <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theory\" target=\"_blank\" rel=\"noopener\" data-w=\"theory\" data-pos=\"n.\" data-en=\"a set of ideas meant to explain something\" data-zh=\"理論\">theory<\/a> assume that animals choose feeding sites where they can eat while facing the least danger. Site A has more food but is often visited by hawks; Site B has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> less food and no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a>. Therefore, these ecologists would predict that _______", "bodyPlain": "Ecologists using optimal foraging theory assume that animals choose feeding sites where they can eat while facing the least danger. Site A has more food but is often visited by hawks; Site B has slightly less food and no predators. Therefore, these ecologists would predict that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "運用最佳覓食理論的生態學家假設，動物會選擇在進食時面臨最少危險的覓食地點。A 地點食物較多，但常有老鷹出沒；B 地點食物稍少，但沒有掠食者。因此，這些生態學家會預測 _______", "opts": {"A": "the animals will avoid both sites.", "B": "hawks will stop visiting Site A.", "C": "the animals will feed mainly at Site B.", "D": "the animals will feed only at night."}, "optsZh": {"A": "動物會避開兩個地點。", "B": "老鷹會停止造訪 A 地點。", "C": "動物會主要在 B 地點覓食。", "D": "動物只會在夜間覓食。"}, "answer": "C", "expl": "If animals always pick the safest food source and site A has predators, they should choose site B.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "Marketing researchers assume that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shoppers\" target=\"_blank\" rel=\"noopener\">shoppers<\/a> try to get the most value for their money. A small box of cereal costs $4 for 300 grams, while a large box costs $6 for 600 grams. Therefore, the researchers would expect that _______", "bodyPlain": "Marketing researchers assume that shoppers try to get the most value for their money. A small box of cereal costs $4 for 300 grams, while a large box costs $6 for 600 grams. Therefore, the researchers would expect that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "行銷研究人員假設，購物者會設法讓錢發揮最大價值。一小盒穀片 300 公克賣 4 美元，而一大盒 600 公克賣 6 美元。因此，研究人員會預期 _______", "opts": {"A": "shoppers will buy the small box because it costs less in total.", "B": "value-seeking shoppers will tend to buy the large box.", "C": "shoppers will stop buying cereal.", "D": "the store will raise the price of the small box."}, "optsZh": {"A": "購物者會買小盒的，因為總價較低。", "B": "追求價值的購物者會傾向買大盒的。", "C": "購物者會停止購買穀片。", "D": "商店會調漲小盒的價格。"}, "answer": "B", "expl": "If shoppers maximize value, they will buy the larger box with the lower price per unit.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "Some game <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theorists\" target=\"_blank\" rel=\"noopener\">theorists<\/a> argue that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=players\" target=\"_blank\" rel=\"noopener\">players<\/a> who fear losing will always choose the option with a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=guaranteed\" target=\"_blank\" rel=\"noopener\">guaranteed<\/a> reward over a risky option with a higher possible reward. In a game, a player may take $50 for certain or flip a coin to win $120 or nothing. These theorists would therefore predict that a player who fears losing will _______", "bodyPlain": "Some game theorists argue that players who fear losing will always choose the option with a guaranteed reward over a risky option with a higher possible reward. In a game, a player may take $50 for certain or flip a coin to win $120 or nothing. These theorists would therefore predict that a player who fears losing will _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一些賽局理論學者主張，害怕損失的玩家總是會選擇有保證報酬的選項，而不選可能報酬較高但有風險的選項。在一個遊戲中，玩家可以確定拿走 50 美元，或擲硬幣贏得 120 美元或一無所獲。因此，這些理論學者會預測，害怕損失的玩家會 _______", "opts": {"A": "flip the coin.", "B": "refuse both options.", "C": "ask for $120 for certain.", "D": "take the guaranteed $50."}, "optsZh": {"A": "擲硬幣。", "B": "兩個選項都拒絕。", "C": "要求確定拿到 120 美元。", "D": "拿走確定的 50 美元。"}, "answer": "D", "expl": "If the theory says players choose the safest move, it predicts the player will choose the guaranteed reward.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Inferences: complete a text by following the logic of a stated premise about rational choice.", "vocab": false, "body": "Economists assume that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">companies<\/a> seek the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highest\" target=\"_blank\" rel=\"noopener\">highest<\/a> possible profit. A bakery can sell its bread in Town X for a profit of $2 per loaf or in Town Y for a profit of $5 per loaf, with the same number of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=customers\" target=\"_blank\" rel=\"noopener\">customers<\/a> in each. These economists would therefore expect the bakery to _______", "bodyPlain": "Economists assume that companies seek the highest possible profit. A bakery can sell its bread in Town X for a profit of $2 per loaf or in Town Y for a profit of $5 per loaf, with the same number of c
