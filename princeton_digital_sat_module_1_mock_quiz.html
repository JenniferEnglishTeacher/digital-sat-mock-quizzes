<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Princeton Digital SAT Mock Test - Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Princeton Digital SAT Mock Test - Module 1</h1>
    <p class="subtitle">27 original questions (now interactive) + mock variations = 162 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "The Chilean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcano\" target=\"_blank\" rel=\"noopener\" data-w=\"volcano\" data-pos=\"n.\" data-en=\"a mountain that can erupt with lava\" data-zh=\"火山\">volcano<\/a> Calabozos is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=located\" target=\"_blank\" rel=\"noopener\">located<\/a> in _______ area. Therefore, the risk of loss of human life in the event of an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eruption\" target=\"_blank\" rel=\"noopener\">eruption<\/a> is minimal.", "bodyPlain": "The Chilean volcano Calabozos is located in _______ area. Therefore, the risk of loss of human life in the event of an eruption is minimal.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "智利的 Calabozos 火山位於 _______ 地區。因此，火山爆發時造成人命損失的風險極低。", "opts": {"A": "a hazardous", "B": "an active", "C": "a mountainous", "D": "a remote"}, "optsZh": {"A": "一個危險的", "B": "一個活躍的", "C": "一個多山的", "D": "一個偏遠的"}, "answer": "D", "expl": "Since the risk to human life is minimal, the volcano must be far from people, so it is in a remote area.", "explZh": "既然人命風險極低，火山必定遠離人群，所以位於偏遠（remote）地區。", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "w": "hazardous", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "w": "active", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "w": "mountainous", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "w": "remote", "word": "remote"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "The research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=station\" target=\"_blank\" rel=\"noopener\">station<\/a> sits in _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=valley\" target=\"_blank\" rel=\"noopener\" data-w=\"valley\" data-pos=\"n.\" data-en=\"a low area of land between hills or mountains\" data-zh=\"山谷；河谷\">valley<\/a> more than 200 kilometers from the nearest town. As a result, scientists there must fly in all of their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=supplies\" target=\"_blank\" rel=\"noopener\" data-w=\"supplies\" data-pos=\"n.\" data-en=\"materials or things needed for a particular activity\" data-zh=\"用品；物資\">supplies<\/a>.", "bodyPlain": "The research station sits in _______ valley more than 200 kilometers from the nearest town. As a result, scientists there must fly in all of their supplies.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這座研究站位於 _______ 山谷中，距離最近的城鎮超過 200 公里。因此，那裡的科學家必須用飛機運送所有補給品。", "opts": {"A": "a hazardous", "B": "an active", "C": "a mountainous", "D": "a remote"}, "optsZh": {"A": "一個危險的", "B": "一個活躍的", "C": "一個多山的", "D": "一個偏遠的"}, "answer": "D", "expl": "A volcano far from towns poses little danger to people, so \"remote\" fits.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "w": "hazardous", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "w": "active", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "w": "mountainous", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "w": "remote", "word": "remote"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "Hikers are warned to stay on marked trails because the crater rim is _______ area: loose rocks often fall without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=warning\" target=\"_blank\" rel=\"noopener\">warning<\/a>, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pockets\" target=\"_blank\" rel=\"noopener\">pockets<\/a> of toxic gas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collect\" target=\"_blank\" rel=\"noopener\">collect<\/a> in low spots.", "bodyPlain": "Hikers are warned to stay on marked trails because the crater rim is _______ area: loose rocks often fall without warning, and pockets of toxic gas collect in low spots.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "健行者被警告要待在標示的步道上，因為火山口邊緣是 _______ 地區：鬆動的石頭經常毫無預警地掉落，而有毒氣體會聚集在低窪處。", "opts": {"A": "a hazardous", "B": "an active", "C": "a mountainous", "D": "a remote"}, "optsZh": {"A": "一個危險的", "B": "一個活躍的", "C": "一個多山的", "D": "一個偏遠的"}, "answer": "A", "expl": "Rockfalls and toxic gas make the area dangerous, which is the meaning of \"hazardous.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "w": "hazardous", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "w": "active", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "w": "mountainous", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "w": "remote", "word": "remote"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "Because Mount Etna has erupted three times in the past decade and still releases steam almost daily, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geologist\" target=\"_blank\" rel=\"noopener\" data-w=\"geologist\" data-pos=\"n.\" data-en=\"a scientist who studies rocks and the structure of the earth\" data-zh=\"地質學家\">geologists<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> it as _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcano\" target=\"_blank\" rel=\"noopener\" data-w=\"volcano\" data-pos=\"n.\" data-en=\"a mountain that can erupt with lava\" data-zh=\"火山\">volcano<\/a> that requires constant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=monitor\" target=\"_blank\" rel=\"noopener\" data-w=\"monitor\" data-pos=\"v.\" data-en=\"to watch and check something over time\" data-zh=\"監測\">monitoring<\/a>.", "bodyPlain": "Because Mount Etna has erupted three times in the past decade and still releases steam almost daily, geologists classify it as _______ volcano that requires constant monitoring.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "由於埃特納火山過去十年間噴發了三次，至今幾乎每天仍冒出蒸氣，地質學家將它歸類為需要持續監測的 _______ 火山。", "opts": {"A": "a hazardous", "B": "an active", "C": "a mountainous", "D": "a remote"}, "optsZh": {"A": "一個危險的", "B": "一個活躍的", "C": "一個多山的", "D": "一個偏遠的"}, "answer": "B", "expl": "A volcano that has erupted three times recently and is still releasing steam is \"active.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "w": "hazardous", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "w": "active", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "w": "mountainous", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "w": "remote", "word": "remote"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "Bhutan is _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">country<\/a>: steep peaks cover most of its land, and many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=villages\" target=\"_blank\" rel=\"noopener\">villages<\/a> can be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reached\" target=\"_blank\" rel=\"noopener\">reached<\/a> only by crossing passes higher than 4,000 meters.", "bodyPlain": "Bhutan is _______ country: steep peaks cover most of its land, and many villages can be reached only by crossing passes higher than 4,000 meters.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "不丹是 _______ 國家：陡峭的山峰覆蓋了大部分國土，許多村莊只能翻越海拔超過 4,000 公尺的山口才能抵達。", "opts": {"A": "a hazardous", "B": "an active", "C": "a mountainous", "D": "a remote"}, "optsZh": {"A": "一個危險的", "B": "一個活躍的", "C": "一個多山的", "D": "一個偏遠的"}, "answer": "C", "expl": "Steep peaks and high passes describe land full of mountains, so \"mountainous\" fits.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "w": "hazardous", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "w": "active", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "w": "mountainous", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "w": "remote", "word": "remote"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose an adjective meaning \"far from people\" that explains a low risk to human life.", "vocab": true, "body": "Tristan da Cunha is often called the world&#x27;s most _______ inhabited island; its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=roughly\" target=\"_blank\" rel=\"noopener\" data-w=\"roughly\" data-pos=\"adv.\" data-en=\"approximately; not exactly\" data-zh=\"大約；粗略地\">roughly<\/a> 250 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a> live about 2,400 kilometers from the nearest mainland, and a supply ship <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visits<\/a> only about once a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=month\" target=\"_blank\" rel=\"noopener\" data-w=\"month\" data-pos=\"n.\" data-en=\"one of the twelve periods of time into which a year is divided\" data-zh=\"月\">month<\/a>.", "bodyPlain": "Tristan da Cunha is often called the world's most _______ inhabited island; its roughly 250 residents live about 2,400 kilometers from the nearest mainland, and a supply ship visits only about once a month.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "特里斯坦達庫尼亞島常被稱為世界上最 _______ 的有人居住島嶼；島上約 250 位居民距離最近的大陸約 2,400 公里，補給船大約每個月才來一次。", "opts": {"A": "hazardous", "B": "active", "C": "mountainous", "D": "remote"}, "optsZh": {"A": "危險的", "B": "活躍的；活的", "C": "多山的", "D": "偏遠的"}, "answer": "D", "expl": "An island that a supply ship visits only once a month is far from other places, or \"remote.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "word": "hazardous"}, "B": {"pos": "adj.", "en": "(of a volcano) able to erupt; still doing things", "zh": "活躍的；活的（火山）", "word": "active"}, "C": {"pos": "adj.", "en": "having many mountains", "zh": "多山的", "word": "mountainous"}, "D": {"pos": "adj.", "en": "far away from towns and people", "zh": "偏遠的", "word": "remote"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "The intergenerational Bulgarian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> choir group Bistritsa Babi has been working to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> customary songs and dances from the Shopluk region of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">country<\/a> since 1939. Through these _______ performances, members of Bistritsa Babi hope to keep this centuries-old ritual of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expression\" target=\"_blank\" rel=\"noopener\" data-w=\"expression\" data-pos=\"n.\" data-en=\"the showing of feelings or ideas\" data-zh=\"表達\">expression<\/a> alive. In 2005, the group was added to the UNESCO List of Intangible Cultural Heritage for Eastern Europe.", "bodyPlain": "The intergenerational Bulgarian female choir group Bistritsa Babi has been working to preserve customary songs and dances from the Shopluk region of the country since 1939. Through these _______ performances, members of Bistritsa Babi hope to keep this centuries-old ritual of expression alive. In 2005, the group was added to the UNESCO List of Intangible Cultural Heritage for Eastern Europe.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "跨世代的保加利亞女子合唱團 Bistritsa Babi 自 1939 年以來，一直致力於保存該國 Shopluk 地區的傳統歌曲與舞蹈。透過這些 _______ 表演，Bistritsa Babi 的成員希望讓這項有數百年歷史的表達儀式延續下去。2005 年，這個團體被列入聯合國教科文組織東歐非物質文化遺產名錄。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "A", "expl": "The group preserves customary, centuries-old songs and dances, so its performances are traditional.", "explZh": "這個團體保存的是有數百年歷史的傳統歌舞，所以表演是傳統的（traditional）。", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "The Hawaiian dancers learn hula chants that have been passed down <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=oral\" target=\"_blank\" rel=\"noopener\" data-w=\"oral\" data-pos=\"adj.\" data-en=\"spoken rather than written\" data-zh=\"口述的；口頭的\">orally<\/a> for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a>. By performing these _______ chants, they help keep the islands&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a> alive.", "bodyPlain": "The Hawaiian dancers learn hula chants that have been passed down orally for generations. By performing these _______ chants, they help keep the islands' history alive.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這些夏威夷舞者學習世代口耳相傳的草裙舞吟唱。透過表演這些 _______ 吟唱，他們幫助保存群島的歷史。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "A", "expl": "Songs passed down for generations are based on long-held customs, so \"traditional\" fits.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "For nearly a century, the works of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a> Florence Price were so _______ that even trained musicians rarely knew her name; only after a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> of her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> was found in an abandoned house in 2009 did <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestra\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestra\" data-pos=\"n.\" data-en=\"a large group of musicians who play different instruments together\" data-zh=\"管弦樂團\">orchestras<\/a> begin performing them.", "bodyPlain": "For nearly a century, the works of composer Florence Price were so _______ that even trained musicians rarely knew her name; only after a collection of her manuscripts was found in an abandoned house in 2009 did orchestras begin performing them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "將近一個世紀以來，作曲家 Florence Price 的作品如此 _______，連受過訓練的音樂家都很少知道她的名字；直到 2009 年在一棟廢棄房屋中發現她的一批手稿，樂團才開始演奏她的作品。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "B", "expl": "A composer whose works were almost forgotten and rarely heard was \"obscure\" (little known).", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "Museum guards are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trained\" target=\"_blank\" rel=\"noopener\">trained<\/a> to be _______: they watch <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visitors\" target=\"_blank\" rel=\"noopener\">visitors<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=closely\" target=\"_blank\" rel=\"noopener\">closely<\/a> but move quietly and speak softly so that no one feels watched while viewing the art.", "bodyPlain": "Museum guards are trained to be _______: they watch visitors closely but move quietly and speak softly so that no one feels watched while viewing the art.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "博物館警衛受訓要保持 _______：他們密切注意參觀者，但動作安靜、說話輕聲，讓人欣賞藝術品時不會覺得被監視。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "C", "expl": "Speaking quietly so others do not notice describes \"discreet\" behavior.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "The inventor was known for his _______ habits: he wore a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=velvet\" target=\"_blank\" rel=\"noopener\" data-w=\"velvet\" data-pos=\"n.\" data-en=\"a soft cloth with a thick smooth surface\" data-zh=\"絲絨；天鵝絨\">velvet<\/a> cape to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> every day and carried a stuffed owl that he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claimed<\/a> helped him think.", "bodyPlain": "The inventor was known for his _______ habits: he wore a velvet cape to the laboratory every day and carried a stuffed owl that he claimed helped him think.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這位發明家以 _______ 的習慣聞名：他每天穿著天鵝絨斗篷去實驗室，並隨身攜帶一隻填充貓頭鷹，聲稱牠能幫助他思考。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "D", "expl": "Wearing a cape and carrying a stuffed owl are strange, unusual habits, so \"eccentric\" fits.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: choose an adjective meaning \"based on long-held customs\" for performances that preserve old songs.", "vocab": true, "body": "At the annual <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=festival\" target=\"_blank\" rel=\"noopener\">festival<\/a> in Oaxaca, cooks <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prepare\" target=\"_blank\" rel=\"noopener\">prepare<\/a> mole using _______ methods, grinding chiles and spices by hand on stone slabs just as their ancestors did <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">centuries<\/a> ago.", "bodyPlain": "At the annual festival in Oaxaca, cooks prepare mole using _______ methods, grinding chiles and spices by hand on stone slabs just as their ancestors did centuries ago.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "在瓦哈卡的年度節慶中，廚師們用 _______ 方法製作莫雷醬，就像他們的祖先幾百年前那樣，在石板上用手研磨辣椒和香料。", "opts": {"A": "traditional", "B": "obscure", "C": "discreet", "D": "eccentric"}, "optsZh": {"A": "傳統的", "B": "鮮為人知的", "C": "謹慎低調的", "D": "古怪的"}, "answer": "A", "expl": "Dishes made exactly as they were centuries ago follow long-held customs: \"traditional.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following customs that have existed for a long time", "zh": "傳統的", "word": "traditional"}, "B": {"pos": "adj.", "en": "not well known", "zh": "鮮為人知的；冷門的", "word": "obscure"}, "C": {"pos": "adj.", "en": "careful not to attract attention", "zh": "謹慎低調的", "word": "discreet"}, "D": {"pos": "adj.", "en": "strange or unusual in behavior", "zh": "古怪的", "word": "eccentric"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "Located in the old city of Marrakesh, Jemaa el-Fnaa, the main <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=square\" target=\"_blank\" rel=\"noopener\" data-w=\"square\" data-pos=\"adj.\" data-en=\"used before units to measure area, e.g. square mile\" data-zh=\"平方的\">square<\/a>, is a marketplace and vibrant hub for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a> and visitors alike. During the day, snake charmers and stalls selling beverages fill the square, while at night the _______ center is filled with throngs of people coming to hear storytellers tell <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditional\" target=\"_blank\" rel=\"noopener\" data-w=\"traditional\" data-pos=\"adj.\" data-en=\"following customs that have existed for a long time\" data-zh=\"傳統的\">traditional<\/a> fables, watch the performances of magicians, and browse multiple booths offering herbal medicines. As the night goes on, dozens of food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vendor\" target=\"_blank\" rel=\"noopener\" data-w=\"vendor\" data-pos=\"n.\" data-en=\"a person who sells things, often on the street\" data-zh=\"小販；攤販\">vendors<\/a> set up their stalls to feed the crowds.", "bodyPlain": "Located in the old city of Marrakesh, Jemaa el-Fnaa, the main square, is a marketplace and vibrant hub for residents and visitors alike. During the day, snake charmers and stalls selling beverages fill the square, while at night the _______ center is filled with throngs of people coming to hear storytellers tell traditional fables, watch the performances of magicians, and browse multiple booths offering herbal medicines. As the night goes on, dozens of food vendors set up their stalls to feed the crowds.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "德吉瑪廣場（Jemaa el-Fnaa）位於馬拉喀什古城，是主要廣場，也是一個市集，以及居民與遊客共同的熱鬧中心。白天，弄蛇人和賣飲料的攤位擠滿廣場；到了晚上，這個 _______ 中心擠滿人潮，人們前來聽說書人講述傳統寓言、觀賞魔術師表演，並逛逛許多販售草藥的攤位。隨著夜晚漸深，數十個食物攤販擺起攤位，供應人群飲食。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "B", "expl": "At night the square is filled with throngs of people, storytellers, and booths, so it is bustling (full of activity).", "explZh": "晚上廣場擠滿人潮、說書人和攤位，所以是熱鬧的（bustling）。", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "On <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weekend\" target=\"_blank\" rel=\"noopener\">weekend<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mornings\" target=\"_blank\" rel=\"noopener\">mornings<\/a>, the _______ fish market is packed with shoppers, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vendor\" target=\"_blank\" rel=\"noopener\" data-w=\"vendor\" data-pos=\"n.\" data-en=\"a person who sells things, often on the street\" data-zh=\"小販；攤販\">vendors<\/a> shout prices over the noise of ice being shoveled onto the counters.", "bodyPlain": "On weekend mornings, the _______ fish market is packed with shoppers, and vendors shout prices over the noise of ice being shoveled onto the counters.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "週末早上，這個 _______ 魚市場擠滿了購物的人，攤販在鏟冰到櫃台上的噪音中大聲喊價。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "B", "expl": "Crowds of shoppers and loud vendors describe a place full of activity: \"bustling.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "When the mine closed in 1965, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=families\" target=\"_blank\" rel=\"noopener\">families<\/a> left the town one by one. Today, its _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=streets\" target=\"_blank\" rel=\"noopener\">streets<\/a> are lined with empty houses, and only tumbleweeds move through the old main <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=square\" target=\"_blank\" rel=\"noopener\" data-w=\"square\" data-pos=\"adj.\" data-en=\"used before units to measure area, e.g. square mile\" data-zh=\"平方的\">square<\/a>.", "bodyPlain": "When the mine closed in 1965, families left the town one by one. Today, its _______ streets are lined with empty houses, and only tumbleweeds move through the old main square.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1965 年礦場關閉後，一戶戶人家陸續離開了這座小鎮。如今，鎮上 _______ 街道兩旁都是空屋，只有風滾草在古老的主廣場上滾動。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "D", "expl": "After the factory closed and everyone left, the streets were empty, or \"deserted.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "Guests at the state dinner must follow a strict dress code, sit in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assigned\" target=\"_blank\" rel=\"noopener\">assigned<\/a> seats, and wait for the host to begin each course. The _______ event <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=follows\" target=\"_blank\" rel=\"noopener\">follows<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=customs\" target=\"_blank\" rel=\"noopener\">customs<\/a> that have barely changed in a hundred years.", "bodyPlain": "Guests at the state dinner must follow a strict dress code, sit in assigned seats, and wait for the host to begin each course. The _______ event follows customs that have barely changed in a hundred years.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "國宴的賓客必須遵守嚴格的服裝規定、坐在指定座位，並等主人開始後才能用每一道菜。這場 _______ 活動所遵循的禮俗，一百年來幾乎沒有改變。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "A", "expl": "Strict dress codes and assigned seats describe an event that follows set rules: \"formal.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "Climbers on the peak must carry rain gear and extra layers because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weather\" target=\"_blank\" rel=\"noopener\">weather<\/a> there is _______: sunny skies can turn into a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hailstorm\" target=\"_blank\" rel=\"noopener\">hailstorm<\/a> in less than an hour.", "bodyPlain": "Climbers on the peak must carry rain gear and extra layers because the weather there is _______: sunny skies can turn into a hailstorm in less than an hour.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "攀登這座山峰的人必須攜帶雨具和多帶幾層衣物，因為那裡的天氣是 _______：晴朗的天空可能在不到一小時內變成冰雹。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "C", "expl": "Weather that can change from sunshine to hail within an hour cannot be predicted: \"unpredictable.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: choose an adjective meaning \"full of busy activity\" for a crowded square at night.", "vocab": true, "body": "Built in 1913, Grand Central Terminal is still one of the most _______ places in New York City, with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=roughly\" target=\"_blank\" rel=\"noopener\" data-w=\"roughly\" data-pos=\"adv.\" data-en=\"approximately; not exactly\" data-zh=\"大約；粗略地\">roughly<\/a> 750,000 people <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hurrying\" target=\"_blank\" rel=\"noopener\">hurrying<\/a> through its halls each day.", "bodyPlain": "Built in 1913, Grand Central Terminal is still one of the most _______ places in New York City, with roughly 750,000 people hurrying through its halls each day.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "建於 1913 年的中央車站，至今仍是紐約市最 _______ 的地方之一，每天約有 75 萬人匆匆穿過它的大廳。", "opts": {"A": "formal", "B": "bustling", "C": "unpredictable", "D": "deserted"}, "optsZh": {"A": "正式的", "B": "熱鬧的；繁忙的", "C": "難以預測的", "D": "荒涼的；無人的"}, "answer": "B", "expl": "Thousands of travelers and constant announcements describe a very busy station: \"bustling.\"", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "following official rules and customs", "zh": "正式的", "word": "formal"}, "B": {"pos": "adj.", "en": "full of busy activity and people", "zh": "熱鬧的；繁忙的", "word": "bustling"}, "C": {"pos": "adj.", "en": "not able to be known in advance", "zh": "難以預測的", "word": "unpredictable"}, "D": {"pos": "adj.", "en": "empty; with no people", "zh": "荒涼的；無人的", "word": "deserted"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: choose a noun meaning \"negative results or consequences\" of a medical procedure.", "vocab": true, "body": "When <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developing<\/a> the procedure for LASIK eye surgery, inventor Gholam A. Peyman faced many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obstacle\" target=\"_blank\" rel=\"noopener\" data-w=\"obstacle\" data-pos=\"n.\" data-en=\"something that blocks the way\" data-zh=\"障礙\">obstacles<\/a> in trying to create a way to use lasers on the delicate tissues within the eye without causing pain or scarring. Through many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiments<\/a>, he was able to gather that using a flap of tissue instead of performing surgery on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> of the cornea could greatly reduce the incidence of _______ of the procedure. Peyman was able to secure patents in the US for his ideas and furthered his research to help the field of ophthalmology.", "bodyPlain": "When developing the procedure for LASIK eye surgery, inventor Gholam A. Peyman faced many obstacles in trying to create a way to use lasers on the delicate tissues within the eye without causing pain or scarring. Through many experiments, he was able to gather that using a flap of tissue instead of performing surgery on the surface of the cornea could greatly reduce the incidence of _______ of the procedure. Peyman was able to secure patents in the US for his ideas and furthered his research to help the field of ophthalmology.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "在開發 LASIK 雷射眼科手術時，發明者 Gholam A.Peyman 在試圖找出一種用雷射處理眼內脆弱組織、又不造成疼痛或疤痕的方法時，遇到了許多障礙。經過多次實驗，他得知使用一片組織瓣，而不是直接在角膜表面進行手術，可以大幅減少這項手術 _______ 的發生率。Peyman 在美國取得了這些構想的專利，並進一步推動研究，以促進眼科領域的發展。", "opts": {"A": "characteristics", "B": "prospects", "C": "efficacy", "D": "repercussions"}, "optsZh": {"A": "特徵；特性", "B": "前景；展望", "C": "功效；效力", "D": "不良後果；反響"}, "answer": "D", "expl": "Peyman wanted to avoid pain or scarring; the flap reduced these negative results, or repercussions.", "explZh": "Peyman 想避免疼痛或疤痕；組織瓣減少的是這些不良後果（repercussions）。", "defs": {"A": {"pos": "n.", "en": "a typical quality or feature", "zh": "特徵；特性", "w": "characteristic", "word": "characteristic"}, "B": {"pos": "n.", "en": "the chances of future success", "zh": "前景；展望", "w": "prospect", "word": "prospect"}, "C": {"pos": "n.", "en": "the ability to produce the desired result", "zh": "功效；效力", "word": "efficacy"}, "D": {"pos": "n.", "en": "a bad effect or result of an action", "zh": "不良後果；影響", "w": "repercussion", "word": "repercussion"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: choose a noun meaning \"negative results or consequences\" of a medical procedure.", "vocab": true, "body": "When the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=factory\" target=\"_blank\" rel=\"noopener\">factory<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suddenly\" target=\"_blank\" rel=\"noopener\">suddenly<\/a> closed, the _______ were felt across the whole town: <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hundreds\" target=\"_blank\" rel=\"noopener\">hundreds<\/a> of workers lost their jobs, and many nearby shops soon went out of business.", "bodyPlain": "When the factory suddenly closed, the _______ were felt across the whole town: hundreds of workers lost their jobs, and many nearby shops soon went out of business.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "工廠突然關閉時，整個小鎮都感受到了 _______：數百名工人失業，附近許多商店也很快倒閉。", "opts": {"A": "characteristics", "B": "prospects", "C": "efficacy", "D": "repercussions"}, "optsZh": {"A": "特徵；特性", "B": "前景；展望", "C": "功效；效力", "D": "不良後果；反響"}, "answer": "D", "expl": "Job losses and higher prices are bad results that follow the decision, so \"repercussions\" fits.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a typical quality or feature", "zh": "特徵；特性", "w": "characteristic", "word": "characteristic"}, "B": {"pos": "n.", "en": "the chances of future success", "zh": "前景；展望", "w": "prospect", "word": "prospect"}, "C": {"pos": "n.", "en": "the ability to produce the desired result", "zh": "功效；效力", "word": "efficacy"}, "D": {"pos": "n.", "en": "a bad effect or result of an action", "zh": "不良後果；影響", "w": "repercussion", "word": "repercussion"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: choose a noun meaning \"negative results or consequences\" of a medical procedure.", "vocab": true, "body": "Before the new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vaccine\" target=\"_blank\" rel=\"noopener\" data-w=\"vaccine\" data-pos=\"n.\ ", "en": "the chances of future success", "zh": "前景；展望", "w": "prospect", "word": "prospect"}, "C": {"pos": "n.", "en": "the ability to produce the desired result", "zh": "功效；效力", "word": "efficacy"}, "D": {"pos": "n.", "en": "a bad effect or result of an action", "zh": "不良後果；影響", "w": "repercussion", "word": "repercussion"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: choose a noun meaning \"negative results or consequences\" of a medical procedure.", "vocab": true, "body": "With demand for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electric\" target=\"_blank\" rel=\"noopener\">electric<\/a> cars rising and several new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=factories\" target=\"_blank\" rel=\"noopener\">factories<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=planned\" target=\"_blank\" rel=\"noopener\">planned<\/a>, economists say the region&#x27;s job _______ have never looked brighter.", "bodyPlain": "With demand for electric cars rising and several new factories planned, economists say the region's job _______ have never looked brighter.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "隨著電動車需求上升，加上計畫興建數座新工廠，經濟學家表示該地區的就業 _______ 從未如此光明。", "opts": {"A": "characteristics", "B": "prospects", "C": "efficacy", "D": "repercussions"}, "optsZh": {"A": "特徵；特性", "B": "前景；展望", "C": "功效；效力", "D": "不良後果；反響"}, "answer": "B", "expl": "Rising demand and new investment suggest good chances of future success: \"prospects.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a typical quality or feature", "zh": "特徵；特性", "w": "characteristic", "word": "characteristic"}, "B": {"pos": "n.", "en": "the chances of future success", "zh": "前景；展望", "w": "prospect", "word": "prospect"}, "C": {"pos": "n.", "en": "the ability to produce the desired result", "zh": "功效；效力", "word": "efficacy"}, "D": {"pos": "n.", "en": "a bad effect or result of an action", "zh": "不良後果；影響", "w": "repercussion", "word": "repercussion"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: choose a noun meaning \"negative results or consequences\" of a medical procedure.", "vocab": true, "body": "Engineers warned that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cutting\" target=\"_blank\" rel=\"noopener\">cutting<\/a> the safety budget could have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=serious\" target=\"_blank\" rel=\"noopener\">serious<\/a> _______, and within two years the bridge needed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emergency\" target=\"_blank\" rel=\"noopener\">emergency<\/a> repairs that cost ten times the amount that had been saved.", "bodyPlain": "Engineers warned that cutting the safety budget could have serious _______, and within two years the bridge needed emergency repairs that cost ten times the amount that had been saved.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "工程師警告，削減安全預算可能會帶來嚴重的 _______，果然兩年內這座橋就需要緊急修繕，費用是當初省下金額的十倍。", "opts": {"A": "characteristics", "B": "prospects", "C": "efficacy", "D": "repercussions"}, "optsZh": {"A": "特徵；特性", "B": "前景；展望", "C": "功效；效力", "D": "不良後果；反響"}, "answer": "D", "expl": "Ignoring the warnings led to serious harmful results: \"repercussions.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a typical quality or feature", "zh": "特徵；特性", "w": "characteristic", "word": "characteristic"}, "B": {"pos": "n.", "en": "the chances of future success", "zh": "前景；展望", "w": "prospect", "word": "prospect"}, "C": {"pos": "n.", "en": "the ability to produce the desired result", "zh": "功效；效力", "word": "efficacy"}, "D": {"pos": "n.", "en": "a bad effect or result of an action", "zh": "不良後果；影響", "w": "repercussion", "word": "repercussion"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: choose a verb meaning \"collected together\" for rainwater gathered in a container.", "vocab": true, "body": "The process of rainwater harvesting includes gathering and reserving rainwater instead of allowing it to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trickle\" target=\"_blank\" rel=\"noopener\" data-w=\"trickle\" data-pos=\"v.\" data-en=\"to flow slowly in a thin stream\" data-zh=\"滴流；細流\">trickle<\/a> away. When it rains, water is collected from an awning or roof and _______ in a large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vessel\" target=\"_blank\" rel=\"noopener\" data-w=\"vessel\" data-pos=\"n.\" data-en=\"a container such as a pot or bowl\" data-zh=\"器皿；容器\">vessel<\/a> like a well or reservoir where it can drain back to the ground water source for things like domestic and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=livestock\" target=\"_blank\" rel=\"noopener\" data-w=\"livestock\" data-pos=\"n.\" data-en=\"farm animals such as cows and sheep\" data-zh=\"家畜；牲畜\">livestock<\/a> use.", "bodyPlain": "The process of rainwater harvesting includes gathering and reserving rainwater instead of allowing it to trickle away. When it rains, water is collected from an awning or roof and _______ in a large vessel like a well or reservoir where it can drain back to the ground water source for things like domestic and livestock use.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "雨水收集的過程包括收集並儲存雨水，而不是任其流走。下雨時，雨水 6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: choose a verb meaning \"confirm with evidence\" for scientists proving a predicted particle exists.", "vocab": true, "body": "Before any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=telescope\" target=\"_blank\" rel=\"noopener\">telescope<\/a> had detected it, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomer\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomer\" data-pos=\"n.\" data-en=\"a scientist who studies stars and planets\" data-zh=\"天文學家\">astronomers<\/a> began to _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=existence\" target=\"_blank\" rel=\"noopener\" data-w=\"existence\" data-pos=\"n.\" data-en=\"the state of being real or present\" data-zh=\"存在\">existence<\/a> of a ninth planet, arguing that its gravity could explain the strange orbits of several distant objects.", "bodyPlain": "Before any telescope had detected it, astronomers began to _______ the existence of a ninth planet, arguing that its gravity could explain the strange orbits of several distant objects.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "在任何望遠鏡偵測到它之前，天文學家就開始 _______ 第九顆行星的存在，主張它的引力可以解釋幾個遙遠天體奇怪的軌道。", "opts": {"A": "corroborate", "B": "exonerate", "C": "contextualize", "D": "postulate"}, "optsZh": {"A": "證實；佐證", "B": "證明……無罪", "C": "將……置於背景脈絡中理解", "D": "假定；提出假設"}, "answer": "D", "expl": "Proposing that a planet exists before anyone has seen it is to \"postulate\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to support or confirm with evidence", "zh": "證實；佐證", "word": "corroborate"}, "B": {"pos": "v.", "en": "to officially show that someone is not guilty", "zh": "證明……無罪", "word": "exonerate"}, "C": {"pos": "v.", "en": "to place something in its background situation to explain it", "zh": "把……置於背景脈絡中", "word": "contextualize"}, "D": {"pos": "v.", "en": "to suggest something as true as a basis for reasoning", "zh": "假定；提出假設", "word": "postulate"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: choose a verb meaning \"confirm with evidence\" for scientists proving a predicted particle exists.", "vocab": true, "body": "A second study, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conduct\" target=\"_blank\" rel=\"noopener\" data-w=\"conduct\" data-pos=\"v.\" data-en=\"to organize and carry out an activity\" data-zh=\"進行；實施\">conducted<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> in Canada, helped _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=original\" target=\"_blank\" rel=\"noopener\">original<\/a> findings by showing the same drop in heart disease among people who walked thirty minutes a day.", "bodyPlain": "A second study, conducted independently in Canada, helped _______ the original findings by showing the same drop in heart disease among people who walked thirty minutes a day.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "另一項在加拿大獨立進行的研究，顯示每天步行三十分鐘的人心臟病發生率同樣下降，幫助 _______ 了原本的研究結果。", "opts": {"A": "corroborate", "B": "exonerate", "C": "contextualize", "D": "postulate"}, "optsZh": {"A": "證實；佐證", "B": "證明……無罪", "C": "將……置於背景脈絡中理解", "D": "假定；提出假設"}, "answer": "A", "expl": "A second independent study that found the same result confirms the first: \"corroborate.\"", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to support or confirm with evidence", "zh": "證實；佐證", "word": "corroborate"}, "B": {"pos": "v.", "en": "to officially show that someone is not guilty", "zh": "證明……無罪", "word": "exonerate"}, "C": {"pos": "v.", "en": "to place something in its background situation to explain it", "zh": "把……置於背景脈絡中", "word": "contextualize"}, "D": {"pos": "v.", "en": "to suggest something as true as a basis for reasoning", "zh": "假定；提出假設", "word": "postulate"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Words in Context: choose a verb meaning \"clearly showed\" a quality through actions.", "vocab": true, "body": "A highly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=influential\" target=\"_blank\" rel=\"noopener\" data-w=\"influential\" data-pos=\"adj.\" data-en=\"having a strong effect on people or events\" data-zh=\"有影響力的\">influential<\/a> leader of the US civil rights movement, Martin Luther King Jr. _______ his commitment to nonviolent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a> by organizing and directing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> peaceful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protest\" target=\"_blank\" rel=\"noopener\" data-w=\"protest\" data-pos=\"n.\" data-en=\"a strong statement or action showing disagreement\" data-zh=\"抗議\">protests<\/a> and sit-ins across the United States in the 1960s: his actions revealed his unwavering dedication to advancing the cause of civil rights without resorting to violence.", "bodyPlain": "A highly influential leader of the US civil rights movement, Martin Luther King Jr. _______ his commitment to nonviolent resistance by organizing and directing numerous peaceful protests and sit-ins across the United States in the 1960s: his actions revealed his unwavering dedication to advancing the cause of civil rights without resorting to violence.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "身為美國民權運動中極具影響力的領袖，小馬丁·路德·金恩在 1960 年代於全美各地組織並領導了無數和平抗議與靜坐，_______ 他對非暴力抵抗的承諾：他的行動顯示出他不訴諸暴力、堅定推動民權運動的決心。", "opts": {"A": "characterized", "B": "evinced", "C": "elided", "D": "gauged"}, "optsZh": {"A": "描述為；以……為特徵", "B": "表現出；顯示出", "C": "省略了", "D": "測量了"}, "answer": "B", "expl": "His actions revealed his dedication, so he evinced (clearly showed) his commitment to nonviolence.", "explZh": "他的行動顯示出他的決心，所以他表現出（evinced）對非暴力的承諾。", "defs": {"A": {"pos": "v.", "en": "to describe the typical qualities of", "zh": "描述……的特徵；形容為", "w": "characterize", "word": "characterize"}, "B": {"pos": "v.", "en": "to clearly show a feeling or quality", "zh": "表現出；顯示出", "w": "evince", "word": "evince"}, "C": {"pos": "v.", "en": "to leave out or omit", "zh": "省略", "w": "elide", "word": "elide"}, "D": {"pos": "v.", "en": "to measure or judge something", "zh": "測量；判斷", "w": "gauge", "word": "gauge"}}}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Words in Context: choose a verb meaning \"clearly showed\" a quality through actions.", "vocab": true, "body": "Firefighter Ana Ruiz _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=courage\" target ude\" target=\"_blank\" rel=\"noopener\" data-w=\"altitude\" data-pos=\"n.\" data-en=\"height above sea level\" data-zh=\"海拔；高度\">altitudes<\/a> to make sure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> were safe.", "bodyPlain": "Before the launch, engineers carefully _______ the wind speed at several altitudes to make sure conditions were safe.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "發射前，工程師仔細 _______ 了幾個高度的風速，以確保條件安全。", "opts": {"A": "characterized", "B": "evinced", "C": "elided", "D": "gauged"}, "optsZh": {"A": "描述為；以……為特徵", "B": "表現出；顯示出", "C": "省略了", "D": "測量了"}, "answer": "D", "expl": "Using instruments to measure wind speed is to \"gauge\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to describe the typical qualities of", "zh": "描述……的特徵；形容為", "w": "characterize", "word": "characterize"}, "B": {"pos": "v.", "en": "to clearly show a feeling or quality", "zh": "表現出；顯示出", "w": "evince", "word": "evince"}, "C": {"pos": "v.", "en": "to leave out or omit", "zh": "省略", "w": "elide", "word": "elide"}, "D": {"pos": "v.", "en": "to measure or judge something", "zh": "測量；判斷", "w": "gauge", "word": "gauge"}}}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Words in Context: choose a verb meaning \"clearly showed\" a quality through actions.", "vocab": true, "body": "The art critic _______ Georgia O&#x27;Keeffe&#x27;s flower <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">paintings<\/a> as bold and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intimate\" target=\"_blank\" rel=\"noopener\">intimate<\/a>, noting their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=enormous\" target=\"_blank\" rel=\"noopener\">enormous<\/a> size and close focus on petals.", "bodyPlain": "The art critic _______ Georgia O'Keeffe's flower paintings as bold and intimate, noting their enormous size and close focus on petals.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "藝術評論家把 Georgia O'Keeffe 的花卉畫作 _______ 為大膽而私密，並指出它們巨大的尺寸與對花瓣的近距離聚焦。", "opts": {"A": "characterized", "B": "evinced", "C": "elided", "D": "gauged"}, "optsZh": {"A": "描述為；以……為特徵", "B": "表現出；顯示出", "C": "省略了", "D": "測量了"}, "answer": "A", "expl": "The critic described the paintings' typical qualities, so \"characterized\" fits.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to describe the typical qualities of", "zh": "描述……的特徵；形容為", "w": "characterize", "word": "characterize"}, "B": {"pos": "v.", "en": "to clearly show a feeling or quality", "zh": "表現出；顯示出", "w": "evince", "word": "evince"}, "C": {"pos": "v.", "en": "to leave out or omit", "zh": "省略", "w": "elide", "word": "elide"}, "D": {"pos": "v.", "en": "to measure or judge something", "zh": "測量；判斷", "w": "gauge", "word": "gauge"}}}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Words in Context: choose a verb meaning \"clearly showed\" a quality through actions.", "vocab": true, "body": "The poet _______ his deep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dedication\" target=\"_blank\" rel=\"noopener\">dedication<\/a> to his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=craft\" target=\"_blank\" rel=\"noopener\" data-w=\"craft\" data-pos=\"v.\" data-en=\"to make something skillfully by hand\" data-zh=\"精心製作\">craft<\/a> by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=writing\" target=\"_blank\" rel=\"noopener\">writing<\/a> at least one page every single day for more than fifty years, even while traveling or ill.", "bodyPlain": "The poet _______ his deep dedication to his craft by writing at least one page every single day for more than fifty years, even while traveling or ill.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這位詩人五十多年來每天至少寫一頁，即使在旅行或生病時也不例外，_______ 出他對寫作技藝的深切投入。", "opts": {"A": "characterized", "B": "evinced", "C": "elided", "D": "gauged"}, "optsZh": {"A": "描述為；以……為特徵", "B": "表現出；顯示出", "C": "省略了", "D": "測量了"}, "answer": "B", "expl": "Writing every day for fifty years clearly showed his dedication: \"evinced.\"", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to describe the typical qualities of", "zh": "描述……的特徵；形容為", "w": "characterize", "word": "characterize"}, "B": {"pos": "v.", "en": "to clearly show a feeling or quality", "zh": "表現出；顯示出", "w": "evince", "word": "evince"}, "C": {"pos": "v.", "en": "to leave out or omit", "zh": "省略", "w": "elide", "word": "elide"}, "D": {"pos": "v.", "en": "to measure or judge something", "zh": "測量；判斷", "w": "gauge", "word": "gauge"}}}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "An <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> headed by University of Wisconsin psychologist Sohad Murrar provides compelling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> that individuals feel more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inclusive\" target=\"_blank\" rel=\"noopener\" data-w=\"inclusive\" data-pos=\"adj.\" data-en=\"including everyone; not leaving anyone out\" data-zh=\"包容的；涵蓋廣泛的\">inclusive<\/a> toward other groups when they are informed that pro-diversity attitudes and behaviors are extremely popular among their peers. <u>Students were presented with either a neutrally messaged poster or a poster that displayed fellow students of diverse ethnic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">backgrounds<\/a>, a statement about valuing diversity, and statistics indicating their fellow students’ strong support for the statement.<\/u> The study found that students were more likely to embrace inclusive statements and reject racist statements even weeks after they were exposed to the pro-diversity poster.", "bodyPlain": "An experiment headed by University of Wisconsin psychologist Sohad Murrar provides compelling evidence that individuals feel more inclusive toward other groups when they are informed that pro-diversity attitudes and behaviors are extremely popular among their peers. Students were presented with either a neutrally messaged poster or a poster that displayed fellow students of diverse ethnic backgrounds, a statement about valuing diversity, and statistics indicating their fellow students’ strong support for the statement. The study found that students were more likely to embrace inclusive statements and reject racist statements even weeks after they were exposed to the pro-diversity poster.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "由威斯康辛大學心理學家 Sohad Murrar 主導的一項實驗提供了有力證據：當人們得知支持多元的態度與行為在同儕間極為普遍時，會對其他群體更具包容性。學生們看到的是一張訊息中性的海報，或是一張展示不同族裔同學、一段重視多元的聲明，以及顯示同學們強烈支持這段聲明之統計數據的海報。研究發現，即使在看過支持多元的海報數週之後，學生仍更可能認同包容性的陳述，並拒絕種族歧視的陳述。", "opts": {"A": "To analyze the implications of the results of the experiment", "B": "To demonstrate the difficulty of assessing individuals’ views on inclusivity and racism", "C": "To highlight a specific instance in which the findings of the experiment were confirmed", "D": "To describe certain aspects of the design and methodology of the experiment"}, "optsZh": {"A": "分析實驗結果的意涵", "B": "說明評估個人對包容與種族主義看法的困難", "C": "強調一個實驗結果獲得證實的具體實例", "D": "描述實驗設計與方法的某些面向"}, "answer": "D", "expl": "The underlined sentence explains what the students were shown in each condition, which describes how the experiment was designed.", "explZh": "畫線句說明學生在各組中看到什麼海報，也就是描述實驗的設計與方法。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Structure and Purpose: identify the function of an underlined sentence that describes an experiment's design.", "vocab": false, "body": "Psychologist Lena Hart <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studied\" target=\"_blank\" rel=\"noopener\">studied<\/a> whether music helps people <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remember\" target=\"_blank\" rel=\"noopener\">remember<\/a> words. <u>Participants memorized a list of 30 words while listening either to calm piano music or to no music at all.<\/u> Those who heard the music recalled about 20 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\"
