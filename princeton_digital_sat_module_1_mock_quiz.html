ustomers in each. These economists would therefore expect the bakery to _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "經濟學家假設公司追求盡可能高的利潤。一家麵包店可以在 X 鎮以每條賺 2 美元的利潤賣麵包，或在 Y 鎮以每條賺 5 美元的利潤賣，兩鎮的顧客人數相同。因此，這些經濟學家會預期這家麵包店 _______", "opts": {"A": "focus on selling its bread in Town Y.", "B": "focus on selling its bread in Town X.", "C": "stop making bread.", "D": "charge the same price in both towns regardless of profit."}, "optsZh": {"A": "專注在 Y 鎮賣麵包。", "B": "專注在 X 鎮賣麵包。", "C": "停止製作麵包。", "D": "不論利潤，在兩個鎮收取相同價格。"}, "answer": "A", "expl": "If firms always maximize profit and the second market is more profitable, they should enter it.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "Karni Mata Temple is a Hindu temple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=located\" target=\"_blank\" rel=\"noopener\">located<\/a> in the town of Deshnoke in India. The temple is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dedicated\" target=\"_blank\" rel=\"noopener\">dedicated<\/a> to Karni Mata and is an important <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pilgrimage\" target=\"_blank\" rel=\"noopener\" data-w=\"pilgrimage\" data-pos=\"n.\" data-en=\"a long journey to a special or holy place\" data-zh=\"朝聖之旅\">pilgrimage<\/a> site. Numerous rats, known as kaba and considered holy, live in Karni Mata Temple, earning the temple _______ nickname, “Temple of Rats.”", "bodyPlain": "Karni Mata Temple is a Hindu temple located in the town of Deshnoke in India. The temple is dedicated to Karni Mata and is an important pilgrimage site. Numerous rats, known as kaba and considered holy, live in Karni Mata Temple, earning the temple _______ nickname, “Temple of Rats.”", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "卡尼瑪塔神廟是一座印度教神廟，位於印度的 Deshnoke 鎮。這座神廟供奉卡尼瑪塔，是重要的朝聖地點。許多被稱為 kaba、被視為神聖的老鼠住在卡尼瑪塔神廟裡，為神廟贏得了 _______ 綽號——「老鼠神廟」。", "opts": {"A": "it’s", "B": "its", "C": "their", "D": "they’re"}, "optsZh": {"A": "it's（＝it is）", "B": "its（它的）", "C": "their（他們的）", "D": "they're（＝they are）"}, "answer": "B", "expl": "The nickname belongs to the temple (singular), so use the singular possessive its.", "explZh": "綽號屬於神廟（單數），所以用單數所有格 its。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "Every spring, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visitors\" target=\"_blank\" rel=\"noopener\">visitors<\/a> come to see the cherry trees along the river in Hirosaki, Japan. The pink petals that fall into the water give the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=festival\" target=\"_blank\" rel=\"noopener\">festival<\/a> _______ famous nickname, &quot;the river of flowers.&quot;", "bodyPlain": "Every spring, thousands of visitors come to see the cherry trees along the river in Hirosaki, Japan. The pink petals that fall into the water give the festival _______ famous nickname, \"the river of flowers.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每年春天，數千名遊客來到日本弘前，欣賞河邊的櫻花樹。落入水中的粉紅花瓣，為這個節慶贏得了 _______ 著名綽號——「花筏之河」。", "opts": {"A": "its", "B": "their", "C": "it's", "D": "they're"}, "optsZh": {"A": "its（它的）", "B": "their（他們的）", "C": "it's（＝it is）", "D": "they're（＝they are）"}, "answer": "A", "expl": "The festival (singular) owns the name, so the singular possessive \"its\" is correct.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "Emperor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=penguins\" target=\"_blank\" rel=\"noopener\">penguins<\/a> huddle <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=together\" target=\"_blank\" rel=\"noopener\">together<\/a> during Antarctic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=winters\" target=\"_blank\" rel=\"noopener\">winters<\/a>. By constantly shifting positions, the penguins share the warmth, and each bird takes a turn in the center of the group, protecting _______ body from the freezing wind.", "bodyPlain": "Emperor penguins huddle together during Antarctic winters. By constantly shifting positions, the penguins share the warmth, and each bird takes a turn in the center of the group, protecting _______ body from the freezing wind.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "皇帝企鵝在南極冬季時會擠在一起。藉由不斷變換位置，企鵝們分享溫暖，每隻鳥輪流待在群體中央，保護 _______ 身體免受刺骨寒風侵襲。", "opts": {"A": "they're", "B": "its", "C": "it's", "D": "their"}, "optsZh": {"A": "they're（＝they are）", "B": "its（它的）", "C": "it's（＝it is）", "D": "their（他們的）"}, "answer": "D", "expl": "\"Penguins\" is plural, so the plural possessive \"their\" is needed.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "Lake Malawi is one of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=largest\" target=\"_blank\" rel=\"noopener\">largest<\/a> lakes in Africa, and _______ home to more than 700 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cichlid\" target=\"_blank\" rel=\"noopener\">cichlid<\/a> fish, more than any other lake in the world.", "bodyPlain": "Lake Malawi is one of the largest lakes in Africa, and _______ home to more than 700 species of cichlid fish, more than any other lake in the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "馬拉威湖是非洲最大的湖泊之一，而且 _______ 有超過 700 種慈鯛魚棲息，比世界上任何其他湖泊都多。", "opts": {"A": "its", "B": "they're", "C": "it's", "D": "their"}, "optsZh": {"A": "its（它的）", "B": "they're（＝they are）", "C": "it's（＝it is）", "D": "their（他們的）"}, "answer": "C", "expl": "\"It's\" means \"it is\" here: \"it is home to more than 400 species.\"", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "The Golden Gate Bridge is not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=actually\" target=\"_blank\" rel=\"noopener\">actually<\/a> gold. Engineers chose _______ famous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=red-orange\" target=\"_blank\" rel=\"noopener\">red-orange<\/a> color, called &quot;International Orange,&quot; because it stands out <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clear\" target=\"_blank\" rel=\"noopener\" data-w=\"clear\" data-pos=\"adj./v.\" data-en=\"easy to see or understand; (v.) to remove something blocking, e.g., to clear your throat\" data-zh=\"清楚的；清除、清（喉嚨）\">clearly<\/a> in San Francisco&#x27;s frequent fog.", "bodyPlain": "The Golden Gate Bridge is not actually gold. Engineers chose _______ famous red-orange color, called \"International Orange,\" because it stands out clearly in San Francisco's frequent fog.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "金門大橋其實並不是金色的。工程師選擇了 _______ 著名的紅橘色，稱為「國際橘」，因為它在舊金山常見的霧中十分醒目。", "opts": {"A": "its", "B": "they're", "C": "their", "D": "it's"}, "optsZh": {"A": "its（它的）", "B": "they're（＝they are）", "C": "their（他們的）", "D": "it's（＝it is）"}, "answer": "A", "expl": "The bridge (singular) owns the color, so \"its\" is correct.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Standard English Conventions: choose the correct possessive determiner (its vs. it's/their/they're).", "vocab": false, "body": "Tardigrades are tiny <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=animals\" target=\"_blank\" rel=\"noopener\">animals<\/a> less than a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=millimeter\" target=\"_blank\" rel=\"noopener\">millimeter<\/a> long, yet _______ able to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> boiling water, extreme cold, and even the vacuum of outer space.", "bodyPlain": "Tardigrades are tiny animals less than a millimeter long, yet _______ able to survive boiling water, extreme cold, and even the vacuum of outer space.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "水熊蟲是一種身長不到一公釐的微小動物，然而 _______ 能在沸水、極寒，甚至外太空的真空中存活。", "opts": {"A": "its", "B": "it's", "C": "they're", "D": "their"}, "optsZh": {"A": "its（它的）", "B": "it's（＝it is）", "C": "they're（＝they are）", "D": "their（他們的）"}, "answer": "C", "expl": "\"They're\" means \"they are\": \"they are able to survive.\"", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=addition\" target=\"_blank\" rel=\"noopener\">addition<\/a> to her research into the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effects\" target=\"_blank\" rel=\"noopener\">effects<\/a> of hormones, ultraviolet light, and chemotherapy agents on cell _______, Jewel Plummer Cobb served as dean at Connecticut College and Rutgers University and as president of California State University, Fullerton, where she led many projects <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expanding<\/a> the school’s facilities.", "bodyPlain": "In addition to her research into the effects of hormones, ultraviolet light, and chemotherapy agents on cell _______, Jewel Plummer Cobb served as dean at Connecticut College and Rutgers University and as president of California State University, Fullerton, where she led many projects expanding the school’s facilities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "除了研究荷爾蒙、紫外線與化療藥物對細胞 _______ 的影響之外，Jewel Plummer Cobb 也曾擔任康乃狄克學院與羅格斯大學的院長，以及加州州立大學富勒頓分校的校長，並在任內主導許多擴建學校設施的計畫。", "opts": {"A": "division: biologist", "B": "division. Biologist", "C": "division biologist", "D": "division, biologist"}, "optsZh": {"A": "division: biologist（冒號）", "B": "division. Biologist（句號）", "C": "division biologist（無標點）", "D": "division, biologist（逗號）"}, "answer": "D", "expl": "The introductory phrase ends after 'cell division,' so a comma separates it from the main clause that begins with the subject 'biologist Jewel Plummer Cobb.'", "explZh": "引導片語在「cell division」結束，要用逗號與以主詞「biologist Jewel Plummer Cobb」開始的主要子句分開。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "After seeing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=streetcar\" target=\"_blank\" rel=\"noopener\">streetcar<\/a> driver <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=struggle\" target=\"_blank\" rel=\"noopener\">struggle<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clear\" target=\"_blank\" rel=\"noopener\" data-w=\"clear\" data-pos=\"adj./v.\" data-en=\"easy to see or understand; (v.) to remove something blocking, e.g., to clear your throat\" data-zh=\"清楚的；清除、清（喉嚨）\">clear<\/a> snow from his window during a trip to New York _______ inventor Mary Anderson designed the first windshield wiper in 1903.", "bodyPlain": "After seeing a streetcar driver struggle to clear snow from his window during a trip to New York _______ inventor Mary Anderson designed the first windshield wiper in 1903.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在一次紐約之旅中，看到電車司機費力清除車窗上的積雪之後 _______ 發明家 Mary Anderson 於 1903 年設計出第一個雨刷。", "opts": {"A": "City: inventor", "B": "City. Inventor", "C": "City inventor", "D": "City, inventor"}, "optsZh": {"A": "City: inventor（冒號）", "B": "City. Inventor（句號）", "C": "City inventor（無標點）", "D": "City, inventor（逗號）"}, "answer": "D", "expl": "An introductory phrase is followed by a comma before the subject \"inventor Mary Anderson.\"", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "Besides <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discovering\" target=\"_blank\" rel=\"noopener\">discovering<\/a> more than thirty new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deep-sea\" target=\"_blank\" rel=\"noopener\">deep-sea<\/a> fish during her _______ Sylvia Earle led the first team of women aquanauts to live underwater for two weeks.", "bodyPlain": "Besides discovering more than thirty new species of deep-sea fish during her _______ Sylvia Earle led the first team of women aquanauts to live underwater for two weeks.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "除了在她的 _______ 中發現三十多種新的深海魚類之外，Sylvia Earle 也帶領第一支女性水下研究員團隊在水下生活了兩週。", "opts": {"A": "career. Oceanographer", "B": "career: oceanographer", "C": "career, oceanographer", "D": "career oceanographer"}, "optsZh": {"A": "career. Oceanographer（句號）", "B": "career: oceanographer（冒號）", "C": "career, oceanographer（逗號）", "D": "career oceanographer（無標點）"}, "answer": "C", "expl": "The long introductory phrase ends with a comma before the main clause begins.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "Known for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> dishes such as foams, gels, and &quot;<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spherified\" target=\"_blank\" rel=\"noopener\">spherified<\/a>&quot; olives that burst in the _______ chef Ferran Adrià changed how many people think about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cooking\" target=\"_blank\" rel=\"noopener\">cooking<\/a>.", "bodyPlain": "Known for experimental dishes such as foams, gels, and \"spherified\" olives that burst in the _______ chef Ferran Adrià changed how many people think about cooking.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "以泡沫、凝膠和在口中 _______ 爆開的「球化」橄欖等實驗性料理聞名，主廚 Ferran Adrià 改變了許多人對烹飪的看法。", "opts": {"A": "mouth. Chef", "B": "mouth chef", "C": "mouth: chef", "D": "mouth, chef"}, "optsZh": {"A": "mouth. Chef（句號）", "B": "mouth chef（無標點）", "C": "mouth: chef（冒號）", "D": "mouth, chef（逗號）"}, "answer": "D", "expl": "A comma separates the introductory prepositional phrase from the subject \"chef Ferran Adrià.\"", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=addition\" target=\"_blank\" rel=\"noopener\">addition<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designing\" target=\"_blank\" rel=\"noopener\">designing<\/a> more than 300 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=buildings\" target=\"_blank\" rel=\"noopener\">buildings<\/a> across five continents during her _______ architect Zaha Hadid became the first woman to win the Pritzker Prize.", "bodyPlain": "In addition to designing more than 300 buildings across five continents during her _______ architect Zaha Hadid became the first woman to win the Pritzker Prize.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "除了在她的 _______ 中於五大洲設計超過 300 棟建築之外，建築師 Zaha Hadid 也成為第一位獲得普立茲克獎的女性。", "opts": {"A": "lifetime: architect", "B": "lifetime. Architect", "C": "lifetime, architect", "D": "lifetime architect"}, "optsZh": {"A": "lifetime: architect（冒號）", "B": "lifetime. Architect（句號）", "C": "lifetime, architect（逗號）", "D": "lifetime architect（無標點）"}, "answer": "C", "expl": "The introductory phrase ends with a comma; a period or colon would leave a fragment.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Standard English Conventions (Boundaries): use a comma after an introductory phrase before the main clause's subject.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=working\" target=\"_blank\" rel=\"noopener\">working<\/a> at NASA&#x27;s Jet Propulsion Laboratory on new cooling systems for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spacecraft\" target=\"_blank\" rel=\"noopener\" data-w=\"spacecraft\" data-pos=\"n.\" data-en=\"a vehicle that travels in space\" data-zh=\"太空船\">spacecraft<\/a> _______ engineer Lonnie Johnson accidentally <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invent\" target=\"_blank\" rel=\"noopener\" data-w=\"invent\" data-pos=\"v.\" data-en=\"to create something that did not exist before\" data-zh=\"發明\">invented<\/a> the Super Soaker water gun.", "bodyPlain": "While working at NASA's Jet Propulsion Laboratory on new cooling systems for spacecraft _______ engineer Lonnie Johnson accidentally invented the Super Soaker water gun.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在 NASA 噴射推進實驗室研究太空船 _______ 的新冷卻系統時，工程師 Lonnie Johnson 意外發明了超級水槍。", "opts": {"A": "engines engineer", "B": "engines: engineer", "C": "engines. Engineer", "D": "engines, engineer"}, "optsZh": {"A": "engines engineer（無標點）", "B": "engines: engineer（冒號）", "C": "engines. Engineer（句號）", "D": "engines, engineer（逗號）"}, "answer": "D", "expl": "The introductory phrase must be followed by a comma before the subject \"engineer Lonnie Johnson.\"", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "Poetra Asantewa is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=performer\" target=\"_blank\" rel=\"noopener\">performer<\/a> from Ghana who <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=combines\" target=\"_blank\" rel=\"noopener\">combines<\/a> three elements to create her _______ lyrics <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporating<\/a> social issues, vocalization evoking different emotions, and rhythms using soulful elements.", "bodyPlain": "Poetra Asantewa is a performer from Ghana who combines three elements to create her _______ lyrics incorporating social issues, vocalization evoking different emotions, and rhythms using soulful elements.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "Poetra Asantewa 是一位來自迦納的表演者，她結合三種元素來創作她的 _______ 融入社會議題的歌詞、喚起不同情緒的發聲，以及運用靈魂樂元素的節奏。", "opts": {"A": "pieces", "B": "pieces,", "C": "pieces:", "D": "pieces;"}, "optsZh": {"A": "pieces（無標點）", "B": "pieces,（逗號）", "C": "pieces:（冒號）", "D": "pieces;（分號）"}, "answer": "C", "expl": "The complete clause 'combines three elements to create her pieces' introduces the list of the three elements, so a colon is correct.", "explZh": "完整子句「結合三種元素來創作作品」後面接三種元素的清單，所以用冒號。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "Traditional Korean kimchi is made from three main _______ napa <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cabbage\" target=\"_blank\" rel=\"noopener\">cabbage<\/a>, chili powder, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fermented\" target=\"_blank\" rel=\"noopener\">fermented<\/a> fish sauce.", "bodyPlain": "Traditional Korean kimchi is made from three main _______ napa cabbage, chili powder, and fermented fish sauce.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "傳統韓國泡菜由三種主要的 _______ 大白菜、辣椒粉和發酵魚露製成。", "opts": {"A": "ingredients;", "B": "ingredients", "C": "ingredients,", "D": "ingredients:"}, "optsZh": {"A": "ingredients;（分號）", "B": "ingredients（無標點）", "C": "ingredients,（逗號）", "D": "ingredients:（冒號）"}, "answer": "D", "expl": "A complete clause (\"...three ingredients\") introduces the list that follows, so a colon is correct.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "Astronauts must master several skills before their first _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spacewalking\" target=\"_blank\" rel=\"noopener\">spacewalking<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=operating\" target=\"_blank\" rel=\"noopener\">operating<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=robotic\" target=\"_blank\" rel=\"noopener\">robotic<\/a> arm, and speaking basic Russian.", "bodyPlain": "Astronauts must master several skills before their first _______ spacewalking, operating the robotic arm, and speaking basic Russian.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "太空人在第一次 _______ 之前必須熟練幾項技能：太空漫步、操作機械手臂，以及說基本的俄語。", "opts": {"A": "mission", "B": "mission:", "C": "mission;", "D": "mission,"}, "optsZh": {"A": "mission（無標點）", "B": "mission:（冒號）", "C": "mission;（分號）", "D": "mission,（逗號）"}, "answer": "B", "expl": "The colon introduces the list of skills after the complete clause.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pentathlon\" target=\"_blank\" rel=\"noopener\">pentathlon<\/a> at the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Olympic Games tested <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=athletes\" target=\"_blank\" rel=\"noopener\">athletes<\/a> in five _______ running, jumping, wrestling, and throwing both the discus and the javelin.", "bodyPlain": "The pentathlon at the ancient Olympic Games tested athletes in five _______ running, jumping, wrestling, and throwing both the discus and the javelin.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "古代奧運的五項全能測試運動員五個 _______ 賽跑、跳遠、摔角，以及擲鐵餅和標槍。", "opts": {"A": "events", "B": "events,", "C": "events:", "D": "events;"}, "optsZh": {"A": "events（無標點）", "B": "events,（逗號）", "C": "events:（冒號）", "D": "events;（分號）"}, "answer": "C", "expl": "A colon follows an independent clause to introduce a list of the three elements.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "The new city park was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designed\" target=\"_blank\" rel=\"noopener\">designed<\/a> with two _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reducing\" target=\"_blank\" rel=\"noopener\">reducing<\/a> summer heat and giving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a> a quiet place to relax.", "bodyPlain": "The new city park was designed with two _______ reducing summer heat and giving residents a quiet place to relax.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這座新的城市公園在設計時有兩個 _______ 降低夏季高溫，以及提供居民一個安靜的休憩場所。", "opts": {"A": "goals;", "B": "goals:", "C": "goals,", "D": "goals"}, "optsZh": {"A": "goals;（分號）", "B": "goals:（冒號）", "C": "goals,（逗號）", "D": "goals（無標點）"}, "answer": "B", "expl": "The clause before the blank is complete, and the list explains \"two goals,\" so a colon fits.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Standard English Conventions (Boundaries): use a colon to introduce a list after a complete clause.", "vocab": false, "body": "Builder Wang Shu&#x27;s Ningbo History Museum is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=covered\" target=\"_blank\" rel=\"noopener\">covered<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recycled\" target=\"_blank\" rel=\"noopener\" data-w=\"recycled\" data-pos=\"adj.\" data-en=\"made from used materials that have been processed again\" data-zh=\"回收再利用的\">recycled<\/a> _______ old roof tiles, bricks, and stones <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collected\" target=\"_blank\" rel=\"noopener\">collected<\/a> from demolished villages.", "bodyPlain": "Builder Wang Shu's Ningbo History Museum is covered with recycled _______ old roof tiles, bricks, and stones collected from demolished villages.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "建築師王澍設計的寧波博物館外牆覆蓋著回收的 _______ 從被拆除的村莊收集來的舊屋瓦、磚塊和石頭。", "opts": {"A": "materials,", "B": "materials:", "C": "materials", "D": "materials;"}, "optsZh": {"A": "materials,（逗號）", "B": "materials:（冒號）", "C": "materials（無標點）", "D": "materials;（分號）"}, "answer": "B", "expl": "A colon after the complete clause introduces the list of materials.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "Compared to other Ukrainian scientists and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematicians<\/a>, _______ she has worked with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=differential\" target=\"_blank\" rel=\"noopener\">differential<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equations\" target=\"_blank\" rel=\"noopener\">equations<\/a>, partial differential equations, and integrable systems in Dnipro, Cyprus, and Kyiv.", "bodyPlain": "Compared to other Ukrainian scientists and mathematicians, _______ she has worked with differential equations, partial differential equations, and integrable systems in Dnipro, Cyprus, and Kyiv.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "與其他烏克蘭科學家和數學家相比，_______ 她曾在第聶伯、賽普勒斯和基輔研究微分方程、偏微分方程與可積系統。", "opts": {"A": "there is a wide range of fields and Ukrainian cities that Olena Vaneeva has worked in:", "B": "many Ukrainian cities and fields have been home to Olena Vaneeva:", "C": "the range of fields and Ukrainian cities that Olena Vaneeva has worked in is very wide:", "D": "Olena Vaneeva has worked in a wide range of fields and Ukrainian cities:"}, "optsZh": {"A": "Olena Vaneeva 工作過的領域和烏克蘭城市範圍很廣：", "B": "許多烏克蘭城市和領域曾是 Olena Vaneeva 的家：", "C": "Olena Vaneeva 工作過的領域和烏克蘭城市範圍非常廣：", "D": "Olena Vaneeva 曾在許多不同的領域和烏克蘭城市工作："}, "answer": "D", "expl": "'Compared to other Ukrainian scientists' must modify Olena Vaneeva, so her name must come right after the comma.", "explZh": "「Compared to other Ukrainian scientists」修飾的是 Olena Vaneeva，所以她的名字必須緊接在逗號之後。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "Compared to other Mexican <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painters\" target=\"_blank\" rel=\"noopener\">painters<\/a> of her time, _______ she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painted\" target=\"_blank\" rel=\"noopener\">painted<\/a> more than fifty <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=self-portraits\" target=\"_blank\" rel=\"noopener\">self-portraits<\/a> during her life.", "bodyPlain": "Compared to other Mexican painters of her time, _______ she painted more than fifty self-portraits during her life.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "與同時代的其他墨西哥畫家相比，_______ 她一生畫了五十多幅自畫像。", "opts": {"A": "many self-portraits were created by Frida Kahlo:", "B": "there are many self-portraits that Frida Kahlo created:", "C": "the number of self-portraits Frida Kahlo created is very large:", "D": "Frida Kahlo created an unusually large number of self-portraits:"}, "optsZh": {"A": "許多自畫像是由 Frida Kahlo 創作的：", "B": "有許多自畫像是 Frida Kahlo 創作的：", "C": "Frida Kahlo 創作的自畫像數量非常多：", "D": "Frida Kahlo 創作了數量異常多的自畫像："}, "answer": "D", "expl": "\"Compared to other painters\" must modify Frida Kahlo, so her name must come right after the comma.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "Trained as a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemist\" target=\"_blank\" rel=\"noopener\">chemist<\/a> at Columbia University, _______ her research showed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cholesterol\" target=\"_blank\" rel=\"noopener\">cholesterol<\/a> can block <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=arteries\" target=\"_blank\" rel=\"noopener\">arteries<\/a>.", "bodyPlain": "Trained as a chemist at Columbia University, _______ her research showed how cholesterol can block arteries.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在哥倫比亞大學受化學家訓練的 _______ 她的研究揭示了膽固醇如何阻塞動脈。", "opts": {"A": "there were important discoveries about heart health by Marie Maynard Daly:", "B": "important discoveries about heart health were made by Marie Maynard Daly:", "C": "heart health was the subject of Marie Maynard Daly's important discoveries:", "D": "Marie Maynard Daly made important discoveries about heart health:"}, "optsZh": {"A": "有關於心臟健康的重要發現是由 Marie Maynard Daly 做出的：", "B": "關於心臟健康的重要發現是由 Marie Maynard Daly 所做出的：", "C": "心臟健康是 Marie Maynard Daly 重要發現的主題：", "D": "Marie Maynard Daly 在心臟健康方面有重要的發現："}, "answer": "D", "expl": "The modifier \"Trained as a chemist\" describes Marie Maynard Daly, so she must be the subject.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "Unlike most early American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=aviators\" target=\"_blank\" rel=\"noopener\">aviators<\/a>, _______ she had to travel to France to earn her pilot&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=license\" target=\"_blank\" rel=\"noopener\">license<\/a> in 1921.", "bodyPlain": "Unlike most early American aviators, _______ she had to travel to France to earn her pilot's license in 1921.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "與大多數早期美國飛行員不同，_______ 她必須前往法國，才能在 1921 年取得飛行執照。", "opts": {"A": "Bessie Coleman could not find a flight school in the United States that would accept her:", "B": "a pilot's license was not available to Bessie Coleman in the United States:", "C": "the United States did not allow Bessie Coleman to train as a pilot:", "D": "flight schools in the United States would not accept Bessie Coleman:"}, "optsZh": {"A": "Bessie Coleman 在美國找不到願意收她的飛行學校：", "B": "Bessie Coleman 在美國無法取得飛行執照：", "C": "美國不允許 Bessie Coleman 接受飛行訓練：", "D": "美國的飛行學校不願收 Bessie Coleman："}, "answer": "A", "expl": "\"Unlike most early aviators\" must modify Bessie Coleman, so she must follow the comma.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "Born in a small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=village\" target=\"_blank\" rel=\"noopener\">village<\/a> in Kenya, _______ she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=founded\" target=\"_blank\" rel=\"noopener\">founded<\/a> the Green Belt Movement, which has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=planted\" target=\"_blank\" rel=\"noopener\">planted<\/a> more than 50 million trees.", "bodyPlain": "Born in a small village in Kenya, _______ she founded the Green Belt Movement, which has planted more than 50 million trees.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "出生於肯亞一個小村莊的 _______ 她創立了綠帶運動，至今已種植超過五千萬棵樹。", "opts": {"A": "there was environmental activism throughout Wangari Maathai's life:", "B": "the life's work of Wangari Maathai was environmental activism:", "C": "Wangari Maathai devoted her life to environmental activism:", "D": "environmental activism became the life's work of Wangari Maathai:"}, "optsZh": {"A": "Wangari Maathai 的一生中都有環境運動：", "B": "Wangari Maathai 畢生的志業是環境運動：", "C": "Wangari Maathai 畢生致力於環境運動：", "D": "環境運動成為 Wangari Maathai 畢生的志業："}, "answer": "C", "expl": "The modifier \"Born in a small village in Kenya\" must describe Wangari Maathai, the subject.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Standard English Conventions (Modifiers): place the person being described right after an introductory modifier.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=self-taught\" target=\"_blank\" rel=\"noopener\">self-taught<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=engineer\" target=\"_blank\" rel=\"noopener\">engineer<\/a> from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> China, _______ he built a chariot with gears that kept a small figure always pointing south.", "bodyPlain": "A self-taught engineer from ancient China, _______ he built a chariot with gears that kept a small figure always pointing south.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "身為古代中國一位自學成才的工程師，_______ 他打造了一輛有齒輪的車，能讓車上的小人像始終指向南方。", "opts": {"A": "the machines of Ma Jun were very clever:", "B": "Ma Jun designed many clever machines:", "C": "many clever machines were designed by Ma Jun:", "D": "there were many clever machines designed by Ma Jun:"}, "optsZh": {"A": "馬鈞的機械非常精巧：", "B": "馬鈞設計了許多精巧的機械：", "C": "許多精巧的機械是由馬鈞設計的：", "D": "有許多精巧的機械是由馬鈞設計的："}, "answer": "B", "expl": "\"A self-taught engineer\" describes Ma Jun, so his name must come directly after the comma.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "Astronaut William Anders was a member of the Apollo 8 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mission\" target=\"_blank\" rel=\"noopener\">mission<\/a>, the first human <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spaceflight\" target=\"_blank\" rel=\"noopener\">spaceflight<\/a> to reach the Moon and orbit it. During the mission, Anders took a photo of Earth rising above the lunar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>, an _______ was later named Earthrise.", "bodyPlain": "Astronaut William Anders was a member of the Apollo 8 mission, the first human spaceflight to reach the Moon and orbit it. During the mission, Anders took a photo of Earth rising above the lunar surface, an _______ was later named Earthrise.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "太空人 William Anders 是阿波羅 8 號任務的成員，這是人類首次飛抵月球並繞行月球的太空飛行。任務期間，Anders 拍下了地球從月球表面升起的照片，一張 _______ 後來被命名為《地出》。", "opts": {"A": "image, that", "B": "image", "C": "image that", "D": "image,"}, "optsZh": {"A": "image, that（逗號＋that）", "B": "image（無標點）", "C": "image that（無逗號＋that）", "D": "image,（逗號）"}, "answer": "C", "expl": "'That was later named Earthrise' is an essential clause identifying the image, so no comma comes before 'that.'", "explZh": "「that was later named Earthrise」是限定子句，說明是哪張照片，所以 that 前面不加逗號。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "In 1888, Louis Le Prince filmed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=two-second\" target=\"_blank\" rel=\"noopener\">two-second<\/a> scene of people <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=walking\" target=\"_blank\" rel=\"noopener\">walking<\/a> in a garden in Leeds, a short _______ is now considered the oldest <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">surviving<\/a> motion picture.", "bodyPlain": "In 1888, Louis Le Prince filmed a two-second scene of people walking in a garden in Leeds, a short _______ is now considered the oldest surviving motion picture.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1888 年，Louis Le Prince 拍攝了一段兩秒鐘、人們在里茲一座花園中散步的畫面，這段短 _______ 如今被認為是現存最古老的電影。", "opts": {"A": "clip", "B": "clip,", "C": "clip that", "D": "clip, that"}, "optsZh": {"A": "clip（無標點）", "B": "clip,（逗號）", "C": "clip that（無逗號＋that）", "D": "clip, that（逗號＋that）"}, "answer": "C", "expl": "\"that later became famous\" is essential and begins with \"that,\" so no comma is used.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "Chemist Stephanie Kwolek was trying to create a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=lightweight\" target=\"_blank\" rel=\"noopener\">lightweight<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=material\" target=\"_blank\" rel=\"noopener\">material<\/a> for car tires when she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discovered\" target=\"_blank\" rel=\"noopener\">discovered<\/a> a strong _______ is now used in bulletproof vests: Kevlar.", "bodyPlain": "Chemist Stephanie Kwolek was trying to create a lightweight material for car tires when she discovered a strong _______ is now used in bulletproof vests: Kevlar.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "化學家 Stephanie Kwolek 在嘗試為汽車輪胎研發輕量材料時，發現了一種堅固的 _______ 如今被用於防彈背心：克維拉纖維。", "opts": {"A": "fiber, that", "B": "fiber,", "C": "fiber", "D": "fiber that"}, "optsZh": {"A": "fiber, that（逗號＋that）", "B": "fiber,（逗號）", "C": "fiber（無標點）", "D": "fiber that（無逗號＋that）"}, "answer": "D", "expl": "A restrictive \"that\" clause follows its noun directly, with no comma.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "In 1847, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomer\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomer\" data-pos=\"n.\" data-en=\"a scientist who studies stars and planets\" data-zh=\"天文學家\">astronomer<\/a> Maria Mitchell <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spotted\" target=\"_blank\" rel=\"noopener\">spotted<\/a> a faint _______ was later named &quot;Miss Mitchell&#x27;s Comet&quot; in her honor.", "bodyPlain": "In 1847, astronomer Maria Mitchell spotted a faint _______ was later named \"Miss Mitchell's Comet\" in her honor.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1847 年，天文學家 Maria Mitchell 發現了一顆暗淡的 _______ 後來為了紀念她而被命名為「米切爾小姐彗星」。", "opts": {"A": "comet", "B": "comet, that", "C": "comet,", "D": "comet that"}, "optsZh": {"A": "comet（無標點）", "B": "comet, that（逗號＋that）", "C": "comet,（逗號）", "D": "comet that（無逗號＋that）"}, "answer": "D", "expl": "\"that she later named...\" identifies which comet, so no comma comes before \"that.\"", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "Archaeologists in Egypt <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncovered\" target=\"_blank\" rel=\"noopener\">uncovered<\/a> a 4,500-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=year-old\" target=\"_blank\" rel=\"noopener\">year-old<\/a> _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> the oldest known written records of building the Great Pyramid.", "bodyPlain": "Archaeologists in Egypt uncovered a 4,500-year-old _______ contains the oldest known written records of building the Great Pyramid.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "埃及的考古學家發掘出一份四千五百年前的 _______ 包含已知最古老、關於建造大金字塔的文字紀錄。", "opts": {"A": "papyrus, that", "B": "papyrus,", "C": "papyrus", "D": "papyrus that"}, "optsZh": {"A": "papyrus, that（逗號＋that）", "B": "papyrus,（逗號）", "C": "papyrus（無標點）", "D": "papyrus that（無逗號＋that）"}, "answer": "D", "expl": "The \"that\" clause is essential and needs \"that\" to work; no comma is used.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English Conventions (Boundaries): no comma before an essential (restrictive) \"that\" clause.", "vocab": false, "body": "Engineer Hedy Lamarr <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=co-invented\" target=\"_blank\" rel=\"noopener\">co-invented<\/a> a radio _______ helped make modern Wi-Fi and Bluetooth possible.", "bodyPlain": "Engineer Hedy Lamarr co-invented a radio _______ helped make modern Wi-Fi and Bluetooth possible.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "工程師 Hedy Lamarr 共同發明了一種無線電 _______ 幫助促成了現代 Wi-Fi 與藍牙技術。", "opts": {"A": "system that", "B": "system", "C": "system, that", "D": "system,"}, "optsZh": {"A": "system that（無逗號＋that）", "B": "system（無標點）", "C": "system, that（逗號＋that）", "D": "system,（逗號）"}, "answer": "A", "expl": "No comma before a restrictive \"that\" clause; the clause needs \"that\" as its subject.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "French <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=philosopher\" target=\"_blank\" rel=\"noopener\" data-w=\"philosopher\" data-pos=\"n.\" data-en=\"a person who studies ideas about knowledge, truth, and life\" data-zh=\"哲學家\">philosopher<\/a> Denis Diderot was the chief editor of the Encyclopédie, which was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=completed\" target=\"_blank\" rel=\"noopener\">completed<\/a> by 1772. Motivated by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=principle\" target=\"_blank\" rel=\"noopener\" data-w=\"principle\" data-pos=\"n.\" data-en=\"a basic rule or belief that guides behavior\" data-zh=\"原則\">principles<\/a> of the Enlightenment, the writers of the Encyclopédie _______ to compile all of the world’s knowledge in a single resource available to the ordinary person.", "bodyPlain": "French philosopher Denis Diderot was the chief editor of the Encyclopédie, which was completed by 1772. Motivated by the principles of the Enlightenment, the writers of the Encyclopédie _______ to compile all of the world’s knowledge in a single resource available to the ordinary person.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "法國哲學家 Denis Diderot 是《百科全書》的主編，這部書在 1772 年前完成。受到啟蒙運動原則的激勵，《百科全書》的作者們 _______ 將世界上所有的知識彙編成一套一般人都能使用的資源。", "opts": {"A": "attempted", "B": "are attempting", "C": "will attempt", "D": "attempt"}, "optsZh": {"A": "嘗試了（過去式）", "B": "正在嘗試（現在進行式）", "C": "將會嘗試（未來式）", "D": "嘗試（原形）"}, "answer": "A", "expl": "The Encyclopédie was completed by 1772, a finished past event, so the past tense 'attempted' fits.", "explZh": "《百科全書》在 1772 年前完成，是過去已完成的事，所以用過去式 attempted。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "Gustave Eiffel&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> built the Eiffel Tower for the 1889 World&#x27;s Fair in Paris. Engineers Maurice Koechlin and Émile Nouguier _______ the tower&#x27;s basic shape in 1884.", "bodyPlain": "Gustave Eiffel's company built the Eiffel Tower for the 1889 World's Fair in Paris. Engineers Maurice Koechlin and Émile Nouguier _______ the tower's basic shape in 1884.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "Gustave Eiffel 的公司為 1889 年巴黎世界博覽會建造了艾菲爾鐵塔。工程師 Maurice Koechlin 和 Émile Nouguier 於 1884 年 _______ 了鐵塔的基本造型。", "opts": {"A": "designed", "B": "design", "C": "are designing", "D": "will design"}, "optsZh": {"A": "設計了（過去式）", "B": "設計（原形）", "C": "正在設計（現在進行式）", "D": "將會設計（未來式）"}, "answer": "A", "expl": "The building was completed in 1889, a finished past event, so past tense \"designed\" fits.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "Ferdinand Magellan&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expedition\" target=\"_blank\" rel=\"noopener\">expedition<\/a> set sail from Spain in 1519 with five ships. Only one ship, the Victoria, _______ the first trip around the world when it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=returned\" target=\"_blank\" rel=\"noopener\">returned<\/a> in 1522.", "bodyPlain": "Ferdinand Magellan's expedition set sail from Spain in 1519 with five ships. Only one ship, the Victoria, _______ the first trip around the world when it returned in 1522.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "麥哲倫的探險隊於 1519 年率五艘船從西班牙啟航。只有一艘船——維多利亞號——在 1522 年返航時，_______ 了第一次環球航行。", "opts": {"A": "completes", "B": "is completing", "C": "completed", "D": "will complete"}, "optsZh": {"A": "完成（第三人稱單數）", "B": "正在完成（現在進行式）", "C": "完成了（過去式）", "D": "將會完成（未來式）"}, "answer": "C", "expl": "The voyage ended in 1522, so the simple past \"completed\" is correct.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "On July 20, 1969, the Apollo 11 lunar module landed on the Moon. A few hours later, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronaut\" target=\"_blank\" rel=\"noopener\" data-w=\"astronaut\" data-pos=\"n.\" data-en=\"a person trained to travel into space\" data-zh=\"太空人\">astronauts<\/a> Neil Armstrong and Buzz Aldrin _______ on its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> for the first time.", "bodyPlain": "On July 20, 1969, the Apollo 11 lunar module landed on the Moon. A few hours later, astronauts Neil Armstrong and Buzz Aldrin _______ on its surface for the first time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1969 年 7 月 20 日，阿波羅 11 號登月艙降落在月球上。幾小時後，太空人 Neil Armstrong 和 Buzz Aldrin 首次在月球表面 _______。", "opts": {"A": "are walking", "B": "walk", "C": "walked", "D": "will walk"}, "optsZh": {"A": "正在行走（現在進行式）", "B": "行走（原形）", "C": "行走了（過去式）", "D": "將會行走（未來式）"}, "answer": "C", "expl": "The text describes events of 1969, so the past tense \"walked\" is needed.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "James Watson and Francis Crick built their famous model of DNA using X-ray <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> made by Rosalind Franklin. In 1953, they _______ their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=description\" target=\"_blank\" rel=\"noopener\">description<\/a> of the double helix in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=journal\" target=\"_blank\" rel=\"noopener\">journal<\/a> Nature.", "bodyPlain": "James Watson and Francis Crick built their famous model of DNA using X-ray images made by Rosalind Franklin. In 1953, they _______ their description of the double helix in the journal Nature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "James Watson 和 Francis Crick 利用 Rosalind Franklin 拍攝的 X 光影像，建立了他們著名的 DNA 模型。1953 年，他們在《自然》期刊上 _______ 了對雙螺旋結構的描述。", "opts": {"A": "will publish", "B": "are publishing", "C": "publish", "D": "published"}, "optsZh": {"A": "將會發表（未來式）", "B": "正在發表（現在進行式）", "C": "發表（原形）", "D": "發表了（過去式）"}, "answer": "D", "expl": "\"In 1953\" signals a completed past action, so \"published\" is correct.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English Conventions: use the simple past tense for a completed past event.", "vocab": false, "body": "Murasaki Shikibu lived in Japan about a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousand<\/a> years ago and wrote The Tale of Genji, often called the world&#x27;s first novel. In her diary, she also _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detailed<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> of life at the royal court.", "bodyPlain": "Murasaki Shikibu lived in Japan about a thousand years ago and wrote The Tale of Genji, often called the world's first novel. In her diary, she also _______ detailed observations of life at the royal court.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "紫式部生活在大約一千年前的日本，著有常被稱為世界第一部小說的《源氏物語》。她也在日記中 _______ 了對宮廷生活的詳細觀察。", "opts": {"A": "recorded", "B": "is recording", "C": "records", "D": "will record"}, "optsZh": {"A": "記錄了（過去式）", "B": "正在記錄（現在進行式）", "C": "記錄（第三人稱單數）", "D": "將會記錄（未來式）"}, "answer": "A", "expl": "The surrounding verbs (\"lived,\" \"wrote\") are past tense and the event is finished, so \"recorded\" fits.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "As one of the most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prominent\" target=\"_blank\" rel=\"noopener\" data-w=\"prominent\" data-pos=\"adj.\" data-en=\"important and easy to notice\" data-zh=\"突出的；顯著的\">prominent<\/a> French <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrophysicists\" target=\"_blank\" rel=\"noopener\">astrophysicists<\/a>, Françoise Combes has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contributed\" target=\"_blank\" rel=\"noopener\">contributed<\/a> to research about how galaxies form and _______ she has studied the composition of galaxies and how they interact with each other.", "bodyPlain": "As one of the most prominent French astrophysicists, Françoise Combes has contributed to research about how galaxies form and _______ she has studied the composition of galaxies and how they interact with each other.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "身為法國最傑出的天文物理學家之一，Françoise Combes 對星系如何形成與 _______ 的研究有所貢獻，她也研究星系的組成以及星系之間如何相互作用。", "opts": {"A": "evolve; additionally,", "B": "evolve additionally", "C": "evolve, additionally,", "D": "evolve, additionally;"}, "optsZh": {"A": "evolve; additionally,（分號、逗號）", "B": "evolve additionally（無標點）", "C": "evolve, additionally,（逗號、逗號）", "D": "evolve, additionally;（逗號、分號）"}, "answer": "A", "expl": "Two independent clauses are joined by a semicolon before the conjunctive adverb 'additionally,' which is followed by a comma.", "explZh": "兩個獨立子句用分號連接，連接副詞 additionally 放在分號後，後面加逗號。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "Biologist Jane Goodall spent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decades\" target=\"_blank\" rel=\"noopener\">decades<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studying\" target=\"_blank\" rel=\"noopener\">studying<\/a> chimpanzees in Tanzania&#x27;s Gombe forest and discovered that they make _______ she showed that chimpanzees have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinct\" target=\"_blank\" rel=\"noopener\" data-w=\"distinct\" data-pos=\"adj.\" data-en=\"clearly different or separate\" data-zh=\"不同的；明顯的\">distinct<\/a> personalities.", "bodyPlain": "Biologist Jane Goodall spent decades studying chimpanzees in Tanzania's Gombe forest and discovered that they make _______ she showed that chimpanzees have distinct personalities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "生物學家 Jane Goodall 花了數十年在坦尚尼亞的貢貝森林研究黑猩猩，發現牠們會製作 _______ 她證明了黑猩猩有各自不同的個性。", "opts": {"A": "tools, moreover,", "B": "tools; moreover,", "C": "tools, moreover;", "D": "tools moreover"}, "optsZh": {"A": "tools, moreover,（逗號、逗號）", "B": "tools; moreover,（分號、逗號）", "C": "tools, moreover;（逗號、分號）", "D": "tools moreover（無標點）"}, "answer": "B", "expl": "Two complete sentences are joined by a semicolon before \"moreover,\" which is followed by a comma.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "The Atacama Desert in Chile is one of the driest places on Earth, with some areas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=receiving\" target=\"_blank\" rel=\"noopener\">receiving<\/a> almost no _______ more than a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=million\" target=\"_blank\" rel=\"noopener\">million<\/a> people live in the region.", "bodyPlain": "The Atacama Desert in Chile is one of the driest places on Earth, with some areas receiving almost no _______ more than a million people live in the region.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "智利的阿塔卡馬沙漠是地球上最乾燥的地方之一，有些地區幾乎沒有 _______ 該地區住著超過一百萬人。", "opts": {"A": "rain, however;", "B": "rain; however,", "C": "rain however", "D": "rain, however,"}, "optsZh": {"A": "rain, however;（逗號、分號）", "B": "rain; however,（分號、逗號）", "C": "rain however（無標點）", "D": "rain, however,（逗號、逗號）"}, "answer": "B", "expl": "The semicolon separates the two independent clauses; a comma follows \"however.\"", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "Honeybees <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pollinate\" target=\"_blank\" rel=\"noopener\">pollinate<\/a> about one-third of the crops that people _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decline\" target=\"_blank\" rel=\"noopener\" data-w=\"decline\" data-pos=\"n.\" data-en=\"a decrease in amount or quality\" data-zh=\"減少；衰退\">decline<\/a> of bee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> worries many farmers.", "bodyPlain": "Honeybees pollinate about one-third of the crops that people _______ the decline of bee populations worries many farmers.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "蜜蜂為人類所 _______ 的作物中約三分之一授粉；蜜蜂數量下降讓許多農民憂心。", "opts": {"A": "eat, therefore,", "B": "eat, therefore;", "C": "eat therefore", "D": "eat; therefore,"}, "optsZh": {"A": "eat, therefore,（逗號、逗號）", "B": "eat, therefore;（逗號、分號）", "C": "eat therefore（無標點）", "D": "eat; therefore,（分號、逗號）"}, "answer": "D", "expl": "A semicolon joins the clauses; \"therefore\" takes a comma after it.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musical\" target=\"_blank\" rel=\"noopener\" data-w=\"musical\" data-pos=\"n.\" data-en=\"a play or film in which singing and dancing tell the story\" data-zh=\"音樂劇\">musical<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> are made from unexpected _______ the Paraguayan Landfill Harmonic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestra\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestra\" data-pos=\"n.\" data-en=\"a large group of musicians who play different instruments together\" data-zh=\"管弦樂團\">orchestra<\/a> plays violins built from old oil cans and forks.", "bodyPlain": "Some musical instruments are made from unexpected _______ the Paraguayan Landfill Harmonic orchestra plays violins built from old oil cans and forks.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "有些樂器是用意想不到的 _______ 巴拉圭的垃圾場交響樂團演奏用舊油桶和叉子做成的小提琴。", "opts": {"A": "materials; for example,", "B": "materials, for example,", "C": "materials for example", "D": "materials, for example;"}, "optsZh": {"A": "materials; for example,（分號、逗號）", "B": "materials, for example,（逗號、逗號）", "C": "materials for example（無標點）", "D": "materials, for example;（逗號、分號）"}, "answer": "A", "expl": "Two independent clauses need a semicolon before the conjunctive adverb \"for example.\"", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English Conventions (Boundaries): join two independent clauses with a semicolon before a conjunctive adverb.", "vocab": false, "body": "Physicist Chien-Shiung Wu <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disprove\" target=\"_blank\" rel=\"noopener\" data-w=\"disprove\" data-pos=\"v.\" data-en=\"to show that something is false\" data-zh=\"證明…是錯的\">disproved<\/a> a basic law of physics known as the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> of _______ she helped <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> methods for enriching uranium.", "bodyPlain": "Physicist Chien-Shiung Wu disproved a basic law of physics known as the conservation of _______ she helped develop methods for enriching uranium.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "物理學家吳健雄推翻了一條稱為宇稱 _______ 的物理基本定律；她也協助開發了濃縮鈾的方法。", "opts": {"A": "parity, in addition;", "B": "parity in addition", "C": "parity; in addition,", "D": "parity, in addition,"}, "optsZh": {"A": "parity, in addition;（逗號、分號）", "B": "parity in addition（無標點）", "C": "parity; in addition,（分號、逗號）", "D": "parity, in addition,（逗號、逗號）"}, "answer": "C", "expl": "Semicolon between the clauses, then \"in addition\" followed by a comma.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "American avant-garde jazz <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a> and guitarist Mary Halvorson’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musical\" target=\"_blank\" rel=\"noopener\" data-w=\"musical\" data-pos=\"n.\" data-en=\"a play or film in which singing and dancing tell the story\" data-zh=\"音樂劇\">musical<\/a> discography includes Dragon’s Head, an album created with bassist John Hébert and drummer Ches _______ a solo album; and Away with You, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feature\" target=\"_blank\" rel=\"noopener\" data-w=\"feature\" data-pos=\"v.\" data-en=\"to include something as an important part\" data-zh=\"以…為特色；包含\">featured<\/a> pedal steel player Susan Alcorn, cellist Tomeka Reid, and saxophonist Ingrid Laubrock.", "bodyPlain": "American avant-garde jazz composer and guitarist Mary Halvorson’s musical discography includes Dragon’s Head, an album created with bassist John Hébert and drummer Ches _______ a solo album; and Away with You, which featured pedal steel player Susan Alcorn, cellist Tomeka Reid, and saxophonist Ingrid Laubrock.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "美國前衛爵士作曲家暨吉他手 Mary Halvorson 的音樂作品包括：《Dragon's Head》，與貝斯手 John Hébert 和鼓手 Ches _______ 一張個人專輯；以及《Away with You》，由踏板鋼棒吉他手 Susan Alcorn、大提琴手 Tomeka Reid 和薩克斯風手 Ingrid Laubrock 參與演出。", "opts": {"A": "Smith; Meltframe,", "B": "Smith; Meltframe", "C": "Smith, Meltframe,", "D": "Smith, Meltframe:"}, "optsZh": {"A": "Smith; Meltframe,（分號、逗號）", "B": "Smith; Meltframe（分號、無標點）", "C": "Smith, Meltframe,（逗號、逗號）", "D": "Smith, Meltframe:（逗號、冒號）"}, "answer": "A", "expl": "The list items contain internal commas, so semicolons separate the items, and a comma follows 'Meltframe' before its description. (The original key listed C.)", "explZh": "清單項目本身含有逗號，所以項目之間用分號分隔，而 Meltframe 與其說明之間用逗號。（原答案列為 C，已修正為 A。）"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "Musician Esperanza Spalding&#x27;s albums include Emily&#x27;s D+Evolution, which was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> with Tony _______ a live <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recording<\/a>; and Songwrights Apothecary Lab, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explore\" target=\"_blank\" rel=\"noopener\" data-w=\"explore\" data-pos=\"v.\" data-en=\"to examine or discuss a subject in detail\" data-zh=\"探索；探討\">explores<\/a> music as healing.", "bodyPlain": "Musician Esperanza Spalding's albums include Emily's D+Evolution, which was produced with Tony _______ a live recording; and Songwrights Apothecary Lab, which explores music as healing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "音樂家 Esperanza Spalding 的專輯包括：與 Tony _______ 一張現場錄音專輯；以及探索音樂療癒的《Songwrights Apothecary Lab》。", "opts": {"A": "Visconti, Live at the Wiltern,", "B": "Visconti; Live at the Wiltern", "C": "Visconti; Live at the Wiltern,", "D": "Visconti, Live at the Wiltern:"}, "optsZh": {"A": "Visconti, Live at the Wiltern,（逗號、逗號）", "B": "Visconti; Live at the Wiltern（分號、無標點）", "C": "Visconti; Live at the Wiltern,（分號、逗號）", "D": "Visconti, Live at the Wiltern:（逗號、冒號）"}, "answer": "C", "expl": "Because items include internal commas, semicolons separate the items: \"...Vincent; Night Shift, ...\"", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "The tour <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visited<\/a> three cities in Morocco: Fez, known for its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> _______ a desert city famous for its red walls; and Chefchaouen, where nearly every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=building\" target=\"_blank\" rel=\"noopener\">building<\/a> is painted blue.", "bodyPlain": "The tour visited three cities in Morocco: Fez, known for its ancient _______ a desert city famous for its red walls; and Chefchaouen, where nearly every building is painted blue.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這趟旅程造訪了摩洛哥的三座城市：以古老 _______ 一座以紅色城牆聞名的沙漠城市；以及幾乎每棟建築都漆成藍色的舍夫沙萬。", "opts": {"A": "medina, Marrakesh:", "B": "medina, Marrakesh,", "C": "medina; Marrakesh,", "D": "medina; Marrakesh"}, "optsZh": {"A": "medina, Marrakesh:（逗號、冒號）", "B": "medina, Marrakesh,（逗號、逗號）", "C": "medina; Marrakesh,（分號、逗號）", "D": "medina; Marrakesh（分號、無標點）"}, "answer": "C", "expl": "Semicolons separate items in a complex list; a comma sets off the description \"a desert city.\"", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "Author Jhumpa Lahiri&#x27;s books include Interpreter of Maladies, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> that won the Pulitzer _______ a novel; and In Other Words, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoir<\/a> written in Italian.", "bodyPlain": "Author Jhumpa Lahiri's books include Interpreter of Maladies, a story collection that won the Pulitzer _______ a novel; and In Other Words, a memoir written in Italian.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "作家 Jhumpa Lahiri 的作品包括：《疾病解說者》，一本贏得普立茲 _______ 一部長篇小說；以及《In Other Words》，一本以義大利文寫成的回憶錄。", "opts": {"A": "Prize; The Lowland,", "B": "Prize; The Lowland", "C": "Prize, The Lowland,", "D": "Prize, The Lowland:"}, "optsZh": {"A": "Prize; The Lowland,（分號、逗號）", "B": "Prize; The Lowland（分號、無標點）", "C": "Prize, The Lowland,（逗號、逗號）", "D": "Prize, The Lowland:（逗號、冒號）"}, "answer": "A", "expl": "The list items contain commas, so semicolons separate them, and a comma follows \"Rome\" before its description.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibit\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibit\" data-pos=\"v.\" data-en=\"to show something publicly, especially in a museum\" data-zh=\"展出；展示\">exhibit<\/a> honors three scientists: Lise Meitner, who helped explain nuclear _______ a two-time Nobel Prize winner; and Rosalind Franklin, whose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\"
