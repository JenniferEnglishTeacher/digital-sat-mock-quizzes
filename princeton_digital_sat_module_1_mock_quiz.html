data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> DNA&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>.", "bodyPlain": "The exhibit honors three scientists: Lise Meitner, who helped explain nuclear _______ a two-time Nobel Prize winner; and Rosalind Franklin, whose images revealed DNA's structure.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這場展覽表彰三位科學家：協助解釋核 _______ 兩度獲得諾貝爾獎；以及 Rosalind Franklin，她的影像揭示了 DNA 的結構。", "opts": {"A": "fission; Marie Curie", "B": "fission, Marie Curie,", "C": "fission, Marie Curie:", "D": "fission; Marie Curie,"}, "optsZh": {"A": "fission; Marie Curie（分號、無標點）", "B": "fission, Marie Curie,（逗號、逗號）", "C": "fission, Marie Curie:（逗號、冒號）", "D": "fission; Marie Curie,（分號、逗號）"}, "answer": "D", "expl": "Use a semicolon between list items and a comma between \"Curie\" and her description.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English Conventions (Boundaries): use semicolons to separate list items that already contain commas.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=marathon\" target=\"_blank\" rel=\"noopener\">marathon<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=champion\" target=\"_blank\" rel=\"noopener\">champion<\/a> trained in three places: Iten, a high-altitude town in western _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=capital\" target=\"_blank\" rel=\"noopener\" data-w=\"capital\" data-pos=\"n.\" data-en=\"the city where a country&#x27;s government is\" data-zh=\"首都\">capital<\/a>; and Boulder, Colorado, where she spent each summer.", "bodyPlain": "The marathon champion trained in three places: Iten, a high-altitude town in western _______ the capital; and Boulder, Colorado, where she spent each summer.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這位馬拉松冠軍在三個地方訓練：伊滕，西部 _______ 首都；以及她每年夏天都會去的科羅拉多州博爾德。", "opts": {"A": "Kenya, Nairobi:", "B": "Kenya; Nairobi", "C": "Kenya; Nairobi,", "D": "Kenya, Nairobi,"}, "optsZh": {"A": "Kenya, Nairobi:（逗號、冒號）", "B": "Kenya; Nairobi（分號、無標點）", "C": "Kenya; Nairobi,（分號、逗號）", "D": "Kenya, Nairobi,（逗號、逗號）"}, "answer": "C", "expl": "A semicolon separates the first and second items; a comma separates \"Nairobi\" from its description.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "Mice were studied in an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> focused on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between room <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> and cancer growth. Cooler room temperatures were found to stimulate fat cells that eradicate the sugar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> that sustain cancer cells. _______ the cancer cells started to die off in the mice exposed to cooler room temperatures.", "bodyPlain": "Mice were studied in an experiment focused on the relationship between room temperature and cancer growth. Cooler room temperatures were found to stimulate fat cells that eradicate the sugar molecules that sustain cancer cells. _______ the cancer cells started to die off in the mice exposed to cooler room temperatures.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "一項實驗以小鼠為對象，研究室溫與癌症生長之間的關係。研究發現，較低的室溫會刺激脂肪細胞，消耗掉維持癌細胞生存的糖分子。_______ 暴露在較低室溫下的小鼠體內，癌細胞開始死亡。", "opts": {"A": "Consequently,", "B": "For example,", "C": "However,", "D": "In comparison,"}, "optsZh": {"A": "因此，", "B": "例如，", "C": "然而，", "D": "相較之下，"}, "answer": "A", "expl": "Cooler temperatures removed the cancer cells' fuel, so their dying off is a result: 'Consequently.'", "explZh": "低溫消耗了癌細胞的養分，所以癌細胞死亡是結果，用 Consequently。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "In 1912, a dam was built across the Elwha River in Washington State, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=blocking\" target=\"_blank\" rel=\"noopener\">blocking<\/a> salmon from reaching their spawning grounds upstream. _______ the river&#x27;s salmon <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> fell by more than 90 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a>.", "bodyPlain": "In 1912, a dam was built across the Elwha River in Washington State, blocking salmon from reaching their spawning grounds upstream. _______ the river's salmon population fell by more than 90 percent.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1912 年，華盛頓州的艾爾瓦河上建了一座水壩，阻擋鮭魚游到上游的產卵地。_______ 這條河的鮭魚數量減少了 90% 以上。", "opts": {"A": "However,", "B": "In comparison,", "C": "For example,", "D": "Consequently,"}, "optsZh": {"A": "然而，", "B": "相較之下，", "C": "例如，", "D": "因此，"}, "answer": "D", "expl": "The dam blocked the salmon's route, which caused their numbers to fall: a result.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "By the 1930s, gray wolves had been hunted out of Yellowstone National Park. With no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=control\" target=\"_blank\" rel=\"noopener\">control<\/a> them, elk herds grew <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rapidly\" target=\"_blank\" rel=\"noopener\">rapidly<\/a>. _______ the elk ate so many young willow trees that riverbanks began to erode.", "bodyPlain": "By the 1930s, gray wolves had been hunted out of Yellowstone National Park. With no predators to control them, elk herds grew rapidly. _______ the elk ate so many young willow trees that riverbanks began to erode.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "到了 1930 年代，灰狼已在黃石國家公園被獵殺殆盡。沒有掠食者控制，麋鹿群數量迅速增加。_______ 麋鹿吃掉太多柳樹幼苗，導致河岸開始受到侵蝕。", "opts": {"A": "Similarly,", "B": "For instance,", "C": "Nevertheless,", "D": "As a result,"}, "optsZh": {"A": "同樣地，", "B": "舉例來說，", "C": "儘管如此，", "D": "因此，"}, "answer": "D", "expl": "Losing the wolves led to too many elk: a consequence.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "Monarch <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=caterpillars\" target=\"_blank\" rel=\"noopener\">caterpillars<\/a> feed only on milkweed, a plant that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> bitter toxins. The toxins remain in the butterflies&#x27; bodies after they mature. _______ most birds avoid eating <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=monarch\" target=\"_blank\" rel=\"noopener\" data-w=\"monarch\" data-pos=\"n.\" data-en=\"a king or queen\" data-zh=\"君主\">monarchs<\/a>.", "bodyPlain": "Monarch caterpillars feed only on milkweed, a plant that contains bitter toxins. The toxins remain in the butterflies' bodies after they mature. _______ most birds avoid eating monarchs.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "帝王斑蝶的幼蟲只吃乳草，這是一種含有苦味毒素的植物。這些毒素在蝴蝶成熟後仍留在牠們體內。_______ 大多數鳥類都避免吃帝王斑蝶。", "opts": {"A": "Meanwhile,", "B": "In contrast,", "C": "Therefore,", "D": "For example,"}, "optsZh": {"A": "與此同時，", "B": "相反地，", "C": "因此，", "D": "例如，"}, "answer": "C", "expl": "The plant's poison is the cause; birds avoiding the butterflies is the result.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "More than a meter of snow fell on the city in a single night, and many roads were buried. _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=schools\" target=\"_blank\" rel=\"noopener\">schools<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=offices\" target=\"_blank\" rel=\"noopener\">offices<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remained\" target=\"_blank\" rel=\"noopener\">remained<\/a> closed for three days.", "bodyPlain": "More than a meter of snow fell on the city in a single night, and many roads were buried. _______ schools and offices remained closed for three days.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "一夜之間，城市降下超過一公尺的雪，許多道路都被掩埋。_______ 學校和辦公室停課停班了三天。", "opts": {"A": "Still,", "B": "Similarly,", "C": "Consequently,", "D": "Specifically,"}, "optsZh": {"A": "儘管如此，", "B": "同樣地，", "C": "因此，", "D": "具體來說，"}, "answer": "C", "expl": "The heavy snow caused the closures: a result.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Transitions: choose a transition that shows a result or consequence.", "vocab": false, "body": "Farmers in the region began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rotating\" target=\"_blank\" rel=\"noopener\">rotating<\/a> corn with beans, which return <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nitrogen\" target=\"_blank\" rel=\"noopener\" data-w=\"nitrogen\" data-pos=\"n.\" data-en=\"a chemical element that plants need to grow\" data-zh=\"氮\">nitrogen<\/a> to the soil. _______ corn <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=harvests\" target=\"_blank\" rel=\"noopener\">harvests<\/a> in the area increased by nearly a third within five years.", "bodyPlain": "Farmers in the region began rotating corn with beans, which return nitrogen to the soil. _______ corn harvests in the area increased by nearly a third within five years.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "該地區的農民開始讓玉米與能把氮還給土壤的豆類輪作。_______ 五年內當地的玉米收成增加了將近三分之一。", "opts": {"A": "In other words,", "B": "As a result,", "C": "For example,", "D": "However,"}, "optsZh": {"A": "換句話說，", "B": "因此，", "C": "例如，", "D": "然而，"}, "answer": "B", "expl": "Crop rotation restored the soil, which led to higher yields: a result.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>Satyajit Ray was an Indian filmmaker.<br>He is well-known for The Apu Trilogy.<br>The first film in the trilogy, Pather Panchali, is about the childhood of a small Bengali boy named Apu.<br>The second film, Aparajito, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=depict\" target=\"_blank\" rel=\"noopener\" data-w=\"depict\" data-pos=\"v.\" data-en=\"to show in a picture or describe\" data-zh=\"描繪\">depicts<\/a> Apu in his adolescence and his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> to both his mother and their home.<br>In Apur Sansar, the third film, adult Apu marries Aparna and has a son, Kajal.", "bodyPlain": "While researching a topic, a student has taken the following notes:\nSatyajit Ray was an Indian filmmaker.\nHe is well-known for The Apu Trilogy.\nThe first film in the trilogy, Pather Panchali, is about the childhood of a small Bengali boy named Apu.\nThe second film, Aparajito, depicts Apu in his adolescence and his relationship to both his mother and their home.\nIn Apur Sansar, the third film, adult Apu marries Aparna and has a son, Kajal.", "stem": "The student wants to emphasize how Apu changed throughout the trilogy. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調阿普在三部曲中的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\nSatyajit Ray 是一位印度電影導演。\n他以《阿普三部曲》聞名。\n三部曲的第一部《大路之歌》講述一個名叫阿普的孟加拉小男孩的童年。\n第二部《大河之歌》描寫阿普的青少年時期，以及他與母親和家的關係。\n在第三部《大樹之歌》中，成年的阿普娶了 Aparna，並生了一個兒子 Kajal。", "opts": {"A": "Apu went from being a child in Pather Panchali to an adult with his own family in Apur Sansar.", "B": "Satyajit Ray, an Indian filmmaker, made The Apu Trilogy about a boy named Apu.", "C": "The three films of The Apu Trilogy are Pather Panchali, Aparajito, and Apur Sansar.", "D": "The character Apu grew up in Bengal and eventually marries and has a son."}, "optsZh": {"A": "阿普從《大路之歌》中的孩子，成長為《大樹之歌》中擁有自己家庭的成年人。", "B": "印度電影導演 Satyajit Ray 拍了關於一個名叫阿普的男孩的《阿普三部曲》。", "C": "《阿普三部曲》的三部電影是《大路之歌》、《大河之歌》和《大樹之歌》。", "D": "角色阿普在孟加拉長大，最後結婚生子。"}, "answer": "A", "expl": "Choice A shows Apu changing from a child in the first film to an adult with a family in the third.", "explZh": "A 呈現阿普從第一部中的孩子變成第三部中有家庭的成年人。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Ursula K. Le Guin wrote the Earthsea series.<br>- In A Wizard of Earthsea, Ged is a proud, reckless young student of magic.<br>- In The Farthest Shore, Ged has become Archmage, the wisest wizard in Earthsea.<br>- The series was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> between 1968 and 2001.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Ursula K. Le Guin wrote the Earthsea series.\n- In A Wizard of Earthsea, Ged is a proud, reckless young student of magic.\n- In The Farthest Shore, Ged has become Archmage, the wisest wizard in Earthsea.\n- The series was published between 1968 and 2001.", "stem": "The student wants to emphasize how Ged changed across the series. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調格得在整個系列中的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- Ursula K.Le Guin 寫了《地海》系列。\n- 在《地海巫師》中，格得是一個驕傲、魯莽的年輕魔法學徒。\n- 在《地海彼岸》中，格得已成為大法師，是地海最有智慧的巫師。\n- 這個系列在 1968 年到 2001 年之間出版。", "opts": {"A": "Ged goes from a proud, reckless student in A Wizard of Earthsea to the wise Archmage in The Farthest Shore.", "B": "Ursula K. Le Guin wrote the Earthsea series between 1968 and 2001.", "C": "A Wizard of Earthsea and The Farthest Shore are both part of the Earthsea series.", "D": "Ged is a character created by Ursula K. Le Guin."}, "optsZh": {"A": "格得從《地海巫師》中驕傲魯莽的學徒，成為《地海彼岸》中睿智的大法師。", "B": "Ursula K. Le Guin 在 1968 年至 2001 年間寫了《地海》系列。", "C": "《地海巫師》與《地海彼岸》都屬於《地海》系列。", "D": "格得是 Ursula K. Le Guin 創造的角色。"}, "answer": "A", "expl": "Choice A traces Ged's change from a reckless boy to a wise archmage.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Ballad of Mulan is a Chinese folk poem.<br>- At the start, Mulan is a young woman <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weaving\" target=\"_blank\" rel=\"noopener\" data-w=\"weaving\" data-pos=\"n.\" data-en=\"the craft of making cloth by crossing threads\" data-zh=\"編織\">weaving<\/a> at home.<br>- She takes her father&#x27;s place in the army.<br>- By the end, she is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> general offered a high government post.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Ballad of Mulan is a Chinese folk poem.\n- At the start, Mulan is a young woman weaving at home.\n- She takes her father's place in the army.\n- By the end, she is a celebrated general offered a high government post.", "stem": "The student wants to emphasize how Mulan changes in the poem. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調木蘭在詩中的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 《木蘭辭》是一首中國民間詩歌。\n- 一開始，木蘭是一個在家織布的年輕女子。\n- 她代替父親從軍。\n- 到了最後，她成為一位受人讚揚、被授予朝廷高官的將軍。", "opts": {"A": "The Ballad of Mulan is a Chinese folk poem about a young woman.", "B": "Mulan takes her father's place in the army.", "C": "Mulan begins the poem weaving at home and ends it as a celebrated general offered a high government post.", "D": "The Ballad of Mulan describes army life in ancient China."}, "optsZh": {"A": "《木蘭辭》是一首關於一位年輕女子的中國民間詩歌。", "B": "木蘭代替父親從軍。", "C": "木蘭在詩的開頭在家織布，到結尾成為一位受人讚揚、被授予朝廷高官的將軍。", "D": "《木蘭辭》描述了古代中國的軍旅生活。"}, "answer": "C", "expl": "Choice C shows Mulan's change from a farm girl to an honored general.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Charles Dickens <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> A Christmas Carol in 1843.<br>- At the beginning, Ebenezer Scrooge is a greedy, cold-hearted businessman.<br>- He is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visited<\/a> by three spirits.<br>- By the end, Scrooge is generous and kind to his employee&#x27;s family.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Charles Dickens published A Christmas Carol in 1843.\n- At the beginning, Ebenezer Scrooge is a greedy, cold-hearted businessman.\n- He is visited by three spirits.\n- By the end, Scrooge is generous and kind to his employee's family.", "stem": "The student wants to emphasize how Scrooge changes during the story. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Scrooge 在故事中的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- Charles Dickens 於 1843 年出版了《小氣財神》。\n- 一開始，Ebenezer Scrooge 是個貪婪、冷酷無情的商人。\n- 有三個幽靈來拜訪他。\n- 到了最後，Scrooge 對員工的家人變得慷慨又親切。", "opts": {"A": "A Christmas Carol was published by Charles Dickens in 1843.", "B": "Scrooge transforms from a greedy, cold-hearted businessman into a generous, kind man.", "C": "In A Christmas Carol, Scrooge is visited by three spirits.", "D": "Charles Dickens wrote about a businessman named Ebenezer Scrooge."}, "optsZh": {"A": "《小氣財神》由 Charles Dickens 於 1843 年出版。", "B": "Scrooge 從一個貪婪、冷酷無情的商人，轉變為慷慨、親切的人。", "C": "在《小氣財神》中，有三個幽靈來拜訪 Scrooge。", "D": "Charles Dickens 寫了一個名叫 Ebenezer Scrooge 的商人。"}, "answer": "B", "expl": "Choice B shows Scrooge's transformation from greedy to generous.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Great Expectations is a novel by Charles Dickens.<br>- At the start, Pip is a poor orphan living with his sister in the marshes.<br>- He receives money from a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mysterious\" target=\"_blank\" rel=\"noopener\" data-w=\"mysterious\" data-pos=\"adj.\" data-en=\"hard to understand or explain\" data-zh=\"神秘的；難以解釋的\">mysterious<\/a> benefactor.<br>- Later, Pip lives as a gentleman in London.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Great Expectations is a novel by Charles Dickens.\n- At the start, Pip is a poor orphan living with his sister in the marshes.\n- He receives money from a mysterious benefactor.\n- Later, Pip lives as a gentleman in London.", "stem": "The student wants to emphasize how Pip's life changes. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調皮普人生的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 《遠大前程》是 Charles Dickens 的小說。\n- 一開始，皮普是個和姊姊住在沼澤地的貧窮孤兒。\n- 他從一位神秘的恩人那裡得到一筆錢。\n- 後來，皮普在倫敦過著紳士的生活。", "opts": {"A": "Great Expectations is a novel by Charles Dickens.", "B": "Pip receives money from a mysterious benefactor.", "C": "Pip lives with his sister in the marshes.", "D": "Pip goes from being a poor orphan in the marshes to living as a gentleman in London."}, "optsZh": {"A": "《遠大前程》是 Charles Dickens 的小說。", "B": "皮普從一位神秘的恩人那裡得到一筆錢。", "C": "皮普和姊姊住在沼澤地。", "D": "皮普從沼澤地的貧窮孤兒，變成在倫敦過紳士生活的人。"}, "answer": "D", "expl": "Choice D shows Pip's change from a poor orphan to a gentleman in London.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Rhetorical Synthesis: use notes to emphasize how a character changes over time.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- J.K. Rowling wrote a series of seven novels about Harry Potter.<br>- In the first book, Harry is a lonely boy who sleeps in a cupboard under the stairs.<br>- In the last book, Harry leads the fight against Lord Voldemort.<br>- The first book was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> in 1997.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- J.K. Rowling wrote a series of seven novels about Harry Potter.\n- In the first book, Harry is a lonely boy who sleeps in a cupboard under the stairs.\n- In the last book, Harry leads the fight against Lord Voldemort.\n- The first book was published in 1997.", "stem": "The student wants to emphasize how Harry changes over the series. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調哈利在整個系列中的變化。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- J.K.Rowling 寫了一系列七部關於哈利波特的小說。\n- 在第一集中，哈利是個睡在樓梯下儲物櫃裡的孤單男孩。\n- 在最後一集中，哈利帶領大家對抗佛地魔。\n- 第一集於 1997 年出版。", "opts": {"A": "Harry changes from a lonely boy sleeping in a cupboard in the first book to the leader of the fight against Voldemort in the last.", "B": "J.K. Rowling's first Harry Potter book was published in 1997.", "C": "The Harry Potter series includes seven novels.", "D": "Harry Potter is a character created by J.K. Rowling."}, "optsZh": {"A": "哈利從第一集中睡在儲物櫃裡的孤單男孩，變成最後一集中對抗佛地魔的領袖。", "B": "J.K. Rowling 的第一本哈利波特小說於 1997 年出版。", "C": "哈利波特系列包括七部小說。", "D": "哈利波特是 J.K. Rowling 創造的角色。"}, "answer": "A", "expl": "Choice A traces Harry's change from neglected boy to confident leader.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>Haenyeo are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> divers on Jeju Island, a Korean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=province\" target=\"_blank\" rel=\"noopener\" data-w=\"province\" data-pos=\"n.\" data-en=\"a large region of a country or empire with its own government\" data-zh=\"省；行省\">province<\/a>.<br>Haenyeo earn money by harvesting mollusks and shellfish, such as abalone, sea urchins, and oysters.<br>They dive without the use of oxygen masks and tanks.<br>They can hold their breath for over three minutes.<br>They can dive up to 30 meters below the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> of the water.<br>Jellyfish, sharks, and poor weather are different dangers they face while diving.", "bodyPlain": "While researching a topic, a student has taken the following notes:\nHaenyeo are female divers on Jeju Island, a Korean province.\nHaenyeo earn money by harvesting mollusks and shellfish, such as abalone, sea urchins, and oysters.\nThey dive without the use of oxygen masks and tanks.\nThey can hold their breath for over three minutes.\nThey can dive up to 30 meters below the surface of the water.\nJellyfish, sharks, and poor weather are different dangers they face while diving.", "stem": "The student wants to emphasize the abilities of haenyeo. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調海女的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n海女是韓國濟州島上的女性潛水員。\n海女靠採集鮑魚、海膽和牡蠣等軟體動物與貝類維生。\n她們潛水時不使用氧氣面罩和氣瓶。\n她們可以閉氣超過三分鐘。\n她們可以潛到水面下 30 公尺深。\n水母、鯊魚和惡劣天氣是她們潛水時面臨的各種危險。", "opts": {"A": "Haenyeo are female divers on Jeju Island who harvest shellfish.", "B": "While diving, haenyeo contend with jellyfish, sharks, and poor weather.", "C": "Haenyeo earn money by selling abalone, sea urchins, and oysters, which they harvest by diving without oxygen masks and tanks.", "D": "Haenyeo can dive 30 meters below the surface and hold their breath for over three minutes."}, "optsZh": {"A": "海女是在濟州島採集貝類的女性潛水員。", "B": "潛水時，海女要應付水母、鯊魚和惡劣天氣。", "C": "海女靠販售鮑魚、海膽和牡蠣賺錢，這些都是她們不用氧氣面罩和氣瓶潛水採集來的。", "D": "海女能潛到水面下 30 公尺，並閉氣超過三分鐘。"}, "answer": "D", "expl": "Choice D focuses on what haenyeo can do: dive 30 meters and hold their breath for over three minutes.", "explZh": "D 聚焦於海女的能力：潛到 30 公尺深、閉氣超過三分鐘。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Sherpas are an ethnic group from the mountains of Nepal.<br>- Many work as guides on Mount Everest.<br>- Some can climb above 8,000 meters without extra oxygen.<br>- They can carry loads of 30 kilograms at high <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=altitude\" target=\"_blank\" rel=\"noopener\" data-w=\"altitude\" data-pos=\"n.\" data-en=\"height above sea level\" data-zh=\"海拔；高度\">altitude<\/a>.<br>- Avalanches are a major danger they face.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Sherpas are an ethnic group from the mountains of Nepal.\n- Many work as guides on Mount Everest.\n- Some can climb above 8,000 meters without extra oxygen.\n- They can carry loads of 30 kilograms at high altitude.\n- Avalanches are a major danger they face.", "stem": "The student wants to emphasize the abilities of Sherpas. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調雪巴人的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 雪巴人是來自尼泊爾山區的一個民族。\n- 許多人在聖母峰擔任嚮導。\n- 有些人不需額外氧氣就能攀爬到海拔 8,000 公尺以上。\n- 他們能在高海拔背負 30 公斤的重物。\n- 雪崩是他們面臨的主要危險。", "opts": {"A": "Sherpas are an ethnic group from Nepal who often work on Mount Everest.", "B": "Avalanches are a major danger for Sherpa guides.", "C": "Some Sherpas can climb above 8,000 meters without extra oxygen and carry 30-kilogram loads at high altitude.", "D": "Many Sherpas work as guides in the mountains of Nepal."}, "optsZh": {"A": "雪巴人是來自尼泊爾、常在聖母峰工作的民族。", "B": "雪崩是雪巴嚮導面臨的主要危險。", "C": "有些雪巴人不需額外氧氣就能攀爬到海拔 8,000 公尺以上，並在高海拔背負 30 公斤的重物。", "D": "許多雪巴人在尼泊爾山區擔任嚮導。"}, "answer": "C", "expl": "Choice C lists what the Sherpas can do: climb without extra oxygen and carry heavy loads at altitude.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> has taken the following notes:<br>- The Bajau are a sea-dwelling people of Southeast Asia.<br>- They fish using wooden spears.<br>- Some can dive to depths of 70 meters.<br>- They can stay underwater for up to five minutes.<br>- Many live in houses built on stilts over the water.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Bajau are a sea-dwelling people of Southeast Asia.\n- They fish using wooden spears.\n- Some can dive to depths of 70 meters.\n- They can stay underwater for up to five minutes.\n- Many live in houses built on stilts over the water.", "stem": "The student wants to emphasize the abilities of the Bajau. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調巴瑤族的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 巴瑤族是東南亞一個以海為家的民族。\n- 他們用木製魚叉捕魚。\n- 有些人能潛到 70 公尺深。\n- 他們能在水下待長達五分鐘。\n- 許多人住在水上高腳屋裡。", "opts": {"A": "The Bajau, a people of Southeast Asia, live in houses on stilts.", "B": "Some Bajau divers can reach depths of 70 meters and stay underwater for up to five minutes.", "C": "The Bajau fish using wooden spears.", "D": "Many Bajau live in Southeast Asia."}, "optsZh": {"A": "東南亞民族巴瑤族住在高腳屋裡。", "B": "有些巴瑤族潛水員能潛到 70 公尺深，並在水下待長達五分鐘。", "C": "巴瑤族用木製魚叉捕魚。", "D": "許多巴瑤族人住在東南亞。"}, "answer": "B", "expl": "Choice B highlights what the Bajau can do underwater.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Rarámuri (Tarahumara) live in the Copper Canyon region of Mexico.<br>- They <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> wear thin sandals called huaraches.<br>- Some can run more than 150 kilometers without stopping.<br>- They run on steep, rocky mountain trails.<br>- Drought is a challenge for their farms.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Rarámuri (Tarahumara) live in the Copper Canyon region of Mexico.\n- They traditionally wear thin sandals called huaraches.\n- Some can run more than 150 kilometers without stopping.\n- They run on steep, rocky mountain trails.\n- Drought is a challenge for their farms.", "stem": "The student wants to emphasize the abilities of Rarámuri runners. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調拉拉穆里跑者的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 拉拉穆里人（塔拉烏馬拉人）住在墨西哥的銅峽谷地區。\n- 他們傳統上穿一種稱為 huaraches 的薄涼鞋。\n- 有些人能不停歇地跑超過 150 公里。\n- 他們在陡峭、多岩石的山徑上奔跑。\n- 乾旱是他們農田面臨的挑戰。", "opts": {"A": "The Rarámuri live in the Copper Canyon region of Mexico.", "B": "Drought makes farming difficult for the Rarámuri.", "C": "Rarámuri runners traditionally wear thin sandals called huaraches.", "D": "Some Rarámuri runners can cover more than 150 kilometers on steep, rocky trails without stopping."}, "optsZh": {"A": "拉拉穆里人住在墨西哥的銅峽谷地區。", "B": "乾旱使拉拉穆里人的農耕變得困難。", "C": "拉拉穆里跑者傳統上穿一種稱為 huaraches 的薄涼鞋。", "D": "有些拉拉穆里跑者能在陡峭多岩的山徑上不停歇地跑超過 150 公里。"}, "answer": "D", "expl": "Choice D states the impressive skills of the Tarahumara runners.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Kazakh eagle hunters live in western Mongolia.<br>- They train golden eagles from young chicks.<br>- Their eagles can catch foxes on command.<br>- Hunters ride horses in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> as low as −40°C.<br>- The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> is at least 1,000 years old.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Kazakh eagle hunters live in western Mongolia.\n- They train golden eagles from young chicks.\n- Their eagles can catch foxes on command.\n- Hunters ride horses in temperatures as low as −40°C.\n- The tradition is at least 1,000 years old.", "stem": "The student wants to emphasize the abilities of Kazakh eagle hunters. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調哈薩克獵鷹人的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 哈薩克獵鷹人住在蒙古西部。\n- 他們從雛鳥時期開始訓練金鵰。\n- 他們的金鵰能聽令捕捉狐狸。\n- 獵人在低至攝氏零下 40 度的氣溫中騎馬。\n- 這項傳統至少有一千年歷史。", "opts": {"A": "Kazakh eagle hunters can train golden eagles from chicks to catch foxes on command, riding in temperatures as low as −40°C.", "B": "Kazakh eagle hunters live in western Mongolia.", "C": "Eagle hunting is a tradition at least 1,000 years old.", "D": "Golden eagles are used by hunters in Mongolia."}, "optsZh": {"A": "哈薩克獵鷹人能從雛鳥開始訓練金鵰聽令捕捉狐狸，並在低至攝氏零下 40 度的氣溫中騎馬。", "B": "哈薩克獵鷹人住在蒙古西部。", "C": "獵鷹是一項至少有一千年歷史的傳統。", "D": "蒙古的獵人使用金鵰。"}, "answer": "A", "expl": "Choice A emphasizes the eagle hunters' skill in training and hunting with eagles.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Rhetorical Synthesis: use notes to emphasize a group's abilities.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Polynesian navigators sailed across the Pacific Ocean.<br>- They used canoes made of wood and coconut <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiber\" target=\"_blank\" rel=\"noopener\" data-w=\"fiber\" data-pos=\"n.\" data-en=\"a thin thread-like strand\" data-zh=\"纖維\">fiber<\/a>.<br>- They could find islands <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of kilometers away without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a>.<br>- They read stars, ocean swells, and bird flight paths to navigate.<br>- Storms were a constant danger.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Polynesian navigators sailed across the Pacific Ocean.\n- They used canoes made of wood and coconut fiber.\n- They could find islands thousands of kilometers away without instruments.\n- They read stars, ocean swells, and bird flight paths to navigate.\n- Storms were a constant danger.", "stem": "The student wants to emphasize the abilities of Polynesian navigators. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調玻里尼西亞航海家的能力。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 玻里尼西亞航海家橫渡太平洋。\n- 他們使用木頭和椰子纖維製成的獨木舟。\n- 他們不用儀器就能找到數千公里外的島嶼。\n- 他們觀察星辰、海浪湧動與鳥類飛行路線來導航。\n- 暴風雨是持續存在的危險。", "opts": {"A": "Polynesian navigators sailed canoes made of wood and coconut fiber.", "B": "Storms were a constant danger for Polynesian navigators.", "C": "Reading stars, swells, and bird flight paths, Polynesian navigators could find islands thousands of kilometers away without instruments.", "D": "Polynesian navigators sailed across the Pacific Ocean."}, "optsZh": {"A": "玻里尼西亞航海家駕駛木頭和椰子纖維製成的獨木舟。", "B": "暴風雨是玻里尼西亞航海家持續面臨的危險。", "C": "藉由觀察星辰、海浪與鳥類飛行路線，玻里尼西亞航海家不用儀器就能找到數千公里外的島嶼。", "D": "玻里尼西亞航海家橫渡太平洋。"}, "answer": "C", "expl": "Choice C focuses on the navigators' remarkable skills.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>Heliconian Hall was built in 1876 as the Olivet Congregational Church.<br>Heliconian Hall is in the Yorkville <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> of Toronto.<br>The Heliconian Club <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchased<\/a> and renamed Heliconian Hall in 1923.<br>The Heliconian Club’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=membership\" target=\"_blank\" rel=\"noopener\" data-w=\"membership\" data-pos=\"n.\" data-en=\"the members of a group; being a member\" data-zh=\"成員；會員資格\">membership<\/a> includes women professional artists.<br>Heliconian Hall hosts music, art, dance, drama, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a> events.", "bodyPlain": "While researching a topic, a student has taken the following notes:\nHeliconian Hall was built in 1876 as the Olivet Congregational Church.\nHeliconian Hall is in the Yorkville neighborhood of Toronto.\nThe Heliconian Club purchased and renamed Heliconian Hall in 1923.\nThe Heliconian Club’s membership includes women professional artists.\nHeliconian Hall hosts music, art, dance, drama, and literature events.", "stem": "The student wants to describe the history of Heliconian Hall to an audience familiar with the Heliconian Club. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉 Heliconian 俱樂部的讀者描述 Heliconian Hall 的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\nHeliconian Hall 建於 1876 年，原為 Olivet 公理會教堂。\nHeliconian Hall 位於多倫多的約克維爾社區。\nHeliconian 俱樂部於 1923 年買下並重新命名了 Heliconian Hall。\nHeliconian 俱樂部的會員包括女性專業藝術家。\nHeliconian Hall 舉辦音樂、藝術、舞蹈、戲劇與文學活動。", "opts": {"A": "Heliconian Hall was purchased in 1923 by the Heliconian Club, an organization which includes women professional artists.", "B": "Heliconian Hall, located in the Yorkville neighborhood of Toronto, hosts music, art, dance, drama, and literature events.", "C": "Heliconian Hall, formerly known as the Olivet Congregational Church, is in the Yorkville neighborhood of Toronto.", "D": "Heliconian Hall, built as the Olivet Congregational Church in 1876, was purchased and renamed by the Heliconian Club in 1923."}, "optsZh": {"A": "Heliconian Hall 於 1923 年被 Heliconian 俱樂部買下，這是一個會員包括女性專業藝術家的組織。", "B": "位於多倫多約克維爾社區的 Heliconian Hall 舉辦音樂、藝術、舞蹈、戲劇與文學活動。", "C": "Heliconian Hall 舊稱 Olivet 公理會教堂，位於多倫多的約克維爾社區。", "D": "Heliconian Hall 於 1876 年建成時是 Olivet 公理會教堂，1923 年被 Heliconian 俱樂部買下並重新命名。"}, "answer": "D", "expl": "The audience already knows the club, so D focuses on the hall's history: built as a church in 1876 and bought and renamed in 1923.", "explZh": "讀者已熟悉這個俱樂部，所以 D 聚焦於建築的歷史：1876 年建為教堂、1923 年被買下並改名。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Carnegie Room was built in 1902 as the Merchant&#x27;s Bank.<br>- It is in the old town of Pittsburgh.<br>- The City Poetry Society bought and renamed it in 1965.<br>- The society&#x27;s members include local poets.<br>- The building <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=host\" target=\"_blank\" rel=\"noopener\" data-w=\"host\" data-pos=\"n.\" data-en=\"a plant or animal on which another organism lives\" data-zh=\"宿主\">hosts<\/a> readings and writing workshops.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Carnegie Room was built in 1902 as the Merchant's Bank.\n- It is in the old town of Pittsburgh.\n- The City Poetry Society bought and renamed it in 1965.\n- The society's members include local poets.\n- The building hosts readings and writing workshops.", "stem": "The student wants to describe the history of the Carnegie Room to an audience familiar with the City Poetry Society. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉城市詩社的讀者描述卡內基廳的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 卡內基廳建於 1902 年，原為商人銀行。\n- 它位於匹茲堡的舊城區。\n- 城市詩社於 1965 年買下並重新命名了它。\n- 詩社的成員包括當地詩人。\n- 這棟建築舉辦朗讀會與寫作工作坊。", "opts": {"A": "The Carnegie Room was bought in 1965 by the City Poetry Society, a group that includes local poets.", "B": "The Carnegie Room, in Pittsburgh's old town, hosts readings and writing workshops.", "C": "The Carnegie Room, formerly the Merchant's Bank, is in Pittsburgh's old town.", "D": "The Carnegie Room, built as the Merchant's Bank in 1902, was bought and renamed by the City Poetry Society in 1965."}, "optsZh": {"A": "卡內基廳於 1965 年被城市詩社買下，這是一個成員包括當地詩人的團體。", "B": "位於匹茲堡舊城區的卡內基廳舉辦朗讀會與寫作工作坊。", "C": "卡內基廳舊為商人銀行，位於匹茲堡舊城區。", "D": "卡內基廳於 1902 年建成時是商人銀行，1965 年被城市詩社買下並重新命名。"}, "answer": "D", "expl": "The audience already knows the society, so D focuses on the building's history (built as a bank, bought and renamed).", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Harbor Hall was built in 1890 as a fish market.<br>- It is located near the port in Halifax.<br>- The Halifax Youth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestra\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestra\" data-pos=\"n.\" data-en=\"a large group of musicians who play different instruments together\" data-zh=\"管弦樂團\">Orchestra<\/a> bought the building in 1978.<br>- The orchestra trains young <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musician\" target=\"_blank\" rel=\"noopener\" data-w=\"musician\" data-pos=\"n.\" data-en=\"a person who plays music, especially as a job\" data-zh=\"音樂家；樂手\">musicians<\/a> aged 10–18.<br>- Harbor Hall <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=host\" target=\"_blank\" rel=\"noopener\" data-w=\"host\" data-pos=\"n.\" data-en=\"a plant or animal on which another organism lives\" data-zh=\"宿主\">hosts<\/a> concerts every weekend.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Harbor Hall was built in 1890 as a fish market.\n- It is located near the port in Halifax.\n- The Halifax Youth Orchestra bought the building in 1978.\n- The orchestra trains young musicians aged 10–18.\n- Harbor Hall hosts concerts every weekend.", "stem": "The student wants to describe the history of Harbor Hall to an audience familiar with the Halifax Youth Orchestra. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉哈利法克斯青年管弦樂團的讀者描述港灣廳的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 港灣廳建於 1890 年，原為魚市場。\n- 它位於哈利法克斯的港口附近。\n- 哈利法克斯青年管弦樂團於 1978 年買下這棟建築。\n- 這個樂團培訓 10 至 18 歲的年輕音樂家。\n- 港灣廳每個週末都舉辦音樂會。", "opts": {"A": "The Halifax Youth Orchestra, which trains musicians aged 10–18, owns Harbor Hall.", "B": "Built in 1890 as a fish market, Harbor Hall was purchased by the Halifax Youth Orchestra in 1978.", "C": "Harbor Hall, near the port in Halifax, hosts concerts every weekend.", "D": "Harbor Hall is located near the port in Halifax."}, "optsZh": {"A": "培訓 10 至 18 歲音樂家的哈利法克斯青年管弦樂團擁有港灣廳。", "B": "港灣廳建於 1890 年，原為魚市場，於 1978 年被哈利法克斯青年管弦樂團買下。", "C": "位於哈利法克斯港口附近的港灣廳每個週末都舉辦音樂會。", "D": "港灣廳位於哈利法克斯的港口附近。"}, "answer": "B", "expl": "The audience knows the orchestra, so B gives the hall's history without explaining the orchestra.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Maple Room was built in 1911 as a train station.<br>- It is in the village of Elora, Ontario.<br>- The Elora Chess Club bought and renamed it in 1984.<br>- The club&#x27;s members include several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> champions.<br>- The building <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=host\" target=\"_blank\" rel=\"noopener\" data-w=\"host\" data-pos=\"n.\" data-en=\"a plant or animal on which another organism lives\" data-zh=\"宿主\">hosts<\/a> weekly tournaments.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Maple Room was built in 1911 as a train station.\n- It is in the village of Elora, Ontario.\n- The Elora Chess Club bought and renamed it in 1984.\n- The club's members include several national champions.\n- The building hosts weekly tournaments.", "stem": "The student wants to describe the history of the Maple Room to an audience familiar with the Elora Chess Club. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉艾洛拉西洋棋俱樂部的讀者描述楓葉廳的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 楓葉廳建於 1911 年，原為火車站。\n- 它位於安大略省的艾洛拉村。\n- 艾洛拉西洋棋俱樂部於 1984 年買下並重新命名了它。\n- 俱樂部的會員包括幾位全國冠軍。\n- 這棟建築每週舉辦錦標賽。", "opts": {"A": "The Elora Chess Club, whose members include national champions, hosts weekly tournaments.", "B": "The Maple Room is in the village of Elora, Ontario.", "C": "Originally built as a train station in 1911, the Maple Room was bought and renamed by the Elora Chess Club in 1984.", "D": "The Maple Room hosts weekly chess tournaments in Elora."}, "optsZh": {"A": "會員包括全國冠軍的艾洛拉西洋棋俱樂部每週舉辦錦標賽。", "B": "楓葉廳位於安大略省的艾洛拉村。", "C": "楓葉廳原建於 1911 年作為火車站，於 1984 年被艾洛拉西洋棋俱樂部買下並重新命名。", "D": "楓葉廳每週在艾洛拉舉辦西洋棋錦標賽。"}, "answer": "C", "expl": "C gives the building's history (built as a train station, bought by the club) without explaining the club.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Lantern House was built in 1925 as a silent-movie cinema.<br>- It stands on King Street in Charleston.<br>- The Lowcountry Players theater <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> bought it in 1991.<br>- The company performs plays by Southern writers.<br>- The Lantern House seats 300 people.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Lantern House was built in 1925 as a silent-movie cinema.\n- It stands on King Street in Charleston.\n- The Lowcountry Players theater company bought it in 1991.\n- The company performs plays by Southern writers.\n- The Lantern House seats 300 people.", "stem": "The student wants to describe the history of the Lantern House to an audience familiar with the Lowcountry Players. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉 Lowcountry Players 的讀者描述燈籠屋的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 燈籠屋建於 1925 年，原為默片電影院。\n- 它位於查爾斯頓的國王街上。\n- Lowcountry Players 劇團於 1991 年買下了它。\n- 這個劇團演出南方作家的劇作。\n- 燈籠屋可容納 300 人。", "opts": {"A": "The Lantern House, built as a silent-movie cinema in 1925, was bought by the Lowcountry Players in 1991.", "B": "The Lowcountry Players, a theater company, performs plays by Southern writers.", "C": "The Lantern House seats 300 people on King Street in Charleston.", "D": "The Lowcountry Players perform at a theater on King Street."}, "optsZh": {"A": "燈籠屋於 1925 年建成時是默片電影院，1991 年被 Lowcountry Players 買下。", "B": "劇團 Lowcountry Players 演出南方作家的劇作。", "C": "位於查爾斯頓國王街的燈籠屋可容納 300 人。", "D": "Lowcountry Players 在國王街的一座劇院演出。"}, "answer": "A", "expl": "A focuses on the building's history for readers who already know the theater company.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Rhetorical Synthesis: present a building's history to an audience already familiar with its current owner.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Willow Cottage was built in 1870 as a schoolhouse.<br>- It is in Stow-on-the-Wold, England.<br>- The Cotswold Garden Club bought and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=restore\" target=\"_blank\" rel=\"noopener\" data-w=\"restore\" data-pos=\"v.\" data-en=\"to return something to its original condition\" data-zh=\"復育；修復\">restored<\/a> it in 2002.<br>- The club&#x27;s members grow rare roses.<br>- Willow Cottage holds flower shows each June.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Willow Cottage was built in 1870 as a schoolhouse.\n- It is in Stow-on-the-Wold, England.\n- The Cotswold Garden Club bought and restored it in 2002.\n- The club's members grow rare roses.\n- Willow Cottage holds flower shows each June.", "stem": "The student wants to describe the history of Willow Cottage to an audience familiar with the Cotswold Garden Club. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向熟悉科茲窩園藝俱樂部的讀者描述柳樹小屋的歷史。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 柳樹小屋建於 1870 年，原為校舍。\n- 它位於英國的斯托昂澤沃爾德。\n- 科茲窩園藝俱樂部於 2002 年買下並修復了它。\n- 俱樂部的會員種植稀有玫瑰。\n- 柳樹小屋每年六月舉辦花展。", "opts": {"A": "The Cotswold Garden Club, whose members grow rare roses, holds flower shows each June.", "B": "Willow Cottage is in Stow-on-the-Wold, England.", "C": "Willow Cottage holds flower shows each June.", "D": "Willow Cottage, built as a schoolhouse in 1870, was bought and restored by the Cotswold Garden Club in 2002."}, "optsZh": {"A": "會員種植稀有玫瑰的科茲窩園藝俱樂部，每年六月舉辦花展。", "B": "柳樹小屋位於英國的斯托昂澤沃爾德。", "C": "柳樹小屋每年六月舉辦花展。", "D": "柳樹小屋於 1870 年建成時是校舍，2002 年被科茲窩園藝俱樂部買下並修復。"}, "answer": "D", "expl": "D gives the history of the building and assumes the audience knows the garden club.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>Evan Adams is an Indigenous Canadian actor.<br>He is well-known for his role as Thomas in the film Smoke Signals.<br>The film was released in 1998.<br>It is about two friends, Thomas and Victor, and their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationships<\/a> with Victor’s father, Arnold.<br>Adams is also known for his role as Seymour in The Business of Fancydancing (2002).", "bodyPlain": "While researching a topic, a student has taken the following notes:\nEvan Adams is an Indigenous Canadian actor.\nHe is well-known for his role as Thomas in the film Smoke Signals.\nThe film was released in 1998.\nIt is about two friends, Thomas and Victor, and their complicated relationships with Victor’s father, Arnold.\nAdams is also known for his role as Seymour in The Business of Fancydancing (2002).", "stem": "The student wants to introduce Evan Adams and his role in Smoke Signals to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新觀眾介紹 Evan Adams 和他在《煙火信號》中的角色。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\nEvan Adams 是一位加拿大原住民演員。\n他以在電影《煙火信號》中飾演 Thomas 而聞名。\n這部電影於 1998 年上映。\n它講述兩位朋友 Thomas 和 Victor，以及他們與 Victor 的父親 Arnold 之間複雜的關係。\nAdams 也以在《The Business of Fancydancing》（2002）中飾演 Seymour 而為人所知。", "opts": {"A": "Evan Adams, an Indigenous Canadian actor, has starred as Thomas in Smoke Signals and Seymour in The Business of Fancydancing.", "B": "Smoke Signals, released in 1998, explores the complicated relationships of friends Thomas and Victor.", "C": "Evan Adams starred in the film Smoke Signals before he starred in The Business of Fancydancing.", "D": "Indigenous Canadian actor Evan Adams starred as Thomas in the 1998 film Smoke Signals, which depicts two friends, Thomas and Victor, and their complicated relationships with Victor’s father, Arnold."}, "optsZh": {"A": "加拿大原住民演員 Evan Adams 曾在《煙火信號》中飾演 Thomas，並在《The Business of Fancydancing》中飾演 Seymour。", "B": "1998 年上映的《煙火信號》探討朋友 Thomas 和 Victor 之間複雜的關係。", "C": "Evan Adams 先演了《煙火信號》，之後才演《The Business of Fancydancing》。", "D": "加拿大原住民演員 Evan Adams 在 1998 年的電影《煙火信號》中飾演 Thomas，這部電影描寫兩位朋友 Thomas 和 Victor，以及他們與 Victor 的父親 Arnold 之間複雜的關係。"}, "answer": "D", "expl": "For a new audience, D explains who Adams is and gives enough context about the film and his role.", "explZh": "對新觀眾來說，D 說明了 Adams 是誰，並提供電影與角色的足夠背景。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Maya Lin is a Chinese American architect and artist.<br>- She designed the Vietnam Veterans Memorial in Washington, D.C.<br>- She won the design competition in 1981 while still a college student.<br>- The memorial is a black <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=granite\" target=\"_blank\" rel=\"noopener\" data-w=\"granite\" data-pos=\"n.\" data-en=\"a very hard gray or pink rock\" data-zh=\"花崗岩\">granite<\/a> wall listing more than 58,000 names.<br>- She also designed the Civil Rights Memorial in Alabama.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Maya Lin is a Chinese American architect and artist.\n- She designed the Vietnam Veterans Memorial in Washington, D.C.\n- She won the design competition in 1981 while still a college student.\n- The memorial is a black granite wall listing more than 58,000 names.\n- She also designed the Civil Rights Memorial in Alabama.", "stem": "The student wants to introduce Maya Lin and her design of the Vietnam Veterans Memorial to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新讀者介紹林瓔和她設計的越戰退伍軍人紀念碑。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 林瓔是一位華裔美國建築師暨藝術家。\n- 她設計了華盛頓特區的越戰退伍軍人紀念碑。\n- 她在 1981 年還是大學生時就贏得了設計競賽。\n- 這座紀念碑是一面刻有超過 58,000 個名字的黑色花崗岩牆。\n- 她也設計了阿拉巴馬州的民權紀念碑。", "opts": {"A": "Maya Lin designed both the Vietnam Veterans Memorial and the Civil Rights Memorial.", "B": "Chinese American architect Maya Lin designed the Vietnam Veterans Memorial, a black granite wall listing more than 58,000 names, while she was still a college student.", "C": "The Vietnam Veterans Memorial lists more than 58,000 names.", "D": "Maya Lin won a design competition in 1981."}, "optsZh": {"A": "林瓔設計了越戰退伍軍人紀念碑和民權紀念碑。", "B": "華裔美國建築師林瓔在還是大學生時，設計了越戰退伍軍人紀念碑——一面刻有超過 58,000 個名字的黑色花崗岩牆。", "C": "越戰退伍軍人紀念碑上刻有超過 58,000 個名字。", "D": "林瓔在 1981 年贏得了一項設計競賽。"}, "answer": "B", "expl": "For a new audience, B identifies who Lin is and explains her role in the memorial.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> has taken the following notes:<br>- Ke Huy Quan is a Vietnamese American actor.<br>- As a child, he played Short Round in Indiana Jones and the Temple of Doom (1984).<br>- He later played Waymond Wang in Everything Everywhere All at Once (2022).<br>- The film follows a family that travels across different universes.<br>- He won an Academy Award for the role.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Ke Huy Quan is a Vietnamese American actor.\n- As a child, he played Short Round in Indiana Jones and the Temple of Doom (1984).\n- He later played Waymond Wang in Everything Everywhere All at Once (2022).\n- The film follows a family that travels across different universes.\n- He won an Academy Award for the role.", "stem": "The student wants to introduce Ke Huy Quan and his role in Everything Everywhere All at Once to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新觀眾介紹關繼威和他在《媽的多重宇宙》中的角色。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 關繼威是一位越南裔美國演員。\n- 他小時候在《印第安納瓊斯：魔宮傳奇》（1984）中飾演小不點。\n- 他後來在《媽的多重宇宙》（2022）中飾演 Waymond Wang。\n- 這部電影講述一家人穿越不同宇宙的故事。\n- 他以這個角色贏得了奧斯卡獎。", "opts": {"A": "Ke Huy Quan played Short Round and Waymond Wang.", "B": "Everything Everywhere All at Once follows a family that travels across universes.", "C": "Ke Huy Quan acted in a film in 1984 and another in 2022.", "D": "Vietnamese American actor Ke Huy Quan won an Academy Award for playing Waymond Wang in Everything Everywhere All at Once (2022), a film about a family that travels across different universes."}, "optsZh": {"A": "關繼威飾演過小不點和 Waymond Wang。", "B": "《媽的多重宇宙》講述一家人穿越不同宇宙的故事。", "C": "關繼威在 1984 年和 2022 年各演出了一部電影。", "D": "越南裔美國演員關繼威以在《媽的多重宇宙》（2022）中飾演 Waymond Wang 贏得奧斯卡獎，這是一部講述一家人穿越不同宇宙的電影。"}, "answer": "D", "expl": "D introduces who Ho is and explains her role in the film in a way a new audience would understand.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Chinua Achebe was a Nigerian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a>.<br>- He wrote Things Fall Apart (1958).<br>- The novel tells the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> of Okonkwo, a leader in an Igbo village.<br>- It shows how British colonization changed village life.<br>- Achebe also wrote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=poetry\" target=\"_blank\" rel=\"noopener\" data-w=\"poetry\" data-pos=\"n.\" data-en=\"poems in general\" data-zh=\"詩\">poetry<\/a> and essays.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Chinua Achebe was a Nigerian novelist.\n- He wrote Things Fall Apart (1958).\n- The novel tells the story of Okonkwo, a leader in an Igbo village.\n- It shows how British colonization changed village life.\n- Achebe also wrote poetry and essays.", "stem": "The student wants to introduce Chinua Achebe and Things Fall Apart to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新讀者介紹 Chinua Achebe 和《分崩離析》。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- Chinua Achebe 是一位奈及利亞小說家。\n- 他寫了《分崩離析》（1958）。\n- 這部小說講述伊博族村落領袖 Okonkwo 的故事。\n- 它呈現英國殖民如何改變了村落生活。\n- Achebe 也寫詩和散文。", "opts": {"A": "Nigerian novelist Chinua Achebe wrote Things Fall Apart (1958), which follows Okonkwo, an Igbo village leader, as British colonization changes village life.", "B": "Things Fall Apart was published in 1958.", "C": "Chinua Achebe wrote novels, poetry, and essays.", "D": "Okonkwo is a leader in an Igbo village."}, "optsZh": {"A": "奈及利亞小說家 Chinua Achebe 寫了《分崩離析》（1958），講述伊博族村落領袖 Okonkwo 在英國殖民改變村落生活時的故事。", "B": "《分崩離析》於 1958 年出版。", "C": "Chinua Achebe 寫小說、詩和散文。", "D": "Okonkwo 是伊博族村落的領袖。"}, "answer": "A", "expl": "A introduces the author and the novel with enough context for new readers.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Yo-Yo Ma is an American cellist.<br>- He founded the Silkroad Ensemble in 1998.<br>- The ensemble brings together <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musician\" target=\"_blank\" rel=\"noopener\" data-w=\"musician\" data-pos=\"n.\" data-en=\"a person who plays music, especially as a job\" data-zh=\"音樂家；樂手\">musicians<\/a> from more than 20 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">countries<\/a>.<br>- It performs music <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by cultures along the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Silk Road.<br>- Ma has won 19 Grammy Awards.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Yo-Yo Ma is an American cellist.\n- He founded the Silkroad Ensemble in 1998.\n- The ensemble brings together musicians from more than 20 countries.\n- It performs music inspired by cultures along the ancient Silk Road.\n- Ma has won 19 Grammy Awards.", "stem": "The student wants to introduce Yo-Yo Ma and his role in the Silkroad Ensemble to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新聽眾介紹馬友友和他在絲路合奏團中的角色。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 馬友友是一位美國大提琴家。\n- 他於 1998 年創立了絲路合奏團。\n- 這個合奏團匯集了來自 20 多個國家的音樂家。\n- 它演奏受古代絲路沿線文化啟發的音樂。\n- 馬友友已獲得 19 座葛萊美獎。", "opts": {"A": "Yo-Yo Ma has won 19 Grammy Awards.", "B": "The Silkroad Ensemble includes musicians from more than 20 countries.", "C": "American cellist Yo-Yo Ma founded the Silkroad Ensemble in 1998, bringing together musicians from more than 20 countries to play music inspired by the ancient Silk Road.", "D": "Yo-Yo Ma founded an ensemble in 1998."}, "optsZh": {"A": "馬友友已獲得 19 座葛萊美獎。", "B": "絲路合奏團包括來自 20 多個國家的音樂家。", "C": "美國大提琴家馬友友於 1998 年創立絲路合奏團，匯集了來自 20 多個國家的音樂家，演奏受古代絲路啟發的音樂。", "D": "馬友友在 1998 年創立了一個合奏團。"}, "answer": "C", "expl": "C explains who Ma is and her role in the album, with context for a new audience.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Rhetorical Synthesis: introduce a person and a specific work to a new audience.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Hayao Miyazaki is a Japanese animator and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=director\" target=\"_blank\" rel=\"noopener\" data-w=\"director\" data-pos=\"n.\" data-en=\"the person who controls how a film or play is made\" data-zh=\"導演；主任\">director<\/a>.<br>- He co-founded Studio Ghibli in 1985.<br>- He directed Spirited Away (2001).<br>- The film tells of a girl who must work in a spirit world bathhouse to save her parents.<br>- It won the Academy Award for Best Animated Feature.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Hayao Miyazaki is a Japanese animator and director.\n- He co-founded Studio Ghibli in 1985.\n- He directed Spirited Away (2001).\n- The film tells of a girl who must work in a spirit world bathhouse to save her parents.\n- It won the Academy Award for Best Animated Feature.", "stem": "The student wants to introduce Hayao Miyazaki and his film Spirited Away to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向新觀眾介紹宮崎駿和他的電影《神隱少女》。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 宮崎駿是一位日本動畫師暨導演。\n- 他於 1985 年共同創立了吉卜力工作室。\n- 他執導了《神隱少女》（2001）。\n- 這部電影講述一個女孩為了救父母，必須在靈界的澡堂工作的故事。\n- 它贏得了奧斯卡最佳動畫長片獎。", "opts": {"A": "Hayao Miyazaki co-founded Studio Ghibli in 1985.", "B": "Japanese director Hayao Miyazaki made Spirited Away (2001), an award-winning animated film about a girl who works in a spirit world bathhouse to save her parents.", "C": "Spirited Away won the Academy Award for Best Animated Feature.", "D": "Hayao Miyazaki directed a film in 2001."}, "optsZh": {"A": "宮崎駿於 1985 年共同創立了吉卜力工作室。", "B": "日本導演宮崎駿拍攝了《神隱少女》（2001），這部得獎動畫電影講述一個女孩為了救父母而在靈界澡堂工作的故事。", "C": "《神隱少女》贏得了奧斯卡最佳動畫長片獎。", "D": "宮崎駿在 2001 年執導了一部電影。"}, "answer": "B", "expl": "B introduces the director and the film clearly for an unfamiliar audience.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org
