/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> has taken the following notes:<br>Marie Byrd Land is an unclaimed region of Antarctica.<br>Construction of Byrd Station in Marie Byrd Land was begun in 1956 by the US.<br>Byrd Station was abandoned in 1972.<br>John Carpenter used Byrd Station as a model for an Antarctic station in crisis for his movie The Thing.<br>James Rollins used Byrd Station as a model for an Antarctic station in crisis for his novel The 6th Extinction.", "bodyPlain": "While researching a topic, a student has taken the following notes:\nMarie Byrd Land is an unclaimed region of Antarctica.\nConstruction of Byrd Station in Marie Byrd Land was begun in 1956 by the US.\nByrd Station was abandoned in 1972.\nJohn Carpenter used Byrd Station as a model for an Antarctic station in crisis for his movie The Thing.\nJames Rollins used Byrd Station as a model for an Antarctic station in crisis for his novel The 6th Extinction.", "stem": "The student wants to highlight a similarity between fictional depictions of a real-world location. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調對同一個真實地點的不同虛構描寫之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n瑪麗伯德地是南極洲一塊無人宣稱主權的地區。\n美國於 1956 年開始在瑪麗伯德地興建伯德站。\n伯德站於 1972 年被廢棄。\nJohn Carpenter 以伯德站為原型，在他的電影《突變第三型》中塑造了一座陷入危機的南極研究站。\nJames Rollins 以伯德站為原型，在他的小說《The 6th Extinction》中塑造了一座陷入危機的南極研究站。", "opts": {"A": "Both John Carpenter’s movie The Thing and James Rollins’s novel The 6th Extinction used Byrd Station as a model for an Antarctic station in crisis.", "B": "In 1956, the US began construction of Byrd Station in Marie Byrd Land, an unclaimed region of Antarctica.", "C": "Abandoned in 1972, Byrd Station was the model for an Antarctic station in crisis in John Carpenter’s The Thing.", "D": "John Carpenter used Byrd Station as a model for an Antarctic station in crisis for his movie The Thing; however, James Rollins used Byrd Station as a model for an Antarctic station in crisis for his novel The 6th Extinction."}, "optsZh": {"A": "John Carpenter 的電影《突變第三型》和 James Rollins 的小說《The 6th Extinction》都以伯德站為原型，塑造了陷入危機的南極研究站。", "B": "1956 年，美國開始在南極洲無人宣稱主權的瑪麗伯德地興建伯德站。", "C": "伯德站於 1972 年被廢棄，是 John Carpenter《突變第三型》中陷入危機之南極研究站的原型。", "D": "John Carpenter 在電影《突變第三型》中以伯德站為原型塑造陷入危機的南極研究站；然而，James Rollins 在小說《The 6th Extinction》中也以伯德站為原型塑造陷入危機的南極研究站。"}, "answer": "A", "expl": "Choice A uses 'both' to show what the movie and the novel have in common.", "explZh": "A 用「both」表達電影與小說的共同點。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Neuschwanstein Castle is in Bavaria, Germany.<br>- It was built in the 1800s for King Ludwig II.<br>- Walt Disney used it as a model for Sleeping Beauty Castle at Disneyland.<br>- The animated film Frozen also drew on castles in this style.<br>- The video game Castle Quest used Neuschwanstein as a model for its royal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=palace\" target=\"_blank\" rel=\"noopener\" data-w=\"palace\" data-pos=\"n.\" data-en=\"the large official home of a king, queen, or ruler\" data-zh=\"宮殿\">palace<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Neuschwanstein Castle is in Bavaria, Germany.\n- It was built in the 1800s for King Ludwig II.\n- Walt Disney used it as a model for Sleeping Beauty Castle at Disneyland.\n- The animated film Frozen also drew on castles in this style.\n- The video game Castle Quest used Neuschwanstein as a model for its royal palace.", "stem": "The student wants to highlight a similarity between Disneyland's Sleeping Beauty Castle and the palace in Castle Quest. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調迪士尼樂園睡美人城堡與《Castle Quest》中皇宮的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 新天鵝堡位於德國巴伐利亞。\n- 它是在 1800 年代為國王路德維希二世建造的。\n- 華特·迪士尼以它為原型，打造了迪士尼樂園的睡美人城堡。\n- 動畫電影《冰雪奇緣》也參考了這種風格的城堡。\n- 電玩遊戲《Castle Quest》以新天鵝堡為原型設計了其中的皇宮。", "opts": {"A": "Both Disneyland's Sleeping Beauty Castle and the royal palace in Castle Quest were modeled on Neuschwanstein Castle.", "B": "Neuschwanstein Castle was built in the 1800s for King Ludwig II.", "C": "Neuschwanstein Castle is located in Bavaria, Germany.", "D": "Walt Disney used Neuschwanstein as a model; however, the makers of Castle Quest used it too."}, "optsZh": {"A": "迪士尼樂園的睡美人城堡和《Castle Quest》中的皇宮都是以新天鵝堡為原型。", "B": "新天鵝堡是在 1800 年代為國王路德維希二世建造的。", "C": "新天鵝堡位於德國巴伐利亞。", "D": "華特·迪士尼以新天鵝堡為原型；然而，《Castle Quest》的製作者也以它為原型。"}, "answer": "A", "expl": "A states what both works have in common: both were inspired by the same castle.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Monroeville is a small town in Alabama.<br>- Harper Lee grew up there.<br>- To Kill a Mockingbird is set in Maycomb, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiction\" target=\"_blank\" rel=\"noopener\" data-w=\"fiction\" data-pos=\"n.\" data-en=\"stories about imaginary people and events\" data-zh=\"小說；虛構作品\">fictional<\/a> town based on Monroeville.<br>- Truman Capote also grew up in Monroeville.<br>- Capote&#x27;s novel Other Voices, Other Rooms includes a town based on Monroeville.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Monroeville is a small town in Alabama.\n- Harper Lee grew up there.\n- To Kill a Mockingbird is set in Maycomb, a fictional town based on Monroeville.\n- Truman Capote also grew up in Monroeville.\n- Capote's novel Other Voices, Other Rooms includes a town based on Monroeville.", "stem": "The student wants to highlight a similarity between To Kill a Mockingbird and Other Voices, Other Rooms. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調《梅岡城故事》與《別的聲音，別的房間》之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 門羅維爾是阿拉巴馬州的一個小鎮。\n- Harper Lee 在那裡長大。\n- 《梅岡城故事》的背景設定在梅岡，一個以門羅維爾為原型的虛構小鎮。\n- Truman Capote 也在門羅維爾長大。\n- Capote 的小說《別的聲音，別的房間》中有一個以門羅維爾為原型的小鎮。", "opts": {"A": "Harper Lee and Truman Capote grew up in Alabama.", "B": "Monroeville is a small town in Alabama.", "C": "Both To Kill a Mockingbird and Other Voices, Other Rooms feature fictional towns based on Monroeville, Alabama.", "D": "To Kill a Mockingbird is set in Maycomb; however, Other Voices, Other Rooms includes a town based on Monroeville."}, "optsZh": {"A": "Harper Lee 和 Truman Capote 都在阿拉巴馬州長大。", "B": "門羅維爾是阿拉巴馬州的一個小鎮。", "C": "《梅岡城故事》和《別的聲音，別的房間》都有以阿拉巴馬州門羅維爾為原型的虛構小鎮。", "D": "《梅岡城故事》的背景設定在梅岡；然而，《別的聲音，別的房間》中有一個以門羅維爾為原型的小鎮。"}, "answer": "C", "expl": "C directly states the shared feature: both novels are set in the same real town.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> has taken the following notes:<br>- Skellig Michael is a rocky island off the coast of Ireland.<br>- Monks built stone huts there more than 1,000 years ago.<br>- Star Wars: The Force Awakens filmed scenes on the island.<br>- Star Wars: The Last Jedi also filmed scenes there.<br>- The island is a UNESCO World Heritage Site.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Skellig Michael is a rocky island off the coast of Ireland.\n- Monks built stone huts there more than 1,000 years ago.\n- Star Wars: The Force Awakens filmed scenes on the island.\n- Star Wars: The Last Jedi also filmed scenes there.\n- The island is a UNESCO World Heritage Site.", "stem": "The student wants to highlight a similarity between The Force Awakens and The Last Jedi. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調《原力覺醒》與《最後的絕地武士》之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 斯凱利格·麥可島是愛爾蘭外海一座多岩石的島嶼。\n- 一千多年前，修士在那裡建造了石屋。\n- 《星際大戰：原力覺醒》在這座島上拍攝了一些場景。\n- 《星際大戰：最後的絕地武士》也在那裡拍攝了一些場景。\n- 這座島是聯合國教科文組織世界遺產。", "opts": {"A": "Skellig Michael is a UNESCO World Heritage Site off the coast of Ireland.", "B": "Both The Force Awakens and The Last Jedi filmed scenes on Skellig Michael, a rocky island off the coast of Ireland.", "C": "Monks built stone huts on Skellig Michael more than 1,000 years ago.", "D": "The Force Awakens filmed on Skellig Michael; in contrast, The Last Jedi also filmed there."}, "optsZh": {"A": "斯凱利格·麥可島是愛爾蘭外海的聯合國教科文組織世界遺產。", "B": "《原力覺醒》和《最後的絕地武士》都在愛爾蘭外海的多岩島嶼斯凱利格·麥可島上拍攝場景。", "C": "一千多年前，修士在斯凱利格·麥可島上建造了石屋。", "D": "《原力覺醒》在斯凱利格·麥可島拍攝；相比之下，《最後的絕地武士》也在那裡拍攝。"}, "answer": "B", "expl": "B uses \"both\" to highlight that the two films used the same island as a model.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Titanic was a British <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=passenger\" target=\"_blank\" rel=\"noopener\" data-w=\"passenger\" data-pos=\"n.\" data-en=\"a person traveling in a vehicle, ship, or plane who is not driving it\" data-zh=\"乘客\">passenger<\/a> ship that sank in 1912.<br>- More than 1,500 people died.<br>- James Cameron&#x27;s film Titanic (1997) recreated the ship in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detail<\/a>.<br>- Clive Cussler&#x27;s novel Raise the Titanic! (1976) imagines the ship being lifted from the ocean floor.<br>- The wreck was found in 1985.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Titanic was a British passenger ship that sank in 1912.\n- More than 1,500 people died.\n- James Cameron's film Titanic (1997) recreated the ship in detail.\n- Clive Cussler's novel Raise the Titanic! (1976) imagines the ship being lifted from the ocean floor.\n- The wreck was found in 1985.", "stem": "The student wants to highlight a similarity between Cameron's film and Cussler's novel. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Cameron 的電影與 Cussler 的小說之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 鐵達尼號是一艘於 1912 年沉沒的英國客輪。\n- 超過 1,500 人罹難。\n- James Cameron 的電影《鐵達尼號》（1997）詳細重現了這艘船。\n- Clive Cussler 的小說《Raise the Titanic!》（1976）想像這艘船從海底被打撈起來。\n- 沉船殘骸於 1985 年被發現。", "opts": {"A": "The Titanic sank in 1912, and more than 1,500 people died.", "B": "The wreck of the Titanic was found in 1985.", "C": "James Cameron's Titanic was released in 1997.", "D": "Both James Cameron's film Titanic and Clive Cussler's novel Raise the Titanic! are based on the real ship that sank in 1912."}, "optsZh": {"A": "鐵達尼號於 1912 年沉沒，超過 1,500 人罹難。", "B": "鐵達尼號的殘骸於 1985 年被發現。", "C": "James Cameron 的《鐵達尼號》於 1997 年上映。", "D": "James Cameron 的電影《鐵達尼號》和 Clive Cussler 的小說《Raise the Titanic!》都取材自 1912 年沉沒的真實船隻。"}, "answer": "D", "expl": "D clearly states what the two works share: the same real ship as a model.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Rhetorical Synthesis: highlight a similarity between two works that used the same real-world model.", "vocab": false, "body": "While <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researching\" target=\"_blank\" rel=\"noopener\">researching<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> has taken the following notes:<br>- Christ Church is a college of Oxford University.<br>- Its dining hall was built in the 1500s.<br>- The Harry Potter films used the hall as a model for Hogwarts&#x27; Great Hall.<br>- The video game Spellbound Academy also used the hall as a model for its school dining room.<br>- Christ Church has more than 600 students.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Christ Church is a college of Oxford University.\n- Its dining hall was built in the 1500s.\n- The Harry Potter films used the hall as a model for Hogwarts' Great Hall.\n- The video game Spellbound Academy also used the hall as a model for its school dining room.\n- Christ Church has more than 600 students.", "stem": "The student wants to highlight a similarity between depictions of fictional schools in two works. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調兩部作品中虛構學校描寫的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 基督教會學院是牛津大學的一所學院。\n- 它的餐廳建於 1500 年代。\n- 哈利波特電影以這個餐廳為原型，打造霍格華茲的大廳。\n- 電玩遊戲《Spellbound Academy》也以這個餐廳為原型，設計學校的餐廳。\n- 基督教會學院有超過 600 名學生。", "opts": {"A": "Both the Harry Potter films and the video game Spellbound Academy used Christ Church's dining hall as a model for a school dining hall.", "B": "Christ Church's dining hall was built in the 1500s.", "C": "Christ Church is a college of Oxford University with more than 600 students.", "D": "The Harry Potter films used Christ Church's dining hall as a model; however, Spellbound Academy used it as a model too."}, "optsZh": {"A": "哈利波特電影和電玩遊戲《Spellbound Academy》都以基督教會學院的餐廳為原型，打造學校的餐廳。", "B": "基督教會學院的餐廳建於 1500 年代。", "C": "基督教會學院是牛津大學的一所學院，有超過 600 名學生。", "D": "哈利波特電影以基督教會學院的餐廳為原型；然而，《Spellbound Academy》也以它為原型。"}, "answer": "A", "expl": "A uses \"both\" to show the shared model for the two fictional schools.", "explZh": ""}];
    const SLUG = 'dsat_tprincetonm1';
    const SOURCE = 'Princeton Digital SAT Mock Test, Module 1';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        sessionWrong[q.id] = { picked, ts: Date.now(), count: (sessionWrong[q.id]?.count || 0) + 1 };
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    const sessionWrong = {}; // questions answered wrong since this page was opened (kept even if fixed later)
    function wrongList(scope = 'all') {
      const w = scope === 'session' ? sessionWrong : loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    // list for downloads: the chosen scope; if "this attempt" is empty, offer the saved list instead
    function dlList() {
      let scope = document.getElementById('dlScope').value;
      let list = wrongList(scope);
      if (!list.length && scope === 'session') {
        const all = wrongList('all');
        if (!all.length) { alert('還沒有錯題 No wrong questions yet. 作答後答錯的題目會自動收錄。'); return null; }
        if (!confirm(`本次作答還沒有錯題。要改下載全部錯題本（${all.length} 題）嗎？\nNo wrong answers in this attempt yet. Download all ${all.length} saved wrong questions instead?`)) return null;
        scope = 'all'; list = all;
      }
      if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return null; }
      return { list, scope, tag: scope === 'session' ? 'this_attempt' : 'all_saved', label: scope === 'session' ? '本次作答 This attempt' : '全部錯題本 All saved' };
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 · ${label} (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${tag}_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag } = sel;
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${tag}_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // Word handout: Part 1 = redo the questions (no answers), Part 2 = answer key with explanations + 中文翻譯
    document.getElementById('btnDlDoc').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      const body = q => String(q.body || '').replace(/<a\b[^>]*>/g, '').replace(/<\/a>/g, '');
      const opts = q => ['A','B','C','D'].map(L => `<p class="opt">${L}) ${esc(q.opts[L] || '')}</p>`).join('');
      const part1 = list.map(({q}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}</p>
        <p>${body(q)}</p><p class="stem">${esc(q.stem || '')}</p>${opts(q)}<p class="ans">Answer 作答：______</p></div>`).join('');
      const part2 = list.map(({q, meta}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}　Your answer 你的答案：${esc(meta.picked)}　Correct 正確答案：<b>${esc(q.answer)}</b>${meta.count > 1 ? `　(錯 ${meta.count} 次)` : ''}</p><p class="tag">${esc(q.concept)}</p>
        <p class="ex">${esc(q.expl || '')}</p>${q.explZh ? `<p class="ex">解析：${esc(q.explZh)}</p>` : ''}
        <p class="zh">${esc(q.bodyZh || '')}</p><p class="zh">${esc(q.stemZh || '')}</p>
        ${['A','B','C','D'].map(L => `<p class="zh">${L}) ${esc(q.optsZh[L] || '')}</p>`).join('')}</div>`).join('');
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(SOURCE)} 錯題講義</title>
        <style>body{font-family:Calibri,"Microsoft JhengHei",sans-serif;font-size:11pt;line-height:1.4}h1{font-size:16pt;margin:0}h2{font-size:13pt;border-bottom:1px solid #999;margin-top:18pt}
        .q{margin:0 0 12pt}.qh{font-weight:bold;margin:0 0 4pt}.tag{font-weight:normal;color:#555;font-size:9pt}.stem{font-weight:bold}.opt{margin:0 0 0 18pt}.ans{margin-top:4pt;color:#333}
        .ex{margin:2pt 0;color:#14532d}.zh{margin:2pt 0;color:#5b3a8a;font-size:10pt}p{margin:3pt 0}</style></head><body>
        <h1>${esc(SOURCE)} — 錯題講義 Wrong-Question Review</h1><p>${label} · ${list.length} 題 · ${d}　Name 姓名：____________</p>
        <h2>Part 1 重新作答 Try again (no answers)</h2>${part1}
        <br style="page-break-before:always" clear="all"><h2>Part 2 解答與解析 Answer key & explanations</h2>${part2}</body></html>`;
      download(`${SLUG}_wrong_questions_${tag}_${d}.doc`, html, 'application/msword;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
