ares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一段文字指出，一位村長在做決定前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader makes decisions without hearing others.", "B": "The leader values inclusive deliberation.", "C": "The leader is unable to reach conclusions.", "D": "The leader dislikes public meetings."}, "optsZh": {"A": "這位領導人做決定時不聽取他人意見。", "B": "這位領導人重視兼容並蓄的審議。", "C": "這位領導人無法做出結論。", "D": "這位領導人不喜歡公開會議。"}, "answer": "B", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: octopus garden reproduction", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the size or amount found by measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She rejects all imaginative thinking.", "C": "She publishes claims before testing them.", "D": "She avoids working with students."}, "optsZh": {"A": "她兼具思想上的開放與嚴謹的標準。", "B": "她排斥一切富有想像力的思考。", "C": "她在驗證之前就發表主張。", "D": "她避免與學生合作。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "The following text is from Thomas Mann’s 1924 novel The Magic Mountain, translated by John E. Woods in 1995.<br><br>The story of Hans Castorp that we intend to tell here—not for his sake (for the reader will come to know him as a perfectly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ordinary\" target=\"_blank\" rel=\"noopener\" data-w=\"ordinary\" data-pos=\"adj.\" data-en=\"normal or usual; not special\" data-zh=\"普通的；平常的\">ordinary<\/a>, if <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=engaging\" target=\"_blank\" rel=\"noopener\" data-w=\"engaging\" data-pos=\"adj.\" data-en=\"pleasant and attractive; holding interest\" data-zh=\"迷人的；引人入勝的\">engaging<\/a> young man), but for the sake of the story itself, which seems to us to be very much worth telling (although in Hans Castorp’s favor it should be noted that it is his story, and that not every story happens to everybody)—is a story that took place long ago, and is, so to speak, covered with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patina\" target=\"_blank\" rel=\"noopener\" data-w=\"patina\" data-pos=\"n.\" data-en=\"a thin surface layer that develops with age; an appearance of age\" data-zh=\"銅綠；歲月的痕跡\">patina<\/a> of history and must <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=necessarily\" target=\"_blank\" rel=\"noopener\" data-w=\"necessarily\" data-pos=\"adv.\" data-en=\"in a way that cannot be avoided\" data-zh=\"必然地\">necessarily<\/a> be told with verbs whose tense is that of the deepest past.", "bodyPlain": "The following text is from Thomas Mann’s 1924 novel The Magic Mountain, translated by John E. Woods in 1995.\n\nThe story of Hans Castorp that we intend to tell here—not for his sake (for the reader will come to know him as a perfectly ordinary, if engaging young man), but for the sake of the story itself, which seems to us to be very much worth telling (although in Hans Castorp’s favor it should be noted that it is his story, and that not every story happens to everybody)—is a story that took place long ago, and is, so to speak, covered with the patina of history and must necessarily be told with verbs whose tense is that of the deepest past.", "stem": "What does the text most strongly suggest about the story of Hans Castorp?", "stemZh": "關於 Hans Castorp 的故事，本文最強烈暗示了什麼？", "bodyZh": "以下文字出自 Thomas Mann 1924 年的小說《The Magic Mountain》，由 John E.Woods 於 1995 年翻譯。\n我們打算在這裡講述的 Hans Castorp 的故事——不是為了他本人（因為讀者會發現他是一個極其普通、雖然討人喜歡的年輕人），而是為了故事本身，我們認為這個故事非常值得一說（不過為 Hans Castorp 說句公道話，應該指出這是他的故事，而且並不是每個故事都會發生在每個人身上）——是一個很久以前發生的故事，可以說已蒙上了一層歷史的古銹，因此必然要用最遙遠的過去時態的動詞來講述。", "opts": {"A": "Though it is true that stories of even the most uninteresting people are themselves interesting because all people are unique, the reason this story is interesting is nonetheless difficult to understand because of the passage of time.", "B": "Even though it is a story of a person of no particular importance, its age and the manner in which it therefore must be told are both indicators that the story itself is important.", "C": "Like all stories about the lives of inconsequential people, this story must necessarily be related in a particular way if the reason the story is consequential is to be made evident to the audience.", "D": "It is a remarkable story that happened to an unremarkable person, though one could plausibly argue that because the story is valuable, some of its value accrues to the person at its center."}, "optsZh": {"A": "雖然即使是最無趣的人的故事本身也很有趣，因為每個人都是獨一無二的，但由於時間的流逝，這個故事有趣的原因仍然難以理解。", "B": "儘管這是一個關於無足輕重之人的故事，但它的年代以及因此必須採用的敘述方式，都顯示這個故事本身是重要的。", "C": "就像所有關於無足輕重之人的故事一樣，若要讓聽眾明白這個故事為何重要，就必須以特定方式來講述它。", "D": "這是一個發生在平凡人身上的非凡故事，不過也可以合理地主張，正因為這個故事有價值，其中心人物也因此分享了部分價值。"}, "answer": "D", "expl": "The narrator calls Castorp 'perfectly ordinary' but the story 'very much worth telling,' and notes in his favor that 'it is his story' — some of the story's value accrues to him.", "explZh": "敘述者稱 Castorp「完全平凡」，但這個故事「非常值得講述」，並替他說話指出「這是他的故事」——所以故事的價值有一部分歸於他。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚提供建議，因為在別人衝動行事時，她總能保持冷靜。敘述者強調她的關愛是真誠的，但在需要判斷時，她也能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She lacks affection for her family.", "C": "She is admired mainly for her wealth.", "D": "She shows unusual maturity and self-command."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她對家人缺乏感情。", "C": "她受人欽佩主要是因為她的財富。", "D": "她展現出不尋常的成熟與自制力。"}, "answer": "D", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在一部回憶錄中，一個孩子觀察到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，屋裡的每個人都會接受。敘述者解釋說，祖母的威信來自耐心，而非強勢。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The grandmother's influence is quiet but substantial.", "C": "The family ignores the grandmother's opinions.", "D": "The grandmother avoids family matters entirely."}, "optsZh": {"A": "敘述者認為耐心毫無用處。", "B": "祖母的影響力低調卻深遠。", "C": "家人忽視祖母的意見。", "D": "祖母完全避開家務事。"}, "answer": "B", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。一個故事描述一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是靠著他的精確才得以存續。", "opts": {"A": "The clerk intentionally creates errors.", "B": "The business fails because of excessive caution.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這名職員故意製造錯誤。", "B": "這家企業因過度謹慎而失敗。", "C": "這名職員的細心雖然造成不便，卻很有價值。", "D": "同事們比這名職員更精確。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一段文字指出，一位村長在做決定前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader values inclusive deliberation.", "B": "The leader dislikes public meetings.", "C": "The leader makes decisions without hearing others.", "D": "The leader is unable to reach conclusions."}, "optsZh": {"A": "這位領導人重視兼容並蓄的審議。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人做決定時不聽取他人意見。", "D": "這位領導人無法做出結論。"}, "answer": "A", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Literary Inference: ordinary person, remarkable story", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the size or amount found by measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She combines intellectual openness with rigorous standards.", "C": "She publishes claims before testing them.", "D": "She avoids working with students."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她兼具思想上的開放與嚴謹的標準。", "C": "她在驗證之前就發表主張。", "D": "她避免與學生合作。"}, "answer": "B", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "[Graph: <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percentage\" target=\"_blank\" rel=\"noopener\" data-w=\"percentage\" data-pos=\"n.\" data-en=\"an amount expressed as a part of 100\" data-zh=\"百分比\">Percentage<\/a> of Participants Who Mentioned Factors]<br><br>Researcher Judith Hilton and her team interviewed 55 people about which factors would make them switch from using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=single-use\" target=\"_blank\" rel=\"noopener\" data-w=\"single-use\" data-pos=\"adj.\" data-en=\"designed to be used only once\" data-zh=\"一次性的\">single-use<\/a> plastic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=container\" target=\"_blank\" rel=\"noopener\" data-w=\"container\" data-pos=\"n.\" data-en=\"an object such as a box or bottle used for holding things\" data-zh=\"容器\">containers<\/a> to reusable containers. The graph shows three of the factors mentioned in the interviews and the percentage of participants who mentioned them.", "bodyPlain": "[Graph: Percentage of Participants Who Mentioned Factors]\n\nResearcher Judith Hilton and her team interviewed 55 people about which factors would make them switch from using single-use plastic containers to reusable containers. The graph shows three of the factors mentioned in the interviews and the percentage of participants who mentioned them.", "stem": "According to the graph, about what percentage of participants mentioned costs in the interviews?", "stemZh": "根據圖表，大約有多少百分比的參與者在訪談中提到了成本？", "bodyZh": "[圖表：提及各項因素的參與者百分比]\n研究人員 Judith Hilton 和她的團隊訪談了 55 個人，詢問哪些因素會讓他們從使用一次性塑膠容器改為使用可重複使用的容器。這張圖表顯示訪談中提到的其中三項因素，以及提及這些因素的參與者百分比。", "opts": {"A": "10%", "B": "95%", "C": "25%", "D": "50%"}, "optsZh": {"A": "10%", "B": "95%", "C": "25%", "D": "50%"}, "answer": "C", "expl": "Read the bar for 'costs' on the graph (the graph image is not reproduced here); it shows roughly 25% of participants.", "explZh": "依圖表中「costs」那一條長條判讀（本頁未附原圖），約有 25% 的受訪者提到成本。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生聲稱，某位歷史學家將一位革命領袖視為國家象徵，更甚於一位務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且表現不一的執政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "圖表包含三個地區的資訊。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "有些農民種植蔬菜，而其他農民則種植穀物。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。天文學家聲稱，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "Some stars contain hydrogen and helium.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究恆星所使用的方法需要望遠鏡。", "B": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "有些恆星含有氫和氦。", "D": "有一顆岩石行星擁有稀薄的大氣層。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而來，而不是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Many performers learned songs from relatives.", "C": "Some songs use a meter also found in older European poetry.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有幾首民謠包含了當地歷史事件，以及在不同社群持續接觸之後所產生的混合音樂形式。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有些歌曲使用的格律也見於較古老的歐洲詩歌中。", "D": "有數個國家的學者研究這項傳統。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Quantitative Evidence: costs percentage", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The table includes more than one year.", "C": "The program took place in a community.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "與沒有實施該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "表格包含不只一個年份。", "C": "這項計畫是在一個社區中進行的。", "D": "兩個城鎮都有一些志工。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "A student in a political science course is writing a paper on Aristotle’s The Politics, in which Aristotle offers his opinion on political instability and gives advice on how constitutions can be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something in its original state\" data-zh=\"保存；維護\">preserved<\/a>. Aristotle observes that different forms of government can fall in different ways—for example, oligarchies might grant power to military leaders during wartime who refuse to relinquish that power during peacetime—but some methods of preserving order <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=apply\" target=\"_blank\" rel=\"noopener\" data-w=\"apply\" data-pos=\"v.\" data-en=\"to use something in a particular situation\" data-zh=\"應用；運用\">apply<\/a> across all forms of government. The student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n.\" data-en=\"a statement that something is true\" data-zh=\"主張；說法\">claims<\/a> that in particular Aristotle <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assert\" target=\"_blank\" rel=\"noopener\" data-w=\"assert\" data-pos=\"v.\" data-en=\"to state something firmly\" data-zh=\"斷言；主張\">asserts<\/a> that in a healthy state obedience to law must be as close to absolute as possible and that even minor infractions should not be ignored.", "bodyPlain": "A student in a political science course is writing a paper on Aristotle’s The Politics, in which Aristotle offers his opinion on political instability and gives advice on how constitutions can be preserved. Aristotle observes that different forms of government can fall in different ways—for example, oligarchies might grant power to military leaders during wartime who refuse to relinquish that power during peacetime—but some methods of preserving order apply across all forms of government. The student claims that in particular Aristotle asserts that in a healthy state obedience to law must be as close to absolute as possible and that even minor infractions should not be ignored.", "stem": "Which quotation from a philosopher’s analysis of The Politics would best support the student’s claim?", "stemZh": "哪一段出自某位哲學家對《The Politics》之分析的引文，最能支持該學生的主張？", "bodyZh": "一位修習政治學課程的學生正在撰寫一篇關於 Aristotle《The Politics》的報告，Aristotle 在書中提出了他對政治不穩定的看法，並就如何維護憲政體制提供建議。Aristotle 指出，不同形式的政府可能以不同的方式垮台——例如，寡頭政體可能在戰時將權力授予軍事領袖，而這些領袖到了和平時期卻拒絕交出權力——但有些維持秩序的方法適用於所有形式的政府。這位學生聲稱，Aristotle 特別主張，在一個健全的國家中，對法律的服從必須盡可能接近絕對，即使是輕微的違法行為也不應被忽視。", "opts": {"A": "“When constructing his argument regarding the characteristics of a well-functioning government, Aristotle asserts that ‘Transgression creeps in unperceived and at last ruins the state,’ illustrating this idea with a comparison to frequent small expenditures slowly and almost imperceptibly chipping away at a fortune until it is ultimately depleted.”", "B": "“When Aristotle writes on the necessity of avoiding corruption in government, he proposes that ‘every state should be so administered and so regulated by law that its magistrates cannot possibly make money.’ In particular, he thinks oligarchies are particularly susceptible to corruption through bribery.”", "C": "“When Aristotle considers the health of constitutions, he states that ‘Constitutions are preserved when their destroyers are at a distance, and sometimes also because they are near, for the fear of them makes the government keep in hand the constitution.’ He holds that rulers who wish to see constitutions preserved must continually remind the populace of the dangers that would result from a constitutional collapse.”", "D": "“When contrasting different forms of government, Aristotle holds that ‘oligarchies may last, not from any inherent stability in such forms of government, but because the rulers are on good terms both with the unenfranchised and with the governing classes.’ That is, oligarchic leaders who wish to hold on to power will introduce members of disenfranchised classes into government in a participatory role.”"}, "optsZh": {"A": "「Aristotle 在建構關於良好運作政府之特徵的論點時斷言：『違法行為在不知不覺中悄悄滲入，最終毀掉國家』，並以頻繁的小額開支緩慢且幾乎難以察覺地侵蝕一筆財富、直到最終耗盡為比喻來說明這個觀點。」", "B": "「Aristotle 在論述政府避免腐敗的必要性時提出：『每個國家都應該以法律如此管理與規範，使其官員絕不可能從中牟利。』他特別認為，寡頭政體尤其容易因賄賂而腐敗。」", "C": "「Aristotle 在思考政體的健全時指出：『當政體的破壞者遠在他方時，政體得以保存，有時也因為他們近在咫尺，因為對他們的恐懼使政府牢牢掌握政體。』他認為，希望政體得以保存的統治者，必須不斷提醒民眾政體崩潰會帶來的危險。」", "D": "「Aristotle 在對比不同的政府形式時認為：『寡頭政體之所以能持續，並非因為這類政府形式本身具有穩定性，而是因為統治者與無選舉權者及統治階級都關係良好。』也就是說，想要保住權力的寡頭領袖會讓被剝奪公民權的階級成員以參與者的角色進入政府。」"}, "answer": "A", "expl": "The student claims Aristotle wants near-absolute obedience and no tolerance for minor infractions; A quotes him saying small transgressions creep in unnoticed and ruin the state.", "explZh": "學生主張亞里斯多德認為守法必須近乎絕對、連小違規都不能忽視；A 引用他說「違法於不知不覺中滲入，終致國家毀滅」，最能支持。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生聲稱，某位歷史學家將一位革命領袖視為國家象徵，更甚於一位務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且表現不一的執政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種植蔬菜，而其他農民則種植穀物。", "B": "南部地區有被納入調查。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。天文學家聲稱，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究恆星所使用的方法需要望遠鏡。", "B": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "有一顆岩石行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而來，而不是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有數個國家的學者研究這項傳統。", "C": "有些歌曲使用的格律也見於較古老的歐洲詩歌中。", "D": "有幾首民謠包含了當地歷史事件，以及在不同社群持續接觸之後所產生的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence: Aristotle obedience to law", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program took place in a community."}, "optsZh": {"A": "與沒有實施該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "這項計畫是在一個社區中進行的。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "Almost all works of fiction contain references to the progression of time, including the time of day when events in a story take place. In a 2020 study, Allen Kim, Charuta Pethe, and Steven Skiena claim that an observable pattern in such references reflects a shift in human behavior prompted by the spread of electric lighting in the late nineteenth century. The researchers drew this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> from an analysis of more than 50,000 novels spanning many centuries and cultures, using software to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> and tally both specific time references—that is, clock phrases, such as 7 a.m. or 2:30 p.m.—and implied ones, such as mentions of meals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with a particular time of day.", "bodyPlain": "Almost all works of fiction contain references to the progression of time, including the time of day when events in a story take place. In a 2020 study, Allen Kim, Charuta Pethe, and Steven Skiena claim that an observable pattern in such references reflects a shift in human behavior prompted by the spread of electric lighting in the late nineteenth century. The researchers drew this conclusion from an analysis of more than 50,000 novels spanning many centuries and cultures, using software to recognize and tally both specific time references—that is, clock phrases, such as 7 a.m. or 2:30 p.m.—and implied ones, such as mentions of meals typically associated with a particular time of day.", "stem": "Which finding from the study, if true, would most directly support the researchers’ conclusion?", "stemZh": "研究中的哪一項發現若屬實，最能直接支持研究人員的結論？", "bodyZh": "幾乎所有小說作品都包含關於時間推移的描述，包括故事事件發生在一天中的哪個時刻。在一項 2020 年的研究中，Allen Kim、Charuta Pethe 和 Steven Skiena 聲稱，這類描述中可觀察到的一種模式，反映了十九世紀晚期電燈普及所引發的人類行為轉變。研究人員分析了跨越許多世紀與文化的五萬多部小說，並使用軟體辨識和統計明確的時間描述——也就是時鐘用語，例如上午 7 點或下午 2:30——以及隱含的時間描述，例如提到通常與一天中特定時刻相關的餐點，從而得出這個結論。", "opts": {"A": "Novels published after the year 1800 include the clock phrase 10 a.m. less often than novels published before the year 1800 do.", "B": "Novels published after 1880 contain significantly more references to activities occurring after 10 p.m. than do novels from earlier periods.", "C": "Among novels published in the nineteenth century, implied time references become steadily more common than clock phrases as publication dates approach 1900.", "D": "The time references of noon (12 p.m.) and midnight (12 a.m.) are used with roughly the same frequency in the novels."}, "optsZh": {"A": "1800 年之後出版的小說，使用鐘點用語「上午 10 點」的頻率低於 1800 年之前出版的小說。", "B": "1880 年之後出版的小說，提及晚上 10 點以後活動的次數明顯多於較早時期的小說。", "C": "在十九世紀出版的小說中，隨著出版年代接近 1900 年，隱含的時間指涉逐漸比鐘點用語更常見。", "D": "在這些小說中，正午（中午 12 點）和午夜（凌晨 12 點）這兩個時間詞的使用頻率大致相同。"}, "answer": "B", "expl": "If electric lighting changed behavior, novels after its spread (after 1880) should mention more late-night activities (after 10 p.m.).", "explZh": "如果電燈改變了人類的行為，那麼電燈普及後（1880 年以後）的小說應該會更常提到深夜（晚上 10 點以後）的活動。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生聲稱，某位歷史學家將一位革命領袖視為國家象徵，更甚於一位務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且表現不一的執政紀錄更重要。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "圖表包含三個地區的資訊。", "C": "有些農民種植蔬菜，而其他農民則種植穀物。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。天文學家聲稱，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "One rocky planet has a thin atmosphere.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究恆星所使用的方法需要望遠鏡。", "B": "有一顆岩石行星擁有稀薄的大氣層。", "C": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "D": "有些恆星含有氫和氦。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recogni
