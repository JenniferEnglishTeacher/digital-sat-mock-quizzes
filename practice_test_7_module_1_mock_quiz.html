": "Rivera 經常描繪勞動與工業的場景。", "D": "《Detroit Industry》和《Man at the Crossroads》都描繪了工廠工人操作機器或站在機器旁。"}, "answer": "D", "expl": "The answer states what the works share.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：Gwendolyn Brooks 的兩首詩聚焦於城市生活；一首描寫在巷弄中玩耍的孩子；另一首描寫鄰居們在公寓外聚集；目標是強調兩者的相似之處。", "opts": {"A": "Brooks wrote about many subjects besides cities.", "B": "Both poems portray everyday social life in the city.", "C": "The poems focus on different groups of people.", "D": "One poem describes children in alleys."}, "optsZh": {"A": "Brooks 除了城市之外，還寫過許多其他主題。", "B": "兩首詩都描繪了城市中的日常社交生活。", "C": "這些詩聚焦於不同的族群。", "D": "其中一首詩描寫了巷弄中的孩子。"}, "answer": "B", "expl": "The answer emphasizes the shared focus.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a> during migration; the goal is to emphasize a similarity.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Two photographs by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey uncertainty during migration; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：Dorothea Lange 的兩張照片呈現了流動移工家庭；一張照片拍的是一位母親和她的孩子；另一張拍的是一位父親站在一輛裝滿行李的汽車旁；兩張影像都傳達出遷徙途中的不確定感；目標是強調兩者的相似之處。", "opts": {"A": "One photograph includes a packed car.", "B": "The photographs show different members of migrant families.", "C": "Both photographs convey the uncertainty experienced by migrant families.", "D": "Lange photographed many people during the Great Depression."}, "optsZh": {"A": "其中一張照片拍到一輛塞滿物品的汽車。", "B": "這些照片呈現了移民家庭的不同成員。", "C": "兩張照片都傳達出移民家庭所經歷的不確定感。", "D": "Lange 在經濟大蕭條期間拍攝了許多人。"}, "answer": "C", "expl": "The answer states the similarity.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Two sculptures by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：Barbara Hepworth 的兩件雕塑都在實心造形中開了孔洞；這些孔洞讓光線得以穿透；兩件作品都促使觀者注意到內部與外部的空間；目標是強調兩者的相似之處。", "opts": {"A": "Both sculptures use openings through solid forms to draw attention to interior and exterior space.", "B": "One of the sculptures is displayed outdoors.", "C": "Hepworth often worked with abstract forms.", "D": "Light can pass through the openings in the sculptures."}, "optsZh": {"A": "兩件雕塑都在實心形體上開出孔洞，以引導觀者注意內部與外部空間。", "B": "其中一件雕塑展示於戶外。", "C": "Hepworth 經常創作抽象形體的作品。", "D": "光線可以穿過雕塑上的孔洞。"}, "answer": "A", "expl": "The answer emphasizes what the sculptures share.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Political scientist Graham Allison is known for his Thucydides trap <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theory\" target=\"_blank\" rel=\"noopener\" data-w=\"theory\" data-pos=\"n.\" data-en=\"an idea or explanation that is proposed to account for something\" data-zh=\"理論；推論\">theory<\/a>.<br>- Allison’s theory states that whenever “a rising power is threatening to displace a ruling power,” conflict is likely.<br>- The theory is based on Thucydides’s explanation of the conflict between Athens and Sparta.<br>- Thucydides wrote that “the rise of Athens and the fear this instilled in Sparta” made conflict “inevitable.”<br>- History <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=professor\" target=\"_blank\" rel=\"noopener\" data-w=\"professor\" data-pos=\"n.\" data-en=\"a senior teacher at a university\" data-zh=\"教授\">professor<\/a> Edmund Stewart recently challenged the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> basis of the theory.<br>- Stewart claimed that Athens was not a rising power and that the rivals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experienced<\/a> a “clash of cultures” instead.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Political scientist Graham Allison is known for his Thucydides trap theory.\n- Allison’s theory states that whenever “a rising power is threatening to displace a ruling power,” conflict is likely.\n- The theory is based on Thucydides’s explanation of the conflict between Athens and Sparta.\n- Thucydides wrote that “the rise of Athens and the fear this instilled in Sparta” made conflict “inevitable.”\n- History professor Edmund Stewart recently challenged the historical basis of the theory.\n- Stewart claimed that Athens was not a rising power and that the rivals experienced a “clash of cultures” instead.", "stem": "The student wants to use a quotation to challenge Thucydides’s explanation of the conflict between Athens and Sparta. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要引用一段話來質疑修昔底德對雅典與斯巴達之間衝突的解釋。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 政治學家 Graham Allison 以他的「修昔底德陷阱」理論聞名。\n- Allison 的理論指出，每當「一個崛起中的強權威脅要取代一個統治中的強權」時，衝突就很可能發生。\n- 這個理論是以 Thucydides 對雅典與斯巴達之間衝突的解釋為基礎。\n- Thucydides 寫道，「雅典的崛起以及這在斯巴達引發的恐懼」使衝突「無可避免」。\n- 歷史學教授 Edmund Stewart 最近質疑這個理論的歷史根據。\n- Stewart 主張，雅典並不是一個崛起中的強權，這兩個對手經歷的反而是一場「文化衝突」。", "opts": {"A": "According to Allison’s Thucydides trap theory, whenever “a rising power is threatening to displace a ruling power,” conflict is likely.", "B": "Thucydides wrote that conflict between the two powers was “inevitable,” although Stewart later challenged the historical basis of this claim.", "C": "According to Stewart, a “clash of cultures” between Athens and Sparta caused the conflict, not Athens’s rise.", "D": "Thucydides explained that conflict was caused by “the rise of Athens and the fear this instilled in Sparta,” but Allison disagreed, seeing the conflict as an example of the Thucydides trap."}, "optsZh": {"A": "根據 Allison 的修昔底德陷阱理論，每當「一個崛起中的強權威脅要取代統治中的強權」時，衝突就很可能發生。", "B": "修昔底德寫道，兩個強權之間的衝突是「不可避免的」，不過 Stewart 後來質疑了這項主張的歷史依據。", "C": "根據 Stewart 的說法，導致這場衝突的是雅典與斯巴達之間的「文化衝突」，而非雅典的崛起。", "D": "修昔底德解釋，衝突是由「雅典的崛起以及這在斯巴達所引發的恐懼」所造成的，但 Allison 並不同意，他將這場衝突視為修昔底德陷阱的一個例子。"}, "answer": "C", "expl": "C uses a quotation from Stewart ('clash of cultures') to challenge Thucydides's explanation that Athens's rise caused the conflict.", "explZh": "C 引用 Stewart 的話（「文化衝突」）來挑戰修昔底德「雅典崛起導致衝突」的解釋。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：現代的蘆葦船建造者使用成捆的當地蘆葦；部分合成繩索用於加固；大多數材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Although modern reed boats use some synthetic cord, most of their materials are traditional.", "B": "Synthetic cord is sometimes stronger than plant fiber.", "C": "Reed boats can be built for ceremonies and tourism.", "D": "Local reeds are gathered before boat construction begins."}, "optsZh": {"A": "雖然現代蘆葦船使用一些合成繩，但大部分材料仍是傳統的。", "B": "合成繩有時比植物纖維更堅固。", "C": "蘆葦船可以為了儀式和觀光而建造。", "D": "在開始造船之前，會先採集當地的蘆葦。"}, "answer": "A", "expl": "The answer makes the requested generalization.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adhesive\" target=\"_blank\" rel=\"noopener\" data-w=\"adhesive\" data-pos=\"n.\" data-en=\"a substance used to stick things together\" data-zh=\"黏著劑\">adhesives<\/a>; the goal is to generalize about materials.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern adhesives; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：仿製的中世紀魯特琴大多以楓木、雲杉和羊腸弦製成；製琴師有時會使用現代黏著劑；目標是概括說明所用的材料。", "opts": {"A": "Modern adhesives can help stabilize delicate instruments.", "B": "Replica medieval lutes are musical instruments.", "C": "Although replica medieval lutes may use modern adhesives, they are made mostly from traditional materials such as maple, spruce, and gut strings.", "D": "Maple and spruce are common woods in instrument making."}, "optsZh": {"A": "現代黏著劑有助於穩固脆弱的樂器。", "B": "仿製的中世紀魯特琴是樂器。", "C": "雖然仿製的中世紀魯特琴可能使用現代黏著劑，但它們大多以傳統材料製成，例如楓木、雲杉和羊腸弦。", "D": "楓木和雲杉是樂器製作中常見的木材。"}, "answer": "C", "expl": "The answer generalizes across materials.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof synthetic sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：當代的樹皮獨木舟製作者使用樺樹皮、雪松肋材和雲杉根綁紮；有時會加入少量防水合成密封劑；大多數材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Contemporary bark-canoe replicas are built mostly with traditional materials, though some makers add a small amount of modern sealant.", "B": "Cedar ribs help shape the canoe.", "C": "Synthetic sealant can help prevent leaks.", "D": "Birch bark is used on the exterior of many bark canoes."}, "optsZh": {"A": "當代樹皮獨木舟複製品大多以傳統材料建造，不過有些製作者會加入少量現代密封劑。", "B": "雪松肋材有助於塑造獨木舟的形狀。", "C": "合成密封劑有助於防止漏水。", "D": "許多樹皮獨木舟的外層使用樺樹皮。"}, "answer": "A", "expl": "The answer summarizes the mix of materials.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：仿製的古羅馬涼鞋使用皮革鞋底和綁帶；有些製作者會加入橡膠鞋墊以增加耐用度；大多數外露的材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Roman sandals had soles and straps.", "B": "Replica Roman sandals are made mostly with traditional visible materials, even though some include modern rubber inserts.", "C": "Leather was widely used in ancient footwear.", "D": "Rubber inserts make some replica sandals more durable."}, "optsZh": {"A": "羅馬涼鞋有鞋底和繫帶。", "B": "仿製的羅馬涼鞋大多以傳統且外觀可見的材料製成，儘管有些會加入現代橡膠鞋墊。", "C": "皮革在古代鞋履中被廣泛使用。", "D": "橡膠鞋墊使某些仿製涼鞋更耐穿。"}, "answer": "B", "expl": "The answer makes a generalization.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: quotation challenging Thucydides", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Builders of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Builders of historical kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：歷史風箏的製作者使用竹製骨架和紙張覆面；有時會以尼龍線取代絲線；大多數材料仍是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Silk was traditionally used to control kites.", "B": "Nylon thread is a modern material.", "C": "Bamboo frames give kites their shape.", "D": "Historical kite replicas usually rely on traditional bamboo and paper, although some builders substitute nylon thread for silk."}, "optsZh": {"A": "傳統上使用絲線來操控風箏。", "B": "尼龍線是一種現代材料。", "C": "竹製骨架賦予風箏形狀。", "D": "歷史風箏複製品通常依賴傳統的竹子和紙，不過有些製作者會以尼龍線取代絲線。"}, "answer": "D", "expl": "The answer generalizes about the material mix.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Researchers in a 2021 study wanted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> the rate at which 17 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">languages<\/a> conveyed both information and syllables.<br>- They <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculate\" target=\"_blank\" rel=\"noopener\" data-w=\"calculate\" data-pos=\"v.\" data-en=\"to find an answer using mathematics\" data-zh=\"計算\">calculated<\/a> the bits of information conveyed per second (the IR, or information rate).<br>- The IR was found to be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> consistent across the 17 languages (an average of 39 bits per second).<br>- They calculated the number of syllables spoken per second (the SR, or syllable rate).<br>- Spanish had the second-fastest SR (7.7 syllables per second).<br>- Vietnamese had the sixteenth-fastest SR (5.3 syllables per second).", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Researchers in a 2021 study wanted to determine the rate at which 17 languages conveyed both information and syllables.\n- They calculated the bits of information conveyed per second (the IR, or information rate).\n- The IR was found to be approximately consistent across the 17 languages (an average of 39 bits per second).\n- They calculated the number of syllables spoken per second (the SR, or syllable rate).\n- Spanish had the second-fastest SR (7.7 syllables per second).\n- Vietnamese had the sixteenth-fastest SR (5.3 syllables per second).", "stem": "The student wants to present an overview of the study’s findings. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要概述這項研究的發現。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 一項 2021 年研究的研究人員想要測定 17 種語言傳達資訊與音節的速率。\n- 他們計算了每秒傳達的資訊位元數（即 IR，資訊速率）。\n- 結果發現，17 種語言的 IR 大致一致（平均每秒 39 位元）。\n- 他們計算了每秒說出的音節數（即 SR，音節速率）。\n- 西班牙語的 SR 為第二快（每秒 7.7 個音節）。\n- 越南語的 SR 為第十六快（每秒 5.3 個音節）。", "opts": {"A": "The 2021 study determined the information rate (IR) of 17 languages in bits of information conveyed per second.", "B": "Researchers found that information was conveyed more quickly in Spanish, at 7.7 syllables per second, than in Vietnamese, at 5.3 syllables per second.", "C": "Vietnamese had the sixteenth-fastest syllable rate, lower than that of Spanish, which had the second-fastest; however, Spanish had the lower information rate of the two.", "D": "Though some of the languages differed in number of syllables spoken per second, all 17 conveyed information at roughly the same rate."}, "optsZh": {"A": "2021 年的研究測定了 17 種語言的資訊速率（IR），即每秒傳達的資訊位元數。", "B": "研究人員發現，西班牙語傳遞資訊的速度（每秒 7.7 個音節）比越南語（每秒 5.3 個音節）更快。", "C": "越南語的音節速度排名第十六，低於排名第二的西班牙語；然而，兩者之中西班牙語的資訊傳遞速度較低。", "D": "雖然這些語言每秒所說的音節數有所不同，但全部 17 種語言傳遞資訊的速度大致相同。"}, "answer": "D", "expl": "D gives an overview of the findings: syllable rates differed, but all 17 languages conveyed information at about the same rate.", "explZh": "D 概述研究發現：各語言每秒音節數不同，但 17 種語言傳遞資訊的速率大致相同。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：現代的蘆葦船建造者使用成捆的當地蘆葦；部分合成繩索用於加固；大多數材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Although modern reed boats use some synthetic cord, most of their materials are traditional.", "B": "Synthetic cord is sometimes stronger than plant fiber.", "C": "Local reeds are gathered before boat construction begins.", "D": "Reed boats can be built for ceremonies and tourism."}, "optsZh": {"A": "雖然現代蘆葦船使用一些合成繩，但大部分材料仍是傳統的。", "B": "合成繩有時比植物纖維更堅固。", "C": "在開始造船之前，會先採集當地的蘆葦。", "D": "蘆葦船可以為了儀式和觀光而建造。"}, "answer": "A", "expl": "The answer makes the requested generalization.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adhesive\" target=\"_blank\" rel=\"noopener\" data-w=\"adhesive\" data-pos=\"n.\" data-en=\"a substance used to stick things together\" data-zh=\"黏著劑\">adhesives<\/a>; the goal is to generalize about materials.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern adhesives; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：仿製的中世紀魯特琴大多以楓木、雲杉和羊腸弦製成；製琴師有時會使用現代黏著劑；目標是概括說明所用的材料。", "opts": {"A": "Maple and spruce are common woods in instrument making.", "B": "Modern adhesives can help stabilize delicate instruments.", "C": "Although replica medieval lutes may use modern adhesives, they are made mostly from traditional materials such as maple, spruce, and gut strings.", "D": "Replica medieval lutes are musical instruments."}, "optsZh": {"A": "楓木和雲杉是樂器製作中常見的木材。", "B": "現代黏著劑有助於穩固脆弱的樂器。", "C": "雖然仿製的中世紀魯特琴可能使用現代黏著劑，但它們大多以傳統材料製成，例如楓木、雲杉和羊腸弦。", "D": "仿製的中世紀魯特琴是樂器。"}, "answer": "C", "expl": "The answer generalizes across materials.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof synthetic sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：當代的樹皮獨木舟製作者使用樺樹皮、雪松肋材和雲杉根綁紮；有時會加入少量防水合成密封劑；大多數材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Synthetic sealant can help prevent leaks.", "B": "Cedar ribs help shape the canoe.", "C": "Birch bark is used on the exterior of many bark canoes.", "D": "Contemporary bark-canoe replicas are built mostly with traditional materials, though some makers add a small amount of modern sealant."}, "optsZh": {"A": "合成密封劑有助於防止漏水。", "B": "雪松肋材有助於塑造獨木舟的形狀。", "C": "許多樹皮獨木舟的外層使用樺樹皮。", "D": "當代樹皮獨木舟複製品大多以傳統材料建造，不過有些製作者會加入少量現代密封劑。"}, "answer": "D", "expl": "The answer summarizes the mix of materials.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：仿製的古羅馬涼鞋使用皮革鞋底和綁帶；有些製作者會加入橡膠鞋墊以增加耐用度；大多數外露的材料都是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Roman sandals had soles and straps.", "B": "Replica Roman sandals are made mostly with traditional visible materials, even though some include modern rubber inserts.", "C": "Leather was widely used in ancient footwear.", "D": "Rubber inserts make some replica sandals more durable."}, "optsZh": {"A": "羅馬涼鞋有鞋底和繫帶。", "B": "仿製的羅馬涼鞋大多以傳統且外觀可見的材料製成，儘管有些會加入現代橡膠鞋墊。", "C": "皮革在古代鞋履中被廣泛使用。", "D": "橡膠鞋墊使某些仿製涼鞋更耐穿。"}, "answer": "B", "expl": "The answer makes a generalization.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: overview language-rate study", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Builders of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Builders of historical kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：歷史風箏的製作者使用竹製骨架和紙張覆面；有時會以尼龍線取代絲線；大多數材料仍是傳統的；目標是概括說明所用的材料。", "opts": {"A": "Bamboo frames give kites their shape.", "B": "Historical kite replicas usually rely on traditional bamboo and paper, although some builders substitute nylon thread for silk.", "C": "Nylon thread is a modern material.", "D": "Silk was traditionally used to control kites."}, "optsZh": {"A": "竹製骨架賦予風箏形狀。", "B": "歷史風箏複製品通常依賴傳統的竹子和紙，不過有些製作者會以尼龍線取代絲線。", "C": "尼龍線是一種現代材料。", "D": "傳統上使用絲線來操控風箏。"}, "answer": "B", "expl": "The answer generalizes about the material mix.", "explZh": ""}];
    const SLUG = 'dsat_t7m1';
    const SOURCE = 'Digital SAT Practice Test 7, Module 1';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    function wrongList() {
      const w = loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
<script src="https://jenniferenglishteacher.github.io/SAT-learning-and-quiz-combined-sources/assets/sat-word-links.js?v=20261118a" defer></script>
