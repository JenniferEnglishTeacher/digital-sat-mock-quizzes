 probably not introduced to the archipelago by that migration.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌的所有版本都完全相同。", "B": "這首歌很可能不是由那次遷徙傳入該群島的。", "C": "這首歌在遷徙之後不可能發生改變。", "D": "那次遷徙一定比其他任何人類遷移開始得更早。"}, "answer": "B", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。研究某種偏遠島嶼作物的植物學家發現，島上的品種早在人類定居該島的數萬年前，就已與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "the crop was first domesticated on the island.", "C": "the island variety must be genetically identical to wild mainland plants.", "D": "mainland farmers acquired the crop from island communities."}, "optsZh": {"A": "人類定居可能並非這種植物最初抵達該島的原因。", "B": "這種作物最早是在島上被馴化的。", "C": "島上品種在基因上一定與大陸的野生植物完全相同。", "D": "大陸的農民從島上社群取得了這種作物。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separated\" target=\"_blank\" rel=\"noopener\" data-w=\"separated\" data-pos=\"v.\" data-en=\"kept apart or divided\" data-zh=\"分開；區隔\">separated<\/a> from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。研究人員原本認為，一種淡水螺是在人們開始於一連串湖泊之間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久就已彼此分離。因此，研究人員推斷 ______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "human activity made the populations genetically identical.", "C": "boats probably explain every modern snail population.", "D": "the snails likely spread through an earlier nonhuman mechanism."}, "optsZh": {"A": "在划船活動開始之前，這些湖泊中並沒有蝸牛。", "B": "人類活動使這些族群在基因上完全相同。", "C": "船隻大概能解釋所有現代蝸牛族群的分布。", "D": "這些蝸牛很可能是透過更早的非人為機制擴散的。"}, "answer": "D", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "One of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earliest\" target=\"_blank\" rel=\"noopener\" data-w=\"earliest\" data-pos=\"adj.\" data-en=\"happening or existing first, before all others\" data-zh=\"最早的\">earliest<\/a> known maps is a Babylonian clay <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tablet\" target=\"_blank\" rel=\"noopener\" data-w=\"tablet\" data-pos=\"n.\" data-en=\"a flat piece of stone or clay with writing on it\" data-zh=\"碑；泥板\">tablet<\/a> thought to be almost 4,500 years old. The map _______ the area of a plot of land, shows a river <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=valley\" target=\"_blank\" rel=\"noopener\" data-w=\"valley\" data-pos=\"n.\" data-en=\"a low area of land between hills or mountains\" data-zh=\"山谷；河谷\">valley<\/a>, and includes the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cardinal\" target=\"_blank\" rel=\"noopener\" data-w=\"cardinal\" data-pos=\"adj.\" data-en=\"main or most important (cardinal directions: north, south, east, west)\" data-zh=\"主要的；基本的（方位）\">cardinal<\/a> directions.", "bodyPlain": "One of the earliest known maps is a Babylonian clay tablet thought to be almost 4,500 years old. The map _______ the area of a plot of land, shows a river valley, and includes the cardinal directions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "已知最早的地圖之一是一塊巴比倫泥板，據信已有將近 4,500 年的歷史。這張地圖 _______ 一塊土地的面積，呈現了一處河谷，並標示了基本方位。", "opts": {"A": "describes", "B": "describe", "C": "have described", "D": "are describing"}, "optsZh": {"A": "describes（單數現在式動詞，與單數主詞 The map 一致，並與 shows、includes 平行：正確）", "B": "describe（複數動詞 → 與單數主詞 The map 不一致：錯誤）", "C": "have described（複數現在完成式 → 與單數主詞 The map 不一致：錯誤）", "D": "are describing（正在描述：複數現在進行式 → 與單數主詞 map 不一致，錯誤）"}, "answer": "A", "expl": "The subject is the singular 'The map,' and the parallel verbs 'shows' and 'includes' are simple present, so 'describes' is needed.", "explZh": "主詞是單數的「The map」，且並列的動詞 shows、includes 都是簡單現在式，所以用「describes」。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "peoples story's", "C": "people's story's", "D": "people's stories"}, "optsZh": {"A": "peoples stories（people 缺少所有格撇號 → 錯誤）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "D": "people's stories（people 的所有格 + 複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "shelters", "B": "would shelter", "C": "sheltered", "D": "had sheltered"}, "optsZh": {"A": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "B": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "C": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "D": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）"}, "answer": "A", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively. During", "C": "triumphed--decisively, during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "C": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "have been", "B": "is", "C": "were", "D": "are"}, "optsZh": {"A": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "B": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "C": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "D": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）"}, "answer": "C", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: singular subject map takes describes", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype, later,", "B": "prototype later,", "C": "prototype,", "D": "prototype;"}, "optsZh": {"A": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "B": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "prototype;（分號，正確連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "Eighteen letters written by Louisa May Alcott, author of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=popular\" target=\"_blank\" rel=\"noopener\" data-w=\"popular\" data-pos=\"adj.\" data-en=\"liked or enjoyed by many people\" data-zh=\"受歡迎的；流行的\">popular<\/a> novel Little Women (1868), can be found at the New York Historical Society. _______ letters <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstrate\" target=\"_blank\" rel=\"noopener\" data-w=\"demonstrate\" data-pos=\"v.\" data-en=\"to show clearly by giving proof or examples\" data-zh=\"證明；展現\">demonstrate<\/a> Alcott’s keen business sense in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publisher\" target=\"_blank\" rel=\"noopener\" data-w=\"publisher\" data-pos=\"n.\" data-en=\"a person or company that prepares and sells books\" data-zh=\"出版商\">publishers<\/a>.", "bodyPlain": "Eighteen letters written by Louisa May Alcott, author of the popular novel Little Women (1868), can be found at the New York Historical Society. _______ letters demonstrate Alcott’s keen business sense in her interactions with publishers.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "Louisa May Alcott 是暢銷小說《Little Women》（1868 年）的作者，她所寫的十八封信可以在紐約歷史學會找到。_______ 信件展現了 Alcott 在與出版商往來時敏銳的商業頭腦。", "opts": {"A": "One", "B": "That", "C": "This", "D": "These"}, "optsZh": {"A": "One（一個：單數 → 與複數 letters 不一致，錯誤）", "B": "That（那個：單數 → 與複數 letters 不一致，錯誤）", "C": "This（這個：單數 → 與複數 letters 不一致，錯誤）", "D": "These（這些：複數指示詞，與複數 letters 一致：正確）"}, "answer": "D", "expl": "'Letters' is plural, so the plural demonstrative 'These' is needed.", "explZh": "「letters」是複數名詞，所以要用複數指示詞「These」。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's stories", "B": "peoples story's", "C": "peoples stories", "D": "people's story's"}, "optsZh": {"A": "people's stories（people 的所有格 + 複數名詞 stories：正確）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "peoples stories（people 缺少所有格撇號 → 錯誤）", "D": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）"}, "answer": "A", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "shelters", "C": "sheltered", "D": "had sheltered"}, "optsZh": {"A": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "B": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "C": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "D": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively during", "C": "triumphed--decisively. During", "D": "triumphed--decisively, during"}, "optsZh": {"A": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "B": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "D": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "are", "B": "have been", "C": "were", "D": "is"}, "optsZh": {"A": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）", "B": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "C": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "D": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）"}, "answer": "C", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: plural demonstrative these letters", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype, later,", "C": "prototype,", "D": "prototype;"}, "optsZh": {"A": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "prototype;（分號，正確連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "The Dust Bowl was a period of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=severe\" target=\"_blank\" rel=\"noopener\" data-w=\"severe\" data-pos=\"adj.\" data-en=\"very serious or harmful\" data-zh=\"嚴重的\">severe<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=drought\" target=\"_blank\" rel=\"noopener\" data-w=\"drought\" data-pos=\"n.\" data-en=\"a long period with little or no rain\" data-zh=\"乾旱\">drought<\/a> that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plagued\" target=\"_blank\" rel=\"noopener\" data-w=\"plagued\" data-pos=\"v.\" data-en=\"caused continual trouble or suffering to\" data-zh=\"使苦惱；困擾\">plagued<\/a> the Great Plains of the US during the 1930s. During this time, dust storms _______ over 100 million acres of land. They even reached as far east as New York City.", "bodyPlain": "The Dust Bowl was a period of severe drought that plagued the Great Plains of the US during the 1930s. During this time, dust storms _______ over 100 million acres of land. They even reached as far east as New York City.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "沙塵暴時期是 1930 年代侵襲美國大平原的一段嚴重乾旱時期。在這段期間，沙塵暴 _______ 超過一億英畝的土地。它們甚至遠達東邊的紐約市。", "opts": {"A": "are affecting", "B": "will have affected", "C": "will affect", "D": "affected"}, "optsZh": {"A": "are affecting（正在影響：現在進行式 → 與 1930 年代過去時間不符，錯誤）", "B": "will have affected（未來完成式 → 與過去時間不符：錯誤）", "C": "will affect（未來式 → 與描述 1930 年代的過去時間不符：錯誤）", "D": "affected（影響：過去式，與 1930 年代過去時間一致：正確）"}, "answer": "D", "expl": "The storms happened in the 1930s ('During this time'), and the next sentence uses past 'reached,' so simple past 'affected' is correct.", "explZh": "沙塵暴發生在 1930 年代（During this time），下一句也用過去式 reached，所以用簡單過去式「affected」。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's story's", "B": "peoples stories", "C": "people's stories", "D": "peoples story's"}, "optsZh": {"A": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "B": "peoples stories（people 缺少所有格撇號 → 錯誤）", "C": "people's stories（people 的所有格 + 複數名詞 stories：正確）", "D": "peoples story's（所有格位置錯誤 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "sheltered", "C": "had sheltered", "D": "shelters"}, "optsZh": {"A": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "B": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "C": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）", "D": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）"}, "answer": "D", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively--during", "C": "triumphed--decisively. During", "D": "triumphed--decisively, during"}, "optsZh": {"A": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "C": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "D": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "is", "B": "were", "C": "have been", "D": "are"}, "optsZh": {"A": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "B": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "C": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "D": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Grammar: past tense affected", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype,", "C": "prototype later,", "D": "prototype, later,"}, "optsZh": {"A": "prototype;（分號，正確連接兩個獨立子句：正確）", "B": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "C": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "D": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "Many mechanical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> were powered by a notched <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cylinder\" target=\"_blank\" rel=\"noopener\" data-w=\"cylinder\" data-pos=\"n.\" data-en=\"a solid or hollow tube with circular ends\" data-zh=\"圓柱體；汽缸\">cylinder<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> called the Leibniz wheel. Leibniz wheel calculators were popular in the first half of the twentieth _______ these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingenious\" target=\"_blank\" rel=\"noopener\" data-w=\"ingenious\" data-pos=\"adj.\" data-en=\"clever, original, and well designed\" data-zh=\"巧妙的；獨創的\">ingenious<\/a> devices were eventually replaced by electronic calculators.", "bodyPlain": "Many mechanical calculators were powered by a notched cylinder mechanism called the Leibniz wheel. Leibniz wheel calculators were popular in the first half of the twentieth _______ these ingenious devices were eventually replaced by electronic calculators.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "許多機械式計算機是由一種稱為萊布尼茲輪的帶凹槽圓柱機構所驅動。萊布尼茲輪計算機在二十 _______ 上半葉很受歡迎，這些巧妙的裝置最終被電子計算機所取代。", "opts": {"A": "century", "B": "century,", "C": "century, but", "D": "century that"}, "optsZh": {"A": "century（無標點 → 兩個獨立子句直接相連，造成連寫句：錯誤）", "B": "century,（僅逗號 → 造成逗號連接錯誤）", "C": "century, but（逗號＋對等連接詞 but，正確連接兩個獨立子句：正確）", "D": "century that（關係代名詞 that → 造成句構混亂：錯誤）"}, "answer": "C", "expl": "Two independent clauses are joined, and they contrast (popular, but eventually replaced), so a comma plus 'but' is correct.", "explZh": "前後是兩個獨立子句，且語意轉折（曾經流行，但後來被取代），所以用逗號加「but」連接。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "people's story's", "C": "peoples story's", "D": "people's stories"}, "optsZh": {"A": "peoples stories（people 缺少所有格撇號 → 錯誤）", "B": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "C": "peoples story's（所有格位置錯誤 → 錯誤）", "D": "people's stories（people 的所有格 + 複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "had sheltered", "B": "shelters", "C": "would shelter", "D": "sheltered"}, "optsZh": {"A": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）", "B": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "C": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "D": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively during", "C": "triumphed--decisively. During", "D": "triumphed--decisively, during"}, "optsZh": {"A": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "B": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "D": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "have been", "B": "were", "C": "is", "D": "are"}, "optsZh": {"A": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "B": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "C": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "D": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Grammar: comma plus but joins contrast", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype,", "C": "prototype later,", "D": "prototype, later,"}, "optsZh": {"A": "prototype;（分號，正確連接兩個獨立子句：正確）", "B": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "C": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "D": "prototype,
