wording depends on the precise relationship among the details rather than on a single isolated keyword. Guard cells regulate carbon dioxide intake. _______ they limit water loss by opening and closing pores.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。保衛細胞調節二氧化碳的吸收。_______ 它們藉由開闔氣孔來限制水分散失。", "opts": {"A": "Previously,", "B": "Instead,", "C": "In conclusion,", "D": "Additionally,"}, "optsZh": {"A": "Previously,（先前：表時間在前 → 錯誤）", "B": "Instead,（反而；取而代之：表替代 → 錯誤）", "C": "In conclusion,（總之：表總結 → 錯誤）", "D": "Additionally,（此外：表補充另一項功能或資訊：正確）"}, "answer": "D", "expl": "Additionally adds another function.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The archive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something in its original state\" data-zh=\"保存；維護\">preserves<\/a> letters from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activists<\/a>. _______ it contains <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> from the same campaigns.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archive preserves letters from activists. _______ it contains photographs from the same campaigns.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這個檔案館保存了社運人士的信件。_______ 它也收藏了同一系列運動的照片。", "opts": {"A": "Instead,", "B": "Earlier,", "C": "However,", "D": "Additionally,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代 → 錯誤）", "B": "Earlier,（較早之前：表時間在前 → 前後是補充關係，錯誤）", "C": "However,（然而：表轉折對比 → 前後是補充關係，錯誤）", "D": "Additionally,（此外：表補充另一項功能或資訊：正確）"}, "answer": "D", "expl": "Additionally adds information.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The device measures air <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>. _______ it records humidity every ten minutes.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The device measures air temperature. _______ it records humidity every ten minutes.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這個裝置可測量氣溫。_______ 它每十分鐘記錄一次濕度。", "opts": {"A": "Additionally,", "B": "Previously,", "C": "Instead,", "D": "In conclusion,"}, "optsZh": {"A": "Additionally,（此外：表補充另一項功能或資訊：正確）", "B": "Previously,（先前：表時間在前 → 錯誤）", "C": "Instead,（反而；取而代之：表替代 → 錯誤）", "D": "In conclusion,（總之：表總結 → 錯誤）"}, "answer": "A", "expl": "Additionally adds a second role.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. The course introduces grammar concepts. _______ it gives students practice applying those concepts in SAT-style passages.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The course introduces grammar concepts. _______ it gives students practice applying those concepts in SAT-style passages.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這門課程介紹文法概念。_______ 它讓學生在 SAT 風格的文章中練習應用這些概念。", "opts": {"A": "Instead,", "B": "In conclusion,", "C": "Additionally,", "D": "Previously,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代 → 錯誤）", "B": "In conclusion,（總之：表總結 → 錯誤）", "C": "Additionally,（此外：表補充另一項功能或資訊：正確）", "D": "Previously,（先前：表時間在前 → 錯誤）"}, "answer": "C", "expl": "Additionally adds a related feature.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The garden provides habitat for insects. _______ it reduces runoff after heavy rain.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The garden provides habitat for insects. _______ it reduces runoff after heavy rain.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這座花園為昆蟲提供棲地。_______ 它能在大雨後減少地表逕流。", "opts": {"A": "In conclusion,", "B": "Additionally,", "C": "Instead,", "D": "Previously,"}, "optsZh": {"A": "In conclusion,（總之：表總結 → 錯誤）", "B": "Additionally,（此外：表補充另一項功能或資訊：正確）", "C": "Instead,（反而；取而代之：表替代 → 錯誤）", "D": "Previously,（先前：表時間在前 → 錯誤）"}, "answer": "B", "expl": "Additionally adds another benefit.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Angana Chaudhuri is a scientist.<br>- Chaudhuri studies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sedimentary\" target=\"_blank\" rel=\"noopener\" data-w=\"sedimentary\" data-pos=\"adj.\" data-en=\"(of rock) formed from layers of material settled over time\" data-zh=\"沉積的\">sedimentary<\/a> rocks.<br>- A scientist who studies sedimentary rocks is called a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sedimentologist\" target=\"_blank\" rel=\"noopener\" data-w=\"sedimentologist\" data-pos=\"n.\" data-en=\"a scientist who studies sedimentary rocks and sediments\" data-zh=\"沉積學家\">sedimentologist<\/a>.<br>- Shale, chalk, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sandstone\" target=\"_blank\" rel=\"noopener\" data-w=\"sandstone\" data-pos=\"n.\" data-en=\"rock formed from grains of sand pressed together\" data-zh=\"砂岩\">sandstone<\/a> are examples of sedimentary rocks.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Angana Chaudhuri is a scientist.\n- Chaudhuri studies sedimentary rocks.\n- A scientist who studies sedimentary rocks is called a sedimentologist.\n- Shale, chalk, and sandstone are examples of sedimentary rocks.", "stem": "The student wants to identify what type of scientist Chaudhuri is. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要指出 Chaudhuri 是哪一類型的科學家。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- Angana Chaudhuri 是一位科學家。\n- Chaudhuri 研究沉積岩。\n- 研究沉積岩的科學家稱為沉積學家。\n- 頁岩、白堊和砂岩都是沉積岩的例子。", "opts": {"A": "Chalk is a type of sedimentary rock.", "B": "Some scientists study shale, chalk, and sandstone.", "C": "There are scientists who study sedimentary rocks.", "D": "Chaudhuri is a sedimentologist."}, "optsZh": {"A": "白堊是一種沉積岩。", "B": "有些科學家研究頁岩、白堊和砂岩。", "C": "有一些科學家研究沉積岩。", "D": "Chaudhuri 是一位沉積學家。"}, "answer": "D", "expl": "Only D directly states the type of scientist: Chaudhuri is a sedimentologist.", "explZh": "只有 D 直接說明她是哪一類科學家：Chaudhuri 是沉積學家。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Mira Shah 受託培育能耐受鹽鹼土壤的稻米；她將一種沿海稻種與一種高產量的農用品種雜交；所得的雜交品種在鹽鹼田中生長良好；目標是強調 Shah 的成就。", "opts": {"A": "By crossing a coastal rice variety with a high-yield farm variety, Shah succeeded in creating a rice hybrid that grew well in salty fields.", "B": "Shah was asked to work on rice because farmers needed a new variety.", "C": "Salty soil can make rice farming difficult in coastal regions.", "D": "One of the parent varieties used by Shah was known for high yield."}, "optsZh": {"A": "透過將沿海稻米品種與高產量農場品種雜交，Shah 成功培育出能在鹽分高的田地中良好生長的稻米雜交品種。", "B": "Shah 被要求研究稻米，因為農民需要一個新品種。", "C": "鹽分過高的土壤可能使沿海地區難以種植稻米。", "D": "Shah 所使用的親本品種之一以高產量著稱。"}, "answer": "A", "expl": "The answer emphasizes the achievement.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=combined\" target=\"_blank\" rel=\"noopener\" data-w=\"combined\" data-pos=\"v.\" data-en=\"joined or mixed together\" data-zh=\"結合；合併\">combined<\/a> ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Ruiz&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he combined ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to emphasize Ruiz's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：工程師 Daniel Ruiz 設計了一種低成本濾水器；他將陶土與木炭粉結合；這種濾水器不需用電就能去除污染物；目標是強調 Ruiz 的成就。", "opts": {"A": "Some communities need water filters that do not require electricity.", "B": "Daniel Ruiz was an engineer interested in public health.", "C": "Ruiz succeeded in designing a low-cost filter that removed contaminants without electricity.", "D": "Ceramic clay and powdered charcoal can be used in water filters."}, "optsZh": {"A": "有些社區需要不用電的濾水器。", "B": "Daniel Ruiz 是一位關注公共衛生的工程師。", "C": "Ruiz 成功設計出一種低成本、不需用電即可去除汙染物的濾水器。", "D": "陶土和木炭粉可用於濾水器中。"}, "answer": "C", "expl": "The answer highlights what Ruiz accomplished.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：化學家 Lina Okafor 研究可生物分解的包裝；她將樹薯澱粉與植物纖維混合；這種材料不易撕裂且分解迅速；目標是強調 Okafor 的成就。", "opts": {"A": "Cassava starch was one ingredient in Okafor's material.", "B": "Plant fibers can strengthen starch-based materials.", "C": "Biodegradable packaging can reduce plastic waste.", "D": "Okafor created a cassava-starch packaging material that resisted tearing and decomposed quickly."}, "optsZh": {"A": "木薯澱粉是 Okafor 所研發材料的成分之一。", "B": "植物纖維可以強化以澱粉為基礎的材料。", "C": "可生物分解的包裝能減少塑膠廢棄物。", "D": "Okafor 研發出一種以木薯澱粉製成的包裝材料，既耐撕又能快速分解。"}, "answer": "D", "expl": "The answer centers the achievement.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：建築師 Noor Haddad 為炎熱的沙漠氣候設計了一所學校；她採用有遮蔭的中庭和厚實的土牆；這棟建築幾乎不需機械空調就能保持涼爽；目標是強調 Haddad 的成就。", "opts": {"A": "Shaded courtyards can reduce heat in buildings.", "B": "The school was designed for a hot desert climate.", "C": "Using shaded courtyards and thick earthen walls, Haddad designed a school that stayed cool with little mechanical air-conditioning.", "D": "The building used thick earthen walls."}, "optsZh": {"A": "有遮蔭的庭院可以降低建築物內的熱度。", "B": "這所學校是為炎熱的沙漠氣候而設計的。", "C": "Haddad 利用有遮蔭的庭院和厚實的土牆，設計出一所幾乎不需機械空調就能保持涼爽的學校。", "D": "這棟建築使用厚實的土牆。"}, "answer": "C", "expl": "The answer emphasizes the successful result.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Student Notes: identify scientist type", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a> software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed translation software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：電腦科學家 Elena Park 為一種瀕危語言開發了翻譯軟體；她以社群錄製的故事訓練這套系統；這套軟體能產生準確的翻譯初稿；目標是強調 Park 的成就。", "opts": {"A": "Translation software often requires large amounts of language data.", "B": "Park developed translation software that produced accurate draft translations after being trained on community-recorded stories.", "C": "Community-recorded stories can help preserve endangered languages.", "D": "Elena Park worked with speakers of an endangered language."}, "optsZh": {"A": "翻譯軟體通常需要大量的語言資料。", "B": "Park 開發了一套翻譯軟體，在以社群錄製的故事進行訓練後，能產出準確的翻譯初稿。", "C": "由社群錄製的故事有助於保存瀕危語言。", "D": "Elena Park 曾與某種瀕危語言的使用者合作。"}, "answer": "B", "expl": "The answer states the achievement.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- “Raymond’s Run” is a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>.<br>- It was written by African American author Toni Cade Bambara.<br>- It was first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to make information available to the public\" data-zh=\"發表；出版\">published<\/a> in her book Gorilla, My Love in 1972.<br>- It is told from a first person <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>.<br>- It takes place in Harlem.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- “Raymond’s Run” is a short story.\n- It was written by African American author Toni Cade Bambara.\n- It was first published in her book Gorilla, My Love in 1972.\n- It is told from a first person perspective.\n- It takes place in Harlem.", "stem": "The student wants to indicate where the short story takes place. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要指出這篇短篇小說的故事發生地點。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 〈Raymond’s Run〉是一篇短篇小說。\n- 它的作者是非裔美國作家 Toni Cade Bambara。\n- 它於 1972 年首次發表於她的著作《Gorilla, My Love》中。\n- 它以第一人稱觀點敘述。\n- 故事發生在 Harlem。", "opts": {"A": "“Raymond’s Run” takes place in Harlem.", "B": "“Raymond’s Run” was published in Gorilla, My Love.", "C": "“Raymond’s Run” is told from a first person perspective.", "D": "“Raymond’s Run” was written by Toni Cade Bambara."}, "optsZh": {"A": "〈Raymond’s Run〉的故事發生在 Harlem。", "B": "〈Raymond’s Run〉收錄於《Gorilla, My Love》中出版。", "C": "〈Raymond’s Run〉是以第一人稱觀點敘述的。", "D": "〈Raymond’s Run〉是由 Toni Cade Bambara 所寫。"}, "answer": "A", "expl": "Only A states where the story takes place: Harlem.", "explZh": "只有 A 說明故事發生的地點：Harlem。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Mira Shah 受託培育能耐受鹽鹼土壤的稻米；她將一種沿海稻種與一種高產量的農用品種雜交；所得的雜交品種在鹽鹼田中生長良好；目標是強調 Shah 的成就。", "opts": {"A": "Shah was asked to work on rice because farmers needed a new variety.", "B": "Salty soil can make rice farming difficult in coastal regions.", "C": "By crossing a coastal rice variety with a high-yield farm variety, Shah succeeded in creating a rice hybrid that grew well in salty fields.", "D": "One of the parent varieties used by Shah was known for high yield."}, "optsZh": {"A": "Shah 被要求研究稻米，因為農民需要一個新品種。", "B": "鹽分過高的土壤可能使沿海地區難以種植稻米。", "C": "透過將沿海稻米品種與高產量農場品種雜交，Shah 成功培育出能在鹽分高的田地中良好生長的稻米雜交品種。", "D": "Shah 所使用的親本品種之一以高產量著稱。"}, "answer": "C", "expl": "The answer emphasizes the achievement.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=combined\" target=\"_blank\" rel=\"noopener\" data-w=\"combined\" data-pos=\"v.\" data-en=\"joined or mixed together\" data-zh=\"結合；合併\">combined<\/a> ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Ruiz&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he combined ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to emphasize Ruiz's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：工程師 Daniel Ruiz 設計了一種低成本濾水器；他將陶土與木炭粉結合；這種濾水器不需用電就能去除污染物；目標是強調 Ruiz 的成就。", "opts": {"A": "Ruiz succeeded in designing a low-cost filter that removed contaminants without electricity.", "B": "Ceramic clay and powdered charcoal can be used in water filters.", "C": "Some communities need water filters that do not require electricity.", "D": "Daniel Ruiz was an engineer interested in public health."}, "optsZh": {"A": "Ruiz 成功設計出一種低成本、不需用電即可去除汙染物的濾水器。", "B": "陶土和木炭粉可用於濾水器中。", "C": "有些社區需要不用電的濾水器。", "D": "Daniel Ruiz 是一位關注公共衛生的工程師。"}, "answer": "A", "expl": "The answer highlights what Ruiz accomplished.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：化學家 Lina Okafor 研究可生物分解的包裝；她將樹薯澱粉與植物纖維混合；這種材料不易撕裂且分解迅速；目標是強調 Okafor 的成就。", "opts": {"A": "Okafor created a cassava-starch packaging material that resisted tearing and decomposed quickly.", "B": "Biodegradable packaging can reduce plastic waste.", "C": "Plant fibers can strengthen starch-based materials.", "D": "Cassava starch was one ingredient in Okafor's material."}, "optsZh": {"A": "Okafor 研發出一種以木薯澱粉製成的包裝材料，既耐撕又能快速分解。", "B": "可生物分解的包裝能減少塑膠廢棄物。", "C": "植物纖維可以強化以澱粉為基礎的材料。", "D": "木薯澱粉是 Okafor 所研發材料的成分之一。"}, "answer": "A", "expl": "The answer centers the achievement.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：建築師 Noor Haddad 為炎熱的沙漠氣候設計了一所學校；她採用有遮蔭的中庭和厚實的土牆；這棟建築幾乎不需機械空調就能保持涼爽；目標是強調 Haddad 的成就。", "opts": {"A": "The school was designed for a hot desert climate.", "B": "The building used thick earthen walls.", "C": "Shaded courtyards can reduce heat in buildings.", "D": "Using shaded courtyards and thick earthen walls, Haddad designed a school that stayed cool with little mechanical air-conditioning."}, "optsZh": {"A": "這所學校是為炎熱的沙漠氣候而設計的。", "B": "這棟建築使用厚實的土牆。", "C": "有遮蔭的庭院可以降低建築物內的熱度。", "D": "Haddad 利用有遮蔭的庭院和厚實的土牆，設計出一所幾乎不需機械空調就能保持涼爽的學校。"}, "answer": "D", "expl": "The answer emphasizes the successful result.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Student Notes: indicate story setting", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a> software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed translation software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：電腦科學家 Elena Park 為一種瀕危語言開發了翻譯軟體；她以社群錄製的故事訓練這套系統；這套軟體能產生準確的翻譯初稿；目標是強調 Park 的成就。", "opts": {"A": "Elena Park worked with speakers of an endangered language.", "B": "Park developed translation software that produced accurate draft translations after being trained on community-recorded stories.", "C": "Community-recorded stories can help preserve endangered languages.", "D": "Translation software often requires large amounts of language data."}, "optsZh": {"A": "Elena Park 曾與某種瀕危語言的使用者合作。", "B": "Park 開發了一套翻譯軟體，在以社群錄製的故事進行訓練後，能產出準確的翻譯初稿。", "C": "由社群錄製的故事有助於保存瀕危語言。", "D": "翻譯軟體通常需要大量的語言資料。"}, "answer": "B", "expl": "The answer states the achievement.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The Royal Alcázar of Seville is a historic royal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=palace\" target=\"_blank\" rel=\"noopener\" data-w=\"palace\" data-pos=\"n.\" data-en=\"the large official home of a king, queen, or ruler\" data-zh=\"宮殿\">palace<\/a> in Andalucía, Spain.<br>- The palace is famous for its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tilework\" target=\"_blank\" rel=\"noopener\" data-w=\"tilework\" data-pos=\"n.\" data-en=\"decorative work made of tiles\" data-zh=\"磁磚裝飾\">tilework<\/a>.<br>- The palace features majolica and arista tiles.<br>- In the majolica style, designs are painted directly on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ceramic\" target=\"_blank\" rel=\"noopener\" data-w=\"ceramic\" data-pos=\"adj.\" data-en=\"made of clay that has been fired\" data-zh=\"陶瓷的\">ceramic<\/a> tiles.<br>- In the arista style, designs are stamped into the ceramic tiles.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Royal Alcázar of Seville is a historic royal palace in Andalucía, Spain.\n- The palace is famous for its intricate tilework.\n- The palace features majolica and arista tiles.\n- In the majolica style, designs are painted directly on the ceramic tiles.\n- In the arista style, designs are stamped into the ceramic tiles.", "stem": "The student wants to contrast the two styles of tiles. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要對比這兩種磁磚風格。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 塞維亞王宮（Royal Alcázar of Seville）是位於西班牙 Andalucía 的一座歷史悠久的皇家宮殿。\n- 這座宮殿以其精緻繁複的磁磚裝飾聞名。\n- 宮殿內有馬約利卡磁磚和 arista 磁磚。\n- 在馬約利卡風格中，圖案是直接畫在陶瓷磁磚上的。\n- 在 arista 風格中，圖案是壓印在陶瓷磁磚上的。", "opts": {"A": "Tiles in the majolica and arista styles can be found in the Royal Alcázar of Seville in Andalucía, Spain.", "B": "Featuring tiles in the majolica and arista styles, the Royal Alcázar of Seville in Spain is famous for its intricate tilework.", "C": "In the arista style, designs are stamped into the ceramic tiles, whereas in the majolica style, the designs are painted directly on them.", "D": "Among the famous tilework of the Royal Alcázar of Seville are majolica style tiles, made by painting designs directly on the ceramic tiles."}, "optsZh": {"A": "馬約利卡（majolica）和 arista 風格的磁磚可見於西班牙 Andalucía 的 Seville 王宮（Royal Alcázar）。", "B": "Royal Alcázar of Seville 以 majolica 和 arista 風格的磁磚為特色，以其精細的磁磚作品聞名。", "C": "arista 風格是將圖案壓印在陶瓷磁磚上，而 majolica 風格則是將圖案直接繪製在磁磚上。", "D": "Royal Alcázar of Seville 著名的磁磚作品中包括 majolica 風格的磁磚，其製作方式是直接在陶瓷磁磚上繪製圖案。"}, "answer": "C", "expl": "C contrasts the two styles: arista designs are stamped into tiles, whereas majolica designs are painted on them.", "explZh": "C 對比兩種風格：arista 是把圖案壓印在磁磚上，而 majolica 則是直接彩繪在磁磚上。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Maya Lin&#x27;s Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Maya Lin's Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：Maya Lin 的《Wave Field》運用隆起的土丘造形；她的《Storm King Wavefield》也運用隆起的土丘造形；兩件作品都邀請觀者漫步穿越雕塑出的地景；目標是強調兩者的相似之處。", "opts": {"A": "Wave Field was completed before Storm King Wavefield.", "B": "Maya Lin created several works that are installed outdoors.", "C": "Storm King Wavefield is larger than Wave Field.", "D": "Wave Field and Storm King Wavefield both use raised earth forms to create landscapes viewers can walk through."}, "optsZh": {"A": "《Wave Field》比《Storm King Wavefield》更早完成。", "B": "Maya Lin 創作了數件設置於戶外的作品。", "C": "《Storm King Wavefield》比《Wave Field》大。", "D": "《Wave Field》和《Storm King Wavefield》都利用隆起的土丘形體，創造出觀者可以穿行其中的地景。"}, "answer": "D", "expl": "The answer emphasizes the similarity.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：Diego Rivera 的兩幅壁畫描繪了工廠工人；《Detroit Industry》中有操作機器的工人；《Man at the Crossroads》中也有與機器一起出現的工人；目標是強調兩者的相似之處。", "opts": {"A": "Man at the Crossroads became controversial after it was commissioned.", "B": "Both Detroit Industry and Man at the Crossroads depict factory workers using or standing near machines.", "C": "Detroit Industry was painted in the United States.", "D": "Rivera often painted scenes of labor and industry."}, "optsZh": {"A": "《Man at the Crossroads》在受委託創作後引發爭議。", "B": "《Detroit Industry》和《Man at the Crossroads》都描繪了工廠工人操作機器或站在機器旁。", "C": "《Detroit Industry》是在美國繪製的。", "D": "Rivera 經常描繪勞動與工業的場景。"}, "answer": "B", "expl": "The answer states what the works share.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。筆記：Gwendolyn Brooks 的兩首詩聚焦於城市生活；一首描寫在巷弄中玩耍的孩子；另一首描寫鄰居們在公寓外聚集；目標是強調兩者的相似之處。", "opts": {"A": "Brooks wrote about many subjects besides cities.", "B": "One poem describes children in alleys.", "C": "Both poems portray everyday social life in the city.", "D": "The poems focus on different groups of people."}, "optsZh": {"A": "Brooks 除了城市之外，還寫過許多其他主題。", "B": "其中一首詩描寫了巷弄中的孩子。", "C": "兩首詩都描繪了城市中的日常社交生活。", "D": "這些詩聚焦於不同的族群。"}, "answer": "C", "expl": "The answer emphasizes the shared focus.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a> during migration; the goal is to emphasize a similarity.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Two photographs by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey uncertainty during migration; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：Dorothea Lange 的兩張照片呈現了流動移工家庭；一張照片拍的是一位母親和她的孩子；另一張拍的是一位父親站在一輛裝滿行李的汽車旁；兩張影像都傳達出遷徙途中的不確定感；目標是強調兩者的相似之處。", "opts": {"A": "Both photographs convey the uncertainty experienced by migrant families.", "B": "Lange photographed many people during the Great Depression.", "C": "One photograph includes a packed car.", "D": "The photographs show different members of migrant families."}, "optsZh": {"A": "兩張照片都傳達出移民家庭所經歷的不確定感。", "B": "Lange 在經濟大蕭條期間拍攝了許多人。", "C": "其中一張照片拍到一輛塞滿物品的汽車。", "D": "這些照片呈現了移民家庭的不同成員。"}, "answer": "A", "expl": "The answer states the similarity.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: contrast tile styles", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Two sculptures by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。筆記：Barbara Hepworth 的兩件雕塑都在實心造形中開了孔洞；這些孔洞讓光線得以穿透；兩件作品都促使觀者注意到內部與外部的空間；目標是強調兩者的相似之處。", "opts": {"A": "Hepworth often worked with abstract forms.", "B": "Light can pass through the openings in the sculptures.", "C": "One of the sculptures is displayed outdoors.", "D": "Both sculptures use openings through solid forms to draw attention to interior and exterior space."}, "optsZh": {"A": "Hepworth 經常創作抽象形體的作品。", "B": "光線可以穿過雕塑上的孔洞。", "C": "其中一件雕塑展示於戶外。", "D": "兩件雕塑都在實心形體上開出孔洞，以引導觀者注意內部與外部空間。"}, "answer": "D", "expl": "The answer emphasizes what the sculptures share.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Musicians around the world have used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protest\" target=\"_blank\" rel=\"noopener\" data-w=\"protest\" data-pos=\"n.\" data-en=\"a strong statement or action showing disagreement\" data-zh=\"抗議\">protest<\/a> songs to raise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> about human rights <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=violation\" target=\"_blank\" rel=\"noopener\" data-w=\"violation\" data-pos=\"n.\" data-en=\"an action that breaks a law, rule, or right\" data-zh=\"違反；侵犯\">violations<\/a>.<br>- US folk singer Aunt Molly Jackson released the protest song “Poor Miner’s Farewell” in 1932.<br>- It exposed the unlivable wages and dangerous working <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> coal miners faced in Kentucky during the 1920s and 1930s.<br>- South African singer-songwriter Hugh Masekela released the protest song “Bring Him Back Home” in 1987.<br>- It called on the South African government to free Nelson Mandela, an anti-apartheid leader who’d been unjustly imprisoned.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Musicians around the world have used protest songs to raise awareness about human rights violations.\n- US folk singer Aunt Molly Jackson released the protest song “Poor Miner’s Farewell” in 1932.\n- It exposed the unlivable wages and dangerous working conditions coal miners faced in Kentucky during the 1920s and 1930s.\n- South African singer-songwriter Hugh Masekela released the protest song “Bring Him Back Home” in 1987.\n- It called on the South African government to free Nelson Mandela, an anti-apartheid leader who’d been unjustly imprisoned.", "stem": "The student wants to contrast the song “Poor Miner’s Farewell” with the song “Bring Him Back Home.” Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要對比歌曲〈Poor Miner’s Farewell〉與歌曲〈Bring Him Back Home〉。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 世界各地的音樂家都曾以抗議歌曲來喚起人們對人權侵害的關注。\n- 美國民謠歌手 Aunt Molly Jackson 於 1932 年發行了抗議歌曲〈Poor Miner’s Farewell〉。\n- 這首歌揭露了 1920 和 1930 年代肯塔基州煤礦工人所面臨的難以維生的工資與危險的工作環境。\n- 南非創作歌手 Hugh Masekela 於 1987 年發行了抗議歌曲〈Bring Him Back Home〉。\n- 這首歌呼籲南非政府釋放 Nelson Mandela，他是一位遭到不公監禁的反種族隔離領袖。", "opts": {"A": "The songs “Poor Miner’s Farewell” and “Bring Him Back Home” both raised awareness about human rights violations.", "B": "While both are protest songs, “Poor Miner’s Farewell” is about coal miners in Kentucky, whereas “Bring Him Back Home” is about the anti-apartheid leader Nelson Mandela.", "C": "Hugh Masekela’s song “Bring Him Back Home,” released in 1987, called on the South African government to free Nelson Mandela.", "D": "Released in 1932 by Aunt Molly Jackson, the song “Poor Miner’s Farewell” was a protest against the unlivable wages and dangerous working conditions faced by Kentucky coal miners."}, "optsZh": {"A": "〈Poor Miner’s Farewell〉和〈Bring Him Back Home〉這兩首歌都提高了大眾對侵害人權行為的關注。", "B": "雖然兩首都是抗議歌曲，但〈Poor Miner’s Farewell〉是關於肯塔基州的煤礦工人，而〈Bring Him Back Home〉則是關於反種族隔離領袖 Nelson Mandela。", "C": "Hugh Masekela 於 1987 年發行的歌曲〈Bring Him Back Home〉呼籲南非政府釋放 Nelson Mandela。", "D": "由 Aunt Molly Jackson 於 1932 年發行的歌曲〈Poor Miner’s Farewell〉，抗議肯塔基州煤礦工人所面臨的無法維生的工資與危險的工作環境。"}, "answer": "B", "expl": "B uses 'while ... whereas' to contrast the two songs' subjects: Kentucky coal miners versus Nelson Mandela.", "explZh": "B 指出兩首都是抗議歌曲，再用 whereas 對比其主題：肯塔基州煤礦工人 vs. Nelson Mandela。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Maya Lin&#x27;s Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Maya Lin's Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：Maya Lin 的《Wave Field》運用隆起的土丘造形；她的《Storm King Wavefield》也運用隆起的土丘造形；兩件作品都邀請觀者漫步穿越雕塑出的地景；目標是強調兩者的相似之處。", "opts": {"A": "Storm King Wavefield is larger than Wave Field.", "B": "Maya Lin created several works that are installed outdoors.", "C": "Wave Field and Storm King Wavefield both use raised earth forms to create landscapes viewers can walk through.", "D": "Wave Field was completed before Storm King Wavefield."}, "optsZh": {"A": "《Storm King Wavefield》比《Wave Field》大。", "B": "Maya Lin 創作了數件設置於戶外的作品。", "C": "《Wave Field》和《Storm King Wavefield》都利用隆起的土丘形體，創造出觀者可以穿行其中的地景。", "D": "《Wave Field》比《Storm King Wavefield》更早完成。"}, "answer": "C", "expl": "The answer emphasizes the similarity.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: contrast protest songs", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：Diego Rivera 的兩幅壁畫描繪了工廠工人；《Detroit Industry》中有操作機器的工人；《Man at the Crossroads》中也有與機器一起出現的工人；目標是強調兩者的相似之處。", "opts": {"A": "Detroit Industry was painted in the United States.", "B": "Man at the Crossroads became controversial after it was commissioned.", "C": "Rivera often painted scenes of labor and industry.", "D": "Both Detroit Industry and Man at the Crossroads depict factory workers using or standing near machines."}, "optsZh": {"A": "《Detroit Industry》是在美國繪製的。", "B": "《Man at the Crossroads》在受委託創作後引發爭議。", "C
