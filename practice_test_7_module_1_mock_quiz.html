ze a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而來，而不是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有幾首民謠包含了當地歷史事件，以及在不同社群持續接觸之後所產生的混合音樂形式。", "B": "有數個國家的學者研究這項傳統。", "C": "有些歌曲使用的格律也見於較古老的歐洲詩歌中。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Command of Evidence: late-night activity after electric lighting", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這項計畫是在一個社區中進行的。", "B": "與沒有實施該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "表格包含不只一個年份。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "[Graph: Percentage of ULE Attributed to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">Population<\/a> Growth and GDP per Capita Growth in Two World Regions, by time period]<br><br>In a study of urban physical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expansion\" target=\"_blank\" rel=\"noopener\" data-w=\"expansion\" data-pos=\"n.\" data-en=\"an increase in size or area\" data-zh=\"擴張；擴展\">expansion<\/a>, Richa Mahtta et al. conducted a meta-analysis of more than 300 cities worldwide to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether urban land expansion (ULE) was more strongly influenced by urban population growth or by growth in gross domestic product (GDP) per capita, a measure of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=economic\" target=\"_blank\" rel=\"noopener\" data-w=\"economic\" data-pos=\"adj.\" data-en=\"related to money, trade, and industry\" data-zh=\"經濟的\">economic<\/a> activity. Because efficient national government is necessary to provide urban services and infrastructure that attract economic investment, Mahtta et al. propose that absent other factors, the importance of GDP per capita growth to ULE would likely increase relative to the importance of population growth as governments become more efficient. If true, this suggests the possibility that _______", "bodyPlain": "[Graph: Percentage of ULE Attributed to Population Growth and GDP per Capita Growth in Two World Regions, by time period]\n\nIn a study of urban physical expansion, Richa Mahtta et al. conducted a meta-analysis of more than 300 cities worldwide to determine whether urban land expansion (ULE) was more strongly influenced by urban population growth or by growth in gross domestic product (GDP) per capita, a measure of economic activity. Because efficient national government is necessary to provide urban services and infrastructure that attract economic investment, Mahtta et al. propose that absent other factors, the importance of GDP per capita growth to ULE would likely increase relative to the importance of population growth as governments become more efficient. If true, this suggests the possibility that _______", "stem": "Which choice most effectively uses data from the graph to complete the statement?", "stemZh": "哪一個選項最有效地運用圖表中的數據來完成這句敘述？", "bodyZh": "[圖表：兩個世界區域中歸因於人口成長與人均 GDP 成長的 ULE 百分比，依時期區分]\n在一項關於都市實體擴張的研究中，Richa Mahtta 等人對全球 300 多座城市進行了統合分析，以判斷都市土地擴張（ULE）受都市人口成長的影響較大，還是受人均國內生產毛額（GDP，一種衡量經濟活動的指標）成長的影響較大。由於有效率的中央政府是提供能吸引經濟投資之都市服務與基礎建設的必要條件，Mahtta 等人提出，在沒有其他因素的情況下，隨著政府變得更有效率，人均 GDP 成長對 ULE 的重要性相對於人口成長的重要性很可能會增加。如果這是真的，這表示有可能 _______", "opts": {"A": "national governments of countries in Region 1 experienced declines in efficiency in the period from 2000 to 2014, relative to the period from 1970 to 2000.", "B": "countries in Region 1 experienced a slower rate of economic growth in the period from 2000 to 2014 than countries in Region 2 did, despite increasing national government efficiency in Region 1.", "C": "national governments of most countries in Region 2 became more efficient in the period from 2000 to 2014 than they had been in the period from 1970 to 2000, but those of several countries in this region did not.", "D": "national governments of countries in Region 1 and in Region 2 generally became more efficient in the period from 2000 to 2014 than they had been in the period from 1970 to 2000, but at different rates."}, "optsZh": {"A": "區域 1 國家的中央政府在 2000 年至 2014 年期間，效率相較於 1970 年至 2000 年期間有所下降。", "B": "儘管區域 1 的國家政府效率提升，但在 2000 年至 2014 年期間，區域 1 國家的經濟成長速度仍比區域 2 國家慢。", "C": "區域 2 大多數國家的中央政府在 2000 年至 2014 年期間比 1970 年至 2000 年期間更有效率，但該區域有幾個國家並非如此。", "D": "區域 1 和區域 2 國家的中央政府在 2000 年至 2014 年期間，整體上都比 1970 年至 2000 年期間更有效率，但提升的速度不同。"}, "answer": "D", "expl": "In both regions the share of ULE attributed to GDP-per-capita growth rose from 1970–2000 to 2000–2014, by different amounts; per the hypothesis, governments in both regions became more efficient, at different rates.", "explZh": "兩個地區由人均 GDP 成長所造成的都市擴張比例，從 1970–2000 年到 2000–2014 年都上升了，但幅度不同；依該假說，表示兩地政府都變得更有效率，只是速度不同。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生聲稱，某位歷史學家將一位革命領袖視為國家象徵，更甚於一位務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且表現不一的執政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "有些農民種植蔬菜，而其他農民則種植穀物。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。天文學家聲稱，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究恆星所使用的方法需要望遠鏡。", "B": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "有一顆岩石行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而來，而不是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有些歌曲使用的格律也見於較古老的歐洲詩歌中。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有幾首民謠包含了當地歷史事件，以及在不同社群持續接觸之後所產生的混合音樂形式。", "D": "有數個國家的學者研究這項傳統。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Quantitative Evidence: GDP and population effects on ULE", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program took place in a community."}, "optsZh": {"A": "與沒有實施該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "這項計畫是在一個社區中進行的。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "A student is researching the Chinese government’s 1992 shift to a market economy that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> trade liberalization. One means of trade liberalization involves expanding from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ordinary\" target=\"_blank\" rel=\"noopener\" data-w=\"ordinary\" data-pos=\"adj.\" data-en=\"normal or usual; not special\" data-zh=\"普通的；平常的\">ordinary<\/a> imports into an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> on processing imports, which have two types: processing with assembly (in which a firm obtains raw materials from a foreign trading partner without payment and sells the final goods to that partner, charging for assembly) and processing with inputs (in which a firm expends <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=capital\" target=\"_blank\" rel=\"noopener\" data-w=\"capital\" data-pos=\"n.\" data-en=\"the city where a country&#x27;s government is\" data-zh=\"首都\">capital<\/a> to buy raw materials from a trading partner, processes them into final goods, and sells those goods to whichever trading partner it chooses). The student asserts that while initial efforts at trade liberalization were shaped by Chinese firms’ limited capital, this situation resolved during the 2000s.<br><br>[Graph: China&#x27;s Imports by Type, 2000-2006]", "bodyPlain": "A student is researching the Chinese government’s 1992 shift to a market economy that emphasizes trade liberalization. One means of trade liberalization involves expanding from ordinary imports into an emphasis on processing imports, which have two types: processing with assembly (in which a firm obtains raw materials from a foreign trading partner without payment and sells the final goods to that partner, charging for assembly) and processing with inputs (in which a firm expends capital to buy raw materials from a trading partner, processes them into final goods, and sells those goods to whichever trading partner it chooses). The student asserts that while initial efforts at trade liberalization were shaped by Chinese firms’ limited capital, this situation resolved during the 2000s.\n\n[Graph: China's Imports by Type, 2000-2006]", "stem": "Which choice best describes data from the graph that support the student’s assertion?", "stemZh": "哪一個選項最能描述圖表中支持該學生主張的數據？", "bodyZh": "一位學生正在研究中國政府於 1992 年轉向以貿易自由化為重點的市場經濟。貿易自由化的一種方式是從一般進口擴展到著重加工進口，而加工進口有兩種類型：來料加工裝配（企業向外國貿易夥伴無償取得原料，並將成品賣給該夥伴，收取裝配費用）以及進料加工（企業投入資本向貿易夥伴購買原料，將其加工成成品，再將這些成品賣給自己選擇的任何貿易夥伴）。這位學生主張，雖然最初的貿易自由化努力受到中國企業資本有限的影響，但這種情況在 2000 年代獲得了解決。\n[圖表：2000–2006 年中國各類型進口]", "opts": {"A": "Processing imports with inputs were greater than both ordinary imports and processing imports with assembly in 2006.", "B": "From 2000 to 2006, processing imports with inputs rose much more sharply than processing imports with assembly did.", "C": "From 2000 to 2006, neither processing imports with inputs nor processing imports with assembly were greater than ordinary imports.", "D": "Processing imports with assembly were greater in 2006 than processing imports with inputs in 2000."}, "optsZh": {"A": "2006 年，帶料加工進口同時高於一般進口和來料組裝加工進口。", "B": "從 2000 年到 2006 年，帶料加工進口的增幅遠比來料組裝加工進口急遽。", "C": "從 2000 年到 2006 年，無論是含投入品的加工進口或含組裝的加工進口，都沒有高於一般進口。", "D": "2006 年的來料組裝加工進口高於 2000 年的帶料加工進口。"}, "answer": "B", "expl": "Processing with inputs requires firms to spend capital; its much sharper rise than processing with assembly from 2000 to 2006 shows firms' capital limits eased in the 2000s.", "explZh": "「進料加工」需要企業投入資本；2000 至 2006 年間它的成長遠比「來料加工」劇烈，顯示企業資本不足的情況在 2000 年代獲得改善。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生聲稱，某位歷史學家將一位革命領袖視為國家象徵，更甚於一位務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且表現不一的執政紀錄更重要。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人在上任第一個月內簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用這張圖表來支持關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "圖表包含三個地區的資訊。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "有些農民種植蔬菜，而其他農民則種植穀物。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。天文學家聲稱，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "Some stars contain hydrogen and helium.", "C": "The method used to study stars requires a telescope.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "有些恆星含有氫和氦。", "C": "研究恆星所使用的方法需要望遠鏡。", "D": "有一顆岩石行星擁有稀薄的大氣層。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而來，而不是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有些歌曲使用的格律也見於較古老的歐洲詩歌中。", "C": "有數個國家的學者研究這項傳統。", "D": "有幾首民謠包含了當地歷史事件，以及在不同社群持續接觸之後所產生的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Quantitative Evidence: processing imports with inputs rose", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用來自文本、圖表、引文或研究的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "Both towns had some volunteers.", "D": "The program took place in a community."}, "optsZh": {"A": "表格包含不只一個年份。", "B": "與沒有實施該計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "兩個城鎮都有一些志工。", "D": "這項計畫是在一個社區中進行的。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "Narwhals are shy whales that live in the remote Arctic Ocean. Some of them have a long tusk, like a unicorn horn, with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensitive\" target=\"_blank\" rel=\"noopener\" data-w=\"sensitive\" data-pos=\"adj.\" data-en=\"delicate; easily affected\" data-zh=\"敏感的；細緻的\">sensitive<\/a> nerves. Narwhals are known for this tusk, but many actually don’t have one and its purpose is unknown. One group of scientists came up with a possible purpose in 2014. The scientists suggested that the tusk may help narwhals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> when water around them is likely to start freezing and become dangerous for them. Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Kristin Laidre disagrees with that idea, though. She reasons that if the narwhal’s tusk serves such an important purpose, then it’s most likely that _______", "bodyPlain": "Narwhals are shy whales that live in the remote Arctic Ocean. Some of them have a long tusk, like a unicorn horn, with sensitive nerves. Narwhals are known for this tusk, but many actually don’t have one and its purpose is unknown. One group of scientists came up with a possible purpose in 2014. The scientists suggested that the tusk may help narwhals determine when water around them is likely to start freezing and become dangerous for them. Marine biologist Kristin Laidre disagrees with that idea, though. She reasons that if the narwhal’s tusk serves such an important purpose, then it’s most likely that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一角鯨是生活在偏遠北極海域的害羞鯨魚。其中有些具有一根像獨角獸角一樣的長牙，上面布滿敏感的神經。一角鯨以這根長牙聞名，但其實許多一角鯨並沒有長牙，而長牙的用途也仍然不明。2014 年，一群科學家提出了一種可能的用途。這些科學家認為，長牙可能有助於一角鯨判斷周圍的海水何時可能開始結冰而對牠們構成危險。不過，海洋生物學家 Kristin Laidre 不同意這個看法。她推論，如果一角鯨的長牙具有如此重要的用途，那麼最有可能的是 _______", "opts": {"A": "some narwhals would seek a new habitat.", "B": "fewer marine animals would also have tusks.", "C": "more narwhals would have a tusk.", "D": "narwhals would become less shy over time."}, "optsZh": {"A": "有些獨角鯨會尋找新的棲息地。", "B": "其他海洋動物擁有長牙的會更少。", "C": "會有更多獨角鯨擁有長牙。", "D": "獨角鯨會隨時間變得較不害羞。"}, "answer": "C", "expl": "Laidre doubts the tusk has such a vital purpose because many narwhals lack one; if it were that important, more narwhals would have a tusk.", "explZh": "Laidre 懷疑長牙有如此重要的功能，因為許多獨角鯨並沒有長牙；如果真的那麼重要，應該會有更多獨角鯨長出長牙。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼的數千年前，就已與大陸族群分化；因此，研究人員推斷 ______", "opts": {"A": "the island populations were domesticated before mainland populations.", "B": "the plant probably reached the islands without human assistance.", "C": "all island plants descended from a single cultivated variety.", "D": "human traders must have transported the seeds recently."}, "optsZh": {"A": "島上族群比大陸族群更早被馴化。", "B": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "C": "所有島上的植物都源自單一栽培品種。", "D": "人類商人一定是最近才運送這些種子的。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久，就已從海岸族群中分化出來，因此研究團隊推論 ______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "the island beetles must be younger than the coastal beetles.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "humans carried the beetles to the island during early trade voyages."}, "optsZh": {"A": "這些甲蟲是被島上社群馴化的。", "B": "島上的甲蟲一定比沿海的甲蟲年輕。", "C": "這些甲蟲很可能是經由自然擴散而非人類引進的。", "D": "人類在早期貿易航行時把這些甲蟲帶到了島上。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島，但比較相關的口述傳統後發現，這首歌的核心詞句在遷徙發生之前就已形成。因此，語言學家推斷 ______", "opts": {"A": "the song could not have changed after the migration.", "B": "the migration must have begun earlier than any other human movement.", "C": "all versions of the song are identical.", "D": "the song was probably not introduced to the archipelago by that migration."}, "optsZh": {"A": "這首歌在遷徙之後不可能發生改變。", "B": "那次遷徙一定比其他任何人類遷移開始得更早。", "C": "這首歌的所有版本都完全相同。", "D": "這首歌很可能不是由那次遷徙傳入該群島的。"}, "answer": "D", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。研究某種偏遠島嶼作物的植物學家發現，島上的品種早在人類定居該島的數萬年前，就已與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "the crop was first domesticated on the island.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "人類定居可能並非這種植物最初抵達該島的原因。", "B": "大陸的農民從島上社群取得了這種作物。", "C": "這種作物最早是在島上被馴化的。", "D": "島上品種在基因上一定與大陸的野生植物完全相同。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: important tusk would be common", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separated\" target=\"_blank\" rel=\"noopener\" data-w=\"separated\" data-pos=\"v.\" data-en=\"kept apart or divided\" data-zh=\"分開；區隔\">separated<\/a> from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。研究人員原本認為，一種淡水螺是在人們開始於一連串湖泊之間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久就已彼此分離。因此，研究人員推斷 ______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "boats probably explain every modern snail population.", "C": "human activity made the populations genetically identical.", "D": "the snails likely spread through an earlier nonhuman mechanism."}, "optsZh": {"A": "在划船活動開始之前，這些湖泊中並沒有蝸牛。", "B": "船隻大概能解釋所有現代蝸牛族群的分布。", "C": "人類活動使這些族群在基因上完全相同。", "D": "這些蝸牛很可能是透過更早的非人為機制擴散的。"}, "answer": "D", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "To address the susceptibility of materials used in components of high-performance machinery, such as aircraft engines, to creep (deformation that is induced by persistent mechanical stress and that often occurs at <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevated\" target=\"_blank\" rel=\"noopener\" data-w=\"elevated\" data-pos=\"adj.\" data-en=\"raised above the ground or above the normal level\" data-zh=\"高架的；升高的\">elevated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>), materials researchers have developed silicon carbide (SiC) fibers for producing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=aerospace\" target=\"_blank\" rel=\"noopener\" data-w=\"aerospace\" data-pos=\"adj.\" data-en=\"relating to the science and industry of flight in air and space\" data-zh=\"航太的\">aerospace<\/a> composites. Testing the thermomechanical properties of several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercially<\/a> available SiC fibers, Ramakrishna T. Bhatt et al. found that in comparison with two polymer-derived SiC fibers, a nitrogen-treated SiC fiber exhibited a lower minimum creep rate, a measure of the rate at which a stress-exposed material deforms at a constant temperature and uniaxial load. The finding suggests that _______", "bodyPlain": "To address the susceptibility of materials used in components of high-performance machinery, such as aircraft engines, to creep (deformation that is induced by persistent mechanical stress and that often occurs at elevated temperatures), materials researchers have developed silicon carbide (SiC) fibers for producing aerospace composites. Testing the thermomechanical properties of several commercially available SiC fibers, Ramakrishna T. Bhatt et al. found that in comparison with two polymer-derived SiC fibers, a nitrogen-treated SiC fiber exhibited a lower minimum creep rate, a measure of the rate at which a stress-exposed material deforms at a constant temperature and uniaxial load. The finding suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "為了解決高效能機械（例如飛機引擎）零件所用材料容易發生潛變（由持續機械應力所引起、且常在高溫下發生的變形）的問題，材料研究人員開發出碳化矽（SiC）纖維，用於製造航太複合材料。Ramakrishna T. Bhatt 等人在測試數種市售 SiC 纖維的熱機械性質時發現，與兩種聚合物衍生的 SiC 纖維相比，一種經氮處理的 SiC 纖維表現出較低的最小潛變速率；最小潛變速率是衡量受應力材料在恆定溫度與單軸負載下變形速率的指標。這項發現顯示 _______", "opts": {"A": "unlike the two polymer-derived SiC fibers, the nitrogen-treated SiC fiber can substantially inhibit creep, provided that temperatures and loads are consistent.", "B": "the two polymer-derived SiC fibers likely hold similar potential for reducing the creep resistance of materials exposed to stress and elevated temperatures, thus prolonging the life span of aerospace machinery.", "C": "composites based on the two polymer-derived SiC fibers have chemical properties that may improve the mechanical and thermal stability of aerospace equipment to a greater extent than do composites based on the nitrogen-treated SiC fiber.", "D": "aerospace composites containing the nitrogen-treated SiC fiber may have the ability to withstand mechanical stress for a longer period of time than can aerospace composites containing either of the two polymer-derived SiC fibers."}, "optsZh": {"A": "與兩種聚合物衍生 SiC 纖維不同，只要溫度與負載保持一致，氮處理 SiC 纖維就能大幅抑制潛變。", "B": "兩種聚合物衍生 SiC 纖維在降低承受應力與高溫材料的抗潛變性方面可能具有相似潛力，從而延長航太機械的使用壽命。", "C": "以兩種聚合物衍生 SiC 纖維為基礎的複合材料，具有的化學特性可能比以氮處理 SiC 纖維為基礎的複合材料更能提升航太設備的機械與熱穩定性。", "D": "含有氮處理 SiC 纖維的航太複合材料，承受機械應力的時間可能比含有兩種聚合物衍生 SiC 纖維中任一種的航太複合材料更長。"}, "answer": "D", "expl": "A lower minimum creep rate means the nitrogen-treated fiber deforms more slowly under stress, so composites containing it may withstand stress longer than those with the other fibers.", "explZh": "較低的最小潛變速率表示經氮處理的纖維在應力下變形較慢，所以含此纖維的複合材料可能比含另外兩種纖維者更能長時間承受機械應力。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼的數千年前，就已與大陸族群分化；因此，研究人員推斷 ______", "opts": {"A": "the plant probably reached the islands without human assistance.", "B": "human traders must have transported the seeds recently.", "C": "all island plants descended from a single cultivated variety.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "B": "人類商人一定是最近才運送這些種子的。", "C": "所有島上的植物都源自單一栽培品種。", "D": "島上族群比大陸族群更早被馴化。"}, "answer": "A", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久，就已從海岸族群中分化出來，因此研究團隊推論 ______", "opts": {"A": "humans carried the beetles to the island during early trade voyages.", "B": "the island beetles must be younger than the coastal beetles.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "the beetles were domesticated by island communities."}, "optsZh": {"A": "人類在早期貿易航行時把這些甲蟲帶到了島上。", "B": "島上的甲蟲一定比沿海的甲蟲年輕。", "C": "這些甲蟲很可能是經由自然擴散而非人類引進的。", "D": "這些甲蟲是被島上社群馴化的。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: nitrogen-treated SiC resists creep", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島，但比較相關的口述傳統後發現，這首歌的核心詞句在遷徙發生之前就已形成。因此，語言學家推斷 ______", "opts": {"A": "all versions of the song are identical.", "B": "the song was
