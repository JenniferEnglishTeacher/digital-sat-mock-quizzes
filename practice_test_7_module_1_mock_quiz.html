later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "Featuring jagged peaks of black ink surrounded by hazy swirls of blue and green paint, Zhang Daqian’s 1983 painting Panorama of Mount Lu is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> of qinglü shanshui, a type of Chinese <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a> painting _______ by the use of blue and green hues to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=depict\" target=\"_blank\" rel=\"noopener\" data-w=\"depict\" data-pos=\"v.\" data-en=\"to show in a picture or describe\" data-zh=\"描繪\">depict<\/a> ethereal, otherworldly landscapes.", "bodyPlain": "Featuring jagged peaks of black ink surrounded by hazy swirls of blue and green paint, Zhang Daqian’s 1983 painting Panorama of Mount Lu is inspired by the tradition of qinglü shanshui, a type of Chinese landscape painting _______ by the use of blue and green hues to depict ethereal, otherworldly landscapes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "張大千 1983 年的畫作《Panorama of Mount Lu》以黑色水墨勾勒出參差的山峰，周圍環繞著朦朧的藍綠色顏料漩渦，其靈感來自青綠山水的傳統；青綠山水是一種中國山水畫，_______ 以藍色與綠色描繪空靈、超凡脫俗的景致。", "opts": {"A": "has been characterized", "B": "will be characterized", "C": "characterized", "D": "is characterized"}, "optsZh": {"A": "has been characterized（現在完成式限定動詞 → 造成句子結構錯誤，不能修飾名詞：錯誤）", "B": "will be characterized（未來式限定動詞 → 造成句子結構錯誤：錯誤）", "C": "characterized（以……為特徵；過去分詞作後位修飾語，修飾 painting：正確）", "D": "is characterized（限定動詞 → 造成句子結構錯誤，不能作名詞修飾語：錯誤）"}, "answer": "C", "expl": "'Characterized by the use of blue and green hues' is a participial phrase modifying 'painting'; a finite verb (is/has been/will be characterized) would create an ungrammatical second main verb.", "explZh": "「characterized by...」是修飾 painting 的分詞片語；若用 is/has been/will be characterized 等限定動詞，會多出一個主要動詞，造成句構錯誤。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's story's", "B": "peoples story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "people's stories（people 的所有格 + 複數名詞 stories：正確）", "D": "peoples stories（people 缺少所有格撇號 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "sheltered", "B": "shelters", "C": "would shelter", "D": "had sheltered"}, "optsZh": {"A": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "B": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "C": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "D": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively during", "C": "triumphed--decisively--during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "B": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "D": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "have been", "C": "is", "D": "are"}, "optsZh": {"A": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "B": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "C": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "D": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Grammar: reduced modifier characterized", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype, later,", "C": "prototype,", "D": "prototype;"}, "optsZh": {"A": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "prototype;（分號，正確連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "Increasing the heat on an uncovered boiling pot of water does not increase the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> of the water. What increases is the rate at which the water turns to _______ a pressure cooker pot, though, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=airtight\" target=\"_blank\" rel=\"noopener\" data-w=\"airtight\" data-pos=\"adj.\" data-en=\"not allowing air to get in or out\" data-zh=\"密閉的；不透氣的\">airtight<\/a> seal traps the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vapor\" target=\"_blank\" rel=\"noopener\" data-w=\"vapor\" data-pos=\"n.\" data-en=\"a gas formed from a liquid, such as steam\" data-zh=\"蒸氣\">vapor<\/a> in the pot, creating pressure that allows the temperature of the water to increase past its boiling point.", "bodyPlain": "Increasing the heat on an uncovered boiling pot of water does not increase the temperature of the water. What increases is the rate at which the water turns to _______ a pressure cooker pot, though, an airtight seal traps the vapor in the pot, creating pressure that allows the temperature of the water to increase past its boiling point.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "在沒有加蓋、正在沸騰的一鍋水下方加大火力，並不會提高水溫。增加的是水轉變為 _______ 的速率；不過在壓力鍋裡，密封的鍋蓋會把蒸氣鎖在鍋內，產生壓力，使水溫能升高到超過沸點。", "opts": {"A": "vapor. With", "B": "vapor with", "C": "vapor, with", "D": "vapor and with"}, "optsZh": {"A": "vapor. With（句號，分隔兩個獨立子句：正確）", "B": "vapor with（無標點 → 造成連寫句錯誤：錯誤）", "C": "vapor, with（只用逗號 → 造成逗號連接錯誤：錯誤）", "D": "vapor and with（用 and 連接 → 句子結構錯誤：錯誤）"}, "answer": "A", "expl": "'What increases is the rate at which the water turns to vapor' is a complete sentence; a new sentence must begin with 'With a pressure cooker pot, though,...'.", "explZh": "「What increases is the rate at which the water turns to vapor」已是完整句子，後面「With a pressure cooker pot, though, ...」要另起新句。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "peoples story's", "C": "people's story's", "D": "people's stories"}, "optsZh": {"A": "peoples stories（people 缺少所有格撇號 → 錯誤）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "D": "people's stories（people 的所有格 + 複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "sheltered", "B": "shelters", "C": "had sheltered", "D": "would shelter"}, "optsZh": {"A": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "B": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "C": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）", "D": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively. During", "B": "triumphed--decisively during", "C": "triumphed--decisively, during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "B": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）"}, "answer": "A", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "are", "C": "is", "D": "have been"}, "optsZh": {"A": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "B": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）", "C": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "D": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Grammar: sentence boundary before with", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype, later,", "C": "prototype;", "D": "prototype,"}, "optsZh": {"A": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "C": "prototype;（分號，正確連接兩個獨立子句：正確）", "D": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "Wanting to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrate<\/a> the 100th anniversary of the Alaska Purchase, _______ up with a motto that best captured the state’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unique\" target=\"_blank\" rel=\"noopener\" data-w=\"unique\" data-pos=\"adj.\" data-en=\"being the only one of its kind\" data-zh=\"獨特的\">unique<\/a> character. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commission\" target=\"_blank\" rel=\"noopener\" data-w=\"commission\" data-pos=\"v.\" data-en=\"to formally ask someone to create a piece of work\" data-zh=\"委託製作\">commission<\/a> selected “North to the Future,” submitted by Juneau journalist Richard Peter, as its winning entry.", "bodyPlain": "Wanting to celebrate the 100th anniversary of the Alaska Purchase, _______ up with a motto that best captured the state’s unique character. The commission selected “North to the Future,” submitted by Juneau journalist Richard Peter, as its winning entry.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "為了慶祝阿拉斯加購地案 100 週年，_______ 想出一句最能展現該州獨特性格的格言。委員會選出了由 Juneau 記者 Richard Peter 提交的「North to the Future」（邁向未來的北方）作為獲勝作品。", "opts": {"A": "a contest sponsored by the Alaska Centennial Commission would award $300 to an individual who came", "B": "an award of $300 would go to an individual in a contest sponsored by the Alaska Centennial Commission for coming", "C": "$300 would be awarded to an individual by the Alaska Centennial Commission in a contest for coming", "D": "the Alaska Centennial Commission sponsored a contest that would award $300 to an individual who came"}, "optsZh": {"A": "a contest sponsored by the Alaska Centennial Commission would award $300 to an individual who came（「比賽」緊接修飾語 → 比賽不會「想要慶祝」，懸垂修飾語：錯誤）", "B": "an award of $300 would go to an individual in a contest sponsored by the Alaska Centennial Commission for coming（「獎金」緊接修飾語 → 獎金不會「想要慶祝」，懸垂修飾語：錯誤）", "C": "$300 would be awarded to an individual by the Alaska Centennial Commission in a contest for coming（「三百美元」緊接修飾語 → 錢不會「想要慶祝」，懸垂修飾語：錯誤）", "D": "the Alaska Centennial Commission 贊助了一場比賽，將頒發 300 美元給想出……的個人（主詞 the Alaska Centennial Commission 緊接修飾語 Wanting to celebrate...，邏輯主詞正確：正確）"}, "answer": "D", "expl": "The introductory phrase 'Wanting to celebrate...' must modify someone who wants — the Alaska Centennial Commission, which the next sentence also names.", "explZh": "句首分詞片語「Wanting to celebrate...」必須修飾「想要慶祝」的人或機構，也就是 Alaska Centennial Commission（下一句也提到這個委員會）。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "people's story's", "C": "people's stories", "D": "peoples story's"}, "optsZh": {"A": "peoples stories（people 缺少所有格撇號 → 錯誤）", "B": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "C": "people's stories（people 的所有格 + 複數名詞 stories：正確）", "D": "peoples story's（所有格位置錯誤 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "had sheltered", "C": "sheltered", "D": "shelters"}, "optsZh": {"A": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "B": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）", "C": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）", "D": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）"}, "answer": "D", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively. During", "C": "triumphed--decisively, during", "D": "triumphed--decisively during"}, "optsZh": {"A": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "B": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）", "C": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "have been", "C": "is", "D": "are"}, "optsZh": {"A": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "B": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）", "C": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "D": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Grammar: modifier must point to Alaska Centennial Commission", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype;", "C": "prototype,", "D": "prototype, later,"}, "optsZh": {"A": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "prototype;（分號，正確連接兩個獨立子句：正確）", "C": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "B", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "Recently unearthed Neronian tools in France dating to 54,000 years ago and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to Homo sapiens may provide <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> between Neanderthals and modern humans occurred 10,000 years earlier than was previously _______ finding that, if true, would overturn current theories about H. sapiens <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a> during the Upper Paleolithic.", "bodyPlain": "Recently unearthed Neronian tools in France dating to 54,000 years ago and attributed to Homo sapiens may provide evidence that interactions between Neanderthals and modern humans occurred 10,000 years earlier than was previously _______ finding that, if true, would overturn current theories about H. sapiens migration during the Upper Paleolithic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "最近在法國出土、可追溯至 54,000 年前並被認為屬於智人的 Neronian 石器，可能證明尼安德塔人與現代人類之間的互動比先前 _______ 的早了一萬年；這項發現若屬實，將推翻目前關於舊石器時代晚期智人遷徙的理論。", "opts": {"A": "supposed; a", "B": "supposed. A", "C": "supposed a", "D": "supposed, a"}, "optsZh": {"A": "supposed; a（分號 → 後半部並非獨立子句：錯誤）", "B": "supposed. A（句號 → 後半部成為不完整句：錯誤）", "C": "supposed a（缺少標點 → 名詞同位語前未用逗號隔開：錯誤）", "D": "supposed, a（逗號，引出補充說明前句的名詞同位語：正確）"}, "answer": "D", "expl": "'A finding that ... would overturn current theories' is a noun phrase summarizing the preceding claim; it is joined to the sentence with a comma (a semicolon or period would leave it as a fragment).", "explZh": "「a finding that... would overturn current theories」是總結前文的名詞片語（同位語），應以逗號接在句子後；用分號或句號會使它成為不完整句。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。好幾本掛名知名運動員的回憶錄，其實是由合作者撰寫的，他們把他人的 ______ 整理成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples story's", "B": "people's story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "peoples story's（所有格位置錯誤 → 錯誤）", "B": "people's story's（stories 不需所有格 → 誤用所有格：錯誤）", "C": "people's stories（people 的所有格 + 複數名詞 stories：正確）", "D": "peoples stories（people 缺少所有格撇號 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "had sheltered", "B": "shelters", "C": "would shelter", "D": "sheltered"}, "optsZh": {"A": "had sheltered（過去完成式 → 與現在式 reduces 不一致：錯誤）", "B": "shelters（現在式單數動詞，與 reduces 平行、與主詞 the desert lizard 一致：正確）", "C": "would shelter（would + 原形動詞 → 與現在式 reduces 不平行：錯誤）", "D": "sheltered（過去式 → 與現在式 reduces 不平行：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively--during", "C": "triumphed--decisively, during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively during（未分隔兩個獨立子句 → 造成連寫句錯誤：錯誤）", "B": "triumphed--decisively--during（破折號無法正確分隔獨立子句 → 錯誤）", "C": "triumphed--decisively, during（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively. During（句號，將兩個獨立子句分成兩句：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。在從沉船中尋回的少數物品之中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "is", "B": "were", "C": "are", "D": "have been"}, "optsZh": {"A": "is（單數動詞 → 與倒裝句中的複數主詞 a brass compass, three ceramic bowls, and a leather-bound notebook 不一致：錯誤）", "B": "were（複數過去式動詞，與倒裝句中的複數主詞一致：正確）", "C": "are（是：現在式複數 → 時態與過去的發現不符，錯誤）", "D": "have been（現在完成式複數動詞 → 時態與敘述過去事件的語境不符：錯誤）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Grammar: period before appositive sentence", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她推出了一個能連續運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype later,", "C": "prototype, later,", "D": "prototype,"}, "optsZh": {"A": "prototype;（分號，正確連接兩個獨立子句：正確）", "B": "prototype later,（無標點連接兩個獨立子句 → 造成連寫句錯誤：錯誤）", "C": "prototype, later,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）", "D": "prototype,（只用逗號連接兩個獨立子句 → 造成逗號連接錯誤：錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "Guard cells are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> cells that are part of a plant’s pores. These cells help <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regulate\" target=\"_blank\" rel=\"noopener\" data-w=\"regulate\" data-pos=\"v.\" data-en=\"to control something so it works correctly\" data-zh=\"調節；控制\">regulate<\/a> the amount of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=carbon\" target=\"_blank\" rel=\"noopener\" data-w=\"carbon\" data-pos=\"n.\" data-en=\"a chemical element found in all living things\" data-zh=\"碳\">carbon<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dioxide\" target=\"_blank\" rel=\"noopener\" data-w=\"dioxide\" data-pos=\"n.\" data-en=\"a compound with two oxygen atoms (e.g., carbon dioxide)\" data-zh=\"二氧化物\">dioxide<\/a> a plant takes in. _______ they help regulate a plant’s water loss.", "bodyPlain": "Guard cells are specialized cells that are part of a plant’s pores. These cells help regulate the amount of carbon dioxide a plant takes in. _______ they help regulate a plant’s water loss.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "保衛細胞是構成植物氣孔一部分的特化細胞。這些細胞有助於調節植物吸收的二氧化碳量。_______ 它們也有助於調節植物的水分散失。", "opts": {"A": "Additionally,", "B": "Previously,", "C": "In conclusion,", "D": "Instead,"}, "optsZh": {"A": "Additionally,（此外：表補充另一項功能或資訊：正確）", "B": "Previously,（先前：表時間在前 → 錯誤）", "C": "In conclusion,（總之：表總結 → 錯誤）", "D": "Instead,（反而；取而代之：表替代 → 錯誤）"}, "answer": "A", "expl": "The second sentence adds another function of guard cells (regulating water loss) to the first (regulating CO2 intake), so 'Additionally' fits.", "explZh": "第二句在第一個功能（調節二氧化碳吸收）之外再補充另一個功能（調節水分散失），所以用「Additionally」。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transition: additionally adds guard-cell function", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Guard cells regulate carbon dioxide intake. _______ they limit water loss by opening and closing pores.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose
