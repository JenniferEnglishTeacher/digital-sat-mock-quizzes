<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 7, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 7, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "On the basis of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extensive\" target=\"_blank\" rel=\"noopener\" data-w=\"extensive\" data-pos=\"adj.\" data-en=\"covering a large area or amount\" data-zh=\"廣泛的；大面積的\">extensive<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculation\" target=\"_blank\" rel=\"noopener\" data-w=\"calculation\" data-pos=\"n.\" data-en=\"the process of working out an amount using numbers\" data-zh=\"計算\">calculations<\/a> and models, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomer\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomer\" data-pos=\"n.\" data-en=\"a scientist who studies stars and planets\" data-zh=\"天文學家\">astronomers<\/a> in the 1990s predicted that the collision of two neutron stars or a neutron star and a black hole could release a massive burst of gamma rays in an event called a kilonova. This _______ was confirmed with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> in 2017.", "bodyPlain": "On the basis of extensive calculations and models, astronomers in the 1990s predicted that the collision of two neutron stars or a neutron star and a black hole could release a massive burst of gamma rays in an event called a kilonova. This _______ was confirmed with observations in 2017.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "天文學家根據大量計算與模型，在 1990 年代預測：兩顆中子星，或一顆中子星與一個黑洞相撞時，可能會在一種稱為「千新星」的事件中釋放出大量伽瑪射線爆發。這項 _______ 在 2017 年經由觀測獲得證實。", "opts": {"A": "theory", "B": "evidence", "C": "constant", "D": "experiment"}, "optsZh": {"A": "theory（理論；推論）", "B": "evidence（證據）", "C": "constant（常數；恆定值）", "D": "experiment（實驗）"}, "answer": "A", "expl": "Astronomers 'predicted' the kilonova on the basis of calculations and models, and the prediction was later confirmed by observations, so it was a 'theory.'", "explZh": "天文學家根據計算與模型「預測」了千新星，之後才由觀測證實，所以是一個「theory」（理論）。", "defs": {"A": {"pos": "n.", "en": "an idea or explanation that is proposed to account for something", "zh": "理論；推論", "word": "theory"}, "B": {"pos": "n.", "en": "facts or signs that show something is true", "zh": "證據", "word": "evidence"}, "C": {"pos": "n.", "en": "a value or quantity that does not change", "zh": "常數；恆定值", "word": "constant"}, "D": {"pos": "n.", "en": "a scientific test done to learn or prove something", "zh": "實驗", "word": "experiment"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Astronomers proposed that a faint periodic dimming was caused by an exoplanet crossing a star; later telescope images confirmed the _______.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Astronomers proposed that a faint periodic dimming was caused by an exoplanet crossing a star; later telescope images confirmed the _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。天文學家提出，一種微弱的週期性變暗是由一顆系外行星從恆星前方經過所造成；後來的望遠鏡影像證實了這項 _______。", "opts": {"A": "sample", "B": "theory", "C": "constant", "D": "instrument"}, "optsZh": {"A": "sample（樣本）", "B": "theory（理論；推論）", "C": "constant（常數；恆定值）", "D": "instrument（儀器；工具）"}, "answer": "B", "expl": "The context requires an idea confirmed later.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a small part taken from something to study it", "zh": "樣本", "word": "sample"}, "B": {"pos": "n.", "en": "an idea or explanation that is proposed to account for something", "zh": "理論；推論", "word": "theory"}, "C": {"pos": "n.", "en": "a value or quantity that does not change", "zh": "常數；恆定值", "word": "constant"}, "D": {"pos": "n.", "en": "a tool or device used for measuring or scientific work", "zh": "儀器；工具", "word": "instrument"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> argued that a lost trade route crossed the desert; newly found caravan records <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or result is true\" data-zh=\"支持；證實\">supported<\/a> this _______.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The historian argued that a lost trade route crossed the desert; newly found caravan records supported this _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這位歷史學家主張，一條失落的貿易路線曾橫越沙漠；新發現的商隊紀錄支持了這項 _______。", "opts": {"A": "interval", "B": "measurement", "C": "hypothesis", "D": "artifact"}, "optsZh": {"A": "interval（間隔；區間）", "B": "measurement（測量；測量值）", "C": "hypothesis（假說；假設）", "D": "artifact（人工製品；文物）"}, "answer": "C", "expl": "Hypothesis means a proposed explanation.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a period of time or space between two things", "zh": "間隔；區間", "word": "interval"}, "B": {"pos": "n.", "en": "the size or amount found by measuring", "zh": "測量；測量值", "word": "measurement"}, "C": {"pos": "n.", "en": "an idea that is suggested as a possible explanation and then tested", "zh": "假說；假設", "word": "hypothesis"}, "D": {"pos": "n.", "en": "an object made by people, especially one of historical interest", "zh": "手工藝品；文物", "word": "artifact"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The biologist predicted that the frogs used chemical signals; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> tests confirmed the _______.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The biologist predicted that the frogs used chemical signals; laboratory tests confirmed the _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。這位生物學家預測這些青蛙會使用化學訊號；實驗室測試證實了這項 _______。", "opts": {"A": "habitat", "B": "specimen", "C": "prediction", "D": "boundary"}, "optsZh": {"A": "habitat（棲息地）", "B": "specimen（標本；樣本）", "C": "prediction（預測）", "D": "boundary（邊界；界線）"}, "answer": "C", "expl": "Prediction fits something later confirmed.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the natural home of an animal or plant", "zh": "棲息地", "word": "habitat"}, "B": {"pos": "n.", "en": "an example of a plant, animal, etc. kept for study", "zh": "標本；樣本", "word": "specimen"}, "C": {"pos": "n.", "en": "a statement about what will happen or is true before it is checked", "zh": "預測", "word": "prediction"}, "D": {"pos": "n.", "en": "a line that marks the edge of an area", "zh": "邊界；界線", "word": "boundary"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A model suggested that the glacier once advanced much farther south; sediment samples later verified the _______.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A model suggested that the glacier once advanced much farther south; sediment samples later verified the _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一個模型顯示這座冰河曾經向南推進得遠得多；沉積物樣本後來驗證了這項 _______。", "opts": {"A": "claim", "B": "temperature", "C": "survey", "D": "exception"}, "optsZh": {"A": "claim（主張；說法）", "B": "temperature（溫度）", "C": "survey（調查）", "D": "exception（例外）"}, "answer": "A", "expl": "Claim means the proposed idea.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a statement that something is true", "zh": "主張；說法", "word": "claim"}, "B": {"pos": "n.", "en": "how hot or cold something is", "zh": "溫度", "word": "temperature"}, "C": {"pos": "n.", "en": "a set of questions asked to gather information", "zh": "調查", "word": "survey"}, "D": {"pos": "n.", "en": "something that does not follow the usual rule", "zh": "例外", "word": "exception"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: theory confirmed by observations", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察 一片真正的仙境。", "opts": {"A": "Simple", "B": "Understandable", "C": "Obvious", "D": "Transparent"}, "optsZh": {"A": "Simple（簡單的）", "B": "Understandable（可理解的）", "C": "Obvious（明顯的）", "D": "Transparent（透明的）"}, "answer": "D", "expl": "The water was so clear it was 'almost invisible,' so 'clear' means 'transparent' (easy to see through).", "explZh": "水清澈到「幾乎看不見」，所以 clear 在此指「Transparent」（透明的）。", "defs": {"A": {"pos": "adj.", "en": "easy to understand; not complicated", "zh": "簡單的", "word": "Simple"}, "B": {"pos": "adj.", "en": "able to be understood easily", "zh": "可理解的；易懂的", "word": "Understandable"}, "C": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的", "word": "Obvious"}, "D": {"pos": "adj.", "en": "clear enough to see through", "zh": "透明的；清澈的", "word": "Transparent"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: clear means transparent", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\ ogical"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: clear means transparent", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The water in the spring was _______ , revealing tiny fish moving over pale sand.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The water in the spring was _______ , revealing tiny fish moving over pale sand.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。泉水 _______，可以看見小魚在淺色沙地上游動。", "opts": {"A": "limpid", "B": "simple", "C": "familiar", "D": "evident"}, "optsZh": {"A": "limpid（清澈的；透明的）", "B": "simple（簡單的）", "C": "familiar（熟悉的）", "D": "evident（明顯的；顯而易見的）"}, "answer": "A", "expl": "Limpid means clear.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "completely clear and easy to see through", "zh": "清澈的；透明的", "word": "limpid"}, "B": {"pos": "adj.", "en": "easy to understand; not complicated", "zh": "簡單的", "word": "simple"}, "C": {"pos": "adj.", "en": "well known because seen or heard often", "zh": "熟悉的", "word": "familiar"}, "D": {"pos": "adj.", "en": "clearly seen or understood", "zh": "明顯的；顯而易見的", "word": "evident"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: rectify a lack of financial services", "vocab": true, "body": "At the turn of the twentieth century, Black <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a> of Richmond, Virginia, had few formal options for banking and other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=financial\" target=\"_blank\" rel=\"noopener\" data-w=\"financial\" data-pos=\"adj.\" data-en=\"relating to money\" data-zh=\"財務的；金融的\">financ ifferent sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The field reports did not _______ the laboratory results, leaving researchers unsure which data set was reliable.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。實地報告並未 _______ 實驗室的結果，讓研究人員不確定哪一組資料才可靠。", "opts": {"A": "avoid", "B": "apply", "C": "support", "D": "publish"}, "optsZh": {"A": "avoid（避免）", "B": "apply（應用；適用）", "C": "support（支持；證實）", "D": "publish（發表；出版）"}, "answer": "C", "expl": "Support means corroborate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "B": {"pos": "v.", "en": "to use something in a particular situation", "zh": "應用；運用", "word": "apply"}, "C": {"pos": "v.", "en": "to show that an idea or result is true", "zh": "支持；證實", "word": "support"}, "D": {"pos": "v.", "en": "to make information available to the public", "zh": "發表；出版", "word": "publish"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: corroborate real-world conclusions", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=simple\" target=\"_blank\" rel=\"noopener\" data-w=\"simple\" data-pos=\"adj.\" data-en=\"easy to understand; not complicated\" data-zh=\"簡單的\">simple<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Additional interviews helped _______ the journalist’s account of events.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Additional interviews helped _______ the journalist’s account of events.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。額外的訪談有助於 _______ 這位記者對事件的描述。", "opts": {"A": "confirm", "B": "implement", "C": "circumvent", "D": "distribute"}, "optsZh": {"A": "confirm（證實；確認）", "B": "implement（實施；執行）", "C": "circumvent（規避；繞過）", "D": "distribute（分發；分配）"}, "answer": "A", "expl": "Confirm means corroborate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show that something is true or correct", "zh": "證實；確認", "word": "confirm"}, "B": {"pos": "v.", "en": "to put a plan or decision into action", "zh": "實施；執行", "word": "implement"}, "C": {"pos": "v.", "en": "to find a way around a rule or obstacle", "zh": "規避；繞過", "word": "circumvent"}, "D": {"pos": "v.", "en": "to give or share out among many people", "zh": "分發；分配", "word": "distribute"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: corroborate real-world conclusions", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new fossil evidence may _______ the theory that the species migrated by island chains.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new fossil evidence may _______ the theory that the species migrated by island chains.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。新的化石證據可能會 _______ 該物種沿著島鏈遷徙的理論。", "opts": {"A": "perform", "B": "evade", "C": "announce", "D": "substantiate"}, "optsZh": {"A": "perform（執行；表演）", "B": "evade（逃避；規避）", "C": "announce（宣布）", "D": "substantiate（證實；證明）"}, "answer": "D", "expl": "Substantiate means support with evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to do or carry out an action", "zh": "執行；表演", "word": "perform"}, "B": {"pos": "v.", "en": "to avoid or escape from something", "zh": "逃避；規避", "word": "evade"}, "C": {"pos": "v.", "en": "to tell people something officially", "zh": "宣布", "word": "announce"}, "D": {"pos": "v.", "en": "to provide evidence that proves something", "zh": "證實；證明", "word": "substantiate"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: corroborate real-world conclusions", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. The survey failed to _______ the committee’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumption\" target=\"_blank\" rel=\"noopener\" data-w=\"assumption\" data-pos=\"n.\" data-en=\"something accepted as true without proof\" data-zh=\"假設；假定\">assumption<\/a> that commuters preferred longer routes with fewer transfers.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The survey failed to _______ the committee’s assumption that commuters preferred longer routes with fewer transfers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這項調查未能 _______ 委員會的假設，即通勤者偏好轉乘次數較少但路線較長的路線。", "opts": {"A": "avoid", "B": "validate", "C": "apply", "D": "spread"}, "optsZh": {"A": "avoid（避免）", "B": "validate（證實；確認）", "C": "apply（應用；適用）", "D": "spread（散布；傳播）"}, "answer": "B", "expl": "Validate means corroborate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "B": {"pos": "v.", "en": "to show that something is true or correct", "zh": "證實；確認", "word": "validate"}, "C": {"pos": "v.", "en": "to use something in a particular situation", "zh": "應用；運用", "word": "apply"}, "D": {"pos": "v.", "en": "to cause to reach a wider area or more people", "zh": "散布；傳播", "word": "spread"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: corroborate real-world conclusions", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. To _______ the witness’s statement, investigators compared it with security-camera footage.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. To _______ the witness’s statement, investigators compared it with security-camera footage.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。為了 _______ 證人的證詞，調查人員將其與監視器畫面進行比對。", "opts": {"A": "bypass", "B": "execute", "C": "verify", "D": "circulate"}, "optsZh": {"A": "bypass（繞過；規避）", "B": "execute（執行；實施）", "C": "verify（核實；查證）", "D": "circulate（流通；傳播）"}, "answer": "C", "expl": "Verify means corroborate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to go around something to avoid it", "zh": "繞過；略過", "word": "bypass"}, "B": {"pos": "v.", "en": "to carry out a plan or action", "zh": "執行；實施", "word": "execute"}, "C": {"pos": "v.", "en": "to check that something is true", "zh": "核實；查證", "word": "verify"}, "D": {"pos": "v.", "en": "to pass from person to person", "zh": "流通；傳播", "word": "circulate"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "Diadromous fish migrate between freshwater and marine biomes during their life cycle. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>’s obligate nature is why diadromous fish can be _______ those that are merely euryhaline (able to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tolerate\" target=\"_blank\" rel=\"noopener\" data-w=\"tolerate\" data-pos=\"v.\" data-en=\"to accept something unpleasant without complaint\" data-zh=\"容忍\">tolerate<\/a> high <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=salinity\" target=\"_blank\" rel=\"noopener\" data-w=\"salinity\" data-pos=\"n.\" data-en=\"the amount of salt in water\" data-zh=\"鹽度\">salinity<\/a>): the euryhaline blackchin tilapia can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> high salinity, but its life cycle does not involve relocation to a different biome, as does that of the diadromous wild salmon.", "bodyPlain": "Diadromous fish migrate between freshwater and marine biomes during their life cycle. The migration’s obligate nature is why diadromous fish can be _______ those that are merely euryhaline (able to tolerate high salinity): the euryhaline blackchin tilapia can survive high salinity, but its life cycle does not involve relocation to a different biome, as does that of the diadromous wild salmon.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "洄游性魚類在其生命週期中會在淡水與海洋生物群系之間遷徙。這種遷徙具有必然性，正是因為如此，洄游性魚類才能與那些僅僅是廣鹽性（能耐受高鹽度）的魚類 _______：廣鹽性的黑頜吳郭魚能在高鹽度中存活，但牠的生命週期並不涉及遷移到不同的生物群系，而洄游性的野生鮭魚則會。", "opts": {"A": "demarcated from", "B": "reconstituted as", "C": "conflated with", "D": "derived from"}, "optsZh": {"A": "demarcated from（與……區分開來；劃清界線）", "B": "reconstituted as（被重組為……）", "C": "conflated with（與……混為一談）", "D": "derived from（源自……；由……衍生）"}, "answer": "A", "expl": "The obligate migration is what separates diadromous fish from merely euryhaline fish (tilapia vs. salmon), so they can be 'demarcated from' (distinguished from) them.", "explZh": "必須遷徙的特性正是溯降河洄游魚類與僅耐鹽魚類的區別（吳郭魚與鮭魚的例子），所以可以把前者與後者「demarcated from」（區分開來）。", "defs": {"A": {"pos": "v. phr.", "en": "clearly separated or set apart from", "zh": "與……區分開來；與……劃清界線", "word": "demarcated from"}, "B": {"pos": "v. phr.", "en": "formed again in a different way as", "zh": "被重組為……", "word": "reconstituted as"}, "C": {"pos": "v. phr.", "en": "wrongly treated as the same as", "zh": "與……混為一談", "word": "conflated with"}, "D": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The border stones clearly _______ private farmland from public forest.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The border stones clearly _______ private farmland from public forest.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這些界石清楚地將私人農地與公有森林 _______。", "opts": {"A": "distinguish", "B": "confuse", "C": "rebuild", "D": "derive"}, "optsZh": {"A": "distinguish（區分；區別）", "B": "confuse（混淆）", "C": "rebuild（重建）", "D": "derive（衍生；源自）"}, "answer": "A", "expl": "Distinguish means demarcate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show or recognize a difference between things", "zh": "區分；區別", "word": "distinguish"}, "B": {"pos": "v.", "en": "to mistake one thing for another", "zh": "混淆", "word": "confuse"}, "C": {"pos": "v.", "en": "to build something again", "zh": "重建", "word": "rebuild"}, "D": {"pos": "v.", "en": "to get or develop something from a source", "zh": "衍生；源自", "word": "derive"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The study carefully _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migratory\" target=\"_blank\" rel=\"noopener\" data-w=\"migratory\" data-pos=\"adj.\" data-en=\"moving from one region to another seasonally\" data-zh=\"遷徙的\">migratory<\/a> birds from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> that merely wander short distances.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The study carefully _______ migratory birds from species that merely wander short distances.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這項研究仔細地將候鳥與僅在短距離內遊蕩的物種 _______。", "opts": {"A": "reclassified", "B": "combined", "C": "derived", "D": "separated"}, "optsZh": {"A": "reclassified（重新分類）", "B": "combined（結合；合併）", "C": "derived（衍生；源自）", "D": "separated（分開；區隔）"}, "answer": "D", "expl": "Separated means demarcated from.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "put into a different category", "zh": "重新分類", "word": "reclassified"}, "B": {"pos": "v.", "en": "joined or mixed together", "zh": "結合；合併", "word": "combined"}, "C": {"pos": "v.", "en": "obtained or developed from a source", "zh": "衍生；源自", "word": "derived"}, "D": {"pos": "v.", "en": "kept apart or divided", "zh": "分開；區隔", "word": "separated"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new definition _______ temporary residents from permanent citizens.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new definition _______ temporary residents from permanent citizens.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的訪客看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。新的定義將暫時居民與永久公民 _______。", "opts": {"A": "rebuilt", "B": "copied", "C": "differentiated", "D": "merged"}, "optsZh": {"A": "rebuilt（重建）", "B": "copied（複製；模仿）", "C": "differentiated（區分；區別）", "D": "merged（合併；融合）"}, "answer": "C", "expl": "Differentiated means distinguished.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "built again", "zh": "重建", "word": "rebuilt"}, "B": {"pos": "v.", "en": "made something the same as something else", "zh": "複製；模仿", "word": "copied"}, "C": {"pos": "v.", "en": "showed or made a difference between", "zh": "區分；區別", "word": "differentiated"}, "D": {"pos": "v.", "en": "joined together into one", "zh": "合併；融合", "word": "merged"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the usual rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A narrow channel _______ the island from the mainland marsh.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A narrow channel _______ the island from the mainland marsh.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外，也有大致的模式，研究人員選擇審慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一條狹窄的水道將這座島與大陸的沼澤 _______。", "opts": {"A": "originated", "B": "separated", "C": "confused", "D": "recreated"}, "optsZh": {"A": "originated（起源；發源）", "B": "separated（分開；區隔）", "C": "confused（混淆）", "D": "recreated（重新創造；重現）"}, "answer": "B", "expl": "Separated marks a boundary.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "began or came from", "zh": "起源；發源", "word": "originated"}, "B": {"pos": "v.", "en": "kept apart or divided", "zh": "分開；區隔", "word": "separated"}, "C": {"pos": "v.", "en": "mistook one thing for another", "zh": "混淆", "word": "confused"}, "D": {"pos": "v.", "en": "made again", "zh": "重新創造；重現", "word": "recreated"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: demarcated from related category", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The policy _______ research assistants from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> investigators by specifying who could design <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"n.\" data-en=\"a scientific test done to learn or prove something\" data-zh=\"實驗\">experiments<\/a>.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The policy _______ research assistants from independent investigators by specifying who could design experiments.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍加改變的條件下進行了更多試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是單一一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出結論，而這個結論必須陳述得既精確又有所節制。這項政策藉由明定誰可以設計實驗，將研究助理與獨立研究人員 _______。", "opts": {"A": "converted", "B": "distinguished", "C": "combined", "D": "derived"}, "optsZh": {"A": "converted（轉變；轉換）", "B": "distinguished（區分；區別）", "C": "combined（結合；合併）", "D": "derived（衍生；源自）"}, "answer": "B", "expl": "Distinguished means demarcated.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "changed into a different form", "zh": "轉變；轉換", "word": "converted"}, "B": {"pos": "v.", "en": "recognized or showed the difference between", "zh": "區分；區別", "word": "distinguished"}, "C": {"pos": "v.", "en": "joined or mixed together", "zh": "結合；合併", "word": "combined"}, "D": {"pos": "v.", "en": "obtained or developed from a source", "zh": "衍生；源自", "word": "derived"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Text Function: fire as comfort beyond warmth", "vocab": false, "body": "The following text is from Joan Didion’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoir<\/a> The Year of Magical Thinking. In the text, the author discusses her home life.<br><br>[I]n California we <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=heated\" target=\"_blank\" rel=\"noopener\" data-w=\"heated\" data-pos=\"adj.\" data-en=\"(of a discussion) full of strong feeling or anger\" data-zh=\"激烈的\">heated<\/a> our houses by building fires. We built fires even on summer evenings, because the fog came in. <u>Fires said we were home, we had drawn the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circle\" target=\"_blank\" rel=\"noopener\" data-w=\"circle\" data-pos=\"n.\" data-en=\"a round shape; a group of people close to one another\" data-zh=\"圓圈；圈子\">circle<\/a>, we were safe through the night.<\/u>", "bodyPlain": "The following text is from Joan Didion’s memoir The Year of Magical Thinking. In the text, the author discusses her home life.\n\n[I]n California we heated our houses by building fires. We built fires even on summer evenings, because the fog came in. Fires said we were home, we had drawn the circle, we were safe through the night.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "以下文字出自 Joan Didion 的回憶錄《The Year of Magical Thinking》。在這段文字中，作者談到了她的家庭生活。\n在加州，我們靠生火來為房子取暖。即使在夏日傍晚我們也會生火，因為霧氣會飄進來。火說明了我們在家，我們已畫好了那個圓，我們整夜都會安全。", "opts": {"A": "It illustrates that a fire provides comfort beyond physical warmth.", "B": "It summarizes the information that came before it in the text.", "C": "It explains that the house remains cold even in summer.", "D": "It suggests that the author feels comfortable in her home with or without a fire."}, "optsZh": {"A": "它說明了火爐提供的慰藉不只是身體上的溫暖。", "B": "它總結了文中前面提到的資訊。", "C": "它說明這棟房子即使在夏天也依然寒冷。", "D": "它暗示作者無論有沒有生火，在家中都感到自在。"}, "answer": "A", "expl": "'Fires said we were home ... we were safe' shows that fire meant security and belonging, comfort beyond the physical warmth mentioned earlier.", "explZh": "「爐火代表我們在家……我們是安全的」顯示爐火象徵安全感與歸屬感，是超越前文所說身體溫暖的慰藉。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Text Function: fire as comfort beyond warmth", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function or main purpose of the text?", "stemZh": "哪一個選項最能描述本文的功能或主要目的？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述了一項研究，該研究測試雷達能否解決這個問題，但發現訊號無法穿透得夠深。", "opts": {"A": "It describes how other researchers criticized the work.", "B": "It identifies the uncertainty that motivated the study.", "C": "It states the study's final conclusion.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它描述其他研究人員如何批評這項研究。", "B": "它指出了促成這項研究的不確定之處。", "C": "它陳述了這項研究的最終結論。", "D": "它提供證據證明雷達總是可靠的。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Text Function: fire as comfort beyond warmth", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function or main purpose of the text?", "stemZh": "哪一個選項最能描述本文的功能或主要目的？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一篇考古學文章開頭指出，某個聚落顯然曾與遙遠地區進行貿易。下一句說明，這項交流所使用的路線至今仍不明，因為附近的道路幾乎沒有留下任何實體痕跡。文章接著討論一個團隊，他們在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It summarizes the team's strongest result.", "B": "It shifts the discussion away from archaeology.", "C": "It contradicts the claim made in the first sentence.", "D": "It defines the problem the later investigation attempts to address."}, "optsZh": {"A": "它總結了研究團隊最有力的結果。", "B": "它將討論焦點從考古學轉移開來。", "C": "它反駁了第一句中提出的主張。", "D": "它界定了後續研究試圖解決的問題。"}, "answer": "D", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Text Function: fire as comfort beyond warmth", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"n.\" data-en=\"a scientific test done to learn or prove something\" data-zh=\"實驗\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function or main purpose of the text?", "stemZh": "哪一個選項最能描述本文的功能或主要目的？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是有根據的。一篇生物學文章指出，某種植物能在長期乾旱中存活。接下來的句子說明，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It gives a historical overview of plant classification.", "B": "It proves that drought has no effect on plants.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It lists the materials used in the experiment."}, "optsZh": {"A": "它概述了植物分類的歷史。", "B": "它證明乾旱對植物毫無影響。", "C": "它引出了這項實驗所探討的知識缺口。", "D": "它列出了實驗中使用的材料。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Text Function: fire as comfort beyond warmth", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to show or recognize a difference between things\" data-zh=\"區分；區別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-tradition
